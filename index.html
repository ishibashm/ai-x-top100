<style>
  :root {
    --bg: #0b0d12;
    --card: #161a22;
    --card-h: #1c2230;
    --border: #2a3140;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --dim: #5c6578;
    --rank: #9eb0d0;
    --metric: #7dd3a8;
    --empty: #1a1e27;

    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --header-h: 42px;
    --gap: 4px;
    --pad: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100dvh;
    width: 100vw;
    max-width: 1366px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: var(--header-h) 1fr;
    padding:
      calc(var(--pad) + var(--safe-top))
      calc(var(--pad) + var(--safe-right))
      calc(var(--pad) + var(--safe-bottom))
      calc(var(--pad) + var(--safe-left));
    gap: var(--gap);
    overflow: hidden;
  }
  header.app-header {
    height: var(--header-h);
    min-height: 36px;
    max-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 8px;
    background: linear-gradient(180deg, #141822 0%, #10141c 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .title-block { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .updated { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .count-pill {
    font-size: 12px; font-weight: 600; color: #c9d4ea;
    background: #1e2636; border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .count-pill.incomplete { color: #f0c674; border-color: #5a4a28; background: #2a2418; }

  #board {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(10, minmax(0, 1fr));
    gap: var(--gap);
    min-height: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  .cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 2px;
    min-height: 0;
    min-width: 0;
    padding: 4px 5px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .cell:hover, .cell:focus-visible {
    background: var(--card-h);
    border-color: #3d4a63;
    outline: none;
  }
  .cell:active { transform: scale(0.98); }
  .cell.empty {
    background: var(--empty);
    border-style: dashed;
    border-color: #252b38;
    cursor: default;
    pointer-events: none;
  }
  .cell.empty:active { transform: none; }

  .rank {
    font-size: 11px; font-weight: 700; color: var(--rank);
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .handle {
    font-size: 10px; font-weight: 600; color: var(--text);
    line-height: 1.15; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .metric {
    font-size: 9px; font-weight: 500; color: var(--metric);
    line-height: 1.1; opacity: 0.95;
  }
  .placeholder { font-size: 14px; color: var(--dim); width: 100%; text-align: center; }

  @media (orientation: landscape) and (min-width: 1100px) {
    :root { --header-h: 40px; --gap: 5px; --pad: 8px; }
    .title { font-size: 16px; }
    .rank { font-size: 12px; }
    .handle { font-size: 11px; }
    .metric { font-size: 10px; }
  }
  @media (orientation: portrait) {
    :root { --header-h: 44px; --gap: 4px; }
    .rank { font-size: 11px; }
    .handle { font-size: 9.5px; }
    .metric { font-size: 9px; }
  }
  @media (max-height: 900px) {
    .rank { font-size: 10px; }
    .handle { font-size: 9px; }
    .metric { font-size: 8px; }
  }
</style>

  <script>
  (function () {
    const TARGET = 100;
    const data = window.AI_X_TOP100 || { posts: [], seeded: 0, target: TARGET, updated_label: "" };
    const posts = Array.isArray(data.posts) ? data.posts.slice() : [];
    const seeded = data.seeded != null ? data.seeded : posts.length;
    document.getElementById("updatedLabel").textContent = data.updated_label || "";

    const pill = document.getElementById("countPill");
    if (seeded >= TARGET) {
      pill.textContent = "Top 100";
      pill.classList.remove("incomplete");
    } else {
      pill.textContent = "収集中: " + seeded + "/" + TARGET;
      pill.classList.add("incomplete");
    }

    const byRank = new Map();
    for (const p of posts) {
      if (p && p.rank != null) byRank.set(Number(p.rank), p);
    }

    function metricLabel(p) {
      if (p.metric) return p.metric + "👁";
      if (p.views != null) {
        const v = p.views;
        let s;
        if (v >= 1e6) {
          const x = v / 1e6;
          s = (x >= 10 ? Math.round(x) : Math.round(x * 10) / 10) + "M";
        } else if (v >= 1e3) {
          s = Math.round(v / 1e3) + "K";
        } else s = String(v);
        return s + "👁";
      }
      if (p.likes != null) {
        const l = p.likes;
        return (l >= 1e3 ? Math.round(l / 1e3) + "K" : String(l)) + "♥";
      }
      return "";
    }

    const board = document.getElementById("board");
    const frag = document.createDocumentFragment();

    for (let i = 1; i <= TARGET; i++) {
      const post = byRank.get(i) || null;
      if (!post || !post.url) {
        const empty = document.createElement("div");
        empty.className = "cell empty";
        empty.setAttribute("role", "listitem");
        empty.setAttribute("aria-label", "空き枠 " + i);
        empty.innerHTML =
          '<span class="rank">' + i + "</span>" +
          '<span class="placeholder" aria-hidden="true">—</span>';
        frag.appendChild(empty);
        continue;
      }

      const a = document.createElement("a");
      a.className = "cell";
      a.href = post.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("role", "listitem");
      const handle = String(post.handle || "").replace(/^@/, "");
      a.setAttribute("aria-label", i + "位 @" + handle);
      a.title = "@" + handle + (post.snippet ? " — " + post.snippet : "");

      const m = metricLabel(post);
      a.innerHTML =
        '<span class="rank">#' + i + "</span>" +
        '<span class="handle">@' + handle + "</span>" +
        (m ? '<span class="metric">' + m + "</span>" : "");
      frag.appendChild(a);
    }

    board.appendChild(frag);
  })();
  </script>
