<title>AI情報 Top 100</title>
<style>
:root {
  --bg:#0b0d12; --card:#151a22; --card-h:#1c2330; --line:#2a3140;
  --text:#eef2fa; --muted:#8b93a7; --rank:#9eb0d0; --accent:#7dd3a8;
  --h:48px; --gap:6px; --pad:8px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{
  height:100dvh;width:100vw;max-width:1366px;margin:0 auto;display:grid;
  grid-template-rows:var(--h) 1fr;
  padding:calc(var(--pad)+var(--st)) calc(var(--pad)+var(--sr)) calc(var(--pad)+var(--sb)) calc(var(--pad)+var(--sl));
  gap:var(--gap);overflow:hidden;
}
header{
  height:var(--h);display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 10px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,#141822,#10141c);min-width:0;
}
.left{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto}
h1{font-size:15px;font-weight:800;white-space:nowrap}
.date{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.seg{
  display:inline-flex;align-items:center;padding:2px;border-radius:999px;
  border:1px solid var(--line);background:#121722;gap:2px;
}
.seg button{
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;
  color:var(--muted);background:transparent;border-radius:999px;padding:7px 12px;line-height:1;
  min-height:32px;
}
.seg button.active{color:#0b0d12;background:var(--accent)}
.seg.pages button{min-width:72px}
.pill{font-size:12px;font-weight:700;color:#d5def0;background:#1e2636;border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
#board{
  min-height:0;height:100%;overflow:hidden;touch-action:pan-y;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));
  gap:var(--gap);
}
.card{
  min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:5px;padding:7px 8px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
}
.card:hover,.card:focus-visible{background:var(--card-h);border-color:#3d4a63;outline:none}
.top{display:flex;align-items:center;gap:6px;min-width:0}
.rank{font-size:11px;font-weight:800;color:var(--rank);font-variant-numeric:tabular-nums;flex:0 0 auto}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#243044;flex:0 0 auto}
.fallback{width:28px;height:28px;border-radius:50%;background:#2a3348;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.who{min-width:0;flex:1 1 auto}
.name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric{font-size:10px;font-weight:700;color:var(--accent);white-space:nowrap;flex:0 0 auto}
.copy{display:flex;gap:6px;align-items:flex-start;min-height:0;flex:1 1 auto;overflow:hidden}
.snippet{flex:1 1 auto;min-width:0;font-size:10px;line-height:1.28;color:#c8d0e2;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#222;flex:0 0 auto;border:1px solid rgba(255,255,255,.1)}
@media (orientation:portrait){
  :root{--h:52px;--gap:5px}
  .thumb{width:38px;height:38px}
  h1{font-size:14px}
  .seg button{padding:7px 10px;font-size:11px}
}
@media (max-height:900px){
  .snippet{font-size:9px}
  .name{font-size:10px}
  .avatar,.fallback{width:24px;height:24px}
  .thumb{width:34px;height:34px}
}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}
:root[data-theme="light"] header{background:linear-gradient(180deg,#ffffff,#f0f3f8)}
:root[data-theme="light"] .seg,:root[data-theme="light"] button,:root[data-theme="light"] select,:root[data-theme="light"] input{background:#fff;color:var(--text)}
:root[data-theme="light"] .seg button{background:transparent;color:var(--muted)}
:root[data-theme="light"] .seg button.active,:root[data-theme="light"] button.active{background:var(--accent);color:#fff}
:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}
:root[data-theme="light"] .fallback,:root[data-theme="light"] .avatar{background:#dde3ee}
:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.seg button,.seg.pages button{min-height:40px}
.foryou-link{color:var(--accent);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
</style>
</head>

le_images/1970182748146180096/dhZeXi_X_200x200.jpg","media":"https://pbs.twimg.com/media/HUh-lkQaIAAFjtJ.png","text":"Origin, Cursor’s code hosting platform, now supports over 20 integrations.\n\nConnect your repos to tools for CI, deployments, code review, security, monitoring, and project management.","snippet_ja":"Cursorのコードホスティング基盤Originが20以上の連携に対応。CI、デプロイ、コードレビュー、セキュリティ、監視ツールと接続可能。"},{"rank":64,"handle":"satyanadella","url":"https://x.com/satyanadella/status/2111204941801128366","id":"2111204941801128366","views":175390,"likes":2202,"metric":"175K","category":"研究所","snippet":"In @Nature this week, our new research shows how machine learning can improve weather forecasts two to six weeks out, a timeframe that's his…","name":"Satya Nadella","avatar":"https://pbs.twimg.com/profile_images/1221837516816306177/_Ld4un5A_200x200.jpg","media":null,"text":"In @Nature this week, our new research shows how machine learning can improve weather forecasts two to six weeks out, a timeframe that's historically been very difficult to predict.\n\nIt's exciting to see the potential of this work to help us better prepare for extreme weather,","snippet_ja":"今週のNatureで、機械学習により2〜6週間先の天気予報の精度を高められることを示す研究を発表…"},{"rank":65,"handle":"DavidSacks","url":"https://x.com/DavidSacks/status/2110396477583266292","id":"2110396477583266292","views":168371,"likes":1693,"metric":"168K","category":"評価","snippet":"Are Small Models Really a Threat? The Anthropic Fear Factory just released a new report warning that small models may be only months away fr…","name":"David Sacks","avatar":"https://pbs.twimg.com/profile_images/1879600809693917185/GkBxdTd9_200x200.jpg","media":"https://pbs.twimg.com/media/HUmiaVQXIAAWPE1.jpg","text":"Are Small Models Really a Threat?\n\nThe Anthropic Fear Factory just released a new report warning that small models may be only months away from self-replicating across cheap IoT devices like off-brand Android TV boxes and smart ovens. They say such an AI worm would be hard to shut down since there’s no central kill switch.\n\nWe’ve gone from “The Terminator is coming” to “your toaster might kill you.”\n\nBut the experiments don’t support the dramatic headlines. They ran a 26B model across 15 $55 TV boxes at 0.39 tokens per second. The end-to-end test used emulated devices with deliberately open ADB ports, so the “hacking” step was trivial. The capable model often ran on a separate server. Agents were harnessed and told to propagate. This is not proof of autonomous rogue AI worms in the wild.\n\nNor is the threat even novel. Worms that do this without AI already exist. Mirai in 2016 scanned for default credentials and built massive DDoS botnets. Kimwolf has infected over two million devices, mostly cheap Android TV boxes, by hitting open ADB ports.\n\nSmall models don’t currently add much that matters on these targets. The bottleneck has never been figuring out the device. It’s the huge number of devices that ship with open ports, default passwords, and no patching. Traditional worms already exploit that at scale.\n\nA practical attacker would use the best models available offline to design a better traditional worm, then ship the lean binary. You get the intelligence benefit at design time without dragging a slow, heavy model along with every infection. Embedding a weak model in the payload is the worse option for anyone who actually wants the largest, fastest botnet.\n\nThe timing of Anthropic’s latest scare campaign is hard to ignore. The day before, Brian Armstrong posted that Coinbase fine-tuned an open-weight small model (Qwen-3.5-9B) on proprietary fraud data. It beat frontier models, including Anthropic’s own Opus 4.5, while being faster and much cheaper. In testing it cut fraudulent transactions by about 30%.\n\nThis is the emerging pattern. For narrow enterprise workloads you don’t need a general superintelligence. You need a small specialist model trained on your own data. Cheaper to run, especially as compute gets tighter, and often better on the metric that matters. That is a direct threat to the frontier-company model of selling access to ever-larger general models.\n\nSafety advocates should be welcoming this development. If the real concern is existential risk from ever-larger frontier systems — the ones that could theoretically do sustained autonomous R\u0026D or become hard to control — then a shift toward smaller specialized models is the safer outcome. \n\nSmall models specialized on fraud detection or support tickets are not pushing the frontier. They are not in the category of systems that could become a new species. The theoretical loss-of-control risk is created by models getting bigger and more generally capable.\n\nSafety advocates focused on those risks should welcome companies having a cheaper alternative to constantly scaling general models. Instead we get dramatic warnings about small models at the exact moment they are starting to take real enterprise share from closed-model companies like Anthropic.","snippet_ja":"小型モデルは本当に脅威か？Anthropicの「恐怖工場」が、小型モデルが格安IoT機器上で自己複製しかねないと警告する報告を出したが…"},{"rank":66,"handle":"GoogleDeepMind","url":"https://x.com/GoogleDeepMind/status/2110421861435879476","id":"2110421861435879476","views":168145,"likes":2465,"metric":"168K","category":"発表","snippet":"Gemini 4 Argon is already unlocking new scientific breakthroughs in quantum computing, nuclear fusion, protein design and beyond. 🧵","name":"Google DeepMind","avatar":"https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_200x200.jpg","media":"https://pbs.twimg.com/tweet_video_thumb/HUm4960WkAECy-M.jpg","text":"Gemini 4 Argon is already unlocking new scientific breakthroughs in quantum computing, nuclear fusion, protein design and beyond. 🧵","snippet_ja":"Gemini 4 Argonはすでに量子計算、核融合、タンパク質設計などで新たな科学的成果を生んでいる🧵"},{"rank":67,"handle":"DavidSacks","url":"https://x.com/DavidSacks/status/2111490304092078474","id":"2111490304092078474","views":163071,"likes":1907,"metric":"163K","category":"評価","snippet":"Is 10²⁵ FLOPs Still the Frontier? A new Anthropic-written safety bill is circulating on Capitol Hill. Some of its ideas could be reasonable …","name":"David Sacks","avatar":"https://pbs.twimg.com/profile_images/1879600809693917185/GkBxdTd9_200x200.jpg","media":null,"text":"Is 10²⁵ FLOPs Still the Frontier?\n\nA new Anthropic-written safety bill is circulating on Capitol Hill. Some of its ideas could be reasonable if limited to true frontier companies. As written, however, it will eventually sweep in most of Silicon Valley, damaging the startup ecosystem.\n\nThe bill defines the “frontier” as any model trained on 10²⁵ FLOPs — the EU standard from 2023. Biden’s executive order, California’s SB 53, and New York’s RAISE Act used 10²⁶ (ten times more). 10²⁷ is where the frontier actually is today (e.g., GPT-6 Astra).\n\nAstra was reportedly trained on 100,000+ Grace Blackwell GPUs. A 10²⁵ model can be trained on as few as several hundred GB300 chips in three months. That is not frontier in 2026.\n\nThe definition is also cumulative: it adds FLOPs from fine-tuning, reinforcement learning, or other material modifications. In practice, that captures almost all meaningful post-training — work that is becoming commonplace in the enterprise.\n\nThe enterprise trend is toward thousands of smaller custom models built for specific workloads. These pose no frontier risk. Treating them as frontier systems would impose large compliance costs across corporate America for no safety gain.\n\nDario has claimed that Anthropic designs rules to disadvantage frontier companies like his own while advantaging smaller competitors. This definition does the opposite.\n\nA stale 2023 cutoff favors incumbents who already clear the bar and can absorb the costs. It hobbles the open model ecosystem that threatens Anthropic’s pricing power. \n\nThe frontier keeps moving. Any definition meant to track risk should move with it. \n\nAnthropic should clarify if they really believe 10²⁵ FLOPs represents the frontier.","snippet_ja":"10²⁵ FLOPsはまだフロンティアか？Anthropic起草の安全法案が議会で回覧中。対象が広すぎ、いずれシリコンバレーの大半を巻き込む…"},{"rank":68,"handle":"cursor_ai","url":"https://x.com/cursor_ai/status/2111193957527146711","id":"2111193957527146711","views":160816,"likes":2608,"metric":"161K","category":"発表","snippet":"Cloud agents can now build interactive canvases. Ask for a dashboard or report while the agent works, then share the finished canvas with yo…","name":"Cursor","avatar":"https://pbs.twimg.com/profile_images/1970182748146180096/dhZeXi_X_200x200.jpg","media":"https://pbs.twimg.com/amplify_video_thumb/2111193927281975296/img/jmpZoSMCuffYV9Ol.jpg","text":"Cloud agents can now build interactive canvases.\n\nAsk for a dashboard or report while the agent works, then share the finished canvas with your team as a link.","snippet_ja":"クラウドエージェントがインタラクティブなキャンバスを作れるように。作業中にダッシュボードやレポートを頼み、完成品をリンクで共有。"},{"rank":69,"handle":"OpenAIDevs","url":"https://x.com/OpenAIDevs/status/2111585491237650691","id":"2111585491237650691","views":159733,"likes":1229,"metric":"160K","category":"研究所","snippet":"Looking for a weekend project? Here’s what the community has been building and how you can replicate it yourself:","name":"OpenAI Developers","avatar":"https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_200x200.jpg","media":null,"text":"Looking for a weekend project?\n\nHere’s what the community has been building and how you can replicate it yourself:","snippet_ja":"週末のプロジェクトをお探し？コミュニティの作品と再現方法を紹介。"},{"rank":70,"handle":"masahirochaen","url":"https://x.com/masahirochaen/status/2111969604360880253","id":"2111969604360880253","views":157994,"likes":893,"metric":"158K","category":"その他","snippet":"私がClaude Codeのセッションを15〜20個同時に回せている秘訣はこれです。 15分おきにClaudeが全セッションの最後のやり取りを読み、名前の先頭に絵文字を付け直してくれます。 ・🔴 自分の判断が要る ・📤 下書きができて送るだけ ・👀 確認中／⏳ 作業中 ・✅ 完了…","name":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","avatar":"https://pbs.twimg.com/profile_images/1689665533929725953/fClFlzLd_200x200.jpg","media":"ht <script>
(function(){
  function loadData(){
    var el = document.getElementById('board-data');
    return JSON.parse(el.textContent);
  }
  try {
    window.AI_X_TOP50 = loadData();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">データ読込失敗: '+String(e)+'</p>';
    return;
  }
  window.__lang = localStorage.getItem('ai-x-top50-lang') || 'ja';
  window.__page = parseInt(localStorage.getItem('ai-x-top50-page') || '1', 10);
  if (window.__page !== 1 && window.__page !== 2) window.__page = 1;
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('lang') === 'ja' || qs.get('lang') === 'en') window.__lang = qs.get('lang');
    if (qs.get('page') === '1' || qs.get('page') === '2') window.__page = Number(qs.get('page'));
  } catch (e) {}
  function syncUrl(){
    try { var u = new URL(location.href); u.searchParams.set('page', String(window.__page)); u.searchParams.set('lang', window.__lang); history.replaceState(null, '', u); } catch (e) {}
  }
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      var wasCard = document.activeElement && document.activeElement.classList.contains('card');
      setPage(e.key === 'ArrowLeft' ? 1 : 2);
      if (wasCard) { var c = document.querySelector('#board .card'); if (c) c.focus(); }
    }
  });

  function setLang(lang){
    window.__lang = (lang === 'en') ? 'en' : 'ja';
    try { localStorage.setItem('ai-x-top50-lang', window.__lang); } catch (e) {}
    boot();
  }
  function setPage(page){
    window.__page = (Number(page) === 2) ? 2 : 1;
    try { localStorage.setItem('ai-x-top50-page', String(window.__page)); } catch (e) {}
    boot();
  }

  document.getElementById('btn-ja').onclick = function(){ setLang('ja'); };
  document.getElementById('btn-en').onclick = function(){ setLang('en'); };
  document.getElementById('btn-p1').onclick = function(){ setPage(1); };
  document.getElementById('btn-p2').onclick = function(){ setPage(2); };

  (function swipePages(){
    var board = document.getElementById('board');
    var x0 = null, y0 = null;
    board.addEventListener('touchstart', function(e){
      if (!e.changedTouches || !e.changedTouches[0]) return;
      x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY;
    }, {passive:true});
    board.addEventListener('touchend', function(e){
      if (x0 == null || !e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - x0;
      var dy = e.changedTouches[0].clientY - y0;
      x0 = y0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (dx < 0) setPage(2); else setPage(1);
    }, {passive:true});
  })();

  function boot(){
    var data = window.AI_X_TOP50 || {posts:[]};
    var board = document.getElementById('board');
    var lang = window.__lang || 'ja';
    var page = window.__page === 2 ? 2 : 1;
    var ja = lang === 'ja';
    var pageSize = data.page_size || 50;
    var start = (page - 1) * pageSize;
    var end = start + pageSize;
    var rangeLabel = page === 1 ? '1–50' : '51–100';
    document.getElementById('title').textContent = ja
      ? (data.title_ja || data.title || 'AI情報 Top 100')
      : (data.title_en || 'AI News Top 100');
    document.getElementById('date').textContent = data.updated_label || '';
    document.getElementById('pill').textContent = rangeLabel;
    document.getElementById('btn-ja').classList.toggle('active', ja);
    document.getElementById('btn-en').classList.toggle('active', !ja);
    document.getElementById('btn-p1').classList.toggle('active', page === 1);
    document.getElementById('btn-p2').classList.toggle('active', page === 2);
    ['btn-ja','btn-en','btn-p1','btn-p2'].forEach(function(id){ var b = document.getElementById(id); b.setAttribute('aria-pressed', String(b.classList.contains('active'))); });
    syncUrl();
    document.documentElement.lang = ja ? 'ja' : 'en';
    board.setAttribute('aria-label', (ja ? 'AI情報 Top 100' : 'AI News Top 100') + ' ' + rangeLabel);
    board.innerHTML = '';
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
    function initial(name, handle){ return (String(name || handle || '?').trim().charAt(0) || '?').toUpperCase(); }
    var posts = (data.posts || []).slice(start, end);
    posts.forEach(function(p){
      var a = document.createElement('a');
      a.className = 'card';
      a.href = p.url || '#';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', '#' + p.rank + ' ' + (p.name || p.handle || '') + (ja ? '（Xで開く・新しいタブ）' : ' (opens X in a new tab)'));
      var handle = String(p.handle || '').replace(/^@/,'');
      var name = p.name || handle;
      var snip = ja ? (p.snippet_ja || p.snippet || p.text || '') : (p.snippet || p.text || '');
      var metric = p.metric ? '<span class="metric">'+esc(p.metric)+'👁</span>' : '';
      var av;
      if (p.avatar) {
        av = '<img class="avatar" loading="lazy" decoding="async" src="'+esc(p.avatar)+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="fallback" style="display:none">'+esc(initial(name, handle))+'</span>';
      } else {
        av = '<span class="fallback">'+esc(initial(name, handle))+'</span>';
      }
      var thumb = p.media ? '<img class="thumb" loading="lazy" decoding="async" src="'+esc(p.media)+'" alt="" onerror="this.remove()">' : '';
      a.innerHTML = '<div class="top"><span class="rank">#'+esc(p.rank)+'</span>'+av+'<div class="who"><div class="name">'+esc(name)+'</div><div class="handle">@'+esc(handle)+'</div></div>'+metric+'</div><div class="copy"><p class="snippet">'+esc(snip)+'</p>'+thumb+'</div>';
      board.appendChild(a);
    });
  }
  window.__bootBoard = boot;
  boot();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
