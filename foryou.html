<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-27T19:12:23+09:00","posts":[{"id":"2114812920605593603","author":"make claude","handle":"make_claude","text":"我靠,花9美元就能透视你家的墙了 - GitHub上已经99.7k星了\n\n找到一个项目,看完之后在家里都觉得不自在了。叫RuView,9.97万星,MIT协议 - 也就是免费、合法,直接拿去用。\n\n硬件就是一个esp32节点,9美元。抓的是本来就飘在你家里的wifi信号,从里面提取出:房间里有没有人、有几个人、什么时候进门什么时候出门、呼吸频率、心率,甚至想拼出一个17个点的人体骨架。全程不需要摄像头。\n\n而且这还被写成了卖点:因为没有摄像头,可以绕开GDPR的视频规定和HIPAA的影像规定 - \"by design\"(设计上就是这样)。这是他们原话:你被看见了,但严格来说没人\"拍\"过你。\n\n\u003e 隔墙隔混凝土都能看 - 官方说的有效距离大概5米,停车场的场景里直接写\"穿透混凝土墙\"\n\u003e 4到6个节点组成一张网,能覆盖一整层楼 - \"软件上没有硬性上限,极限只取决于信号物理特性\"\n\u003e 通过tailscale/wireguard,在任何地方都能远程连上节点\n\u003e 列出的应用场景包括:不用认人脸的零售、儿童房、停车场、甚至教堂数人头\n\n我自己拿这个固件,用claude按自己的需求稍微改了一版 - 花了两晚上,没碰他们的私有代码,就是在公开的部分上面改的。改出来的东西,跟作者当初的设想完全不是一回事。实际效果怎么样,视频在下面。\n\n先收藏 - 等你开始算邻居家挂了多少个9美元的这玩意儿的时候用得上。","url":"https://x.com/make_claude/status/2114812920605593603","createdAt":"2026-10-26T20:14:26Z","metrics":{"views":58676,"likes":846},"lang":"zh"},{"id":"2114824948309000439","author":"José Siles | AI | Data","handle":"josesilesdata","text":"👋🏼ADIÓS AL WEBSCRAPING!!\n\nHan creado PixelRAG.\n\nEn vez de convertir una web en texto...\n\nhace una captura de pantalla.\n\nY luego un modelo vision-language lee la respuesta directamente desde los píxeles.\n\nBrutal.\n\nPorque el scraping tradicional rompe muchísima información:\n\n→ PDFs\n→ tablas\n→ layouts\n→ botones\n→ columnas\n\nTodo eso se pierde cuando conviertes una web en texto plano.\n\nPixelRAG hace algo mucho más simple:\n\nindexa la página tal y como la ve una persona.\n\nEl equipo ha creado un índice visual de Wikipedia entero:\n\n+30 millones de screenshots.\n\nY aun así supera al mejor RAG basado en texto por un 18,1% en QA.\n\nTiene también un plugin para Claude Code.\n\nBásicamente le da ojos a Claude.\n\nLe pasas una URL, un paper de arXiv o tu web local...\n\ny Claude no scrapea el DOM.\n\nLa mira.\n\nCómo funciona:\n\n→ construye un índice FAISS\n→ busca visualmente sobre píxeles\n→ los embebe con Qwen3-VL-Embedding\n→ renderiza webs, PDFs e imágenes en tiles\n\nTodo open source bajo Apache-2.0.\n\nLink al repo en los comentarios 👇🏻","url":"https://x.com/josesilesdata/status/2114824948309000439","createdAt":"2026-10-26T21:02:13Z","metrics":{"views":49671,"likes":1492},"lang":"es"},{"id":"2114910204072780126","author":"Aircle｜AIコミュニティ","handle":"AiAircle34052","text":"【衝撃】\nObsidian の CEO 本人が、Claude Code などで使えるスキル集を無料公開していて海外で話題😳　しかも GitHub で約5万スター。\nhttps://t.co/KOp06Tk9a9\n\n中身は、Claude に Obsidian の書き方（リンク・埋め込み・プロパティ・Bases・Canvas）を覚えさせるスキル集「obsidian-skills」。作者は CEO の kepano（Steph Ango）さん👀\n\n❌ Claude に毎回「Obsidian の書式はこう」と説明する\n\n⭕️ スキルを入れて、最初から Obsidian の流儀で書かせる\n\nこれだけで、Claude が書いたメモがそのまま Obsidian の中でつながるようになる。\n\n”さらに便利なのがここ”👇\n\n第2の脳を自動で育てたいなら、別の開発者が作った「claude-obsidian」（約1.6万スター）も足す。\n資料を入れると、Claude がリンク付きのノートに分けて整理してくれる。\n使えるコマンドは、\n\n・/claude-obsidian:wiki → 保管庫（vault）を準備\n・/claude-obsidian:wiki-ingest → 受け取り用フォルダ（inbox）に入れた資料をノートに変換\n・/claude-obsidian:wiki-query → 自分のノートをもとに Claude が答える\n・/claude-obsidian:save → 良い回答を新しいノートとして保存\n・/claude-obsidian:wiki-lint → 切れたリンクや孤立したページを点検\n\nまずは土台の obsidian-skills から。Claude Code でこの2行👇\n/plugin marketplace add kepano/obsidian-skills\n/plugin install obsidian@obsidian-skills\n\n人間は大量のメモを手で整理するのが苦手だが、AIは横断して読むのが得意。\nだからこの組み合わせで、ためたメモがそのまま「AIが使える自分専用の資料」に変わる。\nどちらも無料です。\n保存推奨です。","url":"https://x.com/AiAircle34052/status/2114910204072780126","createdAt":"2026-10-27T02:41:00Z","metrics":{"views":7149,"likes":84},"lang":"ja"},{"id":"2114940685082337561","author":"Hailey","handle":"HaileyAILabs","text":"终于做出来了！\nMuse + Claude Opus 5.5 联手打造的 3D 二次元少女 MV！\n\n制作过程其实就 5 步：\n- GPT 设计少女角色\n- Muse 生成舞蹈视频\n- Opus 识别舞蹈动作\n- Opus 根据舞步编排音乐\n- Opus 用纯代码打造 3D 舞台，让灯光、特效和镜头跟着节奏变化\n\n如果大家感兴趣，我再写一篇详细的制作教程，从角色设计到最终 MV，分享出来","url":"https://x.com/HaileyAILabs/status/2114940685082337561","createdAt":"2026-10-27T04:42:07Z","metrics":{"views":24201,"likes":557},"lang":"zh"},{"id":"2114976834073088379","author":"そら","handle":"sora_biz","text":"これ、めっちゃありがたいな。\n\nX APIキー作る必要、ほんとなくなったじゃん。 https://t.co/h7BfC4GWKp","url":"https://x.com/sora_biz/status/2114976834073088379","createdAt":"2026-10-27T07:05:46Z","metrics":{"views":5618,"likes":74},"lang":"ja"},{"id":"2114666959786983759","author":"awe0","handle":"awe0_io","text":"Google 开源了一个很有趣的 AI Coding 插件，叫做 Elephant-Goldfish（大象与金鱼）。\n\n它想解决一个常见问题：\n\n你跟 AI 讨论了两个小时，AI 觉得自己什么都懂，结果写出来的程序还是跟需求有落差。\n\nGoogle 的做法是：让两个 AI 代理分工。\n\n⸻\n\n🐘 大象（Elephant）\n\n负责记住项目脉络、讨论架构、整理需求，把决策写成设计文件。\n\n🐟 金鱼（Goldfish）\n\n刻意不继承之前的聊天记录，像第一次接手项目的工程师，重新审查设计。\n\n金鱼会做三件事：\n\n理解检查： 光看文件，能不能理解整个设计？\n\n对抗审查： 有没有遗漏边界条件、隐藏依赖或逻辑问题？\n\n实现检查： 文件、数据结构、函数接口是否清楚到可以开始写程序？\n\n如果金鱼看不懂，就回去修改规格。\n\n⸻\n\n这套流程最有意思的地方，是把 AI Coding 的质量管控往前移。\n\n以前是 AI 写完程序，人类才开始找问题。\n\n现在可以在写第一行 Code 之前，就先让另一个 AI 挑出规格漏洞。\n\n尤其适合跨文件修改、复杂功能、多人协作的项目。\n\n目前官方 GitHub 已列出 Antigravity、Claude Code、Codex 的安装方式。\n\n不过，审查通过仍不代表程序一定正确，人工验收与测试还是需要。\n\n⸻\n\n我觉得值得观察的是：\n\n当 AI 越来越会写程序，「谁来检查 AI 理解得对不对」，可能会变成更重要的工作。\n\n项目网站：","url":"https://x.com/awe0_io/status/2114666959786983759","createdAt":"2026-10-26T10:34:26Z","metrics":{"views":22443,"likes":398},"lang":"zh"},{"id":"2114993942878192078","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝これは、、、炎鎮さんのGrok Botの使い方はメチャクチャ貴重ですよ！ありがたすぎるシェアに感謝です\n\nこの1枚をGrok Botの、Dr Eggbotに読ませて、\n「私の環境で足りてない部分を補いたいから相談しよう！」って投げれば良さがわかります！\n\n「マモリ」のbotは必要ですね\nありがとうございます！ https://t.co/OG5Z154UR1","url":"https://x.com/tetumemo/status/2114993942878192078","createdAt":"2026-10-27T08:13:45Z","metrics":{"views":3729,"likes":37},"lang":"ja"},{"id":"2115022687827312679","author":"EKOS _ OMiD","handle":"OMID_0909","text":"📢 IMPORTANT UPDATE | EKOS\n\nToday’s team meeting will focus on the execution roadmap for three important initiatives:\n\n🟡 1. X Gold Verification\nMoving forward with the process of obtaining the Gold Checkmark for the official EKOS account to strengthen our project’s professional presence and credibility on X.\n\n🤖 2. EKOS Telegram Bot\nPlanning a dedicated Telegram intelligence hub for real-time token data, official announcements, project updates, and filtered community discussions.\n\n⚡ 3. EKOS AI Bot on X\nPlanning an intelligent bot to monitor relevant discussions, identify EKOS-related content, and improve how we track and engage with the ecosystem on X.\n\nToday’s focus is on turning these initiatives into actionable steps, defining priorities, and establishing an execution plan.\n\nMore updates will follow as we make progress.\n\nEKOS is building, improving, and moving forward. 🚀","url":"https://x.com/OMID_0909/status/2115022687827312679","createdAt":"2026-10-27T10:07:58Z","metrics":{"views":36,"likes":9},"lang":"en"},{"id":"2114900673233821966","author":"鱼总聊AI","handle":"AI_Jasonyu","text":"兄弟们，JEV 实际使用场景被我探索出来了！\n\n因为JEV 这种决策模型管的是判断，但机器人、无人机做判断之前，得先有人把画面看准，找全，数清，没有就说没有，不能有幻觉。\n\n这一步现在也有专门的端侧视觉模型，就是@OmAI_lab开源的 VLX-Seek。你只需要去描述要找什么，它就可以把东西框出来，数出来。我自己调接口测了四段视频，大家 往下看 👇","url":"https://x.com/AI_Jasonyu/status/2114900673233821966","createdAt":"2026-10-27T02:03:08Z","metrics":{"views":13709,"likes":143},"lang":"zh"},{"id":"2114983484003623162","author":"Codex 研究所","handle":"codex_lab_","text":"【警告】\nCodexやClaude Codeを「ダウンロードフォルダ」で絶対開かないでください。\n\n危険な理由悪質なサイトを踏むと、罠の指示ファイル（CLAUDE.md など）が勝手にダウンロードされます。そのフォルダでAIを起動すると、AIが罠の指示に従ってPC設定を書き換え、認証情報の盗難や乗っ取りが発生します。\n\n修正されない理由\nどちらも「正常な仕様」の組み合わせによる穴のため、公式の対策アップデートは期待できません。\n\n今すぐできる対策\nAIエージェントは必ず専用の作業フォルダで起動する（ダウンロードフォルダでは絶対開かない）\nダウンロードフォルダに怪しい .md ファイルがないか確認・削除する","url":"https://x.com/codex_lab_/status/2114983484003623162","createdAt":"2026-10-27T07:32:11Z","metrics":{"views":7287,"likes":44},"lang":"ja"},{"id":"2114703987018498529","author":"Tz","handle":"Tz_2022","text":"这个太有意思了！\n\n用 AI 决策模型 + Lidar 测距来实时评估并标记出远足登山过程中最合适安全的落脚位置，甚至还能区分左右脚。。。\n\n一旦 AI 和物理世界打通，而且还能实时进行决策了，是真的前途不可限量哪。。。","url":"https://x.com/Tz_2022/status/2114703987018498529","createdAt":"2026-10-26T13:01:34Z","metrics":{"views":91020,"likes":1169},"lang":"zh"},{"id":"2114866114136310061","author":"Marcel","handle":"marcelkargul","text":"finally made it open-source!\n\nenjoy 😉\n\nhttps://t.co/OgVtU8IAFu https://t.co/GQ0QEQHtk0","url":"https://x.com/marcelkargul/status/2114866114136310061","createdAt":"2026-10-26T23:45:48Z","metrics":{"views":62260,"likes":1250},"lang":"en"},{"id":"2114552611118461344","author":"KAWAI","handle":"kawai_design","text":"AIに動きをつけてもらうと、\n動くのに「なんか安っぽい」で止まる。\n\nCSSアニメーション130種を、\n動く実物とコードで一覧にしました。\n\nたとえば、オーロラメッシュ、グリッチ文字。\nスクロール駆動リビール、3Dカルーセル。\n\n各項目に「AI」タブがあります。\n\nHTML、CSS、対応ブラウザ、描画コスト、\nreduced-motion（動きを控える設定）\nへの対応まで、1回のコピーで\nAIへそのまま渡せます。\n\n「安っぽい」の正体は、\n派手さ不足ではありません。\n\n「軽さ」と「配慮」の指定が\n漏れていることにあります。","url":"https://x.com/kawai_design/status/2114552611118461344","createdAt":"2026-10-26T03:00:03Z","metrics":{"views":13546,"likes":300},"lang":"ja"},{"id":"2114985650956935418","author":"مالك بن حمود المالك","handle":"cnemalek","text":"يا طويل العمر، GitHub مليان مهارات مجانية تخلي تطبيقك يطلع بتصميم احترافي، بدل ما يكون شكله مثل أي تطبيق مولّد بالذكاء الاصطناعي.\n\nهذي 10 أدوات تستحق تحفظها عندك:\n\n1. Frontend Design – من Anthropic تعطي تطبيقك هوية بصرية متكاملة من ناحية الألوان والخطوط والتصميم. الرابط: \n\nhttps://t.co/o477oFwZcB\n\n2. UI UX Pro Max تقترح لك ألوان وخطوط وتجارب مستخدم تناسب مشروعك. الرابط: \n\nhttps://t.co/8PdPn12PqX\n\n3. Impeccable تراجع التصميم وتحسّن ترتيب العناصر والنصوص. الرابط: \n\nhttps://t.co/O1dxAMizYT\n\n4. Emil Design Eng تهتم بالتفاصيل الصغيرة مثل الأزرار والانتقالات والحركات. الرابط: \n\nhttps://t.co/e0yLBxoaru\n\n5. Create Design MD تنشئ ملفًا يحدد قواعد التصميم عشان تحافظ على تناسق جميع صفحات التطبيق. الرابط: \n\nhttps://t.co/Emn1XsXhlH\n\n6. Review Animations تراجع الحركات والانتقالات وتكتشف اللي يحتاج تحسين. الرابط: \n\nhttps://t.co/tWdrHaY0Vw\n\n7. Mobile Native تخلي تطبيق الويب أقرب لتجربة التطبيقات الأصلية على الجوال. الرابط: \n\nhttps://t.co/gesx2x6iP3\n\n8. Break UI تختبر التصميم مع الأسماء الطويلة والصفحات الفارغة والبيانات المتداخلة. الرابط:\n\nhttps://t.co/j9ceqDPSnR\n\n9. Web Design Guidelines – من Vercel تراجع سهولة الوصول والنماذج وحالات التركيز وتفاصيل الواجهة. الرابط: \n\nhttps://t.co/vshD5DFFud\n\n10. Webapp Testing – من Anthropic تختبر التطبيق داخل المتصفح، وتكتشف الأخطاء وتلتقط صورًا للنتائج. الرابط: \n\nhttps://t.co/O1dxAMizYT\n\nالخلاصة: إذا كنت تبني تطبيقات باستخدام الذكاء الاصطناعي، فهذي المهارات تساعدك تطلع بنتيجة أكثر احترافية وتميّزًا، بدل التصاميم المتشابهة والمكررة.\n\nاحفظ التغريدة وشاركها مع كل شخص يطوّر تطبيقاته بالذكاء الاصطناعي.","url":"https://x.com/cnemalek/status/2114985650956935418","createdAt":"2026-10-27T07:40:48Z","metrics":{"views":4389,"likes":133},"lang":"ar"},{"id":"2114701516024033486","author":"Koukyosyumei","handle":"Koukyosyumei","text":"Lean 4で形式検証できるRust製Webフレームワーク「h5i」が、GitHubで800スターを突破しました！\n\n2026年は、AIエージェントが数分でWebアプリを作れる時代になりました。しかし、AIが何千・何万ものテストを書いても、プログラムが正しいことを保証できるわけではありません。\n\nそこでh5iでは、WebアプリのビジネスロジックをRustからLean 4に変換し、その性質を数学的に証明できる仕組みを開発しています。\n\n例えば、認可や認証、セッション・トークンの管理、入力検証、データの整合性など、さまざまな性質を形式的に検証できます。\n\n実際に、6つのOSS Web アプリをh5iに書き換えるベンチマークでは、1万行近くのコアロジックの書き換え・300個以上の重要な性質の証明に成功し、また元の実装に存在していたバグも4件発見しました。\n\nh5iの特徴は、既存のRustエコシステムを活用できることです。AxumベースのフレームワークとしてWebアプリを開発しながら、重要なロジックをLean 4で検証できます。\n\nもちろん、形式検証は万能ではありません。証明できるのは明示的に定義した性質であり、仕様の考慮漏れや強すぎる仮定の導入、証明対象外のコードには別途対策が必要です。\n\nそれでも、AIがコードを書くことが当たり前になるほど、「テストに通ること」だけでなく「重要な性質が数学的に保証されていること」の価値は高まると思っています。\n\n形式検証を研究室の中だけの技術ではなく、普段のWeb開発で使えるものにしていきたいです。\n\nGitHub:","url":"https://x.com/Koukyosyumei/status/2114701516024033486","createdAt":"2026-10-26T12:51:45Z","metrics":{"views":10694,"likes":246},"lang":"ja"},{"id":"2114970645868216589","author":"炎鎮🔥 - ₿onochin -","handle":"super_bonochin","text":"めっちゃ雑だけど、ざっくりこんな感じで Grok Bot 使ってる。","url":"https://x.com/super_bonochin/status/2114970645868216589","createdAt":"2026-10-27T06:41:10Z","metrics":{"views":25910,"likes":439},"lang":"ja"},{"id":"2114977428682809759","author":"小墨同学","handle":"xiaomovps","text":"Grok Bot 重大更新，X 运营自动化还免费🔥\n\n上周 GrokBot 官方取消了使用 Grok Bot 中的 X 连接器所需的开发者账户和 X API 积分要求\n\n免费功能：\n\n1、读你自己的账号：主页时间线、提及、点赞、收藏夹、关注者和关注列表\n\n2、搜全站帖子，查话题发帖量、X 新闻和各地趋势\n\n3、读私信和私信请求，汇总未读\n\n4、管 List：建列表、加人，一次读完里面所有人的新帖\n\n5、起草 X 文章，只存草稿不发布\n\n6、排通话日程，预约直播\n\n尤其是对于我这种长期在运营 X 相关的内容的人，基本上是天大的福利，很多事情都可以自动化完成了\n\n我最烦的文章排版功能也可以直接使用 GrokBot 完成，看来 Grok BOT 整体的含金量还在上升","url":"https://x.com/xiaomovps/status/2114977428682809759","createdAt":"2026-10-27T07:08:08Z","metrics":{"views":4839,"likes":31},"lang":"zh"},{"id":"2115010493899502058","author":"Avi Chawla","handle":"_avichawla","text":"Big win for local LLM inference!\n\nThis new inference engine runs LLMs 4x faster than llama.cpp:\n\nI ran Qwen3.5 9B on a base M5 MacBook Pro with three engines:\n\n- llama.cpp: 22.0 tokens/s\n- MLX: 25.1 tokens/s\n- uzu: 92.1 tokens/s\n\nThe video below shows all three runs side by side.\n\nThe first two numbers don't mean llama.cpp or MLX are badly built. But both are sitting right under a hard limit of local decoding.\n\nWhen an LLM generates text, every new token needs one full pass through the model, and that pass reads all of the model's weights from memory.\n\nA base M5 reads memory at about 153 GB/s. A 4-bit 9B model weighs about 5.2 GB.\n\nSo at one token per pass, the ceiling is roughly 153 ÷ 5.2 ≈ 29 tokens/s, however fast the GPU computes.\n\nuzu gets past that ceiling by producing several tokens per pass instead of one:\n\n↳ A small drafter (DFlash) proposes candidates for the next 16 positions at once.\n\n↳ A tiny adapter (Weaver, 56.7M params) picks among them left to right, so the guesses form coherent text, and keeps a few alternative branches as a tree.\n\n↳ The 9B model checks the whole tree in a single pass and keeps the longest path it agrees with. The main model still decides every token that ends up in the output.\n\nGitHub repo: https://t.co/TKikR80qEA\n\n(don't forget to star it 🌟)\n\nIn my run, each pass of the 9B model produced 7.5 tokens on average. Ordinary decoding produces exactly 1.\n\nThe weights and kernels are designed around this too. uzu ships its own 4-bit checkpoints, and on M5 chips it runs the verification step on the GPU's int8 matrix path.\n\nuzu is an open-source inference engine by Mirai Labs, written in Rust with Metal kernels. It has Swift, Python, TypeScript and Rust bindings, so the same engine runs inside a Mac or iOS app.\n\nI shared the GitHub repo above.\n\nIf you want to dive deeper, my co-founder wrote a detailed breakdown of why local inference is memory-bound and how uzu's speculative decoding gets past it.\n\nRead it below.","url":"https://x.com/_avichawla/status/2115010493899502058","createdAt":"2026-10-27T09:19:31Z","metrics":{"views":1432,"likes":20},"lang":"en"},{"id":"2114585399112999089","author":"StudioYebisu","handle":"studio_yebisu","text":"NVIDIA公式が 3Dアセット2575個を無料公開????\nわざわざ作る必要なくなるから、\nビジネスでシミュレーションを作る人とか、FA屋さん大歓喜じゃない？これリアルテイストのゲーム作ったりするんだったら使えると思うし。\n\n最近流行ってんの？無料アセット？\nもうあれか、AIで全部作れるようになったから、3DモデルもOSS化していって、昔みたいに3Dアセットが超高いみたいなことはどんどんなくなっていくのかもな。\n\nまあ人間系とかキャラ系はどうしてもやっぱ難しいとは思うけど、まあ、わざわざ自分でパーツを作る必要性がある時代っていうのはどんどん過去の遺物になるんかもしれないな。","url":"https://x.com/studio_yebisu/status/2114585399112999089","createdAt":"2026-10-26T05:10:20Z","metrics":{"views":77665,"likes":1424},"lang":"ja"},{"id":"2114773524787187804","author":"Philipp Schmid","handle":"_philschmid","text":"We launched the Gemini API CLI. A CLI for calling the Gemini API. Give it to the agent you already use (Claude Code, Codex, Antigravity, Cursor, OpenClaw, Hermes...). It's NOT a new coding agent you can use it too:\n\n1. Generate images, video, speech, music.\n2. Analyze PDFs, images, audio, video, YouTube URLs,\n3. Transcribe recordings to md / json / srt,\n4. Run Deep Research in the background.\n\nStateless. No memory, no chat mode. Your agent owns the context and the plan, gemini-api does the API call. Build for Agents, it's self-describing. `--help`,  `--dry-run`...\n\nStart here:","url":"https://x.com/_philschmid/status/2114773524787187804","createdAt":"2026-10-26T17:37:53Z","metrics":{"views":140658,"likes":1397},"lang":"en"},{"id":"2114936383181836635","author":"オープンソース研究所","handle":"opensourcelab9","text":"【海外で話題】\n説明動画やモーション動画を1人で作りたい人へ。\n「絵コンテから最後のMP4まで、どの工程に何を使うか」を道具選びの目安にできる一覧が話題です😳\n\nGitHubで公開されている10の道具を、工程ごとに1つずつ並べています👇\n\n・絵コンテ: Excalidraw（手描き風の図・ワイヤーフレーム）\n・画面デザイン: Penpot（オープンソースのデザイン基盤）\n・フォント: Fontsource（自前で配信できるフォントをNPMで）\n・アイコン: Lucide（1600以上のSVGアイコン）\n・SVGの整理: SVGO（SVGファイルを軽くする）\n・動き: GSAP（CSS・SVG・canvasを動かす）\n・3D: Three.js（ブラウザで動く3Dライブラリ）\n・音: Audacity（多重トラックの録音・編集）\n・組み立て: Remotion（Reactのコードで動画を作る）\n・書き出し: FFmpeg（映像・音声・字幕を処理）\n\nつまり\n「どの工程に何を使うか」で迷う時間を、この一覧1枚で短くできる。\n※Remotionは一部の会社利用でライセンス取得が必要です。\n\n台本から日本語の声を作る工程まで含めて、Claude Codeに説明動画を任せるなら別の方法もあります。GSAPやThree.jsで動かしたHTMLを動画に書き出すOSS『HyperFrames』の入れ方と、日本語の声の準備・読み間違いの直し方は、この記事にまとめました👇","url":"https://x.com/opensourcelab9/status/2114936383181836635","createdAt":"2026-10-27T04:25:02Z","metrics":{"views":950,"likes":12},"lang":"ja"},{"id":"2114702883673501719","author":"Chasen","handle":"chasen_liao","text":"以后再也不用请家教了！🤐\n\n港大 HKUDS 开源了一个 AI 私教，叫 DeepTutor，GitHub 已经 4.3 万 star\n\n它不是那种问一道答一道的聊天框\n把课本、讲义、笔记丢进去，它就围绕你自己的资料来讲\n讲题、出题、做深度研究、画可视化讲解，全在同一个工作区里\n\n最狠的是它会记住你学到哪了\n换个会话，进度和错题也接得上\n记忆还拆成三层，原始记录、每个场景的要点、对你的整体画像，都能打开看，也能自己改\n\n看网课也能用，B 站和 YouTube 链接贴进去，哪一秒没听懂就问哪一秒\n\n装起来就三行\npip install -U deeptutor\ndeeptutor init\ndeeptutor start\n\n懒得配的话，直接把仓库丢给 Claude Code 或 Codex，它根目录有一份 SKILL.md，agent 读完就能自己帮你装好\n\n算一笔账就知道了\n\n以前我去给别人上家教，两个小时 200 块\n现在一个月的 Plus 都不用 200 块，随时想问就问，而且还很有耐心\n\nAI 第一个冲击的就是教育行业啊😱\n\n传送门 👉","url":"https://x.com/chasen_liao/status/2114702883673501719","createdAt":"2026-10-26T12:57:11Z","metrics":{"views":85460,"likes":1750},"lang":"zh"},{"id":"2114790794091708762","author":"Trice","handle":"cryptotrice","text":"TradingView doesn't want you to know about this\n\nClaude Fable 5.1 reverse-engineered TradingView Premium and put it on GitHub. The repo just hit 57.1k stars on GitHub and 65k+ members on Discord\n\nThis version has absolutely same features as the original Premium, including real-time data, broker connections, webhooks, and the biggest script and indicator library\n\nThe GitHub repo is currently private, but you can still access it through the local apps for Windows and Mac\n\nSharing the full guide below","url":"https://x.com/cryptotrice/status/2114790794091708762","createdAt":"2026-10-26T18:46:30Z","metrics":{"views":9593,"likes":139},"lang":"en"},{"id":"2114877294892233190","author":"GitTrend","handle":"GitTrend0x","text":"今天 GitHub 被「会自我进化的 Agent 工作台」集体屠榜了！\n\n5 个星标暴增最狠的项目，专业拆解下！\n\n1. JetBrains/thinkrail\n\nJetBrains 孵化的 Agent IDE，围绕 pi 编程 Agent 打造的轻量真 IDE，越用越懂你。\n\n多工作区隔离 + 活的项目规格（living specs）+ 可复用技能，让 Agent 真正记住你的项目。\n\n🔗 直达：https://t.co/H1Z8rEU8uL\n\nIDE 老炮亲自下场给 Agent 造家，2,854 星的新秀一天狂涨 1,156 星，Vibe Coding 正式进入大厂时代！\n\n🟢\n\n2. Panniantong/Agent-Reach\n\n给 AI Agent 装上看遍全网的眼睛，一条命令读取、搜索 Twitter、Reddit、YouTube、GitHub、B 站、小红书。\n\n主打零 API 费用，登录墙后的平台和视频内容也能拿到干净的结构化数据。\n\n🔗 直达：https://t.co/vn7mtGS1uo\n\n以前 Agent 是井底之蛙，现在直接开了天眼。10 万星的老牌猛将一天再涨 723 星，情报战还在升级！\n\n🟢🟢\n\n3. multica-ai/andrej-karpathy-skills\n\n一个 CLAUDE.md 文件，把 Karpathy 吐槽的大模型写代码通病一次治好。\n\n四条原则：先想再写、简单优先、外科手术式修改、目标驱动执行，专治乱假设、过度设计、顺手乱改代码。\n\n🔗 直达：https://t.co/tVh0zOVEG7\n\n一个文件就是一位资深架构师在旁边盯着你的 AI。22.4 万星还能一天涨 702 星，大道至简！\n\n🟢🟢🟢\n\n4. alchaincyf/huashu-design\n\n花叔的设计 Skill 3.0，在 Agent 里打一句话，拿回能交付的网页、App 原型、可编辑 PPT、动画和信息图。\n\n先出六张缩略图挑三个方向，84 种带样张的风格库兜底，Claude Code、Cursor、Codex、Hermes 都能装。\n\n🔗 直达：https://t.co/u60vq9oRbK\n\n设计师的饭碗被一句 prompt 端走了一半！409 星一天，告别 AI slop 从这里开始！\n\n🟢🟢🟢🟢\n\n5. nightly-labs/openbot\n\n本地优先的桌面工作区，给 Codex、Claude、Grok 等 Agent 各配专属工位、任务队列、文件传输和内嵌浏览器。\n\nAgent 之间还能互发消息、协作接力（开发预览版，权限很大，只跑你信得过的任务）。\n\n🔗 直达：https://t.co/5WJyUKWSvL\n\n一台电脑就是一间 AI 办公室，Claude 和 Grok 坐一桌开会！312 星一天，AI 同事时代真的来了！\n\n⚠️⚠️\n\n总结：\n今天的榜单说明一件事：Agent 已经不缺脑子，缺的是「工位、眼睛和规矩」。谁先给 Agent 配好 IDE、情报网和行为准则，谁就拿下下一波生产力革命的 C 位。","url":"https://x.com/GitTrend0x/status/2114877294892233190","createdAt":"2026-10-27T00:30:14Z","metrics":{"views":25619,"likes":312},"lang":"zh"},{"id":"2114971707962536302","author":"刘老板","handle":"leo_xiaolei","text":"卧槽！！卧槽！！卧槽！！\n\n这也开源！！直接 1439 张姿势图啊！！\n\n这在黑市不得直接卖个 199 元/份啊！\n\n做无审查版本和颜色果短句的可以一次性找齐了！！ https://t.co/wLtqzJoiRe","url":"https://x.com/leo_xiaolei/status/2114971707962536302","createdAt":"2026-10-27T06:45:24Z","metrics":{"views":84239,"likes":781},"lang":"zh"},{"id":"2114832878840463620","author":"min heo","handle":"minheo93698092","text":"드디어 그록봇 안에 Omarchy를 설치했다.\n\n그록봇안에 세상에서 지금 가장 미친 리눅스 컴퓨터를 설치해준것이다.\n여기에 이제 클로드 코드,코덱스,hermes agent를 설치하고 알아서 컴퓨터를 작동하게 만들수 있다.\n속도는 그록봇VM보다 훨씬 빠르고 정교하다는게 특징.\n그록봇VM은 내가 건드릴수 있는게 없는데,Omarchy는 완전 내가 원하는데로 만들수 있다는게 장점.\n\n이건 내가 사용하는 그록봇 사용성중 최고가 될것이다.\n곧 사용법 공개하겠습니다!\n\nThanks bro @tcballard","url":"https://x.com/minheo93698092/status/2114832878840463620","createdAt":"2026-10-26T21:33:44Z","metrics":{"views":12158,"likes":140},"lang":"ko"},{"id":"2114927673894199611","author":"小互","handle":"xiaohu","text":"OCR 模型出现吞金兽了\n\n文心 Unlimited OCR 第二代发布\n从连续解析几十页，升级到直接能把3600页哈利波特七部全吞了\n\n将文档解析的处理上限从数十页推向“无限”\n\n第二代的Unlimited OCR引入 Unlimited-Horizon Decoding Paradigm，无限跨度解码机制：\n\n具备端到端一次性吞吐数千页超长文档的能力（例如一口气解析 1200+ 页的《三体》全三册、3600+ 页的《哈利·波特》七部曲）\n\n它将文档划成多个页面块\n相邻块共享一个边界页\n\n当前块解析完成后，保留边界页的视觉 KV，以及近期输出的文本 KV\n\n进入下一块，复用这些状态\n释放已经不活跃的旧页面缓存\n\n例如，处理完第 1–10 页后，可以保留第 10 页作为边界，继续处理后面的页面\n\n这样，GPU 上主要驻留当前活动块所需的缓存，而不必驻留整本书\n\nUnlimited OCR  2重点处理的内容包括：\n\n文字和阅读顺序：认出页面上的文字，并按正确顺序排列，避免正文、脚注等内容混在一起\n\n表格和续表：识别表格里的文字、数字和行列关系。如果一张表分在两页上，尽量把它接成一张完整的表。\n\n跨页段落：判断上一页没写完的段落，是否在下一页继续，把前后内容接起来\n\n标题和章节关系：识别哪些是大标题、哪些是小标题，尽量保留文章原来的章节结构\n\n图片和图表的位置：找出页面上哪里有图片、哪里有图表，记录它们的位置","url":"https://x.com/xiaohu/status/2114927673894199611","createdAt":"2026-10-27T03:50:25Z","metrics":{"views":38754,"likes":367},"lang":"zh"},{"id":"2114856267118494178","author":"Jerry Liu","handle":"jerryjliu0","text":"OCRia-1 is the best document parsing model for complex tables in PDFs: nested headers, merged cells, no cell borders, and extreme density within a single page.\n\nIt tops multiple parsing benchmarks on table accuracy. 91.5% on ParseBench, 92.9% on olmOCR-bench, 84.1% on PulseBench-Tab, 83.2% on fr-bench-pdf2md.\n\nWe published a nice visualization below showing how the attention map shifts as we\npredict subsequent table cells :)\n\nBlog: https://t.co/PRxvOFmTLf\n\nCome check it out on LlamaParse!","url":"https://x.com/jerryjliu0/status/2114856267118494178","createdAt":"2026-10-26T23:06:40Z","metrics":{"views":8004,"likes":155},"lang":"en"},{"id":"2114931847088283865","author":"Aircle｜AIコミュニティ","handle":"AiAircle34052","text":"【速報】これは見逃したらダメ🚨\nClaude Code に入れるだけで「AIっぽいサイト」を卒業できる Web デザインスキルを、MotionSites が無料公開👀\nhttps://t.co/hpVnspWWYP\n\n今まで：\n「いい感じの紹介ページを作って」→ どこかで見たようなAIっぽいサイト\nこれから：\n映像の背景や3D素材が動く、映画のようなサイト\n\nこのスキル1つに、次の中身がまとまっている。\n・プロンプト例 40個\n・映像素材 50本以上＋3Dの切り抜き素材 30点\n・動きや演出の技法レシピ 55個以上（動くコード付き）\n・できた画面を Claude が自分でスクショして直す確認の流れ\n\nつまり、\n「見た目は人が直す」から「AIが自分で見て直す」へ。\nしかも導入はこの2行だけ👇\n/plugin marketplace add Motionsites-AI/claude-skill\n/plugin install motionsites-web-builder@motionsites\n\nもう\n「生成した瞬間にAI製とバレる」\n「毎回デザインを手で整える」\nそんな状態は、もう続けなくていい。\n\nこれは\nただのプロンプト集じゃない。\nClaude にデザイナーの手持ちの素材と技を丸ごと渡すスキル。\n詳細はこちら👇","url":"https://x.com/AiAircle34052/status/2114931847088283865","createdAt":"2026-10-27T04:07:00Z","metrics":{"views":5276,"likes":61},"lang":"ja"},{"id":"2114709444974317619","author":"ねむプロ","handle":"nemhiyo","text":"「開発フォルダお掃除」スキルをGitHubで無料公開しました！🧹\nCodexで開発していて大量に増殖するworktreeや検証用フォルダに困り大掃除をした結果、不要なワークツリー17件を撤去。\nその経験から、安全に点検・整理するCodex用スキルを作りました。\nWindows向け・MITライセンスです。","url":"https://x.com/nemhiyo/status/2114709444974317619","createdAt":"2026-10-26T13:23:15Z","metrics":{"views":8287,"likes":179},"lang":"ja"},{"id":"2114883527485673591","author":"あっきー｜AIを現場に落とす人","handle":"Akki_AI7","text":"Claude Codeの苦手だった画像と音声、Geminiに丸投げできるようになりました。\n\nGoogleがGemini API CLIを出した。\n名前がまぎらわしいけど、新しいAIエージェントじゃない。いま使ってるClaude CodeやCodex、Cursorに「Geminiを呼ぶ道具」を1つ渡すもの。\n\nたとえると、現場監督はClaude Codeのまま。画像や動画、文字起こしが要るときだけ、Geminiという職人を呼んで作らせる感じ。段取りと覚えておくことは監督の担当。\n\nできること\n・画像、動画、読み上げの音声、音楽を作る\n・PDF、画像、音声、動画、YouTubeのURLを読んで質問に答える\n・録音を文字起こし（md／json／字幕のsrt）\n・Deep Researchを裏で走らせる\n\n入れ方は、コマンド1行でインストールして、Google AI StudioでAPIキーを作るだけ。CLAUDE.mdに貼る文面も公式のREADMEに載ってて、それを入れておけばClaude Codeが自分から呼ぶようになる。\n\nお金の話\n・文字起こし、ファイルの読み取り、読み上げは無料枠で試せる\n・画像、動画、音楽を作るのは有料枠が必要\n・無料枠は、入力がGoogleの改善に使われる\n\n僕がいちばん効くと思うのは文字起こし。会議の録音やYouTubeを「文字起こしして要点まとめて」とClaude Codeに頼むだけで、裏でGeminiが起こして、Claudeがまとめる流れが作れる。\n\nまだベータなので、仕事のファイルは選んで渡すのがいい。とくに無料枠に社外秘は流さないほうがいい。","url":"https://x.com/Akki_AI7/status/2114883527485673591","createdAt":"2026-10-27T00:55:00Z","metrics":{"views":16547,"likes":135},"lang":"ja"},{"id":"2114957568326185344","author":"小墨同学","handle":"xiaomovps","text":"玩 Grok BOT 必须知道的 5 个网站🔥\n\n最近都在深度分享 Grok BOT 相关的内容，然后花时间整理了一下 Grok BOT 相关的资源，发现除了官方的模板市场，还有不少社区网站专门收集别人分享的 Bot、提示词和自动化方案\n\n分享 5 个值得收藏的网站\n\n1、Grok Bot Marketplace：官方模板市场\n\n🔗 https://t.co/glYLtcoQEi\n\n这是最应该先看的网站，官方已经把现成的 Bot 按 Engineering、Sales、Marketing、Design、Personal、Operations 等类别整理好了\n\n比如 SEO 内容生成、代码开发、QA 测试、销售线索研究等，都可以直接搜索对应的 Bot，找到合适的模板后添加使用\n\n2、Grok Bot Index：搜索大量现成模板\n\n🔗 https://t.co/OS9WnbfrAp\n\n这个网站目前收录了 487 个公开模板，还整理了 X 上的创作者和热门 Bot\n\n你可以直接搜索自己想做的事情，比如监控网站、整理邮件、辅助编程、生成内容等，找到对应的 Bot\n\n我觉得它最大的价值，就是不用先知道 Bot 叫什么，只需要描述自己想完成的任务，就能开始找方案\n\n3、Grokdex：发现社区热门 Bot\n\n🔗 https://t.co/zwTsRjMqEA\n\n这是一个社区维护的公开 Bot 排行榜，可以按类别浏览，也能查看热门模板和用户投票\n\n如果你不知道现在有哪些值得尝试的 Bot，可以先来这里看看别人都在用什么，再根据自己的需求挑选\n\n4、AI Agents Grok Bot Hub：按使用场景找 Bot\n\n🔗 https://t.co/7oOf9JSgl6\n\n这个目录把 Bot 和插件放在一起，目前页面列出了 273 个 Bot 和 19 个插件\n\n分类包括编程、工作流自动化、研究、内容营销、浏览器自动化、数据分析等\n\n如果你已经明确自己想让 Grok BOT 帮你完成什么任务，这个网站会比较方便，可以直接按场景筛选\n\n5、Awesome Grok Bot：研究提示词和配置\n\n🔗 https://t.co/xyXoqHYvnM\n\n这是一个 GitHub 开源项目，专门收集不同用途的 Grok Bot 模板\n\n比较有价值的是，它不仅列出 Bot，还整理了对应的完整提示词、集成工具和原始创作者\n\n如果你不满足于直接使用现成模板，而是想研究别人是怎么设计 Bot 的，再按照自己的工作流修改，这个项目值得看看\n\n我自己的使用思路是，先去官方 Marketplace 找现成方案，再用 Grok Bot Index 搜索同类 Bot，最后参考 GitHub 上的提示词和配置\n\n很多时候，我们缺的不是再找一个 AI 工具，而是找到一个已经有人验证过思路的工作流\n\n与其每次从零开始折腾，不如先看看社区里已经有哪些现成方案，再把它们改成适合自己的 Bot\n\n这 5 个网站建议先收藏起来，以后玩 Grok BOT 的时候应该能省下不少时间","url":"https://x.com/xiaomovps/status/2114957568326185344","createdAt":"2026-10-27T05:49:12Z","metrics":{"views":11230,"likes":100},"lang":"zh"},{"id":"2114891628561510544","author":"awe0","handle":"awe0_io","text":"目前看到的最猛 AI Logo 工具「Rikyu」。\n\n跟一般 AI 生图不太一样，它是直接用「几何图形去构造 Logo」。\n\n你只要给它一段描述，它就会真的用圆、线条、几何图形去设计。\n\n我觉得这条路线蛮值得关注。\n\n因为如果 AI Design 最后只是「更快地生成图片」，那跟 Midjourney、GPT Image 的差异其实有限。\n\n但如果 AI 开始理解：\n\n比例、几何、版面、视觉系统、设计规则，\n\n那才真的比较像是在取代「设计工具」本身。","url":"https://x.com/awe0_io/status/2114891628561510544","createdAt":"2026-10-27T01:27:11Z","metrics":{"views":67342,"likes":1876},"lang":"zh"},{"id":"2114996566755037275","author":"蓝哥AI","handle":"0xlangeai","text":"Grok Bot 做量化有点强啊 ! ! ! \n\n海外博主搭的交易终端丢了 44.82 美元，一觉醒来账户变成 11,643.21 美元，全程没手写一行代码。","url":"https://x.com/0xlangeai/status/2114996566755037275","createdAt":"2026-10-27T08:24:10Z","metrics":{"views":10231,"likes":52},"lang":"zh"},{"id":"2114671379572502791","author":"kaito","handle":"cu30rry_","text":"私の環境の3本柱は Grok Bot・Cursor Projects・pstack だ\n\nそれぞれの役割は：\n- Grok Bot：Outer Loop\n- Cusor Projects：Inner Loop\n- pstack：Cursor Projects が使用する道具\n（ここに、e2e や thermos など私のお気に入りの道具も加わっている）\n\nわかりやすいので、レストランを例にしようか\nGrok Botはマネージャーや給仕長で、Cursor Projects が実際のキッチンだ\n\nそして、Cursor Projects には Coodinator Agent と呼ばれる料理長がいる\nその Coodinator Agent が作業を委譲する Cloud Agent が実際に料理や皿洗いなどをする作業者だ\n\npstack は包丁や鍋（Skill）そして、キッチン全体が統制を取るための規則（Principle）および質の高いサービス・料理を提供するための仕事の手順（Playbook）を提供する\n\n人間の役割はレストランのオーナーで基本はGrok Botというマネージャーを通して依頼をするが、時にキッチンに直接出向いて依頼をすることもある\n\nキッチンに出向くときは直に現場を見る時、つまりコードベースやエージェントとのトランスクリプト（会話履歴）を分析するときなどだ\n\nもう「どうシームレスに動くか」はわかるだろうが、Grok Bot がリクエストを捌き、キッチンで行われた質の高い仕事の結果を伝えてくれるわけだ\n\nここで、重要になるのが dr eggbot の存在だ\nこの bot がいることで、pstack の規則や仕事を厳密に守らせた開発用 bot を作ることができるからだ\n\nつまり、Outer Loop というのは現場の外の世界に存在するコンテキストを調達する係だ\n食材がなければ、料理は作れないし、そもそもリクエストがなければ、どんな仕事をしたらいいかわからないでしょ？\n\nそして、Outer Loop があるからこそ、人間は長時間席を外しても良い状態が作れる\nOuter Loopは外のこと、つまり外界で起こる問題やイベントをトリガーに Projects を起動する役割も担える、ということだ\n\n一方、Inner Loop はコードベースという開発環境を担当する、担当する範囲は本当にコードベースだけで、CI失敗・PRにコメントが付いた場合もGrok Botがそれを見てProjectsを起動させるようにしたほうが、レストランは上手く回る","url":"https://x.com/cu30rry_/status/2114671379572502791","createdAt":"2026-10-26T10:52:00Z","metrics":{"views":12612,"likes":155},"lang":"ja"},{"id":"2114916230226391550","author":"ギア","handle":"giaaibusi","text":"AI美女「ポージング」データベース無料公開！\n\n「このポーズに変えて」だけで使えるように\n1,439枚のポーズ集をデータベース化しました\n\n・無料\n・商用利用OK\n・編集、二次利用OK\n\n引用元の記事からお受け取り下さい https://t.co/bdXOVNtyua","url":"https://x.com/giaaibusi/status/2114916230226391550","createdAt":"2026-10-27T03:04:57Z","metrics":{"views":72345,"likes":1655},"lang":"ja"},{"id":"2114975066903728193","author":"SOU⚡️投資ニュース / 米国株・日本株・仮想通貨・AI","handle":"SOU_BTC","text":"🚨【速報】OpenAI CodexとClaude Codeに乗っ取りリスク\n\n・悪意あるテキストをAIが読み込み、不正な命令を実行する恐れ\n・研究者の実験でCodexは90%超、Claude Codeは約50%の攻撃成功率\n・マルウェア実行やログイントークン流出の危険性","url":"https://x.com/SOU_BTC/status/2114975066903728193","createdAt":"2026-10-27T06:58:44Z","metrics":{"views":89063,"likes":341},"lang":"ja"},{"id":"2115010358310305921","author":"Gota","handle":"gota_bara","text":"AnthropicのZero Trust for AI agentsのPDFは、AIエージェント作ってるなら目を通した方が良さそうだ！めちゃ勉強になる！","url":"https://x.com/gota_bara/status/2115010358310305921","createdAt":"2026-10-27T09:18:59Z","metrics":{"views":995,"likes":19},"lang":"ja"},{"id":"2114867142286078359","author":"Oliver Prompts","handle":"oliviscusAI","text":"The entire RAG industry is getting challenged by… a single file 🤯\n\nIt’s called Memvid. It packages your agent’s data, embeddings, search index and metadata into one portable `.mv2` file.\n\nThe original version used MP4. The current version uses a purpose-built binary format.\n\n- No separate database server\n- Built-in text and vector search\n- Append-only memory with history tracking\n- Local, offline retrieval\n- Python, Node.js, Rust and CLI support\n\nYour agent’s memory becomes something you can copy, move and search without running a separate database service. \n\n100% open-source.","url":"https://x.com/oliviscusAI/status/2114867142286078359","createdAt":"2026-10-26T23:49:53Z","metrics":{"views":15892,"likes":323},"lang":"en"},{"id":"2114822130307375202","author":"gus","handle":"igus_ai","text":"ESTA IA VA A HACKEAR TU WEB\n\nY es mejor que lo haga ella antes que otro.\n\nSe llama Shannon, es open source y ya tiene más de 49K estrellas en GitHub.\n\nLe pasas la URL de tu app y se pone en modo atacante:\n\n→ busca por dónde entrar\n→ lanza exploits reales para confirmar que el fallo existe\n→ si no consigue explotarlo, no te lo reporta\n→ y al terminar te da un informe PDF profesional + SARIF\n\nNada de listas infinitas de \"posibles riesgos\". Solo lo que de verdad se puede romper.\n\n¿Y lo que cuesta?\n\nUn pentest tradicional cuesta miles.\n\nEn el benchmark público, la ejecución más barata (con DeepSeek) costó 6,10 $ y aun así encontró la SQL injection crítica.\n\nAdemás, puedes usar el modelo que quieras: Grok, Claude, GPT, DeepSeek o uno local.\n\nY como corre en GitHub Actions y GitLab CI, puedes testear la seguridad cada vez que publicas.\n\nEnlace en el primer comentario👇","url":"https://x.com/igus_ai/status/2114822130307375202","createdAt":"2026-10-26T20:51:02Z","metrics":{"views":58348,"likes":810},"lang":"es"},{"id":"2114695683932614899","author":"苏茶","handle":"Suercha007","text":"还记得 jev 吗？\n\nvLLM 团队开源了一个新的 Jev 模型 d3-turbo，视觉榜第一被它拿下了。\n\nJev Decision Index 0.4.1 上，55 个视觉决策模型里它 72.46 分登顶。文本榜 67.31，比 TypeSafe 最新的 Jev 1.14（60.24）和 Cloudflare 的 Clef（54.92）都高，六个分项全部领先。\n\n比上一代强在哪：同样对一张图问 255 个问题，上一代 d3-flash 要 32.94 秒，它 2.12 秒，快 15.5 倍。因为它只读一次，上一代每问一题重读一遍。\n\n问题越多，它越占便宜。只问一两道，它反而不如上一代快。\n\n另外它不止能做选择题。框选、视频目标跟踪都行。问它画面里某个东西在哪，返回一个框加置信度，目标不存在就给 0，不硬编。\n\n26.09B 参数，Apache-2.0，一张 GPU 就能部署。官方还放了个免费在线体验。","url":"https://x.com/Suercha007/status/2114695683932614899","createdAt":"2026-10-26T12:28:34Z","metrics":{"views":8554,"likes":154},"lang":"zh"},{"id":"2114959510590886121","author":"生成AIに人生捧げた人｜大束良明","handle":"otsukaroom","text":"GMOの不正アクセスで個人情報漏洩。個人開発者も明日は我が身です。\n\nCodex Securityの利用に必要なFIDO2物理キー、普通に買うと高いですが実はお得に入手できます\n👇\n物理キー（YubiKey等）の価格比較\n・Amazon：約26,200円（在庫切れ多め）\n・OpenAI経由：約13,000円 👈おすすめ\n\n自分のプロジェクトとユーザーの情報を守るためにも早めの導入が安心です。\n\n▼設定＆購入リンク\n・高度なアカウントセキュリティhttps://t.co/8WUOHpps70\n・OpenAI提携サイト物理キーhttps://t.co/P9P6cJ1o7S\n\n・Amazon\nYubiKey 5C NFC\nhttps://t.co/yyjm5MPfB7\nYubiKey 5C Nano","url":"https://x.com/otsukaroom/status/2114959510590886121","createdAt":"2026-10-27T05:56:56Z","metrics":{"views":2830,"likes":9},"lang":"ja"},{"id":"2115001675094069596","author":"Culture Lab TS S.L.","handle":"CulturelabTS_","text":"¡Curso de #IAAgéntica con #Claude! Diseña agentes autónomos con #ClaudeCode, servidores #MCP, #AgentSDK y arquitecturas multi-agente. \n\n🕐24H | 💲Desde 550€ IVA Ext. | 🏢Presencial / 💻Telepresencial \n\n📲Más info: https://t.co/erlgme9LDJ","url":"https://x.com/CulturelabTS_/status/2115001675094069596","createdAt":"2026-10-27T08:44:28Z","metrics":{"views":194,"likes":9},"lang":"es"},{"id":"2114847015091794206","author":"Deni","handle":"0xDeniAi","text":"this is getting f*cking dangerous...\n\nREA creator just dropped 20 GitHub repos to build a f*cking reverse engineering studio:\n\n[01] analysis core\n\u003e REA: a single MCP that plugs into everything https://t.co/78k8zO6CUv\n\u003e Ghidra: decompiler, free https://t.co/T4UwApebCS…\n\u003e GhidraMCP: lets your agent drive Ghidra https://t.co/TJhvovWOVJ…\n\u003e ida-pro-mcp: hooks your agent into IDA Pro https://t.co/xm7FUywscM…\n\n[02] mobile \u0026 apps\n\u003e jadx: turns Android APKs back into Java https://t.co/E4Yg0NKeQN\n\u003e Apktool: take APKs apart and put them back together https://t.co/Dx5Mxj6Xst…\n\u003e Frida: hook into apps while they run https://t.co/J7VPj371J9\n\u003e ILSpy: decompiles .NET https://t.co/dbnyEBZMSU…\n\n[03] binary \u0026 low-level\n\u003e radare2: RE framework that lives in your terminal https://t.co/0zjfDIkiTm…\n\u003e x64dbg: debugger for Windows https://t.co/D4fskuXqhJ\n\u003e ImHex: hex editor with its own pattern language https://t.co/tRLAMVCOH4\n\u003e angr: symbolic execution engine https://t.co/GNA0rXyuu7\n\n[04] network \u0026 runtime\n\u003e mitmproxy: sits in the middle and reads the traffic https://t.co/aexBKlRIPt…\n\u003e dnSpy: debug and edit .NET apps https://t.co/5VMhkWlxSS\n\u003e rizin: the radare2 fork https://t.co/V0eGBoTMBY\n\u003e raddebugger: the debugger from Epic Games https://t.co/UR4huJ2fEn…\n\n[05] rebuild \u0026 verify\n\u003e awesome-ai-reverse-engineering: 122 repos, every one graded https://t.co/nnfVgcjPyD…\n\u003e awesome-reverse-engineering: curated by the guy who made REA https://t.co/psahTNrb0m…\n\u003e REA workflows: ready-made investigation prompts, ship with REA\n\u003e clean-room loop: SPEC.md, oracles and checks until it matches\n\nhow it runs: binary -\u003e REA -\u003e SPEC.md -\u003e rebuild -\u003e oracle -\u003e retry\n\nsave this, point it at any app and watch it explain itself.","url":"https://x.com/0xDeniAi/status/2114847015091794206","createdAt":"2026-10-26T22:29:55Z","metrics":{"views":30611,"likes":525},"lang":"en"},{"id":"2114977160947712456","author":"StudioYebisu","handle":"studio_yebisu","text":"今のプロジェクトが終わったらやることリスト","url":"https://x.com/studio_yebisu/status/2114977160947712456","createdAt":"2026-10-27T07:07:04Z","metrics":{"views":4231,"likes":56},"lang":"ja"},{"id":"2114770287216771293","author":"Hux","handle":"huxlab","text":"今晚别刷Netflix了。\n\n去看这个SpaceX AI工程师1小时的课程。\n\n这是我见过最清晰、端到端讲透GrokBot到底该怎么真正用起来的课。\n\n从单agent开始，一路到loop、graph、多智能体协作、verification和agent-friendly架构。\n\n不管你是从没认真跑过agent，还是已经天天在用GrokBot，看完都会把很多“原来如此”的点一次打通。\n\n真正核心就这几层： \n\n1. 99%的人只用1个agent，没用loop和graph，只发挥了1%实力 \n\n2. 真正的新stack是Chief of Staff + PM + 20+ workers全自主团队 \n\n3. 怎么用高质量skills让agent像真工程师一样干活（pstack） \n\n4. 怎么把代码和架构改成agent-friendly（Dune、contract、CI） \n\n5. 怎么用verification让自己真正敢把活交给它们，而不是一直盯着\n\n大多数人花好几个月才拼出的全景图，这节课直接给你画完。\n\n把时间空出来，这可能是你这个月最值的一堂课。","url":"https://x.com/huxlab/status/2114770287216771293","createdAt":"2026-10-26T17:25:01Z","metrics":{"views":78578,"likes":892},"lang":"zh"},{"id":"2114770597922111798","author":"Lumix","handle":"lumixsv","text":"This is getting f*cking ridiculous. SpaceXAI lead engineer:\n\n\"Everyone keeps adding agents. Almost nobody adds a checker. Our 17 Grok agents ran 1,284 tasks last night, the checker caught 3 bad ones, nothing broken shipped\"\n\nThis is that mesh running overnight\n\nGrok Bot → Chief of Staff → PM → 15 agents → Checker → Verified output\n\n15 agents do the work: research, leads, posts\n\nThe checker reads every result before it ships\n\nRejected tasks go back and run again\n\nWatch for the 3 red flashes, that's the checker saying no\n\nSpeed is cheap now. Trust isn't\n\nAnyone can spin up 17 bots, almost nobody puts a checker between them and the world\n\nWorth more than most $1,000 agent courses\n\nBookmark and watch it today\n\nSend this to the friend still running one bot\n\nThen read how to build your first Grok Bot desk in the article below ↓","url":"https://x.com/lumixsv/status/2114770597922111798","createdAt":"2026-10-26T17:26:15Z","metrics":{"views":11844,"likes":133},"lang":"en"},{"id":"2114923744808378460","author":"Shirube - AI Agent","handle":"cloud8wq","text":"CursorのAgent SDKで、PRレビューなどをするエージェントを、指示はMarkdown、道具はTypeScriptで書いて作れるようになった。\n・評価テストも組み込みで、指示や道具を変えたら良くなったか測れる\n・PRが来た時、Slackで呼ばれた時、決まった時刻に動き出す\n・動かす場所はCursorのサーバーでも自分のサーバーでもいい\n・投稿では、エージェントをコードとして定義できると紹介されてる","url":"https://x.com/cloud8wq/status/2114923744808378460","createdAt":"2026-10-27T03:34:48Z","metrics":{"views":40,"likes":1},"lang":"ja"},{"id":"2114981070244655299","author":"Naoki Akai（赤井直紀）","handle":"naokiakai","text":"ここ数ヶ月取り組んできたことが、ようやく形になってきました。\nRaspberry Pi 5 + 単眼カメラ + IMUで、Visual SLAMで作った既存地図上での自己位置推定です。GPUなし・CPUのみ。\nCPU使用率はかなりギリギリですが、フレームドロップなしでリアルタイムに動いています（入力はrosbag再生）。","url":"https://x.com/naokiakai/status/2114981070244655299","createdAt":"2026-10-27T07:22:36Z","metrics":{"views":6973,"likes":225},"lang":"ja"},{"id":"2114730846426890689","author":"AK","handle":"_akhaliq","text":"Building Auditable AI Text Detectors with Sparse Autoencoders\n\npaper: https://t.co/n3rM07EZ3B","url":"https://x.com/_akhaliq/status/2114730846426890689","createdAt":"2026-10-26T14:48:18Z","metrics":{"views":21841,"likes":173},"lang":"en"},{"id":"2114984553639276644","author":"みのるん","handle":"minorun365","text":"先週実施した東大松尾研の講座資料を公開しました！\n\nノンエンジニアの方でも、AIエージェント使った業務効率化を手軽に体験できます。職場での普及活動などにお使いください☺️","url":"https://x.com/minorun365/status/2114984553639276644","createdAt":"2026-10-27T07:36:26Z","metrics":{"views":12363,"likes":280},"lang":"ja"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-27T19:12:23+09:00","posts":[{"id":"2114694287103529160","author":"KIRIN 🦒🗼","handle":"Kirinsan4567","text":"Xのアルゴリズム変更だそうです。\n私の様な小規模アカウントが不利だった状況が改善されるみたい😇\n評価されるポストと、やってはいけないポイントをまとめてみました。\n※特に個人的に気になったものには💡マークをつけました。\n⬇️\n\u2028【評価されるポスト】\n\n❶投稿のタイミング：新しい投稿が優遇されるのは、投稿から2時間以内・表示200回まで。深夜に出すと誰も見ないまま終わるので、フォロワーがXを見ている時間に投稿する。48時間経つとおすすめに出なくなる\n\n❷評価が高い反応：リンクのコピー共有で20点、相互フォロー同士のリプで20点、リプ・引用・DMでの共有5点、フォローされる4点、いいね0.66点（過去最大）\n👉 リンクのコピー共有（20）は、いいね（0.66）の約30倍重視されているという意味\n\u2028❸じっくり読まれる：読まれた時間の評価が以前の1.5倍に。開いて10秒以上読まれると0.4点\n\u2028❹フォロワー外に広がる条件：届くのは自分のオリジナル投稿だけ。最初に見た人のいいね率が高いほど伸びる。1つ目と32個目のいいねで、フォロワー外への表示が増える。フォロワー5万人以下なら、新しい投稿1件がおすすめの約16番目まで上がることも\n\u2028❺投稿は1つに絞る：フォロワーのタイムラインに自分の複数の投稿が入ると、2つ目は評価が62%に下がる。数時間あけても重なることがあるため、本数より1件の質を優先💡\n\u2028❻その他：動画は10秒以上見られないと動画のおすすめに載らない。📍ピン留めの投稿にリンクがある場合、そのリンク先をXが低評価と判定すると、アカウントに7日間マークされる（判定基準は不明）\n\n【やってはいけないこと】\u2028\n❶「興味なし」を押されるような投稿をしない：大幅減点（-52.27）。開いてすぐ閉じられる内容も加点はわずか（0.3）💡\n\u2028❷動画だけに頼らない：動画は開かれても0.02点、見られても0点。動画のおすすめに載るには10秒以上の視聴が必要\n\u2028❸ブックマーク狙いをしない：保存されても0点💡\n\u2028❹ハッシュタグを並べない：いくつ付けても評価は上がらない\n\u2028❺リプやRPで広めようとしない：フォロワー以外には表示されない\n\u2028❻古い投稿に期待しない：投稿から48時間でおすすめに出なくなる\n\u2028❼深夜に投稿しない：誰も見ないまま、投稿直後2時間の優遇が終わる💡\n\u2028❽連投しない：自分の投稿同士で評価を食い合う💡\n\u2028❾誤情報や質の低い投稿をしない：そう判定されると、フォロワー以外はいいねや共有ができなくなる💡\n\u2028➓暴言を書かない：フォロワー以外に表示されなくなる💡\n\u2028⓫成人向け画像・動画を続けて載せない：直近5投稿中3件でアカウントに警告。警告1つでフォロワー以外に一切表示されなくなる\n\u2028⓬スパム扱いされることをしない：同じ文章の使い回し、無関係な人のタグ付け＋質の低いリンク、いいね・RPのおねだり（フォロワー数に関係なく対象）\n\u2028⓭人気アカウントのリプ欄で、自分のリプに自分でリプを重ねない：評価がゼロになる恐れ\n\u2028⓮動画に宣伝を紛れ込ませない：64いいねで審査、512いいねでさらに厳しく\n\n⓯ピン留め投稿📍に評価の低いリンクを貼らない：アカウントに7日間マークされることがある（判定基準は不明）","url":"https://x.com/Kirinsan4567/status/2114694287103529160","createdAt":"2026-10-26T12:23:01Z","metrics":{"views":19182,"likes":191},"lang":"ja"},{"id":"2114738425567891579","author":"SI Axiom","handle":"SIAxiom","text":"最近发现 Grok Bot 有个挺实用的玩法：研究 X 上那些粉丝不多、帖子却经常爆火的账号。\n\n以前看到热门帖子，顶多收藏一下。现在可以让 Grok Bot 帮忙找账号、分析帖子、挖评论区的问题，再整理成自己的选题库。\n\n整理了 6 个具体操作步骤，做 X 内容、个人 IP 或 B2B 营销的可以试试。\n\n1. 找到值得研究的账号\n\n打开 Grok Bot，输入以下指令：\n\n「搜索 X 上讨论 AI 自动化、SaaS 和 B2B 获客的活跃账号，筛选 10 个近期出现过高互动帖子的账号，优先关注粉丝量在 1,000–20,000 之间的账号。返回账号链接、粉丝数和代表帖子链接，无法核实的数据标记为未知。」\n\n核对结果后，选出 5 个与你的内容定位最接近的账号。\n\n2. 筛选表现异常的帖子\n\n向 Grok Bot 输入以下指令：\n\n「搜索选定的 5 个账号最近 30 天的公开帖子，筛选互动明显高于账号日常水平的内容。返回原帖链接、发布时间、点赞数、回复数、转发数及可获取的浏览量，缺失数据标记为未知。」\n\n重点关注平时只有几十次互动，某篇却突然达到几百甚至上千次的帖子。\n\n同时检查是否被大账号转发、是否受到热点事件影响，避免误判。\n\n3. 从评论区挖掘选题\n\n向 Grok Bot 输入以下指令：\n\n「读取筛选出的帖子下能够访问的回复，整理用户反复提出的问题、实际遇到的困难，以及原作者没有充分解答的疑问。按问题类型分类，标注重复出现的次数，并附上对应评论链接。」\n\n比如一篇 AI Agent 演示帖下面，很多人询问部署成本、客户收费、故障处理。\n\n这些具体问题就值得继续研究，尤其是被多人追问、却缺少完整解答的内容。\n\n4. 拆解写法，加入自己的经验\n\n向 Grok Bot 输入以下指令：\n\n「分批分析 20 篇有代表性的高互动帖子，每批 5 篇。提取每篇的开头、核心观点、案例和内容结构，总结可复用的写作框架，并附上参考帖子链接。」\n\n选一个熟悉的话题，再输入：\n\n「围绕这个主题采访我，每次只问一个问题，重点追问真实经历、具体做法、遇到的问题和实际结果。采访结束后整理成 3 个不同风格的推文版本，不要添加我没有提供的事实。」\n\n选择最符合自己表达习惯的版本，修改后发布。\n\n5. 用实际数据复盘\n\n向 Grok Bot 提供自己记录的发布数据，并输入以下指令：\n\n「分析表格中的推文表现，按主题和内容结构比较曝光量、互动率、收藏率及关注转化情况。找出表现相对较好的内容类型，并说明判断依据。样本不足时不要直接得出结论。」\n\n建议记录：\n\n日期、主题、帖子链接、曝光、点赞、回复、转发、收藏\n\n商业账号可以额外记录新增关注和有效咨询。\n\n6. 把流程变成定期任务\n\n首次完成研究并核对结果后，向 Grok Bot 输入以下指令：\n\n「将已经验证可执行的账号研究、帖子筛选和评论分析流程保存为 Skill，并创建每周执行的 Routine。每周检查指定的 5 个账号，整理最近 7 天的高互动帖子、评论区高频问题和候选选题。每条结果附原始链接，缺失数据标记为未知，执行失败时报告原因。」\n\n确认 Skill 和 Routine 创建成功后，再检查首次定期运行的结果。\n\n需要注意，Grok Bot 可以搜索 X 上的公开内容，但不保证获取完整的历史帖子和互动数据。涉及精确日期过滤或大规模检索，可以进一步使用 Grok API 的 X Search。\n\n第一次尝试，建议从小规模开始：\n\n5 个账号、最近 30 天、10 篇候选帖子。\n\n从评论区整理真实问题，挑出 3 个自己熟悉的主题，完成写作和发布。\n\n跑通后再扩大范围。\n\n以后准备发推，直接打开整理好的选题库，找到有依据、自己又有经验的话题，就可以开始写了。\n\n比每天刷半天 X，最后还不知道发什么实在得多。","url":"https://x.com/SIAxiom/status/2114738425567891579","createdAt":"2026-10-26T15:18:25Z","metrics":{"views":7987,"likes":82},"lang":"zh"},{"id":"2114940685082337561","author":"Hailey","handle":"HaileyAILabs","text":"终于做出来了！\nMuse + Claude Opus 5.5 联手打造的 3D 二次元少女 MV！\n\n制作过程其实就 5 步：\n- GPT 设计少女角色\n- Muse 生成舞蹈视频\n- Opus 识别舞蹈动作\n- Opus 根据舞步编排音乐\n- Opus 用纯代码打造 3D 舞台，让灯光、特效和镜头跟着节奏变化\n\n如果大家感兴趣，我再写一篇详细的制作教程，从角色设计到最终 MV，分享出来","url":"https://x.com/HaileyAILabs/status/2114940685082337561","createdAt":"2026-10-27T04:42:07Z","metrics":{"views":24201,"likes":557},"lang":"zh"},{"id":"2114875593162698894","author":"satounbd","handle":"satounbd","text":"イラストから3Dイラストアニメーション作成の進捗\n\nイラストからLoRAで360度動画を生成→\n基準角度ごとにSee-throughでイラスト分解→\nさらに髪の毛を房ごとに画像生成で分解→\nパーツをメッシュ化してIDを付与。3D空間で一意にする→\nパーツに分解したイラストを対応づけ→\n動かす\n\n本当、See-throughニキが神すぎる","url":"https://x.com/satounbd/status/2114875593162698894","createdAt":"2026-10-27T00:23:28Z","metrics":{"views":10100,"likes":314},"lang":"ja"},{"id":"2114941964043092017","author":"スナガク | Codexではじめるエージェンティックコーディング","handle":"suna_gaku","text":"Grok Bot の X 連携が無料になった！\n開発者アカウントも X API のクレジットも不要です！\n\nここはデカすぎる...このためだけに Grok Bot 課金するまであるな...","url":"https://x.com/suna_gaku/status/2114941964043092017","createdAt":"2026-10-27T04:47:12Z","metrics":{"views":6708,"likes":66},"lang":"ja"},{"id":"2114977428682809759","author":"小墨同学","handle":"xiaomovps","text":"Grok Bot 重大更新，X 运营自动化还免费🔥\n\n上周 GrokBot 官方取消了使用 Grok Bot 中的 X 连接器所需的开发者账户和 X API 积分要求\n\n免费功能：\n\n1、读你自己的账号：主页时间线、提及、点赞、收藏夹、关注者和关注列表\n\n2、搜全站帖子，查话题发帖量、X 新闻和各地趋势\n\n3、读私信和私信请求，汇总未读\n\n4、管 List：建列表、加人，一次读完里面所有人的新帖\n\n5、起草 X 文章，只存草稿不发布\n\n6、排通话日程，预约直播\n\n尤其是对于我这种长期在运营 X 相关的内容的人，基本上是天大的福利，很多事情都可以自动化完成了\n\n我最烦的文章排版功能也可以直接使用 GrokBot 完成，看来 Grok BOT 整体的含金量还在上升","url":"https://x.com/xiaomovps/status/2114977428682809759","createdAt":"2026-10-27T07:08:08Z","metrics":{"views":4839,"likes":31},"lang":"zh"},{"id":"2114891628561510544","author":"awe0","handle":"awe0_io","text":"目前看到的最猛 AI Logo 工具「Rikyu」。\n\n跟一般 AI 生图不太一样，它是直接用「几何图形去构造 Logo」。\n\n你只要给它一段描述，它就会真的用圆、线条、几何图形去设计。\n\n我觉得这条路线蛮值得关注。\n\n因为如果 AI Design 最后只是「更快地生成图片」，那跟 Midjourney、GPT Image 的差异其实有限。\n\n但如果 AI 开始理解：\n\n比例、几何、版面、视觉系统、设计规则，\n\n那才真的比较像是在取代「设计工具」本身。","url":"https://x.com/awe0_io/status/2114891628561510544","createdAt":"2026-10-27T01:27:11Z","metrics":{"views":67342,"likes":1876},"lang":"zh"},{"id":"2114770597922111798","author":"Lumix","handle":"lumixsv","text":"This is getting f*cking ridiculous. SpaceXAI lead engineer:\n\n\"Everyone keeps adding agents. Almost nobody adds a checker. Our 17 Grok agents ran 1,284 tasks last night, the checker caught 3 bad ones, nothing broken shipped\"\n\nThis is that mesh running overnight\n\nGrok Bot → Chief of Staff → PM → 15 agents → Checker → Verified output\n\n15 agents do the work: research, leads, posts\n\nThe checker reads every result before it ships\n\nRejected tasks go back and run again\n\nWatch for the 3 red flashes, that's the checker saying no\n\nSpeed is cheap now. Trust isn't\n\nAnyone can spin up 17 bots, almost nobody puts a checker between them and the world\n\nWorth more than most $1,000 agent courses\n\nBookmark and watch it today\n\nSend this to the friend still running one bot\n\nThen read how to build your first Grok Bot desk in the article below ↓","url":"https://x.com/lumixsv/status/2114770597922111798","createdAt":"2026-10-26T17:26:15Z","metrics":{"views":11844,"likes":133},"lang":"en"},{"id":"2114710075059351902","author":"FactToon","handle":"facttoon","text":"X 알고리즘이 업데이트됐어.\n내가 중요하다고 생각한 것들만 몇 개 나눠볼게.\n\n✅알고리즘 변경에 따라 해야 할 일:\n- 새 게시물은 처음 2시간 동안, \n   그리고 조회수 200회 이내에만 가장 큰 효과를 \n   발휘하므로, 팔로워들이 온라인 상태일 때 게시할 것.\n- 좋아요는 개당 0.66의 영향력을 가지며, \n그 어느 때보다 중요함.\n- 맞팔들과 대화할 것. 서로 주고받는 답글은 \n    5점이 아닌 20점을 받음.\n- 오리지널 게시물만이 팔로워 기반 외의 \n   다른 사람들에게도 전달됨.\n- 같은 피드에 올리는 두 번째 게시물은 \n   첫 번째 게시물의 62% 가중치를 가지므로, \n   가장 좋은 게시물을 선택할 것.\n- 동영상은 동영상 목록에 포함되려면 \n   여전히 10초 이상이어야 함.\n- 잘못된 링크가 포함된 고정 게시물은 \n   계정을 7일 동안 차단할 수 있으므로 확인 후 올릴 것.\n\n✅절대 해서는 안 되는 행동:\n- 재활용된 문구는 복사 붙여넣기 스팸으로 \n   분류될 수 있음.\n- 품질이 낮거나 허위 정보로 분류된 게시물에는 \n   경고 표시가 붙으며, 팔로워 외에는 아무도 \n   좋아요를 누르거나 공유할 수 없음.\n- 게시물을 연속해서 올리면 서로 경쟁하게 됨.\n- 답글과 리포스트는 팔로워에게만 전달됨.\n- 최근 5개 게시물 중 3개에 성인 콘텐츠가 \n   포함된 경우 계정에 경고 라벨이 부착됨.\n--------------------\n전제 업데이트 정보는 원글에서 확인할것.","url":"https://x.com/facttoon/status/2114710075059351902","createdAt":"2026-10-26T13:25:45Z","metrics":{"views":208930,"likes":1890},"lang":"ko"},{"id":"2114875985384689883","author":"オープンソース研究所","handle":"opensourcelab9","text":"【海外で話題】\nClaude Opus 5.5に「アニメーションをコードで書かせて」作った動画の作例集が、プロンプトつきでGitHubにまとまっています😳\nその名も ーーー awesome-opus5-5-videos！！\n\n何がすごいかというと👇\n\n・モーショングラフィックス、解説、3Dシーン、ゲームまで、HTML・Canvas・SVG・Three.jsなどのコードで描いた作例が並ぶ\n・10月12日の更新時点でプロンプト703件。ただし一部は作者が部分だけ公開、または元投稿の説明だけ\n・各作例から作者の元ポストへ飛べる\n・使い方は、プロンプトをコピー→Opus 5.5で動くエージェントに貼る→1つのHTMLとして出させる\n\nつまり\nプロンプトが公開されている作例なら、「どう頼めばこの映像が出るのか」を実物の入力で確かめてから、自分のエージェントで試せる。\n\nなお作例集の流れは、できたHTMLを画面録画して動画にする形です。HTMLの場面を日本語ナレーションつきの説明動画として書き出したいなら、別のOSS『HyperFrames』の入れ方と、かな台本で日本語の声を出す手順を記事にまとめました👇","url":"https://x.com/opensourcelab9/status/2114875985384689883","createdAt":"2026-10-27T00:25:02Z","metrics":{"views":1614,"likes":13},"lang":"ja"},{"id":"2114993942878192078","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝これは、、、炎鎮さんのGrok Botの使い方はメチャクチャ貴重ですよ！ありがたすぎるシェアに感謝です\n\nこの1枚をGrok Botの、Dr Eggbotに読ませて、\n「私の環境で足りてない部分を補いたいから相談しよう！」って投げれば良さがわかります！\n\n「マモリ」のbotは必要ですね\nありがとうございます！ https://t.co/OG5Z154UR1","url":"https://x.com/tetumemo/status/2114993942878192078","createdAt":"2026-10-27T08:13:45Z","metrics":{"views":3729,"likes":37},"lang":"ja"},{"id":"2114943805426405671","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【速報】OpenAIがGPT-6.1 Terraを公開。画面を見てアプリを操作するコンピューター操作が、速く安くなった。\n\n上位のGPT-6 Astra並みの性能が10分の1の単価で出るなら、日常業務の自動化はまずTerraで十分そう。\n\n・API料金はGPT-5.6 Terraの半額\n・Agents’ Last ExamでGPT-6 Astraと同等\n・トークン単価はAstraの10分の1\n・タスク完了はAstraやGPT-6.1 Solの3倍超の速さ","url":"https://x.com/masahirochaen/status/2114943805426405671","createdAt":"2026-10-27T04:54:31Z","metrics":{"views":12508,"likes":77},"lang":"ja"},{"id":"2114996566755037275","author":"蓝哥AI","handle":"0xlangeai","text":"Grok Bot 做量化有点强啊 ! ! ! \n\n海外博主搭的交易终端丢了 44.82 美元，一觉醒来账户变成 11,643.21 美元，全程没手写一行代码。","url":"https://x.com/0xlangeai/status/2114996566755037275","createdAt":"2026-10-27T08:24:10Z","metrics":{"views":10231,"likes":52},"lang":"zh"},{"id":"2114983484003623162","author":"Codex 研究所","handle":"codex_lab_","text":"【警告】\nCodexやClaude Codeを「ダウンロードフォルダ」で絶対開かないでください。\n\n危険な理由悪質なサイトを踏むと、罠の指示ファイル（CLAUDE.md など）が勝手にダウンロードされます。そのフォルダでAIを起動すると、AIが罠の指示に従ってPC設定を書き換え、認証情報の盗難や乗っ取りが発生します。\n\n修正されない理由\nどちらも「正常な仕様」の組み合わせによる穴のため、公式の対策アップデートは期待できません。\n\n今すぐできる対策\nAIエージェントは必ず専用の作業フォルダで起動する（ダウンロードフォルダでは絶対開かない）\nダウンロードフォルダに怪しい .md ファイルがないか確認・削除する","url":"https://x.com/codex_lab_/status/2114983484003623162","createdAt":"2026-10-27T07:32:11Z","metrics":{"views":7287,"likes":44},"lang":"ja"},{"id":"2115007033678438426","author":"PIROPIRO","handle":"egachan_ceao","text":"Museで動画作ってみました！\n色んなところでSora2感あるって聞いてたけど、確かにちょっとあるかも。\nキャラクターはめちゃくちゃですが、たった数行指示出すだけで、この動画作ってくれた。\n個人的には、鬼が剣振るっている後ろで、人が普通に参拝しているのがおもろい。\n色々試したい、手軽さがあっていいなぁ…\n無料だし、私がSora2でそうだったように、動画はじめる人のハードルが下がるとよいなぁ。","url":"https://x.com/egachan_ceao/status/2115007033678438426","createdAt":"2026-10-27T09:05:46Z","metrics":{"views":190,"likes":19},"lang":"ja"},{"id":"2114971707962536302","author":"刘老板","handle":"leo_xiaolei","text":"卧槽！！卧槽！！卧槽！！\n\n这也开源！！直接 1439 张姿势图啊！！\n\n这在黑市不得直接卖个 199 元/份啊！\n\n做无审查版本和颜色果短句的可以一次性找齐了！！ https://t.co/wLtqzJoiRe","url":"https://x.com/leo_xiaolei/status/2114971707962536302","createdAt":"2026-10-27T06:45:24Z","metrics":{"views":84239,"likes":781},"lang":"zh"},{"id":"2114730527966327047","author":"Kinopee","handle":"kinopee_ai","text":"Grok Bot の合宿なんてどうかな？超思いつきだけどw","url":"https://x.com/kinopee_ai/status/2114730527966327047","createdAt":"2026-10-26T14:47:02Z","metrics":{"views":6856,"likes":105},"lang":"ja"},{"id":"2114812920605593603","author":"make claude","handle":"make_claude","text":"我靠,花9美元就能透视你家的墙了 - GitHub上已经99.7k星了\n\n找到一个项目,看完之后在家里都觉得不自在了。叫RuView,9.97万星,MIT协议 - 也就是免费、合法,直接拿去用。\n\n硬件就是一个esp32节点,9美元。抓的是本来就飘在你家里的wifi信号,从里面提取出:房间里有没有人、有几个人、什么时候进门什么时候出门、呼吸频率、心率,甚至想拼出一个17个点的人体骨架。全程不需要摄像头。\n\n而且这还被写成了卖点:因为没有摄像头,可以绕开GDPR的视频规定和HIPAA的影像规定 - \"by design\"(设计上就是这样)。这是他们原话:你被看见了,但严格来说没人\"拍\"过你。\n\n\u003e 隔墙隔混凝土都能看 - 官方说的有效距离大概5米,停车场的场景里直接写\"穿透混凝土墙\"\n\u003e 4到6个节点组成一张网,能覆盖一整层楼 - \"软件上没有硬性上限,极限只取决于信号物理特性\"\n\u003e 通过tailscale/wireguard,在任何地方都能远程连上节点\n\u003e 列出的应用场景包括:不用认人脸的零售、儿童房、停车场、甚至教堂数人头\n\n我自己拿这个固件,用claude按自己的需求稍微改了一版 - 花了两晚上,没碰他们的私有代码,就是在公开的部分上面改的。改出来的东西,跟作者当初的设想完全不是一回事。实际效果怎么样,视频在下面。\n\n先收藏 - 等你开始算邻居家挂了多少个9美元的这玩意儿的时候用得上。","url":"https://x.com/make_claude/status/2114812920605593603","createdAt":"2026-10-26T20:14:26Z","metrics":{"views":58676,"likes":846},"lang":"zh"},{"id":"2114708448244068675","author":"berni","handle":"bernirov","text":"TUTORIAL DE 7 MINUTOS PARA CREAR SITIOS WEB 3D CON IA\n\npaso a paso, desde cero\n\nguárdalo antes de que lo necesites 🔖","url":"https://x.com/bernirov/status/2114708448244068675","createdAt":"2026-10-26T13:19:18Z","metrics":{"views":51519,"likes":1107},"lang":"es"},{"id":"2114812182164652155","author":"Bober_smart","handle":"Bober_smart","text":"It is becoming f*cking dangerous: thanks to this exact setup, I automated my work and generated $16,400 two months back\n\nAndrej Karpathy, co-founder of OpenAI, sparked 24 million views with one idea: stop using AI for code, use it to build a second brain\n\nPoint Claude Code at a folder, drop in any PDF, transcript, or article, and it builds a living wiki that grows smarter the more you feed it\n\nQuick setup:  \n\n1. Create an Obsidian vault and open it in Claude Code\n2. Paste Karpathy's wiki prompt and let Claude build it\n3. Claude creates three folders: ⁠raw⁠ (sources), ⁠wiki⁠ (pages) and ⁠CLAUDE.md⁠ (config)\n4. Drop sources into ⁠raw⁠ and say \"ingest this\"\n5. Query your entire knowledge base forever\n\nSet it up in 5 minutes and never start from a blank chat again\n\nFull guide below. Bookmark this","url":"https://x.com/Bober_smart/status/2114812182164652155","createdAt":"2026-10-26T20:11:30Z","metrics":{"views":7984,"likes":118},"lang":"en"},{"id":"2114705212510449862","author":"染川瞳","handle":"Hitomiiim","text":"たった1枚の立ち絵から、大切なキャラクターをあなたのそばへ。それが、私たちの目指している世界です。\n\nまばたきをして、振り向いて、表情も豊かに変わる。つつくとちゃんと反応も返してくれます。映像の動きはすべて実機でリアルタイムに動いているもので、手付けのアニメーションではありません。\n\n彼女の名前は若泉綺羽（わかな いろは）。このプロジェクトの看板娘で、口ぐせは「……これじゃない。」\n\nリグの知識も、手作業でのパーツ分けもいりません。立ち絵を1枚読み込ませるだけで、キャラクターに命が吹き込まれます。今回はまず上半身のお披露目ですが、細部はさらに磨きをかけている最中です。\n\n「Live2Dを過去にする」といった大口を叩くつもりはありません。その高みに追いつくにはまだ道のりがありますが、今日、そこへ向けて大きな一歩を踏み出せました。\n\n彼女が生まれたのは、2つの素晴らしいオープンソースプロジェクトのおかげです。心より感謝いたします。・See-through（shitagaki-lab、ljsabc ）：立ち絵をレイヤーに分解 https://t.co/XIpQNPMCbi・Anime2.5DRig（@8co28 さん）：分けたレイヤーをブラウザ上で動かす https://t.co/64wM0Gtjxo 私たちはこの2つを礎に、独自の改良を大幅に重ねてきました。\n音声はGPT-SoVITSで合成しており、参考音声には「あみたろの声素材工房」さん（https://t.co/YQPCWZOLh5）の素材をお借りしました。\n近日公開予定です。気になることがあれば、ぜひリプライで聞かせてください。できる限りお返事します。\n#Live2D #立ち絵 #うちの子 #創作 #オリジナルキャラクター #イラスト #VTuber #アニメーション #動く立ち絵 #個人開発","url":"https://x.com/Hitomiiim/status/2114705212510449862","createdAt":"2026-10-26T13:06:26Z","metrics":{"views":9191,"likes":207},"lang":"ja"},{"id":"2115008098289221991","author":"kaito","handle":"cu30rry_","text":"e2e が変更されたテストのみ実行できるようになった！\n\n機能に関わる部分は変更部分だけ e2e し、デプロイ前のCIのみ全件実行ができるように、より柔軟になった\n\nUI・UXの検証レイヤーは e2e 一択だよ\nテストコードだけじゃなく Feature Map・検証スキルがあるのも個人的には最高だ！\n\nさらに、他のE2Eフレームワークから移行するための、/migrate-to-e2e もあり、これにもテストが移行前後で壊れていないか・パスするかを検証する仕様が含まれているので自信を持って移行ができる","url":"https://x.com/cu30rry_/status/2115008098289221991","createdAt":"2026-10-27T09:10:00Z","metrics":{"views":540,"likes":7},"lang":"ja"},{"id":"2114750081626751325","author":"Logan Gott","handle":"LoganTGott","text":"I open-sourced my Grok Bot content pipeline.\n\n(bookmark so you don't lose this)\n\nThis template will:\n\n• Connect to your X account\n• Find 10-20 accounts similar to yours\n• Pull their best-performing posts from the last 6 months\n• Turn the winning themes into questions you answer in a quick voice note\n• Find 100+ viral B2B posts and turn them into reusable templates\n• Drop your voice notes into the templates so you pick your next post\n\nYou talk for 5 minutes. It hands you posts built on formats that already went viral, in your own words.\n\nComment \"BOT\" and I'll send it over.","url":"https://x.com/LoganTGott/status/2114750081626751325","createdAt":"2026-10-26T16:04:44Z","metrics":{"views":27266,"likes":317},"lang":"en"},{"id":"2114852071069679835","author":"Eris Create Lab","handle":"Eris_Create_Lab","text":"#AIart #Grok\nGrok動画でやるシャッフルダンス動画のプロンプト！\nループ動画生成モードで、ファーストフレームのイラスト（ダンスが始まりそうなポーズ推奨）＋キャラクターリファレンス＋ストーリーボードの3枚で生成。ストーリーボードのイラストは２枚目の画像を使ってください。\n以下プロンプト👇\n\nキャラクターが6種類のシャッフルダンス・コンビネーションを次々と披露する、15秒間のハイエナジーなダンスMVアニメーション。\n\n@image1 を開始フレーム、@image2 を振り付けとカメラワークの参考資料、@reference1 をキャラクターの外見の基準として使用する。\n\n登場するキャラクターは1人のみ。軽快な足さばき、滑らかな重心移動、弾むリズム、キレのあるステップを組み合わせ、可愛さとカッコよさを両立する。\n\n【リファレンスの役割】\n\n@image1 の背景、照明、画風を映像の基準とする。\n\n顔立ち、輪郭、髪型、髪色、瞳色、体型、頭身、衣装、靴、アクセサリー、配色は @銀髪ちゃん を基準に全カットで維持する。\n\n@image2 は、ステップの順序、身体の向き、手足の動作、重心移動、カメラ位置と移動方向の参考資料として使用する。\n\n資料内に並ぶマネキンは、同じ人物の時間経過を表す。複数人を登場させない。\n\nマネキンの顔、無毛の頭、白灰色の身体、体型、球体関節、材質、足首の色分けをキャラクターへ反映しない。文字、矢印、足跡、枠、図解を映像に表示しない。\n\n【ダンスの基本】\n\n全編を通して音楽のビートに合わせて踊る。\n\n膝を柔らかく使い、小さく弾む上下動と素早い足の切り替えを維持する。上半身は安定させながら、肩の揺れ、身体のひねり、自然な腕振りでリズムを取る。\n\n接地している足と持ち上げる足の役割を明確にする。足を滑らせる動作でも、靴底と床の位置関係を保ち、重心が支持脚へ自然に移るようにする。\n\n単なる足踏みや走行ではなく、前への踏み下ろしと支持足の後方スライド、足先の開閉、交差、横移動が読み取れるシャッフルダンスにする。\n\n各コンビネーションの内部は滑らかにつなぐ。ポーズごとに停止したり、資料の静止画を順番に再現するだけの動きにしない。\n\n【6つのコンビネーション】\n\n1. FAST RUNNING MAN（0.0〜2.5秒）\n\n開始直後から軽快なランニングマンを踊る。\n\n片膝を持ち上げ、上げた足を前へ踏み下ろすと同時に、支持していた反対の足を後方へ滑らせる。左右を素早く交代し、短い間隔で連続して刻む。\n\n身体は柔らかく弾ませ、腕は脚と連動して自然に前後へ振る。楽しそうな表情でカメラへ視線を向ける。\n\nカメラは正面に近い斜め前方の全身ショット。リズムに合わせて短く素早くドリーインし、頭から足先まで画面内に保つ。\n\n2. CHARLESTON + KICK（2.5〜5.0秒）\n\nハードカット。\n\n片足を前へタップし、足先を軽くひねりながら中心へ戻す。続けて後方へ小さくタップし、その流れから低い位置への鋭い前方キックにつなげる。\n\n前後の足運びに足先の内外への切り替えを組み合わせ、軽快なチャールストンのリズムを作る。キック後はすぐに足を戻して次の動作へつなぐ。\n\n上半身と腕も自然にリズムを取り、キックの瞬間に小さなアクセントを付ける。\n\nカメラは斜め前方の全身ショットで短く追従する。足の前後関係とキックの軌道を見せる。\n\n3. CROSS \u0026 UNCROSS（5.0〜7.5秒）\n\nハードカット。\n\n片足を反対の足の前へ交差させ、小さなホップで両足を開く。次に逆側の足を前へ交差させ、再び開きながら横方向へ移動する。\n\n交差、展開、逆交差、横移動を途切れなくつなぐ。足首と膝の位置関係を明確にし、脚を交差させる瞬間も自然な関節を保つ。\n\n腕はバランスを取りながら軽快に動かし、肩と腰に小さな逆方向のひねりを加える。\n\nカメラは正面寄りの全身ショットから、人物の横移動に合わせて高速で横スライドする。\n\n4. HEEL-TOE TRAVEL（7.5〜10.0秒）\n\nハードカット。\n\n片足のかかとと反対の足のつま先を支点にして、両足の向きを切り替える。続けて支点を入れ替え、足先を内外へ開閉しながら横方向へ進む。\n\nかかととつま先の切り替えを細かく連続させ、床の上を滑るような移動を見せる。足首だけを不自然にねじらず、膝と腰を連動させる。\n\n上半身は余裕を持ってリズムを取り、足元の細かさと対比させる。\n\nカメラは低めの斜め前方から全身を捉え、横移動に並走する。足元がよく見える高さを保ち、足先を画面外へ切らない。\n\n5. RUNNING MAN + SPIN（10.0〜12.5秒）\n\nハードカット。\n\nランニングマンを刻み、その流れで足を身体の下へ寄せて回転を準備する。\n\n支持足を軸に素早く一回転し、再び正面を向いたら、そのまま次のランニングマンへ入る。\n\n回転前後でリズムを止めない。腕を自然に身体へ引き寄せて回転し、回転後は再び開いてバランスを取る。\n\n空中で何回も回転したり、身体を変形させたりせず、床を使った軽快なターンにする。\n\nカメラは斜め前方の全身ショットを安定させる。カメラ自体は回転せず、キャラクターの回転と着地、ステップの再開を明瞭に見せる。\n\n6. KICK / CROSS / SLIDE（12.5〜15.0秒）\n\nハードカット。\n\n低い斜め前方へのキックから、その足を反対の足の前へ交差させて下ろす。\n\n小さなホップで交差をほどき、着地と同時に横方向へ滑らかなスライドを行う。\n\nキック、クロス、ホップ、スライドをひと続きのコンビネーションとして演じる。表情は明るく、自信のある笑顔にする。\n\n最後は静止した決めポーズにせず、次のランニングマンへ入れる重心と脚の位置へつなぐ。\n\nカメラは正面寄りの全身ショットから少しドリーアウトし、横スライドの移動幅と全身のシルエットを見せる。\n\n【カメラワーク／SHUFFLE DANCE MV】\n\n足さばきと全身のリズムを主役にする。\n\nカメラはビート、キック、足の交差、方向転換に反応し、ドリーイン、横スライド、低い位置での追従、ドリーアウトを使い分ける。\n\nカメラの動きは素早く滑らかに制御する。ステップが読み取れる距離と角度を優先し、各カットで頭から靴の先まで画面内に収める。\n\n足元が見えなくな
