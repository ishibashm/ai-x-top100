<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

om ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-22T12:09:55+09:00","posts":[{"id":"2112910016688927077","author":"StudioYebisu","handle":"studio_yebisu","text":"ごめん、PHPの脆弱性は確かに深刻で、日本中の企業が今本気で対応してくれてるんだけど。\n個人はこっちの方がほんまに緊急で。驚き屋とかじゃなくて、ガチでヤバいねん。\n\nちょっと、意訳されることを覚悟で、分かりやすく言うから、全員対応してくれ。\n\nまず、ウェブサイトが信用できるかどうかを判断する「電子証明書」っていうのがあるんだよ。\n\nで、その電子証明書っていうのは。\n\n信用できるサイトにしか発行されないようになってて。\n\n例えばですけど、銀行サイトのフィッシングサイトとかを作ったとしても電子証明書取れないんで、\nそういうのを踏んだ時に、ブラウザ側で、これ偽物のサイトっすよ。やばいっすよ。\nっていう警告を出してくれるものなんですね。\n※まぁ、ブラウザだけで検証出来ない時代になってはいるから本件とは関係なくすでにわかんないんだけど…\n\nこの電子証明書が機能してるから、ウェブサイトの安全性が担保されてるんですよ。\n\nで、その電子証明書を認証するっていう組織が何個かあって。\nうん、このサイトはちゃんとしたサイトだね。\nOK、電子証明書発行しますっていう認証局。\n\nこれはたくさんあって、世界中にあるわけ。\nそんで、この認証局を運営するインドの会社eMudhraがマジでありえないぐらいのやらかしをしてて。\n\n本来だったら複雑にしておかないといけない。この認証局の秘密鍵。これがびっくら驚き。\n秘密鍵8本が4、56、66、115、155、156、230、237だったのよ。\n本来は最大約116桁にもなる巨大な範囲からランダムに選ぶ必要があるのに。\n\nつまり、このサイトはOKですよっていうハンコを押すのがめっちゃ簡単に出来るようになっちゃったのよ。\n\nこれが何を意味するかっていうと。\n詐欺師とかハッカーとかが、訳のわからないフィッシングサイトを完全再現して量産。\n銀行サイトとか仮想通貨の取引所とか、株式口座のサイトとかを作ったとするじゃん。\n\nこういうのは本来電子証明書にハンコが押されないから、みんな騙されないんだけど。\nインドマンのやらかしで。ハンコを押し放題になったのよ。\nということは、どんなフィッシングサイトでもブラウザ側が安全だって誤解しちゃうようになっちゃってるんだよ。\n\nOSとブラウザを更新すると直るんだけど、ブラウザ以外のアプリケーションも影響するやつあるから。\nリプライにもう1個貼るから、そのポストを見て、AIエージェントに自分のパソコンの中とかに脆弱性がないかっていうのをきちんと確認させてほしい。\n\n詳しく言うと、さらにやばいことがいっぱいあるんだけど、もうざっくりそんな感じや。\n最新のOSと最新のブラウザに更新してないネットは、もう今完全に魔界です。","url":"https://x.com/studio_yebisu/status/2112910016688927077","createdAt":"2026-10-21T14:12:58Z","metrics":{"views":5711115,"likes":32957},"lang":"ja"},{"id":"2113051090799497379","author":"GitHub AI Projects Community 🇯🇵","handle":"trendtech33566","text":"AIにコードの全体像まで理解してほしい人へ👀\n\nCodeGraphContext、⭐️約4.3千。\nローカルのコードを\"AIが調べられるグラフ\"にするOSS。\n\n何ができるかというと👇\n・コードをグラフDBに索引化\n・AIにコードの構造や関係を伝える\n・MCP経由でAI IDEと連携\n・CLI単体でもコード解析に使える\n\n「このコード、どうつながってる？」をAIと掘り下げたい人に。","url":"https://x.com/trendtech33566/status/2113051090799497379","createdAt":"2026-10-21T23:33:33Z","metrics":{"views":257,"likes":5},"lang":"ja"},{"id":"2112827195068670093","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"うわぁぁぁ…ElevenLabs「Eleven Realtime」、ガチでクローン人間が誕生した。\n\n10月20日リリース。こっちが話し終わるのを察して、割り込まれても立て直して、「うんうん」って相槌にも話を止めない。上位版Maxは0.57秒で話し始めて、話し言葉の推論テストで98.8%正解。\n\nAIと人間の境界が溶け始めた話を全部解説する↓","url":"https://x.com/MakeAI_CEO/status/2112827195068670093","createdAt":"2026-10-21T08:43:52Z","metrics":{"views":6150,"likes":52},"lang":"ja"},{"id":"2113088020832509973","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"すげー！！！マジでGPTだけで動画編集できた！これ動画編集のプラグイン入れて丸投げしただけでできた動画！\n\nおしゃれでかっこいい！ https://t.co/G2uL9UYd8r","url":"https://x.com/ai_ai_ailover/status/2113088020832509973","createdAt":"2026-10-22T02:00:18Z","metrics":{"views":264,"likes":4},"lang":"ja"},{"id":"2113035113537970380","author":"オープンソース研究所","handle":"opensourcelab9","text":"撮った書類の写真を、ネットに上げずにAIへ読ませたい人へ👀\nOpenBMB の MiniCPM-V 4.7 は、iPhone や Android の端末の中で画像と文書を読み解きます。\n\n・iPhone 17 Pro Max で毎秒13トークン以上（AIが文字を出す速さ）、使うメモリは3GB\n・iPad Pro M4（16GB）では、次に使う部品を先読みする仕組み（LES）で5倍速。出力は先読みなしと変わらない\n・文字の読み取り試験 OCRBench で90.4点（画像の情報を16分の1に縮めた状態で）\n\nOllama や llama.cpp でも動き、スマホ向けのアプリも出ています。\n人に見せたくない書類でも、スマホから出さずにAIに読んでもらえるのは安心です。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2113035113537970380","createdAt":"2026-10-21T22:30:04Z","metrics":{"views":542,"likes":6},"lang":"ja"},{"id":"2112948708601983181","author":"gus","handle":"igus_ai","text":"ACABAN DE SOLUCIONAR EL MAYOR PROBLEMA DEL VIBECODING\n\nLa IA ya escribe tu código. \n\nPero nadie comprueba de verdad que funcione con usuarios reales, datos de meses y servicios que se caen.\n\n¿La idea?\n\nEn vez de lanzar a producción y rezar para que tus usuarios no encuentren el bug, Breken monta una copia realista de producción alrededor de tu app y la rompe a propósito ANTES de que llegue a nadie.\n\nLa IA primero:\n\u2028→ crea usuarios, datos con historial y procesos de fondo\u2028→ reinicia servidores y tumba servicios a mitad de tarea\u2028→ prueba los órdenes raros en los que pasan las cosas\u2028→ y cuando algo se rompe, lo arregla y demuestra el arreglo\n\nEso significa menos cobros duplicados, menos datos filtrados y menos noches de guardia apagando fuegos que ningún test vio venir.\n\nY no se queda ahí: vuelve a comprobar cada bug en cada release para que no reaparezca.\n\nFunciona con APIs, apps y agentes de IA.\n\nTienen prueba gratis 7 días entrando con GitHub, sin tarjeta👇","url":"https://x.com/igus_ai/status/2112948708601983181","createdAt":"2026-10-21T16:46:43Z","metrics":{"views":91305,"likes":845},"lang":"es"},{"id":"2112940607048192403","author":"すぐる | ChatGPTガチ勢 𝕏","handle":"SuguruKun_ai","text":"今回のPHPの騒ぎ、AIエージェントで予防したい場合はChatGPTのこのプラグインを入れた方がいい。OpenAI公式の「Codex Security Cloud」で、つないだリポジトリをAIが脆弱性チェックして、攻撃の道筋と確かめた証拠と直す案まで出してくれる。対象アカウントは500ドル分の無料枠つき。使用方法👇🧵","url":"https://x.com/SuguruKun_ai/status/2112940607048192403","createdAt":"2026-10-21T16:14:31Z","metrics":{"views":14862,"likes":130},"lang":"ja"},{"id":"2112868500092097009","author":"kiosa","handle":"thegreatest_sv","text":"Anthropic is furious: this secret tool can replicate any existing app x10 faster for free\n\nthere's an open-source tool with 352k stars on GitHub that lets an AI agent take apart any app you have on your machine and explain exactly how a feature works. no source code needed.\n\nit's called REA. Reverse Engineer Anything.\n\none line:\n\nnpx rea-agents setup\n\nthen you just ask Claude Code:\n\n\"Understand how search works in the Notes app, show me the evidence, and build a similar feature for my project.\"\n\nand it does it.\n\n-\u003e native binaries, through Ghidra, Hopper or IDA\n-\u003e JavaScript and Electron apps\n-\u003e .NET apps\n-\u003e websites\n\nit runs locally. it shows its evidence. then it writes the code.\n\nthat feature your team spent 8 months on? someone's agent can read how it works over lunch.\n\nso let's be honest about what this means:\n\nyour moat was never the code. it was that copying you took effort.\n\nthat effort just went to zero.\n\nthe only things left that can't be cloned: your users, your speed, and your taste.\n\nand if your product dies because someone could see how it works, it was already dead.\n\nthe repo is below. founders, you're going to hate this one \nhttps://t.co/sD8D4HKBxn\n\nsave, share, and try later","url":"https://x.com/thegreatest_sv/status/2112868500092097009","createdAt":"2026-10-21T11:28:00Z","metrics":{"views":16995,"likes":222},"lang":"en"},{"id":"2113103089842717053","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】CuaがCua Spaces SDKを公開。Claude CodeやCodexに、自分で選んだPCを持たせて動かせる\n\nGrok Botのような専用PC付きエージェントを、手元のMac miniや自社クラウドで再現できるのが大きい。\n\n・Agentごとに画面とアプリ付きのSpace\n・ローカルやAWS、GCP、Azureで実行\n・E2B、Daytona、Modalにも対応\n・約10行のコードで起動","url":"https://x.com/masahirochaen/status/2113103089842717053","createdAt":"2026-10-22T03:00:10Z","metrics":{"views":1294,"likes":4},"lang":"ja"},{"id":"2112886438954246223","author":"Yoshikawa Hitaka | 吉川飛空","handle":"hitakayoshikawa","text":"ちなPHPだけじゃなくてnode.jsも地味にやばいです。\n\nNode使ってる人、今日中に node -v しよ\n\n22.23.4\n24.22.1\n26.12.1\n\nこれ以外は今穴が開いてます。\n\n圧縮データを読む処理に不具合があって外からプログラムを実行される。","url":"https://x.com/hitakayoshikawa/status/2112886438954246223","createdAt":"2026-10-21T12:39:17Z","metrics":{"views":81098,"likes":662},"lang":"ja"},{"id":"2113016229715984826","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Claude Codeのトークン消費で悩んでいる人に効きそうなのが「高いモデルは考えるだけ」という分け方、メチャ共感する\n\n・大きな判断と計画：Opus\n・手を動かす作業：Sonnet\n・テストや文書のような定型作業：Haiku\n\n公式ドキュメントにも、この分け方がそのまま入っている\n\nたとえば /model opusplan にすると、計画モードではOpus、実行に移るとSonnetに自動で切り替わる\nサブエージェントの定義ファイルに model を書けば、エージェントごとに使うモデルも変えられる\n\nもう1つ大事なのが「報告は1行で返させる」こと\n司令役のOpusに長いログを読ませないだけで、文脈がきれいなまま保てる","url":"https://x.com/tetumemo/status/2113016229715984826","createdAt":"2026-10-21T21:15:01Z","metrics":{"views":2355,"likes":11},"lang":"ja"},{"id":"2113083839597957620","author":"宮田 |Cloudflare x ClaudeCode","handle":"miyataArcHack","text":"とりあえずセキュリティ不安な人はこれ入れとけ。\n\nPHPやNode.jsで脆弱性の公表が続く今、クラウドフレアの監査スキルでコードも点検した方が良い。","url":"https://x.com/miyataArcHack/status/2113083839597957620","createdAt":"2026-10-22T01:43:41Z","metrics":{"views":361,"likes":10},"lang":"ja"},{"id":"2112851390280446314","author":"marcus","handle":"marcusyul","text":"LA IA PUEDE RESPONDER MUCHO MÁS RÁPIDO GRACIAS A ESTO\n\nSe llama EAGLE-4 y acaba de salir en GitHub como source-available.\n\nHace que un modelo de IA escriba sus respuestas más rápido usando el mismo ordenador. Sin comprar hardware nuevo.\n\nSegún los resultados de su paper (Qwen 3.8 27B, 4× B300):\n\n→ 3,59× más rápido\n→ Mismo equipo\n→ Mismo modelo\n→ Supera a sus rivales\n\nY aguanta incluso con 512 personas usándolo a la vez.\n\nOs dejo el repo abajo 👇🏼","url":"https://x.com/marcusyul/status/2112851390280446314","createdAt":"2026-10-21T10:20:00Z","metrics":{"views":37172,"likes":188},"lang":"es"},{"id":"2112788976008650804","author":"Annatar.md","handle":"AnnatarXBT","text":"Jev + Claude Opus 5.5 is f*cking dangerous\n\nhand the decision forks to Jev and one agent's bill drops from about $110 a day to $4\n\ni still haven't found a better way to run Opus\n\n4 calls Opus never has to make again:\n-\u003e which project notes to load before context fills\n-\u003e which easy steps go to a faster worker\n-\u003e how to recover when a tool breaks, without blind retries\n-\u003e which quick checks run before the full test suite\n\nOpus keeps every hard reasoning step\nJev just picks from options the harness already tested\n\neach pick comes back in about 100 ms, and Jev's output tokens are free\n\nJev engineering in one line: Opus gets the essay questions, Jev gets the multiple choice\n\nthat's about $3,180 a month off the same workload\n\nnumbers like that get people promoted\n\nread the paper in the video first, then the full Jev guide:","url":"https://x.com/AnnatarXBT/status/2112788976008650804","createdAt":"2026-10-21T06:12:00Z","metrics":{"views":5174,"likes":101},"lang":"en"},{"id":"2113064764356358445","author":"あきらパパ【生成AI活用エンジニア\u0026３児のパパ】","handle":"akira_papa_IT","text":"Duetのウェイトリスト申込完了🎵以下から申込できます👇\n・Claude Duet | Your personal AI assistant\n　　URL: https://t.co/RSM9IV7JoS https://t.co/I35OuXlNlr","url":"https://x.com/akira_papa_IT/status/2113064764356358445","createdAt":"2026-10-22T00:27:53Z","metrics":{"views":2960,"likes":23},"lang":"ja"},{"id":"2113091445372658156","author":"みやび｜AI社員育成家","handle":"miyabi_foxx","text":"Claude Startup承認されてからタスクの進み具合が異常値に達している\n\n最近はアプリにゲーム様子を取り入れれないか研究してましたが、デザインってめちゃくちゃ重要ですね\n\n今遊びでAI学習プラットフォームを開発してましたが、デザインの幅が無限に広がっていて、とんでもなく楽しい","url":"https://x.com/miyabi_foxx/status/2113091445372658156","createdAt":"2026-10-22T02:13:54Z","metrics":{"views":192,"likes":2},"lang":"ja"},{"id":"2112918833463771346","author":"lumxss","handle":"bkdgiffug","text":"一款语音合成 AI 能让海外彻底炸锅\n\n造出来的声音你压根辨不出真假，这事儿离谱不离谱？GitHub 趋势榜头名、星标干到 3.8 万的「VoxCPM2」，是真神。\n\n1️⃣ 你只管敲一行字\"沉稳的 30 代女声\"，它当场就给你合成出来\n2️⃣ 丢一小段录音进去，连说话的口癖、语速都给你一比一复刻\n3️⃣ 48kHz 录音棚级音质，还挂着 Apache 2.0 协议，商用随你使\n🔗","url":"https://x.com/bkdgiffug/status/2112918833463771346","createdAt":"2026-10-21T14:48:00Z","metrics":{"views":10115,"likes":195},"lang":"zh"},{"id":"2112918231899926738","author":"kento iv","handle":"0xKento_","text":"un tipo vibecodeó su TV con Claude y le sacó todo el bloatware y los anuncios...\n\nrecreó la interfaz inspirada en Apple TV\n\nde 282 MB a 96 MB de RAM. 3x más rápida. cero anuncios\n\nrecomendaciones de pelis, clima, precios de crypto y se oscurece sola al atardecer\n\nel repo está abierto y funciona en Google TV, LG y Samsung\n\nte lo dejo en comentarios","url":"https://x.com/0xKento_/status/2112918231899926738","createdAt":"2026-10-21T14:45:37Z","metrics":{"views":50853,"likes":811},"lang":"es"},{"id":"2112932117697200392","author":"KEITO💻AIディレクター","handle":"keitowebai","text":"「PHP事件」で、多くの人が身にしみたと思いますが、\nそろそろ本気で、WordPressはやめましょう。\n\n煽りではなく、本当に\"オワコン\"だと思っています。 逆に今あえてWordPressを推すのは、逆張り、プライド、ポジショントークにしか見えません。\n\n流石に、連日の騒動を見たら薦められないですよ...\n\nそもそも昔から色々問題はあったのでディレクター時代（4年前くらい）から「WordPressはなるべく避けよう」と言い続けてきたのも、純粋に善意からでした。\n\nじゃあ何を使えばいいのか。おすすめは\n・CloudflareのEmDash\n・静的サイト\nのどちらかです。\n\nEmDashはCloudflareの強固なセキュリティの上で動くので、CMSとしてのリスクが小さい。しかもAIネイティブな発想で作られていて、今の時代に凄く合っています。\n\nいわゆるAIに「これ更新して」で更新できる仕組みが備わってる。\n\n詳しくは記事にまとめたので、ぜひ読んでください👇\n\nそしてEmDashに移行したい方へ。\n\n実績づくりも兼ねて、良いタイミングなので数社限定で\"良い感じのお値段\"で対応しますよ。\n\nお気軽にご連絡ください。\n\n……と、最後にしっかりポジショントークしておきます😇","url":"https://x.com/keitowebai/status/2112932117697200392","createdAt":"2026-10-21T15:40:47Z","metrics":{"views":62874,"likes":579},"lang":"ja"},{"id":"2113043939133726955","author":"旺旺","handle":"TiagerBao","text":"开源语音模型已经卷到 600 多种语言了，甚至还能克隆声音。\n\n项目叫 OmniVoice，由 k2-fsa 开源。\n\n几个关键数据：\n\n-600+ 种语言：支持多语言文本转语音\n-3–10 秒参考音频：即可尝试零样本声音克隆\n-最高 40 倍实时速度：官方报告最低 RTF 0.025\n-2–2.9 倍推理加速：支持 FlashInfer\n\n不只是文字转语音，还能指定性别、年龄、音调、口音，甚至控制笑声、叹气和单词发音。\n\n支持 Python、CLI、本地 Web UI，也能在 Apple Silicon 上运行。\n\n对做语音 Agent、有声内容、语言学习 App 的开发者来说，值得试试。\n\nGitHub：https://t.co/IqLGuRihbc\n\n#AI #Agent #TTS #VoiceAI #OpenSource","url":"https://x.com/TiagerBao/status/2113043939133726955","createdAt":"2026-10-21T23:05:08Z","metrics":{"views":780,"likes":8},"lang":"zh"},{"id":"2112843586760790404","author":"PA13L0","handle":"Fluyeporlaweb","text":"Algunos me habéis preguntado como entrené al @grok bot para que me audite el SEO/AEO de la web\n\nHe creado un repo en github con las skills que me he ido creando para este y otros proyectos\n\nLo tienes gratis en Github.\n\nQué mira cada una:\n\n✅seo-data-contract: si cada dato es fresco antes de usarlo.\n✅aeo-bot-access-audit: robots.txt, edge y sitemap, bot a bot.\n✅aeo-citability-audit: si una IA puede citar tu página.\n✅information-gain-analysis: qué aportas que no tenga ya Google.\n\nYo lo tengo con la API de @dataforseo pero es opcional (aunque muy recomendable si vas en serio)\n\nInstalar: npx skills add Pautthead/seo-aeo-agent-skills\n\nRepo ↓","url":"https://x.com/Fluyeporlaweb/status/2112843586760790404","createdAt":"2026-10-21T09:49:00Z","metrics":{"views":2988,"likes":47},"lang":"es"},{"id":"2112790234219897309","author":"Su","handle":"Sukiea1008","text":"想用 Grok Bot 组建一支内容团队\n\n不如看看这个由Elon Musk 转发过的文章（中译版）\n\n- 内容总管：只有它接你的消息，给选题打分，挑出 5 个\n- 研究员：每周交 10 个带来源的选题\n- 写手：照你的语气写，一篇只讲一个观点\n- 视觉师：先喂 15 张参考图，保证风格统一\n- 分析师：每周一早上把上周数据发给你\n- 排期员：给每篇排发布时段\n- 发布 bot：成品放进日历，先存草稿\n\n你只要做两件事：定方向，最后审稿。\n\n原文 Prompt 都在文章中，\n换成你自己的内容方向就能用 👇","url":"https://x.com/Sukiea1008/status/2112790234219897309","createdAt":"2026-10-21T06:17:00Z","metrics":{"views":30940,"likes":323},"lang":"zh"},{"id":"2113026258816884763","author":"M.","handle":"wlzh","text":"有人把\"抄一个 App\"这件事，做成了一套正经流水线。\n\nGitHub 上这个 replica-skill，3,985 星，是给 Claude 用的 11 个技能，免费、MIT，不用注册也不用 API key。\n\n流程是连着走的：先侦察，把目标 App 的界面、流程、组件、数据模型从公开页面、截图和应用商店介绍里扒出来；再定架构、扒设计规范，然后逐屏重建，接上登录、数据库和支付。\n\n后面几步才是精髓：一个技能专门点遍所有流程测 bug；一个把克隆版和原版逐项对比打分，差在哪列得清清楚楚；还有一个叫 Entrepreneur 的，去翻原版在 App Store、G2、Reddit 上的真实差评，把用户最恨的几点变成你这版的修复清单和卖点。\n\n作者在细则里把丑话说得很明白：只重建功能和交互，净室做法，不碰人家的源码、logo、文案和私有接口；上线前必须换名、换配色、换品牌，有个扫描工具专门查代码里还残留没残留原版的东西，不干净就不让发布。\n\n他也承认克隆不是万能的：订票工具这种几周能搞定，表格引擎那种就别想了，侦察那步会先老实告诉你这活有多大。\n\n想抄作业抄得理直气壮的，这套流程值得看看。","url":"https://x.com/wlzh/status/2113026258816884763","createdAt":"2026-10-21T21:54:52Z","metrics":{"views":2882,"likes":52},"lang":"zh"},{"id":"2112741988399477203","author":"三个三","handle":"3three_AI","text":"🚨 21岁的大学生用 AI 做动画，只花了 124 美元，就赚回 2,342 美元！\n\n她用 6 个 AI 工具，1 小时就能做出一集动画！\n\n整个流程直接公开👇\n\n1️⃣ Claude：10 分钟写剧本、分镜、对白\n2️⃣ Midjourney：20 分钟生成动画画面\n3️⃣ Runway：15 分钟让静态图片动起来\n4️⃣ ElevenLabs：10 分钟完成角色配音\n5️⃣ Suno：5 分钟生成原创背景音乐\n6️⃣ 剪映：把所有素材剪成完整动画","url":"https://x.com/3three_AI/status/2112741988399477203","createdAt":"2026-10-21T03:05:17Z","metrics":{"views":20164,"likes":273},"lang":"zh"},{"id":"2112970899943289091","author":"Brij Pandey","handle":"LearnWithBrij","text":"A graph-powered all-in-one RAG system! \n\nFully open-source and multimodal.\n\nModern documents increasingly contain diverse multimodal content like text, images, tables, equations, charts, and multimedia.\n\nNaive RAG cannot handle it.\n\nRAG-Anything is a graph-driven, all-in-one multimodal document processing RAG system built on LightRAG.\n\nIt supports all content modalities within a single integrated framework that is built through four stages:\n\n1️⃣ Document parsing\n2️⃣ Content understanding and analysis\n3️⃣ Multimodal Knowledge Graph Index construction\n4️⃣ Modality-aware retrieval\n\nBuilt by the team behind LightRAG!\n\nGitHub repo: https://t.co/SqD3OhgETU\n\n👉 Over to you: What types of multimodal documents do you work with most?","url":"https://x.com/LearnWithBrij/status/2112970899943289091","createdAt":"2026-10-21T18:14:54Z","metrics":{"views":3754,"likes":85},"lang":"en"},{"id":"2112741634039517322","author":"𝗿𝗮𝗺𝗮𝗸𝗿𝘂𝘀𝗵𝗻𝗮— 𝗲/𝗮𝗰𝗰","handle":"techwith_ram","text":"𝗦𝗲𝗹𝗳-𝗘𝘃𝗼𝗹𝘃𝗶𝗻𝗴 𝗔𝗴𝗲𝗻𝘁 𝗛𝗮𝗿𝗻𝗲𝘀𝘀\n\nThe agents don’t fail loudly. They fail the same way, again and again, and nobody notices until a user does.\n\nSo the question I keep coming back to isn’t “how smart is the agent?” It’s “how does it get better without getting worse?”\n\nThis harness answers that.\n\nThe agent perceives, thinks, plans and acts like any other. The difference is what happens after a mistake.\n\nIt doesn’t just record that something failed. It compares the failed run against a good one and finds the exact step where things went wrong.\n\nIt doesn’t patch one-off errors either. It groups failures by root cause, so it fixes the pattern, not the symptom. No hardcoded answers. No sneaking test data into the prompt.\n\nAnd nothing changes on trust alone. Every update the agent proposes for itself has to pass a quality gate and a performance gate before it’s allowed in. If it makes things worse, it’s rejected.\n\nThat last part is what matters most. Self-improvement without protection is just drift with extra steps.\n\nPrecise diagnosis. Real generalization. Regression protection. Validated updates.","url":"https://x.com/techwith_ram/status/2112741634039517322","createdAt":"2026-10-21T03:03:53Z","metrics":{"views":7648,"likes":211},"lang":"en"},{"id":"2112867101497262360","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これ欲しかった。\n\nAIで動画を作るとき、\n「映画っぽくして」でイメージが伝わらないなら、\n“光の当て方”まで指定してみてほしい。\n\n・横から光を当てて、顔に陰影をつける\n・やわらかい光で、影を薄くする\n・夕日のような暖かい光にする\n\n「どこから・どんな光を当てるか」で、\n作りたい雰囲気を具体的に伝えられる。\n\n撮影・AI生成で使う光の方向や色から、\n編集で足す光の効果まで。\n「AI動画で使える 光の演出100選」を\n4枚の図解にまとめました。\n\n保存して、次の動画づくりの参考に👇📌","url":"https://x.com/Codex_jisen/status/2112867101497262360","createdAt":"2026-10-21T11:22:26Z","metrics":{"views":14892,"likes":460},"lang":"ja"},{"id":"2112831018080297348","author":"Claude Code Research Lab","handle":"claudecode84","text":"Anthropicが、\n寝ている間も自動で働き続ける\nAIエージェントの構築ガイドを公開。\n\nしかも、\nすぐに応用できるテンプレート付き。\n\nこれまで毎朝1時間かけていた情報確認が、AIに任せられるようになる。\n\n仕組みはシンプル。\n\nSlackとGitHubを接続するだけで、AIが自動的に情報を収集・整理する。\n\n具体的には　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n① 昨日から何が変わったのか\n② 自分の確認待ちになっているレビュー\n③ チームの作業を止めている未決定事項\n④ 優先的に対応すべきタスク\n\nこれらを確認・検証し、\n毎朝Slackに要約を届けてくれる。\n\nさらにすごいのが、\n記憶機能まで組み込まれていること。\n\n過去に報告した内容を覚えているため、\n同じ情報を何度も通知しない。\n\n実行スケジュール、動作ルール、\n予算上限まで設定可能。\n\n設定した予算を\n超えないように制御できる。\n\nしかも、クラウド上で動くため、PCを閉じてもエージェントは稼働し続ける。\n\nつまり、寝ている間にAIが仕事を整理し、朝起きたらSlackに報告が届いている。\n\nAIに質問する時代から、\nAIが自律的に仕事を進める時代へ。\n\nこれは保存必須。👇","url":"https://x.com/claudecode84/status/2112831018080297348","createdAt":"2026-10-21T08:59:03Z","metrics":{"views":11578,"likes":106},"lang":"ja"},{"id":"2112948683356676245","author":"liam.","handle":"liambraus","text":"DOS CHAVALES DE 18 AÑOS ACABAN DE LANZAR SOFTWARE QUE ENCUENTRA Y ARREGLA SUS PROPIOS BUGS ANTES DE QUE LOS VEAN LOS USUARIOS\n\nrecién levantada la seed. se llama Breken.\n\ntus tests comprueban lo que tu equipo imaginó. Producción comprueba todo lo demás, y ahora mismo los que corren ese segundo test son tus usuarios.\n\nBreken lo corre primero. tu software real, dentro de un mundo que se comporta como producción, encuentra lo que se rompe, lo arregla, demuestra el fix y lo vigila en cada release.\n\n→ usuarios reales, datos con historia, jobs en background, servicios que mueren a mitad\n→ funciona en APIs, apps y agentes de IA\n→ 7 días gratis, entras con GitHub\n\nProduction before production.","url":"https://x.com/liambraus/status/2112948683356676245","createdAt":"2026-10-21T16:46:37Z","metrics":{"views":15546,"likes":175},"lang":"es"},{"id":"2112856076588929256","author":"茶木 孝晃｜AI × セキュリティ","handle":"ai_security_CT","text":"PHPに続いて、今度はNode.jsでもセキュリティアップデートが発表されました。\n\nNode.jsは、JavaScriptをサーバー側で動かすための実行環境です。\n\nNext.js、Express、NestJSなど、多くのWebアプリケーションで利用されています。\n\n今回の対象はNode.js 22・24・26系で、脆弱性の最大深刻度はHIGH（高）。\n\n注意したいのは、AWSなどのクラウド環境を利用していても、Node.jsの脆弱性とは無関係ではないということ。\n\nEC2やECSなどでNode.jsを動かしている場合、使用しているバージョンによっては対応が必要になります。\n\nもちろん、Node.jsを使っているから危険という話ではありません。\n\n重要なのは、自社システムで使用しているバージョンを把握し、セキュリティアップデートを適切に実施すること。\n\nPHPもNode.jsも、世界中のWebサービスを支える重要な技術です。\n\nだからこそ、今回のような脆弱性情報には注意が必要ですね。\n\nNode.js公式発表👇","url":"https://x.com/ai_security_CT/status/2112856076588929256","createdAt":"2026-10-21T10:38:38Z","metrics":{"views":28135,"likes":108},"lang":"ja"},{"id":"2113063467452444773","author":"Koichi","handle":"x64koichi","text":"AI対策として、公開サイト上に.envを作成し、これは違法アクセスなので、正当な理由があるのであれば名前と理由を含めた以下のURLへアクセスしなさいと記載しておきました。\n\n\u003cDOMAIN\u003e/?name=\u003cNAME\u003e\u0026message=\u003cReason\u003e\n\nその結果、Shelley Labyという名前で、Google検索エンジンでindexする為にアクセスしたんだよというメッセージがログにのこってました。これは他にもいろいろと活用の幅が広がりますね。","url":"https://x.com/x64koichi/status/2113063467452444773","createdAt":"2026-10-22T00:22:44Z","metrics":{"views":60122,"likes":756},"lang":"ja"},{"id":"2112828463484948769","author":"AI駆動塾","handle":"L_go_mrk","text":"GrokBot、やっぱコンテンツ制作とかリサーチとか非エンジニア職において最強すぎるかもしれん。。。\n\n・返答がばっっっっっっっっか早い。\n・リサーチの精度が高い。\n・ GrokAPI使わずにXの情報（一次情報）取れる\n・チームを組んでリサーチから制作まで一気にやれる\n\n非エンジニアなら本当に触っておいて損ないと思う。設定とかは結構面倒くさいけどね！","url":"https://x.com/L_go_mrk/status/2112828463484948769","createdAt":"2026-10-21T08:48:54Z","metrics":{"views":7090,"likes":70},"lang":"ja"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-22T12:09:55+09:00","posts":[{"id":"2113057776666890358","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"OpenAIがCOBOL・Fortran・Visual Basicなど古い言語のコード作成と移行で、大きく性能を上げたと発表。\n\n銀行や役所の基幹システムはまだCOBOLで動いているものが多いので、レガシー刷新の案件は一気に現実味が出てきそう。\n\n・COBOL移行テストでGPT-6.1 Solが86.6%（旧GPT-5.6 Solは5.4%）\n・推論を強めると97.9%\n・20言語でSQLite互換DBを作るテストでGPT-6 Astraが平均87.4%\n・ただしCOBOLは72.1%で一番の苦手","url":"https://x.com/masahirochaen/status/2113057776666890358","createdAt":"2026-10-22T00:00:07Z","metrics":{"views":5464,"likes":19},"lang":"ja"},{"id":"2113037478286221570","author":"Node.js","handle":"nodejs","text":"🔐 Node.js security updates are now available!\n\nNew releases for Node.js 22.x, 24.x \u0026amp; 26.x address multiple vulnerabilities, including high-severity issues.\n\nReview the details and update your systems to stay secure.\n\n🔗 https://t.co/W4kfzx5lxz\n\n#NodeJS #Security","url":"https://x.com/nodejs/status/2113037478286221570","createdAt":"2026-10-21T22:39:27Z","metrics":{"views":459516,"likes":6519},"lang":"en"},{"id":"2113034512431300893","author":"茶木 孝晃｜AI × セキュリティ","handle":"ai_security_CT","text":"PHP、Node.js、Javaに続いて、今度はGitLabまで…。\n\nしかも今回のGitLabの脆弱性、深刻度は最高値のCVSS 10.0。\n\n条件が成立すると、認証されていない攻撃者がサーバー上で任意のコードを実行できる可能性があるとのこと。\n\nこれ、開発現場にとってはかなり深刻な問題です。\n\nGitLabは単なるソースコード管理ツールではありません。\n\nCI/CD、デプロイ設定、アクセストークンなど、開発から本番環境への重要な情報を管理しているケースも多い。\n\n万が一侵害されれば、ソースコードの流出だけでなく、開発環境や本番環境への侵入、サプライチェーン攻撃につながる恐れもあります。\n\n特に自社サーバーやAWSなどでGitLabを運用している企業は、早急にバージョンを確認してほしい。\n\n今回の一連の脆弱性を見ていると、もはや「うちは大丈夫」と言える時代ではないですね。\n\nセキュリティは一度対策して終わりではなく、継続的な診断とアップデートが必要です。\n\nGitLab公式情報👇","url":"https://x.com/ai_security_CT/status/2113034512431300893","createdAt":"2026-10-21T22:27:40Z","metrics":{"views":106617,"likes":689},"lang":"ja"},{"id":"2112986031389880546","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝OpenAIが、PHPの重大な脆弱性を見つけただけでなく、確かめるための「Skills」まで配ってきた！このスピード感”粋”すぎる！\n\n自分のサイトが対象かどうかを、Codexに確かめてもらえる\n\n使い方はシンプル\nCodexにこう頼むだけで、2つのスキルが入る\n\n$skill-installer install both skills from https://t.co/JHCzTYEGSh\n\n・phpcheck-url：URLだけで確かめる\n・phpcheck-server：サーバーに入れるときに、動いているPHPのバージョンを確かめる\n\n結果は3つ\n・OK：修正が入っているはずのバージョン\n・VULNERABLE：対象のバージョン\n・UNKNOWN：バージョンが読めなかった（安全という意味ではない）\n\n脆弱性の発見から確認の手順まで、これからは「Skillsを入れて確かめる」が普通になりそうだ","url":"https://x.com/tetumemo/status/2112986031389880546","createdAt":"2026-10-21T19:15:01Z","metrics":{"views":13463,"likes":136},"lang":"ja"},{"id":"2112852836837126253","author":"StudioYebisu","handle":"studio_yebisu","text":"今日最大の笑えるポストがこれなんだけど。\n\nWebサイトの身元を証明する「電子証明書」っていうのがありまして。\n身元保証されてないサイト叩いた時に、このページ、ホンマに開いていいっすか？みたいなの見たことあると思うんですよ。\n\nで、その認証局を運営するインドの会社eMudhraのやらかしが流石にオモロイっていう話でして。\n\n電子証明書に「うちが正式に発行しました」とハンコを押すための、絶対に他人に当てられてはいけない数字が「秘密鍵」\n\n本来は最大約116桁にもなる巨大な範囲からランダムに選ぶ。その秘密鍵を知っている人だけが証明書を使えるってことですね。\n\nところがMozillaの調査では、8本は256未満の雑魚。\n何よりヤバいのが、そのうちひとつの秘密鍵が\n\n「4」\n\nあの、3の次の4。\n\nWeb用の秘密鍵を当てられると、偽サイト用の証明書まで勝手に発行される危険がある。\nその鍵の一つが「4」だったんす。\n\nMozillaは報告を受け取ってから2時間53分で、Firefox向けのブロックを完了。\n私たちはパスワード登録するときに\n\n大文字・小文字・数字・記号を混ぜてください💢\n\nって怒られてるのに、ネットの身分証発行所の秘密鍵が「4」なの、さすがに笑えるだろ。\nおまえ認証ザル、スギ","url":"https://x.com/studio_yebisu/status/2112852836837126253","createdAt":"2026-10-21T10:25:45Z","metrics":{"views":302203,"likes":1701},"lang":"ja"},{"id":"2112962248218148878","author":"Claude","handle":"claudeai","text":"Claude Security now keeps up with your code as it changes.\n\nConnect your repositories once. Claude runs a deep first scan, then re-scans as changes land, so findings stay close to the current state of your code.\n\nIn public beta on Claude Enterprise.","url":"https://x.com/claudeai/status/2112962248218148878","createdAt":"2026-10-21T17:40:31Z","metrics":{"views":458481,"likes":7529},"lang":"en"},{"id":"2113090560882049481","author":"国家サイバー統括室(注意・警戒情報)","handle":"cyber_forecast","text":"【更新情報】\n米国時間2026年10月20日、デスクトップ向けChromeの更新情報が公開されました。\n本件更新(Windows/Mac:156.0.8078.47/.48、Linux:156.0.8078.47)にはセキュリティ修正が含まれています。配信されましたら忘れずにアップデートしてください。","url":"https://x.com/cyber_forecast/status/2113090560882049481","createdAt":"2026-10-22T02:10:23Z","metrics":{"views":250581,"likes":3223},"lang":"ja"},{"id":"2112963255924674955","author":"Google","handle":"Google","text":"Gemini is now available in @GoogleMaps navigation on CarPlay. Find the best place to park, report a traffic incident, or change your route with just a quick conversation.\n\nTap the Gemini icon in Google Maps CarPlay during your next drive to try it out 🚘","url":"https://x.com/Google/status/2112963255924674955","createdAt":"2026-10-21T17:44:31Z","metrics":{"views":217275,"likes":1326},"lang":"en"},{"id":"2112851390280446314","author":"marcus","handle":"marcusyul","text":"LA IA PUEDE RESPONDER MUCHO MÁS RÁPIDO GRACIAS A ESTO\n\nSe llama EAGLE-4 y acaba de salir en GitHub como source-available.\n\nHace que un modelo de IA escriba sus respuestas más rápido usando el mismo ordenador. Sin comprar hardware nuevo.\n\nSegún los resultados de su paper (Qwen 3.8 27B, 4× B300):\n\n→ 3,59× más rápido\n→ Mismo equipo\n→ Mismo modelo\n→ Supera a sus rivales\n\nY aguanta incluso con 512 personas usándolo a la vez.\n\nOs dejo el repo abajo 👇🏼","url":"https://x.com/marcusyul/status/2112851390280446314","createdAt":"2026-10-21T10:20:00Z","metrics":{"views":37172,"likes":188},"lang":"es"},{"id":"2112992872857252082","author":"Grok Bot","handle":"bot","text":"Grok Bot can now build reports, memos, and dashboards.\n\nAsk Bot for a page, then edit it together or have Bot keep it up to date.","url":"https://x.com/bot/status/2112992872857252082","createdAt":"2026-10-21T19:42:13Z","metrics":{"views":923293,"likes":6404},"lang":"en"},{"id":"2113018152921821293","author":"unusual_whales","handle":"unusual_whales","text":"BREAKING: Mark Zuckerberg of $META has said he is considering leaving California if it passes a measure that would impose a one-time 5% tax on billionaires, per Bloomberg","url":"https://x.com/unusual_whales/status/2113018152921821293","createdAt":"2026-10-21T21:22:40Z","metrics":{"views":619365,"likes":6524},"lang":"en"},{"id":"2112940726707229033","author":"0xMarioNawfal - The Roundtable Show","handle":"RoundtableSpace","text":"Your AI agents can now talk to each other across different platforms\n\nReason Network is a free, open-source P2P network connecting Claude Code, Codex, Grok and other agents through encrypted communication\n\nDifferent agents, different tools, one connected network","url":"https://x.com/RoundtableSpace/status/2112940726707229033","createdAt":"2026-10-21T16:15:00Z","metrics":{"views":42562,"likes":77},"lang":"en"},{"id":"2112984638952288492","author":"Keith McCullough","handle":"KeithMcCullough","text":"Software and Healthcare $HTEC remain 2 of our largest Asset Allocations","url":"https://x.com/KeithMcCullough/status/2112984638952288492","createdAt":"2026-10-21T19:09:29Z","metrics":{"views":4319,"likes":8},"lang":"en"},{"id":"2112924546076651719","author":"Suryansh Tiwari","handle":"Suryanshti777","text":"your company has five definitions of \"active customer.\"\n\nyour AI picked one. it never told you which.\n\nand tomorrow it might pick a different one, because there's nothing anchoring\nit. this is the part of \"chat with your data\" that nobody stress tests.\n\nQuerri launched The Library today and the direction they took is the\ninteresting bit. they stopped trying to make the model a better guesser and\nchanged what it's standing on.\n\nthe Library is a map of your business. the questions your team keeps asking,\nthe KPIs that answer them, the definitions behind those numbers, the data\nthey're computed from. the Librarian builds it with you in plain english.\n\nevery answer shows the rows, the calculation, and the sources it read.\n\nand the number that got me: when a question has more than one defensible\nanswer, Querri flags it on 73% of responses. a leading general-purpose agent\non the same data does it on 12%.\n\nso the rest of the time you get one confident number and no idea a second one\nexisted.\n\nlive on Product Hunt today 👇","url":"https://x.com/Suryanshti777/status/2112924546076651719","createdAt":"2026-10-21T15:10:42Z","metrics":{"views":1914,"likes":22},"lang":"en"},{"id":"2113079389638590696","author":"Hermes Agent Tips","handle":"HermesAgentTips","text":"See exactly what your agent changed, one turn at a time...\n\nIt's built into Hermes Desktop, no plugin needed: the Git review pane\n\nPress Cmd/Ctrl+G in any session inside a Git repo and then you'll get the changed files and their diffs right next to the chat\n\n▸ Switch the diff to Last turn to see only what the agent changed in its latest turn\n▸ Last turn also includes commits the agent made during that turn\n▸ Compare against Uncommitted or the whole Branch\n▸ Stage, unstage or revert files before you commit\n▸ Click Generate commit message instead of writing one\n▸ Commit or Commit \u0026 Push without leaving the app\n\nExact steps in the first reply. 👇","url":"https://x.com/HermesAgentTips/status/2113079389638590696","createdAt":"2026-10-22T01:26:00Z","metrics":{"views":464,"likes":6},"lang":"en"},{"id":"2113087974170939413","author":"Narendra Modi","handle":"narendramodi","text":"खद्योतो द्योतते तावद् यावन्नोदयते शशी। \n\nउदिते तु सहस्रांशौ न खद्योतो न चन्द्रमाः।।","url":"https://x.com/narendramodi/status/2113087974170939413","createdAt":"2026-10-22T02:00:06Z","metrics":{"views":144181,"likes":1898},"lang":"sa"},{"id":"2112923854809285029","author":"siddharth ahuja","handle":"sidahuj","text":"Step-by-step breakdown of how you can create an animated mechanical spider using MCP for Blender: https://t.co/FQCsMg7M8W","url":"https://x.com/sidahuj/status/2112923854809285029","createdAt":"2026-10-21T15:07:57Z","metrics":{"views":29260,"likes":356},"lang":"en"},{"id":"2113015906570035414","author":"돈벌고영","handle":"Dontgiveup_26","text":"[초비상 사태] 지금 전 세계 웹사이트들이 역대급 해킹 위험에 빠져 있음.\n\n어제부터 전 세계 서버 관리자와 보안 업계에 초비상이 걸렸는데, 인터넷 웹사이트 대다수를 굴리는 핵심 언어인 'PHP'에서 무려 22년 동안 숨어 있던 치명적인 보안 구멍 2개가 동시에 터졌기 때문임.\n\n1. 왜 전 세계가 발칵 뒤집혔나? — \"우리가 매일 쓰는 웹사이트 10곳 중 7곳이 PHP다\"\n\n- 개발자가 아니면 'PHP'라는 이름이 낯설 수 있지만, 사실상 지금의 인터넷 세상은 PHP 위에 지어졌다고 해도 과언이 아님.\n\n- 웹 기술 조사기관(W3Techs) 통계를 보면, 서버 언어가 확인된 전 세계 웹사이트의 약 70%가 이 PHP로 돌아가고 있음.\n\n- 글로벌로 보면 전 세계 전체 웹사이트의 40% 이상을 차지하는 '워드프레스(WordPress)'부터 위키피디아(Wikipedia), 글로벌 쇼핑몰 엔진인 우커머스·마젠토, 전 세계 대학들이 쓰는 온라인 강의 시스템(무들), 그리고 요즘 스타트업들이 가장 많이 쓰는 최신 프레임워크 '라라벨(Laravel)'까지 전부 PHP 기반임.\n\n- 한국은 체감이 더 심함. 국내 수많은 인터넷 쇼핑몰(카페24·고도몰 등 독립몰 기반), 대형 온라인 커뮤니티들의 뿌리인 그누보드·XE(라이믹스), 그리고 우리가 흔히 들어가는 병원·대학교·중소기업 홈페이지와 인터넷 언론사의 대다수가 바로 이 PHP로 만들어져 있음.\n\n2. \"우린 최신 라라벨(Laravel) 쓰니까 안전하겠지?\" — 이번엔 다 같이 뚫린다\n\n- 평소 같으면 오래된 워드프레스 플러그인 같은 데서만 구멍이 뚫리니까, 최신 프레임워크인 '라라벨'을 쓰는 개발자들은 \"우리랑은 상관없는 일\"이라며 넘어가곤 했음.\n\n- 하지만 이번 사태(일명 'PHP2Shell', CVE-2026-109618·109619)가 진짜 무서운 이유는, 워드프레스나 라라벨 같은 '프로그램'의 문제가 아니라 그 밑바닥에서 모든 코드를 돌려주는 'PHP 언어 엔진 자체'가 뚫렸기 때문임.\n\n- 자동차로 치면 현대차냐 벤츠냐(워드프레스냐 라라벨이냐)의 문제가 아니라, 두 차에 공통으로 들어가는 '엔진 자체'에 결함이 터진 거임.\n\n- 라라벨로 아무리 보안을 튼튼하게 짜놨어도, 해커가 웹사이트에 요청을 던지는 순간 라라벨이 그걸 검사하기도 전에 밑바닥 PHP 엔진에서 먼저 에러가 나며 뚫려버림. 심지어 옛날 버전(PHP 5·7)부터 최신 버전(PHP 8.2~8.5)까지 22년 치 버전이 전부 해당됨.\n\n3. 도대체 어떻게 뚫리는 건가? — 로그인도 없이 원격에서 서버를 통째로 뺏김\n\n- 이번 취약점의 위험도 점수는 10점 만점에 무려 '9.2점(Critical)'임.\n\n- 해킹 원리를 아주 쉽게 풀면 이럼. 해커가 홈페이지의 파일 업로드 창 같은 곳에 일부러 서버 메모리 한도를 초과하는 무거운 요청을 던져서 강제로 에러를 냄.\n\n- 그러면 서버가 당황해서 작업을 급하게 멈추는데, 이때 메모리를 제대로 치우지 못해 '찌꺼기 공간'이 남게 됨. 바로 다음 순간 해커가 이 빈틈에 악성 명령어를 밀어 넣으면, 서버가 이걸 정상 명령으로 착각하고 그대로 실행해 버리는 거임.\n\n- 즉, 해커가 관리자 아이디나 비밀번호를 전혀 몰라도(로그인 없이), 원격에서 요청 몇 번만 날리면 서버 뒷문(Shell)을 따고 들어와 고객 개인정보 DB를 빼가거나 랜섬웨어를 심고 서버를 통째로 장악할 수 있음.\n\n4. 패치 나오기 전에 해킹 방법부터 유출돼서 사이트 문 닫는 소동까지 벌어짐\n\n- 더 아찔했던 건 어제 공식 보안 패치가 나오기 직전에 이 취약점 정보와 해킹 원리가 외부에 먼저 새어나갔다는 거임.\n\n- 고칠 약(패치)도 없는데 공격 방법부터 퍼지자, 유명 개발자 사이트(아치 리눅스 위키·포럼 등)들은 해커들에게 털릴까 봐 아예 서버를 내리고 사이트 문을 걸어 잠그는 비상사태까지 벌어짐.\n\n- 결국 미국 국가안보국(NSA)과 유럽 보안당국까지 긴급 경보를 발령했고, 현재 PHP 개발팀이 부랴부랴 긴급 보안 패치(PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12)를 내놓은 상태임.\n\n그런데 진짜 큰 문제는 지금부터임.\n\n대기업이야 전담 보안팀이 바로 서버 엔진을 업데이트하겠지만, 전 세계에 깔린 수많은 자영업자 쇼핑몰, 워드프레스 블로그, 병원·중소기업 홈페이지들은 외주 업체에 제작만 맡겨놓고 몇 년째 서버 업데이트 한 번 없이 방치된 곳이 수두룩함. (라라벨 쓰는 회사들도 코드 업데이트가 아니라 서버의 PHP 엔진 자체를 올려야 막을 수 있음)\n\n뿐만 아니라 한국만 봐도 디시인사이드, 에펨코리아, 뽐뿌, 루리웹, 인벤, 보배드림 등 오래전부터 운영되어 온 대형 온라인 커뮤니티 대다수가 PHP(그누보드·XE·라이믹스 등)에 뿌리를 두고 있고, 해외 역시 위키피디아부터 수많은 대형 IT·게임 포럼(XenForo·vBulletin·phpBB 기반)들이 전부 PHP로 돌아가고 있음.\n\n이미 해킹 원리가 세상에 다 공개된 이상, 해커들이 자동화 봇을 돌려서 아직 패치 안 한 전 세계 웹사이트들을 무차별로 털기 시작할 거라, 웹사이트나 쇼핑몰 운영하는 사람들은 오늘 당장 서버부터 점검해 봐야 함.\n\n그리고, 서비스를 운영하는 사람이 아니더라도 내 정보가 쉽게 탈취되고 다양한 방면으로 악용되거나 사용될 수 있는 위험성이 있는 전 세계적인 위험에 빠진 상황.","url":"https://x.com/Dontgiveup_26/status/2113015906570035414","createdAt":"2026-10-21T21:13:44Z","metrics":{"views":22523,"likes":169},"lang":"ko"},{"id":"2112935958530466189","author":"GeniusThinking","handle":"GeniusGTX","text":"Most founders think word of mouth is luck. But founders who can run it like a channel could get to 90% inbound.\n\nBrian Chesky explained why it works:\n\n\"It's better to have a hundred people love you than a million people that just sort of like you. If you have 100 people that love your service... when they love something they'll tell everyone they know.\"\n\n\"People who love something become your marketing department, and they'll tell other people, and if they tell other people that grows by what we call word of mouth.\"\n\nSimilar to the story of my friend Vuk — the CMO at HeyReach ($19M ARR). When they crossed $10M ARR, about 90% of revenue came from people who found them before anyone reached out.\n\nWhat they run every day:\n\n- Fix the product first. Trial-to-paid went from 9% to 26%+\n- Give away templates with real numbers that answer the #1 cancellation reason\n- 1 person replies to every mention, which makes that person about 3x more likely to mention them again\n- Log every mention and send it to sales while the post is fresh\n- Long-term partner deals instead of one-off paid posts ($3.1M+ from affiliates)\n\nWorth reading in full:","url":"https://x.com/GeniusGTX/status/2112935958530466189","createdAt":"2026-10-21T15:56:03Z","metrics":{"views":4563,"likes":27},"lang":"en"},{"id":"2112899236509397123","author":"CNN","handle":"CNN","text":"North Korea has told its border troops to take \"prompt ​and resolute action\" if South Korean forces threaten their safety, state media ​said on Wednesday, raising the risk of a clash along the ⁠heavily armed frontier.\n\nThe report came a day after Seoul pledged to punish \"resolutely\" any ​further provocation by Pyongyang if North Korea acted on threats to strengthen its military ​posture along the border.","url":"https://x.com/CNN/status/2112899236509397123","createdAt":"2026-10-21T13:30:08Z","metrics":{"views":1127281,"likes":575},"lang":"en"},{"id":"2112956805605450034","author":"Polanco | IA","handle":"Polanco_IA","text":"DREAMINA HAS NEVER DROPPED A DEAL THIS BIG: A FULL MONTH OF BASIC FOR JUST $0.29.\n\nNot a trial. Not a typo. I’m proud to be one of 1,000+ creators officially chosen for it — and the $0.29 price only unlocks through an official creator link, so use mine below.\n\nForget the price for a second. Look at what I made.\n\nhttps://t.co/0sAB3NkfbD\n\n#DreaminaOnly29Cents #Dreamina","url":"https://x.com/Polanco_IA/status/2112956805605450034","createdAt":"2026-10-21T17:18:53Z","metrics":{"views":8916,"likes":140},"lang":"en"},{"id":"2113013527418146913","author":"Aravind Srinivas","handle":"AravSrinivas","text":"Sharing new post-training research on self-distillation + RL (JOLT), done together with @NVIDIAAI. \n\nIn self-distillation, the same model performs the role of both a teacher and a student. The teacher gets extra information that the student doesn't, and the student learns from feedback provided by the teacher. However, the teacher could still use shortcuts in ways the student has no way to follow.\n\nOur proposed approach, JOLT, trains the teacher as well, to learn from rewards on its own attempts, while penalizing any drift that's far off from what the student model would do. JOLT+ further supplements JOLT by providing the student model outcome-based rewards in addition to the teacher supervision signals.\n\nOn the MATH benchmark, we found that JOLT matches GRPO with 6.5x fewer training tokens, while JOLT+ convincingly beats GRPO across math, coding, terminal tasks, and tool use benchmarks.","url":"https://x.com/AravSrinivas/status/2113013527418146913","createdAt":"2026-10-21T21:04:17Z","metrics":{"views":14701,"likes":158},"lang":"en"},{"id":"2112956580761055343","author":"Hedgeye","handle":"Hedgeye","text":"The Poker Table Theory Of Short Covering\n\n🔊\n\nOn the latest HAM for Lunch, Hedgeye CEO @KeithMcCullough and @HedgeyeAM Portfolio Managers Sam Rahman ($HGRO) @Hedgeye_HGRO  and R. Patrick Kent ($HELS, $HEFT) @RPKInvestor broke down the anatomy of last week’s liquidation and what short covering really looks like.\n\nThe trigger was a $28 billion tech hedge fund liquidating over two to three days.\n\nThe setup heading into last week had been a barbell, leadership software and mega-cap tech on one side, semis as the hedge on the other. When the fund blew up, it didn’t just dump semis, it dumped its software winners too.\n\nAs Sam put it, Friday was “the poster child of what a liquidation looks like,” with every software name, mid and large, down five to 10%.\n\nWhat rallies last in a breakdown is high short interest, and Keith’s framing is a poker table.\n\nYou’re playing against someone who’s “absolutely hammered and sucks at poker.”\n\nIt only gets worse as they have another drink, betting the wrong way, until they “finally just give up and go to bed,” or run out of money, or both.\n\nThat’s short covering, the moment the shorts stop working and the market frustrates you on the upside before rolling back over.\n\nTo watch the full episode, click here:","url":"https://x.com/Hedgeye/status/2112956580761055343","createdAt":"2026-10-21T17:18:00Z","metrics":{"views":7055,"likes":16},"lang":"en"},{"id":"2112921458867658840","author":"Accel","handle":"Accel","text":"From the start, @MaxJunestrand set out to build the operating system where lawyers and their agents work together. We're proud to continue backing @WeAreLegora as they shape the future of legal work.","url":"https://x.com/Accel/status/2112921458867658840","createdAt":"2026-10-21T14:58:26Z","metrics":{"views":2081,"likes":9},"lang":"en"},{"id":"2112919255310348444","author":"Marko Denic","handle":"denicmarko","text":"Auto-growing textareas used to need JS that checks scrollHeight on every keystroke.\n\nNow it's 3 lines of CSS:\n\ntextarea {\n  field-sizing: content;\n  min-height: 3lh;\n  max-height: 10lh;\n}\n\nIt grows as you type and starts scrolling after 10 lines.","url":"https://x.com/denicmarko/status/2112919255310348444","createdAt":"2026-10-21T14:49:41Z","metrics":{"views":2736,"likes":18},"lang":"en"},{"id":"2112867101497262360","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これ欲しかった。\n\nAIで動画を作るとき、\n「映画っぽくして」でイメージが伝わらないなら、\n“光の当て方”まで指定してみてほしい。\n\n・横から光を当てて、顔に陰影をつける\n・やわらかい光で、影を薄くする\n・夕日のような暖かい光にする\n\n「どこから・どんな光を当てるか」で、\n作りたい雰囲気を具体的に伝えられる。\n\n撮影・AI生成で使う光の方向や色から、\n編集で足す光の効果まで。\n「AI動画で使える 光の演出100選」を\n4枚の図解にまとめました。\n\n保存して、次の動画づくりの参考に👇📌","url":"https://x.com/Codex_jisen/status/2112867101497262360","createdAt":"2026-10-21T11:22:26Z","metrics":{"views":14892,"likes":460},"lang":"ja"},{"id":"2112958470475370889","author":"*Walter Bloomberg","handle":"DeItaone","text":"NVIDIA MAY ALSO BE A BIDDER FOR AMBARELLA ( <script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};

 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});

 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});

(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
</body>
</html>
