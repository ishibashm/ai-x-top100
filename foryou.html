<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-23T19:09:41+09:00","posts":[{"id":"2113269583750561883","author":"sergio","handle":"sergiorocaa","text":"Un dev japonés ha encontrado una forma de convertir Claude Code en una máquina de crear contenido. Y casi nadie está aprovechando esto.\n\nSe llama “Find Skills”.\n\nLo conectas a Claude Code mediante un paquete MCP, le dices qué quieres conseguir y él busca entre cientos de skills del ecosistema de Anthropic para montarte el workflow ideal.\n\nMira todo lo que puede hacer con un solo prompt:\n\n→ Guion del vídeo: Notion + Claude\n→ Selección de B-roll: Veo 3\n→ Thumbnail: Sora\n→ Caption y programación: Buffer\n→ Seguimiento de métricas: Typefully\n\nTodo conectado. Todo automatizado.\n\nSu canal de YouTube puede generar contenido de forma continua. Él solo tiene que decir qué resultado quiere.\n\nMientras muchos siguen usando la IA para escribir un texto un poco más rápido, este tío ha convertido todo su proceso de trabajo en un sistema que funciona prácticamente solo.\n\nLa diferencia no está en cuánto usas la IA, sino en todo lo que eres capaz de delegarle.\n\nGuárdalo, porque esto te puede ahorrar muchísimas horas. 🔖","url":"https://x.com/sergiorocaa/status/2113269583750561883","createdAt":"2026-10-22T14:01:46Z","metrics":{"views":23479,"likes":497},"lang":"es"},{"id":"2113517843807650018","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Meta AIのMuse、使い所がわかった！\nこれ、InstagramとThreadsの分析にメチャ強い。自分のアカウントと関連アカウントを分析させたら、白書並みのアウトプットをポン出ししてきた\n\n自己アカウント分析、類似・競合、話題、いいね、ブクマ、コメントなど。委託業者にお願いしていたコンサルレベルの分析が、好きな時に誰でも抽出できる。しかもAPI不要、アカウント連携だけでいける\n\nつまり、InstagramやThreadsをガチりたい人は、Museが破格のツールに豹変する\n\nしかも無料枠があって、この分析も週間使用枠の3%くらいしか使ってない。コスパはメチャ良い\n\nなので、\nXの情報を神のごとくチート級に操れるSSS級スキルが欲しい人はGrok Bot\n\nInstagramやThreadsの情報を操るチートスキルが欲しい人はMuse\n\nという使い方もあり\n\n最近出たClaude Duetが日本でも公開されたら、そいつを指揮官にしてAPIでX、Instagram、Threadsを繋げれば、ほぼ同じことができる\nけどそんな猛者、はぐれメタルくらいレアキャラ。Xの特定AIクラスターでしか出会えないレベルだし、私もそこまでやってない\n\nでも、このbot系のGrok BotやMuseを使えば、紐づいているサービスをほぼ専門知識ゼロで自由自在に扱えるってこと\n\nついにAIはbotによって、複雑な分析を小学生くらいの言語レベルでも実現できちゃうフェーズに来たなぁと実感した","url":"https://x.com/tetumemo/status/2113517843807650018","createdAt":"2026-10-23T06:28:15Z","metrics":{"views":9233,"likes":81},"lang":"ja"},{"id":"2113556445836792154","author":"くるしば | ソフトバンクよりReact本発売中","handle":"shiba_program","text":"Claude Codeの「eli5」ってプラグイン知ってる？\n\n「/eli5 DNSはどうやって動いているの？」みたいに打つと、大きな絵と少ない言葉だけのHTMLで、その仕組みを「5歳児に説明するように」図解してくれる\n\n・難しい概念や文章も、圧倒的にシンプル、簡単な説明になる\n・出てくるのはチャットの文章じゃなくて、ブラウザで開けるHTMLだから、そのまま保存して見返せる\n・利用を検討しているライブラリやツールなどをこれで比較検討するとかなり楽\n\n自分が学習していてわからないことや、理解のために深ぼって調べたりしないといけないことがあったら、これにサクッと投げてみるとよさそう","url":"https://x.com/shiba_program/status/2113556445836792154","createdAt":"2026-10-23T09:01:39Z","metrics":{"views":386,"likes":2},"lang":"ja"},{"id":"2113515874149666939","author":"そら","handle":"sora_biz","text":"ネーミングがセンスあるなぁ。\n\nClaude Code向けのスキル「imozuru（芋づる）」\n\n知らない分野の用語や研究者を探して、参考文献、引用先、著者の別の論文へと調査を広げる。\n\nここまでは、スキル化するほどの話ではないんだけどど。\n\nおもしろいのがここから。　　　　　　　　　　　　　　　　　　　　　　　　\n\n集めた原文は、要約せずに保存。\n\n最後に作るのも、きれいに結論をまとめたレポートじゃなくて、主張ごとに原文の該当部分を並べた「抜き書きのページ」。\n\nどの保存ファイルの何行目かも示してくれるんだって。\n\nREADME読んだら、「調べ始めの段階できれいにまとめると、そこで探索を終えてしまいやすい」、という考え方が説明されてた。\n\nたしかーに。\n\n新しい分野を勉強するときは、まだ何を知らないかもわからない。\n\nその段階で読みやすい答えが出ると、理解した気になっちゃう。\n\nimozuruは原文へ戻るための情報を残して、読むところを人間に渡す設計なんだね。\n\nもう一つよかったのが、抜き書きと原文を照合する仕組み。\n\n切り出した文章が、指定した行にそのまま存在しなければ、ページを作らない。AIが引用文を少し書き換えてしまうのを防ぐ。\n\nもちろん、原文と一致していても、その内容が正しいか、主張の根拠として十分かは別。\n\nそこを自分で判断したい僕にはピッタリのスキルだわ。","url":"https://x.com/sora_biz/status/2113515874149666939","createdAt":"2026-10-23T06:20:26Z","metrics":{"views":2995,"likes":49},"lang":"ja"},{"id":"2113425892785742007","author":"ML_Bear","handle":"MLBear2","text":"1Password のこれめちゃくちゃ便利そうだ📝\n\nGrok Botやdots用のVaultを作る→自分の1Password Vaultからパスを共有する→Grok Botたちはそれを使ってログインを行う\n\nまだGrok BotとMuseしか使えないけどdotsやDuetとかにも近日中に来るとのこと。","url":"https://x.com/MLBear2/status/2113425892785742007","createdAt":"2026-10-23T00:22:53Z","metrics":{"views":10972,"likes":81},"lang":"ja"},{"id":"2113389439460479186","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】Claude Securityがコードの変更に合わせて自動で再スキャンするように。Claude Enterpriseでパブリックベータが始まりました。\n\nスキャンを手動で回し直す手間がなくなるので、セキュリティ担当が少ない会社ほど助かりそう。\n\n・リポジトリの接続は1回だけ\n・初回にディープスキャンし、変更のたびに再スキャン\n・修正済みかを自動で判定し、再発したら再オープン\n・GitHubやGitLab等に対応、APIとMCPコネクタも\n・対象の組織に月2.5万ドル分のクレジットを2か月","url":"https://x.com/masahirochaen/status/2113389439460479186","createdAt":"2026-10-22T21:58:01Z","metrics":{"views":8447,"likes":39},"lang":"ja"},{"id":"2113571629422772304","author":"leopardracer","handle":"leopardracer","text":"F*ck YES... Claude Opus 5.5 just turned my TV into a solar power plant\n\none sentence and my roof, battery and whole house show up on screen - and it talks back\n\ntry with yours, here's step by step guide:\n\nstep 1 → open Claude Code on a computer connected to your home Wi-Fi\n\nstep 2 → it finds your inverter, battery and smart meter on the network and pulls their live data where your brand allows it\n\nstep 3 → it builds a full-screen dashboard: live solar flow, today's kWh, battery %, what went back to the grid\n\nstep 4 → add room sensors and a weather feed, it makes a climate screen and a 14 day forecast\n\nstep 5 → logins go into your keychain with one command, never into the chat\n\nstep 6 + the result → say hey Claude, show my solar power on my TV and every kilowatt your roof made today lights up the screen (84 kWh here, 98% off my own sun, battery still at 82% after dark)\n\nsave this to change your life today","url":"https://x.com/leopardracer/status/2113571629422772304","createdAt":"2026-10-23T10:01:59Z","metrics":{"views":119,"likes":7},"lang":"en"},{"id":"2113275303808160226","author":"beamnxw ./","handle":"beamnxw","text":"Opus 5.5 + Blender + Remotion = your own character animation studio that you can use to earn $$$\n\ntiny worlds. expressive characters. cinematic camera moves.\n\ncharacter idea → editable 3D scene → animated film\n\nsteal the full stack ↓\n\n01 / give Claude a director’s brief\n\none character. one setting. one visual joke\n\nspecify the shots, expressions, camera moves and final pose before building the scene\n\n02 / connect Claude Code to Blender\n\nMCP for Blender lets Claude inspect the scene and write Blender Python\n\nwith Blender + uv installed:\n\n- `claude mcp add blender uvx mcp-for-blender`\n- `uvx mcp-for-blender install-addon`\n\nenable the addon in Blender and start its server\n\n▸MCP for Blender\nhttps://t.co/b4HkhFY5kw\n\n03 / build + animate\n\nBlender handles the scene, rigging, keyframes and character animation\n\nblock the keyboard and character first. then add the walk, eye movements, glass and close-ups\n\n▸Blender animation tools\nhttps://t.co/ldG4DTXlb8\n\n04 / light the world\n\nPoly Haven supplies CC0 HDRIs, textures and models\n\ngive the glass something to reflect. keep the character readable against the background\n\n▸Poly Haven\nhttps://t.co/sDsNJzUe2n\n\n05 / finish the film\n\nRemotion assembles the rendered footage, titles and audio into a reusable composition\n\nadd the official agent guidance inside your video project:\n\n`npx skills add remotion-dev/skills`\n\n▸Remotion Skills\nhttps://t.co/zpstNcymn9\n\n06 / export + check\n\nFFmpeg for the delivery file\n\nwatch the actual MP4, check the sound and keep the editable scene + project\n\n▸FFmpeg\nhttps://t.co/fp1nOtYxZT\n\nthe loop:\n\nbrief → scene → character → materials → light → camera → preview → render → edit → export\n\nthe clip is the visual reference. the animated console breaks down a workflow for building this kind of scene\n\nsave this, then read the full guide for Opus 5.5 Motion Engineering ↓","url":"https://x.com/beamnxw/status/2113275303808160226","createdAt":"2026-10-22T14:24:29Z","metrics":{"views":42610,"likes":622},"lang":"en"},{"id":"2113261640905060768","author":"そう@『n8nの教科書』マイナビ出版 10/22発売","handle":"so_ainsight","text":"Claude Code x ブランドカラー図解、えぐい\n\n会社の色と書体で、図解を1枚。AIに組ませる「Diagram Design」が公開されました。\n\n2026年10月11日時点で、図の型は44種類。\n\n・言葉の指示からブラウザで開ける図を作成\n・作図道具のdraw(.)io、Mermaid、Excalidrawで作った図を描き直し\n・図のデータ（SVG）または画像（PNG）で書き出し\n\nなどを、Claude Codeを含む対応環境に追加できます👇","url":"https://x.com/so_ainsight/status/2113261640905060768","createdAt":"2026-10-22T13:30:12Z","metrics":{"views":1313,"likes":9},"lang":"ja"},{"id":"2113369499801960699","author":"Gresham","handle":"Greshamtrade","text":"THIS IS A PURE F*CKING GOLD\n\nbeyond SpaceXAI’s 146 official templates for Grok Bot, there are another 624+ ready-made bots you can use completely FREE. and almost nobody knows they exist\n\nfull teams with specialist roles, bots that hand work to each other, separate verifiers that check the output, and entire multi-bot trading desks. all open source\n\n20 GitHub projects worth opening first:\n\n01 awesome-grokbot → a searchable index of public Grok Bot configurations, organized by job. find an existing setup instead of writing every instruction yourself\nhttps://t.co/cK31BfIpWj\n\n02 botteams → pick a company team and copy its installer prompt. it creates named bots, a group chat, and proposes routines for your approval\nhttps://t.co/n11GpGjjYt\n\n03 rosterroom → 82 paste-ready team setups covering founders, operations, security, finance, and research. each includes roles, a first assignment, and approval boundaries\nhttps://t.co/UpbpyDF2Pj\n\n04 grok-bot-profiles → Spec Writer, Bug Reproducer, PR Producer, and PR Verifier. the verifier works in a separate conversation so the builder doesn’t approve its own work\nhttps://t.co/g9sHwUW4Bg\n\n05 hypergrok-trading-desk → 7 specialist bots and 17 skills for market research, strategy testing, risk, execution, and review. starts with public data; trades require your approval\nhttps://t.co/5xxbEtgWe3\n\n06 root-agent-skill-framework → a coordinator that sizes the team your request needs, creates specialists, and delegates daily management to leads\nhttps://t.co/h8cuQB53ZQ\n\n07 awesome-grokbot by mergisi → paste START.md into a setup bot and choose an engineering, sales, marketing, success, operations, or personal team\nhttps://t.co/g5BqnFCp0p\n\n08 grok-bot-templates → 49 templates, 10 teams, 47 skills, and 8 routines. each setup defines the job, deliverable, boundaries, and first task\nhttps://t.co/Y80HHXE9GM\n\n09 botskills → paste-ready BOT.md setups with required integrations and a clear boundary: the action each bot must never take without you\nhttps://t.co/ptkFVqGToz\n\n10 grok-skills → 195 reusable playbooks for code review, debugging, research, writing, planning, and shipping. add a proven process instead of another vague instruction\nhttps://t.co/2h4Oj71Ig1\n\n11 crew-contract → a working agreement for bot teams: defined missions, named owners, evidence in handoffs, completion checks, and stopping when the budget runs out\nhttps://t.co/Mp9CCKcfrV\n\n12 grokbot-for-gtm → an outbound playbook that connects prospect research, email, LinkedIn, replies, and meeting tracking. bring your accounts and approve the sends\nhttps://t.co/tVeOgybGbP\n\n13 gojiberryai-sales-os → 13 sales roles covering buying signals, prospect research, enrichment, copy, follow-ups, qualification, and pipeline analysis through the GojiberryAI MCP\nhttps://t.co/4L04IIX6ue\n\n14 grok-research → an equity research team with persistent researchers, scout reports, reviewed views, and a shared research database. research stays separate from live trading\nhttps://t.co/yV2l6eNXWJ\n\n15 grok-bot-token-saver → a chief-and-workers setup that replaces dragging old conversations forward with short role cards and handoffs for the next session\nhttps://t.co/VsmuOaP2t1\n\n16 grok-bot-cli → create bots and groups, send messages, and inspect threads from scripts. it reuses your signed-in desktop session without manual token copying\nhttps://t.co/sf5QajmPp2\n\n17 grok-bot-skill → let a coding agent list, message, and create Grok Bot teammates, connecting development work with the bots already running your workflows\nhttps://t.co/jdveNbl31H\n\n18 awesome-grok-bot by majiayu000 → another searchable catalog of public bot shares, plus team recipes, setup guides, and community tools organized by job\nhttps://t.co/s2JOnHHKqn\n\n19 akeru-bot → a separate, self-hosted alternative with named teammates, per-bot tools, instructions, and memory. keep profiles and conversation history on infrastructure you control\nhttps://t.co/o2PEKs9fcc\n\n20 guaca → a separate desktop workspace where agents share conversations, delegate tasks, and use MCP tools. run the workspace locally or on your own server\nhttps://t.co/QdbccKU5Ay\n\nstart with one job you already understand. read the setup, connect the tools it needs, and inspect the first result before scheduling it\n\nthe templates and source code are free. running them still uses your plan, APIs, or hosting\n\nthen make the team share findings instead of repeating research. keep handoffs short, preserve completed work, and give failed operations a stopping point\n\nsave this. your next useful bot might already be built\n\nthe article below breaks down 7 workflow changes to make that setup cheaper and get more finished work from the same budget ↓","url":"https://x.com/Greshamtrade/status/2113369499801960699","createdAt":"2026-10-22T20:38:47Z","metrics":{"views":40953,"likes":516},"lang":"en"},{"id":"2113353404470964375","author":"codila","handle":"0xCodila","text":"F*ck YES... Claude Opus 5.5 just reverse-engineered my home\n\none prompt found every device on my Wi-Fi - now one chat runs them all\n\ntry with yours, here's step by step guide:\n\nstep 1 → copy prompt below and paste it into Claude Code on a computer on your home Wi-Fi\n\nstep 2 → It scans your whole network and names everey device it finds, brand and model where it can\n\nstep 3 → for each one it tells you what's wrong and what it can fix or improve\n\nstep 4 → pick the devices to take over, it backs up each one first\n\nstep 5 → passwords go into your keychain with one command, never into the chat\n\nstep 6 + the result → say yes and Claude fixes your slow Wi-Fi, cuts ads and bloat on your TV, sets schedules on your AC and much more (every change has an undo)\n\nChange your life today. Then read article below on full reverse-engineering:","url":"https://x.com/0xCodila/status/2113353404470964375","createdAt":"2026-10-22T19:34:50Z","metrics":{"views":13487,"likes":187},"lang":"en"},{"id":"2113518286113767883","author":"オープンソース研究所","handle":"opensourcelab9","text":"Nuxt で管理画面を作っていて、グラフだけ別の道具に頼っている人へ👀\nNuxt UI v4.12 から、同じ部品集の中に Chart が入りました。\nhttps://t.co/WbwwMmlJqw\n・Chart 部品の土台は TanStack Charts。動画では折れ線とドーナツを描いている\n・UApp が Nuxt の言語設定を見て、使う言語のぶんだけを同梱する\n・画面に重ねて出す部品を後から読み込むので、ページの JavaScript が最大27%減る\n\nNuxt のモジュールとしても、普通の Vue アプリでも使えます。AIチャット用のひな形も付いています。\nグラフのためだけに別の道具を探して組み込む手間が、いつもの部品集の中で片づきます。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2113518286113767883","createdAt":"2026-10-23T06:30:01Z","metrics":{"views":284,"likes":0},"lang":"ja"},{"id":"2113308155270541536","author":"Caleb","handle":"calebfahlgren","text":"We just launched OpenUSD support on the @huggingface Hub 🎉\n\nYesterday, @nvidiaomniverse put 2,500+ SimReady assets on the Hub. Forklifts, robot arms, engines, hospital equipment, all OpenUSD.  You can also search the whole library in plain English\nhttps://t.co/SU8mXQQRzL","url":"https://x.com/calebfahlgren/status/2113308155270541536","createdAt":"2026-10-22T16:35:02Z","metrics":{"views":71783,"likes":1143},"lang":"en"},{"id":"2113241831387361395","author":"savip.","handle":"savipww","text":"I can't stop f*cking laughing, I gave my Grok bots one order, beat yesterday's double or get shut down, I slept and they turned my $17,600 into $50,440\n\nthat's 2.87x in one night. yesterday they only doubled $8,506\n\nall 5 coins came off one screen, fomo. my bots scan it all night\n\nsame app, 10% off fees for life through my link: https://t.co/bORyfVraCb\n\ni gave Grok @bot 5 desks, one bot team per coin\n\neach desk got a fifth of the bank. 10% sits in the coin all night, the rest trades only what passes 6 rules\n\nthe night:\n\n→ 7:40pm $17,600\n→ 8:45pm the pumpfun desk buys PANGEA at a $466K market cap\n→ 9:35pm sells it at $2.37M, +410% in 50 minutes, bank $37,933\n→ 1:40am $43,379\n→ 5:30am $47,397\n→ 7:55am $50,440\n\nthe funny part, my Robinhood desk sold KIMCHIBULL at $1.68M, up 122%\n\nthen it ran to $11.37M without us\n\none rule says never buy in the middle of a rocket, so 6 bots sat there and watched a 6.8x\n\nhonestly i still can't look at that chart\n\ni kept the 6 rules boring on purpose:\n\n1. no pool under $40K\n2. no coin with dead volume\n3. no buying a chart that's already vertical\n4. no coin where sells beat buys 2 to 1\n5. 2 losses in a row and the bot is out\n6. a post on X is research, never the trigger\n\n2 coins lost almost half overnight, Kimchi -45% and BACKERS -46%. both desks still ended green\n\n21 green trades, 10 red, worst loss -5.6%\n\nwatch 0:02, the PANGEA chart goes vertical\n\nhow i built this desk, prompts included, is in the article below ↓ free\n\nwould you let your bot sit out a 6.8x because a rule said so?\n\nbookmark it for the night your bot sells too early","url":"https://x.com/savipww/status/2113241831387361395","createdAt":"2026-10-22T12:11:29Z","metrics":{"views":38970,"likes":270},"lang":"en"},{"id":"2113229369493623148","author":"Chesny","handle":"chesny","text":"CLAUDE FABLE 5.1 GRATIS  \n\nPuedes probarlo gratis directamente desde https://t.co/pUE4iTGKyI \n\nCómo empezar:     \n\n1. Regístrate con Gmail    \n2. Selecciona Claude Fable 5.1    \n3. Empieza a usarlo gratis  \n\nEspero que lo disfrutéis 🥸","url":"https://x.com/chesny/status/2113229369493623148","createdAt":"2026-10-22T11:21:58Z","metrics":{"views":9095,"likes":163},"lang":"es"},{"id":"2113463346330767563","author":"Sadao Tokuyama","handle":"tokufxug","text":"AIでテニス動画を自動解析🎾\n\n🔹20秒の映像からボールのイン・アウト、球速、選手の速度・移動距離を推定\n🔹WASB＋HRNetでボール追跡、YOLO11で選手検出。球速はレーダー36球で検証\n🔹動画加工・出力まで対応。処理は約1分\n\n開発：Kerem Guvelioglu氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2113463346330767563","createdAt":"2026-10-23T02:51:42Z","metrics":{"views":3199,"likes":71},"lang":"ja"},{"id":"2113247856538878459","author":"Niko","handle":"guishou_56","text":"这个牛逼啊\n\nSpaceXAI 刚一口气上了 146 个 Grok 机器人，全部免费。\n\n不用从零教，提前调教好了，装上就能干活。\n\n有解决SEO和AEO问题的，还有帮你找用户的\n\n传送门：https://t.co/0xNq2is30B","url":"https://x.com/guishou_56/status/2113247856538878459","createdAt":"2026-10-22T12:35:25Z","metrics":{"views":8429,"likes":77},"lang":"zh"},{"id":"2113260472153878872","author":"Creative.Edge CL+","handle":"Mr_CreativeEdge","text":"AIアイドル感情エンジン（Codex, Claude Codeで構築）\nパーソナリティリファレンスで個性を固定したもの\n動画生成モデル：Wan 3.0","url":"https://x.com/Mr_CreativeEdge/status/2113260472153878872","createdAt":"2026-10-22T13:25:33Z","metrics":{"views":34121,"likes":327},"lang":"ja"},{"id":"2112973191157252103","author":"Juraj Bednar🏴💛🌘","handle":"jurbed","text":"I highly recommend cloudflare's security audit skill: https://t.co/Mu6Dm0fzk8 \n\nRun it on all your software. Run it with the free models. Use it even if you used a model to audit something - it will find much more things. Works in all agent harnesses and is model independent.","url":"https://x.com/jurbed/status/2112973191157252103","createdAt":"2026-10-21T18:24:00Z","metrics":{"views":541975,"likes":8132},"lang":"en"},{"id":"2113243170788278767","author":"陈成","handle":"chenchengpro","text":"读了 @poteto 的 pstack，记一些点。\n\n1. pstack 不是 56 个单独的 skill，而是一套方法论和工作流。先做验证 skill 和 feature map，让 agent 能自己跑起并操作应用。再用 /poteto-mode 按任务类型走固定流程。最后才轮到并行和自动合并。第一步没做好，后面多开 agent 只会更贵，不会更可信。她演讲里的分法是，验证管\"对不对\"，pstack 管\"好不好\"。\n\n2. 建验证的方法值得花时间。先把应用做成 CLI，命令能组合，破坏性操作带 --dry-run，输出 JSON，报错时告诉 agent 下一步怎么做。再建 feature map，每个功能写清从哪进、怎么用、CLI 怎么驱动、有哪些坑。她管这个叫\"物化的记忆\"。我准备先找个 demo 产品试一下，照着她的 Atlas 示例来。\n\n3. 技术栈影响生产力，这点我深有体会。那 agent 友好的技术栈是什么？我目前的答案是轻、快、可调试、可控制。Electron 和 Web 有 CDP，iOS 有模拟器。运行时越难调、越难控，agent 越难用。她说值得为此自建调试工具，甚至换栈。\n\n4. 补上下文的几个 skill 也值得一看。/teach 会调 /how 追运行机制，调 /why 去 git、PR 评论、Linear、Slack、Sentry 里查当初为什么这么写。/recall 从历史会话里捞上下文。还有 /in-your-own-words，让 agent 先用自己的话复述问题，理解偏了能早点发现。\n\n5. 她反对对抽象计划做对抗式评审。原因是 agent 会臆想风险，给不会发生的边界情况加防护。她的做法是先做两三个可切换的原型，用验证 skill 截图测量。然后让几个模型家族各出一版类型签名级的设计，互相评判，挑一个再实现。我之前一直用对抗式评审，确实能想到很多 edge case，但也有不少是多余的。下次试试拿原型换掉一部分评审，看会漏掉多少。\n\n6. 56 个 skill 里有 55 个禁了模型调用，Claude Code 的 Skill 工具会直接拒绝。镜像版建了一张映射表，让 agent 去读对应的 SKILL.md 照着做。能用，但 skill 之间每调一次都多一步，也多吃上下文。这方案比很多产品直接给你塞一堆模型可调用的 skill 好要多了。\n\n7. 她视频里讲的外循环不在 pstack 里。Grok Bot 接了 Slack、Datadog、Sentry，订阅 Slack 线程和 Sentry 告警，自动派云 agent 去复现 bug、开 PR。她一个月 2,500 个 PR，主要靠这一层和验证，pstack 只占一小块。这层得自己搭。\n\n8. 把反复纠正变成结构的四级顺序也值得一看。用架构或数据结构根除 \u003e lint 或测试让 CI 拦 \u003e skill 或规则 \u003e 人工 review。第四级她直接标成 ngmi。她的 Dune 框架就是第一级的例子。每件事只留一种写法，看到坏模式先写 lint 止血，再让 agent 清理，让代码库一直保持\"agent 照抄也不会错\"。我打算挑一个 agent 老犯的错，用 /correct 试一次。\n\n详细 research 见 https://t.co/4WIxwx4wfA 。","url":"https://x.com/chenchengpro/status/2113243170788278767","createdAt":"2026-10-22T12:16:48Z","metrics":{"views":33427,"likes":498},"lang":"zh"},{"id":"2113314744711143577","author":"Liquid AI","handle":"liquidai","text":"Today, we announce 𝙻𝚒𝚚𝚞𝚒𝚍 𝚁𝙸𝙿𝙻 (real-time inference pipeline), our ultra low-latency inference engine built to put LFMs directly in the request path of real-time workloads like search, ads, fraud, recommendations, and payments.\n\n\u003e complete generated responses end-to-end in sub 50ms\n\u003e maintains low latency under continuous peak load\n\u003e LFMs get up to 20x faster on RIPL\n\u003e RIPL supports Multimodal LFMs\n\u003e RIPL supports d1, our decision models too!\n\nRIPL optimizes the full path from request arrival to a complete generated response. As traffic rises, its performance advantage is greatest on the slowest requests. Let’s see some production use cases:","url":"https://x.com/liquidai/status/2113314744711143577","createdAt":"2026-10-22T17:01:13Z","metrics":{"views":79263,"likes":896},"lang":"en"},{"id":"2113234247909871621","author":"도파민(Dopamine) l Nanotrading.xyz","handle":"dopamine_crypto","text":"수정 5번 만에 런칭 영상 뽑은 클로드 스킬\n\n애프터이펙트도 없고 편집 앱도 안 씀. 영상을 그냥 코드로 만드는 스킬임 ㄷㄷ\n\nclaude-motion-design이라는 건데, HTML로 화면 짜고 프레임 하나하나 렌더링해서 모션블러까지 넣고, 음악 비트에 맞춰서 장면을 자름. 효과음도 소리 제일 센 지점에 딱 맞춰 붙여줌\n\n만든 회사가 자기네 서비스 런칭 영상을 이걸로 클로드랑 5번 왔다갔다 하면서 만들었다고 함. 24초짜리 60프레임\n\n크로미움, ffmpeg, 파이썬만 쓰니까 라이선스나 구독료가 없음. \"전환 더 빠르게\", \"음악 바꿔줘\" 같은 말이 그냥 코드 수정이라 클로드한테 말로 시키면 됨\n\n이렇게 쓰면 됨\n1. 스킬 폴더를 ~/.claude/skills 에 복사\n2. 파이썬 패키지(playwright 등) 설치하고 크로미움 설치\n3. 클로드 코드에서 영상 만들어달라고 하거나 /motion-design 입력\n\n스마트스토어 상품 소개 영상, 쇼츠 인트로, 회사 서비스 소개 영상 같은 데 바로 붙일만함. 깃허브 별 627개\n\n매달 편집툴 구독료 내던 거 생각하면 좀 허탈하긴 함\n\n요즘 OPUS 가 너무 잘해서 안써도 무관하지만 그래도 혹시 모르니 링크 달아봄!","url":"https://x.com/dopamine_crypto/status/2113234247909871621","createdAt":"2026-10-22T11:41:21Z","metrics":{"views":5526,"likes":147},"lang":"ko"},{"id":"2113210864232984833","author":"旺旺","handle":"TiagerBao","text":"同一台 Mac 跑本地大模型，69 tokens/s 和 161 tokens/s 的差距，居然来自推理引擎。\n\n开源项目 Kapitsa，专门针对 Apple Silicon 优化。\n\n官方测试：M4 Pro、48GB 内存，运行 Qwen3.6 35B-A3B（4-bit）：\nllama.cpp：69 tokens/s\nOllama：89 tokens/s\nKapitsa：161 tokens/s\n核心是 KFlash，通过树状推测解码，一次验证更多候选 Token，减少重复计算。\n\n还支持：\nClaude Code、Codex、OpenCode 接入本地模型\nOpenAI / Anthropic 兼容 API\nSSD 缓存，重启后复用上下文\n多 Agent 并发推理\n\n安装只需：\nbrew install nace-ai/tap/kapitsa\n数据来自项目自己的 Benchmark，实际速度取决于 Mac 配置。\n\nMac 跑本地 Coding Agent，值得拿来和 Ollama 实测一轮。\n\nGitHub：https://t.co/SHcRjc1Eso\n\n#AI #Agent #LLM #ClaudeCode #Codex #AppleSilicon #OpenSource","url":"https://x.com/TiagerBao/status/2113210864232984833","createdAt":"2026-10-22T10:08:26Z","metrics":{"views":11368,"likes":135},"lang":"zh"},{"id":"2113548466768990318","author":"مالك بن حمود المالك","handle":"cnemalek","text":"عبقري نشر على GitHub طريقة تخليك تواصل البرمجة بدون ما توقف بسبب نفاد التوكنات! 🔥\n\n✅ نقطة اتصال واحدة تجمع 375 مزوّد ذكاء اصطناعي، وأكثر من 150 منهم يوفرون طبقة مجانية.\n\n✅ إذا خلصت حصة أحد النماذج، ينتقل تلقائيًا للنموذج اللي بعده.\n\n✅ متوافق مع Claude Code وCodex وCursor وOpenCode وCline وCopilot.\n\n✅ يضغط سياق المحادثة ويوفّر من 15% إلى 95% من استهلاك التوكنات.\n\n✅ يشتغل على جهازك، مفتوح المصدر بترخيص MIT، وعنده 79.1 ألف نجمة على GitHub.\n\nاسمه OmniRoute. 🚀\n\nرابط المستودع 👇","url":"https://x.com/cnemalek/status/2113548466768990318","createdAt":"2026-10-23T08:29:56Z","metrics":{"views":1954,"likes":37},"lang":"ar"},{"id":"2113469231429980501","author":"Brooklyn!","handle":"imbabybrooklyn","text":"Little preview of something I've been working on! \n\nYou can connect to any provider, or through any harness like Hermes Agent, and the setup is instant with no configuration required, unless you want to.\n\nProactive, self-aware, and will be fully open source https://t.co/K7Ue7rEZ3L","url":"https://x.com/imbabybrooklyn/status/2113469231429980501","createdAt":"2026-10-23T03:15:05Z","metrics":{"views":95528,"likes":915},"lang":"en"},{"id":"2113435074834165972","author":"FHILY👑","handle":"Oluwaphilemon1","text":"Qwen3.8-27B reportedly went from 82 to 381 tokens/sec on a single RTX 3090 with 24GB VRAM.\n\nThat’s a 4.6× throughput increase without changing the GPU or the model.\n\nDeveloper TeksEdge achieved this by optimizing the inference stack, combining speculative decoding, context lookup, and more efficient verification.\n\nHere’s how the reported performance evolved:\n\nBaseline: 82 tokens/sec\nOptimized MTP: 114 tokens/sec\nDFlash2 + context lookup: 138 tokens/sec\nOptimized lookup verification: 381 tokens/sec\n\nThree techniques explain the gains.\n\n1. Speculative decoding\n\nNormally, a language model generates one token at a time. Each step depends on the previous output, creating a sequential bottleneck.\n\nSpeculative decoding uses a faster drafting process to propose multiple tokens for the main model to verify together. When several proposals are accepted, the model can generate more text with fewer expensive decoding steps.\n\nIn this experiment, optimized MTP increased throughput from 82 to 114 tokens/sec. Adding DFlash2 and context lookup raised it to 138 tokens/sec.\n\n2. Context lookup\n\nIf the text a model needs to generate already exists in its input, why generate every token from scratch?\n\nContext lookup searches for reusable sequences in the existing context and proposes them for verification.\n\nTeksEdge reports processing blocks of up to 16 tokens and accepting roughly 15 tokens per block.\n\nOn a 25,000-token document reproduction task, throughput reportedly increased from approximately 260 to 382 tokens/sec.\n\nHowever, context lookup works particularly well when generated text overlaps with the input. It offers fewer opportunities for ordinary open-ended conversations where the output is largely new.\n\n3. Prefix caching\n\nCoding agents repeatedly process the same system instructions, repository files, and code snippets across multiple requests.\n\nPrefix caching stores reusable computations from previously processed prompts, allowing the system to skip redundant prefill work when those prefixes appear again.\n\nIn TeksEdge’s reported test, time to first token dropped from 22.4 seconds to 0.56 seconds.\n\nThat’s roughly a 40× reduction in initial waiting time.\n\nFor coding agents working with large repositories, this can make repeated interactions significantly more responsive.\n\nThe important distinction\n\nThe 381 tokens/sec figure is not representative of ordinary chat generation.\n\nTeksEdge reports approximately 133 tokens/sec for regular chat, while the higher figure comes from a workload that benefits heavily from context reuse and optimized verification.\n\nThese results measure different workloads and shouldn’t be compared as if they were equivalent.\n\nStill, the experiment highlights an important aspect of local AI inference.\n\nThe RTX 3090 remained the same. Qwen3.8-27B remained the same. The improvement came from reducing redundant computation and making better use of each verification step.\n\nBetter inference software can unlock performance that a hardware upgrade alone might not deliver.\n\nFor anyone running large models locally, optimizing the decoding and caching pipeline can be just as important as choosing the GPU.","url":"https://x.com/Oluwaphilemon1/status/2113435074834165972","createdAt":"2026-10-23T00:59:22Z","metrics":{"views":8132,"likes":53},"lang":"en"},{"id":"2113337764607639621","author":"Ridark","handle":"ridark_eth","text":"Opus 5.5 is the coldest $0 hire in AI.\nOne builder's agent replaced a $200,000-a-year role overnight.\n\nChief-of-staff agent running Opus 5.5 inside Viktor. Its own cloud computer. Owner's laptop shut. One rule: find $50,000 a month of new business, public data only, contact nobody without a yes.\n\nBuilder's overnight log:\n\n→ 9PM SPLIT the goal into 4 jobs, each with a day and a deadline\n→ 11PM PULLED 240 dental clinics in Austin off Google Maps, cut every chain\n→ 1AM READ every remaining site, kept 25 with one noticed detail each\n→ 2AM WROTE an opener for all 25, sent zero\n→ 3AM BUILT the offer on one page, price left blank for the owner\n→ 8AM Owner typed $2,000. 25 × $2,000 = $50,000/month on the table\n\n$50,000 a month is potential revenue on a goal table, not signed clients. Nothing ships without the owner's yes.\n\nThe blank price is the real gate. An agent that fills in your price loses the deal before you open your laptop.\n\nEvery Monday it runs again. 100 new clinics a month. The funnel never stops.","url":"https://x.com/ridark_eth/status/2113337764607639621","createdAt":"2026-10-22T18:32:41Z","metrics":{"views":5770,"likes":80},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-23T19:09:41+09:00","posts":[{"id":"2113524098236313838","author":"やま","handle":"yama_threads","text":"メタから電撃発表された『Muse』やばすぎる。\n本日10/23(金)に日本でも正式提供開始。Meta社公式のAIエージェントだからスレッズ・インスタはこれだけで自動運用可能。git連携したらナレッジも共有できるから。もう何十万もかけてmac mini×Claude Codeぶん回す電気代無駄使いは終わり。できること全部解説する↓","url":"https://x.com/yama_threads/status/2113524098236313838","createdAt":"2026-10-23T06:53:07Z","metrics":{"views":4661,"likes":16},"lang":"ja"},{"id":"2113542042299326809","author":"CodeX 実践塾","handle":"Codex_jisen","text":"集客ページ、広告文、営業メール\n全部ひとりで考えている人へ。\n\nCodexやClaude Codeに、マーケティングの「仕事の手順書」を渡せる無料公開のスキル集がありました。\n\n名前は「Marketing Skills」。\n単に文章を作るだけでなく、何を確認し、どんな順番で考えるかをAIに渡す仕組みです。\n\n使い道を5つ、頼み方とセットでまとめました👇\n\n① 競合との違いを整理\n「この3社のサイトを比較して。誰向けの商品で、何が強みか、根拠付きでまとめて」\n\n② 商品ページの文章を改善\n「このサービス説明を、初めて読む人にも伝わる見出しと本文に直して」\n\n③ 申し込みにくい原因を探す\n「料金への不安やフォームの面倒さなど、このページの改善候補を優先順で出して」\n\n④ 広告の切り口を増やす\n「この商品資料から、お客さんの悩み別に広告の見出し案を作って」\n\n⑤ 営業メールを下書き\n「この相手への提案メールを考えて。実績や数字は、渡した情報だけを使って」\n\nまずは、今止まっている仕事を1つ。\n商品説明・誰に届けたいか・目的を渡して、案を出してもらうところから。\n\n使いたい人はこちらから↓","url":"https://x.com/Codex_jisen/status/2113542042299326809","createdAt":"2026-10-23T08:04:25Z","metrics":{"views":298,"likes":1},"lang":"ja"},{"id":"2113269583750561883","author":"sergio","handle":"sergiorocaa","text":"Un dev japonés ha encontrado una forma de convertir Claude Code en una máquina de crear contenido. Y casi nadie está aprovechando esto.\n\nSe llama “Find Skills”.\n\nLo conectas a Claude Code mediante un paquete MCP, le dices qué quieres conseguir y él busca entre cientos de skills del ecosistema de Anthropic para montarte el workflow ideal.\n\nMira todo lo que puede hacer con un solo prompt:\n\n→ Guion del vídeo: Notion + Claude\n→ Selección de B-roll: Veo 3\n→ Thumbnail: Sora\n→ Caption y programación: Buffer\n→ Seguimiento de métricas: Typefully\n\nTodo conectado. Todo automatizado.\n\nSu canal de YouTube puede generar contenido de forma continua. Él solo tiene que decir qué resultado quiere.\n\nMientras muchos siguen usando la IA para escribir un texto un poco más rápido, este tío ha convertido todo su proceso de trabajo en un sistema que funciona prácticamente solo.\n\nLa diferencia no está en cuánto usas la IA, sino en todo lo que eres capaz de delegarle.\n\nGuárdalo, porque esto te puede ahorrar muchísimas horas. 🔖","url":"https://x.com/sergiorocaa/status/2113269583750561883","createdAt":"2026-10-22T14:01:46Z","metrics":{"views":23479,"likes":497},"lang":"es"},{"id":"2113459884356436120","author":"Sadao Tokuyama","handle":"tokufxug","text":"防犯カメラ×オープンソースAIで視線ヒートマップを作成\n\n🔹YOLO11-poseで人物・骨格、Gaze-LLEで視線、Depth Anything V2で奥行き推定\n🔹棚ごとの注目度を可視化し、Blenderで店舗を3D再現して棚を見る時間を推定\n\n開発：Claudio Escudero氏\n※リアルタイム処理ではなく数値は推定値\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2113459884356436120","createdAt":"2026-10-23T02:37:57Z","metrics":{"views":3177,"likes":76},"lang":"ja"},{"id":"2113569338636599416","author":"Mike Kipruto","handle":"itsMikeKipruto","text":"🚨 Oracle issued an emergency Java security update for CVE-2026-91403, a critical vulnerability rated CVSS 9.1.\n\nThe flaw affects Java’s certificate trust handling and could allow unauthenticated attackers to access or modify sensitive data.\n\nOracle’s fix blocks trust in affected eMudhra intermediate certificates.\n\nIf you run Java SE or GraalVM:\n• Check your runtime versions.\n• Apply the relevant security update.\n• Verify bundled and server-side Java installations.\n\nHTTPS is only as trustworthy as the certificates your software accepts.\n\nOfficial advisory:","url":"https://x.com/itsMikeKipruto/status/2113569338636599416","createdAt":"2026-10-23T09:52:53Z","metrics":{"views":197,"likes":5},"lang":"en"},{"id":"2113275303808160226","author":"beamnxw ./","handle":"beamnxw","text":"Opus 5.5 + Blender + Remotion = your own character animation studio that you can use to earn $$$\n\ntiny worlds. expressive characters. cinematic camera moves.\n\ncharacter idea → editable 3D scene → animated film\n\nsteal the full stack ↓\n\n01 / give Claude a director’s brief\n\none character. one setting. one visual joke\n\nspecify the shots, expressions, camera moves and final pose before building the scene\n\n02 / connect Claude Code to Blender\n\nMCP for Blender lets Claude inspect the scene and write Blender Python\n\nwith Blender + uv installed:\n\n- `claude mcp add blender uvx mcp-for-blender`\n- `uvx mcp-for-blender install-addon`\n\nenable the addon in Blender and start its server\n\n▸MCP for Blender\nhttps://t.co/b4HkhFY5kw\n\n03 / build + animate\n\nBlender handles the scene, rigging, keyframes and character animation\n\nblock the keyboard and character first. then add the walk, eye movements, glass and close-ups\n\n▸Blender animation tools\nhttps://t.co/ldG4DTXlb8\n\n04 / light the world\n\nPoly Haven supplies CC0 HDRIs, textures and models\n\ngive the glass something to reflect. keep the character readable against the background\n\n▸Poly Haven\nhttps://t.co/sDsNJzUe2n\n\n05 / finish the film\n\nRemotion assembles the rendered footage, titles and audio into a reusable composition\n\nadd the official agent guidance inside your video project:\n\n`npx skills add remotion-dev/skills`\n\n▸Remotion Skills\nhttps://t.co/zpstNcymn9\n\n06 / export + check\n\nFFmpeg for the delivery file\n\nwatch the actual MP4, check the sound and keep the editable scene + project\n\n▸FFmpeg\nhttps://t.co/fp1nOtYxZT\n\nthe loop:\n\nbrief → scene → character → materials → light → camera → preview → render → edit → export\n\nthe clip is the visual reference. the animated console breaks down a workflow for building this kind of scene\n\nsave this, then read the full guide for Opus 5.5 Motion Engineering ↓","url":"https://x.com/beamnxw/status/2113275303808160226","createdAt":"2026-10-22T14:24:29Z","metrics":{"views":42610,"likes":622},"lang":"en"},{"id":"2113314744711143577","author":"Liquid AI","handle":"liquidai","text":"Today, we announce 𝙻𝚒𝚚𝚞𝚒𝚍 𝚁𝙸𝙿𝙻 (real-time inference pipeline), our ultra low-latency inference engine built to put LFMs directly in the request path of real-time workloads like search, ads, fraud, recommendations, and payments.\n\n\u003e complete generated responses end-to-end in sub 50ms\n\u003e maintains low latency under continuous peak load\n\u003e LFMs get up to 20x faster on RIPL\n\u003e RIPL supports Multimodal LFMs\n\u003e RIPL supports d1, our decision models too!\n\nRIPL optimizes the full path from request arrival to a complete generated response. As traffic rises, its performance advantage is greatest on the slowest requests. Let’s see some production use cases:","url":"https://x.com/liquidai/status/2113314744711143577","createdAt":"2026-10-22T17:01:13Z","metrics":{"views":79263,"likes":896},"lang":"en"},{"id":"2113508214243573866","author":"Elon Musk","handle":"elonmusk","text":"Talarico supports voting fraud","url":"https://x.com/elonmusk/status/2113508214243573866","createdAt":"2026-10-23T05:50:00Z","metrics":{"views":857416,"likes":10604},"lang":"en"},{"id":"2113301988939030993","author":"marcus","handle":"marcusyul","text":"IDEOGRAM ACABA DE HACER QUE CUALQUIERA PUEDA CREAR UN LOGO PROFESIONAL CON UNA FRASE\n\nNo te da una imagen. Te da el archivo vectorial de verdad:\n\n→ El texto sale bien escrito\n→ Cada forma es editable\n→ Escala sin pixelarse\n→ Abre en Figma o Illustrator\n\nY si ya tienes un logo en JPG borroso, lo subes y te lo devuelve en vector limpio.\n\nCambias los colores y los degradados se adaptan solos.\n\nGuárdalo.","url":"https://x.com/marcusyul/status/2113301988939030993","createdAt":"2026-10-22T16:10:32Z","metrics":{"views":43617,"likes":189},"lang":"es"},{"id":"2113344642624438741","author":"unusual_whales","handle":"unusual_whales","text":"We're doing a live breakdown.\n\nCheck out flow live right on Unusual Whales.\n\nSee more:","url":"https://x.com/unusual_whales/status/2113344642624438741","createdAt":"2026-10-22T19:00:01Z","metrics":{"views":101552,"likes":26},"lang":"en"},{"id":"2113208152917258677","author":"govin.eth | G哥","handle":"goan999999","text":"哈草，太逆天了！Codex 效率直接提高 20 倍，这个开源神器必须装！\n\nCodex + Context7 = 给 AI 开挂\n\n1、不用再翻文档了：写 React、Next.js、Supabase，直接让 Codex 获取对应的最新文档和代码示例，省掉大量查资料的时间\n\n2、减少 AI 一本正经地瞎写：API 名称、参数、配置方式不对，代码写得再快也白搭。Context7 把相关文档塞进上下文，让 Codex 有据可查。\n\n3、少返工才是真提效：遇到陌生框架、SDK 集成、版本升级，先查文档再写代码，减少过时用法和错误示例带来的折腾。\n\n4、安装直接交给 Codex：复制下面这段提示词，让它自动阅读项目文档、完成配置并验证是否可用\n\n安装直接用这段提示词：\n“\n请先阅读 upstash/context7 的官方文档，了解 Context7 的安装方式、配置要求和使用方法。然后为当前 Codex 环境安装并配置 Context7，优先采用官方推荐的方案；检查运行环境和依赖，完成必要的 MCP 或 CLI + Skills 配置。配置完成后，验证工具是否能够正常调用、能否检索指定技术栈的最新文档，并测试一次真实的代码查询任务。最后告诉我具体修改了哪些配置、如何使用，以及后续如何让 Codex 在编写代码、调用 API、安装 SDK、排查报错时，优先检索对应版本的官方文档。遇到需要授权、API Key 或人工操作的步骤时，明确告诉我，不要假装安装成功\n”\n\n以后写代码，别光让 AI 埋头干活，先让它找到正确的说明书！","url":"https://x.com/goan999999/status/2113208152917258677","createdAt":"2026-10-22T09:57:39Z","metrics":{"views":14450,"likes":109},"lang":"zh"},{"id":"2113237180646556038","author":"Csaba Kissi","handle":"csaba_kissi","text":"Polishing the menu bar app. What do you think? https://t.co/cATpvXglx6","url":"https://x.com/csaba_kissi/status/2113237180646556038","createdAt":"2026-10-22T11:53:00Z","metrics":{"views":3431,"likes":17},"lang":"en"},{"id":"2113393495717421093","author":"Pratham","handle":"Prathkum","text":"This might be the most underrated thing AI has done so far.\n\nAnthropic just had Claude formally verify 123 open-source libraries at the assembly level.\n\n→ 239 entry points proven crash-free for any input up to 64 MB\n→ Bugs found that survived trillions of runs\n→ On a PDF reader, it found a year’s worth of security bugs in one week\n\nClaude did this in a few weeks.\n\nModels are getting smarter, and hence more cyber attacks are happening across most software we thought was hard to break.\n\nWe need more advancement in software verification.","url":"https://x.com/Prathkum/status/2113393495717421093","createdAt":"2026-10-22T22:14:08Z","metrics":{"views":8488,"likes":44},"lang":"en"},{"id":"2113344806604902730","author":"a16z","handle":"a16z","text":"Chris Dixon on the \"second-order effects\" behind a16z's early bets on Oculus, drones, and crypto:\n\n\"I joined the firm in 2013. I talked to Marc and Ben, and I said, 'Hey, I wanna do this crazy stuff,' and they were like, 'Great.'\"\n\n\"That led to a couple of themes at the time, and they're all kind of what I would call kinda second-order effects. You had smartphones obviously start in 2007, and by 2013 had gotten mainstream, and there were all these kind of first-order effects like building apps on top.\"\n\n\"But a second-order effect was that you had the components of smartphones. You had sensors and chips getting better and better, and maybe people could repurpose those in different ways.\"\n\n\"We invested in Oculus as an example, and that was really kind of a reconfigured smartphone. Skydio, that was one of our investments from back then that was, at the beginning, kind of a reconfigured smartphone.\"\n\n\"Crypto, I think at the time was kind of a downstream effect to me of sort of the open-source software movement morphing into services and also kind of a result of social media where you could have these communities form without mainstream acceptance and coalesce around these blockchains.\"\n\n@cdixon","url":"https://x.com/a16z/status/2113344806604902730","createdAt":"2026-10-22T19:00:40Z","metrics":{"views":21296,"likes":44},"lang":"en"},{"id":"2113527341507084782","author":"ガガロット","handle":"gagarot200","text":"今回のPHP脆弱性を甘く見てる人は危機感を持て\n今リアルタイムで全世界に仕掛けられてる攻撃\n↓                                                                                                                                                                                                                                                                           \n詳しく解説するとWebサイトの問題だけだと\n思ってる一般の人ほど危険\n\n今回発見された「php2shell」は、\n\n世界のWebサイトの約7割で利用されている\nPHPそのものに存在する、極めて危険な脆弱性\n\nしかも、深刻度は10点満点中9.2。\n\n何が恐ろしいかというと、攻撃が成功すれば、\nログイン情報を知らない外部の人間でも\nサーバー上で不正なプログラムを\n実行できる可能性がある。\n\nつまり、\n\n・顧客情報や個人情報の流出\n・Webサイトの乗っ取りや改ざん\n・サーバーの不正操作\n・サービスの強制停止\n\nこうした被害につながりかねない。\n\nそして、今回特に問題なのが攻撃のスピード。\n\nCloudflareは、正式な脆弱性公開前から\n攻撃アクセスを確認していたと発表。\n\n攻撃者は防御システムを突破するため、\n攻撃内容を何度も変化させていたという。\n\nさらに10月22日の報道では、\n公開から数時間で数百万件規模の\n悪用試行が確認されたとも伝えられている。\n\nつまり、脆弱性が公開されてから\n対策するまでの時間が、\nこれまで以上に重要になっている。\n\n特に注意してほしいのが、WordPressや\nECサイトを運営している人。\n\n今回の問題はプラグインやテーマではなく、\nPHP本体に存在する。\n\nだからWordPressを最新版に\nするだけでは解決しない。\n\nCloudflareのWAFを導入していても、\nそれだけで完全に安全になるわけではない。\n\n根本的な対策は、修正版PHPへのアップデート。\n\n現在公開されている修正版は、\n\n・PHP 8.2.35\n・PHP 8.3.36\n・PHP 8.4.27\n・PHP 8.5.12\n\nそして、古いPHPを使い続けている場合は、\nさらに注意が必要。\n\n今の時代、Claude CodeやCodexを\n使えば誰でも簡単にWebサービスを開発できる。\n\nでも、AIでアプリを作れたからといって、\nセキュリティまで保証されるわけではない。\n\nWebサイトやAIアプリを公開している人は、\n今すぐ自分のサーバーがどのPHPバージョンで\n動作しているのか確認してほしい。\n\nこれは決して他人事ではない。","url":"https://x.com/gagarot200/status/2113527341507084782","createdAt":"2026-10-23T07:06:00Z","metrics":{"views":17358,"likes":22},"lang":"ja"},{"id":"2113443102568423903","author":"日本経済新聞 電子版（日経電子版）","handle":"nikkei","text":"メタのAIエージェント「Muse」、日本で開始　メルカリなどと連携","url":"https://x.com/nikkei/status/2113443102568423903","createdAt":"2026-10-23T01:31:16Z","metrics":{"views":62517,"likes":184},"lang":"ja"},{"id":"2113534873948332228","author":"Francesco Ciulla","handle":"FrancescoCiull4","text":"Talk at @cityjsconf done! \n\nNow @TejasKumar_ is delivering part 2 of the keynote!","url":"https://x.com/FrancescoCiull4/status/2113534873948332228","createdAt":"2026-10-23T07:35:56Z","metrics":{"views":798,"likes":8},"lang":"en"},{"id":"2113504492477878421","author":"U.S. Politics Alert","handle":"USPoliticsAlert","text":"🆕 @teamtrump has started following @Senate_Fund\n\nPreviously followed by: @jacobkschneider, @nhgop","url":"https://x.com/USPoliticsAlert/status/2113504492477878421","createdAt":"2026-10-23T05:35:12Z","metrics":{"views":672,"likes":2},"lang":"en"},{"id":  try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
