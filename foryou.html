<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

om ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-22T19:08:59+09:00","posts":[{"id":"2112918829475254620","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝マジか、WordPress使っている人などはPHP対応でヤバいのに、次はNode.jsが10月21日にセキュリティリリースを発表してる、まずはこの記事をAIに読み込ませて早急な対策を実施が必須","url":"https://x.com/tetumemo/status/2112918829475254620","createdAt":"2026-10-21T14:47:59Z","metrics":{"views":26259,"likes":190},"lang":"ja"},{"id":"2113068859968393589","author":"あきらパパ【生成AI活用エンジニア\u0026３児のパパ】","handle":"akira_papa_IT","text":"【AI用プロンプト付き｜主要7言語の緊急セキュリティ更新まとめ】\nAIへのセキュリティ指示プロンプト付けてますので参考にしてください。\n\n■PHP\n・リスク：認証なしで、外部からプログラムを実行されるおそれ。\n・対策：8.5.12／8.4.27／8.3.36／8.2.35、または提供元の修正済みパッケージへ更新。\n■Node.js\n・リスク：圧縮データを展開する処理の不具合から、外部からプログラムを実行されるおそれ。\n・対策：22.23.4／24.22.1／26.12.1へ更新し、本番の実行環境も確認。\n■Java\n・リスク：通信の安全性に関わるJSSEに重大な問題。10/20の定例更新版も対象。\n・対策：10/21の緊急告知「CVE-2026-91403」について、使用中のJDK提供元の追加対応を確認。\n■Python\n・リスク：問題のある証明書を信頼し、通信のなりすまし・盗聴・改ざんにつながるおそれ。\n・対策：各仮想環境のpipを26.2.2、certifiを2026.10.19、uvを0.13.4以降へ更新。\n■Go\n・リスク：問題のある証明書を信頼し、接続先になりすまされるおそれ。\n・対策：1.27.3／1.26.10へ更新し、配布するアプリも再ビルド・再配置。\n■Rust\n・リスク：一部の証明書検証ライブラリが、信頼すべきでない証明書を受け入れるおそれ。\n・対策：rustupを1.29.2へ更新し、アプリのrustls-webpkiも修正版へ更新・再ビルド。\n■C#／.NET\n・リスク：使用する機能や構成によって、外部からのコード実行・情報漏えいなどのおそれ。\n・対策：使用系列の最新セキュリティ更新を適用。10系は10.0.13への更新を確認。\n\n※2026/10/22時点。手元のPCだけでなく、本番サーバー・コンテナも確認してください。\n　\n------------------\n【■サーバー内の確認をClaude Code／Codexに任せる用プロンプト】\n\n# 役割\nあなたはSRE兼セキュリティエンジニアです。本番運用中のこのサーバーに対し、脆弱性対応の「棚卸し→影響判定→更新計画」を行います。目的は、稼働を止めずに、見落としゼロで修正版へ移行することです。\n\n# 前提（2026/10/22時点の修正版。必ず公式一次情報で再確認すること）\n・PHP：8.5.12／8.4.27／8.3.36／8.2.35（または提供元の修正済みパッケージ）\n・Node.js：22.23.4／24.22.1／26.12.1\n・Java：使用中JDK提供元の、CVE-2026-91403（JSSE）への追加対応。10/20定例更新版も対象\n・Python：pip 26.2.2／certifi 2026.10.19／uv 0.13.4 以降（仮想環境ごと）\n・Go：1.27.3／1.26.10（Goでビルド済みの配布バイナリも対象）\n・Rust：rustup 1.29.2、各プロジェクトの rustls-webpki 修正版\n・.NET：使用系列の最新セキュリティ更新（10系は 10.0.13）\n上記と公式情報が食い違う場合は、公式を優先し、差分を報告すること。記憶や推測でバージョンを断定しないこと。\n\n# 絶対ルール\n1. フェーズ1は読み取り専用。インストール・更新・再起動・削除・設定変更は一切しない。\n2. 環境変数・.env・鍵・トークンなどの秘密情報を出力・ログ表示しない。\n3. 「入っているバージョン」ではなく「実際に動いているバージョン」を根拠にする。判定には必ず実行コマンドと出力を証拠として添える。\n4. 確認できなかったものは「不明」と書き、推測で埋めない。\n5. フェーズ2以降の変更は、私の明示的な承認を得てから、1件ずつ実行する。\n\n# フェーズ1：棚卸し（読み取りのみ）\n以下を横断して調査すること。\n・ホストのランタイム（パッケージマネージャ／手動インストール／バージョンマネージャ：nvm, asdf, pyenv, sdkman, rustup など）\n・稼働中プロセスが実際に使っているバイナリのパスとバージョン\n・Docker／コンテナ：稼働中コンテナと、そのベースイメージ・イメージ内ランタイム\n・すべての仮想環境（venv, poetry, uv, conda）\n・ロックファイル・依存定義（package-lock.json, pnpm-lock.yaml, poetry.lock, uv.lock, requirements*.txt, go.mod, Cargo.lock, *.csproj, pom.xml, build.gradle）\n・ビルド済み成果物（Goの静的バイナリ、Rustバイナリ、JARなど）に埋め込まれたバージョン\n・CI/CD・Dockerfile で固定されているバージョン（次回デプロイで古い版に戻らないか）\n\n# フェーズ2：影響判定と優先順位\n次の順で優先度を付けること。\n・P1：外部公開されている、かつ認証なしでコード実行の恐れ（PHP, Node.js など）\n・P2：通信のなりすまし・盗聴・改ざんの恐れ（Java, Python, Go, Rust の証明書関連）\n・P3：構成次第で影響（.NET など）、または内部のみで稼働\n\n# 出力フォーマット\n1. 要約（3行以内：要対応件数、最優先の1件、全体リスク）\n2. 一覧表：対象／場所（ホスト・コンテナ名・パス）／現バージョン／修正版／判定（要対応・対応済・不明）／優先度／必要な作業（更新・再ビルド・再起動・再デプロイ）／根拠コマンド\n3. 対応計画（優先度順）：各項目に「実行コマンド」「事前バックアップ」「停止影響と所要時間」「動作確認方法」「ロールバック手順」\n4. 不明・要人間判断の項目と、その理由\n\n# フェーズ3：実行（承認後のみ）\n・承認された1件ごとに：バックアップ → 更新 → 動作確認（ヘルスチェック・ログ・主要機能）→ 結果報告\n・異常が出たら即停止してロールバックし、報告する。次の項目へは進まない。\n・最後に、全体の再スキャン結果で「要対応ゼロ」を確認して完了とする。\n\nまずフェーズ1を開始し、出力フォーマットの1〜4で報告してください。\n---","url":"https://x.com/akira_papa_IT/status/2113068859968393589","createdAt":"2026-10-22T00:44:09Z","metrics":{"views":3649,"likes":30},"lang":"ja"},{"id":"2112890599372468493","author":"StudioYebisu","handle":"studio_yebisu","text":"PHPとは別件で個人がやばい話ね。\nちなみに思っている以上にヤバいので、みんな対処必要っす。\n\nやることはめっちゃ簡単。OSとブラウザを最新バージョンにアップデートするだけ。\n気になる人は元ポストのサイトでチェック出来る。\n\nでも、これを怠るだけで。\n\n最悪の場合銀行のログイン情報抜かれたり、\n株式口座入られて小規模株を勝手に全力で買われてお金抜かれたり。最悪の事態が起きるからね。\n\nDNSの改ざんとか経路の乗っ取りは対個人へのサイバー攻撃では最強だといってもいい。\n＞「偽サイトが、暗号学的に正しい証明書を使用して、正規の手順で、本当のサイトになりすませる」\n\nおくに先生が書いてるこれでわかるよね。\n\nあと元ポストの\n@Iamwonderingif さんはガチのセキュリティの専門家なんでフォロー必須。彼も天才。","url":"https://x.com/studio_yebisu/status/2112890599372468493","createdAt":"2026-10-21T12:55:49Z","metrics":{"views":1049188,"likes":3767},"lang":"ja"},{"id":"2112886438954246223","author":"Yoshikawa Hitaka | 吉川飛空","handle":"hitakayoshikawa","text":"ちなPHPだけじゃなくてnode.jsも地味にやばいです。\n\nNode使ってる人、今日中に node -v しよ\n\n22.23.4\n24.22.1\n26.12.1\n\nこれ以外は今穴が開いてます。\n\n圧縮データを読む処理に不具合があって外からプログラムを実行される。","url":"https://x.com/hitakayoshikawa/status/2112886438954246223","createdAt":"2026-10-21T12:39:17Z","metrics":{"views":93911,"likes":730},"lang":"ja"},{"id":"2112876589075841167","author":"オープンソース研究所","handle":"opensourcelab9","text":"AIに直してもらったのに、本当に直ったのか毎回自分で確かめ直している人へ👀\npstack-claude は、失敗の再現から確認まで済ませてから修正を返す進め方を Claude Code に入れます。\n① 入れたスキルの poteto-mode に、直したいことを伝える\n② バグなら、まず失敗を再現し、how と why で原因を掘る\n③ 修正を任せたら、失敗していた場面をもう一度走らせて確かめる\n\n返ってくるのは修正そのものと、失敗していた時・通った時の両方の証拠です。計画づくりや機能追加、リファクタ、性能の調査にも別の進め方が用意されています。Claude Code ならプラグイン2行で入り、Codex・Pi・Copilot 版もあります。\n失敗と成功の証拠を見てから取り込めるので、マージ前の確認がぐっと身軽になるかもしれません。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2112876589075841167","createdAt":"2026-10-21T12:00:08Z","metrics":{"views":2141,"likes":31},"lang":"ja"},{"id":"2113194685502242944","author":"KEITO💻AIディレクター","handle":"keitowebai","text":"PHPに続き、node.jsも危ないらしいのでアップデート必須です。\n特にClaude Codeを日頃使っている人はガッツリ関係します。PHPは会社単位でしたが、こっちは個人単位です。皆さんが作業してアプデしないといけないです。","url":"https://x.com/keitowebai/status/2113194685502242944","createdAt":"2026-10-22T09:04:08Z","metrics":{"views":2399,"likes":25},"lang":"ja"},{"id":"2113043944200130689","author":"木内翔大＠SHIFT AI代表「日本をAI先進国に」𝕏","handle":"shota7180","text":"【朗報】Claude Securityがアップデート！\n\nコードの変更を検知し、脆弱性を自動で再スキャン可能に。\n\nリポジトリを一度接続するだけで、その後のコード変更にも継続的に対応してくれます。\n\nClaude Enterprise向けにパブリックベータ版として、提供開始。","url":"https://x.com/shota7180/status/2113043944200130689","createdAt":"2026-10-21T23:05:09Z","metrics":{"views":6523,"likes":21},"lang":"ja"},{"id":"2113184762626253203","author":"Avi Chawla","handle":"_avichawla","text":"The next step after Karpathy's Agentic Engineering:\n\n(built by Google)\n\nAgent tasks can often outlive the process running them.\n\nFor instance, an agent may gather the right evidence and prepare the final answer, then stop because a person must approve the next action.\n\nIf that approval arrives a few hours later, the original process may no longer exist.\n\nReplaying the prompt is the wrong recovery mechanism here since it runs retrieval again, may produce a different answer, and can repeat the external action.\n\nIdeally, the system has to reopen the exact run with the same evidence and draft. It must also remember whether the final action already happened.\n\nGoogle's Agents CLI lets a coding agent build this directly. It installs seven focused skills that cover ADK development, testing, and deployment to Agent Runtime.\n\nAgents CLI Repo → https://t.co/MrlFU86tZs\n\n(don't forget to star it ⭐ )\n\nI tested the exact setup with a RAG agent in Claude Code.\n\nThe agent retrieves four policy passages, writes a cited customer reply, asks for approval, and exits. No worker keeps running while it waits.\n\nA new process later opens the saved session and continues from the approval step. The retrieval count remains one, and the answer is published once.\n\nSubmitting the approval again returns `already_published` instead of calling the publication tool twice.\n\nADK preserves the paused run. Agent Runtime stores the session after deployment, and Agent Identity gives the deployed agent its own cloud identity.\n\nThe recording shows the whole process in action, and I worked with Google to put this together.\n\nThe app retrieves the evidence, drafts the reply, and exits with a pending approval and saved session ID. Later, the same sessions are picked up again without reinvoking the tools.\n\nIf you want to dive deeper, I've covered the complete implementation in a hands-on article, including the Claude Code prompts, duplicate-approval protection, and Agent Runtime deployment.\n\nRead it below.","url":"https://x.com/_avichawla/status/2113184762626253203","createdAt":"2026-10-22T08:24:43Z","metrics":{"views":1925,"likes":22},"lang":"en"},{"id":"2113028052032573774","author":"lumxss","handle":"bkdgiffug","text":"老哥们，这回又蹦出个开源神器，邪门到让人直呼离谱😅\n\n有人把PDF转Markdown干到每秒100页，还一分钱不收，纯靠CPU硬扛，GPU用不上、云端不碰、API key都免了。\n\n这玩意儿叫OpenDataLoader，各家跑分榜一路横扫，直接坐上头把交椅。\n\n随手拎几个对比你就懂了：\n1️⃣ docling分数还凑合，速度却慢它15倍\n2️⃣ marker不光要GPU，还慢出1000倍\n3️⃣ Pymupdf4llm够快，可表格分只有0.40","url":"https://x.com/bkdgiffug/status/2113028052032573774","createdAt":"2026-10-21T22:02:00Z","metrics":{"views":9713,"likes":160},"lang":"zh"},{"id":"2113082020079472784","author":"Sadao Tokuyama","handle":"tokufxug","text":"放送映像1台からバスケをメートル単位で解析！🏀\n\n🔹コート上の選手・姿勢・ボールを検出\n🔹ByteTrackや背番号分類で選手を追跡・識別\n🔹処理時間を397msから約65ms/フレームに短縮\n\n開発者：Luís Condados氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2113082020079472784","createdAt":"2026-10-22T01:36:27Z","metrics":{"views":2662,"likes":73},"lang":"ja"},{"id":"2113164450757042378","author":"Codex研究ラボ","handle":"codexneo4","text":"Codexを「1人のAIエンジニア」ではなく　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n「複数人のAI開発チーム」に進化させるOSSが登場\n↓\n単なる便利ツールじゃなくて\nCodexの開発体験そのものを変える仕組み\n\nその名も「oh-my-codex（OMX）」\n今まではCodexに対して、\n\n・要件定義をお願いする\n・フロントエンドを実装させる\n・バックエンドを構築させる\n・テストを実行させる\n・バグを見つけて修正させる\n\nこうした工程を自分で管理する必要があった\n\nところがOMXを導入すると、\n複数のAIエージェントに役割を割り振って、\n並列で開発を進められる。\n\n例えば6つのエージェントを使って、\n① 要件整理・設計\n② フロントエンド開発\n③ バックエンド開発\n④ API・DB設計\n⑤ テスト・品質保証\n⑥ コードレビュー・改善\nという開発体制まで構築できる。\n\nしかも凄いのはここから。\n\nOMXには開発を効率化する機能が揃っている\n\n・複数エージェントによる並列作業\n・要件整理から実装までのワークフロー\n・専門エージェントへのタスク分担\n・長期タスクのチェックポイント管理\n・コードレビューとQAの支援\n・.omx/ による計画・ログ・進捗の保存\n\nつまり、自分がすべての開発工程を\n細かく指示するのではなく、AIチームを\n管理する側に回れる。\n導入したい人は、Codex CLIに以下をコピペするだけ\n👇\n「GitHubの Yeachan-Heo/oh-my-codex の公式READMEを確認してください。現在のCodex CLI、Node.js、認証状態、依存関係を調査し、推奨手順でOMXを導入してください。セットアップ後は omx doctor と実行テストで正常動作を確認してください。最後に $team を使った6エージェントによる並列開発の構成例と実行方法を説明してください。既存設定の変更が必要な場合は事前に確認してください。」\n\nこれなら新しいAIエディタに乗り換える必要もない。\n\n普段使っているCodex CLIを、\nそのままマルチエージェント\n開発環境に拡張できる。\n\nこれからのAI開発は、自分でコードを\n書く能力だけじゃなく、複数のAIを\nどう分業させるかが重要になりそう。","url":"https://x.com/codexneo4/status/2113164450757042378","createdAt":"2026-10-22T07:04:00Z","metrics":{"views":3265,"likes":43},"lang":"ja"},{"id":"2113190915917627875","author":"Raj Kapadia","handle":"RaajKapadia","text":"Anthropic just launched Claude Duet.\nAn AI agent that doesn't always wait for instructions.\nIt can:\n→ Monitor connected apps\n→ Detect important events\n→ Execute background tasks\n→ Prepare actions\n→ Request approval when needed\nThe architecture is interesting:\nEvents → Context → Planning → Authorization → Action → Verification\nThe next challenge in AI engineering isn't just building agents that can act.\nIt's building agents that know when to act, when to wait, and when to ask permission.","url":"https://x.com/RaajKapadia/status/2113190915917627875","createdAt":"2026-10-22T08:49:10Z","metrics":{"views":25,"likes":1},"lang":"en"},{"id":"2113026258816884763","author":"M.","handle":"wlzh","text":"有人把\"抄一个 App\"这件事，做成了一套正经流水线。\n\nGitHub 上这个 replica-skill，3,985 星，是给 Claude 用的 11 个技能，免费、MIT，不用注册也不用 API key。\n\n流程是连着走的：先侦察，把目标 App 的界面、流程、组件、数据模型从公开页面、截图和应用商店介绍里扒出来；再定架构、扒设计规范，然后逐屏重建，接上登录、数据库和支付。\n\n后面几步才是精髓：一个技能专门点遍所有流程测 bug；一个把克隆版和原版逐项对比打分，差在哪列得清清楚楚；还有一个叫 Entrepreneur 的，去翻原版在 App Store、G2、Reddit 上的真实差评，把用户最恨的几点变成你这版的修复清单和卖点。\n\n作者在细则里把丑话说得很明白：只重建功能和交互，净室做法，不碰人家的源码、logo、文案和私有接口；上线前必须换名、换配色、换品牌，有个扫描工具专门查代码里还残留没残留原版的东西，不干净就不让发布。\n\n他也承认克隆不是万能的：订票工具这种几周能搞定，表格引擎那种就别想了，侦察那步会先老实告诉你这活有多大。\n\n想抄作业抄得理直气壮的，这套流程值得看看。","url":"https://x.com/wlzh/status/2113026258816884763","createdAt":"2026-10-21T21:54:52Z","metrics":{"views":17736,"likes":407},"lang":"zh"},{"id":"2113045887119184222","author":"ludoonchart","handle":"ludoonchart","text":"these 2 FREE GitHub repos should honestly be illegal in trading...\n\nREA + Kronos + Claude Code can turn a regular computer into a Bloomberg-style market research terminal\n\nhedge funds spend thousands on market data and research tools, while these 2 open-source projects give you the building blocks to create your own system\n\nhere's how it works:\n\nREA lets AI agents understand how software works and reconstruct its functionality\nKronos treats financial candles like tokens and predicts possible future price movements\ncombine them and you get a financial terminal where charts can display AI-generated forecasts\nhere's how to build it yourself for FREE:\nstep 1 → connect REA to Claude Code using https://t.co/MscIBUc4Gz and map out a professional market terminal: quotes, charts, screeners, news and market dashboards\n\nstep 2 → ask Claude to build the complete interface with equities, FX, commodities, crypto, global indices and financial news\n\nstep 3 → connect public market data APIs to populate the terminal with prices, charts and market information\n\nstep 4 → clone https://t.co/lbde4uDMbH and load Kronos-small, the 24.7M parameter financial forecasting model\n\nstep 5 → feed Kronos the last 512 candles and generate predictions for the next 24, similar to how an LLM predicts the next tokens\n\nstep 6 → sample 100 possible future price paths and display them directly on the terminal charts\n\nstep 7 → analyze the forecast distribution, identify market regimes and backtest the strategies with realistic fees before using real capital\n\nthe result: a Bloomberg-style research terminal combining market data, charts, financial news and AI-powered probabilistic forecasting in one workspace\n\ni won't say anything more...\n\nbookmark this and thank me later ↓","url":"https://x.com/ludoonchart/status/2113045887119184222","createdAt":"2026-10-21T23:12:52Z","metrics":{"views":6548,"likes":113},"lang":"en"},{"id":"2112938238268600801","author":"José Siles | AI | Data","handle":"josesilesdata","text":"👋🏻SE ACABÓ EXPLICARLE TODO A TU IA UNA Y OTRA VEZ CADA DÍA!\n\nCierras Claude Code a mitad de una tarea. \n\nAl día siguiente lo abres y no se acuerda de nada:\n\n- Ni de la arquitectura\n- Ni de lo que ya probasteis\n- Ni de lo que quedaba pendiente\n\nA empezar de 0.\n\nHasta HOY!\n\nai-memory le pone memoria a largo plazo. \n\nY lo mejor: compartida entre agentes distintos.\n\n→ Cierras Claude Code a media tarea, abres Codex en la misma carpeta, y CONTINÚA donde lo dejaste\n→ Funciona con más de 20 agentes: Claude Code, Codex, Cursor, Gemini, OpenCode, Kimi...\n→ La memoria te sigue de una máquina a otra: lo que dejaste en el PC lo retomas en el portátil\n→ Y vale para equipos: lo que aprende la sesión de uno, lo recuerdan los agentes de todos\n→ Tu memoria son archivos Markdown normales: los abres, los editas o los buscas con grep\n→ Y por defecto funciona SIN gastar un solo token de IA\n\nCaptura sola lo que haces y lo convierte en páginas legibles. \n\nSin decir “acuérdate de esto”.\n\n5.500 ⭐. MIT.\n\nLink en los comentarios 👇🏻","url":"https://x.com/josesilesdata/status/2112938238268600801","createdAt":"2026-10-21T16:05:07Z","metrics":{"views":7168,"likes":199},"lang":"es"},{"id":"2112934478674846129","author":"Mo Elgaraihy","handle":"EngMoElgaraihy","text":"🚨 فرصة لا تُعوض لكل المطورين: احصل على اشتراك ChatGPT Pro لمدة 6 أشهر مجاناً (بقيمة 1200 دولار)! 🎁💻\n\n​أعلنت OpenAI رسمياً عن برنامجها الموجه لمجتمع المطورين والمصادر المفتوحة، والعرض يعتبر الهدية الأقوى لهذا العام: \n\n​📌 تفاصيل العرض الجبار:\n​بدون شروط معقدة: لا يشترط أرقام فلكية لنجوم GitHub.. طالما أنك تمتلك مشروعاً أو ترأس صيانة مشروع مفتوح المصدر (حتى لو كنت تديره وحدك)، يمكنك التقديم.  \n\n​الهدية: 6 أشهر كاملة من ChatGPT Pro (الذي يتضمن نموذج Codex القوي للبرمجة وأحدث قدرات الذكاء الاصطناعي) مجاناً تماماً، وهو ما يوفّر عليك 1,200 دولار كاملة!  \n\n​أرصدة API إضافية: لمساعدتك في أتمتة مراجعات الكود وإدارة مستودعاتك البرمجية.  \n\n​إذا كنت تمتلك أي مشروع برمجياً على جيت هب، لا تفوت الفرصة وقدم طلبك فورا: الرابط في التعليقات 👇\n\n​جهز رابط مشروعك وقدم الآن.. فرصة ذهبية للمطورين لا تتكرر كثيراً! 🚀✨  \n\n​احفظ التغريدة وشاركها مع أصدقائك المطورين! 🧵👇","url":"https://x.com/EngMoElgaraihy/status/2112934478674846129","createdAt":"2026-10-21T15:50:10Z","metrics":{"views":40795,"likes":260},"lang":"ar"},{"id":"2112981337413910894","author":"unicode","handle":"unicodef1wn","text":"holy f*ck, elon musk's team at spacexai just put 146 grok bots online, and you can download all of them for free\n\nthey run your inbox, chase invoices, call customers, and one runs your vacuum from chat. each installs in one click.\n\n56 official jobs on the use cases page\n90 bots in the marketplace\n\nbots like these usually sell for $50-200 each. here they cost $0.\n\nhow to install:\n\n1. open the use cases page or the marketplace\n2. pick a bot by the job you want done\n3. hit add, it lands in your grok bot\n4. send it the first task in chat\n\nuse cases: https://t.co/Ftc2cUErHA\nmarketplace: https://t.co/wYGNvP3UnD\n\nsave this ↓","url":"https://x.com/unicodef1wn/status/2112981337413910894","createdAt":"2026-10-21T18:56:22Z","metrics":{"views":189935,"likes":2209},"lang":"en"},{"id":"2112963898739765633","author":"supermemory","handle":"supermemory","text":"Introducing the supermemory memory graph\n\nevery document becomes atomic facts, and dreaming keeps building the graph in the background\n\n- extracting facts\n- linking related memories\n- resolving updates, the old version stays as history\n\nget one for yourself in the console ↓","url":"https://x.com/supermemory/status/2112963898739765633","createdAt":"2026-10-21T17:47:05Z","metrics":{"views":93395,"likes":684},"lang":"en"},{"id":"2113140946699460933","author":"Levi 卧云","handle":"zmdsb259414","text":"玩 AI 视频 AI 3D Three.js 的兄弟姐妹们！我把自己 star 过的仓库翻了一遍，都在这了，一共 8 个，建议收藏！\n\n1. img2threejs（约 18600 star）\n把参考图里的物体用纯代码重建成 three.js 3D 对象，带质量门控，还能直接做动画。\nhttps://t.co/9YVpUJ3QVz\n\n2. Motion2MixamoRig（约 1400 star）\n把视频里的人体动作重定向到 Mixamo 绑定的 3D 角色上，动作捕捉的平替方案。\nhttps://t.co/MplcdYcW0z\n\n3. dsh-blender-plugin（约 1000 star）\n让 AI 实时驱动 Blender 建模的插件，内置 15 个模型工具和建模 skill。\nhttps://t.co/93NEVC6c8V\n\n4. dioramas（约 420 star）\n用 AI 生成的资产搭电影感交互 3D 网站的开源框架，基于 three.js 和 WebGL。\nhttps://t.co/CUZXSLsptb\n\n5. video-shotcraft（约 12800 star）\n给 Claude Code 和 Codex 用的视频 skill，靠 Remotion 代码出电影感产品视频，自带 152 张镜头配方卡。\nhttps://t.co/PddrNBRWwN\n\n6. lemo-opuscar（约 5000 star）\n不用视频模型的短片 skill，挑一种风格就能纯代码出片，51 种电影风格随便选。\nhttps://t.co/Wo8wlaJZww\n\n7. jianying-headless（约 3600 star）\n剪映草稿的无头编辑和导出工具，Agent Skill 形态，不开软件就能批量处理草稿。\nhttps://t.co/g6tNJMCltt\n\n8. mg-styles-15（约 1700 star）\n15 种 MG 动效风格，成片、提示词、源码全都给，照着拆就能学。","url":"https://x.com/zmdsb259414/status/2113140946699460933","createdAt":"2026-10-22T05:30:36Z","metrics":{"views":6988,"likes":187},"lang":"zh"},{"id":"2112865844556411059","author":"CD Security","handle":"CDSecurity_io","text":"🤯🚨 Someone really built an open-source, autonomous AI Red Team.\n\nIt's called PentAGI - multiple AI agents that coordinate to find vulnerabilities,  20+ professional hacking tools, and execute penetration testing workflows with minimal human intervention.\n\nAnd here's the scary part:\n\nYou no longer need to be an experienced hacker to start using tools that previously required significant technical knowledge.\n\nEven beginners can now initiate offensive security workflows simply by describing what they want in plain English.\n\nIt's far from replacing an experienced pentester, but imagine where this technology will be in another 2–3 years.\n\nGreat news for ethical hackers. Terrifying in the wrong hands.","url":"https://x.com/CDSecurity_io/status/2112865844556411059"," о не подходит. Не «чуть лучше», а принципиально другой уровень. Пока все спорят о бенчмарках чат-ботов, внутри уже решается класс задач, которые снаружи пока просто не видны.\n\nИ сразу после этого он переходит к рекурсивному самоулучшению.\n\nАльтман прямо говорит: если кто-то реально надавит на RSI, то технологическое преимущество само по себе станет главным моментом. Не данные, не пользователи, не интеграции — а то, что система начнёт улучшать себя быстрее, чем все остальные успевают её понять. И тут же добавляет, что это «очень опасная вещь» и миру понадобятся ограничители скорости: насколько быстро вообще позволять такому процессу разгоняться.\n\nПри этом он не отказывается от классических рвов. Глубокая интеграция в жизнь пользователей и компаний, данные, сетевые эффекты — всё это, по его словам, продолжит работать. Плюс масштаб инфраструктуры: у кого будет больше и дешевле вычислений, тот получит структурное преимущество.\n\nПолучается странная картина. С одной стороны — признание, что внутренний разрыв уже существует и он серьёзный. С другой — осторожность по поводу того, что произойдёт, если этот разрыв начнёт расти сам собой.\n\nМы по-прежнему сравниваем публичные модели. А внутри, судя по всему, уже обсуждают, нужно ли ставить ограничители на то, как быстро система сможет улучшать саму себя.\n\nЧто именно они там считают по математике — вопрос открытый. Но сам факт, что это стало удобным примером «насколько мы впереди», говорит больше, чем любой бенчмарк.","url":"https://x.com/NorenNamert/status/2113061555554394514","createdAt":"2026-10-22T00:15:08Z","metrics":{"views":20366,"likes":51},"lang":"ru"},{"id":"2113123815488397717","author":"Alizeh","handle":"alizeh_ai","text":"what the f*ck, DeepSeek V4.1 Flash just went fully uncensored 18+😋\n\n-refusals removed, no system prompt tricks\n-sees images and videos too\n-1M context + tool calling\n-open weights, MIT. FREEE\n\ntry it here: https://t.co/yYQmCd5WkR https://t.co/AMQFPjIOG7","url":"https://x.com/alizeh_ai/status/2113123815488397717","createdAt":"2026-10-22T04:22:32Z","metrics":{"views":26506,"likes":543},"lang":"en"},{"id":"2112945805686604033","author":"OpenAI","handle":"OpenAI","text":"If you are wondering whether your website is affected, we have packaged a Codex skill to help check.\n\nPoint your Codex at this repo to guide you through it: https://t.co/XUEbOwXuQC","url":"https://x.com/OpenAI/status/2112945805686604033","createdAt":"2026-10-21T16:35:11Z","metrics":{"views":1177395,"likes":8639},"lang":"en"},{"id":"2113169365483032658","author":"StudioYebisu","handle":"studio_yebisu","text":"インドの認証局「eMudhra」のやらかしで、今ネットが軽く魔境になってますけども。\n現状を調べたので、守りに入らずに何が安全で何が危ないか書きます。\n\n■安全\n・Chrome・Firefox・Edge（最新版）\n・Androidスマホ本体（再起動すれば対策が反映）\n\n▲注意\n・Safari（iPhone・Mac）\n・iPhoneのアプリ内ブラウザ（X・LINEなど）\n気になる場合はリプライにある、告知/チェッカーのURLを内部ブラウザで開いてオールグリーンなら安全\n\n→ Appleのブロックは入っているが、一部の証明書がまだ通ってしまう不具合が報告されている（10/22時点、未解決）\n\n・Androidのアプリ内ブラウザ\n・PCのアプリ（Discord・Slack・VS CodeなどElectron製）\n　→ アプリ本体の更新待ち\nこれも\n\n×危険\n・通信を行うアプリで、最新に更新されていないもの全て(例えば〇〇PAY等）\n・ルーター・カメラ・テレビ・家電などのIoT機器\n・開発ツール（curl・Python・Node.js・Go・Javaなど）\n\n◆やること\n・OS・ブラウザ・アプリを全部最新にして、再起動\n・ルーターのファームウェア更新を確認\n・更新がそろうまで、フリーWi-FiとVPNは避ける\n・リプのURLで「Run check」→「Insecure」が1つも出なければOK\n\nーーー\n▼ややこしい話（気になる人向け）\n\n【なぜWi-FiとVPNなのか】\n攻撃するには通信の途中に割り込む必要があります。怪しいWi-Fi・VPN・乗っ取られたルーターが入口になりますので今FreeWi-Fiはかなりヤバい。\n\n【Safariの不具合】\nAppleの失効リストには載っています。ただ、最後に認証局へ「本当に失効しているか」を問い合わせる仕組みになっていて、その問い合わせ先が落ちているため通ってしまうようです。\n\nもう一段の守り（CT＝証明書の発行記録のチェック）で止まる見込みはありますが、確証はありません。iOSを最新にして、Appleの修正を待ちましょう。\n\n【Androidのアプリ内ブラウザ】\nAndroid標準のアプリ内ブラウザ（WebView）は、証明書チェックが甘いという研究があります。\nWeChat・QQなど独自エンジンを積んだアプリは、今回の偽証明書を実際に通しています。\n\n【IoT機器が一番やばい理由】\n証明書の一覧が機器の中に固定されています。メーカーが更新を出さない限り、2039年まで偽証明書を信じ続けます。\n\n【開発ツール】\n失効情報も発行記録（CT）もチェックしないので、更新するまで偽証明書を素通しします。対応を待ち、対応したらすぐ更新しましょう。","url":"https://x.com/studio_yebisu/status/2113169365483032658","createdAt":"2026-10-22T07:23:32Z","metrics":{"views":403894,"likes":3756},"lang":"ja"},{"id":"2113169369270464699","author":"StudioYebisu","handle":"studio_yebisu","text":"【参考資料】\n・告知/チェッカー（Mozilla Dennis Jackson氏ら）\nhttps://t.co/vVdKixI96m\n\n・Mozilla Bugzilla（原因・経過の一次資料）\nhttps://t.co/QfnlFNEz7u\n\n【※1 主要ブラウザ】\n・Google（Chrome/Android対応）\nhttps://t.co/M6w3uC53G4\n\n【※2 iPhone】\n・Apple CTポリシー\nhttps://t.co/p4VQquEU61\n\n【※3 Android WebView】\n・CCS 2025論文「Deep Dive into In-app Browsers」\nhttps://t.co/BIxzd5ctp0\n\n・チェッカー統計（UA別の接続成功数）\nhttps://t.co/7mvwBKKzy5\n\n【※4 IoT・開発ツール】\n・Scott Helme「Eight Bits of Trust」\nhttps://t.co/rFGf6TNgIC\n・Cloudflare","url":"https://x.com/studio_yebisu/status/2113169369270464699","createdAt":"2026-10-22T07:23:33Z","metrics":{"views":24742,"likes":49},"lang":"ja"},{"id":"2113112982519759032","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【動画解説】総理も動いたPHP脆弱性の大事件を、非エンジニアでも分かりやすく解説しました。\n\n今後もこういった事件は起きると思うので、この動画で今回の事件をまるごとマスターしてください。\n\n■ 何が起きた？\n・PHPは使用言語が分かるサイトの約7割で動く「裏方」\n・深刻度9.2（10点満点）の穴が2件見つかった\n・悪用されると、ログインなしでサーバーを操られるおそれ\n・発見にはOpenAIなどのAIが使われた\n\n■ いまの状況（10/22 午前2時半時点）\n・修正版は8.5.12／8.4.27／8.3.36／8.2.35\n・8.1以前は正式な修正版なし\n・国内でも54組織がサービスの停止などを告知（piyolog集計）\n・攻撃の試みは観測。侵入の公的な確認はまだ\n\n■ やること\n・サイトを持っている人はPHPの版を確認してすぐ更新\n・WordPressのプラグイン更新では直りません\n・見るだけの人は慌てなくて大丈夫。便乗した偽メールのリンクは開かないで\n\n社内にもぜひ共有してください。\n\n※この動画編集は全てClaude Codeで自動化しております。","url":"https://x.com/masahirochaen/status/2113112982519759032","createdAt":"2026-10-22T03:39:29Z","metrics":{"views":12996,"likes":67},"lang":"ja"},{"id":"2112831018080297348","author":"Claude Code Research Lab","handle":"claudecode84","text":"Anthropicが、\n寝ている間も自動で働き続ける\nAIエージェントの構築ガイドを公開。\n\nしかも、\nすぐに応用できるテンプレート付き。\n\nこれまで毎朝1時間かけていた情報確認が、AIに任せられるようになる。\n\n仕組みはシンプル。\n\nSlackとGitHubを接続するだけで、AIが自動的に情報を収集・整理する。\n\n具体的には　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n① 昨日から何が変わったのか\n② 自分の確認待ちになっているレビュー\n③ チームの作業を止めている未決定事項\n④ 優先的に対応すべきタスク\n\nこれらを確認・検証し、\n毎朝Slackに要約を届けてくれる。\n\nさらにすごいのが、\n記憶機能まで組み込まれていること。\n\n過去に報告した内容を覚えているため、\n同じ情報を何度も通知しない。\n\n実行スケジュール、動作ルール、\n予算上限まで設定可能。\n\n設定した予算を\n超えないように制御できる。\n\nしかも、クラウド上で動くため、PCを閉じてもエージェントは稼働し続ける。\n\nつまり、寝ている間にAIが仕事を整理し、朝起きたらSlackに報告が届いている。\n\nAIに質問する時代から、\nAIが自律的に仕事を進める時代へ。\n\nこれは保存必須。👇","url":"https://x.com/claudecode84/status/2112831018080297348","createdAt":"2026-10-21T08:59:03Z","metrics":{"views":17445,"likes":169},"lang":"ja"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-22T19:08:59+09:00","posts":[{"id":"2113169365483032658","author":"StudioYebisu","handle":"studio_yebisu","text":"インドの認証局「eMudhra」のやらかしで、今ネットが軽く魔境になってますけども。\n現状を調べたので、守りに入らずに何が安全で何が危ないか書きます。\n\n■安全\n・Chrome・Firefox・Edge（最新版）\n・Androidスマホ本体（再起動すれば対策が反映）\n\n▲注意\n・Safari（iPhone・Mac）\n・iPhoneのアプリ内ブラウザ（X・LINEなど）\n気になる場合はリプライにある、告知/チェッカーのURLを内部ブラウザで開いてオールグリーンなら安全\n\n→ Appleのブロックは入っているが、一部の証明書がまだ通ってしまう不具合が報告されている（10/22時点、未解決）\n\n・Androidのアプリ内ブラウザ\n・PCのアプリ（Discord・Slack・VS CodeなどElectron製）\n　→ アプリ本体の更新待ち\nこれも\n\n×危険\n・通信を行うアプリで、最新に更新されていないもの全て(例えば〇〇PAY等）\n・ルーター・カメラ・テレビ・家電などのIoT機器\n・開発ツール（curl・Python・Node.js・Go・Javaなど）\n\n◆やること\n・OS・ブラウザ・アプリを全部最新にして、再起動\n・ルーターのファームウェア更新を確認\n・更新がそろうまで、フリーWi-FiとVPNは避ける\n・リプのURLで「Run check」→「Insecure」が1つも出なければOK\n\nーーー\n▼ややこしい話（気になる人向け）\n\n【なぜWi-FiとVPNなのか】\n攻撃するには通信の途中に割り込む必要があります。怪しいWi-Fi・VPN・乗っ取られたルーターが入口になりますので今FreeWi-Fiはかなりヤバい。\n\n【Safariの不具合】\nAppleの失効リストには載っています。ただ、最後に認証局へ「本当に失効しているか」を問い合わせる仕組みになっていて、その問い合わせ先が落ちているため通ってしまうようです。\n\nもう一段の守り（CT＝証明書の発行記録のチェック）で止まる見込みはありますが、確証はありません。iOSを最新にして、Appleの修正を待ちましょう。\n\n【Androidのアプリ内ブラウザ】\nAndroid標準のアプリ内ブラウザ（WebView）は、証明書チェックが甘いという研究があります。\nWeChat・QQなど独自エンジンを積んだアプリは、今回の偽証明書を実際に通しています。\n\n【IoT機器が一番やばい理由】\n証明書の一覧が機器の中に固定されています。メーカーが更新を出さない限り、2039年まで偽証明書を信じ続けます。\n\n【開発ツール】\n失効情報も発行記録（CT）もチェックしないので、更新するまで偽証明書を素通しします。対応を待ち、対応したらすぐ更新しましょう。","url":"https://x.com/studio_yebisu/status/2113169365483032658","createdAt":"2026-10-22T07:23:32Z","metrics":{"views":403894,"likes":3756},"lang":"ja"},{"id":"2113117784083501224","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【緊急】PHPの脆弱性を狙う攻撃が数百万件に急増。\n\nCloudflareのCEOが衝撃的な数字を公開。\n\n・公表前10時間：数千件\n・公表後45分：数万件\n・公表後2時間：数十万件\n・現在：数百万件\n\n脆弱性の公開を境に、攻撃が爆発的に増加しています。\n\nPHPはWordPressをはじめ、多くのWebサイトを支えるプログラミング言語。\n\n重要なのは、修正パッチが出たからといって自社サイトが自動的に安全になるわけではないということ。\n\nPHPを使っている企業は、影響を受けるバージョンや設定を確認し、該当する場合は早急にアップデートを。\n\n攻撃者は待ってくれません。","url":"https://x.com/masahirochaen/status/2113117784083501224","createdAt":"2026-10-22T03:58:34Z","metrics":{"views":43148,"likes":218},"lang":"ja"},{"id":"2112936780991549783","author":"やまちゃん＠売れすぎるVSLシナリオ構築屋","handle":"yama4vsl","text":"ガチでコレ\nうちもハーネス自作してるけど\ncloudflare最強すぎる。\n\nメール、LINE、どの経路か？どのタグか？どのURLをクリックしてるか？\n\nまで全てのデータをAIに直で渡せるから\n改善スピードレベチだし、\n\n他にも\n「セミナー」の文言を「勉強会」に変える些細な変更も\n\nLP、ステップ、メール、予約フォームとか全部変えたりするの地味にだるかったり、一部変更忘れて整合性がズレてたりするのも一括で一瞬で変えてくれるし\n\nLPもセクションごとに何%読まれてるか？とかまで解析できるし\n\nサブスク代浮くしガチで最高です。","url":"https://x.com/yama4vsl/status/2112936780991549783","createdAt":"2026-10-21T15:59:19Z","metrics":{"views":50947,"likes":497},"lang":"ja"},{"id":"2113083839597957620","author":"宮田 |Cloudflare x ClaudeCode","handle":"miyataArcHack","text":"とりあえずセキュリティ不安な人はこれ入れとけ。\n\nPHPやNode.jsで脆弱性の公表が続く今、クラウドフレアの監査スキルでコードも点検した方が良い。","url":"https://x.com/miyataArcHack/status/2113083839597957620","createdAt":"2026-10-22T01:43:41Z","metrics":{"views":8801,"likes":113},"lang":"ja"},{"id":"2113092346615398702","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これAIに入れたら画像のクオリティ爆上がりした。","url":"https://x.com/Codex_jisen/status/2113092346615398702","createdAt":"2026-10-22T02:17:29Z","metrics":{"views":35544,"likes":356},"lang":"ja"},{"id":"2113085361836744764","author":"Zihua","handle":"luinlee","text":"最近用 Opus 和 Astra 写了不少 UI，发现一个避免 AI slop 并且让界面更好看的秘诀：\n\n在 AGENTS.md 里加上 “Avoid unnecessary secondary labels and descriptions. Let the layout do the explaining.”","url":"https://x.com/luinlee/status/2113085361836744764","createdAt":"2026-10-22T01:49:44Z","metrics":{"views":152536,"likes":3064},"lang":"zh"},{"id":"2113140946699460933","author":"Levi 卧云","handle":"zmdsb259414","text":"玩 AI 视频 AI 3D Three.js 的兄弟姐妹们！我把自己 star 过的仓库翻了一遍，都在这了，一共 8 个，建议收藏！\n\n1. img2threejs（约 18600 star）\n把参考图里的物体用纯代码重建成 three.js 3D 对象，带质量门控，还能直接做动画。\nhttps://t.co/9YVpUJ3QVz\n\n2. Motion2MixamoRig（约 1400 star）\n把视频里的人体动作重定向到 Mixamo 绑定的 3D 角色上，动作捕捉的平替方案。\nhttps://t.co/MplcdYcW0z\n\n3. dsh-blender-plugin（约 1000 star）\n让 AI 实时驱动 Blender 建模的插件，内置 15 个模型工具和建模 skill。\nhttps://t.co/93NEVC6c8V\n\n4. dioramas（约 420 star）\n用 AI 生成的资产搭电影感交互 3D 网站的开源框架，基于 three.js 和 WebGL。\nhttps://t.co/CUZXSLsptb\n\n5. video-shotcraft（约 12800 star）\n给 Claude Code 和 Codex 用的视频 skill，靠 Remotion 代码出电影感产品视频，自带 152 张镜头配方卡。\nhttps://t.co/PddrNBRWwN\n\n6. lemo-opuscar（约 5000 star）\n不用视频模型的短片 skill，挑一种风格就能纯代码出片，51 种电影风格随便选。\nhttps://t.co/Wo8wlaJZww\n\n7. jianying-headless（约 3600 star）\n剪映草稿的无头编辑和导出工具，Agent Skill 形态，不开软件就能批量处理草稿。\nhttps://t.co/g6tNJMCltt\n\n8. mg-styles-15（约 1700 star）\n15 种 MG 动效风格，成片、提示词、源码全都给，照着拆就能学。","url":"https://x.com/zmdsb259414/status/2113140946699460933","createdAt":"2026-10-22T05:30:36Z","metrics":{"views":6988,"likes":187},"lang":"zh"},{"id":"2112868500092097009","author":"kiosa","handle":"thegreatest_sv","text":"Anthropic is furious: this secret tool can replicate any existing app x10 faster for free\n\nthere's an open-source tool with 352k stars on GitHub that lets an AI agent take apart any app you have on your machine and explain exactly how a feature works. no source code needed.\n\nit's called REA. Reverse Engineer Anything.\n\none line:\n\nnpx rea-agents setup\n\nthen you just ask Claude Code:\n\n\"Understand how search works in the Notes app, show me the evidence, and build a similar feature for my project.\"\n\nand it does it.\n\n-\u003e native binaries, through Ghidra, Hopper or IDA\n-\u003e JavaScript and Electron apps\n-\u003e .NET apps\n-\u003e websites\n\nit runs locally. it shows its evidence. then it writes the code.\n\nthat feature your team spent 8 months on? someone's agent can read how it works over lunch.\n\nso let's be honest about what this means:\n\nyour moat was never the code. it was that copying you took effort.\n\nthat effort just went to zero.\n\nthe only things left that can't be cloned: your users, your speed, and your taste.\n\nand if your product dies because someone could see how it works, it was already dead.\n\nthe repo is below. founders, you're going to hate this one \nhttps://t.co/sD8D4HKBxn\n\nsave, share, and try later","url":"https://x.com/thegreatest_sv/status/2112868500092097009","createdAt":"2026-10-21T11:28:00Z","metrics":{"views":25932,"likes":337},"lang":"en"},{"id":"2113043524149186658","author":"돈벌고영","handle":"Dontgiveup_26","text":"수백조 원씩 칩 사 모으던 빅테크들이 긴장할 만한 소식이 오늘 새벽에 보도됨.\n\n\"꼭 그렇게 비싼 반도체랑 전기를 무식하게 갈아 넣어야만 AI를 만들 수 있냐?\"며 정반대 길을 파던 스타트업 두 곳이 오늘 동시에 대형 사고를 쳤기 때문임.\n\n1. \"어린아이는 책 몇 권만 읽어도 말 배우는데, 왜 AI는 인터넷 절반을 다 읽어야 해?\" — 창업 1년 된 회사에 1.4조 원이 몰림 (블룸버그 보도)\n\n- 지금까지 AI 업계의 법칙은 단순했음. 더 똑똑한 AI를 만들려면 무조건 엔비디아 칩을 수십만 개 더 사고, 거대한 데이터센터를 지어서 돈과 전기로 찍어 눌러야 한다는 거였음.\n\n- 그런데 오늘 블룸버그 보도에 따르면, 스탠퍼드대 박사 형제와 일론 머스크의 뇌신경 칩 회사 '뉴럴링크' 출신 연구원이 세운 갓 1년 된 스타트업 '플래핑 에어플레인즈(Flapping Airplanes)'가 몸값 약 8.4조 원(60억 달러)을 인정받으며 단숨에 약 1.4조 원(10억 달러)의 투자금을 쓸어 담음.\n\n- 이들이 던진 질문은 아주 직관적임. \"사람 뇌는 아주 적은 정보만 보고도 금방 배우는데, 왜 지금 AI는 인터넷 전체 데이터를 다 집어삼키고 수백조 원어치 칩을 돌려야만 똑똑해질까? 지금의 AI 학습 방식 자체가 비효율적인 거다.\"\n\n- 회사 이름을 '퍼덕이는 비행기(Flapping Airplanes)'로 지은 이유도 재밌음. 옛날에 인류가 하늘을 날겠다고 새처럼 날개를 퍼덕이는 기계를 만들다 실패하고, 결국 '고정된 날개'라는 완전히 다른 원리로 비행기를 띄웠듯, 무식하게 반도체와 전기만 때려 박는 지금의 방식 대신 '적은 데이터와 적은 칩만으로도 똑똑해지는 새로운 방식'을 만들겠다는 뜻임.\n\n- 더 흥미로운 건 투자자 명단임. 실리콘밸리 최고 투자사(세쿼이아 등)뿐 아니라 구글(GV)과 엔비디아까지 직접 돈을 싸 들고 들어감. 엔비디아 입장에서도 \"만약 진짜로 칩을 적게 쓰는 기술이 성공해서 우리 비싼 칩이 안 팔리면 어쩌지?\" 싶으니 미리 돈을 대며 보험을 든 셈임.\n\n2. 사람도, 비싼 서버도 필요 없다 — AI가 스스로 연구해서 4개월 만에 찍어낸 노트북용 AI '플린트(Flint)' 공개 (와이어드 보도)\n\n- 같은 날 미국 IT 매체 와이어드(Wired)에 공개된 또 다른 스타트업 '리커시브(Recursive)'의 새 코딩 AI '플린트(Flint)'는 한 술 더 뜸.\n\n- 원래 새로운 AI 모델 하나를 바닥부터 만들려면 연봉 수억 원짜리 개발자 수백 명이 반년 넘게 매달려 실험하고 코드를 짜야 함.\n\n- 그런데 세계적인 AI 석학 리처드 소처가 세운 이 회사는 자체 개발한 연구원 AI('유레카 머신')한테 아예 새로운 AI 개발을 통째로 맡겨버림.\n\n- 그러자 이 연구원 AI가 혼자서 아이디어를 내고, 실험을 돌리고, 새로운 뇌 구조와 반도체 최적화 코드까지 직접 짜서 아주 작은 인력만으로 단 4개월 만에 새 AI 모델을 완성해 냄. 사람이 AI를 만들던 시대에서 'AI가 스스로 다음 세대 AI를 연구해 찍어내는 시대'가 실제로 열린 거임.\n\n- 심지어 이렇게 AI가 직접 깎아 만든 '플린트'는 수천만 원짜리 데이터센터 서버가 아니라, 우리가 카페에서 쓰는 일반 맥북(노트북)이나 개인 PC에서 바로 돌아감. 평소엔 뇌 전체(400억 파라미터)를 다 쓰지 않고 질문에 필요한 핵심 뇌세포(25억 파라미터)만 골라서 켜지는 구조로 설계해, 비싼 서버 비용 한 푼 없이 내 노트북 안에서 빠르고 똑똑하게 코딩을 해냄.\n\n한쪽에서는 빅테크들이 한 분기에 수십조 원씩 쏟아부으며 '무식한 물량전'의 끝을 달리고 있지만,\n\n다른 한쪽에서는 \"그 비싼 칩과 전기, 그리고 개발 인건비를 10분의 1로 줄여서 똑같은 결과를 내겠다\"는 기술들이 무서운 속도로 치고 올라오고 있음.\n\n어느 산업이든 특정 부품과 비용이 감당 못 할 만큼 비싸지면, 결국 판을 뒤집는 건 '돈을 더 많이 쓰는 쪽'이 아니라 '돈 안 들이고도 돌아가게 만드는 쪽'이었음. 지금 AI와 반도체 판에서도 바로 그 변화와 격변이 시작되고 있음.","url":"https://x.com/Dontgiveup_26/status/2113043524149186658","createdAt":"2026-10-21T23:03:29Z","metrics":{"views":90049,"likes":998},"lang":"ko"},{"id":"2113202675521355784","author":"田中 新吾","handle":"tanashin115","text":"本の情報処理について部分的にアップデート。\n\n\" ハイライトしながら読んで、ハイライト箇所をObsidianに入れる \"\n\nこの部分をより満足度高く、無理なく安定的に続けられるように仕組みを改良。\n\n・・・・\n\n最新版のフローはこちら。\n\nKindleで読みながらハイライトを付ける（80:20）\n\n↓\n\nDiaブラウザで、Kindle Notebook（Kindleで付けたハイライトが表示される）を開く\n\n↓\n\nDiaブラウザ用に作成した拡張機能「Kindle to Obsidian Clipper」で、Obsidianの中に取り込みたいハイライトを選択。ファイル名にしたいものは「タイトル」を選択\n\n↓\n\n「選択部分をObsidianへ送る」ボタンを押すと、Obsidianに選んだハイライトとタイトルが送られ、本の情報処理テンプレート（80:20BooX）とともにファイルが自動で生成される\n\n↓\n\n・・・・\n\nここから先の処理は別ポストのフローへ。","url":"https://x.com/tanashin115/status/2113202675521355784","createdAt":"2026-10-22T09:35:53Z","metrics":{"views":68,"likes":2},"lang":"ja"},{"id":"2113060195777827302","author":"毅行出海","handle":"sven_ai","text":"卧槽，原来网站上线前有这么多免费检查工具！\n\nSEO、死链、性能、HTML 错误、服务监控，这 6 个工具基本覆盖了。\n\n1. SiteOne Crawler\n开源网站爬虫，扫描全站 404、重定向、SEO 标签、性能和安全问题，还能导出报告。\n\n2. https://t.co/ELdIsawOlx\n网站上线后做推广，可以用它的目录提交助手，把产品提交到数百个导航站，获取曝光和外链。\n\n3. Unlighthouse\n普通 Lighthouse 一次检查一页，它能批量扫描整个网站，找出性能拖后腿的页面。\n\n4. lychee\n开源死链检测工具，自动检查 Markdown、HTML 和网站中的失效链接，还能接入 GitHub Actions。\n\n5. Nu Html Checker\n免费检查 HTML、CSS、SVG 中的错误，支持在线检测和本地批量运行。\n\n6. Gatus\n开源网站监控工具，检查接口状态、响应时间、SSL 证书等，异常时自动报警。\n\n这些工具大部分是免费开源的本地或自部署工具；\n\n网站上线只是开始。\n\n检查问题、修复 SEO、监控服务、持续推广，才是长期增长的关键。\n\n独立开发者建议收藏！","url":"https://x.com/sven_ai/status/2113060195777827302","createdAt":"2026-10-22T00:09:44Z","metrics":{"views":8197,"likes":86},"lang":"zh"},{"id":"2113138148813443096","author":"Trader Kaibe","handle":"K_FLASHES","text":"これは大変な事になってる！\n\n別情報では、\n\nお名前.comがハッキングされた\n↓\nハッカーが身代金を要求\n↓\nお名前.comは無視\n↓\nハッカーが一部口座で勝手に取引して顧客資金を溶かす\n↓\nハッカーが更に脅迫中\n\nみたいな状況らしい・・・\n\nひとまず、お名前.comで取引してた人は取引パスワード変更を！","url":"https://x.com/K_FLASHES/status/2113138148813443096","createdAt":"2026-10-22T05:19:29Z","metrics":{"views":154136,"likes":261},"lang":"ja"},{"id":"2113164450757042378","author":"Codex研究ラボ","handle":"codexneo4","text":"Codexを「1人のAIエンジニア」ではなく　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n「複数人のAI開発チーム」に進化させるOSSが登場\n↓\n単なる便利ツールじゃなくて\nCodexの開発体験そのものを変える仕組み\n\nその名も「oh-my-codex（OMX）」\n今まではCodexに対して、\n\n・要件定義をお願いする\n・フロントエンドを実装させる\n・バックエンドを構築させる\n・テストを実行させる\n・バグを見つけて修正させる\n\nこうした工程を自分で管理する必要があった\n\nところがOMXを導入すると、\n複数のAIエージェントに役割を割り振って、\n並列で開発を進められる。\n\n例えば6つのエージェントを使って、\n① 要件整理・設計\n② フロントエンド開発\n③ バックエンド開発\n④ API・DB設計\n⑤ テスト・品質保証\n⑥ コードレビュー・改善\nという開発体制まで構築できる。\n\nしかも凄いのはここから。\n\nOMXには開発を効率化する機能が揃っている\n\n・複数エージェントによる並列作業\n・要件整理から実装までのワークフロー\n・専門エージェントへのタスク分担\n・長期タスクのチェックポイント管理\n・コードレビューとQAの支援\n・.omx/ による計画・ログ・進捗の保存\n\nつまり、自分がすべての開発工程を\n細かく指示するのではなく、AIチームを\n管理する側に回れる。\n導入したい人は、Codex CLIに以下をコピペするだけ\n👇\n「GitHubの Yeachan-Heo/oh-my-codex の公式READMEを確認してください。現在のCodex CLI、Node.js、認証状態、依存関係を調査し、推奨手順でOMXを導入してください。セットアップ後は omx doctor と実行テストで正常動作を確認してください。最後に $team を使った6エージェントによる並列開発の構成例と実行方法を説明してください。既存設定の変更が必要な場合は事前に確認してください。」\n\nこれなら新しいAIエディタに乗り換える必要もない。\n\n普段使っているCodex CLIを、\nそのままマルチエージェント\n開発環境に拡張できる。\n\nこれからのAI開発は、自分でコードを\n書く能力だけじゃなく、複数のAIを\nどう分業させるかが重要になりそう。","url":"https://x.com/codexneo4/status/2113164450757042378","createdAt":"2026-10-22T07:04:00Z","metrics":{"views":3265,"likes":43},"lang":"ja"},{"id":"2113011876816712105","author":"Taishi | AI Language Learning App 🧞‍♂️","handle":"taishiyade","text":"おっけ。Grok Botの時代終わった\n\nAnthropicがClaude Duetをリリースした\nOpus5.5がデフォルトで能動的エージェントとして作業を進める\n\n本格的に労働の時代が終わった","url":"https://x.com/taishiyade/status/2113011876816712105","createdAt":"2026-10-21T20:57:43Z","metrics":{"views":69719,"likes":558},"lang":"ja"},{"id":"2112928446406164934","author":"Pontiuz","handle":"0xPontiuz","text":"Elon Musk just released a prompt that turns Grok Bot \u0026amp; Opus 5.5 into an entire process engineering team.\n\nIt's f*cking unreal...\n\nSend it to Grok Bot \u0026amp; Opus 5.5, and thank me later. Then read the full playbook with examples below. https://t.co/84VODgoz0e","url":"https://x.com/0xPontiuz/status/2112928446406164934","createdAt":"2026-10-21T15:26:12Z","metrics":{"views":26703,"likes":205},"lang":"en"},{"id":"2113011511429902609","author":"Elon Musk","handle":"elonmusk","text":"Grok @Bot is like hiring a super smart and fun employee!","url":"https://x.com/elonmusk/status/2113011511429902609","createdAt":"2026-10-21T20:56:16Z","metrics":{"views":1305237,"likes":7675},"lang":"en"},{"id":"2112960057742610867","author":"Barneyyy","handle":"comperboludo","text":"Aqui va un CONSEJASO si trabajan remoto. Usen Granola. Es un app que escucha toda la reunion y despues pueden preguntarle lo que quieran, que haga resumenes, minutas, etc. \nOjo que esta no es invasiva como otros notetakers, no se mete a la reunion, nadie sabe que la estas usando","url":"https://x.com/comperboludo/status/2112960057742610867","createdAt":"2026-10-21T17:31:49Z","metrics":{"views":115340,"likes":3932},"lang":"es"},{"id":"2112853274017796435","author":"govin.eth | G哥","handle":"goan999999","text":"哇草，燃起来！DeepSeek V4.1 Flash、Kimi K3 这些模型，居然可以不花钱直接用！【看图，红框】\n\n项目叫 dsh-our-free-model，离谱：\n\n1、免注册：不用创建账号，也不用绑定手机号\n\n2、免 API Key：不用申请密钥，更不用折腾接口配置\n\n3、免费模型：接入 DeepSeek、Kimi 等模型，上游 across agents.\n\nAnd finally, someone open-sourced a self-improving memory layer that can put that signal to work across agent harnesses:\n\n- Claude Code\n- Codex\n- Cursor\n- OpenCode\n- Hermes, and 20+ more\n\nBeacon by @asymptotelabs continuously captures agent sessions across harnesses and stores their traces in a shared index.\n\nI used it with Jev to build a live cross-agent memory workflow.\n\nBeacon captures each run as it happens across all harnesses on my machine. Then Jev evaluates whether the trace contains a reusable engineering lesson, and the approved lesson becomes available to the next agent.\n\nGitHub repo: https://t.co/7n0b9guyQI\n\n(don't forget to star it ⭐)\n\nPreserving an agent run and learning from it are two different problems.\n\nMost traces contain file reads, failed commands, routine exploration, and implementation details that only apply to one task.\n\nPassing the complete transcript to another agent adds context without identifying what matters.\n\nIn this workflow, one agent never receives another agent's raw transcript. It receives only the specific engineering lesson produced from the evaluated trace.\n\nA correction made in one agent can then prevent the same mistake when another agent encounters a similar problem.\n\nThe recording shows the complete workflow I built.\n\nIf you want to dive deeper into Jev, I also wrote a hands-on guide to building this Jev-style decision path with open models, entirely locally.\n\nRead it below.","url":"https://x.com/_avichawla/status/2112862391268688291","createdAt":"2026-10-21T11:03:43Z","metrics":{"views":47675,"likes":524},"lang":"en"},{"id":"2113084635920130321","author":"Sadao Tokuyama","handle":"tokufxug","text":"映像から見えない筋肉の動きを推定する「SOMA v2」公開🩻\n\n🔹RGB映像から皮膚の下にある筋肉の変形を推定\n🔹SKIM v2でデータセットや骨格リグを改善\n🔹従来のLBSと比べマーカー誤差58%減。筋肉と皮膚の衝突率は0.06%と報告\n\n開発者：Eduardo Alvarado氏ら\nコード・データ公開中。\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2113084635920130321","createdAt":"2026-10-22T01:46:51Z","metrics":{" 数会变大，亏一次，乘数就重新算。\n\n它还会盯着巨鲸的动向。\n\n一共做了283笔交易，237笔都是赚的。\n\n这几笔大的止盈，一笔一笔把钱包堆起来：\n\u003e 01:07, GLAZE +$57, 钱包 +78%\n\u003e 02:50, MOSAI +$63\n\u003e 06:46, ADOBE +$105\n\u003e 07:57, BRICK +$184\n\u003e 14:01, RUSTY +$258\n\u003e 16:23, SIENA +$1400，这天赚最多的一笔\n\u003e 18:53, KILNO +$684\n\u003e 20:36, UMBRA +$1015，钱包到5300多美元，涨幅+19%\n\n交易平台：https://t.co/pMwkLXWCpL\n\n我一直在琢磨最后这笔单子。\n\n19%的涨幅，其实真不算猛。\n\n刚开始就47美元，19%也就不到9美元。\n\n但是到晚上20:36的时候，白天一大堆小单子已经把本金养厚了，同样19%，到手就是1015美元。\n\n几百笔小小的止盈攒下来，一共赚了3766美元，差不多跟这8笔大单加起来一样多。\n\n不可能一直连胜。\n\n乘数最多到x4，亏了就重置，可账户的钱还是一直在往上走。\n\n好多人，天天盼着抓一个直接涨1000%的币。\n\n可这次机器人跑，从头到尾都没靠这种币。\n\n单看涨幅，最好的就是最开头那第一单。\n\n47美元涨到7583美元，不需要碰那种飞天大牛币。\n\n就是一笔一笔慢慢做，让钱包越滚越大。","url":"https://x.com/crbpite8/status/2113189675221561525","createdAt":"2026-10-22T08:44:14Z","metrics":{"views":247,"likes":1},"lang":"zh"},{"id":"2113012863753507034","author":"unusual_whales","handle":"unusual_whales","text":"Unusual Whales made waves tracking what most retail traders never see.\n\nCEO Matt Saincome joins The Trade Show tomorrow at 12pm ET.\n\nURL: https://t.co/CuOkHoRd82","url":"https://x.com/unusual_whales/status/2113012863753507034","createdAt":"2026-10-21T21:01:39Z","metrics":{"views":101478,"likes":33},"lang":"en"},{"id":"2113087949042589781","author":"quanxb","handle":"xbquan","text":"不到 24 小时，互联网连爆四个大雷😱😱。\n@grok 我们是不是进入了网络巨不安全时代？！\n\n本毛球挑最严重的四件，按时间捋一下\n\n1、10/21 22:04｜PHP 藏了 14 年的高危漏洞\n全球约 70% 的网站跑在 PHP 上。\n两个漏洞能让黑客不用登录，就远程控制服务器，评分 9.2。\n这次是 OpenAI 牵头、研究员用 AI 挖出来的，PHP 维护者写的补丁，22 点已经发布。\n但细节提前泄露，Cloudflare 已经看到有人在打。\n更麻烦的是：PHP 8.1 及更老的版本官方不管了，这些网站只能裸奔。\n\n2、10/21 23:31｜Node.js 一口气修了 10 个漏洞\n现在大量网站、微服务，包括很多 AI agent 工具，底层都是 Node.js。\n最严重的一个出在解压模块，同样能远程执行代码，也是 OpenAI 帮忙发现的。\n用 Node.js 的，赶紧升级版本！\n\n3、10/21 23:39｜印度证书机构 eMudhra 的私钥被算出来了\n浏览器上那把「小锁」，靠的就是这类证书机构担保。\neMudhra 有 8 张中间证书，私钥生成得太弱，被安全研究员直接算了出来。\n拿到私钥，就能给任何网站伪造「合法」证书，HTTPS 的锁形同虚设！！！\nChrome、Firefox、Apple、微软已经紧急拉黑，记得把浏览器和系统更新到最新。\n\n4、10/22 05:11｜云平台 Railway 被黑，客户密钥可能全泄\nRailway 是很多开发者部署项目的云平台。\n存密钥的系统被人闯进去了，客户放在上面的 Stripe、Anthropic、OpenAI 等 key 可能已经外泄，已经有人收到泄露预警。\n平台紧急暂停了所有构建和部署，要求所有人马上换 key。\n问题是，部署都停了，很多应用想换 key 都没法重新上线。\n\n四件事，四个层面：\n网站发动机、应用底座、HTTPS 信任链、云上的钥匙。\n几乎一晚上全被捅了一遍。","url":"https://x.com/xbquan/status/2113087949042589781","createdAt":"2026-10-22T02:00:00Z","metrics":{"views":43815,"likes":154},"lang":"zh"},{"id":"2112938664959562081","author":"GitHub","handle":"github","text":"Chopin + Proof-Driven Development Kit from @GitHubNext and @MSFTResearch enable teams to ship AI-generated code to production without reviewing it line by line, with stronger assurance than code review and testing alone. \n\nNow in research preview ⬇️","url":"https://x.com/github/status/2112938664959562081","createdAt":"2026-10-21T16:06:48Z","metrics":{"views":67219,"likes":485},"lang":"en"},{"id":"2113186177776025741","author":"GeniusThinking","handle":"GeniusGTX","text":"Jensen Huang explains why he thinks AI just turned a billion people into programmers: \"I think we just went from 30 million to probably 1 billion.\"\n\nLex Fridman asked him whether the number of programmers in the world might go up, not down.\n\n\"The number of software engineers at NVIDIA is gonna grow, not decline. And the reason for that is because the purpose of a software engineer and the task of a software engineer coding are related, not the same. I wanted my software engineers to solve problems. I didn't care how many lines of code they wrote.\"\n\n\"What is the definition of coding? The definition of coding, as of today, is simply specifying, specification, and maybe if you want to be rather directive, you could even give it an architecture of the software that you wanted to write. So the question is, how many people could do that?\"\n\n\"Telling the computer what to go build. How many people? I think we just went from 30 million to probably 1 billion. And so every carpenter in the future will be a coder, except a carpenter with AI is also an architect. They've just increased the value that they could deliver to the customer.\"\n\n\"I believe that every accountant is also your financial analyst, also your financial advisor. So, all of these professions have just been elevated... If I were a carpenter, I see AI, I would just completely go berserk.\"\n\n\"You know, the services I can bring to my clients if I were a plumber, completely go berserk.\"\n\nInterested in the latest with ai/tech and business?\n\nFollow @GeniusGTX and never fall behind.\n\nI track ChatGPT, Claude, and how every new agent is changing how we work and think, then hand you the pure signals.","url":"https://x.com/GeniusGTX/status/2113186177776025741","createdAt":"2026-10-22T08:30:20Z","metrics":{"views":2133,"likes":26},"lang":"en"},{"id":"2113059322339217564","author":"Tony Ma","handle":"t1o6n3y","text":"🚨 Security vulnerabilities reported in a SINGLE day:\n\nPHP — 2 CVEs\nNode.js — 10 CVEs\nNGINX — 5 CVEs\nGo — 1 CVE\nGitLab — 12 CVEs\neMudhra — CA certificate compromise","url":"https://x.com/t1o6n3y/status/2113059322339217564","createdAt":"2026-10-22T00:06:15Z","metrics":{"views":462954,"likes":6418},"lang":"ro"},{"id":"2112975477971558667","author":"Eric Glyman","handle":"eglyman","text":"the people in this video house families, open schools, and help people live better lives. they're also under real pressure to make sure every dollar goes to the mission.\n\n10,000+ nonprofits run on Ramp. we build tools to give them back time and money: sales tax recovery, grant tracking, and an agent that checks spending against grant rules.\n\ngrateful our team gets to play a small part in their work.","url":"https://x.com/eglyman/status/2112975477971558667","createdAt":"2026-10-21T18:33:05Z","metrics":{"views":5712,"likes":103},"lang":"en"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();

 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
