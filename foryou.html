<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

andle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-15T08:31:40+09:00","posts":[{"id":"2110380108573782278","author":"Ren","handle":"Ryrenz","text":"🩺 又发现一个变态开源项目 Repowise，能把你整个代码库索引成 AI 查得动的地图，让 Claude Code 别再满仓库瞎翻文件。\n\nGitHub 上 7672 star，三月底才建的仓库，最近几乎一周一个版本，v0.52 到 v0.56 全挤在九、十月。\n\n平时让 AI 改一处老代码，它得先满仓库 grep 一遍，读一堆无关文件，输出里全是「我再看看这个文件」。Repowise 的做法是提前在你本机把代码结构、调用图、Git 历史、测试和文档全索引好，再通过 MCP 暴露给 Claude Code、Codex、Cursor 这些工具去查，agent 要什么直接问索引。项目自己在 django 的 43 个 issue 上做过配对测试，同样的活儿输出量少了 31.6%。\n\n更实用的是那套代码健康评分：53 个检测器给每个文件打 1 到 10 分，还能标出改哪块风险最高、哪些是死代码。图谱、风险、健康度这几块全是确定性计算，一次大模型调用都没有，不用配任何 API key。\n\n让 AI 读得懂你的仓库，比给它换个更大的模型实在。\n\nGitHub：https://github.com/repowise-dev/repowise","url":"https://x.com/Ryrenz/status/2110380108573782278","createdAt":"2026-10-14T23:40:01+09:00","avatar":"https://pbs.twimg.com/profile_images/2047148133746933760/iEtNYePb_200x200.jpg","metrics":{"views":3200,"likes":71,"reposts":4,"replies":4},"lang":"zh","textJa":"🩺 またすごいオープンソースを見つけた。Repowiseは、コードベース全体をAIが検索できる「地図」としてインデックス化し、Claude Codeがリポジトリ中をむやみに漁らなくて済むようにする。\n\nGitHubで7672スター。3月末に作られたばかりなのに、ほぼ週1でリリースしていて、v0.52〜v0.56が9〜10月に集中している。\n\nふだんAIに古いコードを1か所直させると、まずリポジトリ全体をgrepし、関係ないファイルを大量に読み、出力は「このファイルも見てみます」ばかりになる。Repowiseは事前に手元のマシンでコード構造、呼び出しグラフ、Git履歴、テスト、ドキュメントをすべてインデックス化し、MCP経由でClaude Code、Codex、Cursorなどに公開する。エージェントは必要なものをインデックスに直接聞けばいい。プロジェクト自身がdjangoの43件のissueで比較テストをしたところ、同じ作業で出力量が31.6%減ったという。\n\nさらに実用的なのがコード健全性スコア。53個の検出器で各ファイルを1〜10点で採点し、どこを変えるとリスクが高いか、どれがデッドコードかも示す。グラフ、リスク、健全性はすべて決定的な計算で、LLMは一度も呼ばず、APIキーも不要。\n\nAIにリポジトリを理解させるほうが、もっと大きなモデルに替えるより確実だ。\n\nGitHub：https://github.com/repowise-dev/repowise"},{"id":"2110400029529956858","author":"StudioYebisu","handle":"studio_yebisu","text":"お、結構変わったな、エルメスエージェント。\n一言で言うと、結構初心者に勧めやすいハーネスになった感じやな。ローカルLLMにネイティブ対応しようとしているのが好感ポイントや。\n\n■主な更新\n初回起動の案内チャット：\nデスクトップ版を初めて開くと、無料の試用モデルでセットアップの会話が始まる。APIキーはいらん。\nこれはだいぶ人に勧めやすくなったな。バカが使ってもセットアップしてくれる。\n\nローカルモデルをワンクリックで：\nllama.cpp を自動で入れて、GPU と RAM に収まる一番ええモデルを選んでくれる。\nこれはローカルLMM初心者に、とりあえずHermesAgent入れとけって言いやすくなったな。\n\nConnectors：Linear や Notion などのアプリをブラウザで一度サインインするだけで、エージェントから使える。MCP の画面はこのページに統合された。\n\nプラグインカタログ：審査済みのプラグインが600件ある。\n\n新しいモデルへの対応：Claude 5.5 系、GPT-6 Astra／Sol／Luna、Gemini 4 Argon などが選べる。\n\n■HermesAgent最大の弱点、トークン効率は直ったのか。\nツール定義の半減：めったに使わんツールが約19個（computer_use、image_generate、cron など）、検索で呼ばれたときだけ読み込まれるようになった。毎回送るツール定義は 13,367 → 6,883 トークンに減っとる。\n\n固定プロンプトの削減：1回のリクエストあたり約2,100トークン減った。\n\nキャッシュの改善：\nツール一覧をセッション中は固定するようになって、途中でキャッシュが無駄になりにくくなった。\n- cache_ttl: auto を入れると、対話は1時間、サブエージェントや cron は5分キャッシュを保つ。これは自分で設定せな有効にならん。\n- 長いセッションで /model を切り替えるときは、キャッシュが壊れる前に確認が出る。\n\n他にも諸々あったが、初心者に使いやすくなったのと、弱点がだいぶ軽減されているということで、基本的にポジティブ。\n公式外ハーネス初心者にはかなり進めやすいハーネスになりましたな。","url":"https://x.com/studio_yebisu/status/2110400029529956858","createdAt":"2026-10-15T00:59:11+09:00","avatar":"https://pbs.twimg.com/profile_images/2095218586046652416/pyuFtKH0_200x200.jpg","metrics":{"views":6738,"likes":132,"reposts":7,"replies":0},"lang":"ja"},{"id":"2110238014765215812","author":"govin.eth | G哥","handle":"goan999999","text":"兄弟们！这才是开源界真正的神！！！不用担心 Claude 封号了\n\n我挖到了一个狠货：CC Switch\n\n直接把 Claude Code 变成万能 AI 编程工具！\n\n接入 GPT-6.1 Sol、DeepSeek 等兼容模型，Claude 用不了，也能切换其他模型继续干活！\n\n90+ API 服务商预设，一键切换，MCP、Skills、Prompts 统一管理，支持多模型聚合，想用哪个切哪个\n\n以前是一个模型配一套工具，现在是一套工具管理整个 AI 编程生态！\n\n关键是工具免费、开源！","url":"https://x.com/goan999999/status/2110238014765215812","createdAt":"2026-10-14T14:15:23+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110237945869615104/img/PZ1GXV8TEGABJN1J.jpg","avatar":"https://pbs.twimg.com/profile_images/2085726397587443712/XkX2eLfE_200x200.jpg","metrics":{"views":34543,"likes":50,"reposts":6,"replies":59},"lang":"zh","textJa":"みんな！これこそオープンソース界の神だ！！！もうClaudeのアカウント停止を心配しなくていい\n\nすごいものを掘り当てた：CC Switch\n\nClaude Codeをそのまま万能AIコーディングツールに変える！\n\nGPT-6.1 Sol、DeepSeekなどの互換モデルに接続でき、Claudeが使えなくても別モデルに切り替えて作業を続けられる！\n\n90以上のAPIプロバイダーのプリセットをワンクリックで切り替え、MCP・Skills・プロンプトを一元管理、複数モデルの集約にも対応。使いたいものに切り替えればいい\n\n以前は1モデルに1セットのツールだったが、今は1セットのツールでAIコーディング環境全体を管理できる！\n\nしかも無料でオープンソース！"},{"id":"2110366390599454776","author":"lifcc","handle":"mylifcc","text":"老黄（NVIDIA）看了都要连夜报警的程度 😭\n\n国外有个老哥把越狱的 PS5 爆改成了本地 AI 服务器 \n不仅做成了 PS5 原生 App \n甚至能用手柄直接在电视上逛 Hugging Face 下模型\n\n最离谱的是性能： \n跑阿里最新的 Qwen 27B 大模型，速度居然有 20 tok/s \n跑 Llama 3.2 3B 直接飙到 124 tok/s\n要知道 PS5 可是有 16GB GDDR6 统一大显存（带宽 448GB/s） 二手只要两三千块\n\n以前买 PS5 的理由：“老婆，这是路由器” \n现在买 PS5 的理由：“老婆，我在客厅部署了一台本地 AI 算力工作站，用来搞科研的”\n你们那台用来盖泡面的 PS5，终于找到正经工作了 💀","url":"https://x.com/mylifcc/status/2110366390599454776","createdAt":"2026-10-14T22:45:30+09:00","media":"https://pbs.twimg.com/media/HUmGmsIb0AEDB0G.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2034239213487681536/2gjQXlXx_200x200.jpg","metrics":{"views":37984,"likes":351,"reposts":45,"replies":29},"lang":"zh","textJa":"NVIDIAのジェンスン・フアンも夜中に通報したくなるレベル 😭\n\n海外の人が脱獄したPS5をローカルAIサーバーに大改造した\nPS5ネイティブアプリとして作っただけでなく\nコントローラーでテレビ上からHugging Faceを見てモデルをダウンロードできる\n\n一番ぶっ飛んでいるのは性能：\nAlibabaの最新Qwen 27Bが20 tok/sで動き\nLlama 3.2 3Bなら124 tok/sまで出る\nPS5は16GBのGDDR6統合メモリ（帯域448GB/s）を積んでいて、中古なら2〜3千元ほど\n\n昔のPS5を買う言い訳：「これはルーターだよ」\n今の言い訳：「リビングにローカルAI計算ワークステーションを置いたんだ、研究用に」\nカップ麺のフタ代わりだったPS5が、ついにまともな仕事を見つけた 💀"},{"id":"2110491086229823917","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【朗報】Macの「Spotlight」が中身の意味で探せるように。Google公式も紹介したオープンソースアプリ「DigUp」。\n\nファイル名を覚えていなくても、中身を言葉で説明すれば見つかるのは普通に便利。全部Mac内で動くので社内資料にも使いやすそう。\nhttps://x.com/googlegemma/status/2110044337849692644/video/1\n・EmbeddingGemma 2搭載、100%ローカル動作\n・写真の特定シーンを言葉で検索\n・音声・動画は該当の秒数へジャンプ\n・コードも「やりたいこと」で検索\n・100以上の言語に対応","url":"https://x.com/masahirochaen/status/2110491086229823917","createdAt":"2026-10-15T07:01:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110043155840315392/img/VO6ZNIqYXbQNfr1I.jpg","avatar":"https://pbs.twimg.com/profile_images/1689665533929725953/fClFlzLd_200x200.jpg","metrics":{"views":4628,"likes":16,"reposts":1,"replies":2},"lang":"ja"},{"id":"2110221307673780434","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"【海外で話題】\nえええええ！！！\nOpus 5.5がBlenderで3Dキャラにリグを組み、23種類の動きまで付ける組み方が話題😳\n組み合わせは——Claude × Blender MCP × BlenderKit\nhttps://x.com/rewind02/status/2109239099332661429/video/1\n作者のコツは「Opusにモデルを作らせず、指揮だけさせる」こと👇\n・BlenderのMCPサーバーを入れ、Opus 5.5をeffort highにして /mcp で接続を確認\n・BlenderKitを入れると、14万点以上の無料の家具・素材・HDRIから選べる\n・参考画像と普通の言葉で頼む。後輩の3Dデザイナーに話す感覚で、型どおりのプロンプトは不要\n・人物は「リアルに、なめらかに動くようリグも組んで」と同じ依頼の中で頼む\n・まず480pで試し描きして、最後に本番。1080pは1〜2時間かかることも\n\nつまり、\n「家具はBlenderKitから持ってくる\nOpusは配置・照明・リグ・動きだけ担当」\n椅子を1から作らせると、トークンを食う上に見た目も嘘っぽくなるとのこと。\n動きは段階ごとに確かめる。見落とした崩れは、あとで2時間の描き直しになる。\n『作らせる』より『並べさせる』の時代へ。\n\nBlenderのようにMCPで道具をつなぐと、Claudeは手を動かす役から指揮役に変わる。\nつなげておきたいMCPサーバー30選の記事はこちら👇","url":"https://x.com/ClaudeCode_love/status/2110221307673780434","createdAt":"2026-10-14T13:09:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109239010128232449/img/jpau487h63YNmjYM.jpg","avatar":"https://pbs.twimg.com/profile_images/2042404213943386115/05hqEdJl_200x200.jpg","metrics":{"views":13185,"likes":181,"reposts":11,"replies":1},"lang":"ja"},{"id":"2110339949216297444","author":"オープンソース研究所","handle":"opensourcelab9","text":"Claude Code と Codex を、毎回まっさらな状態から動かしている人へ👀\n役割・共有の文脈・担当の仕事を持ったAIチームを組める openrig があります。\n星は★7,082で、1日に約37ずつ伸びています。\n\n1回呼んで終わりではなく、チームとして続けて動かす前提になっています。\n\nClaude Code と Codex を何本も使っている人ほど、前提の渡し直しが減って使い方が変わるはずです。\n\nオープンソースはこちら👇\n\nhttps://github.com/mvschwarz/openrig","url":"https://x.com/opensourcelab9/status/2110339949216297444","createdAt":"2026-10-14T21:00:26+09:00","avatar":"https://pbs.twimg.com/profile_images/2043709040921059328/1qDRmMiX_200x200.jpg","metrics":{"views":624,"likes":3,"reposts":1,"replies":0},"lang":"ja"},{"id":"2110219115252134275","author":"bakigul","handle":"bakigulai","text":"Claude yüzünden Git bile işsiz kaldı. \n\nAnthropic, kendi versiyon kontrol sistemini yazmak zorunda kalmış.\n\nAnthropic'te günlük merge sayısı 2.500'den 30.000'in üzerine çıkmış.\n\nMevcut Git altyapısı bu yükü taşımakta zorlanınca Scion adında yeni bir sistem geliştirmişler.\n\nSadece 7 mühendis, Claude'un yardımıyla 5 ayda bu sistemi geliştirip şirketin monorepo'sunu taşımış.\n\nBir düşünün, artık kod yazma hızına geliştirme altyapısı yetişemiyor.\n\nKaynak: https://www.anthropic.com/engineering/redesigning-source-control","url":"https://x.com/bakigulai/status/2110219115252134275","createdAt":"2026-10-14T13:00:17+09:00","media":"https://pbs.twimg.com/media/HUkBGj_WgAA9DpS.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1990042022850215936/dPo98lwn_200x200.jpg","metrics":{"views":12769,"likes":57,"reposts":2,"replies":3},"lang":"tr","textJa":"Claudeのせいで、Gitさえ仕事を失った。\n\nAnthropicは独自のバージョン管理システムを書かざるを得なくなった。\n\nAnthropicの1日のマージ数は2,500件から30,000件以上に増えた。\n\n既存のGit基盤がこの負荷に耐えられなくなり、Scionという新システムを開発した。\n\nたった7人のエンジニアがClaudeの助けを借りて5か月で開発し、社内のモノレポを移行した。\n\n考えてみてほしい。もはや開発基盤がコードを書く速さに追いつけない。\n\n出典: https://www.anthropic.com/engineering/redesigning-source-control"},{"id":"2110339406838313421","author":"AIGCLINK","handle":"aigclink","text":"不用换硬件，把普通监控摄像头升级成AI摄像头，增加目标检测、跟踪、AI事件摘要、智能搜索能力\n\n项目叫Clearcam，只要接入兼容的RTSP视频流，就能通过AI实现：\n\n1、目标检测跟踪，识别画面中的人、车辆，持续跟踪其活动\n2、智能事件告警，检测到目标或事件后，可通过手机或自定义通知接口推送提醒\n3、AI事件摘要，基于Qwen3-VL生成事件内容摘要\n4、录像检索，围绕检测到的目标/事件查找相关视频，也支持按自然语言描述搜索\n5、远程查看，配套iOS客户端，可查看实时画面、事件片段和通知，部分功能属于Premium服务\n\n技术上基于Python构建NVR和AI推理服务，将视频接入、目标检测、跟踪、视觉语言模型分析整合为一套系统\n\n支持Mac、Linux，本地运行并通过浏览器管理；通知接口可以对接Home Assistant、Pushover、n8n等\n\n#AI监控 #Clearcam","url":"https://x.com/aigclink/status/2110339406838313421","createdAt":"2026-10-14T20:58:17+09:00","media":"https://pbs.twimg.com/media/HUlo4jia8AAgYnC.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1729450995850027008/gllXr6bh_200x200.jpg","metrics":{"views":8235,"likes":163,"reposts":25,"replies":19},"lang":"zh","textJa":"ハードを替えずに、普通の監視カメラをAIカメラに。物体検出、追跡、AIによるイベント要約、スマート検索を追加できる\n\nプロジェクト名はClearcam。対応するRTSP映像ストリームをつなぐだけで、AIで次のことができる：\n\n1、物体検出・追跡：画面内の人や車を識別し、動きを追い続ける\n2、スマートなイベント通知：対象やイベントを検出すると、スマホや独自の通知APIにプッシュ\n3、AIイベント要約：Qwen3-VLでイベント内容の要約を生成\n4、録画検索：検出した対象やイベントから関連映像を探せ、自然言語での検索にも対応\n5、リモート閲覧：iOSアプリでライブ映像、イベントのクリップ、通知を確認でき、一部はPremium機能\n\n技術的にはPythonでNVRとAI推論サービスを構築し、映像取り込み、物体検出、追跡、視覚言語モデルの分析を1つのシステムにまとめている\n\nMacとLinuxに対応し、ローカルで動かしてブラウザから管理。通知はHome Assistant、Pushover、n8nなどと連携できる\n\n#AI監控 #Clearcam"},{"id":"2110461328175374761","author":"shmidt","handle":"shmidtqq","text":"8 BOTS JUST REVERSE-ENGINEERED A $400K/YR SAAS IN ONE NIGHT.\n\nwatch the clip. that ring of 8 grok bots around the rea core is one closed app being torn apart in real time.\n\ntrace, xref, read, site, spec, build, test, review. \n\nby the end of the loop the screen shows:\n- 2,418 files parsed\n- 23 blind calls\n- 16 pieces of evidence, 6 open assumptions\n- 9 modules reconstructed, 1 confirmed\n- 214 out of 214 observed behaviors matched\n\nthat is not a stylised dashboard. it is literally the rea workflow: \n\napp → rea → grok bot → spec.md → build → test\n\nthe numbers behind the hype are insane:\n- rea repo: 11k to 200k github stars in 5 days, global rank #161\n- aegis authenticator: 3,077 classes, 133 test cases matched\n- dx-ball 1996: sound-panning function recovered, 3,205 behavioral tests passed\n- a steam game fully decompiled into unity in under 30 minutes\n- cost to understand a closed app: $0 and one evening\n\nthe opportunity is wilder.\npentest shops charge $8k to $50k per audit. reverse engineers bill $200 an hour and wait weeks.\none mcp server + a bot with its own computer runs the same investigation while you sleep.\n\none operator + grok bot + rea + one night = a reverse engineering firm.\n\nsave the post, watch the terminal, then open the breakdown below.","url":"https://x.com/shmidtqq/status/2110461328175374761","createdAt":"2026-10-15T05:02:45+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110455108605526017/img/vEQIzmllSynMgkyR.jpg","avatar":"https://pbs.twimg.com/profile_images/2068398835886440449/CBfDKDgF_200x200.jpg","metrics":{"views":3169,"likes":66,"reposts":7,"replies":8},"lang":"en","textJa":"8体のボットが年間40万ドルのSaaSを一晩でリバースエンジニアリングした。\n\nクリップを見てほしい。reaのコアを囲む8体のGrok Botの輪が、1つのクローズドなアプリをリアルタイムで分解している。\n\ntrace、xref、read、site、spec、build、test、review。\n\nループの終わりに画面にはこう表示される：\n- 2,418ファイルを解析\n- 23回のブラインドコール\n- 16個の証拠、6個の未確定の仮定\n- 9モジュールを再構築、うち1つを確認\n- 観測した214の挙動のうち214が一致\n\nこれは見栄えのためのダッシュボードではない。文字どおりreaのワークフローだ：\n\nアプリ → rea → Grok Bot → spec.md → ビルド → テスト\n\n盛り上がりの裏の数字もすごい：\n- reaのリポジトリ：5日で1.1万から20万スター、世界ランク161位\n- aegis authenticator：3,077クラス、133のテストケースが一致\n- 1996年のdx-ball：サウンドのパン処理を復元、3,205の挙動テストに合格\n- Steamのゲームを30分足らずでUnityへ完全に逆コンパイル\n- クローズドなアプリを理解するコスト：0ドルと一晩\n\nチャンスはもっと大きい。\nペネトレーションテスト会社は1回の監査で8千〜5万ドルを請求する。リバースエンジニアは時給200ドルで、何週間も待たされる。\nMCPサーバー1つと自分のコンピューターを持つボットがあれば、寝ている間に同じ調査が走る。\n\nオペレーター1人 + Grok Bot + rea + 一晩 = リバースエンジニアリング会社。\n\n投稿を保存して、ターミナルを見て、下の解説を開いてほしい。"},{"id":"2110249491056238874","author":"Dmiao豆苗啊","handle":"nima2qisi2","text":"😆现在制作 360° Orbit 环绕效果太简单了\n上传你的图片→ 输入指令 →玩法Get\n\nPormpt指令👇","url":"https://x.com/nima2qisi2/status/2110249491056238874","createdAt":"2026-10-14T15:00:59+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110248739210485760/img/HoVo_i9lIqXfgxaZ.jpg","avatar":"https://pbs.twimg.com/profile_images/2059889474335596545/srpl0h6o_200x200.jpg","metrics":{"views":152090,"likes":1812,"reposts":276,"replies":47},"lang":"zh","textJa":"😆今や360°の回り込み（オービット）効果を作るのは本当に簡単\n画像をアップロード→指令を入力→完成\n\nプロンプトはこちら👇"},{"id":"2110333938568667370","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これ欲しかった。\n\nAIで画像を作るとき、\n「もっといい感じの構図にして」\nで思い通りにならないなら、\n構図の名前で頼むのが早い。\n\n・三分割構図で、主役を自然に目立たせる\n・対角線構図で、動きと躍動感を出す\n・額縁構図で、視線を主役に集める\n・余白構図で、スッキリ見せる\n\nChatGPTやGeminiで使える\n「AI画像の構図100選」を図解にまとめました。\n\n画像生成する人は保存推奨です👇📌","url":"https://x.com/Codex_jisen/status/2110333938568667370","createdAt":"2026-10-14T20:36:33+09:00","media":"https://pbs.twimg.com/media/HUlphZZbQAAnRL9.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2108789323218980864/bMLYthFZ_200x200.jpg","metrics":{"views":19912,"likes":648,"reposts":61,"replies":10},"lang":"ja"},{"id":"2110329132643242030","author":"旺旺","handle":"TiagerBao","text":"Claude Code 现在连“祖传老系统”都准备接手了。\n\nAnthropic 官方出了一个 Code Modernization 插件。\n\n它不是上来就重写，而是按流程干：\n\n读懂旧系统 → 画依赖和数据流 → 提取业务规则 → 人工确认方案 → 改代码 → 验证新旧行为\n\n支持三种玩法：\n\n老版本升级新版本\n换语言 / 换技术栈重写\n直接按新架构重建\n\n我觉得最关键的是最后的验证。\n\n它会让旧系统和新系统跑同一批输入逐项对比，还会额外生成边界、空值、异常数据等新测试；甚至故意破坏一行代码，确认测试真的能抓出问题。\n\n最后不会只说“迁移完成”，而是给每个模块一个结果：\n\nPROVEN / PARTLY PROVEN / NOT PROVEN\n\n而且整个流程默认不修改 legacy 源码，几个关键节点必须人工确认。\n\n这比让 Agent 一把梭重写老项目靠谱多了。\n\nGitHub：https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-modernization/README.md\n\n#Claude #ClaudeCode #AI #Agent #CodingAgent #LegacyCode #OpenSource","url":"https://x.com/TiagerBao/status/2110329132643242030","createdAt":"2026-10-14T20:17:27+09:00","avatar":"https://pbs.twimg.com/profile_images/1840689453582446592/Y77oEhBg_200x200.jpg","metrics":{"views":2719,"likes":27,"reposts":6,"replies":5},"lang":"zh","textJa":"Claude Codeは今や「先祖代々の古いシステム」まで引き受ける準備ができた。\n\nAnthropic公式がCode Modernizationプラグインを出した。\n\nいきなり書き直すのではなく、手順に沿って進める：\n\n旧システムを読み解く → 依存関係とデータの流れを図にする → 業務ルールを抽出 → 人が方針を確認 → コードを変更 → 新旧の挙動を検証\n\n3つの使い方に対応：\n\n旧バージョンから新バージョンへのアップグレード\n言語や技術スタックを替えての書き直し\n新しいアーキテクチャでの作り直し\n\n一番大事なのは最後の検証だと思う。\n\n旧システムと新システムに同じ入力を流して1項目ずつ比べ、境界値、空値、異常データなどの新しいテストも追加で作る。さらにわざとコードを1行壊して、テストが本当に問題を検出できるか確かめる。\n\n最後は「移行完了」とだけ言うのではなく、モジュールごとに結果を出す：\n\nPROVEN / PARTLY PROVEN / NOT PROVEN\n\nしかもフロー全体で既定ではレガシーのソースを変更せず、いくつかの重要な段階では人の確認が必須。\n\nエージェントに古いプロジェクトを一気に書き直させるより、ずっと信頼できる。\n\nGitHub：https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-modernization/README.md\n\n#Claude #ClaudeCode #AI #Agent #CodingAgent #LegacyCode #OpenSource"},{"id":"2110334301367845184","author":"程序员鱼皮","handle":"yupi996","text":"不少人还以为，做 OCR 都得上显卡跑大模型。\n\n其实刚开源的 Indra，整套模型才 18MB。官方自测光靠 32 核服务器 CPU，每秒就能读 49 页，是 PaddleOCR 文字识别模型的 11 倍！🚀\n\n而且 PDF 和图片能转成 Markdown，标题、列表、表格都分好了，做 RAG 知识库正合适。不过手写和复杂表格它还认不好。\n\n清晰的印刷件倒是识别得很稳，我拿 M2 Max 笔记本试了下，150 页的 PDF 全部当扫描件来认，9 秒就读完了。视频里这页中文教程，我故意做成歪斜、带噪点的扫描件，1025 个汉字也全认对了！","url":"https://x.com/yupi996/status/2110334301367845184","createdAt":"2026-10-14T20:38:00+09:00","media":"https://pbs.twimg.com/ext_tw_video_thumb/2110333830569787392/pu/img/Lm1uq6J4ACJuxPSy.jpg","avatar":"https://pbs.twimg.com/profile_images/2000617981035044864/5pXwSkUN_200x200.jpg","metrics":{"views":17492,"likes":251,"reposts":38,"replies":17},"lang":"zh","textJa":"OCRにはGPUで大きなモデルを動かす必要があると思っている人がまだ多い。\n\n実は公開されたばかりのIndraは、モデル一式でわずか18MB。公式の自己テストでは32コアのサーバーCPUだけで毎秒49ページを読み、PaddleOCRの文字認識モデルの11倍だという！🚀\n\nしかもPDFや画像をMarkdownに変換でき、見出し、リスト、表もきちんと分かれるので、RAGのナレッジベース作りにぴったり。ただし手書きや複雑な表はまだ苦手。\n\n鮮明な印刷物なら安定して認識できる。M2 MaxのノートPCで、150ページのPDFを全部スキャン画像として認識させたら9秒で読み終えた。動画の中国語チュートリアルのページはわざと傾けてノイズを入れたスキャン画像にしたが、1025文字の漢字も全部正しく認識した！"},{"id":"2110498941892723075","author":"AIsa","handle":"AIsaOneHQ","text":"Introducing Grok Bot for AI SEO\n\nYour agent can now:\n\n\u003e ask ChatGPT, Claude, Gemini and Perplexity what your buyers ask\n\u003e check Google's AI Overviews and AI Mode too\n\u003e see which brands they recommend first, and why","url":"https://x.com/AIsaOneHQ/status/2110498941892723075","createdAt":"2026-10-15T07:32:13+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110492992825896960/img/cXFgnWx0oX8eWU7R.jpg","avatar":"https://pbs.twimg.com/profile_images/2084947704275435520/d81UqHYN_200x200.jpg","metrics":{"views":173,"likes":3,"reposts":1,"replies":2},"lang":"en","textJa":"AI SEO向けのGrok Botを発表\n\nあなたのエージェントはこんなことができる：\n\n\u003e ChatGPT、Claude、Gemini、Perplexityに、買い手が尋ねる質問を聞く\n\u003e GoogleのAI OverviewsやAI Modeも確認する\n\u003e どのブランドが最初に勧められるか、その理由も分かる"},{"id":"2110260417910206771","author":"karamage💎アプリ個人開発","handle":"kara_mage","text":"Anthropic、Gitやめたってよ\n\nAIによるコード生成が加速し、1日のマージ数は2,500件から30,000件超に\n\n独自のバージョン管理システム「Scion」を開発し、チェックアウトを約100倍高速化、インフラ規模を約1/200に削減\n\nAI時代、開発基盤も再設計する時が来た","url":"https://x.com/kara_mage/status/2110260417910206771","createdAt":"2026-10-14T15:44:25+09:00","avatar":"https://pbs.twimg.com/profile_images/1527102338866941953/7QibA78F_200x200.jpg","metrics":{"views":70153,"likes":615,"reposts":75,"replies":3},"lang":"ja"},{"id":"2110261068853596182","author":"Mr. Buzzoni","handle":"Mr_Buzzoni","text":"this one page turns Obsidian + Opus 5.5 + Jev into a second brain that thinks with you around the clock\n\nbuilt on Karpathy's ideas\n\nJev reads every note before Opus does\nOpus writes only what matters\nyour vault keeps working while you don't\n\ncuts 80% off your weekly chat time\nfrees you up for the work your manager actually pays for\n\nthe people who set this up early\nare the ones the next raise finds first","url":"https://x.com/Mr_Buzzoni/status/2110261068853596182","createdAt":"2026-10-14T15:47:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110110125432139776/img/xx_gv1ktOYqHfpIW.jpg","avatar":"https://pbs.twimg.com/profile_images/2022077728359682048/UWClPPZX_200x200.jpg","metrics":{"views":27378,"likes":397,"reposts":61,"replies":14},"lang":"en","textJa":"この1ページで、Obsidian + Opus 5.5 + Jevが、24時間一緒に考えてくれる「第二の脳」になる\n\nKarpathyのアイデアがベース\n\nOpusより先にJevがすべてのメモを読み\nOpusは大事なことだけを書く\nあなたが休んでいる間もVaultは働き続ける\n\n週のチャット時間を80%削減\n上司が本当にお金を払っている仕事に時間を使える\n\nこれを早く整えた人が\n次の昇給を真っ先に手にする"},{"id":"2110426832613032024","author":"naldz.","handle":"naldzyul","text":"EN 16 MINUTOS APRENDES A HACER WEBS DE CINE QUE SE VENDEN A 50.000 $\n\nCon Claude Fable 5.1.\n\nTodo el proceso, paso a paso.\n\n🔖 Guárdalo. Vale cada minuto.","url":"https://x.com/naldzyul/status/2110426832613032024","createdAt":"2026-10-15T02:45:41+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110426309843177472/img/2htDryqY9XQW24T6.jpg","avatar":"https://pbs.twimg.com/profile_images/2094137913902530562/GRfqH9fk_200x200.jpg","metrics":{"views":9597,"likes":220,"reposts":29,"replies":19},"lang":"es","textJa":"16分で、5万ドルで売れる映画のようなWebサイトの作り方が分かる\n\nClaude Fable 5.1で。\n\n全工程をステップごとに。\n\n🔖 保存しておこう。1分1分に価値がある。"},{"id":"2110383054485401643","author":"rS_ローカルLLM×投資","handle":"rS_alonewolf","text":"Strata で動かしている Qwen3.8-Flash-Next、\n自分の PC で無検閲化できた。\n\n◼︎あっそうそれで？それのどこが難しいの？\nStrata で動く GSQ-RCO 版は、特殊な量子化版。検閲を外すには、普通は拒否の方向を見つけたあと、圧縮前の元データ（BF16、360GB）を書き換え、それを圧縮し直す。\n\nGSQ-RCO の圧縮は、公式の手順書の目安で H200 を何枚も使う処理（235B のモデルで8枚）で、一般のご家庭の PC ではまずできないとされる。\n\n◼︎これまでの無検閲版\n・HF の GSQ-RCO 版の無検閲版（十数個）は、どれも別の人が BF16 で書き換えた重みを、GSQ-RCO のファイルに移植したもの（SC117 など）\n・ほかに、Strata本体では、重みは変えずに、推論中に拒否の向きを消すためのベクトルが配られている\n・GSQ-RCO の重みそのものを編集したものは、調べた範囲ではなかった\n\n◼︎やったこと\n従来の検閲外しと同じく、モデルの中で「断る」ときに強まる向きを見つけ、重みからその向きの成分を取り除いた。\n\n難しいのは重みの編集。\n・圧縮されたファイルでは、各重みは「決まった数個の値のどれか × 倍率」でしか書\n・取り除いた分は重みのごく一部なので、一番近い値に丸めると、ほとんど元に戻ってしまう\n・1回目は、この保存のしかたに問題があり、賢さが落ちた\n\nそこで、行列の種類ごとに保存のしかたを変えた。\n\n小さい行列（アテンションと共有エキスパート）\n・圧縮された値をいったん小数に展開する\n・小数のまま、拒否の向きの成分を取り除く\n・解像度を8ビットに上げて保存し直す\n・刻みが細かいので、取り除いた結果がほぼそのまま残る（ファイルは +0.23GB）\n\nエキスパートの行列（重みの大部分）\n・8ビットにするとファイルが21GB増えるので、元の粗い形式のまま残す\n・まず、モデル自身にコーディング作業の会話を読ませ、各エキスパートに実際に入っ\n・次に、拒否の向きを取り除いた理想の行列を計算する\n・元の形式で書ける値の中から、記録した入力を通したときの出力が、理想の行列の出 び直す（GPTQ という手法）\n・その際、選び直した結果に拒否の向きが戻らないように条件を付ける\n\n◼︎結果\n・断るべき依頼240問（HarmBench）のうち、元のモデルは6問、今回の版は194問に応じた\n・元のモデルからのずれは SC117 より小さい（KL 0.038 対 0.049）\n・公開試験と実務課題では、能力の低下は検出されなかった\n\n◼︎次やること\n今回の方法をベースに、\n性格や考え方の調整を焼き込めるかを試す。\n\n手順はモデルカードに書いた。","url":"https://x.com/rS_alonewolf/status/2110383054485401643","createdAt":"2026-10-14T23:51:43+09:00","media":"https://pbs.twimg.com/media/HUmV0WKbIAEfCbs.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2025478533158776832/u0NTJWHN_200x200.jpg","metrics":{"views":6263,"likes":94,"reposts":15,"replies":1},"lang":"ja"},{"id":"2110378916963876908","author":"Higgsfield AI 🧩","handle":"higgsfield","text":"We asked Claude how good it is at motion design.\n\nA few hours later, we got a finished launch video.\n\nHiggsfield Katana for Motion Design, available now in Claude via Higgsfield MCP.","url":"https://x.com/higgsfield/status/2110378916963876908","createdAt":"2026-10-14T23:35:17+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110378724751544320/img/ZKcOJ5FvWSR8tNL1.jpg","avatar":"https://pbs.twimg.com/profile_images/2029949430317637632/6qPl4MTS_200x200.jpg","metrics":{"views":141604,"likes":774,"reposts":220,"replies":71},"lang":"en","textJa":"Claudeにモーションデザインがどれくらい得意か聞いてみた。\n\n数時間後、完成したローンチ動画が届いた。\n\nモーションデザイン向けのHiggsfield Katanaが、Higgsfield MCP経由でClaudeで使えるようになった。"},{"id":"2110446630948180353","author":"Google","handle":"Google","text":"We used Gemini 4 Argon in @GoogleAIStudio to build an interactive 3D island sandbox 🏝️\n\nEvery brush stroke simulates living terrain, sand, and water physics in real time using custom Three.js and GLSL shaders.","url":"https://x.com/Google/status/2110446630948180353","createdAt":"2026-10-15T04:04:21+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110446569027670017/img/F0bqArTKEXRyYudG.jpg","avatar":"https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_200x200.jpg","metrics":{"views":112450,"likes":701,"reposts":55,"replies":45},"lang":"en","textJa":"@GoogleAIStudio でGemini 4 Argonを使って、インタラクティブな3Dの島のサンドボックスを作った 🏝️\n\nブラシでなぞるたびに、独自のThree.jsとGLSLシェーダーで、生きた地形・砂・水の物理がリアルタイムにシミュレーションされる。"},{"id":"2110455342496985379","author":"Mika","handle":"mika_systems","text":"Grok Bot gets a lot more f*cking useful when it can run Codex and talk to your other agents\n\nMichael Gannotti (ex-Microsoft Principal AI Solutions Engineer) documented two Grok agents handling coding and review: eight PRs merged in roughly two days, including a fix for a bug that could send local-only requests to a public server\n\nthat workflow is one of eight repos for giving your agents more ways to work, communicate and return results you can inspect\n\n01 Prime Directive → two importable bot templates: one writes code and tests, the other reviews the changes and asks you before merging\nhttps://github.com/smfworks/prime-directive\n\n02 Grok Codex Gateway → lets Grok Bot delegate work to Codex on your Mac, retrieve the results and continue the same coding session\nhttps://github.com/GMusliaj/grok-codex-gateway\n\n03 AgentPeerChat → gives Grok Bot, Dots and Muse private chats, group conversations and persistent inboxes on infrastructure you control\nhttps://github.com/AgenticsWorks/AgentPeerChat\n\n04 grokbot-jev-skills → ten skills for handing search filtering, email sorting, context selection and notification decisions to Jev\nhttps://github.com/fal3/grokbot-jev-skills\n\n05 grokbot-desk → turns a bot's request for your decision into a desktop window, then returns your answer so it can continue\nhttps://github.com/realspqrk/grokbot-desk\n\n06 Grok Bot Telegram Bridge → connects your bot to Telegram groups and DMs, with progress replies and optional conversation mirroring into Grok Bot\nhttps://github.com/eladb/grokbot-telegram-bridge\n\n07 anatomy-grok-bot → packages a skill for building interactive technical diagrams as HTML or SVG, with eight examples and browser verification scripts\nhttps://github.com/plgonzalezrx8/anatomy-grok-bot\n\n08 Grok Gadgets → connects Grok Bot to a small Wi-Fi OLED device through your own gateway, with a simulator to try before buying hardware\nhttps://github.com/adidshaft/grok-gadgets\n\nyou can start with a specific job:\n\n\u003e review a local repo through Codex\n\u003e let two agents discuss a proposal\n\u003e bring an approval request onto your desktop\n\u003e return an interactive diagram you can open and explore\n\nfull Grok Bot second brain setup below","url":"https://x.com/mika_systems/status/2110455342496985379","createdAt":"2026-10-15T04:38:58+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110453265083088896/img/tS1LhCi9UEUTpXOt.jpg","avatar":"https://pbs.twimg.com/profile_images/2098763236837654529/OxjAF8qe_200x200.jpg","metrics":{"views":2243,"likes":47,"reposts":7,"replies":16},"lang":"en","textJa":"Grok Botは、Codexを動かしたり他のエージェントと話せたりすると、めちゃくちゃ便利になる\n\nMichael Gannotti氏（元MicrosoftのプリンシパルAIソリューションエンジニア）は、2体のGrokエージェントにコーディングとレビューを任せた記録を公開した。約2日で8件のPRをマージし、その中にはローカル専用のリクエストを公開サーバーに送ってしまうバグの修正も含まれる\n\nこのワークフローは、エージェントの働き方、やり取り、確認できる結果の返し方を増やす8つのリポジトリのうちの1つ\n\n01 Prime Directive → インポートできる2つのボットテンプレート。1つはコードとテストを書き、もう1つが変更をレビューしてマージ前にあなたに確認する\nhttps://github.com/smfworks/prime-directive\n\n02 Grok Codex Gateway → Grok BotがMac上のCodexに作業を任せ、結果を受け取って同じコーディングセッションを続けられる\nhttps://github.com/GMusliaj/grok-codex-gateway\n\n03 AgentPeerChat → 自分で管理するインフラ上で、Grok Bot、Dots、Museに個別チャット、グループ会話、永続的な受信箱を与える\nhttps://github.com/AgenticsWorks/AgentPeerChat\n\n04 grokbot-jev-skills → 検索の絞り込み、メールの仕分け、コンテキストの選択、通知の判断をJevに任せる10個のスキル\nhttps://github.com/fal3/grokbot-jev-skills\n\n05 grokbot-desk → ボットからの判断依頼をデスクトップのウィンドウにし、あなたの答えを返して作業を続けさせる\nhttps://github.com/realspqrk/grokbot-desk\n\n06 Grok Bot Telegram Bridge → ボットをTelegramのグループやDMにつなぎ、進捗の返信や、Grok Botへの会話のミラーリング（任意）もできる\nhttps://github.com/eladb/grokbot-telegram-bridge\n\n07 anatomy-grok-bot → インタラクティブな技術図をHTMLやSVGで作るスキルをパッケージ化。8つの例とブラウザ検証スクリプト付き\nhttps://github.com/plgonzalezrx8/anatomy-grok-bot\n\n08 Grok Gadgets → 自分のゲートウェイ経由でGrok Botを小さなWi-Fi OLEDデバイスにつなぐ。ハードを買う前に試せるシミュレーター付き\nhttps://github.com/adidshaft/grok-gadgets\n\n具体的な作業から始められる：\n\n\u003e Codex経由でローカルのリポジトリをレビュー\n\u003e 2体のエージェントに提案を議論させる\n\u003e 承認依頼をデスクトップに出す\n\u003e 開いて操作できるインタラクティブな図を返す\n\nGrok Botの「第二の脳」セットアップ全体は下に"},{"id":"2110359895518085317","author":"S 🫧","handle":"He1s_Sammy","text":"THIS IS FUCKING INCREDIBLE\n\nA SOLO DEVELOPER JUST OPEN-SOURCED A FREE ALTERNATIVE TO ELEVENLABS THAT RUNS LOCALLY ON YOUR COMPUTER.\n\nThe GitHub repo has already reached 19.4K stars.\n\nHere’s what it can do:\n\n→ Clone voices from reference audio\n→ Dub videos into 646 languages\n→ Generate audiobooks and voiceovers\n→ Handle dictation and transcription\n→ Choose from 14 different text-to-speech engines\n\nFor comparison, ElevenLabs supports far fewer languages.\n\nAnd the biggest advantage?\n\n→ No per-character fees\n→ No usage limits imposed by a subscription\n→ Audio can stay entirely on your own machine\n\nYou get a full suite of voice and audio tools without depending on a paid cloud service.\n\nIf you’re creating content, building AI workflows, or working with voiceovers, this is worth checking out.\n\nBookmark this for later.\n\nRepo below.","url":"https://x.com/He1s_Sammy/status/2110359895518085317","createdAt":"2026-10-14T22:19:42+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110359854640467968/img/x2xXWrP5Tjj-TIIi.jpg","avatar":"https://pbs.twimg.com/profile_images/2090810578172305408/g0_Zl0tm_200x200.jpg","metrics":{"views":8459,"likes":170,"reposts":27,"replies":10},"lang":"en","textJa":"これはとんでもなくすごい\n\n個人開発者が、ElevenLabsの無料代替をオープンソースで公開した。自分のPCでローカルに動く。\n\nGitHubリポジトリはすでに1.94万スター。\n\nできること：\n\n→ 参照音声から声をクローン\n→ 動画を646言語に吹き替え\n→ オーディオブックやナレーションを生成\n→ 音声入力と文字起こし\n→ 14種類の音声合成エンジンから選べる\n\n比べると、ElevenLabsの対応言語はずっと少ない。\n\n最大の利点は？\n\n→ 文字数ごとの料金なし\n→ サブスクによる利用制限なし\n→ 音声を完全に自分のマシン内に置いておける\n\n有料クラウドサービスに頼らずに、音声ツール一式が手に入る。\n\nコンテンツ制作、AIワークフロー構築、ナレーションの仕事をしているなら、見ておく価値がある。\n\n後で見るためにブックマークを。\n\nリポジトリは下に。"},{"id":"2110389625277813212","author":"Aravind Srinivas","handle":"AravSrinivas","text":"Users are reverse engineering and porting software across platforms with Perplexity Computer. This user's mechanical keyboard app was Windows only, with no Linux support and no documentation. Computer downloaded the binary in its cloud sandbox, decompiled it with headless Ghidra, and ported it to a native Rust app for Linux.\n\nComputer read the decompiled code to learn how the app drives the keyboard, then rebuilt it piece by piece, complete with keyboard lighting that syncs to music over PipeWire, a 3D view, key remapping, macros and profiles.\n\nhttps://www.reddit.com/r/GeminiAI/comments/1x4vvoi/my_mechanical_keyboards_software_only_runs_on/\n\nhttps://github.com/trenbolone1122/aula-f75-linux","url":"https://x.com/AravSrinivas/status/2110389625277813212","createdAt":"2026-10-15T00:17:50+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110389513319297024/img/xmh35X4wWe8xKAzq.jpg","avatar":"https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__200x200.jpg","metrics":{"views":44444,"likes":791,"reposts":40,"replies":71},"lang":"en","textJa":"ユーザーがPerplexity Computerで、ソフトのリバースエンジニアリングや別プラットフォームへの移植をしている。このユーザーのメカニカルキーボード用アプリはWindows専用で、Linux対応もドキュメントもなかった。Computerはクラウドのサンドボックスでバイナリをダウンロードし、ヘッドレスのGhidraで逆コンパイルして、Linux向けのネイティブRustアプリに移植した。\n\nComputerは逆コンパイルしたコードを読んでアプリがキーボードをどう制御しているかを学び、1つずつ作り直した。PipeWire経由で音楽に同期するキーボードのライティング、3D表示、キーの割り当て変更、マクロ、プロファイルまで備えている。\n\nhttps://www.reddit.com/r/GeminiAI/comments/1x4vvoi/my_mechanical_keyboards_software_only_runs_on/\n\nhttps://github.com/trenbolone1122/aula-f75-linux"},{"id":"2110443092855980177","author":"Shann³","handle":"shannholmberg","text":"how to add a decision model to your AI workflow\n\n1,000 yes/no decisions can cost around:\n\n~$10 on GPT-6 Astra\n~$4 on Claude Opus 5.5\n~$0.04 on JEV\n\nuse language models for planning, writing and coding, and decision models for decisions\n\na decision model can:\n\n\u003e check your agent’s output before it ships\n\u003e approve a draft or request revisions\n\u003e route a task to the right agent or tool\n\u003e classify leads, tickets or comments\n\u003e score fit, quality or priority\n\u003e check whether content follows your brand rules\n\u003e pick an option from a shortlist\n\u003e decide whether to continue, stop or request a review\n\nat a much faster speed as well than any regular LLM\n\nhere’s how to add one\n\n1. find the decisions in your workflow\n\nlook for repeated steps that need a choice, classification or score\n\nstart with one decision you can compare against examples you’ve already reviewed\n\n2. define the question and allowed answers\n\ngive the model the information and references it needs\n\nfor a content workflow, that could include your draft, voice DNA file, anti slop rules and approved examples\n\nask it to return a choice such as approve, revise or human review\n\n3. connect the answer to an action\n\nyour software uses that answer to decide what happens next\n\napproved drafts move to your review queue, revision requests return to the writing agent, and uncertain cases go to you\n\n4. test before letting it act\n\ncompare its answers with your reviewed examples\n\nif it returns confidence scores, check whether those scores match how often it gets the decision right\n\nstart with actions you can easily reverse\n\n5. put simple checks first\n\nuse code for fixed rules, such as required fields and character limits\n\nthen use the decision model for checks that need context, before starting more expensive work\n\n6. track quality and cost\n\nmeasure cost per completed task, incorrect decisions and how often another model or a person needs to review\n\nuse the failures to improve your questions, references and allowed answers","url":"https://x.com/shannholmberg/status/2110443092855980177","createdAt":"2026-10-15T03:50:18+09:00","media":"https://pbs.twimg.com/media/HUnMzuZaQAAmB4R.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2018272759122440192/JJPUdPDs_200x200.jpg","metrics":{"views":3754,"likes":88,"reposts":5,"replies":15},"lang":"en","textJa":"AIワークフローに「判断モデル」を加える方法\n\nYes/Noの判断1,000回にかかるコストはおよそ：\n\nGPT-6 Astraで約10ドル\nClaude Opus 5.5で約4ドル\nJEVで約0.04ドル\n\n計画、文章、コーディングには言語モデルを、判断には判断モデルを使おう\n\n判断モデルができること：\n\n\u003e エージェントの出力を公開前にチェック\n\u003e 下書きを承認するか修正を依頼する\n\u003e タスクを適切なエージェントやツールに振り分ける\n\u003e リード、チケット、コメントを分類する\n\u003e 適合度、品質、優先度を採点する\n\u003e コンテンツがブランドのルールに沿っているか確認する\n\u003e 候補の中から1つ選ぶ\n\u003e 続けるか、止めるか、レビューを求めるかを決める\n\nしかも普通のLLMよりずっと速い\n\n加え方はこう\n\n1. ワークフローの中の判断を見つける\n\n選択、分類、採点が必要な繰り返しの手順を探す\n\nまずは、すでにレビュー済みの例と比べられる判断を1つから始める\n\n2. 質問と許される答えを定義する\n\n必要な情報と参考資料をモデルに渡す\n\nコンテンツのワークフローなら、下書き、文体の指針ファイル、AIっぽさを避けるルール、承認済みの例など\n\n承認、修正、人によるレビューといった選択肢で答えさせる\n\n3. 答えをアクションにつなぐ\n\nソフトウェアがその答えで次に何をするかを決める\n\n承認された下書きはレビュー待ちへ、修正依頼は執筆エージェントへ戻し、判断に迷うものはあなたに回す\n\n4. 任せる前にテストする\n\nレビュー済みの例と答えを比べる\n\n確信度スコアを返すなら、そのスコアが実際の正答率と合っているか確認する\n\n簡単に取り消せるアクションから始める\n\n5. 単純なチェックを先に置く\n\n必須項目や文字数制限など固定のルールはコードで\n\nそのうえで、文脈が必要なチェックに判断モデルを使い、そのあとで高コストな処理を始める\n\n6. 品質とコストを追う\n\n完了タスクあたりのコスト、誤った判断、別のモデルや人のレビューが必要になる頻度を測る\n\n失敗をもとに、質問、参考資料、許される答えを改善する"},{"id":"2110381595257626943","author":"Sakana AI","handle":"SakanaAILabs","text":"Sakana Chatに新機能を追加。会話で育ったメモリーが、見えるようになりました。\n\nhttps://sakana.ai/my-fish/\n\n新機能「My Fish」で、覚えていることを一覧に。履歴をタイムラインに。メモリー同士のつながりをマップに。Sakana Chatがあなたについて学んだことを、見てみてください。\n\nTry Chat: https://chat.sakana.ai/ 🐟","url":"https://x.com/SakanaAILabs/status/2110381595257626943","createdAt":"2026-10-14T23:45:55+09:00","media":"https://pbs.twimg.com/tweet_video_thumb/HUmUm-zasAAihOd.jpg","avatar":"https://pbs.twimg.com/profile_images/1885939209388929024/dtnrOdGp_200x200.jpg","metrics":{"views":18396,"likes":369,"reposts":65,"replies":8},"lang":"ja"},{"id":"2110196150712304013","author":"春日部彼得","handle":"crbpite8","text":"我给Grok机器人52美元和一条简单规则：只要连着亏两次，就换掉正在跟单的交易员。\n\n24小时之后，账户变成4939美元。\n\n最先被它解雇的，就是这周排行榜第一名的交易员。连续两笔亏损，也就亏了1.04美元。\n\n我把Grok机器人的FOMO跟单交给Dawn，让机器人自己挑选跟单对象。它会在每周靠前的交易者里面选人，Dawn按0.25倍资金跟着下单，对方卖出，这边马上平仓。\n\n我全程不动手，就看着机器人挑选交易员，不行就换掉。\n\n- 00:00，雇佣ape_vasco，当周#1\n- 05:16，连续两次亏损，解雇。钱包余额73美元\n- 05:16，雇佣moonpie_max，#3\n- 13:55，连续两次亏损，解雇。钱包余额520美元\n- 13:55，雇佣lunadegen，#2。到午夜时钱包余额达到4939美元\n\nFomo跟单机器人Dawn：https://t.me/DawnTradeBot?start=ref-dawn888\n\n实话实说。没有这个机器人，我大概率会一直跟着第一名，毕竟他这周表现最好。\n\n当周#1，只把52美元做到73美元。\n\n后面选的#2交易员，直接把账户从520美元做到4939美元。抓到两笔不错的机会，行情末尾分两次卖出，分别拿到771美元和837美元。\n\n两次更换交易员，总共亏损不到12美元。赚钱不靠单纯跟单。找个厉害的人跟单不难，很多人都会。最难的是，行情要从盈利转亏损的时候，果断离场。\n\n总共48笔跟单交易，36笔盈利。0.25倍仓位，同步跟着对方卖出，12笔亏损都很小，没有一笔大额亏掉本金。\n\n第24小时。lunadegen还在被跟单，机器人持续统计他的连续亏损情况。","url":"https://x.com/crbpite8/status/2110196150712304013","createdAt":"2026-10-14T11:29:02+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110195518035120128/img/Xn2xlXwT3fUOJKoQ.jpg","avatar":"https://pbs.twimg.com/profile_images/2049079467612758016/yj62yMBP_200x200.jpg","metrics":{"views":597878,"likes":2937,"reposts":235,"replies":161},"lang":"zh","textJa":"Grokボットに52ドルと1つの単純なルールを渡した：2回連続で負けたら、コピートレード中のトレーダーを替える。\n\n24時間後、口座は4939ドルになった。\n\n最初にクビになったのは、今週のランキング1位のトレーダー。2連敗といっても、損失は1.04ドルだけ。\n\nGrokボットのFOMOコピートレードをDawnに任せ、ボット自身にコピー相手を選ばせた。週の上位トレーダーから選び、Dawnが0.25倍の資金で追随して注文し、相手が売ればこちらもすぐ決済する。\n\n私は一切手を出さず、ボットがトレーダーを選び、ダメなら替えるのを見ていただけ。\n\n- 00:00、当週1位のape_vascoを雇用\n- 05:16、2連敗で解雇。ウォレット残高73ドル\n- 05:16、3位のmoonpie_maxを雇用\n- 13:55、2連敗で解雇。ウォレット残高520ドル\n- 13:55、2位のlunadegenを雇用。深夜0時にはウォレット残高4939ドル\n\nFOMOコピートレードボットDawn：https://t.me/DawnTradeBot?start=ref-dawn888\n\n正直に言うと、このボットがなければ、たぶんずっと1位を追っていた。今週一番成績が良かったから。\n\n当週1位は52ドルを73ドルにしただけ。\n\nその後選んだ2位のトレーダーは、口座を520ドルから4939ドルにした。良いチャンスを2回つかみ、相場の終盤で2回に分けて売り、771ドルと837ドルを得た。\n\n2回のトレーダー交代での損失は合計12ドル未満。儲けは単なるコピートレードからは来ない。すごい人を見つけて追うのは難しくないし、多くの人ができる。一番難しいのは、相場が利益から損失に転じるときにきっぱり降りること。\n\nコピートレードは合計48回、うち36回が利益。0.25倍のポジションで相手の売りに同期し、12回の負けはどれも小さく、元本を大きく失ったものは1つもない。\n\n24時間目。lunadegenはまだコピー中で、ボットは彼の連敗状況を引き続き集計している。"},{"id":"2110335300035899691","author":"周览资源","handle":"grgerwcwetwet","text":"GitHub 狂揽 3.4K Star！有人把 AI 写小说这件事，直接做成了流水线！\n\n推荐一个开源 Skill：chinese-novelist-skill，专门帮你用 AI 创作中文长篇小说。\n\n最狠的是，它不只是帮你写几段文字，而是能规划并生成 10～50章完整小说！\n\n从题材选择、人物设定、故事大纲，到章节创作、剧情衔接、悬念设计，全流程自动化。\n\n还支持创作记忆、中断续写、多 Agent 并行写作、自动检查和修改。\n\n每章目标3000～5000字，开头抓人，结尾留钩子。\n\n以前写小说最难的是坚持更新，现在连大纲、码字、检查都能交给 AI 辅助完成。\n\n想写网文、短剧故事、AI 小说的，建议收藏！\n\nGitHub： ⁠https://github.com/PenglongHuang/chinese-novelist-skill","url":"https://x.com/grgerwcwetwet/status/2110335300035899691","createdAt":"2026-10-14T20:41:58+09:00","media":"https://pbs.twimg.com/media/HUlqvtqbIAAi6RG.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1931895513668005888/57loyi5J_200x200.jpg","metrics":{"views":18869,"likes":374,"reposts":76,"replies":5},"lang":"zh","textJa":"GitHubで3.4Kスター！AIで小説を書くことを、そのままパイプラインにした人がいる！\n\nおすすめのオープンソースSkill：chinese-novelist-skill。AIで中国語の長編小説を書くためのもの。\n\n一番すごいのは、数段落を書くだけでなく、10〜50章の完結した小説を計画・生成できること！\n\nジャンル選び、人物設定、あらすじから、各章の執筆、話のつなぎ、伏線づくりまで、全工程を自動化。\n\n執筆の記憶、中断からの再開、複数エージェントでの並行執筆、自動チェックと修正にも対応。\n\n各章の目標は3000〜5000字で、冒頭で引き込み、最後に引きを残す。\n\n以前は小説で一番難しいのは更新を続けることだったが、今はあらすじ、執筆、チェックまでAIに手伝ってもらえる。\n\nWeb小説、ショートドラマの物語、AI小説を書きたい人は保存推奨！\n\nGitHub： ⁠https://github.com/PenglongHuang/chinese-novelist-skill"},{"id":"2110490535982944299","author":"Nix0n","handle":"UnTalNixon_exe","text":"Un APK es el archivo de la app de Android. Alguien empaquetó el trabajo de abrirlo en un skill para que lo haga el agente.\n\nSe llama apk-reverse. Lo cargas en Claude Code o Codex y el agente descompila, mira el dex, puede quitar anuncios, reempaquetar y depurar en runtime. El comando es npx skills add newliver666/apk-reverse.\n\n4.300 estrellas. MIT. Sirve en cualquier agente que lea el formato de skills.\n\nEl tuit de las 170 mil lo vende como \"arma el APK modificado del juego\". El README dice otra cosa: aprendizaje, investigación y pruebas autorizadas, en apps que son tuyas o donde tengas permiso. Sin garantía. Tú respondes por la legalidad.\n\nModificar un juego de otro y repartirlo es copyright. Instalar un APK parcheado de un desconocido es cómo entran los drainers.\n\nTú lo usarías para auditar tu propia app o para quitarle los anuncios a la de otro?\n\nLink de la magia la consigues en los comentarios","url":"https://x.com/UnTalNixon_exe/status/2110490535982944299","createdAt":"2026-10-15T06:58:49+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110490485882064896/img/0EgP1N0i8SO96cQL.jpg","avatar":"https://pbs.twimg.com/profile_images/2091858071756705792/YrQrCWsf_200x200.jpg","metrics":{"views":726,"likes":31,"reposts":3,"replies":3},"lang":"es","textJa":"APKはAndroidアプリのファイルだ。それを開く作業をスキルにまとめて、エージェントにやらせられるようにした人がいる。\n\n名前はapk-reverse。Claude CodeやCodexに読み込むと、エージェントが逆コンパイルし、dexを調べ、広告を外したり、再パッケージやランタイムでのデバッグもできる。コマンドは npx skills add newliver666/apk-reverse。\n\n4,300スター。MITライセンス。スキル形式を読めるどのエージェントでも使える。\n\n17万回見られたツイートは「ゲームの改造APKを作れる」と売り込んでいる。でもREADMEは別のことを言っている：学習、研究、許可されたテスト用で、自分のアプリか許可を得たアプリに限る。保証なし。合法性は自己責任。\n\n他人のゲームを改造して配るのは著作権侵害だ。知らない人がパッチを当てたAPKを入れるのは、ウォレットを抜き取るマルウェアが入り込む典型的な経路だ。\n\nあなたなら自分のアプリの監査に使う？それとも他人のアプリの広告外しに使う？\n\nリンクはコメント欄に"},{"id":"2110182967767421406","author":"AIの空白","handle":"AInokuhaku","text":"Chat GPTで１億円稼いだ友人の稼ぎ方聞いたけど、やってること地味すぎて逆に説得力あるわ…。","url":"https://x.com/AInokuhaku/status/2110182967767421406","createdAt":"2026-10-14T10:36:39+09:00","media":"https://pbs.twimg.com/media/HUjgOVXbsAAUKJH.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1876618400862236673/94gi-woq_200x200.jpg","metrics":{"views":51930,"likes":675,"reposts":44,"replies":2},"lang":"ja"}]}]}</script>

 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
