<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status wimg.com/media/HT4EcJJbwAEyIrV?format=jpg\u0026name=small","metrics":{"views":90146,"likes":2579}},{"id":"2110045740563152935","author":"sarpstar","handle":"sarpstar","text":"Opus 5.5で作られたビデオを見て「これを作らせるために何を書いたんだろう？」と思っているなら、このサイトを見てみてください。","url":"https://x.com/sarpstar/status/2110045740563152935","metrics":{"views":30985,"likes":333}},{"id":"2109965461878382697","author":"赖嘉伟Gary","handle":"lai_jia_wei","text":"cursor-grokbot-agents 拡張機能をインストールすると、ローカルの claude code、codex が grok bot とお互いにメッセージを送り合えるようになります。\n\n一方はあなたを最も理解するローカル Agent、もう一方はすべてを徐々に掌握するスーパーアシスタント、最高に快適です。","url":"https://x.com/lai_jia_wei/status/2109965461878382697","metrics":{"views":26046,"likes":256}},{"id":"2109965800824078419","author":"Alba","handle":"albacnt","text":"これは狂気だ\n\nGitHubのプロジェクトで、シンプルなアイデアをソーシャルメディアに投稿できる短い動画に変換するもの。\n\nMoneyPrinterTurboという名前で、GRATISでオープンソースだ。\n\n一番良いところ？ ほぼすべてのプロセスを自動化する。\n\nこんな仕組みだ：\n\n→ トピックやキーワードを入力。\n→","url":"https://x.com/albacnt/status/2109965800824078419","media":"https://pbs.twimg.com/media/HUgatNfWUAF-_9?format=jpg\u0026name=small","metrics":{"views":14132,"likes":182}},{"id":"2110132403226435844","author":"Ryu","handle":"_ryu15_","text":"dsh、キャッシュヒット率高すぎてついに99.6%まできた.......\n安すぎて使用量まじで減らんのでDeepSeek v4.1 flashとOpencode GoとDeepSeek Harnessは絶対にいれるべき","url":"https://x.com/_ryu15_/status/2110132403226435844","media":"https://pbs.twimg.com/media/HUixm32aoAAZ6EM?format=png\u0026name=360x360","metrics":{"views":15027,"likes":340}},{"id":"2110178851225841703","author":"月読いおり","handle":"tukiyomiiori","text":"Codexでメモリ機能をオンにしている人には必須級の設定だと思う。記憶すべき部分を判断抽出するモデルと、記憶を整理統合するモデルを、ユーザーが決めるとこができる。\n\nそれぞれ速度とコストと能力の考える必要があるが、高いに越したことはない。\n\nちなみに、私はメモリ機能は使いません。信じない","url":"https://x.com/tukiyomiiori/status/2110178851225841703","media":"https://pbs.twimg.com/media/HUhG0-AWgAAZJ3c?format=jpg\u0026name=small","metrics":{"views":6382,"likes":59}},{"id":"2109958757891346459","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"15 GitHub repos that turn Opus 5.5 into a full <script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));

  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
