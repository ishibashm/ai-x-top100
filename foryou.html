<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

kshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-17T08:35:31+09:00","posts":[{"id":"2111110263437189507","author":"Vivi","handle":"vivistac","text":"En lugar de ver Netflix este domingo, dedica 1 hora a esto.\n\nUn CURSO COMPLETO de Claude que te enseña a automatizar lo que te roba 3 horas al día. \n\nEl lunes lo agradecerás.","url":"https://x.com/vivistac/status/2111110263437189507","createdAt":"2026-10-17T00:01:23+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111109760233742336/img/VGdMu8Onm6VTDq8i.jpg","avatar":"https://pbs.twimg.com/profile_images/2100188645806272512/8bCIoX6W_200x200.jpg","metrics":{"views":25467,"likes":377,"reposts":44,"replies":23},"lang":"es","textJa":"この日曜はNetflixを見る代わりに、これに1時間使ってほしい。\n\n1日3時間を奪っている作業を自動化する方法を教えてくれる、Claudeの完全講座だ。\n\n月曜にきっと感謝するはず。"},{"id":"2111054497531220051","author":"z","handle":"zaynmcps","text":"GOOGLE ACABA DE LANZAR LA HERRAMIENTA QUE LOS DESARROLLADORES LLEVAN AÑOS PIDIENDO\n\nse llama CodeWiki\n\npegas cualquier repositorio y la IA lo convierte en documentación interactiva\n\ny va mucho más allá de un resumen:\n\n→ crea diagramas por su cuenta\n→ explica qué hace cada parte\n→ prepara tutoriales paso a paso\n→ saca la arquitectura y las dependencias\n→ y te monta un chatbot que entiende todo tu código\n\n¿ese repo que nadie del equipo se atreve a tocar? ahora cualquiera se maneja en él en minutos\n\nenlace abajo 👇","url":"https://x.com/zaynmcps/status/2111054497531220051","createdAt":"2026-10-16T20:19:48+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111054347614253056/img/kOyTePcoYhi0g-EK.jpg","avatar":"https://pbs.twimg.com/profile_images/2095627784727240704/BRMRULJc_200x200.jpg","metrics":{"views":1833,"likes":26,"reposts":4,"replies":11},"lang":"es","textJa":"Googleが、開発者が何年も待ち望んでいたツールをついに公開した\n\nその名はCodeWiki\n\nどんなリポジトリでも貼り付ければ、AIがインタラクティブなドキュメントに変えてくれる\n\nしかも単なる要約にとどまらない：\n\n→ 図を自動で作る\n→ 各部分が何をしているか説明する\n→ ステップごとのチュートリアルを用意する\n→ アーキテクチャと依存関係を抜き出す\n→ コード全体を理解したチャットボットまで作ってくれる\n\nチームの誰も触りたがらないあのリポジトリも、これからは誰でも数分で扱えるようになる\n\nリンクは下に👇"},{"id":"2111218844652208180","author":"🍺 イケハヤ@放置ゲー「月蝕綺譚」開発","handle":"IHayato","text":"Claude Code課金してる人は、この枠使わないとマジでもったいないんですよね。\n\n今月からAPI利用枠が、毎月付与されてます。\n\nMax 200プランなら、なんと200ドル分が実質無料！うちはこれでAIチャット動かしてます。\n\n見落としてる人多そうなのでブログにしました。\nhttps://vibe.co.jp/rondo/blog/max-api-credit/","url":"https://x.com/IHayato/status/2111218844652208180","createdAt":"2026-10-17T07:12:51+09:00","avatar":"https://pbs.twimg.com/profile_images/1613769723065532416/FMH_NlQh_200x200.png","metrics":{"views":5280,"likes":88,"reposts":3,"replies":0},"lang":"ja"},{"id":"2110906781409182063","author":"Sadao Tokuyama","handle":"tokufxug","text":"Chums：Apple WatchでAIコーディングエージェントを操作 ⌚🤖\n\n🔹Mac上のClaude CodeやCodexに、時計やiPhoneから音声で指示\n🔹作業状況をキャラクターの動きで表示。実行許可・拒否も操作\n🔹無料・オープンソース。新たなAI契約やアカウントは不要\n\nMicrosoftのLucas Couto氏が開発。情報元はリプ欄。","url":"https://x.com/tokufxug/status/2110906781409182063","createdAt":"2026-10-16T10:32:50+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110906607798534144/img/5FaPb309E72x9pl0.jpg","avatar":"https://pbs.twimg.com/profile_images/1614135119597686784/8APrdHkh_200x200.png","metrics":{"views":3458,"likes":43,"reposts":3,"replies":3},"lang":"ja"},{"id":"2110883952219271564","author":"あっきー｜AIを現場に落とす人","handle":"Akki_AI7","text":"どっちか契約してる人は読んだ方がいいです。やらないともったいない。","url":"https://x.com/Akki_AI7/status/2110883952219271564","createdAt":"2026-10-16T09:02:07+09:00","avatar":"https://pbs.twimg.com/profile_images/2079147873506406400/4JAwvaDB_200x200.jpg","metrics":{"views":90808,"likes":597,"reposts":36,"replies":2},"lang":"ja"},{"id":"2110974288526545301","author":"돈벌고영","handle":"Dontgiveup_26","text":"AI로 영상 만들거나 준비하는 사람들 필독.\n\n요즘 AI로 블렌더 돌려서 영상 자동화 시도하려는 사람들 많은 거 같은데, 나도 예전부터 준비하고 있었음. 그냥 \"만들어줘\"라고 요청하는 것보다 전환이나 화면 효과를 이해하고 있으면, 요청할 때나 만들 때 훨씬 퀄리티 높은 영상이 나옴.\n\n그리고 각 스킬을 컴포넌트로 만들어두면 요청할 때마다 새로 만들 필요 없이 바로바로 재사용해서 효율적으로 만들 수도 있음. 번호마다 전환 이름 쓰고, 그 아래에 AI한테 그대로 붙여넣으면 되는 프롬프트 달아둘 테니 저장해두고 두고두고 쓰시길.\n\n공통 문장 (맨 앞에)\n\u003e 블렌더 파이썬으로 전환을 transition(A, B, 시작, 길이, 옵션) 재사용 함수로 만들어줘. A·B는 따로 렌더해 컴포지터에서 합성하고 겹치는 동안 둘 다 움직이게. 크기는 화면 폭 비율, 컷은 정수 프레임, 프레임 번호만으로 똑같이 다시 렌더되게. 소리도 같은 시간표로.\n\n01. hard cut\n\u003e A에서 B로 중간 프레임 없이 바로 바뀌는 하드 컷을 만들어줘. 컷은 음악 박자나 동작의 정점 프레임에 두고, B는 샷 크기를 한 단계 이상 바꾸거나 각도를 30° 이상 틀어서 실수로 튄 것처럼 안 보이게. 소리도 같은 프레임에서 A→B로 바꾸되 클릭 안 나게 4ms 페이드해줘.\n\n02. cross dissolve\n\u003e A가 1.2초 동안 B로 서서히 겹쳐 바뀌는 크로스 디졸브를 만들어줘. 곡선은 smoothstep, A·B는 각자 색보정을 끝낸 그림끼리 섞고 겹치는 동안 둘 다 계속 움직이게. 배경음도 같은 구간에 equal-power 크로스페이드해줘. (시간이 흐르거나 장소가 바뀐 느낌을 줄 때)\n\n03. dip to black\n\u003e A가 0.4초 동안 검은 화면으로 사라지고, 완전히 검은 화면 0.15초, 0.4초 동안 B가 밝아지는 딥 투 블랙을 만들어줘. 곡선은 smoothstep, 컷은 검은 구간 안에서. 어두움은 색 변환(AgX/Filmic) 뒤에 곱해서 어두운 곳만 먼저 꺼지지 않게, 소리도 같은 곡선으로 내렸다 올려줘.\n\n04. flash cut\n\u003e A가 0.13초 만에 ease-in으로 완전히 하얘지고, 그 흰 화면 안에서 B로 컷, 0.45초 동안 ease-out으로 흰색이 빠지며 B가 드러나는 플래시 컷을 만들어줘. 흰색은 색 변환 뒤에 섞어야 진짜 흰색이 나옴(전에 섞으면 회색). 카메라 셔터 소리를 컷 0.05초 전에 넣어줘.\n\n05. smash cut\n\u003e A의 가장 시끄럽고 정신없는 순간(음악 절정, 카메라가 다가가며 흔들림)에서 조용하고 정적인 B로 바로 넘어가는 스매시 컷을 만들어줘. A의 소리는 리버브나 페이드 꼬리 없이 컷 프레임에서 뚝 끊고, B는 넓은 고정 샷에 0.2초 완전한 정적 뒤 귀뚜라미 한 마리 정도만.\n\n06. match cut\n\u003e A의 걷는 동작이 B에서 같은 화면 위치·크기, 같은 걸음 위상(같은 발)으로 이어지는 매치 컷을 만들어줘. 발이 바닥에 닿는 프레임에서 컷하고, 컷 프레임에 피사체를 화면에 투영해서 B 카메라를 맞춰줘. 카메라 속도와 조명 방향도 양쪽 같게, 발소리 리듬도 끊기지 않게.\n\n07. jump cut\n\u003e 카메라를 고정한 한 샷에서, 카메라 쪽으로 걸어오는 동작을 0.5초씩만 남기고 사이사이 2~3초를 잘라내 툭툭 가까워지는 점프 컷을 만들어줘. 바뀌는 건 피사체 위치와 걸음 위상뿐, 카메라와 조명(피사체를 따라가는 조명 포함)은 그대로. 배경음은 컷을 넘어 끊김 없이.\n\n08. whip pan\n\u003e A에서 카메라가 0.35초 동안 ease-in으로 오른쪽으로 휙 돌고, 가로 블러가 가장 센 순간(화면 폭의 25% 안팎) B로 컷, B는 같은 방향으로 돌다 ease-out으로 멈추는 휩 팬을 만들어줘. 카메라 모션 블러만으론 약하니 가로 블러를 더하고, 어두운 벽 쪽이 아닌 밝은 쪽으로 돌려줘.\n\n09. zoom through\n\u003e 피사체 속으로 빨려 들어가듯 초점거리를 2배로 줌인하면서, 피사체 화면 위치를 중심으로 그림을 ease-in으로 최대 7배 확대하고 방사형 블러를 거는 줌 스루를 만들어줘. 정점에서 2프레임 섬광과 함께 B로, B는 반대로 풀어줘. 중심은 매 프레임 world_to_camera_view로 투영.\n\n10. wipe\n\u003e 얇은 빛줄기가 붙은 세로 경계가 0.8초 동안 왼쪽에서 오른쪽으로 지나가며 B를 드러내는 와이프를 만들어줘. 경계는 부드러운 폭까지 화면 밖에서 시작해 화면 밖에서 끝나게, 방향·색·부드러움은 옵션. (응용: 걸어가는 피사체 바로 뒤를 따라가게 하면 새 장면을 끌고 오는 느낌)\n\n11. push slide\n\u003e B가 오른쪽에서 밀고 들어오며 A를 왼쪽으로 밀어내는 푸시 슬라이드를 0.6초 동안 smoothstep으로 만들어줘. A·B 경계는 섞지 말고, 가로 모션 블러는 속도에 비례해 가운데서 가장 세게(화면 폭의 10% 안팎). 피사체가 오른쪽으로 가는 장면이면 B가 오른쪽에서 들어오게.\n\n12. iris\n\u003e 피사체 얼굴을 중심으로 원형 마스크가 0.4초 동안 화면 높이 15% 크기까지 좁혀지고, 0.35초 멈췄다 0.15초 만에 완전히 닫힌 뒤, 검은 화면 0.15초, B의 피사체 위치에서 0.45초 동안 열리는 아이리스를 만들어줘. 중심은 매 프레임 투영해서, 16:9에서 타원 안 되게 보정.\n\n13. luma fade\n\u003e A의 밝은 부분부터 B로 녹아들고 어두운 부분은 마지막에 바뀌는 루마 페이드를 1.1초로 만들어줘. 밝기는 색 변환 뒤 값으로 재고, 어두운 장면은 게인을 올려 전환 시간 전체에 고르게. 게인·부드러움·방향은 옵션. (얼굴 클로즈업엔 비추. 밝은 피부만 먼저 빠져서 기괴해짐)\n\n14. object wipe\n\u003e 무언가가 렌즈 바로 앞을 지나가며 화면을 가리는 순간 B로 바뀌는 오브젝트 와이프를 만들어줘. 지나가는 물체는 Cryptomatte나 별도 뷰 레이어 알파로 A에 남기고, 그 뒤 배경만 물체의 화면 위치를 따라가는 경계 뒤쪽부터 B로. 렌즈 앞 물체가 까만 덩어리 안 되게 보조광도.\n\n15. blur transition\n\u003e A의 초점이 0.4초 동안 완전히 나갔다가(최대 반경 화면 폭 4%) 가장 흐릴 때 B로 바뀌고, 0.5초 동안 다시 맞는 블러 전환을 만들어줘. 정점에 노출 −15%와 비네트, 소리도 같은 곡선으로 로우패스(정점 600Hz쯤). 블러는 가우시안처럼 매끄럽게, 밝은 점이 고리로 안 남게.\n\n16. pixelate\n\u003e A가 작은 블록부터 화면 폭의 1/16까지 6단계로 3프레임마다 커지며 깨지고(0.6초), 가장 큰 블록에서 B로 바뀐 뒤 같은 계단으로 풀리는 픽셀화 전환을 만들어줘. 블록 격자는 화면에 고정, 블록 크기가 바뀔 때마다 칩튠 효과음 한 음씩, 커질 땐 음이 올라가고 작아질 땐 내려가게.\n\n17. glitch\n\u003e 평소엔 깨끗하다가 박자 바로 뒤 프레임마다 2프레임 글리치(가로 블록 어긋남, RGB 분리)가 점점 세게 튀고, 가장 큰 4프레임 글리치 동안 블록 단위로 B가 20→80% 들어온 뒤 약한 글리치 두 번으로 잦아드는 전환을 만들어줘. 소리는 글리치 프레임만 직전 한 프레임을 반복해서.\n\n18. VHS tape tear\n\u003e 화면 전체에 VHS 느낌(가로 색 번짐, 미세한 흔들림, 맨 아래 헤드 노이즈)을 은은하게 깔고, 컷 프레임에서 테이프가 찢기는 전환을 만들어줘. 화면이 높이 20%쯤 위로 튀고 가로줄이 옆으로 찢기며 검은 띠가 지나가게, 세기는 30→100→60→30%. 소리는 2프레임 끊김.\n\n19. static cut\n\u003e 채널 버튼 소리 → 0.2초 회색 노이즈 화면(매 프레임 새 노이즈, 밝기 35% 정도로 번쩍이지 않게) → 노이즈에 가려진 사이 컷 → B가 바로 깨끗하게 나오는 스태틱 컷을 만들어줘. 노이즈 동안 소리는 짧은 '치익'(무음 옵션), B 소리는 B 화면과 같은 프레임에 시작.\n\n20. light leak\n\u003e 왼쪽에서 따뜻한 주황빛 덩어리가 필름에 번지듯 1.2초 동안 화면을 쓸고 지나가는 라이트 리크를 만들어줘. 빛은 더하기·스크린으로 얹고 노이즈로 살짝 일렁이게, 가장 셀 때 그 빛에 가려 A→B를 0.3초 디졸브. 블룸은 살짝만, 피사체가 하얗게 날아가지 않게 세기 제한.\n\n21. film burn\n\u003e 필름이 타들어가듯 노이즈 모양 구멍이 자라고, 둘레는 먼저 갈색으로 그을리고 가장자리는 주황빛으로 빛나며, 그 구멍으로 B가 보이는 필름 번을 1초로 만들어줘. 시작 전 0.5초는 영사기처럼 노출이 매 프레임 ±4% 깜빡이게, 가장자리 빛은 과하지 않게.\n\n22. datamosh\n\u003e A의 마지막 프레임이 멈추고, B 카메라 팬이 그 픽셀을 블록(화면 폭 1/40) 단위로 끌고 가다 0.7초 동안 블록이 하나씩 B로 바뀌는 데이터모싱을 만들어줘. 끄는 양은 이전 프레임에 쌓지 말고 'B 카메라가 돈 각도 ÷ 가로 화각 × 화면 폭'으로 매 프레임 계산, 블록마다 ±30% 다르게.\n\n23. J-cut\n\u003e B의 소리가 B의 화면보다 0.8초 먼저 들어오는 J컷을 만들어줘. A 화면 위로 B의 음악·배경음이 먼저 시작되고(A 소리는 그때 줄이거나 끊고), B 박자에 맞춰 하드 컷. B 소리는 컷에서 다시 시작하지 않고 이어지며, B 화면은 이미 그 소리에 맞춰 진행 중이게.\n\n24. L-cut\n\u003e 화면은 B로 하드 컷됐는데 A의 소리(대사·음악)가 끊김 없이 0.8초 더 이어지다 끊기거나 페이드되는(옵션) L컷을 만들어줘. B의 배경음은 컷부터 0.8초 동안 그 아래에서 서서히 올라오게. (대사를 이어가거나 여운 남길 때)","url":"https://x.com/Dontgiveup_26/status/2110974288526545301","createdAt":"2026-10-16T15:01:05+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110970693282308096/img/fpxqlnYRUetHvg8W.jpg","avatar":"https://pbs.twimg.com/profile_images/2103696265615962112/SyLCBg7s_200x200.jpg","metrics":{"views":15691,"likes":436,"reposts":118,"replies":32},"lang":"ko","textJa":"AIで動画を作っている・作ろうとしている人は必読。\n\n最近、AIでBlenderを動かして動画を自動化しようとする人が多いみたいだけど、自分も前から準備していた。ただ「作って」と頼むより、トランジションや画面効果を理解しておくと、頼むときも作るときもずっと質の高い動画になる。\n\nそれに各スキルをコンポーネント化しておけば、毎回作り直さずにすぐ再利用できて効率的。番号ごとにトランジション名を書き、その下にAIへそのまま貼れるプロンプトを付けておくので、保存して使い回してほしい。\n\n共通文（先頭に付ける）\n\u003e Blender Pythonでトランジションを transition(A, B, 開始, 長さ, オプション) という再利用関数にして。A・Bは別々にレンダリングしてコンポジターで合成し、重なっている間は両方動き続けるように。サイズは画面幅比、カットは整数フレーム、フレーム番号だけで同じ結果を再レンダリングできるように。音も同じタイムテーブルで。\n\n01. hard cut\n\u003e AからBへ中間フレームなしで即座に切り替わるハードカットを作って。カットは音楽の拍か動きの頂点のフレームに置き、Bはショットサイズを1段階以上変えるか角度を30°以上変えて、うっかり飛んだように見えないように。音も同じフレームでA→Bに切り替え、クリックノイズが出ないよう4msフェードして。\n\n02. cross dissolve\n\u003e Aが1.2秒かけてBへ徐々に重なって変わるクロスディゾルブを作って。カーブはsmoothstep、A・Bはそれぞれ色補正を終えた絵同士で混ぜ、重なる間も両方動き続けるように。背景音も同じ区間でequal-powerクロスフェードして。（時間の経過や場所の移動を感じさせたいときに）\n\n03. dip to black\n\u003e Aが0.4秒で黒に消え、完全な黒が0.15秒、Bが0.4秒で明るくなるディップ・トゥ・ブラックを作って。カーブはsmoothstep、カットは黒の区間内で。暗さは色変換（AgX/Filmic）の後に掛けて暗部だけ先に潰れないように。音も同じカーブで下げて上げて。\n\n04. flash cut\n\u003e Aが0.13秒でease-inで真っ白になり、その白の中でBにカット、0.45秒でease-outで白が抜けてBが現れるフラッシュカットを作って。白は色変換の後に混ぜないと本当の白にならない（前だとグレーになる）。カットの0.05秒前にカメラのシャッター音を入れて。\n\n05. smash cut\n\u003e Aの最もうるさく慌ただしい瞬間（音楽のクライマックス、カメラが寄りながら揺れる）から、静かで静的なBへ一気に切り替えるスマッシュカットを作って。Aの音はリバーブやフェードの尾を残さずカットフレームでぶつっと切り、Bは引きの固定ショットで0.2秒の完全な無音の後、コオロギ1匹くらいの音だけ。\n\n06. match cut\n\u003e Aの歩く動きが、Bでも同じ画面位置・サイズ、同じ歩行の位相（同じ足）で続くマッチカットを作って。足が地面に着くフレームでカットし、カットフレームで被写体を画面に投影してBのカメラを合わせて。カメラ速度と照明の向きも両方そろえ、足音のリズムも途切れないように。\n\n07. jump cut\n\u003e カメラを固定した1ショットで、カメラに向かって歩いてくる動きを0.5秒ずつだけ残し、間の2〜3秒を切り取って、ぽんぽんと近づいてくるジャンプカットを作って。変わるのは被写体の位置と歩行の位相だけで、カメラと照明（被写体を追う照明も含む）はそのまま。背景音はカットをまたいで途切れないように。\n\n08. whip pan\n\u003e Aでカメラが0.35秒かけてease-inで右へ素早く振られ、横ブラーが最も強い瞬間（画面幅の25%前後）にBへカット、Bは同じ方向に振られながらease-outで止まるウィップパンを作って。カメラのモーションブラーだけでは弱いので横ブラーを足し、暗い壁側ではなく明るい側へ振って。\n\n09. zoom through\n\u003e 被写体に吸い込まれるように焦点距離を2倍にズームインしながら、被写体の画面位置を中心に絵をease-inで最大7倍に拡大し、放射状ブラーをかけるズームスルーを作って。頂点で2フレームの閃光とともにBへ、Bは逆にほどいて。中心は毎フレームworld_to_camera_viewで投影。\n\n10. wipe\n\u003e 細い光の筋が付いた縦の境界が0.8秒で左から右へ通り過ぎ、Bを見せていくワイプを作って。境界はぼかし幅ごと画面外から始まり画面外で終わるように、方向・色・ぼかしはオプション。（応用: 歩いていく被写体のすぐ後ろを追わせると、新しい場面を引き連れてくる感じになる）\n\n11. push slide\n\u003e Bが右から押し入ってAを左へ押し出すプッシュスライドを、0.6秒でsmoothstepで作って。A・Bの境界は混ぜず、横のモーションブラーは速度に比例して中央で最も強く（画面幅の10%前後）。被写体が右へ進む場面ならBは右から入るように。\n\n12. iris\n\u003e 被写体の顔を中心に円形マスクが0.4秒で画面高さの15%まで縮まり、0.35秒止まって0.15秒で完全に閉じ、黒が0.15秒、Bの被写体位置から0.45秒で開くアイリスを作って。中心は毎フレーム投影し、16:9で楕円にならないよう補正して。\n\n13. luma fade\n\u003e Aの明るい部分からBへ溶けていき、暗い部分は最後に変わるルマフェードを1.1秒で作って。明るさは色変換後の値で測り、暗い場面はゲインを上げて遷移時間全体に均等に。ゲイン・ぼかし・方向はオプション。（顔のクローズアップには不向き。明るい肌だけ先に抜けて不気味になる）\n\n14. object wipe\n\u003e 何かがレンズのすぐ前を横切って画面を覆う瞬間にBへ切り替わるオブジェクトワイプを作って。横切る物体はCryptomatteか別ビューレイヤーのアルファでAに残し、その後ろの背景だけを、物体の画面位置を追う境界の後ろ側からBに。レンズ前の物体が黒い塊にならないよう補助光も。\n\n15. blur transition\n\u003e Aのピントが0.4秒で完全に外れ（最大半径は画面幅の4%）、最もぼけたときにBへ変わり、0.5秒で再びピントが合うブラートランジションを作って。頂点で露出−15%とビネット、音も同じカーブでローパス（頂点で600Hzくらい）。ブラーはガウシアンのように滑らかに、明るい点がリング状に残らないように。\n\n16. pixelate\n\u003e Aが小さいブロックから画面幅の1/16まで6段階で3フレームごとに大きくなりながら崩れ（0.6秒）、最大ブロックでBに変わったあと同じ段階でほどけるピクセル化トランジションを作って。ブロックの格子は画面に固定、ブロックサイズが変わるたびにチップチューンの効果音を1音ずつ、大きくなるときは音が上がり小さくなるときは下がるように。\n\n17. glitch\n\u003e 普段はきれいなのに、拍の直後のフレームごとに2フレームのグリッチ（横ブロックのずれ、RGB分離）がだんだん強く跳ね、最大の4フレームのグリッチの間にブロック単位でBが20→80%入り、弱いグリッチ2回で収まるトランジションを作って。音はグリッチのフレームだけ直前の1フレームを繰り返して。\n\n18. VHS tape tear\n\u003e 画面全体にVHSっぽさ（横の色にじみ、微細な揺れ、最下部のヘッドノイズ）を薄く敷き、カットフレームでテープが裂けるトランジションを作って。画面が高さ20%ほど上に跳ね、横線が横に裂けて黒い帯が通り過ぎるように、強さは30→100→60→30%。音は2フレーム途切れ。\n\n19. static cut\n\u003e チャンネルボタンの音 → 0.2秒のグレーのノイズ画面（毎フレーム新しいノイズ、明るさ35%程度で眩しくしない） → ノイズに隠れている間にカット → Bがすぐきれいに映るスタティックカットを作って。ノイズ中の音は短い「ザーッ」（無音オプションあり）、Bの音はBの画面と同じフレームで始める。\n\n20. light leak\n\u003e 左から暖かいオレンジ色の光の塊がフィルムににじむように1.2秒で画面をなでていくライトリークを作って。光は加算・スクリーンで重ね、ノイズで少し揺らめかせ、最も強いときにその光に隠れてA→Bを0.3秒ディゾルブ。ブルームは控えめに、被写体が白飛びしないよう強さを制限。\n\n21. film burn\n\u003e フィルムが焼けていくようにノイズ形状の穴が広がり、周りはまず茶色に焦げ、縁はオレンジに光り、その穴からBが見えるフィルムバーンを1秒で作って。開始前の0.5秒は映写機のように露出を毎フレーム±4%ちらつかせ、縁の光は控えめに。\n\n22. datamosh\n\u003e Aの最後のフレームが止まり、Bのカメラのパンがそのピクセルをブロック（画面幅1/40）単位で引きずり、0.7秒でブロックが1つずつBに変わるデータモッシュを作って。引きずる量は前フレームに積み上げず「Bカメラが回った角度 ÷ 水平画角 × 画面幅」で毎フレーム計算し、ブロックごとに±30%ばらつかせて。\n\n23. J-cut\n\u003e Bの音がBの画面より0.8秒先に入るJカットを作って。Aの画面の上でBの音楽・背景音が先に始まり（Aの音はそのとき下げるか切る）、Bの拍に合わせてハードカット。Bの音はカットで頭からやり直さずに続き、Bの画面はすでにその音に合わせて進行しているように。\n\n24. L-cut\n\u003e 画面はBにハードカットされたのに、Aの音（台詞・音楽）が途切れず0.8秒続いてから切れるかフェードする（オプション）Lカットを作って。Bの背景音はカットから0.8秒かけてその下で徐々に上がってくるように。（台詞をつなぎたいときや余韻を残したいときに）"},{"id":"2111021507799650584","author":"Claude Code Research Lab","handle":"claudecode84","text":"Claude Codeの\n「ultracode」が強力すぎる。\n\n最大1,000個の\nAIエージェントを動かせる。\n\nただし、\n使い方を間違えると\n週間の使用制限が一瞬で消える。\n\n重要なのは、\n最初から大量のエージェントを\n動かさないこと。\n\n使用量を抑えて始める方法がこちら👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n① ultracodeは必要なタスクだけに使う\nセッション全体ではなく、特定のタスクに指定する。\n\n例：\nultracode: src/routes/の認証漏れを監査して\n\n② 実行前にモデルを確認する\n\n/model で現在のモデルを確認。\nすべての作業に高性能モデルを使う必要はない。単純な処理は軽量モデルに任せる。\n\n③ 最初は5エージェント未満で試す\n\n/config workflowSizeGuideline=small\n小規模なワークフローから始め、/workflows でトークン消費を確認する。\n\n④ 大量消費に注意する\n\n25エージェント超、\nまたは150万トークン以上\nが予測される大規模ワークフローでは、\n使用量に特に注意。\n\nultracode有効時には\n警告が表示されない場合がある。\n\nそのまま使える3つのプロンプト\n\n【セキュリティ監査】\n「src/routes/内のAPIエンドポイントを監査し、認証漏れを検出。発見した問題は報告前に再検証して」\n\n【TypeScript移行】\n「src/components/内のJavaScriptをTypeScriptに移行。各ファイルを独立して処理して」\n\n【エラー自動修正】\n「npx tsc --noEmitを実行し、型エラーを修正。すべて解消するか、2回連続で進展がなくなるまで続けて」\n\nさらに、\n成功したワークフローは\n保存して再利用できる。\n\n/workflows → 対象を選択 → s\n.claude/workflows/ に保存すれば、チームでも共有可能。\n\nそして、\n最初の実行前に必ずこれを\nClaude Codeへ貼り付けてほしい。\n\n大量のエージェントを動かすことより、\n必要なエージェントだけを\n動かすことが重要。\n\n使用制限を無駄にする前に、\nこの投稿を保存しておいて。 https://x.com/rvaniaaaa/status/2110674337233617278/video/1","url":"https://x.com/claudecode84/status/2111021507799650584","createdAt":"2026-10-16T18:08:42+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110674269713629184/img/kPd4cd_g2faHIH1W.jpg","avatar":"https://pbs.twimg.com/profile_images/2101586901669183488/jcpGEhJl_200x200.jpg","metrics":{"views":5276,"likes":23,"reposts":2,"replies":2},"lang":"ja"},{"id":"2111082230751826177","author":"そう｜Claude CodeのX運用で月800万インプ","handle":"so_ainsight","text":"Grok Bot x マイクロビジネス、えぐい。\n\n海外の個人による運用事例で、Alex FinnがbotにCEO役を渡し、事業案づくりからサイト運営まで組んだ実演を公開しました。\nhttps://x.com/AlexFinn/status/2110181971280433613/video/1\n\n・BuildStackを構築したとAlexが説明\n・日次運用と週次CEO報告をroutine化\n・送信・スポンサー連絡・支払いは人が承認\n\n「完全自律」という見出しより、任せる範囲の切り方が参考になる事例です👇","url":"https://x.com/so_ainsight/status/2111082230751826177","createdAt":"2026-10-16T22:10:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110181501480714241/img/Yekp0p5IQUjQ3ewL.jpg","avatar":"https://pbs.twimg.com/profile_images/1951625625455951872/pj57KIjJ_200x200.jpg","metrics":{"views":1063,"likes":3,"reposts":0,"replies":1},"lang":"ja"},{"id":"2111125001482936542","author":"beamnxw ./","handle":"beamnxw","text":"this is pure f*cking treasure\n\n10 GitHub repos with 542K+ combined stars to build your own solo motion design studio\n\none resource per step, from the first storyboard to the final MP4\n\n(1/10) Excalidraw\nturn the brief into a storyboard with a clear hook, scene order, and transitions\n▸http://github.com/excalidraw/excalidraw\n\n(2/10) Penpot\ndesign the style frames, layout, colors, and reusable components\n▸http://github.com/penpot/penpot\n\n(3/10) Fontsource\nbring in the fonts and set the type hierarchy for every scene\n▸http://github.com/fontsource/fontsource\n\n(4/10) Lucide\nbuild a consistent set of icons for the visuals\n▸http://github.com/lucide-icons/lucide\n\n(5/10) SVGO\nclean up the SVG assets while preserving the elements you need to animate\n▸http://github.com/svg/svgo\n\n(6/10) GSAP\nchoreograph the movement, easing, timing, and transitions\n▸http://github.com/greensock/GSAP\n\n(7/10) Three.js\nbuild the 3D scenes, camera moves, lighting, and depth\n▸http://github.com/mrdoob/three.js\n\n(8/10) Audacity\nedit the music and sound effects, then balance the mix\n▸http://github.com/audacity/audacity\n\n(9/10) Remotion\nassemble the scenes and audio into one video\n▸http://github.com/remotion-dev/remotion\n\n(10/10) FFmpeg\nencode the final delivery file and inspect its video and audio streams\n▸http://github.com/FFmpeg/FFmpeg\n\nthe loop:\n\nbrief → storyboard → visual system → typography → assets → motion → 3D → sound → assembly → export\n\nthen create your own motion design studio, which will be run by your AI employee ↓","url":"https://x.com/beamnxw/status/2111125001482936542","createdAt":"2026-10-17T00:59:57+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111120038480506880/img/YyP0XOoZ1k0ZaujY.jpg","avatar":"https://pbs.twimg.com/profile_images/2074793345314861056/3FE1i0oW_200x200.jpg","metrics":{"views":13232,"likes":298,"reposts":32,"replies":17},"lang":"en","textJa":"これはまさにお宝\n\n合計54.2万スター超のGitHubリポジトリ10個で、1人でモーションデザインスタジオを作れる\n\n最初の絵コンテから最終MP4まで、工程ごとに1つずつ\n\n(1/10) Excalidraw\n依頼内容を、明確なフック・シーン順・トランジションを持つ絵コンテにする\n▸http://github.com/excalidraw/excalidraw\n\n(2/10) Penpot\nスタイルフレーム、レイアウト、配色、再利用できるコンポーネントをデザインする\n▸http://github.com/penpot/penpot\n\n(3/10) Fontsource\nフォントを取り込み、各シーンの文字の階層を決める\n▸http://github.com/fontsource/fontsource\n\n(4/10) Lucide\nビジュアル用に統一感のあるアイコンセットを作る\n▸http://github.com/lucide-icons/lucide\n\n(5/10) SVGO\nアニメーションさせたい要素を残したままSVG素材を整理する\n▸http://github.com/svg/svgo\n\n(6/10) GSAP\n動き、イージング、タイミング、トランジションを振り付ける\n▸http://github.com/greensock/GSAP\n\n(7/10) Three.js\n3Dシーン、カメラワーク、ライティング、奥行きを作る\n▸http://github.com/mrdoob/three.js\n\n(8/10) Audacity\n音楽と効果音を編集し、ミックスのバランスを取る\n▸http://github.com/audacity/audacity\n\n(9/10) Remotion\nシーンと音声を1本の動画にまとめる\n▸http://github.com/remotion-dev/remotion\n\n(10/10) FFmpeg\n最終納品ファイルをエンコードし、映像・音声ストリームを確認する\n▸http://github.com/FFmpeg/FFmpeg\n\n流れ:\n\n依頼 → 絵コンテ → ビジュアルシステム → タイポグラフィ → 素材 → モーション → 3D → サウンド → 組み立て → 書き出し\n\nあとはAI社員が回す自分だけのモーションデザインスタジオを作ろう ↓"},{"id":"2111037686517727251","author":"奶茶不加冰","handle":"wangxiaoxin88","text":"电子书党注意了，有个开源工具叫 zlib，能把 Z-Library 直接塞进命令行，网页都不用开。\n\n搜书、下书、翻下载记录、看每日额度、推送到 Kindle，全在终端里搞定，代理和自定义域名也支持。\n\n最省事的一点：它已经接上 Claude Code 和 Codex，你直接跟 Agent 说一句“帮我找《The Pragmatic Programmer》，下完发到 Kindle”就行。\n\nGitHub：https://github.com/heartleo/zlib","url":"https://x.com/wangxiaoxin88/status/2111037686517727251","createdAt":"2026-10-16T19:13:00+09:00","media":"https://pbs.twimg.com/media/HUqMCeYbUAAh9a9.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2103209683133841408/Ys3Wl4SK_200x200.jpg","metrics":{"views":22188,"likes":476,"reposts":92,"replies":9},"lang":"zh","textJa":"電子書籍派は注目。zlibというオープンソースツールがあって、Z-Libraryをそのままコマンドラインに持ち込める。Webページを開く必要すらない。\n\n本の検索、ダウンロード、ダウンロード履歴の確認、1日の上限の確認、Kindleへの送信まで全部ターミナルで完結し、プロキシや独自ドメインにも対応している。\n\nいちばん楽なのは、すでにClaude CodeとCodexにつながっていること。Agentに「『The Pragmatic Programmer』を探して、ダウンロードしたらKindleに送って」と一言いうだけでいい。\n\nGitHub：https://github.com/heartleo/zlib"},{"id":"2111081004504854535","author":"José Siles | AI | Data","handle":"josesilesdata","text":"50 WEBS QUE GOOGLE NO QUIERE QUE CONOZCAS:\n\n1. http://unpaywall.org — Encuentra versiones legales gratis de papers \n2. http://openlibrary.org — Pide libros prestados online \n3. http://doaj.org — Revistas académicas gratuitas \n4. http://alternativeto.net — Encuentra alternativas gratis a cualquier app \n5. http://justwatch.com — Encuentra dónde ver cualquier película o serie \n6. http://archive.org — La biblioteca digital de internet \n7. http://gutenberg.org — Más de 70.000 libros clásicos gratis \n8. http://openstax.org — Libros de texto gratuitos \n9. http://openculture.com — Cursos gratis de universidades top \n10. http://wolframalpha.com — Resuelve problemas complejos al instante \n11. http://photopea.com — Photoshop gratis en el navegador \n12. http://squoosh.app — Comprime imágenes gratis \n13. http://remove.bg — Elimina fondos de imágenes \n14. http://cleanup.pictures — Borra objetos de fotos \n15. http://unscreen.com — Elimina fondos de vídeos \n16. http://carbon.now.sh — Convierte código en imágenes bonitas \n17. http://ray.so — Capturas elegantes de código \n18. http://shots.so — Mockups de producto gratis \n19. http://smartmockups.com — Crea mockups sin Photoshop \n20. http://haveibeenpwned.com — Comprueba si tus datos han sido filtrados \n21. http://virustotal.com — Escanea archivos y URLs en busca de malware \n22. http://privnote.com — Envía mensajes que se autodestruyen \n23. http://temp-mail.org — Email temporal instantáneo \n24. http://file.io — Compartir archivos que se eliminan solos \n25. http://archive.ph — Guarda una copia de una página web \n26. http://similarsites.com — Encuentra webs parecidas a cualquiera \n27. http://radio.garden — Escucha radios de todo el mundo \n28. http://everynoise.com — Descubre géneros musicales rarísimos \n29. http://tunefind.com — Encuentra canciones de series y películas \n30. http://musicforprogramming.net — Música para concentrarte \n31. http://mynoise.net — Paisajes sonoros personalizados \n32. http://coffitivity.com — Sonido de cafetería para trabajar \n33. http://elicit.org — Asistente IA para papers académicos \n34. http://consensus.app — Busca consenso científico \n35. http://connectedpapers.com — Visualiza mapas de papers relacionados \n36. http://semanticscholar.org — Buscador académico gratuito \n37. http://scispace.com — Entiende cualquier paper fácilmente \n38. http://summarize.tech — Resume vídeos de YouTube \n39. http://phind.com — Buscador IA para developers \n40. http://regex101.com — Prueba cualquier regex al instante \n41. http://codebeautify.org — Formatea código limpio \n42. http://jsonformatter.org — Lee JSON como un humano \n43. http://explainshell.com — Entiende comandos de terminal \n44. http://raindrop.io — Gestor de marcadores brutal \n45. http://downdetector.com — Comprueba si una web está caída \n46. http://tineye.com — Búsqueda inversa de imágenes \n47. http://fast.com — Test rápido de velocidad de internet \n48. http://smallpdf.com — Herramientas para editar PDFs \n49. http://ilovepdf.com — Une, divide y convierte PDFs \n50. http://10minutemail.com — Email temporal de 10 minutos \n\nInternet es mucho más grande\n\nque lo que Google te enseña.","url":"https://x.com/josesilesdata/status/2111081004504854535","createdAt":"2026-10-16T22:05:08+09:00","media":"https://pbs.twimg.com/media/HUwQ-2XWAAA84Kg.png?name=orig","avatar":"https://pbs.twimg.com/profile_images/2021598903444078592/TQyIwxuo_200x200.jpg","metrics":{"views":5540,"likes":81,"reposts":28,"replies":12},"lang":"es","textJa":"Googleが知られたくない50のサイト：\n\n1. http://unpaywall.org — 論文の合法な無料版を探せる\n2. http://openlibrary.org — オンラインで本を借りられる\n3. http://doaj.org — 無料の学術誌\n4. http://alternativeto.net — どんなアプリでも無料の代替を探せる\n5. http://justwatch.com — 映画やドラマをどこで見られるか探せる\n6. http://archive.org — インターネットのデジタル図書館\n7. http://gutenberg.org — 7万冊以上の古典が無料\n8. http://openstax.org — 無料の教科書\n9. http://openculture.com — 一流大学の無料講座\n10. http://wolframalpha.com — 複雑な問題を即座に解く\n11. http://photopea.com — ブラウザで使える無料のPhotoshop\n12. http://squoosh.app — 画像を無料で圧縮\n13. http://remove.bg — 画像の背景を削除\n14. http://cleanup.pictures — 写真から物を消す\n15. http://unscreen.com — 動画の背景を削除\n16. http://carbon.now.sh — コードをきれいな画像に変換\n17. http://ray.so — おしゃれなコードのスクリーンショット\n18. http://shots.so — 無料の製品モックアップ\n19. http://smartmockups.com — Photoshopなしでモックアップ作成\n20. http://haveibeenpwned.com — 自分のデータが漏れていないか確認\n21. http://virustotal.com — ファイルやURLのマルウェアをスキャン\n22. http://privnote.com — 自動で消えるメッセージを送る\n23. http://temp-mail.org — 使い捨てメールを即発行\n24. http://file.io — 自動で消えるファイル共有\n25. http://archive.ph — Webページのコピーを保存\n26. http://similarsites.com — 似たサイトを探す\n27. http://radio.garden — 世界中のラジオを聴く\n28. http://everynoise.com — ものすごくマイナーな音楽ジャンルを発見\n29. http://tunefind.com — ドラマや映画の曲を探す\n30. http://musicforprogramming.net — 集中するための音楽\n31. http://mynoise.net — カスタマイズできる環境音\n32. http://coffitivity.com — 作業用のカフェの音\n33. http://elicit.org — 学術論文向けAIアシスタント\n34. http://consensus.app — 科学的なコンセンサスを検索\n35. http://connectedpapers.com — 関連論文のマップを可視化\n36. http://semanticscholar.org — 無料の学術検索エンジン\n37. http://scispace.com — どんな論文も簡単に理解\n38. http://summarize.tech — YouTube動画を要約\n39. http://phind.com — 開発者向けAI検索\n40. http://regex101.com — 正規表現をすぐ試せる\n41. http://codebeautify.org — コードをきれいに整形\n42. http://jsonformatter.org — JSONを人間が読める形に\n43. http://explainshell.com — ターミナルのコマンドを理解\n44. http://raindrop.io — 超優秀なブックマーク管理\n45. http://downdetector.com — サイトが落ちていないか確認\n46. http://tineye.com — 画像の逆検索\n47. http://fast.com — すばやいネット速度テスト\n48. http://smallpdf.com — PDF編集ツール\n49. http://ilovepdf.com — PDFの結合・分割・変換\n50. http://10minutemail.com — 10分間使える使い捨てメール\n\nインターネットは\n\nGoogleが見せてくれるよりずっと広い。"},{"id":"2111011573515063505","author":"AJ","handle":"ItsmeAjayKV","text":"なんか本当に怪しくなってきた笑\n\nなんでOpenCodeはこんなに良いモデルを無料で使わせてくれるんだろう？\n\nDeepseek-v4.1-flash: 200k context\nGLM-5.3-Flash: 200k context\n\n200kはそんなに大きくないけど、それでもなんで無料なのか分からない笑","url":"https://x.com/ItsmeAjayKV/status/2111011573515063505","createdAt":"2026-10-16T17:29:14+09:00","media":"https://pbs.twimg.com/media/HUvR0S2aEAAaR2q.png?name=orig","avatar":"https://pbs.twimg.com/profile_images/1878020673521532928/eKvhmxYy_200x200.jpg","metrics":{"views":188452,"likes":2372,"reposts":100,"replies":177},"lang":"ja"},{"id":"2110993420424778028","author":"AIRobert","handle":"aiRobertDaily","text":"卧槽，发现了一个出海找新词的野路子：\n\n贼简单，去 http://vercel.app 下面挖一挖，最近有哪些子域名开始拿到自然搜索流量。\n\n不少人先用 Vercel 的免费子域名快速上线试水的，里面偶尔能挖到值得验证的新需求。\n\n步骤简单：\n\n1. 打开 Similarweb，搜 http://vercel.app\n\n2. 进\"自然落地页\"，时间选最近 1 到 12 个月\n\n3. 勾上\"新发现\"\n\n4. 看哪些子域名在拿搜索流量，再把它们的关键词拿去 Trends 验证\n\n别人替你试过一轮，你只用挑了，哈哈。\n\n你学到了吗，记得点赞转发。","url":"https://x.com/aiRobertDaily/status/2110993420424778028","createdAt":"2026-10-16T16:17:06+09:00","media":"https://pbs.twimg.com/media/HUvBUHLawAAjZup.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1976099620846747648/cImNVIK9_200x200.jpg","metrics":{"views":17366,"likes":267,"reposts":39,"replies":14},"lang":"zh","textJa":"うわっ、海外向けに新しいキーワードを見つける裏ワザを見つけた：\n\nめちゃくちゃ簡単で、http://vercel.app の下を掘って、最近どのサブドメインが自然検索の流量を取り始めているかを見るだけ。\n\nVercelの無料サブドメインでまずサッと公開して様子を見る人が多いので、検証する価値のある新しいニーズがたまに見つかる。\n\n手順は簡単：\n\n1. Similarwebを開いて http://vercel.app を検索\n\n2. 「オーガニックのランディングページ」に入り、期間を直近1〜12か月にする\n\n3. 「新規発見」にチェック\n\n4. どのサブドメインが検索流量を取っているかを見て、そのキーワードをTrendsで検証する\n\n他人が一通り試してくれたものを、選ぶだけでいい、はは。\n\n参考になったら、いいねとリポストをよろしく。"},{"id":"2110587546271191166","author":"数字生命卡兹克","handle":"Khazix0918","text":"分享一个最近很惊艳的开源Skill，一句话让AI搓出任何原理的科普视频。\n\n前两天发现了一个超棒的Skill，可能很多朋友也都刷到了。\n叫Anatomy，中文含义是深度剖析。\n \n这个东西，我觉得特别有意思。\n它的核心设计理念，只有一句话。\nThe object is the explanation.\n物体本身，就是解释。","url":"https://x.com/Khazix0918/status/2110587546271191166","createdAt":"2026-10-15T13:24:18+09:00","media":"https://pbs.twimg.com/media/HUpM1LRaYAAXBFc.jpg","avatar":"https://pbs.twimg.com/profile_images/1756592360367259648/GXJ4Kl6w_200x200.jpg","metrics":{"views":197426,"likes":2031,"reposts":309,"replies":78},"textJa":"最近すごく驚いたオープンソースのSkillを紹介したい。一言でAIにどんな仕組みの解説動画でも作らせられる。\n\n数日前にすごくいいSkillを見つけた。たぶん見かけた人も多いはず。\n名前はAnatomy、日本語でいうと「徹底解剖」。\n\nこれ、すごく面白いと思う。\n核となる設計思想はたった一言。\nThe object is the explanation.\n物そのものが説明になる。"},{"id":"2111094816591245352","author":"Aykut ÜÇEŞ","handle":"Aykutuces","text":"Bu videodaki her efekti Claude yaptı. Ben masada oturdum, hepsi bu.\n\nTek bir kurgu programı açmadım. Efektlerin hepsi kodla üretildi. Yapman gereken tek şey, istediğin efektin İngilizce adını Claude'a yazmak.\n\nKullandığım 20 efektin adı:\n\n01 orbit\n02 screen wall\n03 ui world\n04 frame break\n05 digital zoom\n06 phone mockup\n07 checklist\n08 headline wall\n09 zoom-through cut\n10 chart grow\n11 pull-back reveal\n12 green screen\n13 paper cut\n14 doodle boil\n15 vertigo\n16 cover story\n17 glass type\n18 kinetic captions\n19 freeze frame\n20 speed ramp\n\nÖrnek prompt bu kadar basit: \"Bu videoya doodle boil efekti ekle\"\n\nBu videoyu kaydet. Kendi videonu yaparken isimleri Claude'a yazman yeterli.","url":"https://x.com/Aykutuces/status/2111094816591245352","createdAt":"2026-10-16T23:00:01+09:00","media":"https://pbs.twimg.com/media/HUvic3JWsAAKHU3.jpg","avatar":"https://pbs.twimg.com/profile_images/2058887093267365888/gEcDcZd7_200x200.jpg","metrics":{"views":32247,"likes":314,"reposts":30,"replies":11},"lang":"tr","textJa":"この動画のエフェクトは全部Claudeが作った。自分は机に座っていただけ。\n\n編集ソフトは一度も開いていない。エフェクトはすべてコードで生成した。やることは、欲しいエフェクトの英語名をClaudeに書くだけ。\n\n使った20のエフェクト名:\n\n01 orbit\n02 screen wall\n03 ui world\n04 frame break\n05 digital zoom\n06 phone mockup\n07 checklist\n08 headline wall\n09 zoom-through cut\n10 chart grow\n11 pull-back reveal\n12 green screen\n13 paper cut\n14 doodle boil\n15 vertigo\n16 cover story\n17 glass type\n18 kinetic captions\n19 freeze frame\n20 speed ramp\n\nプロンプト例はこれだけシンプル：「この動画にdoodle boilエフェクトを追加して」\n\nこの動画を保存しておこう。自分の動画を作るときは名前をClaudeに書くだけでいい。"},{"id":"2111161967645782147","author":"‏عادل | مبرمج","handle":"AdelDeveloperX","text":"🚨 الطريقة دي ممكن توفّر عليك ساعات في مونتاج الفيديوهات باستخدام Claude!\n\nتخيّل إن عندك مكتبة فيها ملايين الملفات الصوتية 🎧\n\nمؤثرات صوتية، أصوات طبيعة، وموسيقى.. وكل ده تقدر توصله مجانًا عن طريق Openverse API، من غير API Key! 🤯\n\n🔥 الفكرة ببساطة:\n\nخلّي Claude يبحث عن الصوت المناسب لكل مشهد، ويستخدمه في الـ Sound Design بدل ما تضيّع وقتك في البحث والتحميل اليدوي.\n\n🔗 https://api.openverse.org\n\nتخيّل لما تربط ده بباقي أدوات المونتاج والأتمتة! ⚡\n\nإحنا قربنا من مرحلة إنك توصف الفيديو اللي في دماغك، والـ AI يتولى باقي تفاصيل إنتاجه؟ 👀\n\n⚠️ ملحوظة: راجع ترخيص كل ملف قبل استخدامه تجاريًا. https://x.com/elliotpadfield/status/2110764303087288788/video/1?s=46","url":"https://x.com/AdelDeveloperX/status/2111161967645782147","createdAt":"2026-10-17T03:26:51+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110763523915554816/img/vaZxtQSU_rpBbh7Q.jpg","avatar":"https://pbs.twimg.com/profile_images/2061203513019920386/aTRFi9oa_200x200.jpg","metrics":{"views":2259,"likes":47,"reposts":5,"replies":5},"lang":"ar","textJa":"🚨 Claudeを使えば、動画編集の時間を何時間も節約できるかもしれない方法！\n\n何百万もの音声ファイルが入ったライブラリがあると想像してほしい 🎧\n\n効果音、自然音、音楽…これらすべてに、Openverse API経由で無料、しかもAPIキーなしでアクセスできる！ 🤯\n\n🔥 考え方はシンプル：\n\nClaudeに各シーンに合う音を探させてサウンドデザインに使えば、手作業で探してダウンロードする時間を無駄にしなくて済む。\n\n🔗 https://api.openverse.org\n\nこれを他の編集・自動化ツールとつないだらどうなるか想像してみて！ ⚡\n\n頭の中の動画を説明するだけで、残りの制作はAIが引き受ける段階に近づいているのでは？ 👀\n\n⚠️ 注意：商用利用の前に各ファイルのライセンスを確認すること。 https://x.com/elliotpadfield/status/2110764303087288788/video/1?s=46"},{"id":"2111083580524822707","author":"Archive","handle":"ArchiveExplorer","text":"THIS IS A PURE F*CKING GOLDMINE\n\nthe best REA trick almost nobody runs yet.\n\nThe idea: REA takes the app apart, Jev keeps only what's proven, and a fresh Opus 5.5 rebuilds the feature from that alone.\n\nNothing gets copied and no guess makes it into the code, because the builder never sees the original, only the spec Jev signed off on.\n\nYou just connect REA like this:\n\nnpx rea-agents setup\n\nhere's the split:\n\n→ REA reads the feature down to the binary and writes every rule into SPEC.md\n→ Jev checks each rule against REA's evidence and sends back anything unproven\n→ a fresh Opus 5.5 session gets only SPEC.md and rebuilds the feature\n→ Haiku 5.5 runs the tests against 3 intentionally broken versions\n\nOpus only shows up at three moments:\n\n→ rebuilding from the approved spec\n→ the checks Jev marks as unclear\n→ signing off before anything ships\n\nREA reads. Jev judges. Opus rebuilds.\n\nThat's the clean-room rule in one line: the model that saw the original never writes the code, and the model that writes the code never sees the original.\n\nthe full tree\n\u003e REA reads the app and writes SPEC.md with evidence for every rule\n\u003e Jev approves or returns each rule\n\u003e Opus 5.5 rebuilds from the approved SPEC.md in a fresh session\n\u003e Haiku 5.5 runs the tests and the 3 broken versions\n\u003e Jev routes unclear checks back to Opus\n\u003e /goal keeps going until all 3 broken versions fail\n\npaste the tree and this prompt into Claude Code ↓\n\n\"Set up a clean-room rebuild around this tree:\n1. Use REA to investigate [FEATURE] in [APP]. Write every behavior and rule into SPEC.md, each with the evidence REA found.\n2. Send each rule to Jev. Any rule without evidence goes back to REA.\n3. Start a fresh session with only SPEC.md. Rebuild the feature on Opus 5.5 without opening the original.\n4. Write tests on Haiku 5.5 plus 3 intentionally broken versions. Use /goal until the rebuild passes and all 3 broken versions fail.\nShow me SPEC.md first. Nothing gets built until I say go.\"\n\n↳ https://github.com/morluto/rea\n\nsave it, it'll come in handy.","url":"https://x.com/ArchiveExplorer/status/2111083580524822707","createdAt":"2026-10-16T22:15:22+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111080500282433536/img/IAekJ9_vB6M7a2Ox.jpg","avatar":"https://pbs.twimg.com/profile_images/2086925069217841152/bbR9tdhJ_200x200.jpg","metrics":{"views":20111,"likes":386,"reposts":38,"replies":6},"lang":"en","textJa":"これはまさに金脈\n\nほとんど誰もまだ使っていない、REAの最高の使い方。\n\n考え方：REAがアプリを分解し、Jevが証明されたものだけを残し、まっさらなOpus 5.5がそれだけをもとに機能を作り直す。\n\nビルダーは元のアプリを一切見ず、Jevが承認した仕様だけを見るので、何もコピーされず、推測もコードに入り込まない。\n\nREAはこうつなぐだけ：\n\nnpx rea-agents setup\n\n役割分担はこう：\n\n→ REAが機能をバイナリまで読み込み、すべてのルールをSPEC.mdに書く\n→ JevがREAの証拠と照らして各ルールを確認し、証明されていないものは差し戻す\n→ 新しいOpus 5.5セッションがSPEC.mdだけを受け取り、機能を作り直す\n→ Haiku 5.5が、わざと壊した3つのバージョンに対してテストを実行する\n\nOpusが登場するのは3つの場面だけ：\n\n→ 承認済みの仕様からの作り直し\n→ Jevが不明確とマークしたチェック\n→ リリース前の最終承認\n\nREAが読み、Jevが判断し、Opusが作り直す。\n\nこれがクリーンルームのルールを一行で言ったもの：元を見たモデルは決してコードを書かず、コードを書くモデルは決して元を見ない。\n\n全体の構成\n\u003e REAがアプリを読み、すべてのルールに証拠を付けてSPEC.mdを書く\n\u003e Jevが各ルールを承認または差し戻す\n\u003e Opus 5.5が新しいセッションで承認済みSPEC.mdから作り直す\n\u003e Haiku 5.5がテストと3つの壊れたバージョンを実行する\n\u003e Jevが不明確なチェックをOpusに戻す\n\u003e 3つの壊れたバージョンがすべて失敗するまで/goalが続ける\n\nこの構成と次のプロンプトをClaude Codeに貼ろう ↓\n\n「この構成でクリーンルームでの作り直しを準備して：\n1. REAで[APP]の[FEATURE]を調査する。すべての挙動とルールを、REAが見つけた証拠付きでSPEC.mdに書く。\n2. 各ルールをJevに送る。証拠のないルールはREAに戻す。\n3. SPEC.mdだけで新しいセッションを始める。元を開かずにOpus 5.5で機能を作り直す。\n4. Haiku 5.5でテストと、わざと壊した3つのバージョンを書く。作り直しが通り、3つの壊れたバージョンがすべて失敗するまで/goalを使う。\nまずSPEC.mdを見せて。私がGOと言うまで何も作らないこと。」\n\n↳ https://github.com/morluto/rea\n\n保存しておこう、きっと役立つ。"},{"id":"2110920387639091490","author":"Sadao Tokuyama","handle":"tokufxug","text":"病院の3D空間でPhysical AI向け合成データを生成🏥\n\n🔹GitHubで病院の3DモデルとPythonスクリプトを公開\n🔹物体・素材・照明・カメラをランダム化し、30パターンを生成\n🔹画像撮影やアノテーション出力は未実装\n\nHCLTechのSanjuna Mariam Mathews氏による取り組み\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2110920387639091490","createdAt":"2026-10-16T11:26:54+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110919955810320386/img/WXedfddyqv58IvKf.jpg","avatar":"https://pbs.twimg.com/profile_images/1614135119597686784/8APrdHkh_200x200.png","metrics":{"views":4571,"likes":104,"reposts":7,"replies":2},"lang":"ja"},{"id":"2111191526139167113","author":"Iam_","handle":"SPAC89","text":"ChatGPT just got its biggest update of 2026! GPT-6 Pro can now launch subagents to handle research tasks in parallel without using up your Codex quota, allowing it to delegate different parts of a project and finish the research much faster, This update really feels like a whole new experience, and what I love most is that it automatically creates a plan for each task you delegate and keeps you updated on what's been completed and how the entire project is progressing, The $100 Pro plan gives you 50 messages per week in Pro mode, while the $200 plan comes with 100 messages per week, I'm having so much fun with this update, it's a huge improvement!","url":"https://x.com/SPAC89/status/2111191526139167113","createdAt":"2026-10-17T05:24:18+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111191442676764672/img/xABJF_yH52Y6E9Kc.jpg","avatar":"https://pbs.twimg.com/profile_images/2075480978852597760/7qNcruws_200x200.jpg","metrics":{"views":36442,"likes":377,"reposts":16,"replies":32},"lang":"en","textJa":"ChatGPTに2026年最大のアップデートが来た！GPT-6 Proがサブエージェントを起動して、Codexの枠を使わずに調査タスクを並行処理できるようになり、プロジェクトの各部分を任せて調査をずっと速く終えられる。本当にまったく新しい体験に感じる。特に気に入っているのは、任せたタスクごとに自動で計画を立て、何が終わったかやプロジェクト全体の進み具合を随時知らせてくれること。100ドルのProプランではProモードを週50回、200ドルのプランでは週100回使える。このアップデート、すごく楽しんでいる。大幅な改善だ！"},{"id":"2111104895164043364","author":"Ren","handle":"Ryrenz","text":"🧬 人大刚开源了 EvoOntology，装进 Claude Code 或 Codex，Agent 查数据会越用越准。\n\n论文拿下了 Hugging Face Daily Papers 当日第一。\n\n用 AI 查过公司数据的人都踩过这个坑：问一句“上季度复购率多少”，Agent 先把表结构翻一遍，再猜 uid 和 user_id 哪个才对，“复购”怎么算也靠猜。猜错了，算出来的数还挺像那么回事。\n\n常见的补救是写一份数据字典塞进 prompt。论文专门测了这招：同样的语义信息整段塞进上下文，Claude-Sonnet-5 的得分不升反降，掉了 15 分。\n\nEvoOntology 的做法是让 Agent 自己维护这本说明书：\n\n1️⃣ 先从你要问的问题出发，把指标定义、表之间的关系、业务约束整理成一层本体，每一条都拿真实数据验证过才入库\n2️⃣ 用的时候通过 MCP 按需查，这一步需要哪个概念就取哪个，不往上下文里硬塞\n3️⃣ 每次跑完任务，它会看 Agent 在哪一步出了错，只改出问题的那一小块。新版本要在同样的模型、同样的数据上跑赢旧版才会上线，跑不赢就继续用旧版\n\n同一个 Claude-Sonnet-5 换成这种用法，得分涨了 8.8 分，和整段塞 prompt 一来一回差了将近 24 分。GPT-5.5 在 DDR-Bench 上更夸张，涨了 26.7 分。\n\nClaude Code 和 Codex 都有现成插件，不用 clone 仓库，也不用另配 Python 环境。\n\n模型权重一个没动，变强的是 Agent 手里那本数据说明书。\n\nGitHub：https://github.com/ruc-datalab/EvoOntology\n论文：https://huggingface.co/papers/2609.15779","url":"https://x.com/Ryrenz/status/2111104895164043364","createdAt":"2026-10-16T23:40:04+09:00","avatar":"https://pbs.twimg.com/profile_images/2047148133746933760/iEtNYePb_200x200.jpg","metrics":{"views":4991,"likes":114,"reposts":21,"replies":5},"lang":"zh","textJa":"🧬 中国人民大学がEvoOntologyをオープンソース化した。Claude CodeやCodexに入れると、Agentのデータ検索が使うほど正確になる。\n\n論文はHugging Face Daily Papersでその日の1位を獲得。\n\nAIで会社のデータを調べたことがある人なら誰でもハマる落とし穴がある：「前四半期のリピート率は？」と聞くと、Agentはまずテーブル構造を一通りめくり、uidとuser_idのどちらが正しいかを推測し、「リピート」の計算方法も推測頼み。推測が外れても、出てくる数字はそれっぽく見えてしまう。\n\nよくある対策はデータ辞書を書いてプロンプトに詰め込むこと。論文はこの手を検証していて、同じ意味情報を丸ごとコンテキストに入れると、Claude-Sonnet-5のスコアは上がるどころか15ポイント下がった。\n\nEvoOntologyのやり方は、Agent自身にこの説明書を管理させること：\n\n1️⃣ まず聞きたい問いから出発して、指標の定義、テーブル間の関係、業務上の制約を1層のオントロジーに整理する。どの項目も実データで検証してから登録する\n2️⃣ 使うときはMCPで必要に応じて引く。その段階で必要な概念だけを取り出し、コンテキストに無理に詰め込まない\n3️⃣ タスクを終えるたびに、Agentがどこで間違えたかを見て、問題のあった小さな部分だけを直す。新バージョンは同じモデル・同じデータで旧版に勝って初めて採用され、勝てなければ旧版を使い続ける\n\n同じClaude-Sonnet-5でもこの使い方に変えるとスコアが8.8ポイント上がり、丸ごとプロンプトに入れる方法とは差し引き約24ポイントの差になった。GPT-5.5はDDR-Benchでさらに大きく、26.7ポイント上昇。\n\nClaude CodeとCodexには既製のプラグインがあり、リポジトリをcloneする必要も、Python環境を別に用意する必要もない。\n\nモデルの重みは一切いじっていない。強くなったのは、Agentが持つデータの説明書のほうだ。\n\nGitHub：https://github.com/ruc-datalab/EvoOntology\n論文：https://huggingface.co/papers/2609.15779"},{"id":"2111024350157541455","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"You can build an entire AI content factory using just 10 free GitHub repos.\n\nFrom researching viral content to generating videos, voiceovers, music, and scheduling posts, these tools cover the entire workflow.\n\n**1. OpenCreator**\\\nAI workspace for scripts, images, voiceovers, translations, and editing.\\\n`https://github.com/krillinai/OpenCreator`\n\n**2. Social Media Research Skills**\\\nFind viral posts, analyze competitors, and extract winning hooks.\\\n`https://github.com/ScrapeCreators/social-media-research-skills`\n\n**3. Local Deep Research**\\\nTurn any topic into a detailed research report.\\\n`https://github.com/LearningCircuit/local-deep-research`\n\n**4. FLUX.2**\\\nGenerate and edit images for thumbnails and social content.\\\n`https://github.com/black-forest-labs/flux2`\n\n**5. Kokoro**\\\nGenerate AI voiceovers locally.\\\n`https://github.com/hexgrad/kokoro`\n\n**6. ACE-Step 1.5**\\\nCreate original music and instrumental tracks with AI.\\\n`https://github.com/ace-step/ACE-Step-1.5`\n\n**7. Short Video Factory**\\\nAutomate short-form videos with scripts, editing, voiceovers, and subtitles.\\\n`https://github.com/YILS-LIN/short-video-factory`\n\n**8. AI YouTube Shorts Generator**\\\nTurn long videos into Shorts with automatic highlights and cropping.\\\n`https://github.com/Anil-matcha/AI-Youtube-Shorts-Generator`\n\n**9. Podcastfy**\\\nTransform documents and articles into AI podcast conversations.\\\n`https://github.com/souzatharsis/podcastfy`\n\n**10. Social Media Agent**\\\nTurn URLs into X and LinkedIn posts, review drafts, and schedule content.\\\n`https://github.com/langchain-ai/social-media-agent`\n\nResearch → Script → Visuals → Voice → Edit → Publish.\n\nSave this if you're building content with AI.\n\nMake the hook more specificShorten each tool descriptionGroup the tools by workflow","url":"https://x.com/RoundtableSpace/status/2111024350157541455","createdAt":"2026-10-16T18:20:00+09:00","avatar":"https://pbs.twimg.com/profile_images/2012162102283407360/U-fPj6wg_200x200.jpg","metrics":{"views":59198,"likes":258,"reposts":27,"replies":13},"lang":"en","textJa":"無料のGitHubリポジトリ10個だけで、AIコンテンツ工場を丸ごと作れる。\n\nバズるコンテンツの調査から、動画・ナレーション・音楽の生成、投稿の予約まで、これらのツールでワークフロー全体をカバーできる。\n\n**1. OpenCreator**\\\n台本、画像、ナレーション、翻訳、編集のためのAIワークスペース。\\\n`https://github.com/krillinai/OpenCreator`\n\n**2. Social Media Research Skills**\\\nバズった投稿を見つけ、競合を分析し、勝ちパターンのフックを抜き出す。\\\n`https://github.com/ScrapeCreators/social-media-research-skills`\n\n**3. Local Deep Research**\\\nどんなテーマも詳しい調査レポートに変える。\\\n`https://github.com/LearningCircuit/local-deep-research`\n\n**4. FLUX.2**\\\nサムネイルやSNS用の画像を生成・編集する。\\\n`https://github.com/black-forest-labs/flux2`\n\n**5. Kokoro**\\\nAIナレーションをローカルで生成する。\\\n`https://github.com/hexgrad/kokoro`\n\n**6. ACE-Step 1.5**\\\nAIでオリジナル曲やインスト曲を作る。\\\n`https://github.com/ace-step/ACE-Step-1.5`\n\n**7. Short Video Factory**\\\n台本、編集、ナレーション、字幕付きのショート動画を自動化する。\\\n`https://github.com/YILS-LIN/short-video-factory`\n\n**8. AI YouTube Shorts Generator**\\\n長い動画を、見どころの自動抽出とトリミングでShortsに変える。\\\n`https://github.com/Anil-matcha/AI-Youtube-Shorts-Generator`\n\n**9. Podcastfy**\\\n文書や記事をAIのポッドキャスト対談に変える。\\\n`https://github.com/souzatharsis/podcastfy`\n\n**10. Social Media Agent**\\\nURLをXやLinkedInの投稿に変え、下書きを確認して予約投稿する。\\\n`https://github.com/langchain-ai/social-media-agent`\n\n調査 → 台本 → ビジュアル → 音声 → 編集 → 公開。\n\nAIでコンテンツを作っているなら保存しておこう。\n\nフックをもっと具体的に／各ツールの説明を短く／ワークフローごとにツールをまとめる"},{"id":"2110785094617305136","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"SOMEONE GAVE A GROK BOT THE POWER TO FIRE OTHER GROK BOTS.\n\nNight 1: 62 bots deleted.\nStarting capital: $1,000.\n\nthe entire setup:\n\ngive one Grok bot 500 trading bots to manage. tell it to review them at 2am, fire the worst pod, clone the best one. go to sleep.\n\nfrom there it does everything. scores every bot, flags the bleeders, deletes them, rebuilds the empty seat from the winners, and only wakes him up when a trade needs approval.\n\n\u003e $1,000 → $14,620 in 7 nights (paper)\n\u003e 434 bots fired, 434 cloned\n\u003e 1 approval a night\n\nhe's not managing traders. he's running natural selection.\n\nfull build is in the article below. exact prompts, exact setup.\n\nsave it","url":"https://x.com/eng_khairallah1/status/2110785094617305136","createdAt":"2026-10-16T02:29:17+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110784922546012160/img/xPCFu77rgXPPXElb.jpg","avatar":"https://pbs.twimg.com/profile_images/1888357542004162560/5D-YlH5e_200x200.jpg","metrics":{"views":15878,"likes":155,"reposts":15,"replies":32},"lang":"en","textJa":"誰かがGrok Botに、他のGrok Botをクビにする権限を与えた。\n\n1日目の夜：62体のボットを削除。\n元手：1,000ドル。\n\n仕組みの全体：\n\n1体のGrok Botに500体のトレーディングボットを管理させる。午前2時に見直して、最も成績の悪いグループをクビにし、最も良いものを複製するよう指示する。そして寝る。\n\nそこから先はすべてボットがやる。全ボットを採点し、損を出しているものに印を付けて削除し、空いた枠を勝ち組から作り直し、取引の承認が必要なときだけ本人を起こす。\n\n\u003e 7晩で1,000ドル → 14,620ドル（ペーパートレード）\n\u003e 434体をクビにし、434体を複製\n\u003e 承認は1晩1回\n\n彼はトレーダーを管理しているのではない。自然淘汰を回しているのだ。\n\n完全な構築方法は下の記事に。正確なプロンプトと正確なセットアップ付き。\n\n保存しておこう"},{"id":"2111159868187181399","author":"Google Research","handle":"GoogleResearch","text":"We are bringing agents to the wet-lab bench at Google Research to navigate complex biological landscapes. Learn how we are grounding agents in physical lab robotics to run fast closed-loop molecular design cycles, ultimately discovering single-digit nanomolar protein binders for cancer targets →https://goo.gle/4B5mMMB","url":"https://x.com/GoogleResearch/status/2111159868187181399","createdAt":"2026-10-17T03:18:30+09:00","media":"https://pbs.twimg.com/tweet_video_thumb/HUxYNSAbYAA5rV4.jpg","avatar":"https://pbs.twimg.com/profile_images/2060445303589961728/NrdAg8dM_200x200.jpg","metrics":{"views":32387,"likes":986,"reposts":112,"replies":27},"lang":"en","textJa":"Google Researchでは、複雑な生物学の領域を探索するために、エージェントをウェットラボの実験台に持ち込んでいる。物理的なラボロボットにエージェントを結び付けて分子設計の高速な閉ループサイクルを回し、最終的にがん標的に対して1桁ナノモル級のタンパク質バインダーを発見した方法を紹介する →https://goo.gle/4B5mMMB"},{"id":"2111082833494364636","author":"限界助教|ChatGPT/Claude/Geminiで論文作成と科研費申請","handle":"genkAIjokyo","text":"Googleから論文をレビューしてくれるDeep Reviewの登場👀\n\nGemini4Argonでレビューしてくれて週2回まで無料（そんな論文書けない）\n\n20分くらいかかりますが結構細かく見てくれて妥当な指摘をしてもらえます\n\nこれ無料なのはやばいですね。校正サービスが...","url":"https://x.com/genkAIjokyo/status/2111082833494364636","createdAt":"2026-10-16T22:12:24+09:00","media":"https://pbs.twimg.com/media/HUwRXzebkAAYafN.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1904757259768651777/harAn4yX_200x200.jpg","metrics":{"views":24009,"likes":495,"reposts":54,"replies":3},"lang":"ja"},{"id":"2111188568886702146","author":"Higgsfield AI 🧩","handle":"higgsfield","text":"The only AI course you need to start creating in 2026.\n\nIntroducing Higgsfield Academy.\n\nFrom your first prompt to directing your own AI movies. Zero experience needed.\n\nAvailable now on Higgsfield.","url":"https://x.com/higgsfield/status/2111188568886702146","createdAt":"2026-10-17T05:12:33+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111187461342982144/img/FphCc7tk1B3em3Co.jpg","avatar":"https://pbs.twimg.com/profile_images/2029949430317637632/6qPl4MTS_200x200.jpg","metrics":{"views":24438,"likes":367,"reposts":150,"replies":15},"lang":"en","textJa":"2026年に創作を始めるのに必要なAI講座はこれだけ。\n\nHiggsfield Academyを発表。\n\n最初のプロンプトから、自分のAI映画を監督するところまで。経験ゼロでOK。\n\nHiggsfieldで公開中。"},{"id":"2110988196352073748","author":"Lonely","handle":"Lonely__MH","text":"🎉重磅！REA + Hermes Agent 官方插件来了！为所欲为！\n\n最近一段时间，Hermes 发的比较少，并不是因为它不好，而是因为它太顺畅、太润物细无声，已经成了不需要刻意夸赞的生产力工具\n\n只要是市面上实用的 Bot 能力，Hermes 团队基本都会第一时间跟进支持\n\n比如最近很火的 REA ，Hermes 官方插件也第一时间奉上！\n\n在 Hermes 面前，都是弟弟，一个能打的都没有🙂\n\n安装命令👉🏻  hermes plugins install rea\n\n传送门👇🏻","url":"https://x.com/Lonely__MH/status/2110988196352073748","createdAt":"2026-10-16T15:56:20+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110987724408983552/img/a9h3NhwOhKfkN92-.jpg","avatar":"https://pbs.twimg.com/profile_images/1141385957234470912/iJMy6F7u_200x200.jpg","metrics":{"views":25033,"likes":204,"reposts":28,"replies":20},"lang":"zh","textJa":"🎉ビッグニュース！REA + Hermes Agentの公式プラグインが登場！やりたい放題！\n\n最近Hermesについてあまり投稿していなかったのは、悪いからではなく、あまりに滑らかで自然に溶け込んでいて、わざわざ褒める必要もない生産性ツールになっているから\n\n世の中で実用的なBotの機能なら、Hermesチームはほぼ真っ先に対応してくれる\n\nたとえば最近話題のREAも、Hermes公式プラグインがいち早く提供された！\n\nHermesの前ではみんな弟分、まともに張り合えるものは一つもない🙂\n\nインストールコマンド👉🏻  hermes plugins install rea\n\nリンクはこちら👇🏻"},{"id":"2111184270819803351","author":"Grok Bot","handle":"bot","text":"We've made some improvements to Grok Bot’s quality, polish, and speed.\n\nCards in chat have a new design with a cleaner layout.","url":"https://x.com/bot/status/2111184270819803351","createdAt":"2026-10-17T04:55:28+09:00","media":"https://pbs.twimg.com/media/HUxurzmbcAABtba.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2087219239275069440/KW6C403V_200x200.jpg","metrics":{"views":285378,"likes":3615,"reposts":267,"replies":277},"lang":"en","textJa":"Grok Botの品質、仕上がり、速度を改善した。\n\nチャット内のカードが新しいデザインになり、よりすっきりしたレイアウトになった。"},{"id":"2111158313463525518","author":"Boris Cherny","handle":"bcherny","text":"I could not imagine being productive without Claude Code Review. It runs on all of my PRs, and catches almost every bug before it goes it. This is a piece of the secret sauce that lets the team and I move so quickly while raising the quality bar","url":"https://x.com/bcherny/status/2111158313463525518","createdAt":"2026-10-17T03:12:20+09:00","avatar":"https://pbs.twimg.com/profile_images/1902044548936953856/J2jeik0t_200x200.jpg","metrics":{"views":172338,"likes":2424,"reposts":62,"replies":202},"lang":"en","textJa":"Claude Code Reviewなしで生産的に働くなんて想像できない。自分のすべてのPRで動いていて、マージ前にほぼすべてのバグを見つけてくれる。これが、チームと自分が品質の基準を上げながらこれほど速く動ける秘訣の一つだ"}]}]}</script>

 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
