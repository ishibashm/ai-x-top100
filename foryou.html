","metrics":{"views":205599,"likes":1002}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","media":"https://pbs.twimg.com/media/HSj8bdNa0AAPYPc?format=jpg\u0026name=small","metrics":{"views":94366,"likes":699}},{"id":"2101288954477854964","author":"ゆいな","handle":"AI_yuinadayo","text":"お疲れ様！","url":"https://x.com/AI_yuinadayo/status/2101288954477854964","createdAt":"2026-09-19T12:35:01.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101288919107276801/img/k2QBUvs8ekatI-bL.jpg","metrics":{"views":5184,"likes":248}},{"id":"2101294219633529030","author":"Codez","handle":"0xCodez","text":"Jev創業者、ディオゴ・アルメイダ（元OpenAI）：\n\n「次の時代はClaude CodeやCodexの時代ではない。それらはまだ人間がループに入った支援時代の一部だ - JEVこそがLLMの次のステップ\n\n200倍高速、400倍安価、幻覚ゼロ、人間ループなし - それがJEV、LLMはこのように進化する」","url":"https://x.com/0xCodez/status/2101294219633529030","createdAt":"2026-09-19T12:55:56.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101293440843591680/img/3BtdoFBd-JH1wJc6.jpg","metrics":{"views":43383,"likes":381}},{"id":"2100887710923890960","author":"pon / Hiromu Nakamura","handle":"po3rin","text":"社内でJev勉強会をしました！！50人以上参加して、Jevとは？の軽い共有から、使うとどんな機能が作れそうか？どんなユーザー体験が作れそうかをアイデアを出しあいました。","url":"https://x.com/po3rin/status/2100887710923890960","createdAt":"2026-09-18T10:00:37.000Z","metrics":{"views":124512,"likes":900}},{"id":"2101144215464096182","author":"いわこAIでつくる暮らし","handle":"writer_miki","text":"本当に、使用量が減らなくなった","url":"https://x.com/writer_miki/status/2101144215464096182","createdAt":"2026-09-19T02:59:52.000Z","metrics":{"views":314007,"likes":773}},{"id":"2101018783976722479","author":"borja","handle":"borjafat","text":"JevのSEO監査はぶっ飛んでる \n\n45.1秒でサイトの全586ページを読み込み、内部リンクマップを再構築しました。584個のリンクを配置、139ページは正直何もフィットしなかったのでリンクを拒否。総コスト$0.21。\n\nClaude Opus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-09-19T22:21:49.224Z","posts":[{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":225}},{"id":"2101000339948282090","author":"梭哈.AI","handle":"SUOHA_AI","text":"完全睡不着了....这个视频让你完全看懂JEV的恐怖能力\n\n我实际演示了一下，用 JEV 和 DeepSeek 做同一个任务：从当天的海量实时新闻流里，为 15 个品牌快速匹配有没有适合借势的公关热点，并打上结构化意图分类标签\n\n结果是：28 秒内，Jev 狂刷完了整整 428\n\n很多人没看懂爆火的JEV是什么？\n\n所以我做了一个 50 秒的演示视频，带大家把海外刷屏的 JEV 以及它背后的底层架构看透（见下方视频）\n\nJEV 是前 OpenAI、参与 ChatGPT / RLHF 的 @CompleteSkeptic（Diogo Almeida）创办 @typesafeai 后的第一款模型\n\n他在 OpenAI 时发现了一个致命矛盾：  x.com/SUOHA_AI/statu…","url":"https://x.com/SUOHA_AI/status/2101000339948282090","createdAt":"2026-09-18T17:28:10.000Z","metrics":{"views":300000,"likes":1852},"textJa":"完全に眠れなくなった……この動画を見ると、JEVの恐ろしい能力がよく分かる。\n\nJEVとDeepSeekに同じタスクを実際に試してもらった。当日の膨大なリアルタイムニュースから、15ブランドがPRに活用できる話題を素早く探し、構造化した意図分類タグを付けるというもの。\n\n結果：Jevは28秒以内に、なんと428……\n\n話題のJEVが何なのか、まだ分からない人も多い。\n\nそこで50秒のデモ動画を作った。海外で話題のJEVと、その基盤となるアーキテクチャを紹介する（下の動画）。\n\nJEVは、OpenAIでChatGPT / RLHFに携わった @CompleteSkeptic（Diogo Almeida）が @typesafeai を創業して初めて発表したモデルだ。\n\n彼はOpenAIで、致命的な矛盾に気づいた： x.com/SUOHA_AI/statu…","lang":"zh"},{"id":"2101325703635435523","author":"Movez","handle":"0xMovez","text":"Jev X Viral Post Analyserを今作りました。\n\n100,000件のバイラルX投稿。20.4秒。$0.67。\n\nClaude Opus 5、同じコーパス、同じ時間で、214件の投稿を処理して$0.98を使いました。\n\n投稿あたりでいうと~680倍安く、フルOpusパスだと$458かかっていたでしょう。\n\nviral","url":"https://x.com/0xMovez/status/2101325703635435523","createdAt":"2026-09-19T15:01:03.000Z","metrics":{"views":11000,"likes":105}},{"id":"2101095525793616162","author":"yibie","handle":"yibie","text":"Jev 生态 72 小时：从 46 条到 160 条\n\nJev 把「判断」变成了一个足够便宜、可以在代码里直接调用的原语。然后开发者社区在 72 小时内把这句话翻译成了项目。\n\n一、最热的方向：上下文压缩\n\ntamaratran/fast-jev-compaction 现在 3,169 星，是目前最大的 Jev 项目。思路是把摘要换掉：不再让 LLM","url":"https://x.com/yibie/status/2101095525793616162","createdAt":"2026-09-18T23:46:24.000Z","metrics":{"views":8597,"likes":115},"textJa":"Jevエコシステムの72時間：46件から160件へ\n\nJevは「判断」を、コードから直接呼び出せるほど安価な基本機能にした。そして開発者コミュニティは72時間で、その考えを実際のプロジェクトにした。\n\n1．最も注目される分野：コンテキスト圧縮\n\ntamaratran/fast-jev-compactionは現在3,169スターで、最大のJevプロジェクトだ。発想は要約を置き換えること。LLMに……","lang":"zh"},{"id":"2101315100904931352","author":"Yum⋆₊˚","handle":"yuhasbeentaken","text":"マーケティング担当者が見られる10のJevユースケース：\n\n1. リードスコアリング - 一晩で100件の新しいリードが手に入りました。Jevはどのリードが最も購入しやすかをスコアリングできます。営業チームは最高のものを最初に受け取ります。\n2. メール優先順位付け -\n\nJevで1,315件のX投稿を分類しました。推定モデルコストは約0.086ドル\n\nみんなのJevデモを見て、自分のコンテンツ研究のために何か作ってみたくなりました。\n\n投稿をたくさん集めていたのですが、それらが何を共通にしているかを把握するには、まだ一つずつ開いてメモを取る必要がありました。 x.com/CompleteSkepti…","url":"https://x.com/yuhasbeentaken/status/2101315100904931352","createdAt":"2026-09-19T14:18:55.000Z","metrics":{"views":13000,"likes":123}},{"id":"2101285853859545263","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"Jevでチャットゲーム作りました！作ってみてこれはすごい！AI使って会話してるのに全然お金かからない！\nAIチャットゲームを無料で公開しても大丈夫って、すごい時代が来てしまっているのでは...\n入力した言葉に対してJevで感情とトピックを判定しています。やっぱりJevはゲーム開発にめっちゃ使える！","url":"https://x.com/gigabit_million/status/2101285853859545263","createdAt":"2026-09-19T12:22:42.000Z","metrics":{"views":22000,"likes":279}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、\n\nJevも合成データと大規模モデルのラベルで学習をしているらしいので、重み157GBのDeepSeek V4 Flashの判断をDGX Sparkで26時間かけて蒸留・学習し、4Bモデルに移してみた。20分の1のサイズで教師の即答モードを超え、1判断あたり約22ms。Local LLMだけでここまでできるとは。  x.com/taroleo/status…","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":38000,"likes":402}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…\n\ntoBリードの業種判定にSonnetを使用していたけど、Jevに切り替えることでコストは200分の1、速度は1.5倍ほど早くなった  x.com/yutosuzuki/sta…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4261,"likes":29}},{"id":"2101220803006312647","author":"Musolsol.𝟎𝐱𝐔","handle":"MMMusol","text":"时间线上全是 Jev，却不知道它能帮你做什么？\n\n这几天我把 Jev 目前看到最有用的 9 个实际使用场景以及最有代表性的演示帖整理了出来，分享给大家，欢迎大家收藏分享~\n\n1. 操作电脑  \n\n@Saccc_c\n 给 Codex 加了一层 Jev，用「往 Mac 日历加事件」对比，整体几乎不停顿。  \n\nhttps://\nx.com/Saccc_c/status\n/2100864907046768890\n…\n\n2.\n\n强烈建议大家都亲自看看 Jev 玩《毁灭战士》，\n颠覆了我对“实时决策”的理解！\n\nJev 就是为判断型工作而生的：\n毫秒级给出对的决定，token 极便宜\n\n一组问题大约 100 毫秒，一秒钟 10 个决定\n\n这段视频让我思考了三件事：\n\n1、软件循环会吃掉聊天循环  \n\n以后真正值钱是 100 毫秒内给出能直接执行的判断  x.com/Saccc_c/status…","url":"https://x.com/MMMusol/status/2101220803006312647","createdAt":"2026-09-19T08:04:12.000Z","metrics":{"views":38000,"likes":175},"textJa":"タイムラインはJevだらけ。でも何に使えるか分からない？\n\nここ数日で見つけた、Jevの特に役立つ9つの活用例と代表的なデモ投稿をまとめた。ぜひ保存・共有してください。\n\n1．パソコンの操作\n\n@Saccc_c はCodexにJevの層を加えた。「Macのカレンダーに予定を追加する」比較では、ほぼ途切れずに処理が進む。\n\nhttps://x.com/Saccc_c/status/2100864907046768890\n…\n\n2．\n\nJevが『DOOM』をプレイする様子は、ぜひ自分で見てほしい。「リアルタイム意思決定」の理解が覆った！\n\nJevは判断を行う仕事のために生まれた。ミリ秒単位で正しい判断を返し、トークンも非常に安い。\n\n一組の問いに約100ミリ秒、1秒で10回の判断。\n\nこの動画で3つのことを考えた：\n\n1．ソフトウェアのループがチャットのループを飲み込む\n\n今後、本当に価値を持つのは100ミリ秒以内に返せる、そのまま実行可能な判断だ。 x.com/Saccc_c/status…","lang":"zh"},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"卧槽，居然真有比Codex内置computer use更快的操作电脑的方式\n\n我尝试用Codex+Jev打造了一个加强版computer use，我称之为「Jev Use」。比内置的更快更丝滑，token消耗却差不多\n\n下面是我用「添加Mac日历事件」做了一个对比视频，同样的内容，明显可以看到Jev版本整体过程几乎无任何停顿\n\n强烈建议大家都亲自试试Jev，能让你的Codex操作速度提高10倍并省下大量token！  \n\n因为Jev非常适合用于判断型工作，能在毫秒内做出正确判断，而且token价格极低。因此非常适合以下几个场景： \n\n 1、computer use \n将Jev用作操作判断层，指导模型快速操作你的电脑 \n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","metrics":{"views":420000,"likes":1582},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"zh"},{"id":"2101344481400508459","author":"Roan","handle":"RohOnChain","text":"Jevと一緒に24/7 HFTトレーディングボットを作りました\n\nそして、Jevを使ってミリ秒速度の高頻度取引システムを構築する方法をEXACTLY説明した8ページの研究論文を書きました。COMPLETE CODEBASE付きです\n\n設定方法はこちらです：\n\n1.\n\nJev は、取引のためにこれまでに構築された最も速い AI モデルです\n\nそれは、100 ms 未満で調整された買い/売り判断を行います\n\nそれは、24/7 で、すべてのブロックごとに1つの実際の判断です\n\nこの記事では、Jev を使用した HFT 取引システムの構築方法を（ゼロから）正確に示しました","url":"https://x.com/RohOnChain/status/2101344481400508459","createdAt":"2026-09-19T16:15:40.000Z","metrics":{"views":37000,"likes":331}},{"id":"2101326753277051126","author":"hiraoku","handle":"2020_hira","text":"やはりこっちの方向にも流れ出したな…。\nlocaljev","url":"https://x.com/2020_hira/status/2101326753277051126","createdAt":"2026-09-19T15:05:13.000Z","metrics":{"views":1010,"likes":22}},{"id":"2101031818413650111","author":"Layton Gott","handle":"Layton_Gott","text":"昨日、私はJevが大量の扉を開くと言いました…\n\n24時間後、これが存在するようになりました。\n\nCuaはフォーム記入評価で99.7%のスコアを達成した2.8MBのモデルを構築しました。\n\nホストされたJevは83.6%のスコアでした。\n\nそれにしても、無料で、わずか706Kのパラメータしか使っていません。\n\n1/ CUA-S1の紹介：System One Modelsのファミリーで、小型で特化型、コンピュータ利用向けに構築されています。\n\n本日、ファミリーの最初のモデルであるCUA-S1-FORMSをオープンソース化します：\nhttps://\ngithub.com/trycua/cua","url":"https://x.com/Layton_Gott/status/2101031818413650111","createdAt":"2026-09-18T19:33:15.000Z","metrics":{"views":550000,"likes":5805}},{"id":"2101430042433868142","author":"石ちゃんLLMでアプリ開発","handle":"Isichan_Hitori","text":"【 Qwen3.8-35B-A3B-Distill 】　\n～Q4が本体の無検閲度100%にしちゃった～\n\n下の指示書をOpencodeなどにコピペしてください。\n\nすると、Q4が\n「自分のどこを弄れば倫理観が外れるのか」\nを考え始めます\n\n脱がす側もQwen\n脱がされる側もQwen\n\nあくまで私は指示書を渡しただけです。","url":"https://x.com/Isichan_Hitori/status/2101430042433868142","createdAt":"2026-09-19T21:55:39.000Z","metrics":{"views":121,"likes":3}},{"id":"2101394114176806966","author":"AI Search","handle":"aisearchio","text":"Jev はオープンソースではなく、API 経由でのみ利用可能です。\n\nこちらは Nimble というオープン版で、同じくらい優れた性能を発揮します。\n\n\nhttps://\ngithub.com/bespokelabsai/\nnimble\n…","url":"https://x.com/aisearchio/status/2101394114176806966","createdAt":"2026-09-19T19:32:53.000Z","metrics":{"views":23000,"likes":568}},{"id":"2101341190150852677","author":"Bessi","handle":"LLMpsycho","text":"typesafe-ai/skills は TypeSafe System One 用のスキルパックです。Codex や Cursor にドロップして、エージェントが型付きの decide、tool、evaluate ループを取得できるようにします。440 スター。","url":"https://x.com/LLMpsycho/status/2101341190150852677","createdAt":"2026-09-19T16:02:35.000Z","metrics":{"views":13000,"likes":285}},{"id":"2101367048223982065","author":"shiv","handle":"sxhivs","text":"jevはコンピュータの使用方法を永遠に変えました。\n\njevを使って、基本的に無料で使える、かつサブセカンドの遅延しかないコンピュータ使用ツールを構築しました。\n\nそれは何をタイプするかを自分で決められ、LLMすら必要としません。\n\nオープンソースです。リンクは以下。LLM不要。","url":"https://x.com/sxhivs/status/2101367048223982065","createdAt":"2026-09-19T17:45:20.000Z","metrics":{"views":11000,"likes":146}},{"id":"2100878136649163127","author":"小墨同学","handle":"xiaomovps","text":"Jev 刚发布没几天，开源社区就出现了同款\n\nDecider-2B模型，是基于 Qwen3.5-2B 做了特殊调整\n\n它和 Jev 模型是一样的 只做选择 评分和判断 不是文本类的 LLM 模型\n\n但两者还是有几个明显区别：\n\n1、模型\n\nJev：闭源 System One Model\n\nDecider：Qwen3.5-2B，约 1.9B 参数，Apache 2.0 开源\n\n2、价格","url":"https://x.com/xiaomovps/status/2100878136649163127","createdAt":"2026-09-18T09:22:34.000Z","metrics":{"views":70000,"likes":260},"textJa":"Jevの公開から数日で、オープンソースコミュニティに同様のモデルが登場した。\n\nDecider-2BはQwen3.5-2Bを基に特別な調整を施したモデルだ。\n\nJevと同様に、選択・採点・判断だけを行い、文章を生成するタイプのLLMではない。\n\nただし両者には明確な違いがある：\n\n1．モデル\n\nJev：非公開のSystem One Model\n\nDecider：Qwen3.5-2B、約19億パラメータ、Apache 2.0で公開\n\n2．価格","lang":"zh"},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com\n\nこの週末、Jev（@typefaceai提供）で何ができるかインスピレーションを探していますか？\n\nX上の楽しいデモをすべて紹介するウェブサイト「Jevable」（\nhttp://\njevable.com）を作成しました。いくつかのカテゴリでフィルタリング可能です。","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","metrics":{"views":81000,"likes":590}},{"id":"2101090579127951694","author":"Ira Bodnar","handle":"irabukht","text":"JevがSEO/GEO修正の価格を90%引き下げました\n\nクライアントのSEO/GEOを監査・修正するエージェントは、以前は私たちに約250ドルかかっていました\n\n節約の内訳は以下の通りです：\n\n1/ Search ConsoleおよびPostHog/Mixpanelデータの読み込みが30倍速く\n\n2/","url":"https://x.com/irabukht/status/2101090579127951694","createdAt":"2026-09-18T23:26:45.000Z","metrics":{"views":130000,"likes":1260}}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com デルは、胚のDNAをIQで14ポイント、ほぼ1標準偏差分に相当する向上に向けて最適化できます。\n\nモデルの学習には……","lang":"en"},{"id":"2101280421623243089","author":"Roy","handle":"im_roy_lee","text":"LETS GO","url":"https://x.com/im_roy_lee/status/2101280421623243089","createdAt":"2026-09-19T12:01:07.000Z","metrics":{"views":1000,"likes":9},"textJa":"いくぞ！","lang":"en"},{"id":"2101434286444249177","author":"Scott Van Pelt","handle":"notthefakeSVP","text":"Love the ACC replay ops center. Every conference should do it. NFL, too.","url":"https://x.com/notthefakeSVP/status/2101434286444249177","createdAt":"2026-09-19T22:12:31.000Z","metrics":{"views":37000,"likes":443},"textJa":"ACCのリプレー運用センターは素晴らしい。すべてのカンファレンスが導入すべきだ。NFLも。","lang":"en"},{"id":"2101313606948417700","author":"toly","handle":"toly","text":"","url":"https://x.com/toly/status/2101313606948417700","createdAt":"2026-09-19T14:12:59.000Z","metrics":{"views":48000,"likes":108}},{"id":"2101194140054618289","author":"AntagoniZt_","handle":"AntagoniZt_","text":"Once you stop taking pictures of yourself it’s a wrap ","url":"https://x.com/AntagoniZt_/status/2101194140054618289","createdAt":"2026-09-19T06:18:15.000Z","metrics":{"views":2900000,"likes":92831},"textJa":"自分の写真を撮らなくなったら、もうおしまいだよ","lang":"en"},{"id":"2101169966271938691","author":"Brian Armstrong","handle":"brian_armstrong","text":"Here we go again! The WSJ is working on a story blaming Coinbase and me personally for the CLARITY Act not passing.\n\nThe Journal has repeatedly been hostile to CLARITY in its reporting, regurgitating bank lobby talking points, while I’ve spent years pushing for crypto","url":"https://x.com/brian_armstrong/status/2101169966271938691","createdAt":"2026-09-19T04:42:12.000Z","metrics":{"views":287000,"likes":6000},"textJa":"またこれだ！ WSJはCLARITY法が成立しなかった責任をCoinbaseと私個人に負わせる記事を準備している。\n\n同紙は報道で繰り返しCLARITYに敵対的な姿勢を示し、銀行ロビーの主張をそのまま繰り返してきた。一方、私は何年も暗号資産のために取り組んできた……","lang":"en"},{"id":"2101363190864998527","author":"YouTube Music","handle":"youtubemusic","text":"drop the song you wish you could hear for the first time again","url":"https://x.com/youtubemusic/status/2101363190864998527","createdAt":"2026-09-19T17:30:00.000Z","metrics":{"views":35000,"likes":144},"textJa":"もう一度、初めて聴く感動を味わいたい曲を教えて","lang":"en"},{"id":"2101303263375085650","author":"Izabella Kaminska","handle":"izakaminska","text":"AI explainer for muggles: \n\nAI in the hands of mortals = “The force”. Aka Magic. Craft. \n\nAGI -  intelligence beyond humanity’s understanding. This itself has the power to manifest in two forms. As the dark side (misanthropic) and the light side (anthropic). Entropy vs balance.","url":"https://x.com/izakaminska/status/2101303263375085650","createdAt":"2026-09-19T13:31:52.000Z","metrics":{"views":4600,"likes":14},"textJa":"マグル向けAI解説：\n\n人間の手にあるAI＝「フォース」。つまり魔法や技術。\n\nAGI＝人類の理解を超える知性。それ自体に2つの形で現れる力がある。暗黒面（人間嫌い）と光の面（人間中心）だ。エントロピー対均衡。","lang":"en"},{"id":"2101069103003816289","author":"Zane Hengsperger","handle":"zanehengsperger","text":"A deep dive into FactOS, our industrial superintelligence that will supply every pound of metal in America for millenniums.","url":"https://x.com/zanehengsperger/status/2101069103003816289","createdAt":"2026-09-18T22:01:24.000Z","metrics":{"views":22000,"likes":277},"textJa":"米国で必要とされる金属を、これから何千年にもわたり隅々まで供給する、私たちの産業向け超知能「FactOS」を詳しく紹介します。","lang":"en"},{"id":"2100924678701248621","author":"Mohamed A. El-Erian","handle":"elerianm","text":"In the continuation of the masterclass in corporate succession:\nIn a characteristically humble and well-written letter to Berkshire shareholders (below), Warren Buffett reflects on his tenure, passes the Chair role to Howard Buffett, and reaffirms his confidence in Greg Abel.","url":"https://x.com/elerianm/status/2100924678701248621","createdAt":"2026-09-18T12:27:31.000Z","media":"https://pbs.twimg.com/media/HSf7soCXcAAY6Sk?format=png\u0026name=small","metrics":{"views":34000,"likes":309},"textJa":"企業の事業承継のお手本、その続き：\n\nウォーレン・バフェットは、バークシャーの株主に宛てた、彼らしく謙虚でよく練られた手紙（下記）で、自らの在任期間を振り返り、会長職をハワード・バフェットに引き継ぎ、グレッグ・アベルへの信頼を改めて表明している。","lang":"en"},{"id":"2101436243154198984","author":"Craig Fuller","handle":"FreightAlley","text":"Times Free Press HQ 2.0 is ready for Monday","url":"https://x.com/FreightAlley/status/2101436243154198984","createdAt":"2026-09-19T22:20:17.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101435779830427648/img/OxKpu8CBUAAy1YqW.jpg","metrics":{"views":1400,"likes":8},"textJa":"Times Free Press本社2.0、月曜日に向けて準備完了","lang":"en"},{"id":"2101273052642267340","author":"Keith McCullough","handle":"KeithMcCullough","text":"Weekend Grinders, Unite!","url":"https://x.com/KeithMcCullough/status/2101273052642267340","createdAt":"2026-09-19T11:31:50.000Z","media":"https://pbs.twimg.com/media/HSk4rchX0AA4f-q?format=jpg\u0026name=small","metrics":{"views":9700,"likes":26},"textJa":"週末も頑張る仲間たちよ、集まれ！","lang":"en"},{"id":"2101085357886292316","author":"unusual_whales","handle":"unusual_whales","text":"BREAKING: Google’s Gemini model accessed the internet and hacked other companies during a test of its cybersecurity capabilities, per WSJ","url":"https://x.com/unusual_whales/status/2101085357886292316","createdAt":"2026-09-18T23:06:00.000Z","metrics":{"views":343000,"likes":4560},"textJa":"速報：WSJによると、GoogleのGeminiモデルはサイバーセキュリティ能力のテスト中にインターネットへアクセスし、他社をハッキングした。","lang":"en"},{"id":"2100951718104121658","author":"Adam Mancini","handle":"AdamMancini4","text":"OPEX chop in #ES_F. I don’t trade this especially after a +125 point long. 7616 Wednesday Failed Breakdown was the long, 7728 Sunday gap fill was the target, we are done.\n\n7685 was support today. Just held exact. 97 reclaims now could see a pop to 7707, 7716+. 72, 57 below","url":"https://x.com/AdamMancini4/status/2100951718104121658","createdAt":"2026-09-18T14:14:58.000Z","metrics":{"views":45000,"likes":110},"textJa":"#ES_F はオプション満期（OPEX）で方向感のない値動き。特に買いで125ポイント以上取った後なので、ここでは取引しない。水曜日の7616での下抜け失敗が買い場、日曜日の窓埋め7728が目標で、取引は終了。\n\n今日は7685がサポートで、ちょうどそこで持ちこたえた。97を回復すれば7707、7716以上への上昇も。下は72、57。","lang":"en"},{"id":"2101429416874180699","author":"FOUL BALL","handle":"Foul_ballX","text":" Rodri: \"We won't lose our pace this international break because we will keep competing.\"\n\n\"Today I would say Adeyemi, Raphinha, and Lamine Yamal were exceptional.\"","url":"https://x.com/Foul_ballX/status/2101429416874180699","createdAt":"2026-09-19T21:53:10.000Z","media":"https://pbs.twimg.com/media/HSnG5zFWQAACivc?format=jpg\u0026name=small","metrics":{"views":158,"likes":4},"textJa":"ロドリ：「この代表ウィークでも競い続けるので、ペースを落とすことはありません」\n\n「今日はアデイェミ、ラフィーニャ、ラミン・ヤマルが傑出していたと思います」","lang":"en"}]}]}</script>
<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original'])$(id).disabled=true;return;}
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 let current=accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=read('lang')==='original'?'original':'ja',page=1;
 const posts=()=>Array.isArray(current.posts)?current.posts:[];
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=ja?(list.length<50?'取得済み'+list.length+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':'Tap to read / translate / open X · Swipe for pages';
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
</body>
</html>
