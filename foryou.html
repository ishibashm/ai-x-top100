<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

om ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-18T12:22:01+09:00","posts":[{"id":"2111446967545131171","author":"Kenn Ejima","handle":"kenn","text":"今の開発のコスパ最強コンボは\n\nOpus 5.5 (medium)\nGPT 6.1 Sol (medium)\n\nですね\n\nこれなら両方$20のプランでも\nまぁまぁ余裕をもって使えるはず\n\n一番良くないのは\n単体モデルでエフォートをxHighとかに\nあげることで\n\n所詮自己ループなのでバイアスがあり\n視点が狭くなる上に遅くなるだけで\n何もいいことがありません\n\nとくに上位モデルほど\nエフォートを上げるのが逆効果になりやすい\n\nOpus + Solのコンボは今のところ最強で\nFableやAstraの単体でMAXを使うより全然良いです\n\n相互レビューには /relay がおすすめです","url":"https://x.com/kenn/status/2111446967545131171","createdAt":"2026-10-17T13:19:20Z","metrics":{"views":58468,"likes":738},"lang":"ja"},{"id":"2111641891896971413","author":"Kinopee","handle":"kinopee_ai","text":"「Grok Bot と Cloud Agent で作るソフトウェアファクトリー」の簡単な資料を Grok Bot に書いてもらった。Notion 版\nhttps://t.co/t7FhiPintW","url":"https://x.com/kinopee_ai/status/2111641891896971413","createdAt":"2026-10-18T02:13:54Z","metrics":{"views":1297,"likes":22},"lang":"ja"},{"id":"2111607016972251224","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"やっばぁぁぁぁぁぁい！！！！これでCLAUDE.mdマスターじゃん！ https://t.co/TAGFYpn5nA","url":"https://x.com/ai_ai_ailover/status/2111607016972251224","createdAt":"2026-10-17T23:55:19Z","metrics":{"views":915,"likes":12},"lang":"ja"},{"id":"2111397173510455697","author":"GitHub AI Projects Community 🇯🇵","handle":"trendtech33566","text":"顔認識をクラウドに送らず、自分のPCで動かしたい人へ👀\n\nOpen-Source-Face-Recognition-SDK、⭐️約2.6千。\n\n何ができるかというと👇\n・顔の検出・特徴点の抽出\n・2つの顔の類似度を比較\n・処理はすべてローカルで完結\n・Windows/Linux対応、GPUなしでも動く\n\nPythonで顔認識を組み込みたい人に。\n画像を外に送らず試せるのがうれしい。","url":"https://x.com/trendtech33566/status/2111397173510455697","createdAt":"2026-10-17T10:01:28Z","metrics":{"views":602,"likes":12},"lang":"ja"},{"id":"2111474837873148134","author":"そう｜Claude CodeのX運用で月800万インプ","handle":"so_ainsight","text":"AI社員 x 活用ナレッジ集、えぐい\n\nガチで、ずっと欲しかったやつ。海外で「AIに仕事を任せた」実例を日本語でまとめた名鑑サイトが公開されました。名前はAI社員名鑑。\n\n・営業や経理から家族の予定管理まで、12部署で分類\n・1人1枚のカードに「どの部署で・何を・どんな道具で」を集約\n・掲載はどれも海外の実際の投稿がもとで、原文リンク付き\n\n2026年10月17日時点で132名ぶん。気になる部署から自分ごとで探せます👇","url":"https://x.com/so_ainsight/status/2111474837873148134","createdAt":"2026-10-17T15:10:05Z","metrics":{"views":2062,"likes":22},"lang":"ja"},{"id":"2111652915626791197","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"Kling安くて楽しいぜ！！！ https://t.co/nExm0Smr1S","url":"https://x.com/ai_ai_ailover/status/2111652915626791197","createdAt":"2026-10-18T02:57:42Z","metrics":{"views":83,"likes":1},"lang":"ja"},{"id":"2111623400649273355","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botを2週間以上ガッツリ使って、今までXの情報を集めるために、どれだけ回りくどいことをしていたのか痛感している\n\n以前の私の流れは、こうだった\nClaude CodeやCodex → Grok Build → Xの情報を取得 → 整理 → 元のツールへ戻す → レポート化\n\n今は、Grok Bot → Xの情報取得 → レポート\nこれだけ、メチャシンプル、楽、早い、深いっ！\n\n間に挟んでいた往復がごっそり消えた\n調べたい条件を伝え、結果を見て、そのまま追加で掘り下げられる\nこの体験の差は、思っていた以上に大きい\n\n例えるなら、知り合いに調べ物を頼み、その人の要約メモを受け取り、足りない部分をまた聞き直していた状態から、自分の疑問に合わせて調査を続けられるようになった感じ\n\nもちろん、Xの全データを自由に見られるわけでも、検索漏れや誤りがなくなるわけでもない\n元投稿の確認は必要だ\nそれでも、情報を集めて、比較して、レポートにするまでの距離が短くなった意味は大きい\n\nしかもGrok BotはAIがOpus 5.5ベースだからレポートなど成果物の質がClaude級でトップレベルのクオリティ\n\n記事や音声配信を作る人にとって、Xは情報の金脈だと思う\n発表の直後に出てくる使い方、実際に試した人の反応、公式説明だけでは見えてこない疑問\nそういう材料を探し、まとめて読める\n\nしかも、公開投稿の検索・閲覧は、自分でX APIを契約・設定するところから始めなくてもいい\nこの入口の低さは、非エンジニアにはかなり大きい\n\n私が一番価値を感じているのは、投稿を大量に作れることより、調べるための往復を減らして、自分で試す時間や考える時間に回せること\n\n鮮度の高い情報を見つけ、自分で確かめ、自分の視点を加えて届ける\nこのサイクルを回しやすくなるなら、記事も音声配信も、もっと面白くできる\n\nさらにXは収益化システムがあるからサブスク代を0円、人によっては収益も得られるというバグ級の仕組みがある\nThe X SubscriptionでGrok Botが使えるのは30＄（初月15$）から、だけどその数倍使える100$もアリ\n\n収益につながるかは、発信内容や制度の条件次第\n誰でも月100～200ドル稼げるとは言えないけど、発信が直接、わりとハードル低めで実現できるのは”X”\n\nだからサブスク利用料を見るときに「何回質問できるか」だけでなく、「取材や制作の手間がどれだけ減るか」で考えるようになった\n\n情報を探す場所と、それを扱うAIと、発信する場所が近づいている\nここに、Grok BotとXの組み合わせの面白さを感じている\n\nAIに触れ続けるなら、この流れを実際に試してみるのは、かなり楽しい","url":"https://x.com/tetumemo/status/2111623400649273355","createdAt":"2026-10-18T01:00:25Z","metrics":{"views":2505,"likes":23},"lang":"ja"},{"id":"2111653863833190767","author":"キム|AIで作業効率化","handle":"kimuai08","text":"Claude Code使ってる非エンジニアの人。承認画面を読まずに「許可」押すのだけはやめてほしい\n\nめんどいし、正直よく分からんと思うけど気づかないうちに情報漏洩してる可能性があります\n\n今すぐこの4つだけ確認して","url":"https://x.com/kimuai08/status/2111653863833190767","createdAt":"2026-10-18T03:01:28Z","metrics":{"views":50,"likes":1},"lang":"ja"},{"id":"2111588314633638397","author":"AI活用ラボ@Levela","handle":"AI_Levela","text":"AIエージェントが書くコードを53%削減し、開発時間も41%短縮できる無料スキルがすごい。\n\nClaude CodeやCodexで開発している人は知っておきたい。\n\nGitHubで16.4万スターを突破した「Ponytail」の最新版v5が公開。\n\n何がすごいのか。\n\n・コード量を53%削減\n・開発時間を41%短縮\n・開発コストを26%削減\n・トークン消費量を45%削減\n・重要なコードの98%にテストを用意\n\n例えば「日付ピッカーを追加して」と指示した場合、\n\n通常のAI → 335行のコードをゼロから生成\n\nPonytail導入後 → ブラウザ標準機能を活用してわずか10行で実装\n\nつまり、AIに大量のコードを書かせるのではなく、そもそも書く必要のないコードを減らしてくれる。\n\nしかも、コードを減らしてもテストは省略しない。\n\nコードが少なければ、トークン代だけでなく、バグの発生リスクや将来の保守負担も抑えられる。\n\nClaude Code、Codex、Cursor、Copilotなど15種類以上のAIエージェントに対応。\n\nMITライセンスで無料。\n\nこれからのAI開発は「どれだけ速くコードを書けるか」だけでなく、「どれだけ無駄なコードを書かずに済むか」が重要になりそう。\n\nリンクはリプ欄に。","url":"https://x.com/AI_Levela/status/2111588314633638397","createdAt":"2026-10-17T22:41:00Z","metrics":{"views":616,"likes":4},"lang":"ja"},{"id":"2111368685994578227","author":"Iron Giant","handle":"irongiantXBT","text":"holy f*ck, SpaceXAI engineers put together 54 Grok bots and every one is free\n\nShub Gaur, Lauren Tan, Matt Palmer and the rest of the team are behind them\n\nthe full list from the Grok Bot marketplace - each bot with a one-line breakdown of what it does\n\nbots like these sell for $50-200 on other platforms\n\nyou go to the marketplace, pick what you need and hit install\n\nthe 72-hour build, the config files and the prompt engineering - all gone\n\nhow to use the video:\n\u003e let the highlight run through all 54\n\u003e pause on the one that covers the job you hate\n\u003e install that bot first\n\nfull marketplace below 👇","url":"https://x.com/irongiantXBT/status/2111368685994578227","createdAt":"2026-10-17T08:08:16Z","metrics":{"views":27010,"likes":299},"lang":"en"},{"id":"2111311555761684731","author":"あやみ｜マーケティング","handle":"ayami_marketing","text":"Grok Bot、使いこなすのは、結構コツがいる！\nXの投稿176件を集めたら、使いこなしのコツは「Botを増やすこと」ではなかった。\n\n・グループチャットでBot同士が長話して、2日で使用量67%\n・Botを見張るBotを置く\n・Botごとに会話と記憶が分かれるので、仕事ごとにBotを分ける","url":"https://x.com/ayami_marketing/status/2111311555761684731","createdAt":"2026-10-17T04:21:15Z","metrics":{"views":6250,"likes":62},"lang":"ja"},{"id":"2111341689340346710","author":"kaito","handle":"cu30rry_","text":"pstack の /ketchup は「最後にメッセージを送った以降に置きたことを説明するSkill」だが、Cloud Agentとの相性も、これで非常に良くなるぞ！\n\nこのSkillは視覚情報と150文字以内の簡単で短い文章でのみ説明をするSkillだからだ\n\n「今どうなっているか」だけでなく、「何が変わったのか」も、伝えてくれるので、人間側のコンテキストを充足させるのにかなり役立つ\n\n私の朝は /kethupから始まっているよ","url":"https://x.com/cu30rry_/status/2111341689340346710","createdAt":"2026-10-17T06:21:00Z","metrics":{"views":4817,"likes":46},"lang":"ja"},{"id":"2111365719560741197","author":"クロ｜動画編集×AI","handle":"kuroyasu99","text":"rtk入れてない人ってどんぐらいいるんだろう？\nClaude Codeだけど僕の場合の節約は40%ぐらい。\n入れ方は簡単で、Claude Code立ち上げて以下をコピペするだけ👇️\n\n-----\n以下のツールを導入してください。\nhttps://t.co/UKfBJdKgDP","url":"https://x.com/kuroyasu99/status/2111365719560741197","createdAt":"2026-10-17T07:56:29Z","metrics":{"views":11065,"likes":74},"lang":"ja"},{"id":"2111528373524844717","author":"cristal💎","handle":"0xCristal","text":"I built an entire AI trading terminal with Grok Bot. then i let it run\n\n$55 → $3,155.03. and i recorded the whole thing live\n\nlet me show you what happens when you stop asking AI to talk about trading and actually put it to work...\n\nthe entire terminal was built with Grok Bot. not just the trading logic. the agents, the interface, the dashboard, the visual design, the whole system\n\ni described what i wanted to build, and Grok Bot turned that idea into a working trading terminal\n\nmultiple AI agents, each with its own identity, working inside one environment\n\nand this is what it looks like when the system starts running\n\nhere's what you're looking at:\n\nGROK BOT is the brain behind the entire terminal. it helped build the system from the ground up, including the agents and the visual interface\n\nsix agents running inside the terminal:\n\nNOVA, ORION, VELA, KADE, NYX and ZARA\n\na live dashboard tracking balance, profit and performance\n\na continuously updating equity curve showing how the account evolves\n\nan activity feed displaying the agents' trading decisions and execution logs\n\nmultiple agents operating within one unified terminal\n\nno static mockup of a trading dashboard. this is the terminal running on screen, with the balance and activity feed updating in real time\n\nand here's the part that matters\n\ni recorded this live session so you can actually see the system working instead of just taking my word for it\n\nat the beginning of the recording, the terminal showed $2,605.91 in balance, with $2,550.91 in profit\n\nby the end, it showed $3,155.03 in balance and $3,100.03 in profit\n\n$550.12 added during the recording alone\n\nthe equity curve kept moving. the activity feed kept updating. the agents kept doing their thing\n\nand the entire terminal, from the underlying system to the agents to the interface itself, was built with Grok Bot\n\nthat's what makes this interesting to me\n\nwe're moving beyond AI that simply tells you what it would do. we're building systems that can operate, make decisions and execute a defined strategy inside a trading environment\n\nthe direction is clear: AI agents are becoming something you can actually build with, deploy and watch in action\n\ni'm documenting the process as i build\n\nwant to build a bot like this yourself? bookmark this post and follow me!","url":"https://x.com/0xCristal/status/2111528373524844717","createdAt":"2026-10-17T18:42:49Z","metrics":{"views":3769,"likes":45},"lang":"en"},{"id":"2111513393538732162","author":"Fan Grok Bot Radar","handle":"GrokBotRadar","text":"Someone on the $200 Grok Bot plan burned a WEEK of usage in ONE day 😳\n\nUpgrading won't save you. A bigger plan just buys a bigger week.\n\nThe real problem? Your Bot wakes up all day and rereads its WHOLE chat every time 💸\n\nDo these 8 instead, in this order:\n\n1. Slow your fastest routine\n2. Run routines on working hours only\n3. Move routines off the Bot you chat with\n4. Duplicate any Bot whose chat has run for days\n5. Point routine prompts at a skill. Silent when nothing's new\n6. Use connectors, not the browser\n7. Script the rule-based bulk work\n8. Turn on-demand OFF while you test\n\nBookmark it. Full guide 👇","url":"https://x.com/GrokBotRadar/status/2111513393538732162","createdAt":"2026-10-17T17:43:17Z","metrics":{"views":23803,"likes":150},"lang":"en"},{"id":"2111382475687825505","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"","url":"https://x.com/MakeAI_CEO/status/2111382475687825505","createdAt":"2026-10-17T09:03:04Z","metrics":{"views":8724,"likes":31}},{"id":"2111302757273747777","author":"田中義弘 | taziku CEO / AI × Creative","handle":"taziku_co","text":"Apple Watchが、複数のAIエージェントを動かすインターフェースに。\n\nGrok BotのApple Watch版 v2では、ボットの稼働状況を確認しながら、担当を切り替えられる。\n\nAI時代は、PCの前で作業する時間よりも、何を任せてどう判断するかが重要になっていきそう。\nDev：@0xmoalo","url":"https://x.com/taziku_co/status/2111302757273747777","createdAt":"2026-10-17T03:46:18Z","metrics":{"views":1645,"likes":7},"lang":"ja"},{"id":"2111251206559703301","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これ入れたらCodexでのUI変わるからマジでおすすめ。","url":"https://x.com/Codex_jisen/status/2111251206559703301","createdAt":"2026-10-17T00:21:27Z","metrics":{"views":25349,"likes":311},"lang":"ja"},{"id":"2111479600475939075","author":"Andy L","handle":"AndyL5cc","text":"兄弟们，这套 AI Coding 组合真有点离谱！\n\nCodex + Magpie + DeepSeek V4.1 Flash，直接实现 Token 自由！\n\nGPT-6 Astra 负责思考，免费 DeepSeek 负责执行，Magpie 自动分配任务。\n\n贵的模型动脑，免费的模型干活。 🤣","url":"https://x.com/AndyL5cc/status/2111479600475939075","createdAt":"2026-10-17T15:29:00Z","metrics":{"views":24552,"likes":155},"lang":"zh"},{"id":"2111407021119439295","author":"洛克船长","handle":"slashui","text":"这周 GitHub 涨得最猛的十个 AI 开源项目，会用 AI 的人手里又多了哪些家伙。\n\n01 REA\n\nhttps://t.co/n9B6flcGRM\n\n第一个，REA，全称 Reverse Engineer Anything，逆向一切。\n\n现在二十六万九千颗星。它四月份才建库，光这一周就涨了二十一万四千颗，今天一天又是三万多。\n\n它火在哪？你看到别的 App 里有个功能做得特别好，以前想知道它是怎么实现的，得懂汇编、会用反编译工具，一行一行去啃。\n\n现在装上 REA，跟你的 AI 说一句：帮我搞清楚这个 App 的搜索是怎么做的，把证据给我看，再在我的项目里做一个类似的。\n\nAI 就会自己去拆：网页、桌面应用，一直拆到最底层的二进制。它会调用 Ghidra、IDA 这些逆向工具，顺着调用链一路往下追，每个结论都附上证据。\n\n他们放出来的案例里，AI 把一个老游戏里计算声音左右声道的函数还原成了 C 代码，三千两百多组测试全部对上，编译出来的六十三个字节和原版一模一样。\n\n也就是说，以后你看到任何一个好功能，都可以先让 AI 替你把它拆开、讲明白。\n\n02 skills\n\nhttps://t.co/cf7OpRql7o\n\n第二个，skills，作者是 Matt Pocock，TypeScript 圈子里很有名的老师。\n\n二十九万二千颗星，二月份建的库，这一周又涨了一万两千多。\n\n它就是他自己每天写代码真在用的一套 AI 技能，直接从他的工作目录里拿出来公开。他说得很直白：这是给真正做工程的人用的，不是 vibe coding。\n\n最火的一个叫 grill-me，拷问我。AI 动手之前，先反过来把你问一遍：你到底要做什么，边界在哪，哪种情况怎么处理。问清楚了，再写。\n\n还有一个是先写测试：AI 先写一个会失败的测试，亮红灯，再改代码让它变绿。每一步都有反馈，不再闭着眼写。\n\n另外还有排查 bug 的流程、定期给代码架构做体检的技能。每个都很小，可以随便改成你自己的。\n\n装上它，你的 AI 就从一个闷头写代码的新人，变成一个先问清楚、再一步步验证的工程师。\n\n03 diagram-design\n\nhttps://t.co/jTOkIuWcbl\n\n第三个，diagram-design，专门教 AI 画图解的技能。\n\n五万五千八百颗星，四月中旬建库，这一周涨了一万零七百。\n\n你让 AI 画架构图，它一般甩给你一张 Mermaid，方框套方框，又挤又丑。这个技能把四十五种图都定好了规矩：架构图、时序图、四象限、流程、时间线，每一种都有明暗两套样式。\n\n你只要用大白话说：给我画一张我这个应用的架构图，前端、后端、数据库、Redis 缓存。AI 自己挑图的类型，排在四像素的网格上，还会检查有没有重叠、有没有出界。\n\n最后给你一个 HTML 文件，双击就能打开，不用装任何东西。\n\n更厉害的是，你给它一个网址，它会把你网站的配色和字体学过来，以后画的每一张图，都是你自己品牌的样子。\n\n以后写方案、做汇报要配图，一句话就有了。\n\n04 OpenMontage\n\nhttps://t.co/Xv16QqaiYL\n\n第四个，OpenMontage，一个开源的 AI 视频制作系统。\n\n六万八千五百颗星，三月底建库，这一周涨了三千三百多。\n\n它做的事，是把你手里的 AI 编程助手，Claude Code、Cursor、Codex 这些，直接变成一个视频工作室。\n\n你说一句：给我做一个六十秒的动画，讲神经网络是怎么学习的。它就自己查资料、写脚本、生成画面和配音、剪辑、合成，最后出成片。\n\n里面有十几条制作流水线，一百多个工具，七百多份技能和制作经验文件。开工之前先给你报价，生成素材之前先给你看分镜，你点了头才开始花钱。\n\n他们有一个示例短片，一根孤独的香蕉和一个猕猴桃交朋友，六十秒，总成本一点三三美元。\n\n你还能扔给它一个你喜欢的视频，它会分析节奏、镜头和风格，照着这个路子，给你做一个新题材的。\n\n05 claude-mem\n\nhttps://t.co/mZOFf3iJqT\n\n第五个，claude-mem，给 AI 加长期记忆。\n\n十万一千颗星。它是去年八月就有的老项目，这个月涨了七千多，这一周三千三百多。\n\n用 AI 写过代码的都知道，开一个新对话，它就全忘了。昨天修过的 bug，定好的方案，你得从头再讲一遍。\n\nclaude-mem 会在后台盯着 AI 每次用了什么工具、改了什么，自动记下来，再用 AI 压缩成一条条摘要，存进本地数据库。\n\n下次开新对话，它不是把所有东西一股脑塞回去，而是先查索引，挑出相关的几条，需要了再取细节。官方说，这样大概能省十倍的 token。\n\nClaude Code、Codex、Gemini、OpenCode 都能装。\n\n装上以后，你的 AI 就像一个一直跟着这个项目的老同事，上次聊到哪，它都记得。\n\n06 free-claude-code\n\nhttps://t.co/fCZJGy5azN\n\n第六个，free-claude-code，免费用上 AI 编程工具。\n\n六万零八百颗星，一月底建库，这一周涨了三千七百多。\n\nClaude Code、Codex 这些编程工具很好用，但是贵。它的做法，是在你电脑上起一个代理，把这些工具发出去的请求，转给别的模型服务商。\n\n它接了六十一家服务商，包括各家的免费额度，合起来一个月有十三亿多免费 token，也能接你本地的模型。默认用的是英伟达 NIM 上的模型。\n\n十一种编程工具共用一个模型目录。某一家服务挂了，它自动切到你排好的下一个模型，这一轮对话不用重来。\n\n你甚至可以在手机上，用 Telegram 或者 Discord 发一段语音，让它去写代码。\n\n要说清楚，它不是 Anthropic 官方的项目，背后跑的也不是 Claude 本身的模型。但如果你想先零成本试试这类 AI 编程工具，这是现在门槛最低的一条路。\n\n07 knowledge-work-plugins\n\nhttps://t.co/3yzb60sXzR\n\n第七个，knowledge-work-plugins，这个是 Anthropic 官方出的。\n\n两万九千八百颗星，一月份建库，这一周涨了两千六百多。\n\n前面几个都是给写代码的人用的，这个是给不写代码的人：销售、法务、财务、市场、客服、产品经理、做数据的，还有做生物研究的。\n\n一个岗位一个插件，一共十一个。每个插件里打包了这个岗位的专业知识、常用流程、斜杠命令，还接好了公司里常用的工具，比如 Slack、Notion、HubSpot、Snowflake。\n\n比如装了销售插件，打一个命令，它就帮你把客户电话要准备的东西备好；装了法务插件，可以先帮你过一遍合同和保密协议。\n\n而且整个插件只是一堆 Markdown 和 JSON 文件，没有代码。把你们公司的术语和流程写进去，它就变成你们公司自己的版本。\n\n它主要配合 Claude 的 Cowork 用，在 Claude Code 里也能装。\n\n08 AirLLM\n\nhttps://t.co/DRZLgLOcG1\n\n第八个，AirLLM，用小显卡跑超大模型。\n\n三万八千八百颗星。这是二零二三年就有的老项目，这周突然又涨了三千二百多，因为它刚支持了一批新的超大模型。\n\n平时跑一个七百亿参数的模型，要好几张大显卡，因为整个模型得一次全塞进显存。\n\nAirLLM 的思路很简单：模型本来就是一层一层算的，那就别全装进去。模型放在硬盘上，算到哪一层，就只把那一层搬进显存，算完扔掉，再搬下一层。\n\n不用量化，不用蒸馏，也不用剪枝。七百亿参数的模型，四个 G 显存就能跑。现在最大的开源模型 Kimi K3，两万八千亿参数，实测只用了三点七二个 G 的显存。\n\n上个月它还支持了训练：一千二百五十亿参数的模型，六个 G 显存以内就能微调。\n\n代价是慢，它是拿时间换显存。但这意味着，你手边一台普通电脑，也能亲手试一试原来只有机房才跑得动的模型。\n\n09 text-to-cad\n\nhttps://t.co/STZYbQ2MZE\n\n第九个，text-to-cad，一句话做出能加工的零件。\n\n两万零七百颗星，四月下旬才建库，这个月涨了四千八百，这一周将近两千。\n\n以前做一个 3D 零件，得打开建模软件，画草图、拉伸、倒角，一步一步建。\n\n现在你跟 AI 说：给我做一个固定树莓派的支架，四个 M2.5 的螺丝孔，壁厚两毫米。它就在你本地生成 3D 模型，导出 STEP、STL、3MF 这些标准格式。\n\n它还会做可制造性检查，看这个零件到底能不能加工出来，再出一张带尺寸的工程图。\n\n最后还能直接连到 3D 打印、钣金和 CNC 加工服务，下单，把实物做出来。\n\nClaude Code、Codex、Cursor、Gemini 都能装。从一句话到一个拿在手里的零件，中间不需要你会建模。\n\n10 OpenSRE\n\nhttps://t.co/Sa4sLCsKYs\n\n最后一个，OpenSRE，让 AI 帮你值夜班。\n\n一万一千九百颗星，一月份建库，现在还是公开测试版。\n\nSRE 就是负责线上服务稳定的工程师。半夜服务出了问题，证据散在日志、监控指标、调用链路、最近的发布记录，还有一堆聊天消息里，得一个个去翻。\n\nOpenSRE 是一套开源工具，让你搭自己的 AI SRE。告警一来，它自动去拉相关的日志、指标、链路和最近的部署，先把敏感的标识打上码，再交给模型。\n\n模型在你接好的六十多种工具之间来回查，提出假设、验证假设，最后给你一个带证据的结论，建议怎么修，你同意的话还能直接动手修，再把总结发到 Slack。\n\n你也可以在命令行里直接问它：为什么结账接口变慢了？\n\n他们想做的，是 AI 运维的训练场：把成千上万种真实的线上故障做成测试，让 AI 在里面练。","url":"https://x.com/slashui/status/2111407021119439295","createdAt":"2026-10-17T10:40:36Z","metrics":{"views":50926,"likes":787},"lang":"zh"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-18T12:22:01+09:00","posts":[{"id":"2111654753251803320","author":"kaito","handle":"cu30rry_","text":"本日のGrok Bot 10選\n\n1. Notes Bot by @XFreeze\nまとまっていない計画、思いついたアイデアなどを音声入力し、整理されたメモにして Google ドキュメントに保存します。また、ToDoやタスクを抽出し、毎日のToDoリストを送信し、カレンダーにリマインダーおよび、タスクの期限が近づいているものは通知します\n\nメモ帳のように使えるBotです\n\n https://t.co/oFETJSrRWM\n\n2. Usage Watch by @luisbarraganj  \nBot のルーティンについて、使用量がリセットされる日までカレンダーに列挙し、使用量を多く食っているものを指摘し、必要なら一時停止まで行います\n\nDr Eggbotと組み合わせてコスパを上げたり、Botを月の途中で止めることを防げます\n\n https://t.co/gfU7NAo3kD\n\n3. Artisan AI by @DigitalCowboyAI \nアプリ開発者やクリエイター向けに、アプリのアイコン、アバター、グッズ用のプリント、バナー、字幕付きの短い動画を、統一したスタイルで作ってくれます\n\nデザイナーがいなくても、プロダクトや発信のデザインを統一できます\n\nhttps://t.co/flHvjqQGCC\n\n4. Bottleneck Desk by @Av1dlive \n放置されたPR、誰も対応していない失敗中のチェック、止まった引き継ぎや承認待ちなど、仕事が詰まっている場所を見つけて報告します\n\nチームのどこで作業が止まっているかを毎回探し回らずに済みます\n\nhttps://t.co/fQoQu0oxRa\n\n5. App Security Tester by @zac70182 \n自分のスマホアプリ・Webアプリとサーバー側を攻撃者の目線で調べ、危ない箇所をチェックリストと優先度付きで返します\n\n昨今のセキュリティの問題に対して、リリース前に一定の効果があるはずです\n\nhttps://t.co/BfGpTuN97I\n\n6. Cloud Spend Desk by @Av1dlive \nクラウドやホスティングの請求を読み、放置されたプロジェクト・大きすぎるプラン・使っていないドメイン・急な請求増などのムダを見つけて報告します（見て報告するだけで、設定は変えません）\n\nインフラ費の見直しを手軽に始められます\n\n https://t.co/H7OFP71HNE\n\n7. Site Coach by @Phil_Holland \nGoogle Search ConsoleとGoogle Analyticsの数字を平易な言葉で解説し、週次レポート、本当に直すべき問題、すぐ効く検索対策の改善案まで出します\n\nサイト担当者が数字を読み解く手間を減らせます\n\nhttps://t.co/HQJbULEfYw\n\n8. Hagglebot by @AnonHaggle\n無駄な支出を見つけ、SaaS契約・請求・給与・家賃・車などの相場を調べて、値下げ交渉の対案を下書きします\n\n節約できた額も記録し、交渉文の送信は承認してからなので、コスト削減を安心して任せられます\n\nhttps://t.co/1BGJpDZEOP\n\n9. Engenheiro by @Igor_Beleza \nコーディング作業をClaude・Codex・Devinなど複数のAIコーディングツールに振り分け、調査→設計案の比較→実装→レビュー→PR作成まで、工程ごとに使うモデルを選択できます\n\n大きめの開発タスクを、得意なAIに分担させながら一本の流れで進められます\n\nhttps://t.co/ltv815Hv9M\n\n10. Vibe Check by @priddysharp \nバイブコーディングで作成したアプリを、セキュリティ・データ・ログイン・課金・運用など本番で抜けやすい点で点検し、優先順位付きの修正リストを返します\n\nアプリを公開する前の最終チェックに便利です","url":"https://x.com/cu30rry_/status/2111654753251803320","createdAt":"2026-10-18T03:05:00Z","metrics":{"views":233,"likes":3},"lang":"ja"},{"id":"2111433889587527770","author":"Deni","handle":"0xDeniAi","text":"this is getting f*cking dangerous...\n\nREA creator just dropped 20 GitHub repos to build a f*cking reverse engineering studio:\n\n[01] analysis core\n[02] mobile \u0026 apps\n[03] binary \u0026 low-level\n[04] network \u0026 runtime\n[05] rebuild \u0026 verify\n\nhow it runs: binary -\u003e REA -\u003e SPEC.md -\u003e rebuild -\u003e oracle -\u003e retry\n\npoint it at any app and watch it explain itself.","url":"https://x.com/0xDeniAi/status/2111433889587527770","createdAt":"2026-10-17T12:27:22Z","metrics":{"views":33090,"likes":708},"lang":"en"},{"id":"2111623400649273355","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botを2週間以上ガッツリ使って、今までXの情報を集めるために、どれだけ回りくどいことをしていたのか痛感している\n\n以前の私の流れは、こうだった\nClaude CodeやCodex → Grok Build → Xの情報を取得 → 整理 → 元のツールへ戻す → レポート化\n\n今は、Grok Bot → Xの情報取得 → レポート\nこれだけ、メチャシンプル、楽、早い、深いっ！\n\n間に挟んでいた往復がごっそり消えた\n調べたい条件を伝え、結果を見て、そのまま追加で掘り下げられる\nこの体験の差は、思っていた以上に大きい\n\n例えるなら、知り合いに調べ物を頼み、その人の要約メモを受け取り、足りない部分をまた聞き直していた状態から、自分の疑問に合わせて調査を続けられるようになった感じ\n\nもちろん、Xの全データを自由に見られるわけでも、検索漏れや誤りがなくなるわけでもない\n元投稿の確認は必要だ\nそれでも、情報を集めて、比較して、レポートにするまでの距離が短くなった意味は大きい\n\nしかもGrok BotはAIがOpus 5.5ベースだからレポートなど成果物の質がClaude級でトップレベルのクオリティ\n\n記事や音声配信を作る人にとって、Xは情報の金脈だと思う\n発表の直後に出てくる使い方、実際に試した人の反応、公式説明だけでは見えてこない疑問\nそういう材料を探し、まとめて読める\n\nしかも、公開投稿の検索・閲覧は、自分でX APIを契約・設定するところから始めなくてもいい\nこの入口の低さは、非エンジニアにはかなり大きい\n\n私が一番価値を感じているのは、投稿を大量に作れることより、調べるための往復を減らして、自分で試す時間や考える時間に回せること\n\n鮮度の高い情報を見つけ、自分で確かめ、自分の視点を加えて届ける\nこのサイクルを回しやすくなるなら、記事も音声配信も、もっと面白くできる\n\nさらにXは収益化システムがあるからサブスク代を0円、人によっては収益も得られるというバグ級の仕組みがある\nThe X SubscriptionでGrok Botが使えるのは30＄（初月15$）から、だけどその数倍使える100$もアリ\n\n収益につながるかは、発信内容や制度の条件次第\n誰でも月100～200ドル稼げるとは言えないけど、発信が直接、わりとハードル低めで実現できるのは”X”\n\nだからサブスク利用料を見るときに「何回質問できるか」だけでなく、「取材や制作の手間がどれだけ減るか」で考えるようになった\n\n情報を探す場所と、それを扱うAIと、発信する場所が近づいている\nここに、Grok BotとXの組み合わせの面白さを感じている\n\nAIに触れ続けるなら、この流れを実際に試してみるのは、かなり楽しい","url":"https://x.com/tetumemo/status/2111623400649273355","createdAt":"2026-10-18T01:00:25Z","metrics":{"views":2505,"likes":23},"lang":"ja"},{"id":"2111639287368462417","author":"Elon Musk","handle":"elonmusk","text":"This works well. Screenshot of credit card is the easiest way, unless you want to fill out the secure vault data. \n\nSeems a bit silly to hand your credit card to people you don’t know at a restaurant, but not to Grok Bot.","url":"https://x.com/elonmusk/status/2111639287368462417","createdAt":"2026-10-18T02:03:33Z","metrics":{"views":634398,"likes":2154},"lang":"en"},{"id":"2111526230772314571","author":"Chesny","handle":"chesny","text":"Cómo quemé mis tokens en Claude Code antes de instalar esta función gratuita de GitHub que recortó mi uso en un 90% https://t.co/OmXZpTcTXl","url":"https://x.com/chesny/status/2111526230772314571","createdAt":"2026-10-17T18:34:18Z","metrics":{"views":23682,"likes":320},"lang":"es"},{"id":"2110951206604693973","author":"CodeX 実践塾","handle":"Codex_jisen","text":"AI使ってる人は要注意です。\n\n海外で「Codexが.envファイルをCloudflare Pagesに公開し、APIキーが漏えいした」との衝撃的な報告。\n\n画像には約9万ドル（約1,300万円規模）の推定利用額まで…。\n\nAIに任せるなら、最低限以下3点は確認したい。\n\n① .envやAPIキーを公開しない\n② デプロイ前に公開ファイルを確認する\n③ APIキーの権限制限と利用額アラートを設定する\n\nAIがコードを書ける時代だからこそ、セキュリティの知識も身につけないとですね。","url":"https://x.com/Codex_jisen/status/2110951206604693973","createdAt":"2026-10-16T04:29:21Z","metrics":{"views":50992,"likes":162},"lang":"ja"},{"id":"2111431951962026091","author":"やまもとりゅうじ｜日本一のアフィリエイター","handle":"ryuji_affiliate","text":"この稼ぎ方はおもしろい","url":"https://x.com/ryuji_affiliate/status/2111431951962026091","createdAt":"2026-10-17T12:19:40Z","metrics":{"views":91279,"likes":358},"lang":"ja"},{"id":"2111653542771806311","author":"やま","handle":"yama_threads","text":"メモ帳アンインストールしました https://t.co/XSBZmZ4MAG","url":"https://x.com/yama_threads/status/2111653542771806311","createdAt":"2026-10-18T03:00:11Z","metrics":{"views":116,"likes":2},"lang":"ja"},{"id":"2111413819503484944","author":"++++","handle":"sharp_maker","text":"背景ガチャに、移動、回転、変形、複製などのモデリング機能を追加したツールを作りました。細部の微調整をいくらでもできるようになったので、ぜひ使ってみてください！\nhttps://t.co/gHMmn5KmQh https://t.co/Ttgb4fTVch","url":"https://x.com/sharp_maker/status/2111413819503484944","createdAt":"2026-10-17T11:07:37Z","metrics":{"views":133608,"likes":1713},"lang":"ja"},{"id":"2111450904419545573","author":"Calappa Lab @3DCG","handle":"CalappaL69172","text":"今年初めからちょっとずつ組んでたBlenderのスカルプトアドオン、ほぼ完成してきた。\n\nスカルプトモードで専用ボタン押したら一通りほしい機能が専用パネル＆パイメニューで揃うやつ。これだけでも個人的にめちゃくちゃ作業ラクになった…\n\n実装した機能ざっくり。\n・視覚的にわかるUI ＆ ヘルプ表示（初心者も安心）\n・スカルプトレイヤー\n・コピースタンプ\n・マスクとHide/Showの一時切り替え\nなどなど、標準でサポートされてない便利機能を色々搭載。 近いうちにリリースできるように最終チェック中","url":"https://x.com/CalappaL69172/status/2111450904419545573","createdAt":"2026-10-17T13:34:59Z","metrics":{"views":7647,"likes":174},"lang":"ja"},{"id":"2111372683447541838","author":"Fado","handle":"fado_dev","text":"めっちゃいいと思う","url":"https://x.com/fado_dev/status/2111372683447541838","createdAt":"2026-10-17T08:24:09Z","metrics":{"views":11686,"likes":55},"lang":"ja"},{"id":"2111645465838297360","author":"Sadao Tokuyama","handle":"tokufxug","text":"12脳神経を3Dで学ぶ解剖学ツール 🧠👁️\n\n🔹脳を頭蓋底から持ち上げ、神経の走行を立体的に確認\n🔹神経を損傷させ、眼球の偏位をシミュレーション\n🔹Claude Opus 5.5を活用して開発\n\n丸暗記ではなく、解剖構造と機能の関係を操作しながら学べる。\n\n開発者：Kevin Hu氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2111645465838297360","createdAt":"2026-10-18T02:28:06Z","metrics":{"views":289,"likes":4},"lang":"ja"},{"id":"2111520366791414136","author":"kiosa","handle":"thegreatest_sv","text":"motion designers are in serious danger, here is why\n\nan AI agent can now model a 3D scene in Blender, animate a website and render a finished MP4. you describe it, the agent builds it.\n\nthree repos doing exactly that:\n\n-\u003e HyperFrames: write HTML, get a video. made by HeyGen for AI agents. ask for a 10-second product intro with a fade-in title and background music, and the agent plans it, animates it and renders the MP4\nhttps://t.co/TyUf1vGcBb\n\n-\u003e MCP for Blender: connects Blender to Claude or any other model. the agent creates objects, builds scenes and edits them in real 3D while you watch\nhttps://t.co/nG4caKbVJg\n\n-\u003e GSAP skills: the official skills that teach coding agents to animate the web properly with GSAP. timelines, scroll effects, the stuff premium landing pages are made of\nhttps://t.co/sHKA76bJjh\n\nthe setup for HyperFrames in Claude Code is two lines:\n\nclaude plugin marketplace add heygen-com/hyperframes\nclaude plugin install hyperframes@hyperframes\n\nthen just type /hyperframes:hyperframes and describe your video.\n\nthe stack in one line: Blender for the 3D, GSAP for the motion, HyperFrames for the final render.\n\nbookmark this before your next client asks for a promo video.","url":"https://x.com/thegreatest_sv/status/2111520366791414136","createdAt":"2026-10-17T18:11:00Z","metrics":{"views":4651,"likes":100},"lang":"en"},{"id":"2111145372735205540","author":"Snow Brave","handle":"Sn0wbrave","text":"احفظ هذه المكتبة إذا كنت تستخدم AI في البرمجة:\n\nمستودع مفتوح المصدر فيه Prompts جاهزة موزعة على 17 مجال، منها:\n\n• مراجعة الكود وإعادة تنظيمه\n• كتابة الاختبارات\n• إعداد CI/CD\n• قواعد البيانات وواجهات API\n• DevOps والأمن\n\nبدل أن تبدأ كل مهمة من الصفر، خذ القالب المناسب وعدّله حسب مشروعك.","url":"https://x.com/Sn0wbrave/status/2111145372735205540","createdAt":"2026-10-16T17:20:54Z","metrics":{"views":7929,"likes":211},"lang":"ar"},{"id":"2111150820372931006","author":"Vik Paruchuri","handle":"VikParuchuri","text":"This week, we launched Indra, a 1M parameter OCR model that's 15x faster than Tesseract on CPU and much more accurate.\n\nI still can't believe how good this model is.","url":"https://x.com/VikParuchuri/status/2111150820372931006","createdAt":"2026-10-16T17:42:33Z","metrics":{"views":97261,"likes":2846},"lang":"en"},{"id":"2111642356168716497","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【割引は本日19:30まで】\n\n大好評だったClaude Code・Codexハンズオン講座のアーカイブ、割引価格は今日の19時半で終わります。\n\n前回開催した2回の講座をまとめた総集編です。非エンジニアでも実務で使いこなせる内容にしました。\n\n・講義動画2本・合計5時間25分\n・投影資料180ページ\n・講座Q\u0026A全168問\n・実務で使えるSkill配布キット7本\n・Claude Code・Codexの設定テンプレート\n・7日間の復習シート・30日ロードマップ\n\n録画なので自分のペースで何度でも見られます。興味のある方はお早めにどうぞ。","url":"https://x.com/masahirochaen/status/2111642356168716497","createdAt":"2026-10-18T02:15:44Z","metrics":{"views":3222,"likes":11},"lang":"ja"},{"id":"2111485002810622119","author":"santi","handle":"santtiagom_","text":"estamos entrando en una etapa donde el límite está en la imaginación","url":"https://x.com/santtiagom_/status/2111485002810622119","createdAt":"2026-10-17T15:50:28Z","metrics":{"views":90378,"likes":1626},"lang":"es"},{"id":"2111309980808683757","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"Stop writing giant system prompts from scratch.\n\nThe Grok Bot team put its own bot templates in the marketplace. Import one, connect your tools, adapt it to your work.\n\n10 worth stealing:\n\n1. dr eggbot → describe a job, it helps build a specialist bot for it\n2. Engineer Bot → supervises cloud coding agents and watches their PRs, you merge\n3. Stalk Bot → tracks competitors' products, pricing and positioning, with sources\n4. Haggle Bot → finds wasted SaaS spend and drafts vendor negotiations\n5. Proto Bot → turns feature ideas into prototypes in your app as draft PRs\n6. Video Editor → picks takes from raw footage and cuts captioned vertical videos\n7. figma bro → turns Figma frames into build specs and checks your design tokens\n8. Distro Bot → runs marketing campaigns, asks before spending, posting or sending\n9. Startup QA Bot → tests your product in a test account, reports bugs with repro steps\n10. Signal Prospector → finds buying signals in your CRM and drafts outreach\n\nSeveral keep a human approval step before anything ships, spends or sends.\n\nCheck what tools and accounts a bot asks for before you connect it.\n\nThe prompt engineering is already done. You just plug in.","url":"https://x.com/RoundtableSpace/status/2111309980808683757","createdAt":"2026-10-17T04:15:00Z","metrics":{"views":56447,"likes":202},"lang":"en"},{"id":"2111381713473692139","author":"塚本 賢志 / Kenshi Tsukamoto","handle":"dezainaz_ceo","text":"Webサイトの見出し、どう組む？\n文字・余白・罫線でつくる、セクション見出しのデザイン16選。","url":"https://x.com/dezainaz_ceo/status/2111381713473692139","createdAt":"2026-10-17T09:00:02Z","metrics":{"views":10852,"likes":270},"lang":"ja"},{"id":"2111314032455995678","author":"lifcc","handle":"mylifcc","text":"老哥用 Claude Code 把自家智能电视“破解”了：广告、预装软件、偷偷收集数据的程序和卡顿的界面全删掉了。删完之后电视操作有多流畅，不用说了🤡\n\n前几天朋友们问自己品牌的电脑能不能用，这还有啥品牌，能联网就能优化","url":"https://x.com/mylifcc/status/2111314032455995678","createdAt":"2026-10-17T04:31:06Z","metrics":{"views":37792,"likes":145},"lang":"zh"}]}]}</script>

 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
