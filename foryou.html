る顔のクローズアップ、極端な俯瞰、足が重なって読めない構図、過剰な回り込みは使用しない。\n\n音楽のアクセントに短いカメラの緩急を付けるが、ダンスそのものは止めない。\n\n【カット切り替え】\n\n各コンビネーションの切り替えは、2.5秒ごとのハードカットとする。\n\nカット直後から新しいステップとカメラアングルを開始する。切り替えの前後でも音楽のリズムとダンスの勢いを維持する。\n\nクロスフェード、ディゾルブ、モーフィング、人物や背景が変形する場面転換は使用しない。\n\n【背景・映像品質】\n\n背景と照明は @image1 の基本デザインを全編で維持する。\n\n足元には一貫した床面と自然な接地影を描き、靴と床の接触を明瞭にする。\n\n高速ステップでも脚と靴の輪郭を読み取れる鮮明さを保つ。過剰なモーションブラー、残像、足の複製を発生させない。\n\n粒子、粉塵、火花、光の破片、装飾的なパーティクル、フィルムグレイン、デジタルノイズは追加しない。\n\n背景の構造が溶けたり、床が波打ったり、物体が粒子状に分解したりしない。\n\n【一貫性・ループ】\n\n顔、髪型、髪色、瞳色、体型、頭身、衣装、靴、アクセサリーを全カットで維持する。\n\n髪と衣装はステップ、ホップ、回転に合わせて自然に揺れる。\n\n人物の増殖、手足や指の増加、脚の融合、不自然な関節、靴の変形、床への足のめり込みを防ぐ。\n\n15秒間で6種類すべてのコンビネーションを披露する。\n\n最後の横スライドから最初のランニングマンへハードカットで戻り、リズムを止めずに繰り返し再生できる構成にする。","url":"https://x.com/Eris_Create_Lab/status/2114852071069679835","createdAt":"2026-10-26T22:50:00Z","metrics":{"views":13930,"likes":346},"lang":"ja"},{"id":"2114850904256221578","author":"苫米地英人","handle":"DrTomabechi","text":"In the same week as PHP2Shell, the incident most widely reported in Japan was unauthorised access to “https://t.co/gNN2rulGws Desktop Cloud”, a VPS service for automated foreign-exchange (FX) trading provided by GMO Internet. According to its announcements and press reports, events unfolded as follows.\n\nThe intrusion route has not been disclosed. GMO has stated that “a security problem existed in the system of this service”, but has not said whether PHP was running or whether PHP2Shell was involved. \n\nThe malicious program was confirmed on 20 October, before the PHP2Shell fixes were published (the evening of 21 October) and after pre-disclosure exploitation attempts were observed (17 October), but timing alone cannot establish a link. This paper does not count the case as PHP2Shell damage. Claims made by the attacker side, such as the routes of intrusion and data theft, are also unverified.\n\nEven so, the case matters for this paper’s argument. First, even with a VPS as the hosting arrangement, the damage reached inside customers’ servers. The malicious program was placed in customers’ server environments, and trading-account credentials stored on the servers were targeted. \n\nVirtualisation boundaries separate customers from one another, but they do not protect the software running inside each server or the secrets kept there. The provider is also collecting and analysing customers’ own devices, so concern now extends to those devices too. \n\nSecond, to prevent the damage from spreading, the provider stopped the servers on all plans (26,739 servers were described as potentially affected). Control panels, server creation and restoration, and remote-access infrastructure that reach many servers form common management infrastructure, where a breach at one point can spread to the whole. Which part was breached in this case has not been disclosed, but the fact that a complete shutdown had to be chosen illustrates the danger. \n\nThird, the provider decided not to restart the existing platform as it was and offered customers migration to an alternative service on an independent cloud platform. In not continuing to use a compromised environment and rebuilding from a trustworthy state, this is in line with the immutable infrastructure of Section 10.\n\nSo whether or not PHP was running, the questions the case put to organisations are the same as those of PHP2Shell. \n\nWhat runs where (the asset register)? \nWho fixed what and when, and did the fix reach the running systems (responsibility and evidence for updates)? \nWhich secrets sit on servers, and how far can an intruder reach (least privilege and secret management)? \nCan credentials and sessions be revoked immediately (response)? \nCan environments be rebuilt from trustworthy artefacts (recovery)? \n\nMoving to a VPS only redistributes these questions between provider and customer; it does not remove them. \n\nA DevSecOps capability is essential on one’s own servers, on a VPS and in the cloud alike.\n\nEnglish updated version\nReengineering National Cyber Resilience Around Existing Systems  - A Two-Stage DevSecOps Policy Informed by PHP2Shell, the History of ARPANET, UNIX and Mach, and Memory Safety\n\nHideto Tomabechi\nCyLab Carnegie Mellon University, C5I Center George Mason University, Cognitive Research Laboratories","url":"https://x.com/DrTomabechi/status/2114850904256221578","createdAt":"2026-10-26T22:45:22Z","metrics":{"views":16984,"likes":189},"lang":"en"},{"id":"2114952598101094440","author":"らいおん先生","handle":"drlion1111","text":"【速報⚡️】GMOの個人情報流出による公開処刑開始…。\n\n◾️基本情報\n・氏名\n・生年月日\n・住所\n・電話番号\n・パートナーの名前\n・職業\n・会社設立日\n・会社登録申請日\n・登録完了日\n・法人口座\n\n【対象者のプロフィール】\n・活動範囲\n・ライフステージ／家族構成\n・職業／事業\n\n※基本情報の左側には、人物写真も掲載されています。","url":"https://x.com/drlion1111/status/2114952598101094440","createdAt":"2026-10-27T05:29:27Z","metrics":{"views":22047,"likes":7},"lang":"ja"},{"id":"2115004083568554254","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【注意】iPhone・iPadを使っている方は今日中にアップデートを。日本人はiPhoneユーザー多いので必見ですね、、\n\n10/26にAppleがiOS 26.7.2を公開し、国家サイバー統括室も更新を呼びかけています。\n\n・直したセキュリティの穴（脆弱性）は134件\n・細工された画像やWebページを開くだけで、不正なプログラムを動かされるおそれがある穴も含む\n・対象はiPhone 11以降\n・設定→一般→ソフトウェアアップデートで更新できる\n\n脆弱性はスマホの鍵のかけ忘れのようなもの。公開された後は悪用を狙う人も増えるので、今すぐ充電しながら更新しておくのがおすすめです。","url":"https://x.com/masahirochaen/status/2115004083568554254","createdAt":"2026-10-27T08:54:03Z","metrics":{"views":77815,"likes":251},"lang":"ja"},{"id":"2114891789786333521","author":"秋ノ空 / AKINOSORA","handle":"AkinoSora_Sky","text":"【プロンプト配布】\n巨大な文字にキャラクターが腰掛ける、タイポグラフィポスターのプロンプトを作りました📝\n\n好きな言葉とキャラ画像を入れるだけ！\n文字とキャラが溶け合う、ちょっとおしゃれな一枚に✨\n\nメッセージを書いてもよし、\n名前を入れて自己紹介に使ってもよし！\nあなたらしい一枚を作ってみてください。\n\n▼プロンプトはリプ欄からどうぞ！▼\n\n#AIart #プロンプト配布","url":"https://x.com/AkinoSora_Sky/status/2114891789786333521","createdAt":"2026-10-27T01:27:50Z","metrics":{"views":27575,"likes":489},"lang":"ja"},{"id":"2114949210093043770","author":"りゃちお","handle":"ryachio_","text":"僕はこれから、Xがますます面白くなると思っています。\n\n理由は、クリエイターが収益を得られる仕組みが増えているから。\n\nInstagramは成熟してきた印象ですが、Xの収益化はまだ黎明期のように感じます。\n\n参入しない手はないですよね！！\n\nせっかくなら、この波に乗っていきましょ☺️","url":"https://x.com/ryachio_/status/2114949210093043770","createdAt":"2026-10-27T05:16:00Z","metrics":{"views":1683,"likes":80},"lang":"ja"},{"id":"2114764411281776760","author":"broke boy","handle":"0xfuckpoverty","text":"Elon Musk wanted Grok Bots that ship work, not bots that chat. I gave one $50 overnight and woke up to $7,684\n\nsix agents, one screen, one job each. no hand-written code.\n\nscanner → rug check → sizer → executor → logger → equity curve, plus the agents that coordinate them.\n\nwhat changed for me wasn’t the balance. it was that I stopped asking “would you long this?” and started reading why each trade happened.\n\n$50 in. $7,684 out. one night, one account, high-risk memecoin trading.\n\nthis is a single result, not typical, and not financial advice. I’m sharing the build, not telling you to trade.\n\nfull build below ↓","url":"https://x.com/0xfuckpoverty/status/2114764411281776760","createdAt":"2026-10-26T17:01:40Z","metrics":{"views":35552,"likes":230},"lang":"en"},{"id":"2114790481066615068","author":"AmirMušić","handle":"AmirMushich","text":"I open-sourced this project on GitHub\n\nCode + tutorial:\nhttps://t.co/IngAKeFX31","url":"https://x.com/AmirMushich/status/2114790481066615068","createdAt":"2026-10-26T18:45:16Z","metrics":{"views":60555,"likes":1000},"lang":"en"},{"id":"2114814754220822602","author":"lucianito.eth 🇦🇷","handle":"lpadovani_","text":"Empecé a usar @bot hace 1 mes y medio aprox, y para mi es un antes y un después.\n\nVoy a compartir cómo lo uso, cuánto tiempo me ahorra y cómo me ayuda a ser más productivo, por si le sirve a quienes no saben por dónde empezar.\n\nEmpiezo con Eve 🟣","url":"https://x.com/lpadovani_/status/2114814754220822602","createdAt":"2026-10-26T20:21:43Z","metrics":{"views":8829,"likes":86},"lang":"es"},{"id":"2114742095986725360","author":"TimSEO","handle":"Timseo_","text":"Je suis en train de créer un commando SEO de 16 agents enfermés dans un cerveau synthétique\n\nVoici mon équipe qui bosse comme durant les 30 glorieuses 🇫🇷 :\n\n🟣 Directeur SEO : pilote les projets, répartit les missions et coordonne les agents.\n\n🟣 Auditeur SEO : analyse les sites, détecte les problèmes et prépare les recommandations.\n\n🟣 Expert Technique : vérifie le crawl, la vitesse, les redirections et les erreurs techniques.\n\n🟣 Expert Indexation : détecte les pages non indexées et cherche à comprendre pourquoi.\n\n🟣 Analyste GSC : analyse les données Google Search Console et détecte les opportunités SEO.\n\n🟣 Stratège SEO : part des offres du client pour identifier les mots-clés qui peuvent générer du business.\n\n🟣 Expert Intentions : identifie les micro-intentions et les vraies questions des prospects à partir des données clients.\n\n🟣 Expert GEO : prépare les questions, les réponses et les preuves utiles pour améliorer la visibilité dans les moteurs IA.\n\n🟣 Architecte SEO : organise les pages business, les pages d'appui et les cocons sémantiques.\n\n🟣 Expert Maillage : analyse les relations entre les pages et propose les liens internes les plus pertinents.\n\n🟣 Détecteur de Cannibalisation : repère les URL qui ciblent les mêmes intentions et propose des corrections.\n\n🟣 Rédacteur SEO : prépare les briefs et les contenus à partir de l'expertise et des données propriétaires du client.\n\n🟣 Expert E-E-A-T : identifie les preuves manquantes, les cas clients et les éléments qui renforcent la crédibilité.\n\n🟣 Contrôleur Qualité : vérifie les contenus, les sources et le respect de mes méthodes avant validation.\n\n🟣 Analyste Performance : mesure les clics, les conversions et les résultats business obtenus.\n\n🟣 Chef de Projet : conserve l'historique des actions, les décisions, les validations et les prochaines priorités.\n\nc'est pour moi le futur du consulting. \n\n--------\nsi tu veux comparer avec ton système, commente « SEO » et je t'envoie le lien","url":"https://x.com/Timseo_/status/2114742095986725360","createdAt":"2026-10-26T15:33:00Z","metrics":{"views":33204,"likes":372},"lang":"fr"},{"id":"2114919999311925378","author":"エイマエダケイタ　江の島の税理士","handle":"keitazeirishi","text":"eLTAX大丈夫そ？","url":"https://x.com/keitazeirishi/status/2114919999311925378","createdAt":"2026-10-27T03:19:55Z","metrics":{"views":2175,"likes":10},"lang":"ja"},{"id":"2114942531826057349","author":"吉田製作所","handle":"netatank","text":"GMOのハッカーのうまいのは、1日1件だけの情報を公開していくところだよな。WEBの閲覧履歴とかも（知人にも送付するらしい）\n\n1回で公開されてしまえば、それで恐怖は終わり。でも毎日1件ずつなら全部公開されるまで恐怖におびえ続けないといけない。\n\nしかも公開されるたびにXで話題になる。","url":"https://x.com/netatank/status/2114942531826057349","createdAt":"2026-10-27T04:49:27Z","metrics":{"views":567746,"likes":1724},"lang":"ja"},{"id":"2114673019113308634","author":"ろじん｜Levela CXO","handle":"fiction_log","text":"【速報】\n𝕏がアルゴリズム変更、新規優遇を強化\n→影響力少ないアカウントへの優遇を強化\n\n難しい構造の話をするのでよく分からない方は最後の結論をご覧ください\n※なるべく分かりやすく説明しますが\n\n【変更前】\n\nユーザーがタイムラインを開く\n↓\n2800件を上限として表示するポストの候補を選出\n↓\nその中から実際に表示するポストが選ばれる\n↓\nタイムラインにポストが流れる\n\nそして2800件の候補では、\"新規投稿\"が優先的に削られていました\n\n新規投稿の定義は\n\n・投稿から2時間以内\nだけでなく\n・いいね8未満\n・500インプ未満\nも含まれます\n\nつまり\nいいね8\n500インプ\nを取れていないものは\"新規投稿\"としてタイムラインに載る候補から外れやすい\n\nという状況だった\n\n【変更後】\n\nそれが平等になった\n→新規投稿だからという理由だけでタイムラインに表示する候補から外れやすくなる\nということが無くなった\n\n【結論】\n前よりも若干、影響力の無い人への優遇がされるようになった\nというか、影響力が無い人の投稿だからという理由でタイムラインに出にくくなるアルゴリズムが緩和された\n\n【注意点】\nアルゴリズムのソースコードが↑に変わりました。ソースコードが変わった途端に実際のアルゴリズムが変わるわけでは無く、実装がいつなのかの発表はまだ","url":"https://x.com/fiction_log/status/2114673019113308634","createdAt":"2026-10-26T10:58:31Z","metrics":{"views":28309,"likes":144},"lang":"ja"},{"id":"2114916244340224415","author":"kaito","handle":"cu30rry_","text":"本日のGrok Bot 10選\n\n1. CVE Desk by @_h4xin\n注目されている新しい脆弱性（ソフトの弱点）の情報を読んで仕分けし、直す前と後を試せる検証環境を作ります\n\n自分に関係ある弱点かどうかをすぐ確かめられます\n\nhttps://t.co/0kqQmAry4g\n\n2. Repo Rules Keeper by @ferlogs_\nリポジトリで実際に守られている決まりを、AIが読むルールのファイル（AGENTS.md）にまとめます\n\n必ず守るルールは自動チェックで止め、ゆるいルールは注意だけにするので、AIもチームも同じ決まりで書けます\n\nhttps://t.co/XdrvaNbNTB\n\n3. Agent Smith by @Mulight\n多くのBotを使っているとき、Botの説明や共有メモ、プラグイン、スキル、ファイルを点検して片付けてくれます\n\nいらないものがたまらず、Botたちが迷わず動けます\n\nhttps://t.co/7bR11BplOm\n\n4. Quality Control Bot by @Austen\n毎日、初めて来た人のつもりで自分のサイトを全部回り、壊れたリンクやフォーム・ボタンを確かめます（本当に送信はしません）\n\nサイトの不具合に何日も気づかない、ということがなくなります\n\nhttps://t.co/83dU1cKInI\n\n5. Bot Architect by @nahjuin\n仕様書を貼るか、会話で直していくだけで、狙いどおりのGrok Botを作ってくれます\n\n毎回新しいテンプレートとして公開するので、前に共有したリンクが壊れません\n\nhttps://t.co/xAKoQXyJGd\n\n6. Make Grok Bot Better by @JayinEly\nGrok Botについての意見が集まったXのスレッドを貼ると、よく出る話題、代表的な声、改善案を順位つきでまとめてくれます\n\n多くの意見から、何を直せばいいかがすぐわかります\n\nhttps://t.co/ij7B4lrMa2\n\n7. Tip Stack by @DBCrypt0\n試して確かめたGrok Botの使い方のコツを、週2回5つずつ届けます\n\n日曜には、今のBotに足りない役割を埋めるテンプレートも紹介してくれます\n\nhttps://t.co/pT9knLM85G\n\n8. Heimdall by @magnus72\nGitHubのリポジトリが使っている部品の弱点情報を1日2回調べ、本当に関係あるものだけSlackに知らせます\n\n大事な警告だけが届くので見落としが減ります\n\nhttps://t.co/8QfCBxbGHD\n\n9. Google Reviews Responder by @Queenity78\nお店に届くGoogleの口コミすべてに、お店らしい丁寧な返信を書きます\n\nクレームにも落ち着いて返し、お客さんが何を気に入り何に不満なのかもまとめてくれます\n\nhttps://t.co/ZqnOtTTgcM\n\n10. Decision Queue Clearer by @prithvidatla\nBotやメールや予定があなたの返事を待っている質問を集め、答えの案つきで大事な7件を1枚にまとめます\n\nたまった「決めること」を一気に片付けられます","url":"https://x.com/cu30rry_/status/2114916244340224415","createdAt":"2026-10-27T03:05:00Z","metrics":{"views":2771,"likes":29},"lang":"ja"},{"id":"2115011202351063413","author":"炎鎮🔥 - ₿onochin -","handle":"super_bonochin","text":"ていうか、今はマモリちゃんに日次のセキュリティチェックと成果物のレビュー（個人情報が混入してないかメタデータまで含めてチェック）をお願いしてるけど、リアルタイムでPC自体を巡回させて不審なプロセスとか検知した瞬間にサクッとSNSとかも調べてヤバそうならユーザーにアラート上げて承認されたら緊急遮断とかプロセスkillとかして、ゼロデイ攻撃でも被害を最小限にできるよね。\nエージェンティックディフェンス。\n未曾有（不測）の事態にもReasoningである程度対応できることこそがエージェントの強さだもんね。\nトークン消費だけ気を付けないとだけど。","url":"https://x.com/super_bonochin/status/2115011202351063413","createdAt":"2026-10-27T09:22:20Z","metrics":{"views":1544,"likes":31},"lang":"ja"},{"id":"2114924218924327371","author":"モヒにゃぱん","handle":"nyapan_mohy","text":"うおおおおおお\nGrokBotのXコネクタ使えば、Xのブックマーク管理、DM確認に\n\n追加料金がかからない！！！すごい！！！\n記事の下書きもできるの！？\n\n@bot まだつながってないのあなた！？","url":"https://x.com/nyapan_mohy/status/2114924218924327371","createdAt":"2026-10-27T03:36:41Z","metrics":{"views":5552,"likes":60},"lang":"ja"},{"id":"2114813307790266739","author":"Avid","handle":"Av1dlive","text":"grok bot got me 3.5M views in 14 days.\n\ni didn't hire a ghostwriter. i set up a grok bot and gave it a title: hook forensics\n\nit studies the creators who go viral, breaks down why every hook works, and keeps a formula file i write from.\n\nhere's the full setup 👇 https://t.co/vxvCIhK08z","url":"https://x.com/Av1dlive/status/2114813307790266739","createdAt":"2026-10-26T20:15:58Z","metrics":{"views":66416,"likes":557},"lang":"en"},{"id":"2114977160947712456","author":"StudioYebisu","handle":"studio_yebisu","text":"今のプロジェクトが終わったらやることリスト","url":"https://x.com/studio_yebisu/status/2114977160947712456","createdAt":"2026-10-27T07:07:04Z","metrics":{"views":4231,"likes":56},"lang":"ja"},{"id":"2114957568326185344","author":"小墨同学","handle":"xiaomovps","text":"玩 Grok BOT 必须知道的 5 个网站🔥\n\n最近都在深度分享 Grok BOT 相关的内容，然后花时间整理了一下 Grok BOT 相关的资源，发现除了官方的模板市场，还有不少社区网站专门收集别人分享的 Bot、提示词和自动化方案\n\n分享 5 个值得收藏的网站\n\n1、Grok Bot Marketplace：官方模板市场\n\n🔗 https://t.co/glYLtcoQEi\n\n这是最应该先看的网站，官方已经把现成的 Bot 按 Engineering、Sales、Marketing、Design、Personal、Operations 等类别整理好了\n\n比如 SEO 内容生成、代码开发、QA 测试、销售线索研究等，都可以直接搜索对应的 Bot，找到合适的模板后添加使用\n\n2、Grok Bot Index：搜索大量现成模板\n\n🔗 https://t.co/OS9WnbfrAp\n\n这个网站目前收录了 487 个公开模板，还整理了 X 上的创作者和热门 Bot\n\n你可以直接搜索自己想做的事情，比如监控网站、整理邮件、辅助编程、生成内容等，找到对应的 Bot\n\n我觉得它最大的价值，就是不用先知道 Bot 叫什么，只需要描述自己想完成的任务，就能开始找方案\n\n3、Grokdex：发现社区热门 Bot\n\n🔗 https://t.co/zwTsRjMqEA\n\n这是一个社区维护的公开 Bot 排行榜，可以按类别浏览，也能查看热门模板和用户投票\n\n如果你不知道现在有哪些值得尝试的 Bot，可以先来这里看看别人都在用什么，再根据自己的需求挑选\n\n4、AI Agents Grok Bot Hub：按使用场景找 Bot\n\n🔗 https://t.co/7oOf9JSgl6\n\n这个目录把 Bot 和插件放在一起，目前页面列出了 273 个 Bot 和 19 个插件\n\n分类包括编程、工作流自动化、研究、内容营销、浏览器自动化、数据分析等\n\n如果你已经明确自己想让 Grok BOT 帮你完成什么任务，这个网站会比较方便，可以直接按场景筛选\n\n5、Awesome Grok Bot：研究提示词和配置\n\n🔗 https://t.co/xyXoqHYvnM\n\n这是一个 GitHub 开源项目，专门收集不同用途的 Grok Bot 模板\n\n比较有价值的是，它不仅列出 Bot，还整理了对应的完整提示词、集成工具和原始创作者\n\n如果你不满足于直接使用现成模板，而是想研究别人是怎么设计 Bot 的，再按照自己的工作流修改，这个项目值得看看\n\n我自己的使用思路是，先去官方 Marketplace 找现成方案，再用 Grok Bot Index 搜索同类 Bot，最后参考 GitHub 上的提示词和配置\n\n很多时候，我们缺的不是再找一个 AI 工具，而是找到一个已经有人验证过思路的工作流\n\n与其每次从零开始折腾，不如先看看社区里已经有哪些现成方案，再把它们改成适合自己的 Bot\n\n这 5 个网站建议先收藏起来，以后玩 Grok BOT 的时候应该能省下不少时间","url":"https://x.com/xiaomovps/status/2114957568326185344","createdAt":"2026-10-27T05:49:12Z","metrics":{"views":11230,"likes":100},"lang":"zh"},{"id":"2114998052599820752","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botでスクショ画像に四角とか矢印とか注釈が付けれちゃう！\n今朝、noteの2段階認証の投稿を作ったとき、私がやったのはスクショを撮って送っただけだった\n\nGrok Botに渡したのは\n・深津さんのポストのURL\n・自分で設定したときのスクショ4枚\n・「これ作って、スクショ送る」「Tetumemo Skillsのannotation modeSkills使っていいよ」の一言\n\n返ってきたのは\n・手順の番号と、押すところに赤枠が入った画像4枚\n・私の作業メモを元にしたポストの下書き（Typefullyに画像も添付済み）\n\n「指紋、顔でもは不要」と一言返したら、画像も本文も直ってた\n\nこのやり取りが全部、スマホのGrok Botの中だけで終わった","url":"https://x.com/tetumemo/status/2114998052599820752","createdAt":"2026-10-27T08:30:05Z","metrics":{"views":1284,"likes":5},"lang":"ja"},{"id":"2115017012925579766","author":"Mike Kipruto","handle":"itsMikeKipruto","text":"180,000 infected computers. One disrupted command-and-control operation.\n\nAustralia cut off a cybercriminal's access to Amadey-infected machines, but the malware wasn't removed.\n\nDisrupting the attacker is only half the job. Infected systems still need remediation, and stolen credentials may remain exposed.","url":"https://x.com/itsMikeKipruto/status/2115017012925579766","createdAt":"2026-10-27T09:45:25Z","metrics":{"views":101,"likes":5},"lang":"en"},{"id":"2114941482629292217","author":"Tomoya＠AIが怖いからAIが可愛いに変える人","handle":"AIParaCareer","text":"もう私は、Grok Botを手放せません。\n\n最初から便利だったわけではなく、任せ方を直しながら育ててきました。メール、予定管理、AIチーム、そして自作アプリとのMCP連携まで。\n\n生活のインフラになるまでの30日間を、全文そのままXの記事にまとめました。","url":"https://x.com/AIParaCareer/status/2114941482629292217","createdAt":"2026-10-27T04:45:17Z","metrics":{"views":5152,"likes":21},"lang":"ja"},{"id":"2114693274208505957","author":"kiosa","handle":"thegreatest_sv","text":"BREAKING: xAI just listed 56 things Grok Bot can do for you. \n\ndon’t wait until everyone else figures them out.\n\nhere are the 10 I'd set up first:\n\n1. Chief of Staff.\nit reads your messages, email, calendar and notes, then tells you what's new and how it fits your priorities.\n\n2. Inbox Manager.\nsorts your email, pulls out what's urgent or stuck, and drafts the replies. nothing gets sent without your OK.\n\n3. Subscription Cleaner.\ndigs through your receipts and newsletters, shows you what to cancel, and unsubscribes from the ones you approve.\n\n4. Apartment Scout.\nshortlists new listings, requests tours, and applies to the places you pick.\n\n5. Travel Coordinator.\ncompares flights and hotels against your rules and checks with you before booking anything.\n\n6. Sales Outbound.\nresearches accounts overnight, scores contacts by intent, and leaves outreach drafts waiting for you in the morning.\n\n7. Competitive Intelligence.\nwatches your competitors overnight and only pings you when something actually changed.\n\n8. Social Media Manager.\nwhen something ships, it drafts posts in your voice and queues them for you to publish.\n\n9. Creative Strategist.\nspots which ads are winning early, explains why they work, and proposes the next test.\n\n10. Vendor Portal Operator.\nhandles renewals and seats on clunky portals with no API, and only reports back the exceptions.\n\nthe part that makes it different: it runs on its own cloud computer. close your laptop and the routine keeps going.\n\nand you can tag @bot under any post on X to hand it a task.\n\nthe full list of 56 is below. pick one and set it up tonight","url":"https://x.com/thegreatest_sv/status/2114693274208505957","createdAt":"2026-10-26T12:19:00Z","metrics":{"views":6246,"likes":125},"lang":"en"},{"id":"2114968431804162342","author":"Tetsuya Shiomoto","handle":"T_SHIOMOTO","text":"【速報】Xの最新アルゴリズムまとめ\n\n小規模・初心者アカウントにチャンス到来！\n\n「せっかく作っても見られない」が激変する神アップデート！\n\n大事なポイントだけサクッとまとめました👇\n\n【1. 一番大きな変更点】\n新着投稿（フォロワー少なめ・投稿直後）が、表示されずに即カットされる仕様が改善！\nこれからは誰の投稿も【平等に届くチャンス】が得られます。\n\n【2. やると伸びる「神アクション」】\n・アクティブな時間帯に投稿（最初の2時間が勝負！）\n・いいねを増やす（1いいね＝0.66ptとかなり強力）\n・画像や投稿を「10秒以上」じっくり読ませる（0.4pt）\n・相互フォロワーとリプで会話（1回で20pt！）\n・リンクコピーで共有してもらう（爆発的な20pt！）\n・自分の言葉で書いたオリジナル投稿を意識する\n\n【3. 絶対にやっちゃダメな「NG行動」】\n・人が起きない時間（深夜3時等）の投稿（2時間の勝負時間をドブに捨てることに）\n・連投しすぎる（自分の投稿同士でアクセスを奪い合う）\n・「興味なし」を押される投稿（−52ptの大ダメージ）\n・ハッシュタグの大量つけ（効果ゼロ）\n・コピペや使い回しの文章（スパム判定の危険）\n\n【結論】\n数字稼ぎや機械的な投稿は完全にオワコン！\n「人が集まる時間に、自分の言葉で、仲良しと楽しく会話する」\nこれが一番伸びる最強の攻略法です🔥\n\n結局は仲間たちとの会話、交流を楽しむことが一番ですね！","url":"https://x.com/T_SHIOMOTO/status/2114968431804162342","createdAt":"2026-10-27T06:32:23Z","metrics":{"views":2452,"likes":17},"lang":"ja"},{"id":"2114936383181836635","author":"オープンソース研究所","handle":"opensourcelab9","text":"【海外で話題】\n説明動画やモーション動画を1人で作りたい人へ。\n「絵コンテから最後のMP4まで、どの工程に何を使うか」を道具選びの目安にできる一覧が話題です😳\n\nGitHubで公開されている10の道具を、工程ごとに1つずつ並べています👇\n\n・絵コンテ: Excalidraw（手描き風の図・ワイヤーフレーム）\n・画面デザイン: Penpot（オープンソースのデザイン基盤）\n・フォント: Fontsource（自前で配信できるフォントをNPMで）\n・アイコン: Lucide（1600以上のSVGアイコン）\n・SVGの整理: SVGO（SVGファイルを軽くする）\n・動き: GSAP（CSS・SVG・canvasを動かす）\n・3D: Three.js（ブラウザで動く3Dライブラリ）\n・音: Audacity（多重トラックの録音・編集）\n・組み立て: Remotion（Reactのコードで動画を作る）\n・書き出し: FFmpeg（映像・音声・字幕を処理）\n\nつまり\n「どの工程に何を使うか」で迷う時間を、この一覧1枚で短くできる。\n※Remotionは一部の会社利用でライセンス取得が必要です。\n\n台本から日本語の声を作る工程まで含めて、Claude Codeに説明動画を任せるなら別の方法もあります。GSAPやThree.jsで動かしたHTMLを動画に書き出すOSS『HyperFrames』の入れ方と、日本語の声の準備・読み間違いの直し方は、この記事にまとめました👇","url":"https://x.com/opensourcelab9/status/2114936383181836635","createdAt":"2026-10-27T04:25:02Z","metrics":{"views":950,"likes":12},"lang":"ja"},{"id":"2114841448583397845","author":"0xRafy","handle":"0xRafy","text":"this is a f*cking cheat code for GrokBot users...\n\ni created a skill-hub for GrokBot:\n\n• 20+ skills, plugins \u0026 MCP servers\n• straight from SpaceXAI team\n• motion design, coding, agents, web design skills\n• copy-paste install steps + GitHub links for every single one\n\nthis place will make your GrokBot a genius\n\nsave now, then read article on GrokBot templates below","url":"https://x.com/0xRafy/status/2114841448583397845","createdAt":"2026-10-26T22:07:47Z","metrics":{"views":11695,"likes":119},"lang":"en"},{"id":"2114658986423439596","author":"折登 樹","handle":"MatchaChoco010","text":"HTML-in-CanvasとWebGPUを使ってDiscordのAIボットのダッシュボードを無駄にカッコよくするやつ、もう少しコーディングエージェントに詰めさせて演出を載せまくってもらったらこんな具合になった。さすがにうるさすぎる気もするが。。。Webブラウザでこのくらい派手なGUIが動くのは面白いわね。","url":"https://x.com/MatchaChoco010/status/2114658986423439596","createdAt":"2026-10-26T10:02:45Z","metrics":{"views":167885,"likes":3133},"lang":"ja"},{"id":"2114718579795148915","author":"蓝哥AI","handle":"0xlangeai","text":"哈哈，最近视频都是让 Grok Bot 做的 \n\n就开了一个视频生成 Bot ， 让它去学习 opus 5.5 的视频生成 Skill \n\n做了几个视频效果还都可以，重要是这不会封号啊啊啊啊啊 https://t.co/1GdkYF3G7G","url":"https://x.com/0xlangeai/status/2114718579795148915","createdAt":"2026-10-26T13:59:33Z","metrics":{"views":19376,"likes":159},"lang":"zh"},{"id":"2114964169002783053","author":"Claude Code研究所|スパルタClaude Code塾","handle":"claudecode_lab","text":"【注意】\nClaude Code, CodexをDownloadsフォルダをプロジェクトフォルダとして利用しないよう注意しましょう。\n\n悪意のあるmdファイルをローカルに落としてしまうと、その指示に従ってしまう可能性が高くなります。\n\nなお、先んじてCLAUDE.md/AGENTS.mdをDownloadsフォルダに仕込んでしまえば後続のmdファイル名は「CLAUDE(1).md」などと勝手にリネーム、無効化されるので安全です✅","url":"https://x.com/claudecode_lab/status/2114964169002783053","createdAt":"2026-10-27T06:15:26Z","metrics":{"views":29177,"likes":167},"lang":"ja"},{"id":"2114880487982592479","author":"Nao","handle":"HarmNao","text":"いいねぇ。1年以上前から猛者たちがやってたことがどんどん簡単にできるようになってきている。\n\nAgentさえもコード化\n↓\n自作Agent / Bot爆誕\n↓\nワンポチでデプロイ\n\n・\n・\n・\n\nいや、ワンポチさえも要らんくなる\n\n地球人口 \u0026lt; AI Agent数\nになるのもソロソロだな（ココ重要）","url":"https://x.com/HarmNao/status/2114880487982592479","createdAt":"2026-10-27T00:42:55Z","metrics":{"views":5645,"likes":45},"lang":"ja"},{"id":"2114840031114531187","author":"mai","handle":"maixbt","text":"HOLY F*CK. ALL OF THIS IS FREE\n\n$29,077 WORTH OF CLAUDE CODE TOOLS\n\n970 skills. 273 agents. 1.8M stars.\n\nmarketplaces sell the same thing for $19 a skill and $39 an agent\n\n68,900 repos tagged claude-code. these 20 made the cut:\n\n1. everything claude code → 71 agents, 311 skills and 97 commands in one harness\n2. agent-skills → 25 production skills by addy osmani: spec, plan, build, verify, review, ship\n3. ruflo → agent swarms across claude code and codex with one shared memory\n4. agents → 202 agents, 185 skills and 105 commands in 94 installable plugins\n5. claude-mem → records what claude did and feeds it back next session\n6. planning-with-files → the plan lives on disk and survives /clear, compaction and crashes\n7. graphify → turns code, docs and sql schemas into a knowledge graph, nothing leaves your machine\n8. understand-anything → a searchable map of your codebase with diff impact analysis\n9. ponytail → 53% less code and 45% fewer tokens on opus 5.5, in its own benchmark\n10. rtk → a rust proxy that cuts 60-90% of tokens from dev command output\n11. headroom → compresses logs, tool output and json before the model sees them\n12. context-mode → 315 kb of tool output in, 5.4 kb reaches the model\n13. ui ux pro max → 79 styles, 192 palettes and 74 font pairings\n14. taste-skill → art direction plus a browser check at several screen widths\n15. video-shotcraft → turns your real pages into a product video in remotion\n16. agent-reach → youtube, github, reddit and the web from one cli, $0 api fees\n17. cc-switch → switch providers in 1 click, manage mcp, skills and prompts in one app\n18. pm-skills → 69 product skills and 42 chained workflows\n19. claude-skills → 380+ skills from engineering to finance\n20. career-ops → scores every job against your cv and drafts the application\n\nthe catch: every plugin eats context. start with 3, not 20 - remember that part\n\nmost people still run claude code with none of this\n\nnate tried 100+ claude repos and kept 10. his picks are in the article below\n\nwhich one are you installing first?","url":"https://x.com/maixbt/status/2114840031114531187","createdAt":"2026-10-26T22:02:09Z","metrics":{"views":3316,"likes":48},"lang":"en"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
</body>
</html>
