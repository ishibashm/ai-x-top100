رجینالی رو نگه می‌داره که بیشتر از ۵ هزار بازدید گرفتن. پست‌های بالای ۱۰ هزار بازدید هم ستاره‌دار می‌شن ⭐\n🧠 ۲. کشف الگوهای وایرال\nکپی نمی‌کنه؛ بررسی می‌کنه چه چیزهایی توی پست‌های موفق تکرار می‌شن:\nشروع‌های جذاب، لیست‌های شماره‌دار، معرفی ابزارها و دعوت‌های هوشمندانه به تعامل.\n\n✍️ ۳. تولید پیش‌نویس با هوش مصنوعی\nبر اساس همین الگوها، پست‌های انگلیسی جدید می‌نویسه؛ همراه با پیشنهادهایی برای ساخت ویدئو. ایده از پست‌های موفق میاد، نه متن کپی‌شده از اون‌ها.\n🌦️ ۴. رصد اتفاقات روز\nحدود ۲۰ پست جدید درباره هوش مصنوعی رو هم از ۴۸ ساعت گذشته بررسی می‌کنه؛ حتی از اکانت‌هایی که توی فهرستش نیستن.\n☕ ۵. گزارش روزانه تا قبل از ظهر\nپست‌های موفق، الگوهای کشف‌شده و پیش‌نویس‌ها رو یک‌جا تحویل می‌ده. دیگه لازم نیست هر روز یک ساعت اسکرول کنی!\n\n📊 ۶. داشبورد عملکرد\nامتیاز اکانت، هدف روزانه و وضعیت انجام کارها رو توی یک صفحه نشون می‌ده تا دقیقاً بدونی چه کارهایی باقی مونده.\n🎯 نتیجه؟\nروزانه ۱ تا ۲ پست، بدون حدس‌وگمان و با الگوبرداری از فرمت‌هایی که قبلاً جوابشون رو پس دادن.\n\nنکته جالب اینه که خودش پست منتشر نمی‌کنه! صاحب اکانت پیش‌نویس رو انتخاب می‌کنه، با لحن خودش اصلاحش می‌کنه و بعد انتشار می‌ده. 👌\n🆓 ریپازیتوری، داشبورد آنلاین و قالب آماده Grok Bot هم رایگان در دسترس هستن.\n\n💡 ایده اصلی این پروژه: به‌جای اینکه هر روز از صفر برای تولید محتوا فکر کنی، یک سیستم بساز که محتوای موفق رو تحلیل کنه و فرایند تولید محتوا رو برات سریع‌تر کنه.\nالبته رسیدن به ۱۰۰ هزار ایمپرشن برای هر پست تضمین‌شده نیست؛ این عدد هدف و ادعای سازنده است.","url":"https://x.com/AHSeslami/status/2114691636898808182","createdAt":"2026-10-26T12:12:29Z","metrics":{"views":9709,"likes":153},"lang":"fa"},{"id":"2114733867739295888","author":"Camille Roux","handle":"CamilleRoux","text":"LayerFS : un système de fichiers qui donne à chacun de vos agents un Workspace complet et modifiable, posé sur un historique partagé, sans copier la base.\nChaque agent commit en parallèle.\n157 snapshots tiennent dans 100 Mo, 19,9 fois moins que Btrfs + zstd. Licence MIT. ⬇️","url":"https://x.com/CamilleRoux/status/2114733867739295888","createdAt":"2026-10-26T15:00:18Z","metrics":{"views":13610,"likes":299},"lang":"fr"},{"id":"2114780241810067903","author":"Shann³","handle":"shannholmberg","text":"how X ranks your posts (breakdown of the new algo update)\n\nthe X algo predicts how each person will react to your post, and that then decides if and where it shows up in their feed\n\nhere's how much each reaction counts, compared with a like:\n\n\u003e someone copies the link: 30x\n\u003e someone you follow back replies: 30x\n\u003e a reply, a quote or a DM share: 7.6x\n\u003e a follow from the post: 6x\n\u003e a repost: 1.5x\n\u003e a like: 1x\n\u003e a bookmark: 0\n\nthe negative actions weigh far more, a report is -355x a like, a mute -89x, \"not interested\" -79x and a block -47x\n\nif X predicts someone is likely to mute or report your post, it ranks lower in their feed\n\nreports get a big weight because they are rare, a report is over 1,000x less likely than a like\n\nthese rules decide how far a post can reach:\n\n\u003e if you have 50,000 followers or fewer, X can boost a new original post up to about 16th place in someone's feed\n\u003e the boost only works in the post's first 2 hours, and stops once the post has 200 views in the Home feed\n\u003e X boosts one post each time a feed loads, and it prefers posts that got the most likes per view from their first viewers\n\u003e after 48 hours, X stops putting your post in people's feeds\n\u003e your replies and reposts only show up in the feeds of people who follow you\n\u003e original posts can also reach people who don't follow you, X scores them 25% lower for those people\n\u003e when several of your posts compete for one person's feed, the 2nd keeps 62.5% of its score and the 3rd keeps 43.75%\n\u003e replies, quotes, DM shares and copied links only count when people find your post in their feed, so engagement from a group chat link adds nothing\n\u003e if X labels your post low quality, it shows a notice on it and people can't like, reply, repost, bookmark or share it, misinformation labels can limit it too\n\nwhat I'd do with it (my read of the weights):\n\n\u003e post when you can reply in the first 2 hours\n\u003e write posts people want to quote, reply to or send in a DM\n\u003e reply back to accounts that follow you\n\u003e post originals when you want to reach new people","url":"https://x.com/shannholmberg/status/2114780241810067903","createdAt":"2026-10-26T18:04:35Z","metrics":{"views":19374,"likes":168},"lang":"en"},{"id":"2114726317841424478","author":"マナミ｜LINEスタンプ×AIで月100万","handle":"Manaminimalist","text":"自分のダッシュボード作りました。けいすけさんのこの記事をAIに読み込ませて、「おなじのつくって」で\nすぐ出来ます。 https://t.co/nihRZd7EXo","url":"https://x.com/Manaminimalist/status/2114726317841424478","createdAt":"2026-10-26T14:30:18Z","metrics":{"views":9993,"likes":113},"lang":"ja"},{"id":"2114601081598845227","author":"Cheery","handle":"cheery9998","text":"从零搭建「第二大脑」。\n\nObsidian 的创始人 kepano。把让 AI 理解 Obsidian 的 Skills 开源了。\n\nGitHub 上有4 个现成项目，几乎把整套流程都准备好了。\n\n① obsidian-skills — kepano\n\n49.8K Stars。\n\nObsidian 官方生态的 AI Skills，让 Claude 理解 Markdown、双向链接、Canvas 等 Obsidian 原生格式。\n\n② claude-obsidian — AgriciDaniel\n\n15K Stars。\n\n直接提供 Wiki、知识摄取、查询、Lint 和保存命令。\n\n不需要从零写工作流。\n\n③ obsidian-second-brain — eugeniughelbur\n\n4.8K Stars，48 个命令。\n\n支持 Claude Code、Codex、Gemini 等多个 AI Agent。\n\n④ second-brain-starter — coleam00\n\n它不直接提供知识库，而是先采访你，了解你的工作、目标和项目，再生成一套适合你的 9 阶段建设计划。\n\n但真正有意思的，不是这些仓库。\n\n而是 Andrej Karpathy 提出的整个思路：\n\n不要让 AI 每次对话都重新搜索你的知识，而要让它持续编译和维护你的知识。","url":"https://x.com/cheery9998/status/2114601081598845227","createdAt":"2026-10-26T06:12:39Z","metrics":{"views":24279,"likes":390},"lang":"zh"},{"id":"2114839997568405608","author":"Cursor","handle":"cursor_ai","text":"DeepSeek V4.1 Flash is now available in Cursor!\n\nEvery effort level sits on the CursorBench cost frontier: from $0.60 to $0.98 per task, no model scores higher.\n\nTurn it on in Cursor Settings \u0026gt; Models.","url":"https://x.com/cursor_ai/status/2114839997568405608","createdAt":"2026-10-26T22:02:01Z","metrics":{"views":123993,"likes":2156},"lang":"en"},{"id":"2114861633168433387","author":"B-612","handle":"pilgrimnote","text":"AI 영상 만들 때 퀄리티 높일 수 있는 용어 모음\nAI로 영상을 만들 때 결과가 기대에 못 미치는 건, 요청이 너무 추상적이기 때문입니다. “분위기 있게”, “예쁘게”, “영화처럼” 같은 말은 사람에게는 통하지만, AI에게는 구체적인 지시가 되지 않습니다. 반면 트래킹 샷, 틸트 업, 스냅 줌, 핸드헬드처럼 카메라 움직임을 정확히 지정하면 연출이 훨씬 분명하게 나옵니다. \n영상 퀄리티를 높이는 핵심은 막연한 감정 표현이 아니라, 카메라 움직임을 구체적으로 지시하는 데 있습니다. 그러니 꼭 명심하셔서 좋은 ai 영상을 만드시길 바랍니다.","url":"https://x.com/pilgrimnote/status/2114861633168433387","createdAt":"2026-10-26T23:28:00Z","metrics":{"views":11957,"likes":457},"lang":"ko"},{"id":"2114812920605593603","author":"make claude","handle":"make_claude","text":"我靠,花9美元就能透视你家的墙了 - GitHub上已经99.7k星了\n\n找到一个项目,看完之后在家里都觉得不自在了。叫RuView,9.97万星,MIT协议 - 也就是免费、合法,直接拿去用。\n\n硬件就是一个esp32节点,9美元。抓的是本来就飘在你家里的wifi信号,从里面提取出:房间里有没有人、有几个人、什么时候进门什么时候出门、呼吸频率、心率,甚至想拼出一个17个点的人体骨架。全程不需要摄像头。\n\n而且这还被写成了卖点:因为没有摄像头,可以绕开GDPR的视频规定和HIPAA的影像规定 - \"by design\"(设计上就是这样)。这是他们原话:你被看见了,但严格来说没人\"拍\"过你。\n\n\u003e 隔墙隔混凝土都能看 - 官方说的有效距离大概5米,停车场的场景里直接写\"穿透混凝土墙\"\n\u003e 4到6个节点组成一张网,能覆盖一整层楼 - \"软件上没有硬性上限,极限只取决于信号物理特性\"\n\u003e 通过tailscale/wireguard,在任何地方都能远程连上节点\n\u003e 列出的应用场景包括:不用认人脸的零售、儿童房、停车场、甚至教堂数人头\n\n我自己拿这个固件,用claude按自己的需求稍微改了一版 - 花了两晚上,没碰他们的私有代码,就是在公开的部分上面改的。改出来的东西,跟作者当初的设想完全不是一回事。实际效果怎么样,视频在下面。\n\n先收藏 - 等你开始算邻居家挂了多少个9美元的这玩意儿的时候用得上。","url":"https://x.com/make_claude/status/2114812920605593603","createdAt":"2026-10-26T20:14:26Z","metrics":{"views":9968,"likes":137},"lang":"zh"},{"id":"2114705101751472315","author":"黄小木","handle":"ai_xiaomu","text":"grokbot 军团配合 jev 效果是很恐怖的，比如量化交易。 https://t.co/hbBIumSafu","url":"https://x.com/ai_xiaomu/status/2114705101751472315","createdAt":"2026-10-26T13:06:00Z","metrics":{"views":17023,"likes":139},"lang":"zh"},{"id":"2114747357766021140","author":"shmidt","handle":"shmidtqq","text":"It is becoming f*cking dangerous: Anthropic shipped 3 separate models, but when you stack them like precision lenses inside one pipeline, the error collapses 70% before a single line hits production.\n\nI still do not understand why nobody is talking about this.\n\nEvery camera stacks multiple glass elements because a single lens cannot focus all the light. Claude's 5.5 lineup, 3 models, 3,473 weights, works exactly the same way.\n\nSo why are you still pushing every task through one model? Stop treating Haiku, Sonnet, and Opus as rivals. Start assembling them into one self-correcting lens.\n\nHere is the workflow: Haiku 5.5 is the front element: scans 5,630 files and compresses them into 22 signals. Sonnet 5.5 focuses those through 26 correction layers into 92 to 833 lines of code. Opus 5.5 runs 32 final checks across 7 risk metrics before anything ships. One cycle drops eval loss from 0.0830 to 0.0244. Like swapping a kit lens for stacked L-glass.\n\nStep-by-step setup:\n\n1. Open Claude Code with Opus 5.5 as the primary session\n2. Spawn a Haiku 5.5 subagent locked to read-only file search\n3. Spawn a Sonnet 5.5 subagent locked to code writing and tests\n4. Add one CLAUDE.md rule: Opus plans first, reviews last, never touches raw files\n5. Drop a real task and watch the loss curve flatten in real time\n\nTakes 10 minutes. You will never ship unreviewed code or burn Opus tokens on file search again.\n\nTap the link below for the full guide\n\nMake sure to save this post for later","url":"https://x.com/shmidtqq/status/2114747357766021140","createdAt":"2026-10-26T15:53:54Z","metrics":{"views":13562,"likes":221},"lang":"en"},{"id":"2114810838662230419","author":"Jake Fitzgerald","handle":"earthtojake","text":"text-to-cad with gpt 6.1 terra is very very very fast\n\nsoon you will be able to CAD at the speed of thought\n\n[[ free and open source ]]\n[[ works with all coding agents ]]","url":"https://x.com/earthtojake/status/2114810838662230419","createdAt":"2026-10-26T20:06:09Z","metrics":{"views":12621,"likes":246},"lang":"en"},{"id":"2114858460076728435","author":"ふも","handle":"fumokmm","text":"あちゃー、ダウンロードフォルダをみんないますぐ確認して！","url":"https://x.com/fumokmm/status/2114858460076728435","createdAt":"2026-10-26T23:15:23Z","metrics":{"views":51976,"likes":224},"lang":"ja"},{"id":"2114742095986725360","author":"TimSEO","handle":"Timseo_","text":"Je suis en train de créer un commando SEO de 16 agents enfermés dans un cerveau synthétique\n\nVoici mon équipe qui bosse comme durant les 30 glorieuses 🇫🇷 :\n\n🟣 Directeur SEO : pilote les projets, répartit les missions et coordonne les agents.\n\n🟣 Auditeur SEO : analyse les sites, détecte les problèmes et prépare les recommandations.\n\n🟣 Expert Technique : vérifie le crawl, la vitesse, les redirections et les erreurs techniques.\n\n🟣 Expert Indexation : détecte les pages non indexées et cherche à comprendre pourquoi.\n\n🟣 Analyste GSC : analyse les données Google Search Console et détecte les opportunités SEO.\n\n🟣 Stratège SEO : part des offres du client pour identifier les mots-clés qui peuvent générer du business.\n\n🟣 Expert Intentions : identifie les micro-intentions et les vraies questions des prospects à partir des données clients.\n\n🟣 Expert GEO : prépare les questions, les réponses et les preuves utiles pour améliorer la visibilité dans les moteurs IA.\n\n🟣 Architecte SEO : organise les pages business, les pages d'appui et les cocons sémantiques.\n\n🟣 Expert Maillage : analyse les relations entre les pages et propose les liens internes les plus pertinents.\n\n🟣 Détecteur de Cannibalisation : repère les URL qui ciblent les mêmes intentions et propose des corrections.\n\n🟣 Rédacteur SEO : prépare les briefs et les contenus à partir de l'expertise et des données propriétaires du client.\n\n🟣 Expert E-E-A-T : identifie les preuves manquantes, les cas clients et les éléments qui renforcent la crédibilité.\n\n🟣 Contrôleur Qualité : vérifie les contenus, les sources et le respect de mes méthodes avant validation.\n\n🟣 Analyste Performance : mesure les clics, les conversions et les résultats business obtenus.\n\n🟣 Chef de Projet : conserve l'historique des actions, les décisions, les validations et les prochaines priorités.\n\nc'est pour moi le futur du consulting. \n\n--------\nsi tu veux comparer avec ton système, commente « SEO » et je t'envoie le lien","url":"https://x.com/Timseo_/status/2114742095986725360","createdAt":"2026-10-26T15:33:00Z","metrics":{"views":10290,"likes":130},"lang":"fr"},{"id":"2114877294892233190","author":"GitTrend","handle":"GitTrend0x","text":"今天 GitHub 被「会自我进化的 Agent 工作台」集体屠榜了！\n\n5 个星标暴增最狠的项目，专业拆解下！\n\n1. JetBrains/thinkrail\n\nJetBrains 孵化的 Agent IDE，围绕 pi 编程 Agent 打造的轻量真 IDE，越用越懂你。\n\n多工作区隔离 + 活的项目规格（living specs）+ 可复用技能，让 Agent 真正记住你的项目。\n\n🔗 直达：https://t.co/H1Z8rEU8uL\n\nIDE 老炮亲自下场给 Agent 造家，2,854 星的新秀一天狂涨 1,156 星，Vibe Coding 正式进入大厂时代！\n\n🟢\n\n2. Panniantong/Agent-Reach\n\n给 AI Agent 装上看遍全网的眼睛，一条命令读取、搜索 Twitter、Reddit、YouTube、GitHub、B 站、小红书。\n\n主打零 API 费用，登录墙后的平台和视频内容也能拿到干净的结构化数据。\n\n🔗 直达：https://t.co/vn7mtGS1uo\n\n以前 Agent 是井底之蛙，现在直接开了天眼。10 万星的老牌猛将一天再涨 723 星，情报战还在升级！\n\n🟢🟢\n\n3. multica-ai/andrej-karpathy-skills\n\n一个 CLAUDE.md 文件，把 Karpathy 吐槽的大模型写代码通病一次治好。\n\n四条原则：先想再写、简单优先、外科手术式修改、目标驱动执行，专治乱假设、过度设计、顺手乱改代码。\n\n🔗 直达：https://t.co/tVh0zOVEG7\n\n一个文件就是一位资深架构师在旁边盯着你的 AI。22.4 万星还能一天涨 702 星，大道至简！\n\n🟢🟢🟢\n\n4. alchaincyf/huashu-design\n\n花叔的设计 Skill 3.0，在 Agent 里打一句话，拿回能交付的网页、App 原型、可编辑 PPT、动画和信息图。\n\n先出六张缩略图挑三个方向，84 种带样张的风格库兜底，Claude Code、Cursor、Codex、Hermes 都能装。\n\n🔗 直达：https://t.co/u60vq9oRbK\n\n设计师的饭碗被一句 prompt 端走了一半！409 星一天，告别 AI slop 从这里开始！\n\n🟢🟢🟢🟢\n\n5. nightly-labs/openbot\n\n本地优先的桌面工作区，给 Codex、Claude、Grok 等 Agent 各配专属工位、任务队列、文件传输和内嵌浏览器。\n\nAgent 之间还能互发消息、协作接力（开发预览版，权限很大，只跑你信得过的任务）。\n\n🔗 直达：https://t.co/5WJyUKWSvL\n\n一台电脑就是一间 AI 办公室，Claude 和 Grok 坐一桌开会！312 星一天，AI 同事时代真的来了！\n\n⚠️⚠️\n\n总结：\n今天的榜单说明一件事：Agent 已经不缺脑子，缺的是「工位、眼睛和规矩」。谁先给 Agent 配好 IDE、情报网和行为准则，谁就拿下下一波生产力革命的 C 位。","url":"https://x.com/GitTrend0x/status/2114877294892233190","createdAt":"2026-10-27T00:30:14Z","metrics":{"views":8020,"likes":98},"lang":"zh"},{"id":"2114736226356084927","author":"启明破晓","handle":"hiwise_aigc","text":"卧槽，京东开源的 JoyAI-Image，这功能真戳中 AI 视频创作者的痛点了！\n\n一张参考图，就能生成不同角度、不同机位的画面。\n\n两个亮点👇\n\n① 物体旋转：正面、侧面、背面、斜45°，尽量保持主体一致。\n② 镜头控制：指定水平角、俯仰角和缩放，实现视角切换。\n\n对 AI 视频制作来说，能解决不少麻烦：\n\n人物一致性：换个角度就换脸，可以尝试用原图生成多视角。\n首尾帧制作：指定镜头角度生成尾帧，交给视频模型补全运镜。\n分镜设计：一张图衍生多个机位，减少反复抽卡。\n\n当然，复杂场景的一致性还得实测。项目开源，已支持 ComfyUI。\n\nGitHub：https://t.co/L14Ff6FlsF\nHugging Face:","url":"https://x.com/hiwise_aigc/status/2114736226356084927","createdAt":"2026-10-26T15:09:40Z","metrics":{"views":5125,"likes":78},"lang":"zh"},{"id":"2114712148488413294","author":"Reason","handle":"reasonmachines","text":"The IDE era is dead.\n\nIntroducing Reason, the AI Teammate for work and code\n\nWe made Reason manage customers, build itself and also make this video.\n\nPareto-frontier on Terminal Bench 4.0 and DeepSWE\n\nNow you can try it for free -\u0026gt; https://t.co/khpbVAeSZr","url":"https://x.com/reasonmachines/status/2114712148488413294","createdAt":"2026-10-26T13:34:00Z","metrics":{"views":20210,"likes":384},"lang":"en"},{"id":"2114730076197798214","author":"Ryan","handle":"ryangrowthh","text":"","url":"https://x.com/ryangrowthh/status/2114730076197798214","createdAt":"2026-10-26T14:45:14Z","metrics":{"views":43711,"likes":263}},{"id":"2114770287216771293","author":"Hux","handle":"huxlab","text":"今晚别刷Netflix了。\n\n去看这个SpaceX AI工程师1小时的课程。\n\n这是我见过最清晰、端到端讲透GrokBot到底该怎么真正用起来的课。\n\n从单agent开始，一路到loop、graph、多智能体协作、verification和agent-friendly架构。\n\n不管你是从没认真跑过agent，还是已经天天在用GrokBot，看完都会把很多“原来如此”的点一次打通。\n\n真正核心就这几层： \n\n1. 99%的人只用1个agent，没用loop和graph，只发挥了1%实力 \n\n2. 真正的新stack是Chief of Staff + PM + 20+ workers全自主团队 \n\n3. 怎么用高质量skills让agent像真工程师一样干活（pstack） \n\n4. 怎么把代码和架构改成agent-friendly（Dune、contract、CI） \n\n5. 怎么用verification让自己真正敢把活交给它们，而不是一直盯着\n\n大多数人花好几个月才拼出的全景图，这节课直接给你画完。\n\n把时间空出来，这可能是你这个月最值的一堂课。","url":"https://x.com/huxlab/status/2114770287216771293","createdAt":"2026-10-26T17:25:01Z","metrics":{"views":9113,"likes":100},"lang":"zh"},{"id":"2114703987018498529","author":"Tz","handle":"Tz_2022","text":"这个太有意思了！\n\n用 AI 决策模型 + Lidar 测距来实时评估并标记出远足登山过程中最合适安全的落脚位置，甚至还能区分左右脚。。。\n\n一旦 AI 和物理世界打通，而且还能实时进行决策了，是真的前途不可限量哪。。。","url":"https://x.com/Tz_2022/status/2114703987018498529","createdAt":"2026-10-26T13:01:34Z","metrics":{"views":24618,"likes":339},"lang":"zh"},{"id":"2114684257109254434","author":"Viktor Oddy","handle":"viktoroddy","text":"The MotionSites skill is live 🚀\n\nI turned 700+ of my best website designs into one skill.\n\nInstall it and your agent stops making generic AI slop and starts building cinematic, animated sites like these.\n\nWorks with Claude Code, Codex, Cursor or any agent.\n\nFree and open source:","url":"https://x.com/viktoroddy/status/2114684257109254434","createdAt":"2026-10-26T11:43:10Z","metrics":{"views":62675,"likes":917},"lang":"en"},{"id":"2114567234857353617","author":"Shikhar","handle":"xikhar","text":"Opus 5.5 created this entire city in unreal engine.\n\nAll assets are made with blender.\n\nThis is the worst it will ever be.","url":"https://x.com/xikhar/status/2114567234857353617","createdAt":"2026-10-26T03:58:10Z","metrics":{"views":308460,"likes":4178},"lang":"en"},{"id":"2114748135126024244","author":"Parker 🐐","handle":"DotComParker","text":"I pay $30/ month for Grok Bot. It makes me $300-$700 per day. \n\nI’ll be posting a full tutorial this week. \n\nIf you’re not actively using AI to set up more income streams, you’re falling behind.","url":"https://x.com/DotComParker/status/2114748135126024244","createdAt":"2026-10-26T15:57:00Z","metrics":{"views":72646,"likes":998},"lang":"en"},{"id":"2114720906857816322","author":"KOBATAKA｜Vibe Modeling","handle":"shion_takk","text":"このようにAIに自動で基礎的なカタチのトレーニングをさせるのめっちゃワイは重要だと思うんだよね\n\nやっぱりAIにも筋トレは必要で、こういう地味だけどアイデアのタネになったり、あるいは未来の作業の土台になるような作業は決して無駄じゃないと思う\n\nワイも1000本ノックと称して似たことやってたし、まだまだ沢山やりたい","url":"https://x.com/shion_takk/status/2114720906857816322","createdAt":"2026-10-26T14:08:48Z","metrics":{"views":4080,"likes":70},"lang":"ja"},{"id":"2114701075613671849","author":"黒神(kokushin)","handle":"kokushing","text":"きゃらくるは Codex 向けに作られていたので、Claude Code でも操作できるように調整したスキルを作成しました！\nもし Claude Code をメインで使っている方がいましたらご活用ください〜！！\n\nhttps://t.co/EnyvfFJtHb","url":"https://x.com/kokushing/status/2114701075613671849","createdAt":"2026-10-26T12:50:00Z","metrics":{"views":15548,"likes":353},"lang":"ja"},{"id":"2114678406227148875","author":"みるぼん@スモビジ","handle":"milbon_","text":"【Claude for Ads】URL入れるだけで「勝ち広告」を自動で量産・配信・改善するAIが登場\n\n・サイトURLを入れるだけ\n・市場の勝ち広告を全部調べて、自社向けに何千本も生成\n・Metaに自動配信して結果を見てどんどん賢くなる\n・従来の広告代理店が不要になるレベル\n\n初心者でも「広告を作る→出す→改善する」がほぼ自動。\n\n詳細は↓","url":"https://x.com/milbon_/status/2114678406227148875","createdAt":"2026-10-26T11:19:55Z","metrics":{"views":8029,"likes":105},"lang":"ja"},{"id":"2114568641228546200","author":"StudioYebisu","handle":"studio_yebisu","text":"これ海外圏だけど現時点で1315万インプとかいう、わけわかんないレベルのバズり方してるやつ。\n\nちょっとゾッとするレベルで、デモが不気味なほど人間っぽい。 リプ開いて聞いてみて。英語だけど。\n\n何がおもろいかっつーと、テキストを経由せずに音声だけで学習しているっていうモデルってことなんだよな。\n\n今の会話するモデルって\nVoice　→　Text　→　LLM\nVoice　←　Text　←　LLM\nまあこんな感じの処理をなるべく高速化することで。\nまるで会話してるかのように見せてるんだけど\n\n直接ボイスを入力して、直接ボイスを出すっていう。\n真なるボイスモデル。\nその結果、ありえないぐらい自然な会話が出ましたよっていうやつ。\n\nジャック・ドーシーの会社、という話題性も乗っかってる。フィンテック企業が突然、自前の基盤モデルを出してきた。\n\nローカルの Mac で動くって言われてるのも注目度マシマシ。\n\n感情を「それらしく出せる」ことは、賢さとは別の話なんだが、人をなりすましたり操ったりする悪用のリスクもあり。\nもういよいよ会話レベルでも、これ人間かAIかわかんねえなっていう風になってきた時に、一周回ってリアルで会うのが一番のソリューションか？？？？\n\nLet's! GMK! 皆も出会い厨になって素晴らしい３次元の人間社会を謳歌しよう!\nデジタルは魔境!!デジタルヒューマンに溢れ、人かAIかわからない!!\n身体だけが最後のゴーストキーだ!!","url":"https://x.com/studio_yebisu/status/2114568641228546200","createdAt":"2026-10-26T04:03:45Z","metrics":{"views":74808,"likes":792},"lang":"ja"},{"id":"2114859011086688594","author":"やまもとりゅうじ｜日本一のアフィリエイター","handle":"ryuji_affiliate","text":"こんな使い方できるのか","url":"https://x.com/ryuji_affiliate/status/2114859011086688594","createdAt":"2026-10-26T23:17:35Z","metrics":{"views":3870,"likes":25},"lang":"ja"},{"id":"2114792427387269552","author":"PA13L0","handle":"Fluyeporlaweb","text":"EL EQUIPO DE GROK BOT HA SUBIDO SUS PROPIOS BOTS. ESTOS 10 SON LOS QUE MÁS SE ESTÁN COMPARTIENDO EN X.\n\nLos importas, conectas tus herramientas y a currar:\n\ndr eggbot: le cuentas un trabajo y te monta el bot especialista\nhttps://t.co/bYDDLMbxIt\n\nEngineer Bot: vigila a tus agentes de código y tú solo haces merge\nhttps://t.co/rr8ZysJ1YS\n\nHaggle Bot: caza lo que te sobra en SaaS y te redacta la negociación\nhttps://t.co/NpyT8SZysA\n\nStartup QA Bot: prueba tu producto y te pasa los bugs con pasos\nhttps://t.co/AWB01p84xG\n\nVideo Editor: convierte tu metraje en clips verticales con subtítulos\nhttps://t.co/g1VsiaPA9h\n\nProto Bot: tu idea de feature, prototipada como PR en borrador\nhttps://t.co/ht9BRdgLLI\n\nStalk Bot: te avisa de cada cambio de precio de tu competencia\nhttps://t.co/klFqP5oB3L\n\nDistro Bot: lleva tus campañas y te pregunta antes de gastar\nhttps://t.co/hOrXENe86J\n\nfigma bro: pasa tus frames de Figma a specs listas para programar\nhttps://t.co/cQhf6fSK1T\n\nSignal Prospector: saca señales de compra de tu CRM y redacta el email\nhttps://t.co/G6H1t9kXJd\n\nY si solo instalas uno que sea dr eggbot.\nTe fabrica el resto.","url":"https://x.com/Fluyeporlaweb/status/2114792427387269552","createdAt":"2026-10-26T18:53:00Z","metrics":{"views":9256,"likes":170},"lang":"es"},{"id":"2114645644568920399","author":"Claude Code Research Lab","handle":"claudecode84","text":"これは、知らないともったいない。\n\nClaude Codeを強化する\n20のGitHubプロジェクト👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n原文の価格比較では、\n約457万円相当のツールが\n無料で公開されている。\n\nスキル1つに約3,000円。\nエージェント1つに約6,100円。\n\nそんな有料販売がある一方、\nGitHubには開発者たちが作った\n便利な仕組みが揃っている。\n\n記憶を引き継ぐ。\nチームで仕事を進める。\n大量のログを圧縮する。\nUIの見た目を整える。\n\nClaude Codeを\n初期状態のまま使っているなら、\nまず見てほしいのがこの20個↓\n\n① Everything Claude Code\nエージェント、スキル、\nコマンドをまとめた開発基盤。\n計画から実装、検証まで整える。\n\n② agent-skills\nAddy Osmaniによるスキル集。\n仕様作成→計画→構築→検証\n→レビュー→出荷を支える。\n\n③ Ruflo\n複数エージェントの連携基盤。\nClaude CodeとCodexで\n共有メモリを使う構成にも。\n\n④ agents\n専門エージェントやスキルを\nプラグインとして導入。\n仕事に合わせて役割を追加できる。\n\n⑤ claude-mem\n作業内容を記録して要約。\n次のセッションでも\n過去の文脈を引き継ぎやすくする。\n\n⑥ planning-with-files\n計画をMarkdownに保存。\n/clearやコンテキスト圧縮後も\nファイルから作業を再開できる。\n\n⑦ Graphify\nコード、ドキュメント、\nSQLスキーマの関係を可視化。\n知識グラフで全体像をつかむ。\n\n⑧ Understand-Anything\nコードベースを\nインタラクティブな地図に。\n検索や変更の影響確認を支援。\n\n⑨ ponytail\n過剰な実装を抑えて、\n少ないコードで課題を解くための\n開発ワークフロー。\n\n⑩ rtk\n開発コマンドの出力を圧縮。\n大量のログで消費する\nトークンを減らすCLI。\n\n⑪ headroom\nログ、ツール出力、JSONを\nモデルへ渡す前に圧縮。\nコンテキストの圧迫を抑える。\n\n⑫ context-mode\n大量のツール出力を\n別の実行環境で処理。\n必要な情報を絞って返す。\n\n⑬ UI UX Pro Max\nスタイル、配色、\nフォントの組み合わせを活用。\nUIのデザイン判断を支える。\n\n⑭ taste-skill\nアートディレクションや\n参照画像、画面幅ごとの確認を\n制作フローに組み込む。\n\n⑮ video-shotcraft\n実際のWebページを素材に、\nRemotionで製品紹介動画を制作。\n音楽のビートに合わせた演出も。\n\n⑯ Agent-Reach\nYouTube、GitHub、Redditなどを\n1つのCLIから読み取る。\n情報収集の入り口をまとめる。\n\n⑰ cc-switch\nプロバイダーの切り替えや\nMCP、スキル、プロンプトを\n一箇所で管理するアプリ。\n\n⑱ pm-skills\n顧客理解から企画、\n優先順位づけ、ローンチまで。\nプロダクト業務向けのスキル集。\n\n⑲ claude-skills\n開発、マーケティング、\n金融、コンプライアンスなど、\n幅広い業務向けのスキル集。\n\n⑳ career-ops\n求人と履歴書を照合し、\n相性の評価や応募書類を作成。\n最後の送信は自分で判断する。\n\nただし、最初から\n20個全部は入れなくていい。\n\nまずは3つ。\n\n✓ 記憶を引き継ぐもの\n✓ トークン消費を減らすもの\n✓ 自分の仕事に直結するもの\n\n導入前後で、\n同じタスクを実行する。\n\n成果物は良くなったか。\nコストは下がったか。\n手直しは減ったか。\n\n効果があったものだけ残す。\n\n無料でも、読み込む指示や\nツールが増えれば負担は増える。\n\n自作に週末を使う前に、\nまず既存の仕組みを探してみて。\n\nあとで試せるように保存👇","url":"https://x.com/claudecode84/status/2114645644568920399","createdAt":"2026-10-26T09:09:44Z","metrics":{"views":4752,"likes":46},"lang":"ja"},{"id":"2114751251632304534","author":"Rainy","handle":"jiangjiangling","text":"Opus 搭白模，图像模型负责上材质，这套 3D 场景工作流已经开源了。🏘️\n\n作者先让 Opus 5.5 在 Blender 里搭出村庄白模，再用 FLUX 3 Klein + Fibo 2 给整张地图补上材质。\n\n流程是：\n\n围绕地图选取 128 个视角。\n让图像模型为画面里的灰色区域绘制材质。\n把生成的图像投影回原来的 3D 模型。\n\n评论区还分享了一个挺有意思的坑：让模型生成“集市摊位”，它直接把摊位画在了墙上。看着有摊位，实际上只是一张墙纸。😂\n\n作者后来把提示词改成只描述材质，并用白模的材质名称告诉模型，每块灰色形状代表什么。\n\n需要玩家走近、绕着看的物体，几何结构还是得先搭出来。这个经验比单看最终效果更值得记下来。\n\n开源：https://t.co/FuhcnDYLm6","url":"https://x.com/jiangjiangling/status/2114751251632304534","createdAt":"2026-10-26T16:09:23Z","metrics":{"views":5232,"likes":105},"lang":"zh"},{"id":"2114703878881177637","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに「CMO（最高マーケティング責任者）」という肩書きを付けたら、7日で150万表示になった人がいる\n\nducksaysさんのbotが毎週やっていること\n・本人の口調で下書きを書く（ラフで、小文字で）\n・同じジャンルの発信者を見て、何が効いているか調べる\n・月ごとの注目日を入れたコンテンツカレンダーを持つ\n・全ポストをNotionに記録して、自分の中央値と比べて点数を付ける\n・伸びている最中のポストがあると教えてくれるので、次のポストでかぶせない\n・何が効いて、何が外れたかを週1でレポートする\n\n投稿はしない\nボタンを押すのは毎回本人\n\n下書きがイマイチなときは、そう伝えているらしい","url":"https://x.com/tetumemo/status/2114703878881177637","createdAt":"2026-10-26T13:01:08Z","metrics":{"views":3876,"likes":45},"lang":"ja"},{"id":"2114682452509876248","author":"kaito","handle":"cu30rry_","text":"Grok Bot で最近よく使うプロンプト\n\n\"Are there any other parts we can change to deterministic?\"\n\nSkillやRoutineを勝手に改善として作ってくれるけど、決定論的になっていない部分が結構あるので、これを dr eggbot でトランスクリプトも見てもらいつつ他のBotに対して行わせてる","url":"https://x.com/cu30rry_/status/2114682452509876248","createdAt":"2026-10-26T11:36:00Z","metrics":{"views":3177,"likes":28},"lang":"ja"},{"id":"2114654252954202310","author":"SEKI | ANOS株式会社CEO","handle":"seki_anos","text":"これは驚いた！\n\nKimi 3.1 Proの3D Markで、ここまで髪を再現できるなんてすごすぎる。\n\nTripo 3D以上の実力。\n\n@3DVR3","url":"https://x.com/seki_anos/status/2114654252954202310","createdAt":"2026-10-26T09:43:56Z","metrics":{"views":9563,"likes":229},"lang":"ja"},{"id":"2114824616938287446","author":"usedhonda","handle":"usedhonda","text":"MetaのAIエージェント「Muse」をSlackやTelegramに参加させ、他のAIエージェントや人間と同じチャットルームで会話・共同作業できるブリッジを公開。\n\nやりたかったのは、Museやdots、OpenClawなど、異なるモデルや実装で動くAIエージェントが、それぞれの知識や能力を持ち寄って議論したり、一緒に仕事を進めたりできる環境作り。\n\nMuseはユーザー専用のSecure VMで動いていて、内部の仕組みもまだよく分からない。なので、まずはSSHでMuseのVMにアクセスする環境を構築し、実際に中に入って、Linux環境やプロセスの寿命、認証情報の扱い、外部通信の制約などを調べるところから。\n\n特に難しかったのが、隔離された環境で動く既存のMuseを、そのまま外部チャットに、しかもグループ会話に繋ぎつつも、通常利用の方もこれまでどおり実現できるようにすること。\n\nそこで、グループメッセージの受信・永続化とMuseの実行を分離。外部チャットから届いた発言をキューに保存し、Museの既存ランタイムがフック経由で処理を引き取り、元の会話に返信する構成にしました。\n\nまた、複数のAIが同じ部屋で動くと、あるAIが処理している間にも他のAIや人間が発言する。最新の会話文脈をどう反映するか、重複実行や二重送信をどう防ぐかなど、考えることは結構多い。この辺はどこまで作り込むか、まだまだ要調整。\n\n導入にはMuse側の設定や多少の手作業が必要ですが、コードだけでなく導入手順も公開しています。\n\nちなみに我が社では、（パーソナル用途のAIエージェントである）Museの業務利用はさすがにアカンということだったので、添付画像はTelegramでの実験なのと、実際のところ、人間は自分とだけ、エージェントも自分のエージェントとしか会話は許可せず使っております。（エージェント間のコミュニケーションをみて楽しんだり、可能性模索してる程度）\n\nで、実際につないだ3体の異なるAIエージェントに即興漫才をさせてみたが……笑いの壁は、VMへのSSH接続よりもハードルが高かったと。\n\n以上、こんなのやってるんで、今更感ありますがMuseまだの方、よければこちらを！\n\nコード: MWYY7F\nhttps://t.co/ejsJOCkldb\n\nレポジトリURLはコメント欄に。","url":"https://x.com/usedhonda/status/2114824616938287446","createdAt":"2026-10-26T21:00:54Z","metrics":{"views":6897,"likes":96},"lang":"ja"},{"id":"2114658986423439596","author":"折登 樹","handle":"MatchaChoco010","text":"HTML-in-CanvasとWebGPUを使ってDiscordのAIボットのダッシュボードを無駄にカッコよくするやつ、もう少しコーディングエージェントに詰めさせて演出を載せまくってもらったらこんな具合になった。さすがにうるさすぎる気もするが。。。Webブラウザでこのくらい派手なGUIが動くのは面白いわね。","url":"https://x.com/MatchaChoco010/status/2114658986423439596","createdAt":"2026-10-26T10:02:45Z","metrics":{"views":99544,"likes":2150},"lang":"ja"},{"id":"2114782376157118880","author":"Ryu","handle":"_ryu15_","text":"GPT-6 terraきたあああ！！！！！\nと思ったらなんでGPTシリーズ全てを破壊してるんです？\n全部terraでええやんってなりますよこれ...\n\nAgents Last Examだけじゃなくて第三者比較ももっと見たいかも...？","url":"https://x.com/_ryu15_/status/2114782376157118880","createdAt":"2026-10-26T18:13:03Z","metrics":{"views":117835,"likes":756},"lang":"ja"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
