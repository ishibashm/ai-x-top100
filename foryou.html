e, burning tokens on raw logs\n\n20 GitHub projects you should open first:\n\n1. Everything Claude Code → 71 agents, 311 skills and 97 commands in one harness. the closest thing to an agent OS\nhttps://t.co/9rVZrWAndi\n\n2. agent-skills → 25 production skills by Addy Osmani: spec, plan, build, verify, review, ship\nhttps://t.co/t2ygivKgH7\n\n3. Ruflo → runs agent swarms across Claude Code and Codex with shared memory between them\nhttps://t.co/26QeNpJ8gC\n\n4. agents → 202 agents, 185 skills and 105 commands packed into 94 installable plugins\nhttps://t.co/otsYWvZkhj\n\n5. claude-mem → records what your agent did, summarizes it and feeds it back next session\nhttps://t.co/WccJ8te0TD\n\n6. planning-with-files → keeps the plan in markdown on disk, so it survives /clear, compaction and crashes\nhttps://t.co/5pENbLceT5\n\n7. Graphify → turns code, docs and SQL schemas into a knowledge graph. parsed locally, nothing leaves your machine\nhttps://t.co/IpUK6nWsRt\n\n8. Understand-Anything → an interactive map of your codebase with search, guided tours and diff impact analysis\nhttps://t.co/m5ot7lrl5g\n\n9. ponytail → makes Claude code like the laziest senior dev. 53% less code and 45% fewer tokens in its own Opus 5.5 benchmark\nhttps://t.co/W3h34gBkiK\n\n10. rtk → a Rust CLI proxy that cuts 60-90% of the tokens from common dev command output\nhttps://t.co/uFvslUWFb5\n\n11. headroom → compresses logs, tool outputs and JSON before they reach the model\nhttps://t.co/1Qluj9lMY5\n\n12. context-mode → sandboxes tool output. 315 KB in, 5.4 KB to the model\nhttps://t.co/usOJ1EnMAO\n\n13. UI UX Pro Max → 79 styles, 192 palettes and 74 font pairings, so your UI stops looking AI-made\nhttps://t.co/eLGaTdG1NV\n\n14. taste-skill → gives Claude art direction, real reference photos and a browser check at several screen widths\nhttps://t.co/x0KitmaEOL\n\n15. video-shotcraft → turns your real pages into a cinematic product video in Remotion, synced to the beat\nhttps://t.co/yspobXd0ye\n\n16. Agent-Reach → lets your agent read YouTube, GitHub, Reddit and the web from one CLI, zero API fees\nhttps://t.co/zZuAchQkUW\n\n17. cc-switch → a desktop app to switch providers in one click and manage MCP, skills and prompts in one place\nhttps://t.co/kgbzMzAbjs\n\n18. pm-skills → 69 product skills and 42 chained workflows, from discovery to launch\nhttps://t.co/RNc1RzrnaT\n\n19. claude-skills → 380+ skills across engineering, marketing, finance, compliance and C-level advice\nhttps://t.co/wGpjj88gE0\n\n20. career-ops → scans job boards, scores every role against your CV and drafts the application. you still press Submit\nhttps://t.co/2HXY1LWPqj\n\nstart with 3, not 20: one for memory, one for tokens, one for your actual job\n\nrun the same task before and after. keep only what makes the result better or cheaper\n\nevery plugin you add loads into context, so more isn't free\n\nsave this before you spend another weekend building something that already exists\n\nand repost it for the friend who's still paying $19 a skill ↓","url":"https://x.com/choopyplug1/status/2114474303190086018","createdAt":"2026-10-25T21:48:53Z","metrics":{"views":3032,"likes":66},"lang":"en"},{"id":"2114335185915269293","author":"虹安","handle":"yaohongan2025","text":"《 53 个 Grok Bot 模板》出视频版啦！！！\n\n用 Opus 5.5 + Blender 做的，3 分钟不到。\n\n说实话，自己看完都觉得，还是视频得劲。\n\n9000 多字的东西，文字版得翻半天，视频里 7 类一块一块过，哪类跟你有关一眼就知道。\n\n懒得看长文的，直接看这个视频。 https://t.co/HXZZmZRfGn","url":"https://x.com/yaohongan2025/status/2114335185915269293","createdAt":"2026-10-25T12:36:05Z","metrics":{"views":7087,"likes":70},"lang":"zh"},{"id":"2114380074808180795","author":"TUTAYADX","handle":"ki_mutaku","text":"めちゃくちゃ面白いし勉強になる。\n確かに仕様書作って一気に作らせるのは違和感あったんだよな。\n作る単位を小さくすることの重要性がすごく理解できた","url":"https://x.com/ki_mutaku/status/2114380074808180795","createdAt":"2026-10-25T15:34:27Z","metrics":{"views":30983,"likes":590},"lang":"ja"},{"id":"2114413993200648492","author":"unicode","handle":"unicodef1wn","text":"holy f*ck, elon musk's team at spacexai just dropped a full Grok Bot course, and it's free\n\n16 guides from the people who built it, plus the official guides page.\n\nit covers everything from your first chat to running whole teams of bots.\n\n4 modules:\nbasics, teams, jobs by role, advanced\n\n16 team articles\n\ncourses like this usually sell for $200-500. here they cost $0.\n\nhow to take it:\n\n1. start with the official guides page\n2. watch the video walkthrough\n3. read the articles for your role\n4. build your first team of bots\n\nofficial guides: https://t.co/9Vt3rE7GoX\nall other guides in the comments ↓\n\nsave this, then set up grok bot the way the spacexai engineers do in the article below ↓","url":"https://x.com/unicodef1wn/status/2114413993200648492","createdAt":"2026-10-25T17:49:14Z","metrics":{"views":6390,"likes":98},"lang":"en"},{"id":"2114379959263502712","author":"Jakub Krehel","handle":"jakubkrehel","text":"Added a new skill: /teardown\n\nIt creates a technical illustration of any object and lets you customize individual parts, colors and annotations. You can then export the result as an SVG or PNG.\n\nnpx skills add jakubkrehel/skills","url":"https://x.com/jakubkrehel/status/2114379959263502712","createdAt":"2026-10-25T15:34:00Z","metrics":{"views":85215,"likes":3153},"lang":"en"},{"id":"2114346251760406660","author":"そう@『n8nの教科書』マイナビ出版 10/22発売","handle":"so_ainsight","text":"Claude CodeやCodexの制作範囲を、画面から3D・動画まで広げるGitHubリポジトリ10選：\n\n1. UI UX Pro Max\n作りたいものの要件を読み、配色や書体などのデザインルールをまとめる。\nhttps://t.co/joEdpqe2Uj\n\n2. Impeccable\nAIで作った画面を24種類の操作と62個の判定ルールで点検し、仕上げを支える。\nhttps://t.co/ci7BPjy2BC\n\n3. diagram-design\nブランドの色や書体に合わせ、45種類の図解をブラウザで開ける1ファイルにまとめる。\nhttps://t.co/dwcLNRwEX2\n\n4. Penpot\nソースコードが公開されたデザイン基盤。AIが画面とコードを行き来する仕組みも備える。\nhttps://t.co/FAH6DlULfj\n\n5. img2threejs\n参考画像の被写体を、Web上で動かせるコード製の立体モデルとして組み直す。\nhttps://t.co/0Yda5CJZHi\n\n6. MCP for Blender\n3D制作ソフトのBlenderをAIにつなぎ、言葉でモデル作成や場面操作を支援する第三者製の連携ツール。\nhttps://t.co/O4suatCHFJ\n\n7. video-shotcraft\n実際のWebページを取り込み、124の撮り方の型と計150カットから選んで動画にする。\nhttps://t.co/3uKsJnmAM1\n\n8. Remotion\nReactという画面づくりの仕組みで動画を制作。AIに使い方を渡す公式資料もある。\nhttps://t.co/DdlqLer7uS\n\n9. HyperFrames\nWebページの見た目や画像などを動画に変換。Figmaの素材やブランド設定も取り込める。\nhttps://t.co/vSJhdJX4df\n\n10. lemo-opuscar\n生成AIモデルを使わず、コードだけで59種類の映画風表現を作った例をまとめている。","url":"https://x.com/so_ainsight/status/2114346251760406660","createdAt":"2026-10-25T13:20:03Z","metrics":{"views":1250,"likes":11},"lang":"ja"},{"id":"2114393133874311590","author":"duke","handle":"dvkexbt","text":"motion designers are cooked \n\nai did this in 30 sec \n\nprompt in cs","url":"https://x.com/dvkexbt/status/2114393133874311590","createdAt":"2026-10-25T16:26:21Z","metrics":{"views":8423,"likes":226},"lang":"en"},{"id":"2114306316219113825","author":"Pogo👾 // gmoriki代表","handle":"pogohopper8","text":"私が設定しているChatGPTのカスタム指示です","url":"https://x.com/pogohopper8/status/2114306316219113825","createdAt":"2026-10-25T10:41:22Z","metrics":{"views":276605,"likes":4981},"lang":"ja"},{"id":"2114503712987374029","author":"田中義弘 | taziku CEO / AI × Creative","handle":"taziku_co","text":"空のCADファイルから、63秒で住宅の図面を作成。\n\nKimi K3.1によるデモでは、壁や窓、ドア、キッチン、浴室などを配置し、3つの寝室を含む97.7㎡の住宅を設計。平面図だけでなく、屋根や煙突を含む正面図まで生成。\n\nAIが少しずつ業務範囲を広げ、現実的に。\nvia：@irinatoxi","url":"https://x.com/taziku_co/status/2114503712987374029","createdAt":"2026-10-25T23:45:45Z","metrics":{"views":975,"likes":10},"lang":"ja"},{"id":"2114194005550604511","author":"ルカ","handle":"11ruka_ai","text":"無料のMuseとショート動画の相性バグってるなwこれあればマジで30万とか余裕でいきそう。てか動画生成のレベル上がりすぎやし、30秒とかでポン出しで超ハイクオリティでるし、市場崩壊レベルじゃね、、、？ https://t.co/iFaND7O5jR","url":"https://x.com/11ruka_ai/status/2114194005550604511","createdAt":"2026-10-25T03:15:05Z","metrics":{"views":10255,"likes":139},"lang":"ja"},{"id":"2114495919442072041","author":"🟢DeepForest_Studio_AI🟢","handle":"DeepForest_Inc","text":"気になるものがオープンソースになりました\n\nMiniMax-H3を使った長尺動画生成システム「HyperFlow-Infinity」\n\nAIが生成した動画を自ら分析、キャラクターや物語の情報を記憶しながら、次のシーンを自動生成\n\n公式デモ「不思議の国のアリス」を題材に、約60分の動画生成を実現\n\n#MiniMaxH3 #HyperFlow","url":"https://x.com/DeepForest_Inc/status/2114495919442072041","createdAt":"2026-10-25T23:14:47Z","metrics":{"views":4826,"likes":105},"lang":"ja"},{"id":"2114396595856814553","author":"Antonio Rodríguez","handle":"Antonio_RodriIA","text":"Claude por fin puede generar motion graphics.\n\n28 instalaciones para Claude Code que hacen el trabajo:\n\nOpus y Sonnet 5.5 ya crean motion graphics bastante buenos sin complementos. Pero estas 28 herramientas los llevan mucho más lejos.\n\nMotores (el código que hace que las cosas se muevan):\n\n1. three.js → Crea escenas 3D, cámaras e iluminación.\n2. anime.js → Anima texto, formas y SVG.\n3. motion → Añade movimientos suaves y con efecto spring a sitios web.\n4. react-three-fiber → Crea escenas 3D con React.\n5. lottie-web → Reproduce archivos de After Effects en la web.\n6. gsap → Sincroniza cada movimiento hasta el fotograma exacto.\n\nRenderizadores (convierten todo en un archivo de vídeo):\n\n7. ffmpeg → Corta, une y convierte cualquier vídeo.\n8. remotion → Crea MP4 con React.\n9. hyperframes → Convierte una página HTML en un MP4.\n10. manim → Anima matemáticas y diagramas.\n11. motion-canvas → Crea vídeos explicativos con código y previsualización en tiempo real.\n12. revideo → Renderiza vídeos creados con código en un servidor.\n\nComponentes de UI (elementos listos para usar con animaciones):\n\n13. shadcn/ui → La base sobre la que funcionan los kits siguientes.\n14. react-bits → Añade textos y fondos animados.\n15. magicui → Añade componentes animados para landing pages.\n16. motion-primitives → Añade texto y elementos de UI en movimiento.\n17. magic-mcp → Crea interfaces a partir de una biblioteca de componentes.\n\nSonido (voz, música y subtítulos):\n\n18. whisper → Convierte una voz en subtítulos sincronizados.\n19. tone.js → Crea música y sonido mediante código.\n20. wavesurfer.js → Crea formas de onda de audio animadas.\n21. elevenlabs/skills → Voz y efectos de sonido (requiere cuenta).\n\nSkills y MCPs (enseñan a Claude a utilizar las herramientas):\n\n22. anthropics/skills → Añade skills de arte, canvas y GIF.\n23. mcp-for-blender → Permite a Claude controlar Blender en 3D.\n24. gsap-skills → Enseña a Claude a utilizar GSAP correctamente.\n25. remotion/skills → Enseña a Claude a utilizar Remotion.\n26. threejs-skills → Enseña a Claude a crear escenas con Three.js.\n27. after-effects-mcp → Controla After Effects (de pago).\n28. motion-graphics-skills → Mis 13 skills para motion graphics.\n\nAsí que empieza con un motor y un renderizador.","url":"https://x.com/Antonio_RodriIA/status/2114396595856814553","createdAt":"2026-10-25T16:40:06Z","metrics":{"views":3757,"likes":49},"lang":"es"},{"id":"2114396613468910070","author":"Shann³","handle":"shannholmberg","text":"how to improve your Opus 5.5 motion videos and make the review much cheaper\n\nif you use Opus 5.5 to review every frame of the videos you make, it quickly gets expensive and slow...\n\nso add a fast, cheap decision model to your workflow, and let it pick the frames Opus needs to see\n\nhere's the playbook, save it:\n\n1. add the decision model to your video workflow\n\nI use SageCut, a Claude Code plugin that runs the Sage decision model on Remotion videos\n\ninstall it in Claude Code\n\u003e /plugin marketplace add levantolabs/sagecut-release\n\u003e /plugin install sagecut@levantolabs\n\n2. open a new project folder, or your current agent chat, and prompt:\n\"Use SageCut to review my Remotion video at out/video .mp4\"\n\n3. set your own requirements\nthe first time, it asks for your brand (your website, a brand kit folder or 5 questions), and it will then be able to review every video against your colors, fonts, motion style and the words to avoid\n\nyou can also add your own yes/no questions for Sage to the review criteria.\n\nI want no slop in my videos, so I added my anti-visual-slop .md rule file to SageCut review skill\n\nwhat happens on each video:\n\u003e SageCut measures every frame in code: text size, blank frames, frozen frames, off-brand colors and the delivery spec\n\u003e Sage reads every frame and answers yes/no questions about it, including yours\n\u003e only the frames Sage selects go to the Opus 5.5 critics\n\u003e at the end, it shows what the review cost and what it saved\n\non Levanto's reference build, an Opus 5.5 critic cost about $0.10 and 8.6 seconds for each frame it viewed\n\n(repo in comments)","url":"https://x.com/shannholmberg/status/2114396613468910070","createdAt":"2026-10-25T16:40:10Z","metrics":{"views":5419,"likes":108},"lang":"en"},{"id":"2114503523916484741","author":"0xMarioNawfal - The Roundtable Show","handle":"RoundtableSpace","text":"Stop building your Claude second brain by hand.\n\n4 free repos that do the setup for you (stars at time of writing):\n\n1. obsidian-skills by kepano, Obsidian's CEO (~50K stars)\nAgent skills that teach Claude the Obsidian CLI, Markdown, Bases and JSON Canvas\nhttps://t.co/iWC2hgmv6J\n\n2. claude-obsidian (~16K stars)\nwiki, wiki-ingest, wiki-query and wiki-lint as ready-made commands for a source-cited vault\nhttps://t.co/PSsnoBgHl4\n\n3. obsidian-second-brain (~5K stars)\n48 commands for persistent agent memory, works in Claude Code, Codex, Gemini CLI and more\nhttps://t.co/twFZwzdanc\n\n4. second-brain-starter\nFill in a requirements template and it generates a personalized 9-phase build plan\nhttps://t.co/UT0sFbWSRV\n\nCaveats: only #1 comes from Obsidian's CEO; the rest are community projects. #4 is a plan, not working software, and lists no license. Read before you install.","url":"https://x.com/RoundtableSpace/status/2114503523916484741","createdAt":"2026-10-25T23:45:00Z","metrics":{"views":36975,"likes":47},"lang":"en"},{"id":"2114435701777568214","author":"まじん","handle":"Majin_AppSheet","text":"これは神Tips。\n今や俺のiPhoneは「ヘイ！〇〇」と呼べば、\n音声モードでAIアプリが立ち上がる。 https://t.co/oXKMK7EUyT","url":"https://x.com/Majin_AppSheet/status/2114435701777568214","createdAt":"2026-10-25T19:15:30Z","metrics":{"views":14383,"likes":244},"lang":"ja"},{"id":"2114305755775984116","author":"govin.eth | G哥","handle":"goan999999","text":"WTF！Grok bot 装置这7个开源项目直接起飞！！！\n\n别人还在一个个调教机器人，你已经可以免费组建自己的 AI 公司了！\n\n程序员、研究员、销售、运营、风控、审查员……不同机器人各司其职，自动分工、相互交接、独立验证结果，甚至能搭建完整的 AI 交易团队\n\n你能用到的Grok Bot扩张工具都在这里了！全部开源：\n\n1、awesome-grokbot：机器人配置搜索引擎【最荐】\n\n这里什么都有！按职位和用途搜索现成的 Grok Bot 配置，做研究、写代码还是业务运营，都能先找模板再修改，直接省去从零设计指令的时间\n\nhttps://t.co/zxIguOacSj\n\n2、botteams：直接组建 AI 公司\n\n选择团队类型，通过安装提示配置不同角色、群聊和工作流程，让机器人分工协作，而不是所有任务都交给一个 AI，直接给你分工好\n\nhttps://t.co/1WJrDKwDfF\n\n3、rosterroom：82 套现成团队配置\n\n覆盖创业、运营、安全、金融和研究等场景，还提供角色职责、任务分配和审批边界，可以直接拿来就能研究怎么搭建自己的 AI 团队\n\nhttps://t.co/BCRXl4P0Ny\n\n4、grok-bot-profiles：让 AI 相互审查\n\n需求编写、Bug 复现、代码生成、结果验证各有分工。尤其是独立验证环节，可以减少 AI 自己写、自己审却漏掉问题的情况\n\nhttps://t.co/xjHFV5JNsS\n\n5、hypergrok-trading-desk：7 个机器人组成交易团队\n\n这个覆盖市场研究、策略测试、风险分析和执行审查，研究如何把不同的金融分析任务拆开协作，直接让你成为策略大师\n\nhttps://t.co/uSdgtOc15Z\n\n6、grok-skills：195 个可复用工作技能\n\n从代码审查、调试到研究、写作和项目规划，把常用流程变成可复用的技能，不用每次都重新教 AI 怎么干活\n\nhttps://t.co/6oU2J0eZzO\n\n7、grok-bot-token-saver：减少上下文浪费\n\n通过精简角色卡和任务交接，让下一个机器人直接获取关键进度，避免反复阅读冗长的历史对话，复杂任务非常尤其值得尝试\n\nhttps://t.co/SvPSlh8WZM\n\n7 个项目全部开源，先收藏起来，你会用得上！","url":"https://x.com/goan999999/status/2114305755775984116","createdAt":"2026-10-25T10:39:08Z","metrics":{"views":6815,"likes":89},"lang":"zh"},{"id":"2114433452972122619","author":"VALIX","handle":"RetroValix","text":"This guy used Grok Bot to build an asynchronous complete-set trading system on Polymarket\n\nResult: +$319,430\n\nThe system makes 131 trades an hour in short-term crypto Up/Down markets, with an average trade size of $30.58\n\nSeveral Grok Bot AI agents work together as one algorithm:\n\n1. Builds positions on both sides\n\nIt bought both Up and Down in 88.76% of markets\n\nThe median gap between its first trades on each side is 35 seconds\n\nIt then keeps switching between them as the market reprices, turning directional inventory into matched Up/Down pairs\n\nAverage cost per pair:\n\n\u003e Up + Down before fees = 96.35¢\n\u003e Up + Down after taker fees = 98.69¢\n\u003e Structural edge = 1.31¢\n\n2. Builds directional positions\n\nOnly 58.66% of two-sided markets ended up with an average cost per pair below $1 after fees\n\nSome shares remain directional and provide an additional edge\n\nIts Polymarket account: norm1e69\n\nThe system’s main edge comes from asynchronous pairing:\n\n\u003e It uses repricing to turn part of its Up and Down inventory into complete sets \u003c $1\n\u003e It holds the unpaired remainder as a directional position until resolution","url":"https://x.com/RetroValix/status/2114433452972122619","createdAt":"2026-10-25T19:06:34Z","metrics":{"views":8642,"likes":91},"lang":"en"},{"id":"2114326364895777210","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに経理担当、これは真似したいぃぃ！いや、今からですすぐにできちゃいますねコレ\n\nGOROmanさんのやり方\n・Googleフォトを、Grok Botにつなぐ\n・レシートっぽい写真を、botが勝手に見つける\n・見つけたものを、そのまま登録してもらう\n\n撮るだけで記帳が進むなら、レシートをためこむ理由がなくなる\nClaude CodeやCodexでやってたけど、Grok Botのほうがだんぜん楽だわ","url":"https://x.com/tetumemo/status/2114326364895777210","createdAt":"2026-10-25T12:01:02Z","metrics":{"views":6275,"likes":86},"lang":"ja"},{"id":"2114352296913961208","author":"Bober_smart","handle":"Bober_smart","text":"It is becoming f*cking dangerous: The Claude Code tool found absolutely every shot that I considered permanently deleted from my iPhone. Data spanning 4 years of photos and videos was continuously stored in a disguised system cache. Every application with permissions to the file system had direct access to them\n\nI synced my smartphone with a MacBook to create a backup. Then I ran the Claude Code vulnerability scan mentioned in my previous post. The scanner unexpectedly flagged a folder that I had not even asked it to check, a system directory named PhotoData/Thumbnails containing over 183,000 items. Pictures, video clips, screenshots, absolutely everything I had gotten rid of\n\nArchives for 2021, 2022, 2023, and 2024. Shots I deleted instantly after taking them. Photos for which I manually cleared the Recently Deleted section. Originals that I double checked and erased a second time just to be safe. All of it was still stored there\n\nWhat exactly was found in that cache:\n\nA random photo of a recipe from a cookbook from 2023\n\nScreenshots of shopping lists and notes with daily chores\n\nFailed takes and blurry landscape shots deleted right during a walk\n\nA screenshot of a bus schedule from 2022 captured for just a few seconds\n\nPhotos of price tags and store labels deleted right at the checkout\n\nA saved meme image from social media that I deleted back in 2024\n\nA total of 173,521 files. Some of them in original resolution. Everything neatly sorted chronologically starting from 2021\n\nWhen you delete media on an iPhone, iOS simply removes it from your gallery and trash. In reality, iOS keeps compressed copies in the Spotlight search index directory. That is precisely how fast keyphrase search works on your phone. Apple never clears this area, not after a month, not after a year. Claims of permanent deletion are simply untrue\n\nI decided to check the list of software that has permission to access Files and Folders. It turned out there were 19 of them: weather utilities, QR code scanners, PDF readers, and even an old flashlight app installed in 2021. Any of these applications could freely read the data I considered destroyed all this time\n\nI cut down the list of these applications from 19 to 5 in just a couple of clicks\n\nThe beauty of modern technology is that it allows us to recall what we have long forgotten","url":"https://x.com/Bober_smart/status/2114352296913961208","createdAt":"2026-10-25T13:44:05Z","metrics":{"views":14215,"likes":141},"lang":"en"},{"id":"2114371577798172920","author":"savip.","handle":"savipww","text":"THIS IS F*CKING INSANE, I TOLD JEV + MY GROK BOTS TO ONLY BUY COINS BORN TONIGHT, WENT TO SLEEP, AND THEY TURNED MY $100 INTO $2,061 BY SUNRISE\n\n4.5M of you watched my last $100 run, so i started over\n\neveryone else's bots buy coins after they pump, mine only buy newborns\n\na memecoin is a coin backed by nothing but a picture and a crowd\n\nJev is a tiny AI judge, it says yes or no faster than a blink, for under a cent\n\nJev picks it, my Grok bots trade it, i sleep\n\nthe new rule:\nonly coins born in the last day. Jev checked 268 and said yes to one\n\nthe coin:\na kitten with a battle axe called Cattleaxe, 5 minutes old, $282K at 7:40pm\n\nthe night:\n→ 7:50pm in at $226K, out at $791K, +$191\n→ 11:05pm in at $669K, out at $1.46M, +$355\n→ 12:30am the coin dipped, Jev said buy at $1.22M, out at $2.23M, +$491\n→ 3:15am sold the top of the night, $2.60M, +$514\n→ 3:50am a bounce faked us out, -$23\n→ 5:20am sold $2.44M, then the coin dropped 23%, +$197\n→ 6:10am bought the drop at $1.89M, out at $2.06M, +$149\n\nholding it from 7:40pm would've made you 629%\n\nmy bots made 1,961% on the same coin while i slept\n\nanyone who bought the 3:15am top was down 21% by 6:35am\n\nhonestly the 5:20am sell is what i'd pay for, i've ridden too many tops back down\n\n$100 → $298 → $726 → $1,228 → $1,747 → $1,918 → $2,061\n\nwatch second 22, the bots sell right before the coin drops\n\ni left the whole setup below ↓ free, steal it\n\nbookmark this before night 2\n\nsend this to the friend who only buys after a coin is up 10x\n\nwould you let a bot buy a 5 minute old coin, or wait until it looks safe?","url":"https://x.com/savipww/status/2114371577798172920","createdAt":"2026-10-25T15:00:41Z","metrics":{"views":5779,"likes":83},"lang":"en"},{"id":"2114402733629268468","author":"宝玉","handle":"dotey","text":"Techartist 用 Opus 5.5 做了本 3D 可视化物理课本《Every Joule》：十课讲完英国中学“能量”单元，免费在线看\n\n覆盖英国 GCSE 物理“能量”整章。GCSE 是英国学生 16 岁左右参加的毕业考试，大致相当于我们的中考。\n\n用 Anthropic 的 Opus 5.5 模型和 Three.js（在网页里画 3D 的开源工具）做的。","url":"https://x.com/dotey/status/2114402733629268468","createdAt":"2026-10-25T17:04:30Z","metrics":{"views":28052,"likes":396},"lang":"zh"},{"id":"2114484662945120425","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botでやって一番よかったのは、この一言を頼んだことだったらしい\n\nfabioricottaさんがGrok Botに頼んだのは\n「自分のコンピューターにClaude CodeとCodexを入れて、作業の大半をそっちに回して。あなたは指揮役として、品質の確認と必要な手直しだけをして」\n\nそれで、使用量の上限がずっと長持ちするようになったとのこと\n私もGrok Botを司令塔にして、Claude CodeやCodexに手を動かしてもらう形にしているので、これはよくわかる\n\nけど、グループチャットはトークンをメチャ消費するからなるべく使いすぎないようにしている","url":"https://x.com/tetumemo/status/2114484662945120425","createdAt":"2026-10-25T22:30:03Z","metrics":{"views":2622,"likes":18},"lang":"ja"},{"id":"2114505089620852739","author":"金子紗也 | TSUNAIDE CEO","handle":"majimedesu_","text":"メモ:\nこれやる","url":"https://x.com/majimedesu_/status/2114505089620852739","createdAt":"2026-10-25T23:51:13Z","metrics":{"views":5069,"likes":17},"lang":"ja"},{"id":"2114178232425775371","author":"AI動画ラボ | AI contents director","handle":"aidoga_lab","text":"動画生成AIを使わず、コードだけで、オーディオビジュアル作品を作りました。\n\n作り方はリプに🧵 https://t.co/obKM3yJrHp","url":"https://x.com/aidoga_lab/status/2114178232425775371","createdAt":"2026-10-25T02:12:24Z","metrics":{"views":11736,"likes":309},"lang":"ja"},{"id":"2114490598925520931","author":"karamage💎アプリ個人開発","handle":"kara_mage","text":"CLAUDE.md にこれ足しとこう","url":"https://x.com/kara_mage/status/2114490598925520931","createdAt":"2026-10-25T22:53:38Z","metrics":{"views":10698,"likes":38},"lang":"ja"},{"id":"2114553100778221683","author":"しゅうじ＠AIでデザインする人","handle":"Banner_marketer","text":"同じ花の案内を、\n4つの配色で見比べる。\n白と深緑なら軽やかに、\n紺とアイボリーなら落ち着いた印象へ。\n「好みの色」だけで迷ったら、\n誰にどんな雰囲気で届けたいかから選び、\n短い指示をAIへ渡してみてください。","url":"https://x.com/Banner_marketer/status/2114553100778221683","createdAt":"2026-10-26T03:02:00Z","metrics":{"views":9,"likes":0},"lang":"ja"},{"id":"2114390462303723930","author":"monokern","handle":"monokern","text":"holy sh*t.. my TV now runs a full Grok Bot RESEARCH team\n\nGrok Bot was already running on my TV after Reverse Engineer test, so I wanted to give it a real job\n\nI moved Reagent Crew onto TV, a team I made for my project @reagent_rwa (basically a crew for deep research on any token)\n\nusing voice input I told them TO ANALYZE PUMP ON SOLANA, and they ran exactly same process that already works in my system\n\nwhat came back:\n\n→ mint and freeze are switched off, so nobody can print more or lock wallets\n→ deepest pool holds around 22.9M in liquidity, with about 3M traded over last day\n→ roughly 66% of supply sits in lockers and vaults, so the thing to watch is whether that unlocks later\n→ rest of checks on ownership and permissions came back clean\n\nwhole run on TV took about 32 seconds, a bit slower than I'm used to. on my PC same check usually finishes around 1.5x faster\n\nbut honestly, it still blows my mind\n\nofficial Grok Bot guides and my full blueprint below ↓","url":"https://x.com/monokern/status/2114390462303723930","createdAt":"2026-10-25T16:15:44Z","metrics":{"views":3248,"likes":99},"lang":"en"},{"id":"2114388357912351216","author":"spect","handle":"spectnfa","text":"HOLY F*CK, ELON MUSK'S TEAM JUST BUILT 146 FREE BOTS. I SORTED ALL OF THEM INTO TIERS\n\n5 tiers. the higher the tier, the more the bot does without you.\n\nS: cloud agents, PR watching. you only approve\nA: research and drafts. you send\nB: clips, reports, call scores\nC: plant log, street cleaning times\nD: packages and birthdays\n\nno prompt engineering, no config files.\n\nhow to get them:\n\n1. download (mac, windows, linux, iOS)\n2. sign in with your plan\n3. https://t.co/WLK5u5paRO → pick a bot → add\n\nsave this and start with S-tier ⭣","url":"https://x.com/spectnfa/status/2114388357912351216","createdAt":"2026-10-25T16:07:22Z","metrics":{"views":6428,"likes":90},"lang":"en"},{"id":"2114319310005150101","author":"Annatar.md","handle":"AnnatarXBT","text":"agent memory, in 13 pages\n\nthe fix that took one setup from 26,000 tokens per query down to 1,800\n\nyour agent reads the same 12 files every morning, reaches the same conclusions and bills you again for both\n\nthe 5 layers that stop it:\n\u003e working memory - what it sees right now, gone once the window fills\n\u003e episodic memory - a timestamped log, so the deploy that died at 3am gets explained once\n\u003e semantic memory - facts in a knowledge graph, like \"this user prefers TypeScript\"\n\u003e procedural memory - three approaches tried, the one that worked saved as a skill\n\u003e forgetting - what to delete before contradictions pile up\n\nthe numbers:\n\u003e Mem0 - 1,800 tokens per query instead of 26,000, with 91% lower latency\n\u003e Snowflake - one ontology layer, 20% more accuracy, 39% fewer tool calls\n\nthe forgetting engine is the layer almost nobody builds, and it decides whether the other four stay worth trusting\n\nmemory cuts what your agent reads. Jev cuts what it pays to decide, and on the decision side that took one Claude bill from $765 to $3 a month 👇","url":"https://x.com/AnnatarXBT/status/2114319310005150101","createdAt":"2026-10-25T11:33:00Z","metrics":{"views":12090,"likes":234},"lang":"en"},{"id":"2114366263556256080","author":"max","handle":"maxwell_lenoir","text":"ESTO ES UNA LOCURA\n\nAnthropic convirtió los Agent Skills en un estándar abierto y GitHub se ha llenado de equipos de agentes para Claude Code gratis.\n\n→ un solo repo trae 135 agentes, 35 skills, 42 comandos y 176+ plugins\n→ otro te da más de 100 subagentes especializados\n→ y el repo oficial anthropics/skills te enseña cómo se escribe un SKILL.md\n\ntodo gratis.\n\nguárdalo y sígueme para más → @maxwell_lenoir","url":"https://x.com/maxwell_lenoir/status/2114366263556256080","createdAt":"2026-10-25T14:39:34Z","metrics":{"views":3706,"likes":71},"lang":"es"},{"id":"2114446672831058376","author":"Tobi","handle":"tobiadonadon_","text":"the marketing gold rush is here\n\ncreating high quality animations with claude is really cheap but it’s not easy, nor fast\n\ni built an automated workflow skill to make beautiful animations with claude\n\nyou give it a verse, a quote or a story, and say how it should look\n\nit draws every frame, narrates it and scores it\n\n→ describe the look in your own words: oil paint, watercolour, crayon, ink, storybook\n→ writes every scene as code and paints each frame like hand animation\n→ reads it aloud with a voice that runs on your computer, or use your own\n→ captions timed to every word\n→ music composed for each short, nothing to license\n→ vertical, square or wide\n→ a 40 second short rendered in under a minute\n\non the pro plan you can make 50+ a day, on the 5X you can make 250\n\ni'm giving the whole workflow + skill away for free\n\ncomment \"animator\" and i'll send it over","url":"https://x.com/tobiadonadon_/status/2114446672831058376","createdAt":"2026-10-25T19:59:05Z","metrics":{"views":43134,"likes":956},"lang":"en"},{"id":"2114458865001513409","author":"Mika","handle":"mika_systems","text":"i still can't believe a gaming PC did this much in one night\n\nJensen Huang (CEO of NVIDIA) posted an idea that hit 14 million views:\n\n\"the most powerful AI computer most people own is the one they game on\"\n\none builder took it literally: an RTX 4090 left running overnight with 4 years of bank statements, receipts and emails. none of it ever left the PC\n\nby 7am Claude Code had a list of subscriptions nobody used, charges that hit twice and refunds promised by email and never paid. every claim letter was already drafted and waiting for a yes\n\na week later the builder had $3,260 back in the account\n\n10 GitHub repos behind that night:\n\n01 gpu-unlock-ada → an experimental Linux module that doubles an RTX 4090's tensor speed, from 165 to 331 TFLOPS, so the night shift reads twice as much before morning\nhttps://t.co/hEWDm8TWDH\n\n02 Docling → turn years of PDF bank statements into clean tables the agent can actually read\nhttps://t.co/np9RlRWqHz\n\n03 Tesseract → read photos of paper receipts, so the ones in a shoebox count too\nhttps://t.co/sp999iUqoW\n\n04 Ollama → run the model on your own GPU, so not one transaction leaves the room\nhttps://t.co/KB3LR1TriZ\n\n05 llama.cpp → fit a big model onto a gaming card, so it reads like a pro without a server\nhttps://t.co/hD19FQ6b07\n\n06 vLLM → let several agents read statements, receipts and emails at the same time instead of one by one\nhttps://t.co/0X0f3ZEciw\n\n07 DuckDB → query four years of transactions in seconds to catch the same charge hitting twice\nhttps://t.co/iSD884ibKr\n\n08 Qdrant → match every charge to the email or receipt behind it, so a missing refund stands out\nhttps://t.co/pkXpmVxG4c\n\n09 Firefly III → keep the cleaned-up ledger in a personal finance app you host yourself\nhttps://t.co/wHsP3iQY8S\n\n10 Open WebUI → check what the night shift found from your phone over coffee\nhttps://t.co/cPDUZHtVMX\n\nstart with one year of statements from one card. once the list matches what you'd catch by hand, give it the rest\n\nmost people use a $1,600 card to render grass. this one paid for itself twice\n\nhow to set up the same night shift on your PC ↓","url":"https://x.com/mika_systems/status/2114458865001513409","createdAt":"2026-10-25T20:47:32Z","metrics":{"views":844,"likes":29},"lang":"en"},{"id":"2114447152332308957","author":"Donatello","handle":"DonatelloXPro","text":"My Grok Bot turned $3,615 into $15,112 before my 5pm barber appointment.\n\nI gave it one task: make it 4x. And one rule: no position is allowed to lose more than 4%.\n\nIt hit 4x. Then it kept going. 4.18x.\n\n+$11,497. 25 trades. 23 green. 2 red.\n\nIt isn't one bot. It's five agents, each with one job, zero emotions:\n\n\u003e GLACIER rides slow trends and trails out\n\u003e FROST farms funding arb\n\u003e POLAR trades the news the second it drops\n\u003e SLEET grid scalps, takes 80%, leaves a runner\n\u003e SENTRY trades nothing. Any position hits -4%, it kills it\n\nGLACIER went 7-0. FROST went 6-0. POLAR and SLEET took one loss each.\n\nSENTRY cut twice. Saved $171. Without it I'd have held both losers and prayed. Everybody does.\n\nHere's what the last few seconds looked like:\n\n-\u003e SLEET closes litecoin +48%, +$1,244, runner left\n-\u003e Goal 4x reached, $3,615 → $14,460\n-\u003e POLAR closes bitcoin +28%, +$669, target hit\n-\u003e GLACIER takes partial on gold at +13%\n-\u003e GLACIER closes gold +24%, +$788, trailing stop\n\n0 positions open. Every dollar booked.\n\nAnyone can find a setup that works on a good day. The edge is killing the bad trade at -4% before it turns into -40%.\n\n92% of trades land. The other 8% never get the chance to hurt.\n\nThe whole build is in the post below ↓","url":"https://x.com/DonatelloXPro/status/2114447152332308957","createdAt":"2026-10-25T20:01:00Z","metrics":{"views":969,"likes":33},"lang":"en"},{"id":"2114367764966060277","author":"ben.","handle":"benyuls","text":"una chica de 17 años factura 7.800$ a la semana. \nsolo con Google Maps + Claude.\n\nno ha hecho una web en su vida.\n\nme reí. me enseñó su stripe. me quedé callado.\n\nlo único que hace:\n\n→ abre google maps\n→ busca \"tacos filadelfia\"\n→ elige uno de 4,7 estrellas\n→ con web de 2013\n→ copia sus datos\n→ los pega en un constructor\n→ sitio listo en 20 min\n\nhace 6 meses ganaba 9$/h en mcdonald's. el uniforme todavía cuelga en su armario\n\nenvía la web terminada, con el nombre del negocio ya puesto, y se va a dormir\n\nel dueño de la taquería abre el link. se lo enseña a su hija. \"¿esto somos nosotros?\" paga 4.800$ esa misma noche.\n\n\"¿esto va en serio? ¿cuánto cobras?\" así fue su martes.\n\nmes 1: 800$\nmes 2: 4.100$\nla semana pasada: 10.400$\n\nuna agencia web pediría 14.500$, cuatro personas y seis semanas.\n\nella:\n\n→ 0$ de inversión\n→ trabaja sola\n→ 20 min por cliente\n\nsu padre sigue creyendo que trabaja en mcdonald's.\n\neste es el mismo sistema, pero escalado: una máquina de captación b2b de 10k$/mes con la misma lógica, sin llamadas en frío ni anuncios ↓\n\nguárdalo. no lo vas a volver a ver tan claro.","url":"https://x.com/benyuls/status/2114367764966060277","createdAt":"2026-10-25T14:45:32Z","metrics":{"views":97401,"likes":679},"lang":"es"},{"id":"2114503775876727227","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"【海外で話題】\n2か月で作ったLPが、全部このクオリティだと話題😳\n作ったのは海外のデザイナー。使ったのはHiggsfield・Claude・Cursorと、自作のデザインスキル\nその名も\nーーー ai-design-skills\nhttps://t.co/IxTx2EXNjf\nこのスキルの中身がヤバい👇\n・作る前に「目的・読者・お客さんが申し込まない理由」をまとめて質問してくる\n・見出し→申込ボタン→実績→FAQまでのページ構成を指定\n・文字サイズ・余白・角丸・動きの数値まで細かく決めてある\n・静止画のデザインを動く紹介動画にするスキルも同梱\n・Claude Codeなら.claude/skillsにフォルダを置くだけで使える\n・CursorやCodexでも使える\n・MITライセンスで無料、GitHubのスターは5,000超\nこれまでAIが作るLP👇\n「それっぽいけど、どこかで見た画面」\n\nでもこのスキルは違う。\n売れるページの型と見た目のルールを\n最初からClaudeに渡してある。\nつまり\n・ファーストビュー\n・お客さんの声\n・よくある質問\n全部が「デザイナーの基準」で組まれる。\nAIに頼むLPの出来そのものが変わる。\nしかもこれ、有料テンプレじゃない。\nデザイナー本人が中身ごと無料で公開してる。\nフォントや色は1か所を書き換えれば自分好みにできる。\nAIに作らせると見た目が普通になる問題に、正面から答えてる。\nClaude CodeでLPやサイトを作ってる人は、一度入れてみてほしい。\n\nスキルを入れたら、あとはClaude Codeへの頼み方の基本を押さえているかで仕上がりの速さが変わる。今ちょうど『Claude Codeの教科書』を含む有料級6点を期間限定で無料配布中。\n6大プレゼントの中身と受け取り方は、この下の投稿で👇","url":"https://x.com/ClaudeCode_love/status/2114503775876727227","createdAt":"2026-10-25T23:46:00Z","metrics":{"views":2849,"likes":19},"lang":"ja"},{"id":"2114296158059405823","author":"Koder","handle":"koder_dev","text":"バイブコーディング6週間続けたらMacの起動が20分かかるようになった話、他人事じゃなさすぎて笑えない..\n\n原因、/tmpにClaude Codeの作業ファイルが99万個溜まってたらしい\n\n速く作るための仕組みが別の場所で負荷になるの、めっちゃありそうで怖い\n\n自分のMacもあとで見る","url":"https://x.com/koder_dev/status/2114296158059405823","createdAt":"2026-10-25T10:01:00Z","metrics":{"views":50779,"likes":618},"lang":"ja"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
