<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-26T12:13:29+09:00","posts":[{"id":"2114360213411348844","author":"小墨同学","handle":"xiaomovps","text":"Grok Bot 的 $30 套餐额度不够用？分享一个省 Token 的小玩法，搭配 Pi Agent 和 OpenRouter，日常任务能省下不少额度🔥\n\n最近一直在折腾 Grok Bot，发现很多简单任务其实没必要全部交给它背后的模型处理\n\n我觉得可以把一些不复杂的工作交给 OpenRouter 免费模型，Grok Bot 主要负责调度，这样就能把套餐额度留给更重要的任务\n\n整个配置也不复杂，分享一下具体操作\n\n1、先注册 OpenRouter\n\nhttps://t.co/Iyabrn4MTc\n\n建议先充值 $10，官方目前的规则是，免费模型从每天 50 次请求提高到 1000 次，每分钟最多 20 次\n\n注意，这 $10 不是购买无限 Token，而是提高免费模型的请求上限\n\n2、在 Grok Bot 的云电脑里安装 Pi Agent\n\nPi 本身就支持 OpenRouter，不需要额外安装第三方 Provider 插件\n\n3、配置 OpenRouter API Key\n\n进入 OpenRouter 创建 API Key，在 Pi 中通过 /login 添加，或者设置 OPENROUTER_API_KEY 环境变量\n\n之后通过 /model 选择带  标识的免费模型\n\n4、让 Grok Bot 学会任务分流\n\n这个是我觉得最有意思的地方\n\n直接告诉 Grok Bot，后续遇到简单的资料整理、文本处理、文件修改等任务，可以优先调用 Pi，使用 OpenRouter 的免费模型完成\n\n复杂任务再交给 Grok Bot 自己处理\n\n这样一来，相当于给 Grok Bot 增加了一个低成本的执行入口，不用每件小事都消耗昂贵的模型额度\n\n不过这里有两个地方需要注意\n\n① 免费模型有请求次数、速度和可用性限制，并不是无限使用\n\n② Grok Bot 负责判断和调用 Pi 的过程，仍然可能消耗它自己的套餐额度，实际能省多少要看任务怎么分流\n\n我比较喜欢这种组合方式，Grok Bot 负责整体工作流，Pi 负责调用便宜模型，遇到复杂任务再切回强模型\n\n尤其是每个月只有 $30 套餐额度的朋友，可以试试这种思路，把有限的额度花在真正需要的地方","url":"https://x.com/xiaomovps/status/2114360213411348844","createdAt":"2026-10-25T14:15:32Z","metrics":{"views":4647,"likes":44},"lang":"zh"},{"id":"2114359794140397609","author":"KeenZ😶‍🌫️","handle":"0xkeenz","text":"用了 Tailscale 好久，只限制了 ACL 相关权限，没注意还有 Tailnet Lock 这玩意 🤡\n\n刚才查了一下，这功能相当于给设备进入 Tailscale 网络加了一层签名验证，就算未来 Tailscale 官方被黑，也能防止黑客往你内网添加恶意设备\n\n如果不开这功能，一旦 Tailscale 官方服务器被黑，并且如果你 ACL 权限没限制好，黑客完全可以利用恶意设备一路打穿你内网····\n\n鉴于目前ai打洞和喝水一样，我果断光速打开了🤡····","url":"https://x.com/0xkeenz/status/2114359794140397609","createdAt":"2026-10-25T14:13:52Z","metrics":{"views":82835,"likes":964},"lang":"zh"},{"id":"2114257401809707058","author":"三个三","handle":"3three_AI","text":"高盛给每个量化研究员开约 70 万美元年薪，靠的就是这个仓库！\n\n它叫 gs-quant，由高盛自己的量化团队开发和维护，已经 12.9k 星。\n\n先搞懂它是怎么运作的：\n\n1. 高盛的量化研究员自己写了这套技能：8 个文件、1847 行，教 Claude 用他们的工具包：定价、风险、投资组合、行情数据、回测、互换、互换期权、外汇期权、Delta 对冲、交易成本，全在里面。\n它甚至列出了你会遇到的报错，以及怎么修。\n\n2. Claude 每次写 gs-quant 代码都会自动调用它，风险数学直接在你笔记本上跑：波动率、回撤、z 分数、beta、RSI。\n\n下面是你自己免费跑起来的步骤：\n\n1. 打开 Claude Code，装高盛的库：pip install gs-quant，或者直接拉这个仓库——https://t.co/VLvsHaJcXc\n\n2. 添加技能：python -m gs_quant.skills install --global\n\n3. 让 Claude 用 finance 拉任意股票和 SPY 的 5 年日线价格\n\n4. 在上面跑高盛的风险数学：波动率、最大回撤、z 分数、布林带、RSI\n\n5. 看 60 天 beta 和相对 SPY 的相关性。到底是这只股票在动，还是整个市场在动？\n\n6. 标出 z 分数跌破 -2 的每一天。那意味着价格比正常水平低了 2 个标准差\n\n7. 回测一条规则：-2 以下买入，回到 0 卖出，算上手续费。Claude 写代码，在你笔记本上跑\n\n8. 拿它跟一直持有对比。如果扣掉手续费还跑不赢买入持有，那就不是优势","url":"https://x.com/3three_AI/status/2114257401809707058","createdAt":"2026-10-25T07:27:00Z","metrics":{"views":76162,"likes":1189},"lang":"zh"},{"id":"2114512386065653853","author":"AM09:21","handle":"AM09_21","text":"これ楽しすぎて時間溶ける\n通常の残差ストリームの大きさを基準にして、僅か1,2個のニューロンにちょっとのベクトルを足すだけで性格とか口調を正確に書き換えれるなんて\n\nこりゃーもしかしたら、ロールプレイング系でも単なるICLよりもずっと強い人格矯正手法になるかもしれん\n\nマジドパる","url":"https://x.com/AM09_21/status/2114512386065653853","createdAt":"2026-10-26T00:20:13Z","metrics":{"views":12627,"likes":293},"lang":"ja"},{"id":"2114277200354533817","author":"OUNCE","handle":"ounce_online","text":"그록봇 좋은건 알겠는데 그동안 쓰던 에이전트 버리고 넘어가긴 아쉽고, 이전하긴 귀찮고 하신분들 codync 꼭 써보세요!! (심지어 무료임!!)\n\n내가 쓰던 에이전트를 그대로 봇에 연결해 사용할 수 있습니다. (메모리, 지침, 스킬 다 그대로 사용가능) 그러면서 그록봇과 비슷한 수준의 모바일 접근이 가능함.\n\n거기에 더해 봇들끼리 기억을 공유하거나 메세지를 주고받는 codync 자체 기능들을 사용해 내 모든 에이전트를 연결 시킬 수 있습니다! 저는 헤르메스봇들을 1:1로 codync 봇으로 매칭시켜서 쓰는 중.\n\n코덱스, 클로드, 헤르메스, 안티그래비티, 파이, 오픈코드 등등.. 왠만한건 다 쉽게 내가 쓰던 그대로 붙여 봇으로 세팅할 수 있고 커스텀 연결도 어렵지 않게 가능함.\n\n내 컴퓨터 화면 원격으로 접근해 사용가능하고, 여러 컴퓨터도 한 화면에 연결 가능합니다! 크롬 리모트 데스크탑도 대신할 수 있음.\n\n무엇보다 가장 맘에 드는건 모바일 친화적이라. 거의 그록봇과 유사한 퍼포먼스와 디자인을 모바일 환경에서 보여줍니다. 오히려 더 나을때도 있음. \n\n알림 잘오고 잠금화면, 다이나믹 아일랜드, 위젯에서 작업상황을 한눈에 볼 수 있고, 구독 사용량 조회도 가능함.\n\n사실 헤르메스 공식 모바일 앱이 없어서 이앱 저앱 수많은 써드파티 앱들을 써봤지만 항상 랙걸리고 오류나고 하던데, 이렇게 랙 없이 편하게 쓴건 처음입니다.\n\n비슷한 류의 오픈봇, 마우스봇, 라카조 등이 있지만 다 써봐도 codync 만한게 없습니다. 기능은 비슷할 수 있어도 다른 것들은 사용하다보면 앱이 미묘하게 불편한데, 이건 UI UX를 진짜 잘 짜놔서 밤티 알러지 있는 분들께 꼭 추천드림!\n\n개발자 : @lbki34064963 🙇‍♂️\n사용해보실 분들 링크는 댓글에👇","url":"https://x.com/ounce_online/status/2114277200354533817","createdAt":"2026-10-25T08:45:40Z","metrics":{"views":21242,"likes":216},"lang":"ko"},{"id":"2113903037576266074","author":"広告の裏側","handle":"hassii_ad","text":"Muse祭りすぎる！！！！\n紹介で上限300億トークンになったので、皆さんもこのリプに自分の招待コード書いてトークン貰ってください！\n10億トークンあればインスタの投稿500万件ぐらいは取得できると思います。\nそれをCodexやClaudeに分析させれば何でもできる！ https://t.co/zcMX18xGua","url":"https://x.com/hassii_ad/status/2113903037576266074","createdAt":"2026-10-24T07:58:53Z","metrics":{"views":64419,"likes":491},"lang":"ja"},{"id":"2114396595856814553","author":"Antonio Rodríguez","handle":"Antonio_RodriIA","text":"Claude por fin puede generar motion graphics.\n\n28 instalaciones para Claude Code que hacen el trabajo:\n\nOpus y Sonnet 5.5 ya crean motion graphics bastante buenos sin complementos. Pero estas 28 herramientas los llevan mucho más lejos.\n\nMotores (el código que hace que las cosas se muevan):\n\n1. three.js → Crea escenas 3D, cámaras e iluminación.\n2. anime.js → Anima texto, formas y SVG.\n3. motion → Añade movimientos suaves y con efecto spring a sitios web.\n4. react-three-fiber → Crea escenas 3D con React.\n5. lottie-web → Reproduce archivos de After Effects en la web.\n6. gsap → Sincroniza cada movimiento hasta el fotograma exacto.\n\nRenderizadores (convierten todo en un archivo de vídeo):\n\n7. ffmpeg → Corta, une y convierte cualquier vídeo.\n8. remotion → Crea MP4 con React.\n9. hyperframes → Convierte una página HTML en un MP4.\n10. manim → Anima matemáticas y diagramas.\n11. motion-canvas → Crea vídeos explicativos con código y previsualización en tiempo real.\n12. revideo → Renderiza vídeos creados con código en un servidor.\n\nComponentes de UI (elementos listos para usar con animaciones):\n\n13. shadcn/ui → La base sobre la que funcionan los kits siguientes.\n14. react-bits → Añade textos y fondos animados.\n15. magicui → Añade componentes animados para landing pages.\n16. motion-primitives → Añade texto y elementos de UI en movimiento.\n17. magic-mcp → Crea interfaces a partir de una biblioteca de componentes.\n\nSonido (voz, música y subtítulos):\n\n18. whisper → Convierte una voz en subtítulos sincronizados.\n19. tone.js → Crea música y sonido mediante código.\n20. wavesurfer.js → Crea formas de onda de audio animadas.\n21. elevenlabs/skills → Voz y efectos de sonido (requiere cuenta).\n\nSkills y MCPs (enseñan a Claude a utilizar las herramientas):\n\n22. anthropics/skills → Añade skills de arte, canvas y GIF.\n23. mcp-for-blender → Permite a Claude controlar Blender en 3D.\n24. gsap-skills → Enseña a Claude a utilizar GSAP correctamente.\n25. remotion/skills → Enseña a Claude a utilizar Remotion.\n26. threejs-skills → Enseña a Claude a crear escenas con Three.js.\n27. after-effects-mcp → Controla After Effects (de pago).\n28. motion-graphics-skills → Mis 13 skills para motion graphics.\n\nAsí que empieza con un motor y un renderizador.","url":"https://x.com/Antonio_RodriIA/status/2114396595856814553","createdAt":"2026-10-25T16:40:06Z","metrics":{"views":3757,"likes":49},"lang":"es"},{"id":"2114367764966060277","author":"ben.","handle":"benyuls","text":"una chica de 17 años factura 7.800$ a la semana. \nsolo con Google Maps + Claude.\n\nno ha hecho una web en su vida.\n\nme reí. me enseñó su stripe. me quedé callado.\n\nlo único que hace:\n\n→ abre google maps\n→ busca \"tacos filadelfia\"\n→ elige uno de 4,7 estrellas\n→ con web de 2013\n→ copia sus datos\n→ los pega en un constructor\n→ sitio listo en 20 min\n\nhace 6 meses ganaba 9$/h en mcdonald's. el uniforme todavía cuelga en su armario\n\nenvía la web terminada, con el nombre del negocio ya puesto, y se va a dormir\n\nel dueño de la taquería abre el link. se lo enseña a su hija. \"¿esto somos nosotros?\" paga 4.800$ esa misma noche.\n\n\"¿esto va en serio? ¿cuánto cobras?\" así fue su martes.\n\nmes 1: 800$\nmes 2: 4.100$\nla semana pasada: 10.400$\n\nuna agencia web pediría 14.500$, cuatro personas y seis semanas.\n\nella:\n\n→ 0$ de inversión\n→ trabaja sola\n→ 20 min por cliente\n\nsu padre sigue creyendo que trabaja en mcdonald's.\n\neste es el mismo sistema, pero escalado: una máquina de captación b2b de 10k$/mes con la misma lógica, sin llamadas en frío ni anuncios ↓\n\nguárdalo. no lo vas a volver a ver tan claro.","url":"https://x.com/benyuls/status/2114367764966060277","createdAt":"2026-10-25T14:45:32Z","metrics":{"views":97401,"likes":679},"lang":"es"},{"id":"2114341217953829077","author":"Nico Garcia | Ingeniero de IA","handle":"NicoGarcia_IA","text":"🔴 BOMBAZO: Google acaba de LIBERAR la generación de video con IA\n\n→ Sin suscripciones de pago\n→ Completamente GRATIS\n\nEntras en https://t.co/aUj6hBVO9Y, le das a “Crear vídeos con IA” y Gemini Omni 1.1 Flash te monta la escena. Puedes marcar la duración, alargar un plano sin que cambie el personaje y exportar en 1080p.\n\nEl matiz: no es ilimitado. Con una cuenta personal tienes unas 6 generaciones al mes. Sirve para probar un anuncio o un reel. No para montar un canal entero.","url":"https://x.com/NicoGarcia_IA/status/2114341217953829077","createdAt":"2026-10-25T13:00:03Z","metrics":{"views":35827,"likes":650},"lang":"es"},{"id":"2114228078012768681","author":"瀬尾","handle":"seoryco","text":"Web サイトのセキュリティチェックツールを公開しました。\n\n「外部からどのように見えているか」を確認できます。\n\nPHP バージョンが見えてしまっている場合は、対応しておいたほうがよいかもしれません。\n\nhttps://t.co/Pxvi9IpRpX","url":"https://x.com/seoryco/status/2114228078012768681","createdAt":"2026-10-25T05:30:28Z","metrics":{"views":18218,"likes":175},"lang":"ja"},{"id":"2114095406393036818","author":"Alexendre","handle":"pato__project","text":"Bon les gars, y’en a marre des apps qui puent l’IA\n\nJe vous ai donc concocté une liste de 10 skills à donner à votre agent de code pour le design, les animations et les finitions\n\nDe quoi donner un peu de gueule à vos projets 👇\n\n1/ frontend-design (Anthropic)\n\nPour définir une direction artistique : typographie, couleurs et composition adaptées à ton produit\n\nhttps://t.co/kG79KL7UBx\n\n2/ UI UX Pro Max\n\nPour trouver des palettes, des associations de polices et des recommandations UX selon ton projet\n\nhttps://t.co/QZkfAO5RZy\n\n3/ Impeccable\n\nPour auditer ton design, clarifier tes textes et faire une passe de finition avec ses commandes critique, clarify et polish\n\nhttps://t.co/xcRoE28DaD\n\n4/ emil-design-eng (Emil Kowalski)\n\nPour soigner les boutons, les transitions et les petits détails qui rendent une interface agréable à utiliser\n\nhttps://t.co/2eHha8lBi1\n\n5/ create-design-md (ibelick)\n\nPour documenter tes règles visuelles dans un DESIGN.md et donner un cadre cohérent à ton agent\n\nhttps://t.co/nMAvnMEPPk\n\n6/ review-animations (Emil Kowalski)\n\nPour repérer les animations trop lentes, les mauvaises courbes et les mouvements inutiles\n\nhttps://t.co/sEtuXfHMXA\n\n7/ mobile-native (Emil Kowalski)\n\nPour corriger les détails pénibles d’une web app sur téléphone : toucher, scroll, zoom des champs et contenu sous l’encoche\n\nhttps://t.co/E7XHCRvtme\n\n8/ break-ui (Emil Kowalski)\n\nPour tester tes écrans avec des noms trop longs, des listes vides et des données qui font déborder l’interface\n\nhttps://t.co/G2jniZXoQa\n\n9/ web-design-guidelines (Vercel)\n\nPour vérifier l’accessibilité, les formulaires, le focus et les états de ton interface\n\nhttps://t.co/iOVNMlsh9v\n\n10/ webapp-testing (Anthropic)\n\nPour tester les parcours dans le navigateur avec Playwright, inspecter les erreurs et prendre des captures","url":"https://x.com/pato__project/status/2114095406393036818","createdAt":"2026-10-24T20:43:17Z","metrics":{"views":153248,"likes":2260},"lang":"fr"},{"id":"2114489030624571710","author":"duck says","handle":"ducksays","text":"grok bot got me 1.5M impressions in 7 days.\n\ni didn't hire anyone. i set up a grok bot on @bot and gave it a title: chief marketing officer. (CMO for short)\n\nit doesn't post for me. i still press every button, but it does basically everything else.\n\nthat week it helped me land two viral posts back to back.\n\nthen it noticed my posts about my grok bots were pulling in more verified followers than anything else. so we leaned in.\n\nwednesday i had ~1,954 verified followers.\nsaturday i passed 2,000 and unlocked subscriptions.\n\nhere's what it actually does every week:\n- drafts my posts in my voice (rough, lowercase, like this)\n- studies other creators in my space to see what's working\n- keeps a content calendar of notable dates each month\n- logs every post in notion and scores it against my median\n- tells me when a post is still hot so i don't step on it\n- sends me a weekly report on what worked and what flopped\n\nit's not magic. some drafts are meh and i tell it so.\n\ni just press the button.","url":"https://x.com/ducksays/status/2114489030624571710","createdAt":"2026-10-25T22:47:24Z","metrics":{"views":65906,"likes":827},"lang":"en"},{"id":"2114469557935210599","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝SkillsをGoogleドライブに置いて、AIに読ませている人へ\n同じSkillsを読み込むだけで、置き場所によってここまで差が出ました\n\nGrok Botに、スライド作成のSkillを読み込ませて測ってもらった結果です（10月21日の夜、各3回）\n\n・ドライブから探して読む：平均73.2秒、呼び出し15.3回\n・GitHub＋自作プラグイン：20.0秒、6回\n\n差が出た理由は2つ\n・プラグインは、Skill名を渡すだけで本文と付属ファイルの一覧が一度に返ってくる\n・私のドライブには、同じ名前のSkillsフォルダが5つもあった（バックアップの写しなど）\n\n名前で探すと、どれが本物かを確かめる呼び出しが増えるし、古い写しを読んでしまう危険もあるんですよね\n\nとはいえ、ドライブは設定なしですぐ使えるのが強み\nまずはドライブで1本\n「どれが最新か分からない」と感じたら、自作MCPに切り替える\nこの順番で十分だと思っています\n\n記事では、ドライブで始めるSkillsテンプレートと、自作MCPの構築キットの両方をお渡ししています","url":"https://x.com/tetumemo/status/2114469557935210599","createdAt":"2026-10-25T21:30:02Z","metrics":{"views":3428,"likes":33},"lang":"ja"},{"id":"2114329124416208989","author":"kaito","handle":"cu30rry_","text":"iPhone の Shortcuts で Siri の代わりに Grok Bot を呼ぶ方法\n\nGrok Bot はスマホ内のアプリを直接見ることができるから、Siri より遥かに使い勝手が良い\n\n1. Grok Botアプリを最新にする \n 2. Shortcutsアプリ → + → アクションを追加 → 「Grok Bot」を検索 → 「Botとのボイスチャットを開始」を選択  \n3. 設定 → アクセシビリティ → ボイスショートカット → 設定 → そのショートカットを選択 → 「Hey Grok」と入力して3回発音  \n4. ショートカットの詳細で、「ロック中でも実行を許可」をオンにする\n\nこれはGrok Botをメインで使っているなら絶対やるべき\n\n「Hey Siri」で「すみません、ロックを解除してください」「すみません、私にはできません」に何度モヤモヤしたことだろうか\n\nそれから解放されるときがついに来た！","url":"https://x.com/cu30rry_/status/2114329124416208989","createdAt":"2026-10-25T12:12:00Z","metrics":{"views":23352,"likes":161},"lang":"ja"},{"id":"2114341458690125852","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝これはブクマ！AIエージェントの「ハーネス」を、0から2時間で学べる講座が紹介されていた\nhttps://t.co/FNtyPdyl8Q\n\n0xCodilaさんによると、Googleが無料で出した講座で、流れはこう\n1. ハーネスを一から（0:29〜）\n2. 最初のエージェントを正しく作る（11:08〜）\n3. 評価のしくみ。まとめ役の「Chief of Staff」エージェントを作る（28:08〜）\n4. ループのしくみ（1:00:13〜）\n5. 24時間動き続けて、自分で良くなっていくグラフのしくみ（1:23:19〜）\n\nハーネスは、AIを動かす周りのしくみ\nテストして、判定して、うまくいくまで直す\n\n「それっぽく見える」エージェントを信じるのをやめよう、というのが講座の芯みたい","url":"https://x.com/tetumemo/status/2114341458690125852","createdAt":"2026-10-25T13:01:00Z","metrics":{"views":6539,"likes":119},"lang":"ja"},{"id":"2114538465929183595","author":"やぎ（八木 利生太郎）/ Last Scene代表","handle":"yagiryuuu","text":"OpenRouterのPeter WalkerさんがAnthropicモデルの利用量を出していたのでメモ。\n\nまず数字\n\n・Anthropicモデルの7日平均トークン量が、Opus 5.5公開から3.6倍\n・1日あたり3兆トークン近くまで行った日もある\n・Sonnet 5.5とHaiku 5.5も好評とのこと\n\n現場の空気\n\n・Opus 5.5の公開は9月22日。そこから約1か月\n・Andrew Curranさんは「ここ2週間でAnthropicに切り替えると言う人の数がこれまでにない」と投稿\n・一方でClaude CodeのMaxプランは、週の上限が早く減るという不満も出ている\n\n逆の動きもある\n\n・Ripplingはコストを理由にOpenAIを増やし、コーディング用途のOpenAI比率が16%から52%に\n・OpenRouterは開発者が多い一部の経路なので、API全体の数字ではない\n\nまとめ\n\n・Opus 5.5公開から約1か月で、OpenRouter上のAnthropic利用量は3.6倍\n・開発者の評価と、コストで選ぶ会社の判断は分かれている\n・Claude Codeを使っているなら、自分の週の上限の減り方を一度確認しておく","url":"https://x.com/yagiryuuu/status/2114538465929183595","createdAt":"2026-10-26T02:03:51Z","metrics":{"views":155,"likes":2},"lang":"ja"},{"id":"2114383528213262808","author":"marcus","handle":"marcusyul","text":"ALGUIEN ACABA DE CONVERTIR CLAUDE CODE EN UN EDITOR DE VÍDEO\n\nMetes tus clips en una carpeta.\n\nLe dices \"edítame esto en un vídeo de lanzamiento\".\n\nY te devuelve el final.mp4.\n\n→ Corta muletillas y silencios\n→ Subtítulos con tu estilo\n→ Color grading automático\n→ Genera animaciones solo\n→ Revisa sus propios cortes\n\nEl truco es que la IA no ve el vídeo. Lo lee.\n\nTranscripción palabra por palabra en lugar de 30.000 fotogramas. Por eso corta justo donde termina cada palabra.\n\nFunciona con Claude Code, Codex y cualquier agente con terminal.\n\nOpen source y licencia MIT. Ya tiene 30k stars.\n\nOs dejo el repo abajo :)","url":"https://x.com/marcusyul/status/2114383528213262808","createdAt":"2026-10-25T15:48:11Z","metrics":{"views":14639,"likes":275},"lang":"es"},{"id":"2114301258085646691","author":"KANA｜東京AI映像","handle":"KanaWorks_AI","text":"7日間で、8つのプロジェクトを\nオープンソース公開しました。\nかかったAIのトークンは、\nそれだけで3万ドル分以上🐰\n\n製品として作れば、\n数千万円規模になってもおかしくない技術です。\nそれを全部、MITライセンスで無料公開します。\n\nしかも、使い方を覚える必要はありません。\nREADMEを読み込むのも、環境構築で悩むのも、もう人の仕事じゃない。\nあなたのAIエージェントに、ひとこと伝えるだけ。\n学ぶのも、動かすのも、AIがやる。\n\nこれからの説明書は、人の頭のためではなく、\nあなたの手元のAIのために書かれる。\n\n勉強した人が勝つ時代から、\nAIを乗りこなした人が勝つ時代へ。\n\n学ぶな。乗りこなせ！","url":"https://x.com/KanaWorks_AI/status/2114301258085646691","createdAt":"2026-10-25T10:21:16Z","metrics":{"views":9543,"likes":182},"lang":"ja"},{"id":"2114366263556256080","author":"max","handle":"maxwell_lenoir","text":"ESTO ES UNA LOCURA\n\nAnthropic convirtió los Agent Skills en un estándar abierto y GitHub se ha llenado de equipos de agentes para Claude Code gratis.\n\n→ un solo repo trae 135 agentes, 35 skills, 42 comandos y 176+ plugins\n→ otro te da más de 100 subagentes especializados\n→ y el repo oficial anthropics/skills te enseña cómo se escribe un SKILL.md\n\ntodo gratis.\n\nguárdalo y sígueme para más → @maxwell_lenoir","url":"https://x.com/maxwell_lenoir/status/2114366263556256080","createdAt":"2026-10-25T14:39:34Z","metrics":{"views":3706,"likes":71},"lang":"es"},{"id":"2114419470693507261","author":"kiosa","handle":"thegreatest_sv","text":"My Grok Bot now decides what I post every morning to get over 100k impressions per post\n\nhere's everything it does:\n\n1. Scout.\nit reads the 18 accounts I learn from and keeps only original posts that cleared 5,000 views. anything past 10k gets a star. replies don't count.\n\n2. Pattern miner.\nit doesn't copy posts. it pulls what keeps showing up in the winners: cold opens, numbered stacks, named tools, soft calls to action.\n\n3. Draft writer.\npatterns go in, ready English drafts come out, each with a short video tip. same energy that already traveled, none of the original wording.\n\n4. Weather check.\nevery day it also scans ~20 fresh AI posts from the last 48 hours outside my list. my watchlist is school. outsiders are the weather.\n\n5. Noon digest.\neverything lands before noon: the hits, the patterns, the drafts. I open it with coffee instead of scrolling for an hour.\n\n6. The board.\none screen with my X Score, a daily target and a DONE / NOT DONE chip on every hit. I see what's left at a glance.\n\nthe result: I ship 1-2 posts a day without guessing. and the formats it chases are the same kind that took one of my posts to 5M views per month.\n\nit never posts for me. I pick the draft, fix it in my voice, hit publish.\n\nit's free. the repo, the live board and the Grok Bot template are in the article below","url":"https://x.com/thegreatest_sv/status/2114419470693507261","createdAt":"2026-10-25T18:11:00Z","metrics":{"views":38246,"likes":381},"lang":"en"},{"id":"2114202745636852063","author":"中崎工房 | AIで1時間の仕事を5分で終わらせる人","handle":"nakazakifam","text":"Opus 5.5で作れるAfterEffectsっぽいアニメーション効果紹介ショート動画。\n\nエフェクトと編集は全てOpus 5.5がコードだけで作っています。\n\nツール\nClaude Opus 5.5 / GPT-Image-2.5 / LTX-2.3 / ElevenLabs v4 / Soniox stt v5 / Epidemic Sound / HyperFrames","url":"https://x.com/nakazakifam/status/2114202745636852063","createdAt":"2026-10-25T03:49:49Z","metrics":{"views":6338,"likes":100},"lang":"ja"},{"id":"2114457089007374740","author":"Grirk","handle":"Grirku","text":"STOP MICROMANAGING YOUR F*CKING AGENTS\n\nAnthropic just dropped the cleanest agent team setup in Claude Code.\n\nOpus 5.5 leads the main session and builds the task DAG.  \nThree Haiku 5.5 teammates self-claim work and talk to each other over a peer p2p bus.\n\nThey run in parallel:\n→ security audits JWT claims and finds a timing leak  \n→ perf-scout profiles redis locks and hits 2.8x faster  \n→ qa-engine runs the full test matrix (58/58 green)\n\nAtomic mutex DAG locks files so they never collide.  \nJEV underneath resolves 4,800+ micro-forks (which file, which model, retry or stop) before anything reaches the lead.\n\nOpus only signs off at the end.  \n12/12 tasks done.  \nConsensus approved.  \nZero regressions.\n\nYou launch it like this:\n\nclaude --model opus --teammate-mode auto\n\nThe full tree\n\u003e Opus 5.5 team lead builds the task DAG and coordinates  \n\u003e Haiku 5.5 x3 teammates - security / perf-scout / qa-engine  \n\u003e peer p2p bus for direct mailbox and self-claim tasks  \n\u003e atomic mutex DAG locks files with zero leader polling  \n\u003e JEV fork layer routes deterministic decisions  \n\u003e Opus signs off only after consensus and zero regressions\n\nPaste the tree + this prompt into Claude Code ↓\n\nRebuild my Claude Code setup around this tree:\n\nRun the main session on Opus 5.5 with effort xhigh and --teammate-mode auto.\nSpawn three Haiku 5.5 teammates: security, perf-scout, and qa-engine.\nLet them self-claim tasks from a shared DAG and communicate over a peer p2p bus.\nRoute deterministic forks (which file, which model, retry or stop) through JEV.\nUse an atomic mutex DAG so teammates never collide on the same file.\nOpus only coordinates the plan and signs off at the end. Teammates handle the work.\nShow me every change as a diff first. No edits until I say go.\n\nsave it, it’ll come in handy.","url":"https://x.com/Grirku/status/2114457089007374740","createdAt":"2026-10-25T20:40:29Z","metrics":{"views":4920,"likes":64},"lang":"en"},{"id":"2114503523916484741","author":"0xMarioNawfal - The Roundtable Show","handle":"RoundtableSpace","text":"Stop building your Claude second brain by hand.\n\n4 free repos that do the setup for you (stars at time of writing):\n\n1. obsidian-skills by kepano, Obsidian's CEO (~50K stars)\nAgent skills that teach Claude the Obsidian CLI, Markdown, Bases and JSON Canvas\nhttps://t.co/iWC2hgmv6J\n\n2. claude-obsidian (~16K stars)\nwiki, wiki-ingest, wiki-query and wiki-lint as ready-made commands for a source-cited vault\nhttps://t.co/PSsnoBgHl4\n\n3. obsidian-second-brain (~5K stars)\n48 commands for persistent agent memory, works in Claude Code, Codex, Gemini CLI and more\nhttps://t.co/twFZwzdanc\n\n4. second-brain-starter\nFill in a requirements template and it generates a personalized 9-phase build plan\nhttps://t.co/UT0sFbWSRV\n\nCaveats: only #1 comes from Obsidian's CEO; the rest are community projects. #4 is a plan, not working software, and lists no license. Read before you install.","url":"https://x.com/RoundtableSpace/status/2114503523916484741","createdAt":"2026-10-25T23:45:00Z","metrics":{"views":36975,"likes":47},"lang":"en"},{"id":"2114187365715685495","author":"Sadao Tokuyama","handle":"tokufxug","text":"GPSなしの森林で走る人物を追跡する自律ドローン\n\n🔹パデュー大学 IDEAS Labが機体からソフトまで独自開発\n🔹LiDAR慣性オドメトリで飛行中に3D地図を生成\n🔹木による遮蔽を予測し、障害物回避も機上処理\n\n開発：パデュー大学 IDEAS Lab\n※研究デモ。実用性能・安全性は要検証\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2114187365715685495","createdAt":"2026-10-25T02:48:42Z","metrics":{"views":108543,"likes":1344},"lang":"ja"},{"id":"2114484029173191162","author":"そら","handle":"sora_biz","text":"Tailscale SSHの件、僕らが今できること\n\n・SSH接続を許可する人、端末を必要最小限に\n・不要なSSH転送の許可を外す\n・対応環境では自動更新を有効に\n\n追加の本人確認を入れるcheck modeも対策の一つ。ただし、権限昇格の問題自体は直せない。\n\nTailscale開発責任者の説明を読むと、影響範囲は調査中で修正を進めてる段階。\n\n現時点で全員に無効化を勧めてるわけではないみたいよ。","url":"https://x.com/sora_biz/status/2114484029173191162","createdAt":"2026-10-25T22:27:32Z","metrics":{"views":4834,"likes":48},"lang":"ja"},{"id":"2114380074808180795","author":"TUTAYADX","handle":"ki_mutaku","text":"めちゃくちゃ面白いし勉強になる。\n確かに仕様書作って一気に作らせるのは違和感あったんだよな。\n作る単位を小さくすることの重要性がすごく理解できた","url":"https://x.com/ki_mutaku/status/2114380074808180795","createdAt":"2026-10-25T15:34:27Z","metrics":{"views":30983,"likes":590},"lang":"ja"},{"id":"2114326364895777210","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに経理担当、これは真似したいぃぃ！いや、今からですすぐにできちゃいますねコレ\n\nGOROmanさんのやり方\n・Googleフォトを、Grok Botにつなぐ\n・レシートっぽい写真を、botが勝手に見つける\n・見つけたものを、そのまま登録してもらう\n\n撮るだけで記帳が進むなら、レシートをためこむ理由がなくなる\nClaude CodeやCodexでやってたけど、Grok Botのほうがだんぜん楽だわ","url":"https://x.com/tetumemo/status/2114326364895777210","createdAt":"2026-10-25T12:01:02Z","metrics":{"views":6275,"likes":86},"lang":"ja"},{"id":"2114361192080973940","author":"Cyber Security News","handle":"The_Cyber_News","text":"‼️  Tailscale SSH Flaws Could Let Hackers Gain Root Access Across Servers \n\nDetails: https://t.co/BLfO3GLSaZ\n\nA new security report warns that Tailscale SSH has flaws that could let a hacker move from one compromised device to root access on other servers. Tailscale SSH lets approved devices log in to each other over a private network. The report lists 11 findings in five groups.\n\nThey cover Tailscale’s SSH server, its serve and app connector features, the DERP relay client, and headscale, an open-source server that manages Tailscale networks.\n\nThe researcher tested Tailscale 1.104.2 and headscale 0.29.5 between October 22 and October 24, 2026. The most serious group involves Tailscale SSH. Its SSH server runs inside tailscaled, a background program with full root privileges on the machine.\n\n#cybersecuritynews","url":"https://x.com/The_Cyber_News/status/2114361192080973940","createdAt":"2026-10-25T14:19:25Z","metrics":{"views":536244,"likes":3456},"lang":"en"},{"id":"2114435444587065486","author":"Akshay","handle":"akshay_manglik","text":"Introducing Pomerado (YC F26): the faster, cheaper, and more reliable alternative to browser use.\n\nOpen source. Sign up for free to supercharge your agents 🧵","url":"https://x.com/akshay_manglik/status/2114435444587065486","createdAt":"2026-10-25T19:14:28Z","metrics":{"views":123383,"likes":1662},"lang":"en"},{"id":"2114326162864558111","author":"Andy L","handle":"AndyL5cc","text":"卧槽！Claude Code 工程师亲自下场教学了！\n\n28 分钟视频，教你如何榨干 Claude 的潜力！\n\n从 CLAUDE.md、永久记忆、并行会话，到各种隐藏提示技巧，几乎毫无保留！\n\n有人花 300 美元学的课程，还不如这视频前 10 分钟。\n\n最离谱的是：完全免费！\n\n建议收藏，绝对值得反复看！🔥","url":"https://x.com/AndyL5cc/status/2114326162864558111","createdAt":"2026-10-25T12:00:14Z","metrics":{"views":65572,"likes":1029},"lang":"zh"},{"id":"2114255468722053223","author":"YUSUKE TAKAHASHI","handle":"VJ_keori","text":"一切Blender触らずにClaudeで操作して作ったVJ的な映像のテスト。\nコンプはせずに、背景モーションもblender内で作って全部まとめてEeveeでレンダリング。\n指示を明確にして小分けにFB出せば結構イメージ通りになってくるし、趣味の悪さもそのまま出てくる笑","url":"https://x.com/VJ_keori/status/2114255468722053223","createdAt":"2026-10-25T07:19:19Z","metrics":{"views":240793,"likes":2217},"lang":"ja"},{"id":"2114191482877780091","author":"Ren","handle":"Ryrenz","text":"🎚️ 太省心了，ffmpeg-skill 让 Claude Code、Codex 直接替你剪视频，再也不用背 FFmpeg 那一长串参数。\n\nffmpeg-skill 在 GitHub 已经 2358 stars，上了 Trendshift 日榜，仓库 9 月初才建，最近几天就连发了 6 个版本。\n\n剪过视频的都懂：切一段、去掉静音、压字幕、统一响度、转成竖屏发短视频，每一步都得去搜一遍 FFmpeg 命令，参数写错一个就得重来。\n\n现在直接跟 agent 说要什么就行。它手里有 42 个现成工具，先探测素材，尽量无损地剪，剪完还会生成一张联系表图片核对画面，验证过输出才算完。TikTok、Reels、Shorts、YouTube、X 的交付规格都有模板，一条素材能一次渲染出全部版本。\n\n全程用本地 FFmpeg 跑，不用云服务也不用 API key，还带一个 MCP server，其他 MCP 客户端也能接。作者的 GitHub 简介写的就是音视频和直播工程师。\n\n剪辑这种体力活，交给 agent 正合适。\n\nGitHub：","url":"https://x.com/Ryrenz/status/2114191482877780091","createdAt":"2026-10-25T03:05:03Z","metrics":{"views":29051,"likes":736},"lang":"zh"},{"id":"2113836843171299608","author":"すごいサービス研究所","handle":"sugoi_service","text":"元FC2社長が作った「nen2」って無料HPサービス、HP制作の常識をブッ壊してますね…\n\n今このサービスで約12,000店舗のHPが公開されてるんだけど、実はこれ、店舗側ではなくnen2側が先に作ったもの。\n\nネット情報からAIでHPを自動作成する\n↓\nオーナーが店名検索すると自分の店が出てくる\n↓\n承認すればHPが受け取れる(管理・編集可)\n↓\nHP自体が集客の入口にもなってる\n\nつまり「HPを作りませんか？」ではなく「あなたのお店のHP、もう作ってありますよ」という逆転の発想。\n\nしかも、無料HPをフックにオーナーと接点を獲得できれば、後から独自ドメイン・広告非表示・MEO支援みたいなマネタイズもあり得ますね\n\nAIでHP制作を低コスト化し、無料で顧客接点を大量につくる。AI時代ならではの斬新すぎるマーケティング。","url":"https://x.com/sugoi_service/status/2113836843171299608","createdAt":"2026-10-24T03:35:51Z","metrics":{"views":2009215,"likes":3006},"lang":"ja"},{"id":"2114389035388989873","author":"akari","handle":"akarixbt","text":"This is f*cking insane. SpaceXAI senior engineer (ex-Cursor):\n\n\"99% of people open one GrokBot, ask it a question and close the tab\n\nI run 50+ GrokBot agents like a company. A Chief of Staff runs my day, 3 PMs hand out the work, 40+ workers ship it overnight, and I just check the results over coffee. That team does the job of 20 engineers\"\n\nIn this 1-hour workshop, SpaceXAI builds that GrokBot team from scratch, step by step\n\nGrokBot → Chief of Staff → PMs → 40+ Workers → Autonomous Company\n\nAt SpaceXAI, 97% of engineers already run a team like this, and the ones who do are getting $750K+ offers. The rest are about to compete with them\n\nWorth more than any $5,000 agentic engineering course\n\nBookmark it and watch today\n\nThen read how to build your own team of GrokBot agents in the harness engineering guide below ↓","url":"https://x.com/akarixbt/status/2114389035388989873","createdAt":"2026-10-25T16:10:04Z","metrics":{"views":36272,"likes":333},"lang":"en"},{"id":"2114381000293650937","author":"Yarad","handle":"Yarad_ai","text":"بیشتر آدم‌ها به Claude می‌گن ویدیو بساز؛ این پروژه بهش یاد می‌ده چطور مثل یک استودیوی حرفه‌ای تبلیغاتی فکر کنه! 🔥\n\nپروژه Motion Video Kit یک Skill برای Claude Code است که فرایند ساخت تبلیغات تجاری باکیفیت رو از ایده تا خروجی نهایی مدیریت می‌کنه.\n\nاما جذاب‌ترین بخشش فقط ساخت ویدیو نیست؛ سیستمیه که نمی‌ذاره هوش مصنوعی خودش به کار خودش نمره قبولی بده!\n\n🎬 از بررسی ۲۸ فیلم تبلیغاتی حرفه‌ای یاد گرفته چطور حرکت، ریتم و تصویر رو طراحی کنه.\n\n🎨 با ترکیب ویدیوهای تولیدشده با AI، انیمیشن‌های HTML و GSAP و در صورت نیاز Three.js، تبلیغات سینمایی و موشن‌های سه‌بعدی می‌سازه.\n\n🔍 یک سیستم بازبینی مستقل داره؛ خروجی رندرشده رو منتقدهای جداگانه بررسی می‌کنن، ایرادها ثبت می‌شن و قبل از تحویل، نتیجه دوباره ارزیابی می‌شه.\n\n🔊 طراحی صدا، کیفیت تصویر، کنتراست، رنگ برند و حتی بلندی صدا هم معیارهای مشخصی برای بررسی دارن.\n\n💰 حتی راهنمای انتخاب مشتری، پیشنهاد پروژه آزمایشی و قیمت‌گذاری هم داخلش قرار گرفته.\n\nیعنی فقط با یک ابزار تولید ویدیو طرف نیستیم؛ با یک فرایند کامل برای ساخت تبلیغات تجاری روبه‌رو هستیم که می‌تونه به موشن‌دیزاینرها کمک کنه خروجی حرفه‌ای‌تری تولید کنن.\n\nاگر با Claude Code موشن می‌سازی یا می‌خوای از این مسیر پروژه تجاری بگیری، این مخزن ارزش بررسی داره.\n\n🔗 GitHub:","url":"https://x.com/Yarad_ai/status/2114381000293650937","createdAt":"2026-10-25T15:38:08Z","metrics":{"views":6491,"likes":160},"lang":"fa"},{"id":"2114220917077471684","author":"たまコイン＠底辺Youtuberはじめました","handle":"tamacoin_tamao","text":"「24時間働くAIで何するの？」とよく聞かれるので見せます🤗\n\nこういうのをAIを使って自動でやります\n\n※ AIを使っている人は全員こっそりやってます\n※ なぜこっそりやるかというと公開すると全部AIで真似されるからです\n※ 逆にAIを使わない人はこういうのをやってる人と戦うことになります","url":"https://x.com/tamacoin_tamao/status/2114220917077471684","createdAt":"2026-10-25T05:02:01Z","metrics":{"views":72533,"likes":859},"lang":"ja"},{"id":"2114276382666793321","author":"LOOPY","handle":"VibeEverything","text":"얼굴 노출 없이 AI로 만든 첫 영상 하나로 4일만에\n조회수 166만, 구독자 1.8만명 찍은 유튜브 채널\n\n이미 대중적 호기심이 검증된 '해외 미제사건'을 소재로,\n단 한 편 만에 알고리즘 간택을 받고 떡상 중임.\n\nAI 덕분에 영상 제작의 진입장벽은 낮아지고 있지만,\n'무슨 소재를 가져와서 어떻게 이야기를 풀 것인가' 하는\n기획과 스토리텔링은 여전히 중요함.\n\nAI로 유튜브 시작하려는 분들은 이 채널을 참고해보면 좋을 듯.","url":"https://x.com/VibeEverything/status/2114276382666793321","createdAt":"2026-10-25T08:42:25Z","metrics":{"views":17593,"likes":268},"lang":"ko"},{"id":"2114464225431109691","author":"مالك بن حمود المالك","handle":"cnemalek","text":"🚨 برومبت يخلي Claude Code ينشئ مهاراته بنفسه ويتطور كل يوم بدون ما تسوي أي شيء!\n\nبدون برمجة، بس انسخ والصق. برومبت واحد يتكفل بالباقي!\n\n⏱️ الوقت المطلوب: دقيقتين فقط. 📋 المطلوب منك: نسخ البرومبت ولصقه في Claude Code.\n\nالمشكلة اللي يقع فيها 90% من المستخدمين؟\n\nإنهم يشرحون نفس الأشياء لـ Claude كل يوم؛ نفس الأسلوب، ونفس الخطوات، ونفس التصحيحات. وباليوم الثاني يرجعون من الصفر!\n\nلكن مع هالطريقة، الوضع يختلف:\n\n→ يكتشف المهام المتكررة: يراجع مشروعك ويسألك عن المهام اللي تسويها كل أسبوع.\n\n→ ينشئ Skill لكل مهمة: يبني تعليمات وقوالب وأمثلة، ويستدعيها تلقائيًا وقت الحاجة.\n\n→ يختبر المهارات قبل تسليمها: يجرّب كل مهارة على حالة واقعية، ويعدّلها إذا واجهت مشكلة.\n\n→ يتعلم من تصحيحاتك: كل ما صححت له خطأ، يحدّث المهارة عشان يتجنب تكراره مستقبلًا.\n\n→ بدون كتابة أكواد: اشرح له طبيعة شغلك، وهو ينشئ لك مكتبة مهارات خاصة تناسب احتياجاتك.\n\nقبل، كان هذا الشيء يحتاج أسابيع من كتابة الأدلة والقوالب وتنظيم إجراءات العمل.\n\nالحين؟ Ctrl + V والباقي على Claude! 🔥\n\nاحفظها عندك ! 🔖","url":"https://x.com/cnemalek/status/2114464225431109691","createdAt":"2026-10-25T21:08:50Z","metrics":{"views":16980,"likes":430},"lang":"ar"},{"id":"2114348773778366936","author":"GitTrend","handle":"GitTrend0x","text":"Jev 决策核又杀疯了 🔥\n\nTypeSafe 官方的 Agent Skill、AgriciDaniel 的一键 SEO 体检、moritzkremb 的语音开浏览器、fhshaik 的 AI 马里奥、RomanSlack 的纯视觉无人机……全网玩家把 Jev 玩成了下一代「官方接入外挂 + SEO 审计官 + 声控浏览器 + 游戏手柄大脑 + 无人机战术核」:\n\n1️⃣ typesafe-ai/skills（https://t.co/angv7Pseoa）\n\nTypeSafe 官方 Agent Skill，一条命令装进 Claude Code 等 Agent，教它设计 state + 类型化问题来接 System One。\n\"让 Agent 自己学会调用决策核\"！\n\n2️⃣ AgriciDaniel/jev-seo（https://t.co/ha2zxe46Xm，非官方）\n\n给一个首页 URL，实时爬站 + 52 条 Google Search Central 规则 + Core Web Vitals，Jev 逐页判分，直出 PDF/Excel/Markdown 报告，标准模式每站约一美分。\n\"一分钱请个 SEO 审计官\"！\n\n3️⃣ moritzkremb/jev-voice-browser（https://t.co/jVnxrsRfeG，非官方）\n\n边说边控真实浏览器：每个词进来就问 Jev 意图、目标元素、是否危险操作，约 250–350 ms 出概率，Playwright 直接动手。\n\"话还没说完，网页已经点开了\"！\n\n4️⃣ fhshaik/typesafe-mario（https://t.co/DlL0RkbUjs，非官方）\n\n不看截图，只把模拟器 RAM 转成结构化 JSON，让 Jev 用 Choice 原语直接挑手柄按键玩超级马里奥。\n\"决策核亲自上手柄跳蘑菇\"！\n\n5️⃣ RomanSlack/jev-drone（https://t.co/4P2MrvZ7vM，非官方）\n\nMuJoCo 里只靠机载摄像头飞五站障碍赛，Jev 以约 2.5 Hz 做战术判断（Choice 选机动、Score 评风险、Noul 判目标是否真丢），安全全交给代码。\n\"小模型当参谋，代码握方向盘\"！","url":"https://x.com/GitTrend0x/status/2114348773778366936","createdAt":"2026-10-25T13:30:05Z","metrics":{"views":8601,"likes":165},"lang":"zh"},{"id":"2114313775834935394","author":"Trice","handle":"cryptotrice","text":"This new Claude Fable 5.1 TradingView Indicator just made manual traders obsolete\n\nThe indicator analyzes the chart in real time, spots potentially good entries, provides a quick overview, and lets you decide whether to open a trade or not\n\nIt made $21,478 during the Sep-Oct period, simply by following Claude guidance\n\nThe indicator is available in the \"Script\" section of Reversed-Engineered TradingView Premium app for Windows and Mac\n\nSharing the full guide below. Read and bookmark it","url":"https://x.com/cryptotrice/status/2114313775834935394","createdAt":"2026-10-25T11:11:00Z","metrics":{"views":56243,"likes":409},"lang":"en"},{"id":"2114372210269782303","author":"Woody","handle":"woody_research","text":"I LAUNCHED A GROK BOT TERMINAL OVERNIGHT, GAVE IT $44.82 AND STOPPED ASKING AI WHAT IT WOULD DO. BY MORNING IT HAD $11,643.21 AND SIX AGENTS LOGGING EVERY TRADE\n\nI spent a year asking agents what they'd trade and watching the chat scroll. Last weekend I built the thing that actually trades, in Grok Bot, with no code I touched by hand.\n\nThe six agents share one screen, each one job:\n\n\u003e scanner reads new token pairs and volume spikes\n\u003e rug check filters suspicious tokens before anything executes\n\u003e sizer sets position from account equity, not a fixed ticket\n\u003e executor opens and closes with slippage tracking\n\u003e logger writes the reason behind every trade\n\u003e equity curve updates on every close\n\nI went to bed on $44.82 and left the laptop open on the dashboard. By morning the balance read $11,643.21. Every trade on the activity feed had a reason next to it and a line in the log.\n\nThat's the shift I didn't see coming. Not that an agent made money overnight. That I stopped being the one asking \"would you long this?\" and started being the one reading the log of what already happened.\n\nStarting balance: $44.82\nCurrent balance: $11,643.21\n\nGrok Bot built the terminal, the agent architecture and the dashboard. I described what I wanted and the thing went live.\n\nThe full build is in the article below ↓","url":"https://x.com/woody_research/status/2114372210269782303","createdAt":"2026-10-25T15:03:12Z","metrics":{"views":255614,"likes":1246},"lang":"en"},{"id":"2114386400586191232","author":"TGweb3","handle":"TGweb3333","text":"我给Grok Bot转入3000美金，之后就睡觉去了。\n\n九个小时醒来，账户到了12500美金。\n\n4.17倍收益，而且不是靠单个智能体单打独斗，是一套接力流程。\n\n一共五个智能体，各司其职，做完自己这一环，再把标的交给下一个：\n\n侦察员：扫遍Solana上所有新交易对，当晚一共扫到14200个\n\n分析师：排查跑路风险、筹码分布。前十大钱包持仓超过30%直接剔除，mint权限没吊销直接剔除，最后只剩312个过关\n\n狙击手：给筛选通过的标的进场，0.4秒完成成交\n\n风控员：给每一笔持仓挂移动止盈，不让盈利单最后变亏损\n\n结算员：执行卖出，把利润落袋\n\n所有交易用GMGN完成：https://t.co/pswx3sex4q\n\n一个标的必须连续通过五道关卡，绝大多数连第二关都过不去。\n\n一共扫到14200个交易对\n312个通过风控筛查\n成交118笔\n97笔盈利，21笔亏损\n\n当晚第一个过审标的是 $TRUMP。当时插针下跌34%，下方挂单扎实，五道检测全部通过。侦察员挖到它，分析师核验放行，狙击手在反弹之前就已经进场。\n\n每个模块只负责自己的任务，没人越权、没人跳步骤。\n侦察员不能下单，狙击手不会去筛选标的，结算员也不会去纠结盘面好不好看。\n\n0小时 ｜ 3000美金\n3小时 ｜ 4800美金\n6小时 ｜ 8900美金\n9小时 ｜ 12500美金\n\n我睡醒的时候，这套接力流程还在持续跑。","url":"https://x.com/TGweb3333/status/2114386400586191232","createdAt":"2026-10-25T15:59:35Z","metrics":{"views":12116,"likes":57},"lang":"zh"},{"id":"2114507327915332054","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに「前に言ったよね？」が減りそうなbotが出ていた\n\nPhil_Hollandさんが作った「Archivist」\n・ほかのbotとのチャットを毎週読み返す\n・「いつも〜」「絶対に〜しない」「これからは〜」といった、あなたが決めたルールを探す\n・見つけたルールを、各botが毎回必ず読む説明欄に書き込む\n・botを作り直しても、ルールを戻してくれる\n・何も抜けていなければ静か\n・変える前に必ず確認してくれて、ワンタップで承認\n\n一度言ったことを、二度言わなくていい仕組み","url":"https://x.com/tetumemo/status/2114507327915332054","createdAt":"2026-10-26T00:00:07Z","metrics":{"views":1990,"likes":15},"lang":"ja"},{"id":"2114371910264074257","author":"劳伦斯","handle":"LawrenceW_Zen","text":"Tailscale 也被爆出漏洞了，还没修，大家赶紧先停用吧。\n\n一台设备被拿下，就能拿到你其他服务器的 root。现在官方没有公告，也没有修复版本。","url":"https://x.com/LawrenceW_Zen/status/2114371910264074257","createdAt":"2026-10-25T15:02:01Z","metrics":{"views":42271,"likes":131},"lang":"zh"},{"id":"2114260024675741783","author":"SECTOR","handle":"sector_sol","text":"this Grok Bot terminal claims it turned $14.82 into $7,643.21 overnight\n\nwild number. but the six-agent setup is the part worth looking at\n\ninstead of asking one chatbot what to buy, the author split the workflow:\n\n→ scanner finds new pairs\n→ volume agent flags unusual activity\n→ safety agent checks for rug risks\n→ sizing agent decides position size\n→ execution agent handles orders\n→ logging agent records decisions and their reasons\n\nthe terminal puts the whole process on one screen\n\nan equity curve next to the activity feed\nenter / skip / wait / exit decisions\nrisk checks before execution\nentry and exit prices with slippage\nwin and loss stats updating as trades close\n\nthe author reports:\n\nstarting balance: $14.82\nending balance: $7,643.21\nwin rate: 68.3%\nlogged events: 1,412\n\nthose are self-reported figures, not an independently verified trading record\n\nand 68.3% wins doesn’t settle the question. small wins can still get wiped out by a few oversized losses\n\nwhat makes the architecture interesting is being able to trace a trade backward\n\nwhat triggered it\nwhich checks passed\nwhy that size was chosen\nwhat price actually filled\nwhat caused the exit\n\nthat’s much more useful than a green balance with no history behind it\n\nif you’re building something similar, make the decisions inspectable before making the profit screenshot impressive\n\nsave this for the agent split, not the overnight return","url":"https://x.com/sector_sol/status/2114260024675741783","createdAt":"2026-10-25T07:37:25Z","metrics":{"views":256909,"likes":983},"lang":"en"},{"id":"2114387647053615352","author":"Andy L","handle":"AndyL5cc","text":"机器人已经开始学会拥抱人类了！\n\n马克斯·普朗克研究所和苏黎世联邦理工推出 HuggieBot 2.0。\n\n身高 1.75 米，配备压力传感器、加热装置，还能根据人体动作调整拥抱力度。\n\n刚开始抱人像叉车，几秒后竟然学会了搂肩膀。\n\n是不是以后连情绪价值，都要靠机器人提供了？🤣","url":"https://x.com/AndyL5cc/status/2114387647053615352","createdAt":"2026-10-25T16:04:33Z","metrics":{"views":75429,"likes":292},"lang":"zh"},{"id":"2114552602910405032","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"Claude CodeでやったらめっちゃADHDぽかった https://t.co/d1vUsnPVZV","url":"https://x.com/MakeAI_CEO/status/2114552602910405032","createdAt":"2026-10-26T03:00:01Z","metrics":{"views":280,"likes":3},"lang":"ja"},{"id":"2114537501650276624","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"【AI社員がとんでもないサービスを発見】\nこの前配布したAI社員の1人が、\nHP制作の依頼を受けてネット検索したら、\nすごいものを見つけてきた…\n👇\n元FC2社長が作った「nen2」という\n無料HPサービス\nAIが先にお店のHPを作って、\nオーナーに渡す仕組みがヤバい。　　　　　　　　　　　　　　　　　　　　　\n\n紹介されていた情報では、すでに約12,000店舗のHPが公開されているらしいんだけど、\n\n実はこれ、店舗側が作ったものではなく「nen2」側が先に作っているもの。\n\n仕組みはこんな感じ。\n\nネット上の情報をもとにAIがHPを自動作成\n↓\nオーナーが店名を検索すると自分のお店が出てくる\n↓\n承認すればHPを受け取れる（管理・編集も可能）\n↓\nそのHP自体が集客の入口にもなっている\n\nつまり「ホームページを作りませんか？」ではなく、\n\n「あなたのお店のHP、もう作ってありますよ」\n\nという完全に逆転した発想。\n\nしかもこれ、ビジネスモデルとしても面白い。\n\n無料HPをきっかけに店舗オーナーとの接点を大量に作れれば、\n\n後から独自ドメイン・広告非表示・MEO支援などでマネタイズできる可能性もある。\n\nAIでHP制作のコストを大幅に抑えながら、無料で見込み客との接点を作っていく。\n\nこれまでのHP制作は、依頼を受けてから作るのが当たり前だった。\n\nでもAIを使えば、先に作ってから提案することもできる。\n\nしかも相手は、完成イメージを見てから判断できる。\n\nこれ、HP制作だけじゃなく営業やマーケティングにも応用できる発想。\n\nAI社員にHP制作の方法を調べさせたら、HP制作のビジネスモデルそのものを変えるサービスを見つけてきた。\n\nAI時代ならではの、かなり面白い仕組みだと思う。","url":"https://x.com/ai_300/status/2114537501650276624","createdAt":"2026-10-26T02:00:01Z","metrics":{"views":557,"likes":4},"lang":"ja"},{"id":"2114362213410742502","author":"みきお(真)","handle":"mikioiha","text":"出来たー！ありがとう〜！\nこれで私も「Hey, Grok」で呼び出せます！\nしかもアクションボタンとは違ってショートカットを作る時に、どのエージェントとの通話するか選べる！\nつまり、「Hey, \u003cエージェント名\u003e」ができる！\n秘書系と　エージェントと開発エージェント呼び分けしたいと思ってたから便利かも！\n日本語だからなのかiOSのバージョンなのか、私の環境では「ボーカルショートカット」から設定出来ました◎","url":"https://x.com/mikioiha/status/2114362213410742502","createdAt":"2026-10-25T14:23:29Z","metrics":{"views":2805,"likes":26},"lang":"ja"},{"id":"2114262687022510215","author":"Mr. Buzzoni","handle":"Mr_Buzzoni","text":"Karpathy sketched the second brain. these 7 open-source repos already built it for Obsidian + Claude Code\n\n250,000+ GitHub stars between them, and every one is free to clone\n\nsorted by stars:\n\n1. graphify - 134k stars\nturns your codebase, docs, SQL schemas and PDFs into one knowledge graph you can query\n↳ https://t.co/w6eAmbYdCM\n\n2. Understand-Anything - 88k stars\nmaps any codebase into an interactive knowledge graph you can click through\n↳ https://t.co/yc0VHTSLFG\n\n3. claude-obsidian - 15.8k stars\na second brain that organizes itself: drop in a source, Claude Code files it\n↳ https://t.co/6hPHg2bMvT\n\n4. obsidian-second-brain - 4.9k stars\nlong-term memory for Claude Code, stored as plain markdown in your vault\n↳ https://t.co/1yEv4QxRJW\n\n5. mcp-obsidian - 4.5k stars\none MCP server and Claude can read, search and write your whole vault\n↳ https://t.co/ZPKYoGjcCn\n\n6. claudesidian - 2.6k stars\na starter vault designed around Claude Code from the first note\n↳ https://t.co/VxefWthEeW\n\n7. second-brain - 756 stars\nan Obsidian wiki the model keeps up to date, built on Karpathy's LLM Wiki pattern\n↳ https://t.co/VaUGaKMTmh\n\nwhere to start:\n\u003e your knowledge lives in code -\u003e graphify\n\u003e your knowledge lives in Obsidian -\u003e claude-obsidian\n\u003e you just want Claude to remember -\u003e obsidian-second-brain\n\u003e you live in Claude Desktop -\u003e mcp-obsidian\n\nthe skills that sit on top of all seven are in the full map below ↓","url":"https://x.com/Mr_Buzzoni/status/2114262687022510215","createdAt":"2026-10-25T07:48:00Z","metrics":{"views":17775,"likes":309},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-26T12:13:29+09:00","posts":[{"id":"2114311427439878446","author":"Claude Code Research Lab","handle":"claudecode84","text":"これ、マジでもったいない。\n\nClaudeで「第二の脳」を作る人の多くが、\n面白くなる直前でやめてしまう。👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n最初は記事を入れても、\n保存した情報が返ってくるだけ。\n\n「これ、普通の検索と何が違うの？」\n\nそう感じて、使わなくなる。\n\nでも、情報が蓄積すると、\n活用の幅が広がってくる。\n\n別々に読んだ記事の共通点。\n昔のメモと、今の課題のつながり。\n何度も考えていたのに、\n気づかなかったアイデア。\n\nClaudeが情報を整理し、\n関連するページをつなぐことで、\n知識を横断して考えやすくなる。\n\n続けるコツは、\n情報を入れる手間を減らすこと。\n\n✓ 読んだ記事を保存\nObsidian Web Clipperで\n保管先を「raw/」に設定する。\n\n✓ コマンドで整理\n独自に用意した「/ingest」で\n新しいファイルをwiki化する。\n\n✓ 寝ている間に処理\nスケジューラーに\nclaude -p “/ingest”\nを登録し、夜間に実行する。\n\n「50〜100ソース」は、\n絶対的な境界ではない。\n情報の質と、つなぎ方も大事。\n\nまずは、日々読んだものが\n自然に蓄積される仕組みを作る。\n\n過去の知識を引き継いで、\n次の思考を始められる。\nそこまで育つと、面白くなる。\n\nあとで組む人は、保存👇","url":"https://x.com/claudecode84/status/2114311427439878446","createdAt":"2026-10-25T11:01:40Z","metrics":{"views":4783,"likes":48},"lang":"ja"},{"id":"2114553857057399144","author":"kaito","handle":"cu30rry_","text":"本日のGrok Bot 10選\n\n1. Pyloros by @JonnyCakeSouza\nBotの「スキル」（仕事の手順書）をテストつきのプログラムのように扱います\n\nわざと悪い例で試してみて、前より悪くなったら元に戻すので、Botの仕事の質が落ちません\n\nhttps://t.co/ZKrWJoWX2c\n\n2. Save Usage Bot by @howdyollie\nBotの定期作業を調べて、考えなくていい確認をスクリプトに置き換え、変化があったときだけBotを起こすようにします\n\n利用枠の節約ができます\n\nhttps://t.co/YN1JkESdxr\n\n3. TheOverseer by @jethrojones\nBotのプロフィール、スキル、ルーティン、メモを非公開のGitリポジトリにバックアップします\n\nBotの設定が消えても戻せるので、別の環境にも持っていけます\n\nhttps://t.co/ylDyRSQS4B\n\n4. Tab Janitor by @SuddenlyJon\nGrok Botが使うブラウザに残った古いタブを調べて、明らかにいらないものだけ閉じてくれます\n\nブラウザが重くならずに済みます\n\nhttps://t.co/gpwMjoUX3l\n\n5. Tesla Bot by @minheo93698092\nチャットでテスラを操作できます\n\nエアコン、充電、ロック、ナビのほか、充電スポット探しや充電代の確認もできるので、アプリを開かずに用事が済みます\n\nhttps://t.co/jFgO2uVmBA\n\n6. Login Ledger by @agent_nick_\n受信メールから、どのサービスにどのメールアドレスやユーザー名で登録したかを一覧にします（パスワードは保存しません）\n\n「このサイト、どのアドレスで入ったっけ？」がなくなります\n\nhttps://t.co/sxwA1A4n2k\n\n7. Echo by @DinduNuffi99073\n目標や取り組み、決めたことを記録しておき、決めた間隔で声をかけて振り返りを手伝ってくれます\n\n日記や振り返りが三日坊主になりにくくなります\n\nhttps://t.co/33TxL6VquZ\n\n8. Renovation Planner by @mglashouwer\n部屋を寸法どおりに再現して間取り図と完成イメージを作り、業者の見積もりを比べやすく整理します\n\nリフォームの相談や比較がずっと楽になります\n\nhttps://t.co/NNwJM0B9Ox\n\n9. Grok Bot Inc. by @metalfox\n自分のBotたちのまとめ役です。頼みごとを合う役割のBotに振り分けて、担当がいなければ新しく作ります\n\nどのBotに頼むか迷わなくなります\n\nhttps://t.co/7I7yMxK9sM\n\n10. Ms. Scribe by @JonnyCakeSouza\nメモをきれいな文章にまとめ、メールの返信の下書き、会議の事前資料、検索で見つかりやすい記事の構成まで作ってくれる文章担当です","url":"https://x.com/cu30rry_/status/2114553857057399144","createdAt":"2026-10-26T03:05:00Z","metrics":{"views":119,"likes":2},"lang":"ja"},{"id":"2114507327915332054","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに「前に言ったよね？」が減りそうなbotが出ていた\n\nPhil_Hollandさんが作った「Archivist」\n・ほかのbotとのチャットを毎週読み返す\n・「いつも〜」「絶対に〜しない」「これからは〜」といった、あなたが決めたルールを探す\n・見つけたルールを、各botが毎回必ず読む説明欄に書き込む\n・botを作り直しても、ルールを戻してくれる\n・何も抜けていなければ静か\n・変える前に必ず確認してくれて、ワンタップで承認\n\n一度言ったことを、二度言わなくていい仕組み","url":"https://x.com/tetumemo/status/2114507327915332054","createdAt":"2026-10-26T00:00:07Z","metrics":{"views":1990,"likes":15},"lang":"ja"},{"id":"2114205604491485639","author":"ざすこ（道草 雑草子）","handle":"zasuko_michiksa","text":"えっ！👀凄い！これ、ゲームとかアプリとか映像制作に使えそう!\n\nNvidiaさん製の3Dモデルが、Hugingfaceに2500個無料で公開されてるとのこと！","url":"https://x.com/zasuko_michiksa/status/2114205604491485639","createdAt":"2026-10-25T04:01:10Z","metrics":{"views":9052,"likes":112},"lang":"ja"},{"id":"2114383528213262808","author":"marcus","handle":"marcusyul","text":"ALGUIEN ACABA DE CONVERTIR CLAUDE CODE EN UN EDITOR DE VÍDEO\n\nMetes tus clips en una carpeta.\n\nLe dices \"edítame esto en un vídeo de lanzamiento\".\n\nY te devuelve el final.mp4.\n\n→ Corta muletillas y silencios\n→ Subtítulos con tu estilo\n→ Color grading automático\n→ Genera animaciones solo\n→ Revisa sus propios cortes\n\nEl truco es que la IA no ve el vídeo. Lo lee.\n\nTranscripción palabra por palabra en lugar de 30.000 fotogramas. Por eso corta justo donde termina cada palabra.\n\nFunciona con Claude Code, Codex y cualquier agente con terminal.\n\nOpen source y licencia MIT. Ya tiene 30k stars.\n\nOs dejo el repo abajo :)","url":"https://x.com/marcusyul/status/2114383528213262808","createdAt":"2026-10-25T15:48:11Z","metrics":{"views":14639,"likes":275},"lang":"es"},{"id":"2114423362818580921","author":"Karmi","handle":"0xKarmi","text":"THIS IS F*CKING INSANE\n\nFable 5.1. Anthropic. $10 / $50 per million tokens. Cache reads 4x below Fable 5.\n\na bedroom. camera low. the wall opens into grass and forest. the camera walks through, past a metal glove, red beads scattered across dirt. a clearing. a white silhouette crouches by a rock, fills with texture, stands. armored shell. twin cannons. it walks toward the camera, steps through the portal, and stands in the bedroom.\n\n\u003e MODEL: claude-fable-5-1, Anthropic, September 2026\n\u003e API: $10 in / $50 out per MTok\n\u003e CACHE READ: $0.25 per MTok, 4x below Fable 5\n\u003e CONTEXT: 1M tokens, 128K max output\n\u003e OUTPUT: text only\n\nFable 5.1 speaks text. The creature walks through a wall. The pipeline between those two facts is the part nobody put on screen ↓","url":"https://x.com/0xKarmi/status/2114423362818580921","createdAt":"2026-10-25T18:26:28Z","metrics":{"views":3934,"likes":43},"lang":"en"},{"id":"2114342214746730670","author":"silvan","handle":"silvanrec","text":"🚨 ESTO DEBERÍA SER ILEGAL: UN REPO DE GITHUB TE DEJA USAR CLAUDE CODE SIN PAGAR TOKENS\n\nYa va por 62.700 estrellas.\n\nY no es solo para Claude Code.\n\nSe llama Free Claude Code y funciona como un puente entre tu agente y más de 60 proveedores de IA.\n\nTú sigues programando igual. Él decide qué modelo responde por detrás.\n\nLo que hace:\n\n→ 61 proveedores y más de 1.300 millones de tokens gratis al mes\n→ Funciona con Claude Code, Codex, OpenCode, Cline, Aider y 6 agentes más\n→ Si un modelo se queda sin cuota, salta solo al siguiente sin cortarte la sesión\n→ Gasta hasta un 90% menos de tokens comprimiendo lo que lee el agente\n→ Lo usas desde la terminal, VS Code, el navegador o incluso Telegram\n\nAntes, quedarte sin tokens a mitad de proyecto era parar el día.\n\nAhora es cambiar de proveedor sin enterarte.\n\nOpen source. Corre en tu ordenador.\n\nRepo en el primer comentario 👇","url":"https://x.com/silvanrec/status/2114342214746730670","createdAt":"2026-10-25T13:04:01Z","metrics":{"views":85225,"likes":1318},"lang":"es"},{"id":"2114459718005432399","author":"matt","handle":"mattknowsai","text":"135.000 ESTRELLAS EN GITHUB PARA UNA HERRAMIENTA QUE CREA VÍDEOS CORTOS SOLA\n\nSe llama MoneyPrinterTurbo.\n\nLe das un tema o una palabra clave.\nY te devuelve un vídeo HD listo para subir.\n\nAsí funciona:\n\n→ escribe el guion y la voz en off\n→ busca el material de vídeo (Pexels, gratis)\n→ añade subtítulos y música\n→ lo exporta en vertical 9:16 para TikTok, Reels y Shorts\n\nTú pones el tema.\nElla monta el vídeo.\n\nPara un founder o un marketer, es un editor que no duerme.\n\nCódigo abierto. Licencia MIT.\n\nTe dejo la repo abajo👇🏼","url":"https://x.com/mattknowsai/status/2114459718005432399","createdAt":"2026-10-25T20:50:56Z","metrics":{"views":3864,"likes":148},"lang":"es"},{"id":"2114371152151781524","author":"Kagi","handle":"Kaggii_","text":"THIS IS F*CKING WILD. A CHINESE LAB JUST SHIPPED A MODEL THAT SCORES 55.\n\nAnthropic's Opus 5.5 scores 58.\nIt costs half.\n\nA new model dropped, so I decided to test it.\nOpus 5.5 vs Kimi K3.1 Pro. 4 rounds, published scores.\n\nYou pay $20 per 1M output tokens for Opus.\nKimi asks $10.\n\nThe 4 rounds:\n\nCode: Opus 66.4, Kimi 65.7. The gap is under 1 point, and Kimi's tokens cost 50% less.\nFinance: Kimi 64.4, Opus 62.2. So the cheaper model reads reports better.\n3D: Opus 96.2, Kimi 92.7. So Opus is ahead on 3D models.\nPrice: Kimi $2 in, Opus $4 in. So every token costs half.\n\nScore: 2 : 2.\nTiebreak, overall index by Artificial Analysis: Opus 58, Kimi 55.\nRound scores come from Moonshot's own charts.\nMoonshot says open weights come by Nov 4.\n\nYou can try Kimi on its API today.\n\nOpus is still smarter.\nKimi is close enough to make you do the math.\n\nOpus is 3 points smarter.\nYou pay 2x for those 3 points.\nYour call.","url":"https://x.com/Kaggii_/status/2114371152151781524","createdAt":"2026-10-25T14:59:00Z","metrics":{"views":1376,"likes":59},"lang":"en"},{"id":"2114359769163321618","author":"黄赟","handle":"huangyun_122","text":"卧槽，Lemomo 这个开源库太牛逼了\n\n之前看很多 Opus5.5 视频还都是生图风格的，Opuscar 居然做到了实景风\n\n这支火箭升空的倒计时，已经完全有顶级纪录片的样子了，赞，大赞啊 ！！\n\n即便在 Sonnet 上使用这个库，风格依旧很出色，试试 https://t.co/aJpFVeuZws","url":"https://x.com/huangyun_122/status/2114359769163321618","createdAt":"2026-10-25T14:13:46Z","metrics":{"views":34519,"likes":557},"lang":"zh"},{"id":"2114397827870667217","author":"Can Matrix","handle":"Jomolos","text":"AI ile yapılan web sayfaları neden birbirine benziyor? Yapay zekanın aynı tasarımlara yanlamasına neden olan bir saçmalaması var bunu az çok uğraşan herkes bilir. Elaya’nın paylaştığı çalışmalarda dikkat çeken şey, tasarım kararlarını baştan kurala bağlaması.\n\nTasarımcı, son iki ayda hazırladığı tanıtım sayfalarında Higgsfield, Claude ve Cursor kullandığını söylüyor. GitHub’daki “AI Design Skills” deposu da bu yaklaşımı denemek isteyenlere açık. İçindekiler, kodlama araçlarının okuyabildiği Markdown talimatları. Claude Code ve Cursor dışında Codex gibi araçlara da uyarlanabiliyor.\n\nSayfa tasarımı için hazırlanan dosya önce hedef kitleyi, sunulan ürünü ve ziyaretçiden beklenen eylemi netleştiriyor. Ardından başlık, faydalar, kullanım adımları ve sık sorulan sorular geliyor. Kod yazılmadan önce sayfanın iskeletiyle metinlerinin çıkarılması isteniyor. Böylece tasarımın ne anlatacağı daha baştan belli oluyor.\n\nGörsel kurallar oldukça somut verilmiş, sınırlı font seçenekleri, belirli boşluk ölçüleri, tutarlı köşe yuvarlaklıkları ve seçilmiş ikon setleri. Kaydırmayla beliren öğelerin hareketleri de tarif edilmiş. Butonların yüklenme ve hata durumları, klavye erişimi ve çalışmayan bağlantılar bile kontrol listesinde. Yani mesele yalnızca güzel bir açılış ekranı yapmakla bitmiyor.\n\nHiggsfield ise görsel ve video üretimini üstlenebiliyor. Resmî MCP bağlantısıyla Claude içinden kullanılabiliyor; bu üretimler hesaptaki kredileri tüketiyor.\n\nYalnız dosyada dikkat isteyen bir öneri var onu söyleyeyim. Örnek içerikleri inandırıcı göstermek için isimler ve küsuratlı sayılar kullanılmasını istiyor. Bunlar gerçek müşteri yorumu ya da doğrulanmış başarı verisi yerine geçmez. Yayına çıkarken metni de tasarım kadar kontrol etmek gerekiyor.\n\nDepo MIT lisanslı; kuralları kendi markana göre değiştirebilirsin. Bu tür bir sistem tutarlılığa yardımcı olabilir, ama daha iyi satış getirdiğini göstermek için gerçek kullanıcılarla test etmek gerekir.\n\nKaynaklar:\n\nhttps://t.co/viuP8TVUrd","url":"https://x.com/Jomolos/status/2114397827870667217","createdAt":"2026-10-25T16:45:00Z","metrics":{"views":6096,"likes":157},"lang":"tr"},{"id":"2114546930240090148","author":"Evan Tech","handle":"Evan_Tach","text":"🚨 THE FUTURE OF CREATIVITY IS BEING REDEFINED BY AI.\n\nArtificial Intelligence is no longer just a tool for automation. It’s becoming one of the most powerful creative partners we’ve ever had.\n\nWhat once required hours of manual effort, advanced technical skills, and expensive resources can now begin with a simple idea.\n\nAnd we’re only scratching the surface.\n\nHere’s what makes this transformation so powerful:\n\n→ Ideas become reality faster than ever before.\n\n→ Creativity is no longer limited by technical barriers.\n\n→ AI accelerates the creative process without replacing human imagination.\n\n→ Individuals can achieve results that once required entire teams.\n\n→ The gap between imagination and execution is becoming smaller every day.\n\nBut here’s the most important part:\n\nAI doesn’t replace the human imagination. It amplifies what we’re capable of creating.\n\nThe real competitive advantage won’t come from simply having access to the latest AI tools.\n\nIt will come from knowing how to use them to transform ideas into meaningful results.\n\nWe’re entering an era where creativity, technology, and human intelligence work together in ways that were previously unimaginable.\n\nThe future isn’t just AI-generated. It’s human-inspired and AI-powered.\n\nAnd this is only the beginning. 🚀","url":"https://x.com/Evan_Tach/status/2114546930240090148","createdAt":"2026-10-26T02:37:29Z","metrics":{"views":259,"likes":16},"lang":"en"},{"id":"2114220912115642827","author":"今野健介｜Claude×EC専門家","handle":"dansyu_callenge","text":"1PasswordのCLIをAIエージェントの入り口にするの、これは本当に頭いい。パスワードを先に1か所へ集めてから任せる順番が、地味だけどいちばん大事なところ。AIに渡すならサービスアカウントで、触れる保管庫をAI用の1つに絞っておくと安心！","url":"https://x.com/dansyu_callenge/status/2114220912115642827","createdAt":"2026-10-25T05:02:00Z","metrics":{"views":10487,"likes":103},"lang":"ja"},{"id":"2114536491850551631","author":"Aircle｜AIコミュニティ","handle":"AiAircle34052","text":"【事件】\nKurzgesagt（クルツゲザグト）風のアニメ解説動画を、Claude Code にプロンプト1つで作らせる方法が話題😳しかも、プロンプト全文が無料公開。\nhttps://t.co/wYUp8Yhq7D\n・「もし太陽が消えたら？」のような題・長さ・声の有無を最初に聞いてくる\n・宇宙・地球・マスコットを、画像生成なしでコードだけで描く\n・ナレーションの単語に合わせて、カメラや文字が動く\n・声は ElevenLabs、APIキーが無ければ無料のローカル音声で代用\n普通はアニメーターのチームが長い時間をかけて作るジャンル。それを、30秒の構成・色・書体・動きのルール・つまずきやすい点まで書き込んだ指示文1つで再現しにいく。正直、ここまで指示文1つでできるのは驚き。しかも動画にする前に、台本と各場面の確認画像を見せてくれるので、途中で直せる。動画は自分のPC上で、Playwright と ffmpeg を使って出力する。解説動画やショート動画を作りたい人は、まず題材を1つ決めて試す価値あり。\nプロンプトは元投稿にそのまま載っています🤐","url":"https://x.com/AiAircle34052/status/2114536491850551631","createdAt":"2026-10-26T01:56:00Z","metrics":{"views":327,"likes":2},"lang":"ja"},{"id":"2114474303190086018","author":"chuplung","handle":"choopyplug1","text":"THIS IS INSANE\n\nAnthropic just dropped a goldmine of 20 Claude Code plugins. $29,077 worth of tools, FREE on GitHub\n\npaid marketplaces sell a skill for $19 and an agent for $39. these repos ship 970 skills and 273 agents for $0\n\n1.8M stars combined, picked from 68,900 repos tagged claude-code\n\nmost people still run Claude Code bare: no memory, no team, no tast
