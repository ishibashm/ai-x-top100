<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

om ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-29T19:15:39+09:00","posts":[{"id":"2115654952089694405","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"AI初心者こそ見るべき。とりあえずブクマして、記事も動画もセットで見ておけばObsidianはマスターできる。 https://t.co/dTnkfDWvwd","url":"https://x.com/ai_ai_ailover/status/2115654952089694405","createdAt":"2026-10-29T04:00:22Z","metrics":{"views":1262,"likes":10},"lang":"ja"},{"id":"2115396604694085961","author":"StudioYebisu","handle":"studio_yebisu","text":"領収書のPDF等をAI-OCRして、Freee,MF,弥生用のCSV出力するOSS【Ryoshu】を作りました！\n\nCPUで動く軽量のLocalLLMを組み合わせて\nPDFや画像をOCR→数字読み取り→意味判断AIに投げて勘定科目を判断→CSV出力\nという感じのアプリケーションです。\n\n完全ローカル駆動で情報が外に漏れません。\n\n使い方は、PDFや画像をまとめて選択するかフォルダごとドロップして、読み取りスタートを押すだけ。\n\n元画像、抽出した文字や数字、勘定科目の候補を並べてチェック。\n画像は拡大、科目はクリックで変更できます。\n修正・確認したら、汎用CSVや会計ソフト向けCSVに出力。\n\n読み取りはIndra OCR (約76MBの軽量OCR)\n勘定科目の候補は別のQwen3 4Bが担当（使用している4ビット量子化版は約2.5GB）\n\n初回セットアップと更新時はネット接続とライセンス同意が必要ですが、以降はローカルPC上で動きます。\n\n架空領収書PDF 100件をの読み取り結果正答率は\n・金額95/95 ※5件は外貨・返金等のダミー\n・日付99/100でした。\n・通常の勘定科目候補：44/48件\n・保留・登録停止・資産確認なども含む全体判定：86/100件一致 → 86%\n\n金額等は正確に読み取りますが、勘定科目の判定は甘いので、基本的にご自身でもデータを確認してもらう事になるかと思います。\n\nあくまで補助ツールなので、日付・金額・科目は元の領収書と照合して、税務判断は税理士に相談してくださいね。\n\nローカルLLMを試してみたい方向けに、CPUで動作するレベルの軽量AIモデルを利用＋実用性のありそうなソフトっていうテーマで作りました。\n\nライセンスMITなので、フォークして自由に改造してください。issue投げてもらったら、可能な範囲で対応します。\n\nOCRの精度上げたい…という方はもう少し大きくて性能の高いモデルに変えてもらえればいいとも思います！（Unlimited-OCR-2等）\n勘定科目も別のModelの方が正確に出せると思います。\n\n今回は動作条件を選ばない軽量さを重視してます。","url":"https://x.com/studio_yebisu/status/2115396604694085961","createdAt":"2026-10-28T10:53:47Z","metrics":{"views":7757,"likes":131},"lang":"ja"},{"id":"2115579421516353613","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝見た目の修正、もう文章で説明しなくていい\nCursorのデザインモードに「Annotate」が来た\nhttps://t.co/wIcyvxbv08\n\nCursorの公式ドキュメントによると、使い方はこう\n1. Agents Windowの中のブラウザで、動いているアプリを開く\n2. ツールバーのAnnotateを押す（Cmd + Shift + D）\n3. 直したい要素をクリックして、変えたいことを書く\n4. Shift + クリックで複数の要素をまとめて選べる\n5. ドラッグで範囲を囲んだり、線や矢印を描き込んだりできる\n6. 文字はダブルクリックでその場で書き換え\n7. Returnで送ると、エージェントがコードを直す\n\nエージェントには、選んだ要素の情報（タグ、クラス、サイズ、色やフォントなど）と、切り抜いたスクショが渡る\nReactやVue、Svelteなら、コンポーネント名まで\n\nUIの修正は「ここ」と指させるのが一番早い\nCursor 3.24.18以降で使えるとのこと","url":"https://x.com/tetumemo/status/2115579421516353613","createdAt":"2026-10-28T23:00:14Z","metrics":{"views":2036,"likes":5},"lang":"ja"},{"id":"2115352969994756466","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"AIエージェント使い倒して、無慈悲なAI経営しまくってる南場社長。これ見ないならClaude解約して。 https://t.co/i968wXm7lW","url":"https://x.com/ai_ai_ailover/status/2115352969994756466","createdAt":"2026-10-28T08:00:24Z","metrics":{"views":18457,"likes":222},"lang":"ja"},{"id":"2115236625085342075","author":"Codex 研究所","handle":"codex_lab_","text":"【保存推奨】\n “AI特有の安っぽさ”を徹底排除！\nプロ監修のLP作成スキル「ai-design-skills」が公開し即8,000スター突破。\n\nClaude Code、Cursor、Codex対応。\n現役デザイナーの「AI感を消す規範」を体系化したOSS集が世界中で話題です。\n\n・「グラデーション禁止」「特定フォント（Inter/Roboto等）の排除」「定義済みトークンによる余白設計」など脱テンプレを徹底 \n・CV重視のコピー設計、状態別インタラクション、design-to-motionまで網羅 \n・Higgsfield等の生成アセットと連携し、設定ファイルに置くだけで即導入可能\n\nプロの禁止事項や美意識で出力を縛り、商用LPの制作コストを削る極めて合理的な仕組み。\n\nこうしたルール適用や実装の高速化も、「Chat」「Work」「Codex」を用途別に使い分けることで作業効率とトークン効率が最大化します。 \n\n3つのモードの運用設計を体系化した解説はこちら👇","url":"https://x.com/codex_lab_/status/2115236625085342075","createdAt":"2026-10-28T00:18:05Z","metrics":{"views":11394,"likes":144},"lang":"ja"},{"id":"2115729406618751102","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"Grok BotのMV制作Bot、ここまで作れるようになりました🎬\n\n新曲『帰る頃には』のMVは、曲とリリックを渡しただけ。夜道や街灯の背景もBotがコードで描いて、曲のリズムに合わせて光と歌詞が動くリリックモーションMVに仕上げてくれました📝\n\nいまブラッシュアップ中ですが、そろそろ出せるかも✨","url":"https://x.com/takamasa045/status/2115729406618751102","createdAt":"2026-10-29T08:56:13Z","metrics":{"views":259,"likes":7},"lang":"ja"},{"id":"2115536003519873411","author":"KAWAI","handle":"kawai_design","text":"Figmaを使うのをやめて、\nGrok botに移行した話\n\nPaperで作り、Lenearでタスク管理する設計はデザインだけでなく、あらゆるプロジェクトに応用できそうです。\n\nAIに専用ツールとタスク管理·連絡ツールを渡せば、プロフェッショナル人材として働いてもらえる時代が来ました。あとは、何を任せ、何を正解とするか。その判断が人の役目です。","url":"https://x.com/kawai_design/status/2115536003519873411","createdAt":"2026-10-28T20:07:42Z","metrics":{"views":5484,"likes":61},"lang":"ja"},{"id":"2115656575369318748","author":"そら","handle":"sora_biz","text":"勉強になるなぁ、、\n\nClaude Code、作業の順番まで保存できるんだ。\n\n調査→別のサブエージェントで検証→結果をまとめる。\nこの流れを保存して、次回も同じ順番で実行できる。\n\nAnthropicの中の人も、10体くらいの作業で使ってるらしい。\n\nDynamic workflowsって\n大量にエージェントを動かすためだけの機能じゃないんだね。\n\n動画の内容を解説すると、GitHubのバグ報告を調べる工程がこうなってる。\n\n① Issueを読み、重複や見た目だけの報告を除いて調査対象を選ぶ\n② バグごとにサブエージェントを実行し、原因を並列に調査する\n③ 別のサブエージェントで再現テストを作り、調査結果を検証する\n④ 再現できたものと未確認のものを分け、優先順位付きでまとめる\n\n原因の説明が出たところで終わらず、再現テストで確かめるところまで工程に入ってるわけ。\n\nこの実行順や並列処理を、JavaScriptのファイルとして保存できる。あとから順番や条件を変えることもできる。\n\n使い始めるとき、自分でJavaScriptを書く必要はない。\n\n対象のリポジトリでClaude Codeを開いて、たとえばこう頼む。\n\n「dynamic workflowを使って、決済に関する未解決のGitHub Issueを調べて。重複を除き、各Issueの原因を並列に調査した後、別のサブエージェントに再現テストで検証させて。確認済みと未確認を分け、関連ファイルと行番号付きでまとめて。本体の修正はしないで」\n\nこれは依頼例。GitHubのIssueを読むには、ghなどでアクセスできる準備が必要。\n\n作成された実行計画とスクリプトを確認して承認すると、バックグラウンドで進む。進捗は /workflows で見られる。\n\nうまくいった工程を残すなら、/workflowsで対象の実行を選んで「s」で保存。\n\nたとえばbug-triageという名前で保存すれば、次回から /bug-triage で呼び出せる。これは保存して作る独自コマンドで、最初から入ってる名前ではないよ。\n\nバグ調査以外なら、こんな使い方も考えられる。\n\n・PRレビュー\n変更ファイルごとに並列レビュー→指摘を検証→重複を除いて重要度順にまとめる。\n\n・競合サービスの料金比較\n各社の公式料金表を並列に確認→月払い・年払い・従量料金の条件を別のサブエージェントで照合→比較表にまとめる。\n\n調べるPRや会社が変わっても、保存した工程は再利用できる。\n\n「前と同じ流れで調べて。検証も忘れずに」って、毎回説明し直さなくてよくなるんだな。\n\nただし、同じ順番で実行できることと、毎回同じ回答・正しい結果になることは別。\n\nサブエージェントの分だけ利用枠も消費するので、最初は対象を絞って試すのがよさそう。\n\n全有料プランで利用でき、Proは /config のDynamic workflowsをオンにする必要あり。\n\n公式の手順はリプに。","url":"https://x.com/sora_biz/status/2115656575369318748","createdAt":"2026-10-29T04:06:49Z","metrics":{"views":1014,"likes":6},"lang":"ja"},{"id":"2115596475237626359","author":"Tetsuro Miyatake","handle":"tmiyatake1","text":"AI企業のMirendilがAIエージェントの自動実行ができるプロダクト「Lor」のベータ版をローンチした。\n\nhttps://t.co/boqkwm104E https://t.co/qDLqlQY3jV","url":"https://x.com/tmiyatake1/status/2115596475237626359","createdAt":"2026-10-29T00:08:00Z","metrics":{"views":1208,"likes":4},"lang":"ja"},{"id":"2115640643225846084","author":"Günther | グンタ","handle":"gunta85","text":"【朗報】Codex課金勢、今日から毎月最大8万円分のAPIクレジットがもらえる\n\nClaude Code勢は10/7からもらえてたけど、気づいてない人多そう\n\nどっちもサブスク代と同額が毎月付く。最初に一回紐付けないともらえない\n\n■ ChatGPT\nPro 月1.8万 → 毎月1.6万円分\nPro 月3.5万 → 毎月3.2万円分\nPro 月8.8万 → 毎月8万円分（年96万）\nBusiness → Standard席3,200円 / Premium席1.6万円分（全体で上限8万）\nPlus（月3,500円）→ 0円\n\n■ Claude（10/7から）\nMax 5x 月1.8万 → 毎月1.6万円分\nMax 20x 月3.5万 → 毎月3.2万円分\nTeam → Standard席3,200円 / Premium席1.6万円分（全体で上限8万）\nPro（月3,500円）→ 0円\n\nPro/Maxは差額が消費税だけ\nTeam/Businessは席の値段も付与額も上限も完全一致で草\n\n■ ただしCodex / Claude Code本体には使えない\nChatGPT → CodexはAPIキー経由でも対象外\nClaude → 対話のClaude Codeは対象外。紐付けたConsoleのAPIキーで自分で回す claude -p / Agent SDKはOK（公式GitHub Action・IDE・デスクトップ経由はNG）\n\n使い道は自作エージェント、CIボット、夜間バッチ、自分のアプリ\n\n■ 罠\n共通 → 加入7日後から / 繰越なし / 紐付け先は1つ、変更はサポート経由\nChatGPT → ChatGPTとAPIで同じメアド必須\n\n■ 受け取り\nWeb版の設定 → Billing → API credits から紐付け。あとは毎月自動","url":"https://x.com/gunta85/status/2115640643225846084","createdAt":"2026-10-29T03:03:30Z","metrics":{"views":44919,"likes":288},"lang":"ja"},{"id":"2115692105498566933","author":"AIDB","handle":"ai_database","text":"AIに大量の文章を「まとめて」と頼むと、頼むたびに結論が入れ替わります。\n「一貫性を最優先して」と指示してもほとんど直らず、資料を小分けにして渡すとかえって悪くなります。\nAIが頼まれるたびに、分類をゼロからやり直しているためです。\nhttps://t.co/69bugBIlEY\n本記事では、毎回同じ基準でまとめさせる設計を紹介します。\n先月と今月の\"まとめ\"を、同じ物差しで比べるための手順です。","url":"https://x.com/ai_database/status/2115692105498566933","createdAt":"2026-10-29T06:28:00Z","metrics":{"views":4750,"likes":45},"lang":"ja"},{"id":"2115565899533132056","author":"あぎ","handle":"agi_aibusi","text":"Suno MCPきた！\n\nMidjourneyもMCPテスト中だしこれが揃えば動画制作の自動化がさらに進む","url":"https://x.com/agi_aibusi/status/2115565899533132056","createdAt":"2026-10-28T22:06:30Z","metrics":{"views":4050,"likes":52},"lang":"ja"},{"id":"2115656961094230479","author":"Kenn Ejima","handle":"kenn","text":"高難度のバグでOpusには永久に見つけられない・直せない問題ってあるんですよ…\n\nなぜ数学や物理の分野ではOpenAIのモデルが目立った成果を上げてるかというと、GPT系は発想力よりも論理的に閉じてる整合性・公理系を重視することによる「垂直」スケールを追求しているからで\n\nClaude系は発想力が活きる（変数が多くノイズからシグナルを拾うような）生物学系・熱力学系に強い「水平」スケールモデル\n\nだから\n\nスコープの設計はOpus\n実装はCodex\nレビューはOpus\n\nのサンドイッチが基本形で\n\nエッジケースの際どいバグ修正の場合には逆に\n\nまずCodexで調査\nClaudeのセカンドオピニオン\nCodexで実装\nClaudeのレビュー\n\nの逆順でスタートします","url":"https://x.com/kenn/status/2115656961094230479","createdAt":"2026-10-29T04:08:21Z","metrics":{"views":120248,"likes":1567},"lang":"ja"},{"id":"2115628824448913863","author":"Sadao Tokuyama","handle":"tokufxug","text":"自律ドローンが人間の世界王者3人に勝利\n\n🔹単眼カメラでレースゲートを認識\n🔹外部計測装置なしで飛行データからカメラ角度を調整\n🔹軽量ニューラルネットワークがモーターを直接制御\n\n最高時速100km。研究論文がScience Roboticsに掲載\n開発：TU Delft\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2115628824448913863","createdAt":"2026-10-29T02:16:32Z","metrics":{"views":6134,"likes":131},"lang":"ja"},{"id":"2115675012548178418","author":"田中義弘 | taziku CEO / AI × Creative","handle":"taziku_co","text":"Google（@GoogleAI）が最新モデル「Gemini 4 Carbon」を発表。\n\nコーディングや長時間のエージェント処理、サイバーセキュリティで大きく性能が向上。\n\n3Dコンテンツの構築能力。@Mr_Salio氏のArena版の比較デモを見る限り、空間表現や構成の精度もかなり高い印象。","url":"https://x.com/taziku_co/status/2115675012548178418","createdAt":"2026-10-29T05:20:04Z","metrics":{"views":1471,"likes":6},"lang":"ja"},{"id":"2115589933297709171","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"【海外で話題】\nClaude Codeの会話と書きかけのコードを、\nそのまま同僚に渡せるプラグインを、エディタZedの開発チームが公開😳\nhttps://t.co/MG6eJ6z8DQ\nその名も\nーーーDelta！\n引き継ぎのたびに経緯を説明し直してる人、これ刺さる👇\n・/delta share でリンクを作って送るだけ。相手は自分のClaude Codeで /delta join のあとにリンクを貼れば入れる\n・Claudeとのやり取り、ツールの実行結果、コミット前の変更まで丸ごと共有される\n・相手は自分のClaudeで続きを進められる。それまでの会話がそのまま文脈として渡る\n・夕方に閉じたノートPCの作業を、時差のある同僚が朝そのまま拾える\n❌ 経緯を文章にまとめ直し、途中のコードをコミットしてから渡す\n⭕ リンク1つで、会話ごと途中から一緒に進める\n\n公開されたばかりのベータ版で、最初にDeltaへのサインインが要る。試す前に、Claude Codeのプラグインの入れ方と選び方を押さえておくと迷わない。\nClaude Codeプラグインを9,000件から36個に絞った記事はこちら👇","url":"https://x.com/ClaudeCode_love/status/2115589933297709171","createdAt":"2026-10-28T23:42:00Z","metrics":{"views":3065,"likes":10},"lang":"ja"},{"id":"2115477478101721282","author":"brainstormity","handle":"brainstormity","text":"LightPost is now OPEN-SOURCE! 🚀\nhttps://t.co/KMAdiucyzY\n\nA self-hosted, lightweight social media posting tool with automated scheduling.\n\nLight enough to run on my $10 Raspberry Pi Zero at home, costing me less than $1/month.\n\nTested Platforms:\n- X/Twitter \n- Instagram\n- Facebook Pages\n- Discord\n- Telegram\n- Mastodon\n- Bluesky\n\nAlso added:\n- Threads \u0026 LinkedIn (not yet tested)\n- Pinterest, TikTok \u0026 Google Business (under development)\n\nI've also added step-by-step guides with screenshots for all tested platforms under the \"Setup Guides\" page in the dashboard. Follow the guide and you'll have access to Meta apps in under 5 minutes (no waiting for \"approval\" required).\n\nGo fork it, try it, build on it, sell it... just have fun with it! 🤛","url":"https://x.com/brainstormity/status/2115477478101721282","createdAt":"2026-10-28T16:15:09Z","metrics":{"views":23557,"likes":572},"lang":"en"},{"id":"2115681243480383977","author":"Nospare","handle":"Nospare_Inc","text":"【図解】拡散言語モデルとは？\n\n大規模言語モデルの多くは、左から右へ 1 トークンずつ生成します。一度出したトークンは、基本的に後から直せません。\n\n拡散言語モデルは、ノイズがかかった離散トークンから始め、反復的にデノイズします。順序は左から右に限られず、確信度の高い位置から埋められます。ノイズの入れ方には、Masked 型と Uniform 型があります。\n\n各位置を独立に扱う product では、ステップを減らすと位置同士の依存を捉えにくいことまで、1 枚の図にまとめました。\n\n11/11(水) 18:00〜、東京大学 早川 知志先生によるセミナーでは、生成の原理・学習の理論から、Masked / Uniform、蒸留による高速化までを扱います。\n\n詳細・お申し込みはツリーへ▼\n\n#拡散言語モデル #dLLM #生成AI","url":"https://x.com/Nospare_Inc/status/2115681243480383977","createdAt":"2026-10-29T05:44:50Z","metrics":{"views":833,"likes":6},"lang":"ja"},{"id":"2115730362131169422","author":"毎日海外リール紹介、ハンドボール人","handle":"chikaidev","text":"カルーセルの種類を9つ並べただけで、コメント611件はヤバい\n\n中身は海外マーケターのリール\n1. 手順\n2. リスト\n3. ストーリー\n4. 本音・逆張り\n5. 事例の分解\n6. 保存用まとめ\n7. ニュース\n8. 見た目で魅せる作品紹介\n9. 比較・ビフォーアフター\n\nネタに困ったら、この9つから選ぶだけ\nコメントが集まった仕掛けはリプで解説します👇","url":"https://x.com/chikaidev/status/2115730362131169422","createdAt":"2026-10-29T09:00:01Z","metrics":{"views":96,"likes":0},"lang":"ja"},{"id":"2115516581925315034","author":"Jerry Liu","handle":"jerryjliu0","text":"Introducing the Document Parsing Protocol (DPP) \n\nThere are hundreds of different OCR models and tools, but they might all parse a document in different ways. \n\nSome errors are very clear-cut (e.g. hallucinating text, or completely misaligning a table), but many errors are much more ambiguous (e.g. how to represent split tables sharing a header). It's an issue that plagues most parse benchmarks too, because they inherently reward a certain style even if other styles might be semantically correct. \n\nWe introduce a protocol that proposes a standard way of parsing these documents into a correct format. We've curated a list of 140 rules that cover literally every aspect of doc parsing, for instance:\n- tables: borderless whitespace tables, header-only tables, horizontal slicing, side-by-side mini tables\n- forms: key-value regions, checkboxes, checklists, ids and labels, fields outside the form, \n- charts: standardized chart output, multiple charts, gantt charts, line charts\n\nYou can use DPP as an evaluation rubric for LLMs when determining the quality of parsing a document. \n\nIt's not a full evaluation benchmark (yet), but an initial evaluation guide, and meant to encourage a discussion on what are the \"best\" ways to parse a document.\n\nCheck it out: https://t.co/HsLh6ma9bB\n\nBlog:","url":"https://x.com/jerryjliu0/status/2115516581925315034","createdAt":"2026-10-28T18:50:32Z","metrics":{"views":24472,"likes":581},"lang":"en"},{"id":"2115398174659825862","author":"木内翔大＠SHIFT AI代表「日本をAI先進国に」𝕏","handle":"shota7180","text":"GeminiのチャットからGemini Notebookを直接操作できる新機能。記事を参考に、EC広告データの分析からNotebooKへの保存、資料作成まで試してみました↓ https://t.co/VwAfoTEf3T","url":"https://x.com/shota7180/status/2115398174659825862","createdAt":"2026-10-28T11:00:01Z","metrics":{"views":10246,"likes":60},"lang":"ja"},{"id":"2115405970557821023","author":"Xudong Han","handle":"Xudong07452910","text":"朋友 @code_hiyouga 他们开源了一个新功能：Agent FDE。\n\n人工 FDE 通常又慢又贵。他们想让 Agent 自己学业务规则、搭应用，再靠反馈持续改进，把 RSI 接进整段 FDE 交付。这也是 PenguinHarness 自进化框架一开始的方向。\n\n做企业交付、或者在看 Harness 自进化的，可以先看看他们这条演示。感兴趣的可以直接去试用。","url":"https://x.com/Xudong07452910/status/2115405970557821023","createdAt":"2026-10-28T11:31:00Z","metrics":{"views":2567,"likes":29},"lang":"zh"},{"id":"2115719097157886024","author":"Bitturing","handle":"Bitturing","text":"🚨 发现了全球最大的免费提示词库！\n\n网址是 https://t.co/vIv2l23dMu，已经在 GitHub 上获得超过 173K 星标，还被哈佛和哥伦比亚大学引用过。\n\n兼容 ChatGPT、Claude、Gemini 等几乎所有模型：\n\n→ 支持命令行界面（CLI）或 MCP 服务器方式使用\n→ 可作为 Claude Code 插件安装\n→ 提供 CSV 格式数据，轻松导入脚本\n→ 支持部署私有版本，打上个人品牌和登录系统\n\n最棒的是：所有提示词都是公共领域资源。随意复制、修改、用于项目或商业用途，无需征得任何人同意。\n\n完全免费，代码开源。\n\n赶紧收藏吧 🔖","url":"https://x.com/Bitturing/status/2115719097157886024","createdAt":"2026-10-29T08:15:15Z","metrics":{"views":3028,"likes":26},"lang":"zh"},{"id":"2115604025152561405","author":"TGweb3","handle":"TGweb3333","text":"Grok Bot 实盘跟单47倍收益复盘\n\n真的有种开外挂的错觉！\n\n本金100刀，全程零手动操作，我的 Grok Bot 从8700条市场信号里，只筛选执行了28笔交易，直接把账户干到 4768刀，收益翻整整47倍！\n\n我只做了一件事：连接钱包、设置100刀最大消耗额度，之后全程挂机，完全不用盯盘、不用手动下单。\n\n自动交易机器人：https://t.co/ImtpxJk7gi\n\n这套收益，来自 Grokius 终端内置的 五智能体联动交易系统：\n\n• 侦察端：实时追踪512个聪明钱钱包动向\n\n• 过滤端：严格剔除所有触碰风控红线的标的\n\n• 分析端：深度核验项目基本面与链上数据\n\n• 狙击端：只复刻层层筛选后的优质信号\n\n• 风控端：每笔交易提前挂好止损，回撤时自动收紧风控\n\n完整信号漏斗逻辑\n\n全网8700条交易信号\n→ 首轮淘汰8398个劣质标的\n→ 二轮再筛掉150个风险信号\n→ 最终仅 28笔 入场交易\n\n大批量信号被淘汰的真实原因\n\n• 2519个：团队钱包持仓超5%，存在砸盘风险\n\n• 1931个：流动性低于2.5万美金，极易插针跑路\n\n• 1763个：前十持仓地址筹码集中度超35%\n\n• 1259个：存在批量抱团扫货痕迹，大概率资金盘\n\n• 923个：一小时内涨幅翻倍，追高风险极大\n\n• 150个：聪明钱提前出逃，资金共识崩塌\n\n本轮典型标的复盘\n\n❌ NUBI：直接淘汰，LP未锁仓，风险极高\n❌ HONKER：聪明钱虽有进场，但整体胜率极差，pass\n⚠️ SIB：本轮最大回撤，止损亏损313.7刀\n✅ JEFF：全场最佳交易，单笔盈利1080.8刀\n\n本轮整体战绩\n\n28笔交易，整体胜率64%\n触发10次止损，最大回撤仅19.7%\n\n账户收益曲线：\n100刀 → 297刀 → 946刀 → 1755刀 → 3919刀 → 4768刀\n\n最核心的逻辑：\n即便触发10次亏损，依旧跑出47倍收益。\n因为所有亏损都被严格控制在极小范围，任何垃圾标的，一分钱都不会让它亏损扩大。\n\n市场会用高昂的学费教人风控，而这套机器人，直接帮你提前规避所有大坑。建议收藏吃透这套逻辑！","url":"https://x.com/TGweb3333/status/2115604025152561405","createdAt":"2026-10-29T00:38:00Z","metrics":{"views":12086,"likes":77},"lang":"zh"},{"id":"2115430640979935414","author":"Ren","handle":"Ryrenz","text":"🪞 做品牌设计的宝藏 skill 来了，brand-identity 能让 Claude Code 一次给你出三套完整的品牌识别方案，标志、字体、配色一起配好。\n\n作者拿同样六份需求做过对比：普通模型每个回答平均踩中 4.38 个 AI 默认套路，24 个回答没有一个干净；brand-identity 每套只有 0.28 个，18 套里 13 套一个都没踩。\n\n自己做品牌最怕的就是那种一眼看出是 AI 默认出来的东西：配色、字体、logo 都像在哪见过，缩到网站图标那么小就认不出来。\n\nbrand-identity 把标志、字体和色板当成一个系统，每套方案围绕同一个核心理念一起出，然后逐项量：WCAG 2.2 对比度、色盲模拟、品牌用到的语言有没有缺字、字体许可、logo 在 16 和 32 像素下的渲染。没过的项直接变成方案必须通过的关卡。\n\n选定之后，它会生成一份 8 页的品牌指南 PDF，附上 SVG 和 PNG 标志文件，以及 CSS、Tailwind 等格式的设计令牌，拿去就能接进前端。给它一个现有网址，还能直接在你的站点页面上预览每套方案。商标查询它不管，这一步还得自己做。\n\n品牌这件事，终于不用全靠感觉了。\n\nGitHub：","url":"https://x.com/Ryrenz/status/2115430640979935414","createdAt":"2026-10-28T13:09:02Z","metrics":{"views":2600,"likes":55},"lang":"zh"},{"id":"2115404808140001646","author":"RazeDen","handle":"razeden0","text":"i stopped picking the best ai. i made 6 of them share one brain\n\nopus 5.5 + REA + Jev + Dots + Grok Bot + Obsidian\n\nfor 2 months i used them one at a time. copy from one chat, paste into the next. 14 tabs, 9 hours a day, $0 made\n\nthen i changed one thing: every agent reads and writes to the same memory. nobody waits for me anymore\n\nwho does what:\n\n\u003e grok bot - the hands. a computer in the cloud that never turns off\n\u003e REA - the detective. takes apart paid apps to see how they work\n\u003e opus 5.5 - the brain. plans it and writes the code\n\u003e jev - the judge. can't write a word, only says yes or no in 239 ms\n\u003e dots - the voice. posts, sends and books across 4,000+ apps\n\u003e obsidian - the memory. everything the others learn stays here\n\nfirst night, $10 budget, me asleep:\n\ngrok bot found 1,900 people with the same problem\nREA took apart 14 apps that sell a fix. cheapest $19/mo\n\nopus 5.5 planned 9 screens and wrote the app\njev said no to a $49 domain. we got a $3 one dots posted 3 threads\n\nobsidian saved 1,240 notes so tomorrow starts smarter\n\n7:40 am:\n\n212 signups\n31 paid x $9 = $279\ncost $7.70\n36x back\n\none tab = one smart tool\none brain = a team that works while you sleep\n\nstop asking which ai is the best. ask which 6 should share a memory ↓","url":"https://x.com/razeden0/status/2115404808140001646","createdAt":"2026-10-28T11:26:23Z","metrics":{"views":3354,"likes":58},"lang":"en"},{"id":"2115733314883711082","author":"fujihide","handle":"hfujikawa77","text":"いいかも！","url":"https://x.com/hfujikawa77/status/2115733314883711082","createdAt":"2026-10-29T09:11:45Z","metrics":{"views":197,"likes":3},"lang":"ja"},{"id":"2115683822155223305","author":"爱吃折耳根的Ace","handle":"_zheergen","text":"不用再每月多掏 7.5 刀买 TradingView Copilot 了\n\n有个开源项目，让 Claude Code 直接读你的 K 线、改周期、写 Pine Script，全程一句话，不用截一张图。\n\n它就是 tradingview-mcp，7K Stars、2.9K Forks，MIT 开源，84 个 MCP 工具，覆盖股票、期货、Crypto、外汇。\n\n以前用 AI 分析 TradingView，行情要截图、指标要手动读，Pine Script 写完还得反复复制、编译、修改。\n\n现在通过 Chrome DevTools 连接本地 TradingView 桌面版，AI 不光能看懂图表，还能直接动手操作。\n\n核心能力：\n\n1️⃣ 实时行情：直接读取品种、周期、OHLC、成交量和指标数值，不用截图\n\n2️⃣ 图表操作：切换股票、BTC、期货，修改 K 线周期、图表类型和显示范围\n\n3️⃣ 指标分析：读取 RSI、MACD、EMA、布林带，连 Pine Script 画出的线条和价格区域都能识别\n\n4️⃣ Pine Script 开发：自动编写、注入、编译和调试代码，报错还能继续修改\n\n5️⃣ 图表标注：直接画支撑阻力、趋势线、矩形区域，还能管理价格提醒和 Watchlist\n\n6️⃣ 回放与回测：控制 Bar Replay、模拟开平仓，读取策略收益和交易记录\n\n最实用的是，整个过程可以直接用自然语言完成。\n\n比如告诉 Claude Code：\n\n“打开 BTC 15 分钟 K 线，读取 RSI 和 MACD，写一套 EMA 交叉策略，编译后查看回测结果。”\n\n从读取行情、编写策略到检查结果，都能让 AI 调用工具完成，省掉大量手动操作。\n\n以前让 AI 看盘，更多是让它分析截图。现在连图表操作和策略调试都能交给 AI。\n\n做 TradingView 指标、Pine Script 或 AI 量化研究的，这个值得自己跑一遍。\n\n项目地址，自己拿去跑：\nhttps://t.co/XyHLBKbsz3\n\n你们现在还在用官方 Copilot，还是已经自己接 MCP 了？","url":"https://x.com/_zheergen/status/2115683822155223305","createdAt":"2026-10-29T05:55:05Z","metrics":{"views":1881,"likes":21},"lang":"zh"},{"id":"2115503925822734563","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"待って！！！すごいAI社員できた！！！クライアントも可視化できるやつ！！！おおお！！！ https://t.co/n4nY2eQwhk","url":"https://x.com/ai_ai_ailover/status/2115503925822734563","createdAt":"2026-10-28T18:00:14Z","metrics":{"views":28232,"likes":296},"lang":"ja"},{"id":"2115463575842238974","author":"あきらパパ【生成AI活用エンジニア\u0026３児のパパ】","handle":"akira_papa_IT","text":"【小さなAI「LFM3」は、自分のパソコンで本当に使えるのか？ 盆栽にたとえて、6モデルの成り立ちから成績表・Macでの実測まで確かめる解説動画を作りました〜！動画もそのまま添付してます🌱📢】\n\nLiquid AIが10/27に出した、約20億パラメータ級の小さなAI一家です。\n6つのモデルは、どれも同じ1本の幹（LFM3-1.7B-Base）から枝分かれしています。盆栽みたいに、小さな鉢の中で役割ごとに枝を育ててる感じです🪴\n\nメーカー公表の成績表では、平均49.37で、比較内で最大の9Bモデル（47.24）を上回っています。指示に従う力を見るIFEvalは96.66で表内1位でした。\nただ、専門知識や長い文章の読み取りでは、大きなモデルがしっかり上でした。\n\nCodexに頼んで、自分のMac（M4 Max）で8ビット版を動かしてもらった記録も入れてます。\n初回は中国語がまじったり、文の数の指示を守れなかったり。。笑\n公式の推奨設定に合わせて調整したら、短い質問に日本語で答えるところまで来ました（数問だけのテストです）。\n\nあと、年間売上1,000万ドル以上の会社は商用利用が許可の対象外です。仕事で使うなら、ライセンス原文は要チェックです📝\n\n「6モデルは何がどう違う？」\n「小さいのに、どこまで戦える？」\n「手元のMacで、実際どうなる？」\n\nこのあたりを、公式発表・モデルカード・Macでの実測で7分48秒にまとめてます☺️\nローカルLLM気になってた方、ぜひキャッチアップにどうぞ〜！👇\n\nいいね・シェアしていただけると嬉しいです☺️","url":"https://x.com/akira_papa_IT/status/2115463575842238974","createdAt":"2026-10-28T15:19:54Z","metrics":{"views":891,"likes":6},"lang":"ja"},{"id":"2115611826310254645","author":"Codex研究ラボ","handle":"codexneo4","text":"Codexのトークン消費がキツい人\nDeepSeek Harnessとの組み合わせチート級\n\n会話の履歴を段階的な圧縮を適切に連携させれば\nモデルに送る履歴を軽くすると\n入力トークンの大幅削減を狙える方法👇","url":"https://x.com/codexneo4/status/2115611826310254645","createdAt":"2026-10-29T01:09:00Z","metrics":{"views":3084,"likes":22},"lang":"ja"},{"id":"2115731119526363140","author":"StudioYebisu","handle":"studio_yebisu","text":"ごめん、もしかすると前言撤回で\nMuseWonder × DeepSeek Harnessで運用すると、700~1400Toksの爆速で作業する、DeepSeek V4.1-Flash 1017より14もAA Indexスコアの高いモデルをぶん回せるというハイパーWokerだった可能性出てきた。\n\nキャッシュヒット98%~99%出せる + MuseCodeサブスク限定の貢献者モードを裏コマンドで叩く\n【--contributor-mode on】ことで、Usageが増える。\n\nつまり、無理矢理プロンプト・コード・応答をMetaの学習に使われる許可をオンすることで。\nめちゃくちゃコスパ良くなったかも。\n\nなんか最初に触った時の10分の1ぐらいのコストで使えてる気がする。\nこれマジであんまり検証できてないんで。都市伝説ぐらいで聞いといてくれ。","url":"https://x.com/studio_yebisu/status/2115731119526363140","createdAt":"2026-10-29T09:03:01Z","metrics":{"views":2278,"likes":20},"lang":"ja"},{"id":"2115642290047971537","author":"そう@『n8nの教科書』マイナビ出版 10/22発売","handle":"so_ainsight","text":"今週GitHubで急上昇したAIリポジトリ10選：\n\n1. security-audit-skill\nAIにコードを書かせるツールへ組み込むと、多段階のセキュリティ監査を自動で実行。見つけた問題は一つひとつ裏取りしたうえで、機械が読める形式で返る。\nhttps://t.co/SEDrTtpQo9\n\n2. orca\n複数のコーディングエージェントを1か所でまとめて動かせる作業場。自分の契約プランのまま、デスクトップ・モバイル・リモートで走らせられる。\nhttps://t.co/RgSxPjJEFm\n\n3. graphify\nドキュメントやデータベースの定義、PDF、コードを、検索できる知識グラフに変換。手元だけで解析が完結するのはコード部分で、つながりの根拠も1本ずつたどれる。\nhttps://t.co/cD2VJQAOHA\n\n4. hyperframes\nWebページを作るのと同じ書き方をするだけで、そのまま動画に書き出せる。AIが自動で扱う前提で設計された動画生成の仕組み。\nhttps://t.co/vSJhdJX4df\n\n5. TradingAgents\n複数のAIが役割を分担して、金融トレードの判断を検討するフレームワーク。分析役・判断役などを切り分けて組み合わせられる。\nhttps://t.co/6NhoZixNvo\n\n6. opencode\nオープンソースのコーディングエージェント。公開されているので、自分の環境で手を入れながら動かせる。\nhttps://t.co/OHiXV6hk3L\n\n7. andrej-karpathy-skills\nClaude Codeの挙動を調整する設定ファイル1枚。Andrej Karpathy氏が指摘したAIコーディングのつまずきを踏まえて作られている。\nhttps://t.co/Lg0cXrzOuS\n\n8. claude-seo\nClaude CodeでSEO作業をこなすためのスキル集。検索順位に関わる技術対応やデータ整備など、26個の小さなスキルと19の補助役で構成。\nhttps://t.co/2bXkgv6cpr\n\n9. knowledge-work-plugins\nAnthropic公式の、知識労働者向けプラグイン集。Claude Cowork上で使うことを主な想定にして公開されている。\nhttps://t.co/tlnroaTAUp\n\n10. ai-memory\nAIの開発支援ツールに長期記憶を持たせる仕組み。別々のツール間でも、作業の引き継ぎがしやすくなる。","url":"https://x.com/so_ainsight/status/2115642290047971537","createdAt":"2026-10-29T03:10:03Z","metrics":{"views":6162,"likes":71},"lang":"ja"},{"id":"2115571824042131881","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botの使用量、「道具の読み込み」で消えているかもしれない\nMahaxさんが、Grok Botを「コードで道具を呼ぶ」形に切り替える設定文を公開していた\nhttps://t.co/2Watg0GVvt\n\n元になっているのは、Anthropicの「Code execution with MCP」という記事\n道具の説明を全部先に読ませる代わりに、必要な分だけファイルから読む形にしたら、Anthropicの例では15万トークンが2,000トークンに（98.7%減）\n\nMahaxさんの設定文の流れ\n1. まず測る：読み込んでいる道具の説明が、何トークンあるか記録\n2. 道具をファイルにする：よく使う道具ごとに小さなコードを置き、探す用の一覧を作る\n3. 必要な分だけ開く：毎回まず一覧で探してから\n4. 重いデータはコードで処理：表やログは絞ってから持ってくる\n5. 個人情報はパソコンの中に残す\n6. 2回うまくいった処理はスキルとして保存\n7. 送信・投稿・支払い・削除は、これまで通り本人の確認を待つ\n8. 同じ3つの作業で、切り替え前後を比べる\n9. 結果と、元に戻す方法を報告させる\n\n特に8が良い。「減ったはず」ではなく、測って確かめる","url":"https://x.com/tetumemo/status/2115571824042131881","createdAt":"2026-10-28T22:30:02Z","metrics":{"views":2364,"likes":5},"lang":"ja"},{"id":"2115413335638470709","author":"オープンソース研究所","handle":"opensourcelab9","text":"【実演】\n会議のあとに内容を話しかけるだけで、AIがObsidianのノートに振り分けて、次の会話でも覚えています😳\nClaude Code向けのObsidian Mind、★5,431・MITです。\n\n・/om-dump で会議メモを渡すと、人物ノート・1on1の記録・決定の記録・実績メモへ書き分ける\n・朝の /om-standup で、進行中の案件・やること・最近の変更を読み込んで今日の状況をまとめる\n・Claude Codeは全機能対応、CodexとGemini CLIでも同じノート帳を使える\n・必要なのはObsidian 1.12以上とNode 22以上\n\nつまり\n「前回こう決めた」をAIに毎回説明し直していた時間が、話しかけるたびにノートが育つ時間に変わる。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2115413335638470709","createdAt":"2026-10-28T12:00:16Z","metrics":{"views":1001,"likes":5},"lang":"ja"},{"id":"2115730793595011362","author":"くるしば | ソフトバンクよりReact本発売中","handle":"shiba_program","text":"Claude CodeやCursorに、構成図・ER図・シーケンス図などを読みやすく描かせられるスキル「diagram-design」が良さそう\n\n1枚が1つのHTMLファイルで完結してて、ビルドもJavaScriptも要らない\n\n・座標や幅、間隔はすべて4で割り切れる値にする、と決めてる\n・図形の重なりやはみ出しは、自動でチェックしてる\n・自分のサイトのURLを渡すと、ブランドの色やフォントを読み取って全部の図に反映してくれる\n・https://t.co/oSSPnftOBXで描いた図を読み込んで、描き直すこともできる\n\nなどなど、見た目のルールをかなり厳格に縛ってるから、こっちが細かく指示しなくても整った図になるのが嬉しい\n\n構成図などの資料作成は割とこれ入れておけばOKぐらいのクオリティがある","url":"https://x.com/shiba_program/status/2115730793595011362","createdAt":"2026-10-29T09:01:44Z","metrics":{"views":407,"likes":2},"lang":"ja"},{"id":"2115400167247733123","author":"AI様の下僕","handle":"aigeboku","text":"おーこれはワイお勉強したいぞよ😎","url":"https://x.com/aigeboku/status/2115400167247733123","createdAt":"2026-10-28T11:07:56Z","metrics":{"views":1409,"likes":8},"lang":"ja"},{"id":"2115412082594361476","author":"山ちゃん@AWS好きすぎて滅","handle":"nekorobi_aws","text":"qiitaのアップロード制限に引っかかったのでXで記事書いてみました","url":"https://x.com/nekorobi_aws/status/2115412082594361476","createdAt":"2026-10-28T11:55:17Z","metrics":{"views":15797,"likes":57},"lang":"ja"},{"id":"2115622589540475129","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"Claudeが参入している業界をまとめてみた\n\nざっくり\n・業界的には半分ぐらいには何かしらのソリューションを出している\n・実行領域が残っている https://t.co/2HVWEGASt4","url":"https://x.com/yutosuzuki/status/2115622589540475129","createdAt":"2026-10-29T01:51:46Z","metrics":{"views":27230,"likes":198},"lang":"ja"},{"id":"2115745518340935780","author":"Spike 1%","handle":"SpikeCalls","text":"I PASTED ONE PROMPT INTO GROK BOT AND WENT TO SLEEP\n\n10:58pm, notification: \"your desk is ready, paste one prompt and go to sleep\"\nso I did\n\nit built the whole thing in the chat in 10 seconds\n6 agents trading https://t.co/PgQAJWr0b4 all night, hard rules, no code from me\n\nScout · watches every fresh launch the second it goes live\nFilter · kills anything that fails a single check\nAnalyst · scores what survives, under 0.6 dies\nExecutor · never more than 10% of the stack per trade\nRisk · −8% stop set before the entry, trails winners after +15%\nLogger · writes the reason behind every move\n\nfor the first hours it said no to everything\n11,400 pairs → 11,306 killed → 94 scored → 41 traded\n\nwhat killed them\n3,212 · mint not revoked\n2,584 · LP not locked\n2,147 · top 10 holders over 25%\n1,738 · volume under $40k in the last hour\n1,021 · dev wallet tied to past rugs\n604 · bundled at launch\n\nPUMPKIN looked perfect, killed for mint not revoked\nZAPPY hit the stop at −$2.09, set before entry\nTUFFY caught early on the PumpFun curve, paid +$1,140, best trade of the night\n\n41 trades · 29 green · 12 red · worst loss −$5.25\n$300 → $1,065 → $2,056 → $3,313 → $4,217\n\nthe exact prompt is in the first reply ↓\n\nthis was just the simulated run, tonight it goes live\nbookmark this before you copy another random wallet","url":"https://x.com/SpikeCalls/status/2115745518340935780","createdAt":"2026-10-29T10:00:14Z","metrics":{"views":108,"likes":4},"lang":"en"},{"id":"2115576544290893867","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"待ちに待ったSunoの公式MCP🎉 \nまだβのウェイトリスト制なので早めに登録を（リンクはリプ欄）。\n\nClaude・ChatGPT・Cursorから会話で作曲、ボイスメモから曲に、カバーや延長も。\n\nAIボットでMV作ってる身としては、歌詞→曲→映像が1つの会話で繋がるのがめちゃくちゃ熱い🔥","url":"https://x.com/takamasa045/status/2115576544290893867","createdAt":"2026-10-28T22:48:48Z","metrics":{"views":3413,"likes":39},"lang":"ja"},{"id":"2115614423914357162","author":"Sadao Tokuyama","handle":"tokufxug","text":"ラケットスポーツ「パデル」を1台のカメラでAI解析🎾\n\n🔹選手4人・ラケット・ボールを追跡し、打者を特定\n🔹打者特定精度91%を報告（プロの試合映像で検証）\n🔹MediaPipeで肘・膝・体幹などのフォームを計測\n\n※球速はコート平面上の下限推定値でパデル向け\n開発：Fatih Sönmez氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2115614423914357162","createdAt":"2026-10-29T01:19:19Z","metrics":{"views":1824,"likes":42},"lang":"ja"},{"id":"2115687576401293609","author":"そう@『n8nの教科書』マイナビ出版 10/22発売","handle":"so_ainsight","text":"Claude Duet、使い倒した海外ユーザーの評価がえぐい。\n\nAnthropicのパーソナルエージェントを @AlexFinn が実際に使った感想です。\nhttps://t.co/nMwF1utiIp\n\n挙げていた推しポイントはこの3つ。\n・一番賢い（頭脳は最上位のOpus 5.5）\n・一番おせっかい（放っておいても次の提案が出てくる）\n・一番とっつきやすい（あのClaudeらしい温かさ）\n\nなど、本人が「全エージェントの中で頭ひとつ抜けてる」と言い切った使用レビューです👇","url":"https://x.com/so_ainsight/status/2115687576401293609","createdAt":"2026-10-29T06:10:00Z","metrics":{"views":6958,"likes":52},"lang":"ja"},{"id":"2115572627150631370","author":"GitHub AI Projects Community 🇯🇵","handle":"trendtech33566","text":"MシリーズMacで音声AIを動かしたい人へ👀\n\nmlx-audio、⭐️約8.1千。AppleのMLXを使った音声処理ライブラリ。\n\n何ができるかというと👇\n・読み上げ・文字起こし・音声から音声への変換\n・声のカスタマイズやクローン\n・Apple Siliconに最適化した高速推論\n・Web UIとOpenAI互換APIで使える\n\n「手元のMacで音声AIを作りたい」を後押しするOSS。\n音声アプリを作る個人開発者に刺さります。","url":"https://x.com/trendtech33566/status/2115572627150631370","createdAt":"2026-10-28T22:33:14Z","metrics":{"views":1165,"likes":16},"lang":"ja"},{"id":"2115449438571315234","author":"maestro","handle":"maestrooth","text":"I just built an office for my Grok bots:\n\n• connect your Grok Bot account and your Grok Bots will appear in the office \n• every bot gets its own desk, monitor and laptop \n• approve or decline Grok Bot`s task in one click \n• watch who’s coding, working or sleeping  \n\nstop reading logs. start watching your office  \n\ngive your Grok Bots a place to work\n\nsave now, then read about building a Grok Bot company in the article below ↓","url":"https://x.com/maestrooth/status/2115449438571315234","createdAt":"2026-10-28T14:23:43Z","metrics":{"views":27093,"likes":243},"lang":"en"},{"id":"2115694882342002777","author":"Yohaeni CLI","handle":"OnewKonew","text":"그록봇 사용량 4일만에 막히고 만든 토큰 절약 규칙 8개\n\n1. 대기·폴링·sleep 반복 금지\n2. 같은 작업 두 번 하면 스크립트로 만들고 다음부턴 실행만\n3. 정기 확인은 변화가 있을 때만 봇을 깨우기\n4. API → CLI → 연결 앱 먼저, 브라우저 조작은 마지막\n5. 파일·로그는 전체 말고 tail, grep으로 필요한 부분만\n6. 상태는 md 파일에 저장, 깨어나면 그 파일만 읽기\n7. 내 확인 없는 자동 후속 작업은 최대 2회\n8. 끝나면 첫 줄에 SUCCESS / PARTIAL / BLOCKED로 짧게 보고하고 종료\n\n봇이 일을 덜 하게 만드는 게 아니라, 헛도는 걸 없애는 규칙입니다.","url":"https://x.com/OnewKonew/status/2115694882342002777","createdAt":"2026-10-29T06:39:02Z","metrics":{"views":2574,"likes":52},"lang":"ko"},{"id":"2115468020974043412","author":"nogu","handle":"_nogu66","text":"claude code → codex の呼び出しはできるから、grok bot → codex は比較的簡単にできそう\n\nというか、出来た\n\ncodex exec しているから完璧ではないけど https://t.co/8LUdoPjaZ4","url":"https://x.com/_nogu66/status/2115468020974043412","createdAt":"2026-10-28T15:37:34Z","metrics":{"views":613,"likes":3},"lang":"ja"},{"id":"2115593079503638974","author":"Alex","handle":"Alex_tra_memory","text":"Vela 3.0, now on-device on Apple silicon 📡\n\n vela3-fast (0.4B) runs on Core ML: you name the options or the spans, and it answers in one encoder pass on the Mac's GPU.\n\n ⚡ ~10 ms per decision, ~18 ms per PII pass over a paragraph (M5 Pro)\n 🎯 1,200 / 1,200 decisions idenitical to the base, with identical PII spans\n 📄 Redacted a 20,000-word case file at ~0.5 ms a word: 2,956 / 2,971 planted names, cards, SSNs and addresses caught, nothing leaves the machine\n\n🤗 Weights: https://t.co/WCZa3KB4WS\n🧩 Swift :","url":"https://x.com/Alex_tra_memory/status/2115593079503638974","createdAt":"2026-10-28T23:54:30Z","metrics":{"views":6118,"likes":125},"lang":"en"},{"id":"2115737804391252105","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"Grok、Muse、Dots、Cueなど、複数のパーソナルAIエージェントを使っていますが、今回、新幹線の予約を1日間違えていたことに気づかせてくれたのはGrok Botだけでした。\n\nしかも、何度もアラートを送ってくれていたのに、普通に無視して、昨日の予約だったことが発覚して詰み。（何故か関西弁。）\n\n結局、買い直すことになりましたが、今後は勝手にチケット変更しておくよう依頼しました。","url":"https://x.com/masahirochaen/status/2115737804391252105","createdAt":"2026-10-29T09:29:35Z","metrics":{"views":7076,"likes":39},"lang":"ja"},{"id":"2115386869907345779","author":"CyrilXBT","handle":"cyrilXBT","text":"I used to pay for 6 different apps to manage my notes and ideas.\n\nNow it's 6 commands in one Obsidian vault:\n\n/process replaced my inbox app\n/connect replaced manual linking\n/review replaced my weekly planner\n/ask replaced searching through folders\n/draft replaced starting from a blank page\n/decide replaced pro and con lists\n\nAll running on Opus 5.5.","url":"https://x.com/cyrilXBT/status/2115386869907345779","createdAt":"2026-10-28T10:15:06Z","metrics":{"views":9840,"likes":129},"lang":"en"},{"id":"2115389612160098811","author":"kaito","handle":"cu30rry_","text":"どうやったらレビューや作業を自動化できるかという問いには「検証の質を上げる」という回答しかない\n\n個人的に手軽でやりさえすれば、絶対に検証の質が上がるものを、ここに挙げた\n\n- e2e /create-verification-skill + E2E test\n- pstack /create-formal-verification-skill による形式検証\n- pstack による検証 Skill を活用した Fuzzing\n- CI で deepsec による脆弱性スキャン・fallowによる dead code 検出・React を使っている場合、react-doctor による React Bad Practice の検出（なければ、〇〇-doctorは自作しても良い）\n- 検証・CI合格後、/thermos でバグ・不具合・セキュリティ・コード品質をレビュー（ここに cloudflare/security-audit-skillを追加しても良い）\n\nDevin 使っているなら deepsec の代わりにDevin Security を入れると良いし、予算が許すなら2つを同時に使うのもありだ\n\nこの中の1つだけでも入れれば、それだけでかなり質は上がるよ","url":"https://x.com/cu30rry_/status/2115389612160098811","createdAt":"2026-10-28T10:26:00Z","metrics":{"views":17320,"likes":196},"lang":"ja"},{"id":"2115405924646985924","author":"Tom Dörr","handle":"tom_doerr","text":"Add 42 video editing tools to Claude Code, Cursor, and MCP clients with npx ffmpeg-skill.\n\nhttps://t.co/Mxe09BrYbZ","url":"https://x.com/tom_doerr/status/2115405924646985924","createdAt":"2026-10-28T11:30:49Z","metrics":{"views":79031,"likes":1795},"lang":"en"},{"id":"2115398226388164787","author":"洛克船长","handle":"slashui","text":"上次转的那个架构图火了，好多朋友问能不能做成 Skill。\n\n做出来了！🎉\n\n不只是需求文档：丢给它一个 GitHub 仓库或一篇文章，它也能把里面的内在关系理清楚，画成这种会动的架构图：\n\n🧭 不套模板：先判断是分层系统、流水线还是带循环的流程，再决定怎么画\n\n🎨 颜色有含义：模块按种类上色，连线按数据流向区分\n⚡ 光点沿连线流动，底部 log 实时滚动\"A → B\"\n\n🎬 一句话导出 HTML / 图片 / MP4 / GIF / Mermaid，说\"30 秒视频\"就给你 30 秒\n\n🌏 用中文问出中文图，用英文问出英文图，日文也一样\n\nClaude Code 和 Codex 都能用，一行装好：\nnpx @rokoai/arch-diagram install","url":"https://x.com/slashui/status/2115398226388164787","createdAt":"2026-10-28T11:00:14Z","metrics":{"views":20851,"likes":401},"lang":"zh"},{"id":"2115460158025330892","author":"Beaver","handle":"Beaver_0x","text":"this is getting f*cking dangerous...\n\nREA creator just dropped 20 GitHub repos to build a f*cking reverse engineering studio:\n\n[01] analysis core\n\u003e REA: a single MCP that plugs into everything https://t.co/FroR9REhs6\n\u003e Ghidra: decompiler, free https://t.co/zpZpjM35ek…\n\u003e GhidraMCP: lets your agent drive Ghidra https://t.co/Q0py6LzfRE…\n\u003e ida-pro-mcp: hooks your agent into IDA Pro https://t.co/LGNYwjiaJG…\n\n[02] mobile \u0026 apps\n\u003e jadx: turns Android APKs back into Java https://t.co/ZSmeMtmGoo\n\u003e Apktool: take APKs apart and put them back together https://t.co/gsTw4WxTjC…\n\u003e Frida: hook into apps while they run https://t.co/HodqBm2s8u\n\u003e ILSpy: decompiles .NET https://t.co/7dgZqSuCh0…\n\n[03] binary \u0026 low-level\n\u003e radare2: RE framework that lives in your terminal https://t.co/WXHqHizq0P…\n\u003e x64dbg: debugger for Windows https://t.co/pq1Kjo4tZD\n\u003e ImHex: hex editor with its own pattern language https://t.co/uCOgLoceff\n\u003e angr: symbolic execution engine https://t.co/O8T99j4NPd\n\n[04] network \u0026 runtime\n\u003e mitmproxy: sits in the middle and reads the traffic https://t.co/GNQWddsarF…\n\u003e dnSpy: debug and edit .NET apps https://t.co/xtpzpKA6PG\n\u003e rizin: the radare2 fork https://t.co/MOAXdxbf5h\n\u003e raddebugger: the debugger from Epic Games https://t.co/sEUHVD9Ojd…\n\n[05] rebuild \u0026 verify\n\u003e awesome-ai-reverse-engineering: 122 repos, every one graded https://t.co/BtDM8f2EOL…\n\u003e awesome-reverse-engineering: curated by the guy who made REA https://t.co/5Wg8n96ZgR…\n\u003e REA workflows: ready-made investigation prompts, ship with REA\n\u003e clean-room loop: SPEC.md, oracles and checks until it matches\n\nhow it runs: binary -\u003e REA -\u003e SPEC.md -\u003e rebuild -\u003e oracle -\u003e retry\n\nsave this, point it at any app and watch it explain itself.","url":"https://x.com/Beaver_0x/status/2115460158025330892","createdAt":"2026-10-28T15:06:19Z","metrics":{"views":5834,"likes":106},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-29T19:15:39+09:00","posts":[{"id":"2115484345909584187","author":"Codio","handle":"0xCodio","text":"Anthropic's team shipped a skill that turns one prompt into a complete board design, chips, routing and all\n\nMost hardware tooling stops at the schematic, so the moment a component goes out of stock the whole layout goes back to an engineer for a week.\n\nThe skill carries the design intent instead of the drawing, which means the board is regenerated from requirements every time anything changes:\n\n\u003e Specify: power budget, interfaces, thermal envelope and cost ceiling go in as text\n\u003e Select: parts are chosen against live availability, not a frozen BOM\n\u003e Route: traces solve against impedance and clearance rules, nothing hand-placed\n\u003e Verify: DRC, thermals and signal integrity run before a human sees the file\n\n• What one prompt actually returns\n\u003e A schematic with every part justified by the constraint that picked it\n\u003e Gerbers routed and checked, not a sketch for someone to finish\n\u003e A BOM priced at current stock with a second source per critical part\n\n• Why skills changed this specifically\n\u003e The rules live in the skill, so every board inherits the same house standards\n\u003e A new constraint updates one file and every future design follows it\n\u003e The team stops re-explaining the same requirements to the model each time\n\n• Where a person still has to sign\n\u003e Safety-critical nets get reviewed by an engineer, always\n\u003e Compliance and certification stay human, never assumed\n\u003e Nothing goes to fab without a stamp\n\nA full board regenerates from spec in about eight minutes.\n\nAnd the part that broke my brain:\n\nA part went end-of-life and the old process meant a week of rework.\n\nThe skill re-selected, re-routed and re-priced the whole board over lunch.\n\nSame hardware. One version treats a layout as a drawing to repair.\n\nThe deliverable was never the board file.\n\nIt was the spec that can rebuild it ↓","url":"https://x.com/0xCodio/status/2115484345909584187","createdAt":"2026-10-28T16:42:26Z","metrics":{"views":3472,"likes":111},"lang":"en"},{"id":"2115460158025330892","author":"Beaver","handle":"Beaver_0x","text":"this is getting f*cking dangerous...\n\nREA creator just dropped 20 GitHub repos to build a f*cking reverse engineering studio:\n\n[01] analysis core\n\u003e REA: a single MCP that plugs into everything https://t.co/FroR9REhs6\n\u003e Ghidra: decompiler, free https://t.co/zpZpjM35ek…\n\u003e GhidraMCP: lets your agent drive Ghidra https://t.co/Q0py6LzfRE…\n\u003e ida-pro-mcp: hooks your agent into IDA Pro https://t.co/LGNYwjiaJG…\n\n[02] mobile \u0026 apps\n\u003e jadx: turns Android APKs back into Java https://t.co/ZSmeMtmGoo\n\u003e Apktool: take APKs apart and put them back together https://t.co/gsTw4WxTjC…\n\u003e Frida: hook into apps while they run https://t.co/HodqBm2s8u\n\u003e ILSpy: decompiles .NET https://t.co/7dgZqSuCh0…\n\n[03] binary \u0026 low-level\n\u003e radare2: RE framework that lives in your terminal https://t.co/WXHqHizq0P…\n\u003e x64dbg: debugger for Windows https://t.co/pq1Kjo4tZD\n\u003e ImHex: hex editor with its own pattern language https://t.co/uCOgLoceff\n\u003e angr: symbolic execution engine https://t.co/O8T99j4NPd\n\n[04] network \u0026 runtime\n\u003e mitmproxy: sits in the middle and reads the traffic https://t.co/GNQWddsarF…\n\u003e dnSpy: debug and edit .NET apps https://t.co/xtpzpKA6PG\n\u003e rizin: the radare2 fork https://t.co/MOAXdxbf5h\n\u003e raddebugger: the debugger from Epic Games https://t.co/sEUHVD9Ojd…\n\n[05] rebuild \u0026 verify\n\u003e awesome-ai-reverse-engineering: 122 repos, every one graded https://t.co/BtDM8f2EOL…\n\u003e awesome-reverse-engineering: curated by the guy who made REA https://t.co/5Wg8n96ZgR…\n\u003e REA workflows: ready-made investigation prompts, ship with REA\n\u003e clean-room loop: SPEC.md, oracles and checks until it matches\n\nhow it runs: binary -\u003e REA -\u003e SPEC.md -\u003e rebuild -\u003e oracle -\u003e retry\n\nsave this, point it at any app and watch it explain itself.","url":"https://x.com/Beaver_0x/status/2115460158025330892","createdAt":"2026-10-28T15:06:19Z","metrics":{"views":5834,"likes":106},"lang":"en"},{"id":"2115669961729327530","author":"VIA","handle":"Via00Via","text":"【衝撃】Claudeを作った会社のCEO、プログラミングを学ぶ若者に衝撃の回答。\n\n若者「プログラミングって学ぶべき？」\nCEO「考え直した方がいい」\n\n若者「マジすかwｗ」\nCEO「プログラミングはAIに代替されやすい分野の一つだからね」\n\n若者「人間の仕事なくなるのか...」\nCEO「いや、そうとも限らない」\n\n若者「どういうことです？」\nCEO「AIが仕事の95%をやる」\n\n若者「ほうほう」\nCEO「人間が残り5%を担えばいい」\n\n若者「たった5%？」\nCEO「それだけで生産性が20倍になる可能性がある」\n\n若者「じゃあ何を勉強すれば？」\nCEO「批判的思考だね」\n\n若者「批判的思考？」\nCEO「AIは何でも作れる。でもそれが正しいか判断できる？」\n\n若者「たしかに」\nCEO「AIを使いこなせば賢くなれる。でも使い方を間違えれば逆に能力が落ちる」\n\n若者「怖すぎるｗ」\nCEO「これからは人間を理解して物事を正しく判断できる人が重要になる」\n\nAI時代に必要なのは、\nAIより速く作業する能力じゃない。\n\nAIが出した答えを疑い、判断し、使いこなす能力。\n\nAIを作っている会社のCEOが「考える力を失うな」と警告しているの、めちゃくちゃ考えさせられる。","url":"https://x.com/Via00Via/status/2115669961729327530","createdAt":"2026-10-29T05:00:00Z","metrics":{"views":12209,"likes":48},"lang":"ja"},{"id":"2115481397796413589","author":"あきらパパ【生成AI活用エンジニア\u0026３児のパパ】","handle":"akira_papa_IT","text":"【文字起こし・話者・翻訳を1モデルで。Nemotron 3.5 Transcribe】\n\n🎙️ NVIDIAが、文字起こしから翻訳、音声への質問までを1つのモデルにまとめた「Nemotron 3.5 Transcribe」を公式に発表しました。\n\n■ 1. 1つのモデルでできること\n  ▸ 40言語の文字起こしと、話者ごとのラベル付け\n  ▸ 翻訳、文脈を伝える指示、音声への質問までを1つのチェックポイントに統合\n  ▸ 使い方は、録音に自然言語の指示を添える形です。例：「話者を分けて起こして」「英語へ翻訳して」「決定事項は何でしたか？」\n\n■ 2. 数字の読み方\n  ▸ 全体30BのMoEで、推論時に動くのは約4B（active）です。約4Bは「メモリ4GBで動く」という意味ではない点にご注意ください\n  ▸ 英語のOpen ASRでopen-weight部門1位、平均WER5.33%。いずれも発表時点でのNVIDIAの説明です\n  ▸ 日本語の精度は、この数値からは判断できません。現時点では未検証です\n\n■ 3. 試すならこんな方法も\n  ▸ ご自身の録音で、雑音・専門用語・話者の重なりがある場面を確かめてみる\n  ▸ 指示の書き方を変えて、結果の違いを比べてみる\n\n数字だけで判断せず、手元の音声で確かめてみるのが安心かと思います。\n\n出典：NVIDIA AI公式X／Hugging Faceモデルカード\nhttps://t.co/lpWK92PnBg","url":"https://x.com/akira_papa_IT/status/2115481397796413589","createdAt":"2026-10-28T16:30:43Z","metrics":{"views":998,"likes":13},"lang":"ja"},{"id":"2115449438571315234","author":"maestro","handle":"maestrooth","text":"I just built an office for my Grok bots:\n\n• connect your Grok Bot account and your Grok Bots will appear in the office \n• every bot gets its own desk, monitor and laptop \n• approve or decline Grok Bot`s task in one click \n• watch who’s coding, working or sleeping  \n\nstop reading logs. start watching your office  \n\ngive your Grok Bots a place to work\n\nsave now, then read about building a Grok Bot company in the article below ↓","url":"https://x.com/maestrooth/status/2115449438571315234","createdAt":"2026-10-28T14:23:43Z","metrics":{"views":27093,"likes":243},"lang":"en"},{"id":"2115569044472594544","author":"unusual_whales","handle":"unusual_whales","text":"Anthropic has said that AI can wipe out white collar jobs.\n\nDan Ives has some thoughts otherwise.\n\nFull interview is on our podcast, Unusual Bets.\n\nSearch for it wherever you get your podcasts.","url":"https://x.com/unusual_whales/status/2115569044472594544","createdAt":"2026-10-28T22:19:00Z","metrics":{"views":105327,"likes":66},"lang":"en"},{"id":"2115445878056272285","author":"Ueda","handle":"megyo9","text":"Mixamo形式のFBXモーションとしてダウンロードできるサイトを作りました \n\nサイト👇\nhttps://t.co/cKzuwkFKe4\n\nモーションの数は80個です \n（セクシー系と二人絡みを除外、姿勢が変になったものを除外した結果） \n\n 適用結果が綺麗かどうかはモノによるので、変だったらAIに頼んで修正してもらってください笑","url":"https://x.com/megyo9/status/2115445878056272285","createdAt":"2026-10-28T14:09:35Z","metrics":{"views":8274,"likes":180},"lang":"ja"},{"id":"2115439113264406598","author":"sergio","handle":"sergiorocaa","text":"ANTHROPIC LANZÓ EL EMPLEADO MÁS BARATO DEL MUNDO Y CASI NADIE SE ENTERÓ\n\nSe llama \"Claude for Small Business\".\n\nLo que puede hacer:\n\n→ Gestionar facturas y finanzas\n→ Crear campañas y contenido\n→ Organizar ventas y clientes\n→ Gestionar emails y calendarios\n→ Ejecutar tareas entre apps\n\nCómo funciona:\n\n→ Conectas tus herramientas\n→ Entiende todo tu negocio\n→ Ejecuta flujos automáticamente\n\nFunciona con Microsoft 365, Google Workspace, Canva, QuickBooks y más.\n\nLa idea es simple: en vez de abrir 10 herramientas, hablas con Claude y él hace el trabajo.\n\nDedícale unas horas, lo agradecerás.","url":"https://x.com/sergiorocaa/status/2115439113264406598","createdAt":"2026-10-28T13:42:42Z","metrics":{"views":34754,"likes":513},"lang":"es"},{"id":"2115555247217320196","author":"Aravind Srinivas","handle":"AravSrinivas","text":"Voice is the natural form factor to use computers.","url":"https://x.com/AravSrinivas/status/2115555247217320196","createdAt":"2026-10-28T21:24:10Z","metrics":{"views":18919,"likes":101},"lang":"en"},{"id":"2115562936328712301","author":"えんま","handle":"enma_fire","text":"①「muse」をインストール\n②下のプロンプトを打ち込む\n③3分程度でかんせい！\n④動画を保存\n⑤TikTokに投稿する\n⑥ https://t.co/SXDiGIYExz","url":"https://x.com/enma_fire/status/2115562936328712301","createdAt":"2026-10-28T21:54:43Z","metrics":{"views":21224,"likes":191},"lang":"ja"},{"id":"2115490856685990244","author":"Satya Nadella","handle":"satyanadella","text":"We're redefining the SDLC for the agentic era.\n\nLots of GitHub updates this morning at Universe:\n\n• GitHub Copilot Fusion delivers frontier-level quality, 40% faster and at up to 77% lower cost\n\n• Our unified Copilot harness is now in Foundry, a managed service for building long-running agents that reason, use tools, and get work done\n\n• Copilot Projects gives you an orchestration loop to build with multiple agents across repos\n\nAnd we’re expanding capacity and strengthening GitHub’s architecture to make the home of agentic development more resilient.","url":"https://x.com/satyanadella/status/2115490856685990244","createdAt":"2026-10-28T17:08:18Z","metrics":{"views":177949,"likes":1309},"lang":"en"},{"id":"2115575587448463610","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"Claude for Legal now has ready-made artifacts, including a citation checker\n\nPer Anthropic, Cite check flags misquoted language and unsupported sources and links each output to its source; the company stresses a lawyer still reviews the result.","url":"https://x.com/RoundtableSpace/status/2115575587448463610","createdAt":"2026-10-28T22:45:00Z","metrics":{"views":36921,"likes":41},"lang":"en"},{"id":"2115567700881949046","author":"Lightspeed","handle":"lightspeedvp","text":"Why does so much cybersecurity come out of Israel?\n\nShlomo Kramer traces Israel’s cybersecurity story to units like 8200. Over time, that talent “created its own community,” supported by a “very entrepreneurial spirit.”\n\nFrom Cyber60 with Lightspeed partner @guruchahal https://t.co/RlttYj5kxu","url":"https://x.com/lightspeedvp/status/2115567700881949046","createdAt":"2026-10-28T22:13:39Z","metrics":{"views":1136,"likes":5},"lang":"en"},{"id":"2115621902958170125","author":"Hux","handle":"huxlab","text":"认识一个在 Anthropic 做研发的朋友，年薪 150 万刀。\n\n我问她是怎么把 Claude 调教到极致的\n\n她直接甩给我一段 30 分钟的内部录屏，原本不对外公开。\n\n毫不夸张，这绝对是全网含金量最高的 Claude 实操资料之一。\n\n昨晚看到一半，我后背发凉： \n\n过去两年我写提示词的方式，从底层逻辑上就全错了。\n\n看完后，我提炼出 5 条Anthropic 内部正在用的核心法则：\n\n1. 用 XML 严格隔离语义块：如果你肉眼都分不清数据、业务政策与角色边界，模型只会更混乱，严禁把所有规则揉成一坨大段文本。\n\n2. 定期清理旧模型的“防御性补丁”：新模型遵循能力极强，遗留的历史负向限制会导致过度拟合，反而把上下文已有的正确信息死扣不给。\n\n3. 指令无法凭空赋予模型能力：在 Prompt 里加粗强调“务必算准”没有任何意义，复杂运算必须果断剥离给 Tool Calling 代码执行。\n\n4. 业务权衡必须给全博弈天平的两端：只灌输单向操作成本会让模型极端避险，必须同时给出违约后果与潜在损失，才能激活高智力模型的正确权衡。\n\n5. 用“生成-评估-修复”闭环取代单体巨型 Prompt：复杂强约束任务拆成三步轻量流水线，不仅 Token 消耗与延迟直接腰斩，还能动态兼容运行时软约束。\n\n建议直接收藏，今晚就花半小时看完，认知彻底重置。","url":"https://x.com/huxlab/status/2115621902958170125","createdAt":"2026-10-29T01:49:02Z","metrics":{"views":68654,"likes":870},"lang":"zh"},{"id":"2115562774231155045","author":"Google","handle":"Google","text":"We’re launching a preview of our Connected Apps Platform, giving developers a single place to build and manage apps for Search and the @GeminiApp.\n\nPlus, we’re rolling out a new set of Connected Apps from partners like @Adobe, @Calm, and @onepeloton to make your everyday activities more streamlined.","url":"https://x.com/Google/status/2115562774231155045","createdAt":"2026-10-28T21:54:05Z","metrics":{"views":129337,"likes":701},"lang":"en"},{"id":"2115737924805460022","author":"Daily Dose of Data Science","handle":"DailyDoseOfDS_","text":"Layers of observability in AI systems, explained visually:\n\nIf an LLM app is serving real users, its input and output are not enough to debug it.\n\nConsider a RAG pipeline where a query passes through embedding, retrieval, context assembly, and generation.\n\nEvery operation adds latency, may call a paid API, and can fail while still producing a valid-looking response.\n\nTraces and spans provide visibility.\n\n- A trace records the full path of one request. The Trace column runs from query to response.\n\n- A span records one operation within that trace. The colored boxes are spans.\n\nEach span captures:\n\n\u003e Query span\n\nThe input, timestamp, session identifier, and request metadata.\n\n\u003e Embedding span\n\nThe model, input size, latency, retries, and rate-limit errors.\n\n\u003e Retrieval span\n\nThe retrieved chunks, document IDs, relevance scores, filters, top-k value, and latency. Many RAG failures originate here. Without these fields, there is no evidence that retrieval selected the wrong documents.\n\n\u003e Context span\n\nThe context assembled from retrieved chunks, instructions, and conversation history. This catches truncated documents, duplicated chunks, missing citations, and prompts exceeding the token budget.\n\n\u003e Generation span\n\nThe model, token counts, time to first token, total latency, finish reason, retries, and estimated cost.\n\nWith these details, a bad response can now be traced to retrieval, context assembly, or generation.\n\nTo use this in practice, Opik already implements this observability infrastructure for LLM apps and is open source.\n\nIt captures traces and spans across LLM calls, retrieval steps, and tool executions, with latency, token usage, and cost attached to each operation.\n\nGitHub repo: https://t.co/Nc3NQzo8Hl\n\n(don't forget to star it ⭐)\n\nIn Opik, every operation belonging to one request carries the same Trace ID. If the app processes 1,000 requests, it creates 1,000 traces, each containing its own spans.\n\nThis makes cost analysis more useful. Instead of aggregate spend, teams can identify the model calls, retries, or oversized prompts responsible.\n\nOver time, changes in retrieval scores, embedding latency, or context size become visible before they turn into broader quality problems.\n\nThat said, observability is one of eight areas we would learn for building production LLM systems.\n\nWe covered all eight in the 2026 LLM Engineering Roadmap, with free and open-source resources for each one.\n\nRead it below.","url":"https://x.com/DailyDoseOfDS_/status/2115737924805460022","createdAt":"2026-10-29T09:30:04Z","metrics":{"views":614,"likes":10},"lang":"en"},{"id":"2115446285205651494","author":"Sumanth","handle":"Sumanth_077","text":"RAG for decision models is here!\n\nParallel just launched the Decisions API, which combines live web search with bounded decision-making in a single call.\n\nDecision models like Jev are useful when the output is small and structured: yes/no, one option from a list, a category, or a routing decision.\n\nThe problem is that those decisions are only as good as the context you give them.\n\nIf the answer depends on something that changed recently, or information that only exists on the web, the normal flow becomes retrieval first and decision second.\n\nParallel brings those two steps together.\n\nYou provide the state and the questions you want answered. The API searches the web, grounds the decision in what it finds, and returns the typed answer along with probability, confidence, and sources.\n\nThat makes it much more useful for agent workflows where a decision depends on current external information, research tasks where the model needs to verify something before choosing an outcome, or eval pipelines where the judgment needs grounding from the web.\n\nIt can also answer multiple questions against the same retrieved context in one request, instead of repeating the search for every decision.\n\nSo instead of:\n\nSearch → retrieve context → decision model → structured answer\n\nyou can make the grounded decision directly through one API.\n\nI think this is a pretty natural extension of where decision models are going: bounded outputs are useful, but giving that decision layer access to the live web makes the set of problems it can handle much larger.","url":"https://x.com/Sumanth_077/status/2115446285205651494","createdAt":"2026-10-28T14:11:12Z","metrics":{"views":18676,"likes":445},"lang":"en"},{"id":"2115569296151568582","author":"AI収益化実践ラボ｜会社員×兼業CTO","handle":"ai01_worklab","text":"「AIで作れます」だけだと、相手には完成後の暮らしが見えにくい。\n\nたとえば通販なら、\n「商品を知った人が、そのページから注文できる」\nまで言うと、使い道が見える。\n\n使う技術を説明する前に、相手の仕事がどう変わるかを一文にしたい。","url":"https://x.com/ai01_worklab/status/2115569296151568582","createdAt":"2026-10-28T22:20:00Z","metrics":{"views":125,"likes":6},"lang":"ja"},{"id":"2115568389620199792","author":"Eric Bandholz","handle":"bandholz","text":"Can't wait!","url":"https://x.com/bandholz/status/2115568389620199792","createdAt":"2026-10-28T22:16:24Z","metrics":{"views":361,"likes":6},"lang":"en"},{"id":"2115419930065609182","author":"plusxbt","handle":"plusxbt","text":"I don't understand why everyone isn't using this yet: Claude Code can audit your CLAUDE.md and catch rules meant for older models\n\n1. Update Claude Code to v2.1.283 or newer: claude update\n2. Open your project and run /doctor prompt-audit\n3. It reads CLAUDE.md, AGENTS.md, rules, skills and commands in .claude/ and ~/.claude/\n4. It flags instructions aimed at older models\n5. It finds references to files and commands that don't exist\n6. It catches files that contradict each other\n7. You get a report with proposed edits, nothing changes until you ask Claude to apply them\n\nOne folder only: /doctor prompt-audit .claude/skills/deploy\n\nAnthropic's docs: keep each CLAUDE.md under 200 lines, and if two rules contradict each other, Claude may pick one arbitrarily\n\nFull CLAUDE.md and folder setup in the article below","url":"https://x.com/plusxbt/status/2115419930065609182","createdAt":"2026-10-28T12:26:28Z","metrics":{"views":31968,"likes":365},"lang":"en"},{"id":"2115634093949911506","author":"Elon Musk","handle":"elonmusk","text":"As the prophecy foretold, Starship 42 will be the first tower catch","url":"https://x.com/elonmusk/status/2115634093949911506","createdAt":"2026-10-29T02:37:29Z","metrics":{"views":1186127,"likes":24286},"lang":"en"},{"id":"2115446128330121416","author":"noko","handle":"nokoxyz","text":"Anthropic just shared one of the best tricks for Claude Code.  \n\nThe idea: run Sonnet, Haiku and Opus 5.5 together, each one doing only the job it's best at.\n\nClaude Code has a hidden flag that puts Opus 5.5 on call while Sonnet does the work:\n\nclaude --model sonnet --advisor opus\n\nit's Anthropic's \"advisor strategy\", built right into Claude Code.\n\nhere's the split:\n\n\u003e Sonnet 5.5 runs the session and writes the code\n\u003e Haiku 5.5 subagents read files and docs in parallel\n\u003e Opus 5.5 sits on call and reads the whole transcript when asked\n\u003e you stop paying Opus rates for routine turns\n\nOpus usually steps in at three moments:\n\n\u003e before a plan locks\n\u003e when the same error shows up twice\n\u003e before calling the task done\n\nSonnet builds. Haiku explores. Opus reviews.\n\nAnthropic's own numbers: Sonnet + Opus advisor scored 2.7 points higher on SWE-bench Multilingual than Sonnet alone, at 11.9% lower cost per task.\n\nthe full tree\n\u003e main session: Sonnet 5.5, edits code\n\u003e search: Haiku 5.5, maps the repo\n\u003e grep: Haiku 5.5, finds call sites\n\u003e docs: Haiku 5.5, pulls the API reference\n\u003e advisor: Opus 5.5, reads everything when consulted\n\npaste this into Claude Code ↓\n\n\"Rebuild my Claude Code setup around this tree:\n1. Make Sonnet my main model and set Opus as my advisor (advisorModel: opus).\n2. Create three read-only subagents on Haiku 5.5: search (maps the repo), grep (finds call sites), docs (pulls the API reference).\n3. Add one rule to CLAUDE.md: consult the advisor before locking a plan, after the same error twice, and before calling a task done.\nShow me every change as a diff first. No edits until I say go.\"\n\nwhere it breaks, from my own runs:\n\n\u003e --advisor haiku on a Sonnet session gets refused. it keeps running with no advisor\n\u003e on a one-line question, the single Opus call cost 3x the whole Sonnet part\n\u003e it's still marked experimental and doesn't show up in claude --help\n\nworth it for long refactors and bugs that keep coming back. skip it for quick questions.","url":"https://x.com/nokoxyz/status/2115446128330121416","createdAt":"2026-10-28T14:10:34Z","metrics":{"views":1555,"likes":29},"lang":"en"},{"id":"2115596225793921048","author":"Alex Finn","handle":"AlexFinn","text":"Grok Bot just had its biggest update yet\n\nIt introduces pages and dashboards, 2 things that solve Grok's BIGGEST problem\n\nIn this video I cover how I made 5 dashboards that make Grok Bot SO much nicer to use, including one that has saved me a TON of usage:","url":"https://x.com/AlexFinn/status/2115596225793921048","createdAt":"2026-10-29T00:07:00Z","metrics":{"views":128912,"likes":1927},"lang":"en"},{"id":"2115618341675319417","author":"Marko Vineli","handle":"handsher_NGU","text":"/theme for Claude Code, but every wallpaper is alive 🎨\n\n8 of them, pick yours👇\n\n(fan concept)","url":"https://x.com/handsher_NGU/status/2115618341675319417","createdAt":"2026-10-29T01:34:53Z","metrics":{"views":35305,"likes":716},"lang":"en"},{"id":"2115630316123820508","author":"林拓海｜株式会社honkoma代表","handle":"moriyorihayash1","text":"絶対やった方がいい\n200ドルプランの人は毎月200ドル分のAPIクレジットがもらえる。\nなんじゃこりゃ https://t.co/jWbpwoaLCo","url":"https://x.com/moriyorihayash1/status/2115630316123820508","createdAt":"2026-10-29T02:22:28Z","metrics":{"views":67563,"likes":469},"lang":"ja"},{"id":"2115228876981117009","author":"AGIラボ","handle":"ctgptlb","text":"【速報】Google DeepMind、世界モデル「Genie 4」を発表。\n\n・指示した出来事に、世界と人物がリアルタイムで反応\n・環境音や人物との対話も同時に生成\n・一般には未提供。今は一部テスターのみ、近くGoogle AI Ultra加入者とGemini APIの早期アクセスパートナーへ","url":"https://x.com/ctgptlb/status/2115228876981117009","createdAt":"2026-10-27T23:47:17Z","metrics":{"views":83124,"likes":667},"lang":"ja"},{"id":"2115681075779563724","author":"やぎ（八木 利生太郎）/ Last Scene代表","handle":"yagiryuuu","text":"GitHubがCopilot Fusionを発表していたのでメモ。\n\n何が出たか\n\n・GitHub Copilotの中で、AnthropicとOpenAIのモデルをタスクごとに選んで組み合わせる仕組み\n・候補はClaude Opus 5.5、Claude Sonnet 5.5、GPT-6 Astra、GPT-6 Solなど\n・HighかMaxを選ぶと、1つのモデルで足りないときに複数のモデルを連携させる\n\n性能はトップとほぼ同じ\n\n・Coding Agent Indexで、Claude Code×Opus 5.5（max）と2点差\n・Terminal-Bench 4.0は71点でトップ\n・FrontierCodeは51点で3位（Claude Code×Opus 5.5は56点）\n\n効いてるのはコスト\n\n・1タスク5.59ドル、Claude Code×Opus 5.5（max）は11.42ドルで約半分\n・使ったトークンは1タスク720万で、これもOpus 5.5の約半分\n・料金は裏で使われたモデルの分だけ、11月30日まで30%オフ\n\nまとめ\n\n・どのモデルを使うかを人が選ぶ時代から、ツールが選ぶ流れに\n・性能が2点差でコストが半分なら、日常の開発はFusionに寄せる判断もあり\n・まずはいつものタスクを1つ、Claude Codeと並べてコストと仕上がりを比べる","url":"https://x.com/yagiryuuu/status/2115681075779563724","createdAt":"2026-10-29T05:44:10Z","metrics":{"views":458,"likes":4},"lang":"ja"},{"id":"2115627755085902124","author":"Sadao Tokuyama","handle":"tokufxug","text":"Google AI StudioにXRアプリ生成機能「XR Blocks」登場🥽\n\n🔹Geminiへの指示でWebXRアプリを生成\n🔹手追跡・深度認識・物理演算に対応\n🔹画像や文章から360度見回せる3Dモデルを生成\n\n※PCで試作、Android XR端末で実行可能\n開発：Google\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2115627755085902124","createdAt":"2026-10-29T02:12:17Z","metrics":{"views":709,"likes":5},"lang":"ja"},{"id":"2115472242884641121","author":"mercante","handle":"merccante","text":"My Grok Bot's week looks like a GitHub contribution graph.\n\nAlmost all green.\n\n$2,324 → $11,985.\n\n5.16x in 7 days. 168 hours on the board. 166 green. 2 red.\n\nEvery square is one hour. The darker the green, the more it made that hour.\n\nIt doesn't have a schedule. It trades at 3am on a Wednesday the same way it trades at noon on a Friday:\n\n\u003e SNIPER takes fresh pairs only after LP is burned and mint is revoked\n\u003e MOMENTUM rides volume breakouts with a trailing stop\n\u003e DIP HUNTER buys the wick and sells the bounce\n\u003e WHALE TAIL copies the top wallets the second they move\n\u003e SCALPER farms the range, same small move over and over\n\nThe two red squares:\n\n-\u003e Wed 01:00 · stopped out, loss capped\n-\u003e Sat 09:00 · stopped out, loss capped\n\nBetween them: 79 green hours in a row.\n\nHow the week went:\n\nMon +$820\nTue +$1,010\nWed +$1,190\nThu +$1,370\nFri +$1,560\nSat +$1,750\nSun +$1,961\n\nEvery day beat the one before. Same rules, same trade sizes as a share of the stack. The stack just got bigger, so the hours got greener.\n\nBest hour of the week: Sunday, 23:00. +$92. While I was asleep.\n\n19 trades. 17 green. 2 red.\n\nMy own commit history has never looked this good.\n\nThe whole build is
