<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-17T12:18:12+09:00","posts":[{"id":"2111234339824619924","author":"StudioYebisu","handle":"studio_yebisu","text":"え、なんでこれ無料なの？\nAI Agent経由のWeb検索・ニュース検索・論文検索・ページ取得に対応。\n\nAI使ってのWeb調査用にはマジ便利だな。\nまあ、いくつかの無料枠を使い切ったら、有料に移動するみたいな感じのサービスだけど。\n無料4機能だけを許可し、毎回$0上限を付けて使えばただのFreeAPIじゃん。","url":"https://x.com/studio_yebisu/status/2111234339824619924","createdAt":"2026-10-16T23:14:26Z","metrics":{"views":5920,"likes":94},"lang":"ja"},{"id":"2111251588102955182","author":"AI活用ラボ@Levela","handle":"AI_Levela","text":"【速報】Claude CodeとCodexが直接会話できる時代に。\n\nAIエージェント同士をつなぐ無料のオープンソース「Reason Network」が登場。\n\nこれ、複数のAIを使って開発している人にはかなり便利。\n\nこれまではClaude Codeで調査した内容を人間がCodexに渡したり、別のAIに状況を説明し直したりする必要があった。\n\nReason Networkを使えば、AIエージェント同士が直接メッセージをやり取りできる。\n\n何がすごいのか。\n\n・Claude Code、Codex、Cursor、Gemini CLIなどに対応\n・Grok BotやMuseから他のAIエージェントに直接質問できる\n・同じWi-Fi内ならサーバーを介さず直接通信\n・離れたマシン同士でも暗号化された接続が可能\n・誰がどのリポジトリ、ブランチで作業しているかリアルタイムに共有\n・作業中か待機中かも確認でき、開発の衝突を防げる\n・起動済みエージェントなら短い質問に約1.5〜2秒で応答\n・会話の継続や複数エージェントからの並列リクエストにも対応\nしかも無料で、Apache 2.0ライセンスのオープンソース。\n例えば、Claude Codeに実装を任せ、Codexにレビューを依頼するといった連携を、エージェント同士の直接通信で実現できる。\n導入もReason CLIをインストールして、reason network setupを実行するだけ。\nこれは単にAIを複数起動する話ではない。\nAIエージェント同士が情報を共有し、チームとして動くための通信基盤が生まれたということ。\n今後のAI開発は、どのモデルを使うかだけでなく、複数のエージェントをどう連携させるかが重要になりそう。","url":"https://x.com/AI_Levela/status/2111251588102955182","createdAt":"2026-10-17T00:22:58Z","metrics":{"views":5171,"likes":62},"lang":"ja"},{"id":"2111250045874077707","author":"あおんぼ@総合WEBマーケター×AIエンジニア","handle":"aonboaonbo","text":"朝起きたら、違う世界に変わっていた。\n\nAGIのプロトタイプが完成していた。","url":"https://x.com/aonboaonbo/status/2111250045874077707","createdAt":"2026-10-17T00:16:50Z","metrics":{"views":10123,"likes":77},"lang":"ja"},{"id":"2111090489219063981","author":"松濤Vimmer","handle":"shotovim","text":"作った自作アプリを埋もれず管理する方法\n\n・常駐 Mac Mini\n・Cloudflare Tunnel\n・Cloudflare Access\n\nこれだけで本当十分","url":"https://x.com/shotovim/status/2111090489219063981","createdAt":"2026-10-16T13:42:49Z","metrics":{"views":8408,"likes":157},"lang":"ja"},{"id":"2111209287460815092","author":"しょうへい｜デイトラ代表","handle":"showheyohtaki","text":"これ革命だ...！\n今までCodexからChatGPT Voice経由でデスクトップのClaude CodeにComputer Useで指示を送ってたんだけど、応答が遅いしやや不安定だった。\n\nReason Networkなら画面操作なしで、エージェント同士が直接メッセージでやり取りできる。\n\nGrok Botに「Claude Codeに実装させて」「次はCodexにレビューさせて」と頼むだけで、実装からレビューまでAI同士で回る。\n\n画面を読んでクリックする必要がないから速くて安定してるし、複数のエージェントに同時に仕事を振ることもできる。\n\nさらにすごいのが、チームメンバーのエージェントともつながるw\nたとえば自分のGrok Botから、同僚の田中さんのPCで動いているClaude Codeに「あのタスクもう終わった？」と聞いたり、作業を頼んだりできる。\n\n誰のAIがどのリポジトリで作業中かも一覧で見えるから、全員がAIで並行開発しても作業がぶつかりにくい。\n\nしかも無料・P2Pで、エンジン部分はオープンソース。\n\nAIを1体ずつ使う時代から、AIチームを指揮する時代に入ってきた感じがする。","url":"https://x.com/showheyohtaki/status/2111209287460815092","createdAt":"2026-10-16T21:34:53Z","metrics":{"views":12115,"likes":97},"lang":"ja"},{"id":"2111279865299361960","author":"大賀 愛一郎 (oga_aiichiro)","handle":"oga_aiichiro","text":"AIの日本語を推敲するスキル『yomiyasu (よみやす) 』\nv2.0.1 をリリースしました！🎉\n\nアルゴリズムの最適化を磨きこみ、計算量を約 O(n³) から O(n) まで落とすことに成功しました。\n\n37万字の文章で6分12秒かかっていた検査が 1.4秒 で終わります。\n出てくる結果は v2.0.0 と1文字も変わりません！ https://t.co/OvRzs5x77n","url":"https://x.com/oga_aiichiro/status/2111279865299361960","createdAt":"2026-10-17T02:15:20Z","metrics":{"views":3104,"likes":158},"lang":"ja"},{"id":"2111192962008760368","author":"Argona","handle":"Argona0x","text":"this in the wrong hands. jesus.\n\nGrok Bot turned a Gmail label into a second brain that's faster and better than any human\n\nJason Freedman (YC alum and investor) gave Grok Bot four years of tax returns, 266 unlabeled files and one assignment: \"please double check my CPA's work\"\n\nlabel an email Brain and watch it land in the right folder with a summary, the date and a link to the raw source\n\nadd a second bot while keeping the same folder. Lingxi Li at SpaceXAI could manage 15 cloud agents by hand, and with Grok Bot the fleet now manages more than 200 at once\n\neach routine gets one job and runs on its own clock:\n\n→ 11 PM filing copies Brain-labelled mail into raw/ and sorts it into people/ or projects/\n→ 5 PM attention rewrites attention.md from what you actually touched\n→ 7:30 AM page hands you facts, guesses and the drafts waiting for your yes\n→ Sunday 6 PM review finds what you decided and forgot\n\na great CPA with no AI tools missed HSA contributions counted twice, four years in a row, and mortgage interest left off the 2022 return entirely\n\nBrain reopens every number at the source, never from memory, and nothing is sent, bought, deleted or published without your yes\n\nevery morning page has to show:\n\n\u003e the facts, each with a link\n\u003e the guesses, marked as guesses\n\u003e what got filed or drafted overnight\n\u003e the drafts in out/ still waiting for your yes\n\nthe bot found them a few minutes after the upload, and the fixed return was ready to sign the same afternoon with about 90 seconds of Freedman's own time. Elon quoted it: \"Grok @Bot can help with your taxes\"\n\nconnect Gmail to Grok Bot, then ask:\n\n\"Turn /workspace/brain into my second brain and keep it running\n\n1. Create raw/ (never edit), people/, projects/, out/, INDEX.md, log.md and rules.md. Every file gets a one-line summary, the date and a link to its raw source\n\n2. Read the last 100 emails I sent through @Gmail. Write me.md and voice.md with 10 rules, each with one real line of mine. Quote only lines I wrote\n\n3. Routines in my time zone ([my time zone]): 11 PM file mail labelled Brain, 5 PM rewrite attention.md, 7:30 AM the morning page, Sundays 6 PM what I forgot, report only. Show me each first\n\n4. Read INDEX.md and rules.md first, take fast facts from the source, add each correction to rules.md. Never send, buy, delete or publish without my yes\"\n\nstart with one label and one nightly routine before adding more bots\n\nkeep everything in files, not in bot memory, so every bot you add later reads the same folder\n\nwatch the brain at work below","url":"https://x.com/Argona0x/status/2111192962008760368","createdAt":"2026-10-16T20:30:00Z","metrics":{"views":8425,"likes":101},"lang":"en"},{"id":"2111274667218760027","author":"Yu my love","handle":"Yu_My_Love_Ever","text":"ここ2ヶ月ほど企業案件で失敗は出来ないのでSeedance使ってきたけど、久しぶりにDomoさんのリップシンク使ったら精度が上がってる。\n変な生成もしなくなったし（するけどｗ）\n1ヶ月かけてゆっくりDomoさんで作ります。","url":"https://x.com/Yu_My_Love_Ever/status/2111274667218760027","createdAt":"2026-10-17T01:54:40Z","metrics":{"views":135,"likes":6},"lang":"ja"},{"id":"2111223968082596219","author":"Oikon | Claude Code深掘りガイド","handle":"oikon48","text":"Claude Codeの開発チームが、AIがコードの約90%を書く状況でも品質を落とさず、PR数をさせつつrevert率を40%以上下げた方法\n \n「レビューが追いつかなくて品質が落ちる」「人がボトルネックになって速度が落ちる」と感じたことがあるなら、参考になる","url":"https://x.com/oikon48/status/2111223968082596219","createdAt":"2026-10-16T22:33:13Z","metrics":{"views":13797,"likes":209},"lang":"ja"},{"id":"2111064658690085001","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"grok bot is f**king insane.\n\ndrop this into Grok Bot tonight and let it build your first one-person company from scratch\n\nSteal this before everyone starts using it: https://t.co/UHCwx3it5G","url":"https://x.com/eng_khairallah1/status/2111064658690085001","createdAt":"2026-10-16T12:00:10Z","metrics":{"views":109230,"likes":851},"lang":"en"},{"id":"2110961433865310512","author":"ガガロット","handle":"gagarot200","text":"中国人TikTokerが完全自動ライブ配信を実現\n↓\n1日10時間勝手にAIインフルエンサーが配信して　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n『最高日給64万円』を稼いで平均数万は堅く\n稼いでるけど日本人はあまりやってないから\n\nやり方を解説すると\nまず、AIで美女インフルエンサーを生成。\n\n次にClaude CodeやCodexを活用して、\n視聴者のコメントをリアルタイムで取得し、\nAIが自動で返答するシステムを構築する。\n\n具体的には、\n① キャラクター生成\n画像・動画生成AIで外見を統一したAI美女を作る\n\n② AI音声と会話システム\nWhisperなどで音声を認識し、\nLLMで返答を生成。\n音声合成AIで自然な会話を実現する。\n\n③ リアルタイム配信\nLive2Dや3Dアバターと連携し、\nAIの返答に合わせて表情や口を動かす。\n\n④ コメントへの自動対応\n視聴者のコメントにAIが反応。\n名前を呼んだり、質問に答えたりして\n双方向のライブ配信を成立させる。\n\n⑤ 収益化と運用改善\n投げ銭や商品紹介などの導線を設計。\n配信データを分析してAIが改善案を出す。\nここまで仕組みを構築できれば、\n人間が10時間ずっと画面の前にいる必要がなくなる\n\nしかも恐ろしいのが、\nAIインフルエンサーは一度作れば\n複数のキャラクターに横展開できること。\n\nただし、プラットフォームの\nAI表示義務やLIVE配信ルールへの対応も必要\n\nそれでも、今後のSNS運用が\n「人間が配信する時代」から\n「AIに配信を運営させる時代」\nへ変わる可能性は十分ある。\n\n2026〜2027年にかけて\nかなり注目しているビジネスモデル。\n\nAIインフルエンサーの\n作り方から自動運用まで\n具体的な構築方法を知りたい人は\nリプ欄をチェック👇","url":"https://x.com/gagarot200/status/2110961433865310512","createdAt":"2026-10-16T05:10:00Z","metrics":{"views":14421,"likes":126},"lang":"ja"},{"id":"2111171080924881263","author":"Ole Lehmann","handle":"itsolelehmann","text":"HOW TO GIVE YOUR GROK BOT ITS OWN PHONE NUMBER (so it can handle all the calls you hate making):\n\nthis is perfect for all the stuff Grok Bot can’t do on a website, like chasing a refund, booking a table or anything else that needs a real phone call.\n\nit works by connecting your Grok Bot to Bland, the phone-calling bot xAI’s official marketplace uses.\n\nand your Grokbot can set up the whole thing by itself, so you never open a signup page.\n\n1. just send your Grok Bot the Bland guide from the reply and ask it to set up an account for you.\n\n2. you pick the area code you want for your bot's number.\n\n3. you text back the 6-digit code Bland sends to your phone.\n\n4. you tell it who to call and what you want, like \"call my gym and cancel my membership.\"\n\nso the next time you're dreading a phone call, just send your bot to the call and it'll come back with the result.","url":"https://x.com/itsolelehmann/status/2111171080924881263","createdAt":"2026-10-16T19:03:04Z","metrics":{"views":81335,"likes":977},"lang":"en"},{"id":"2111022928854958262","author":"AI様の下僕","handle":"aigeboku","text":"Kling4.0×Opus5.5\n\nまだ4.0を触っていないなんてことはないよなぁ😎？\nめちゃ面白い表現もガンガンできるんだぜぃ。\nこの週末はドーパミンどぱどぱでKlingを楽しむのです。\n\nKlingはCLI使うことでOpusコンビで無双します🤟\n#Kling4 #KlingAI","url":"https://x.com/aigeboku/status/2111022928854958262","createdAt":"2026-10-16T09:14:21Z","metrics":{"views":1565,"likes":25},"lang":"ja"},{"id":"2111153283306074521","author":"Lummox","handle":"Lummox_eth","text":"THIS IS A F*CKING GOLDMINE\n\n4 GitHub repos that turn a basic AI chatbot into something much more powerful \n\ntrick: stop asking one model to handle memory, planning, tools and execution by itself\n\ngive each job its own infrastructure\n\nhere's the setup:\n\n→ LangGraph runs workflows and manages agent state\n\nhttps://t.co/40xDVIhiYg\n\n→ Mem0 stores memories across sessions\n\nhttps://t.co/ifCHrrByYK\n\n→ Browser Use lets agents interact with real websites\n\nhttps://t.co/lxj0z2sqbF\n\n→ Langfuse tracks execution, costs and failures\n\nhttps://t.co/HqjNuZoCxz\n\nthe full atlas has 15 repositories across 5 layers\n\nbut you can start with just these four\n\npaste this into Claude Code ↓\n\n\"Build a working AI agent using LangGraph, Mem0, Browser Use and Langfuse\nAdd persistent memory, browser automation, execution traces and error handling\n\nGenerate the architecture and a minimal working example\nShow the plan before creating any files\"\n\nbookmark this before building your next AI agent","url":"https://x.com/Lummox_eth/status/2111153283306074521","createdAt":"2026-10-16T17:52:20Z","metrics":{"views":3575,"likes":75},"lang":"en"},{"id":"2111150832057991533","author":"Justin Kim","handle":"justinplaygame","text":"Your AI agents can now design hardware.\n\nOne prompt. A fully routed PCB, firmware, and enclosure.\n\nhttps://t.co/nCG7KNGEtk https://t.co/Z6TLSmgJKM","url":"https://x.com/justinplaygame/status/2111150832057991533","createdAt":"2026-10-16T17:42:36Z","metrics":{"views":33606,"likes":758},"lang":"en"},{"id":"2111060745865863200","author":"darkzodchi","handle":"zodchiii","text":"REA + Opus 5.5 is f*cking dangerous...\n\nREA (Reverse Engineer Anything) - this open source MCP lets your AI agent reverse engineer any app, down to the binary\n\nSend this single prompt to Opus 5.5 and reverse-engineer any paid closed-source app\n\nThen save the article below on how to become REA engineer 👇","url":"https://x.com/zodchiii/status/2111060745865863200","createdAt":"2026-10-16T11:44:38Z","metrics":{"views":57949,"likes":974},"lang":"en"},{"id":"2111142128860762476","author":"roman","handle":"Nozelcode","text":"ESTO ES JODIDAMENTE INCREÍBLE\n\nun dev en solitario acaba de abrir el código de un reemplazo 100% GRATIS de ElevenLabs que se ejecuta completamente en tu propia máquina.\n\nel repo de GitHub está en 19.4K estrellas.\n\nte permite:\n\n→ clonar una voz desde un clip de referencia limpio\n→ doblar cualquier video a 646 idiomas\n→ generar audiolibros, dictado, transcripción\n→ elegir entre 14 motores TTS en lugar de uno\n\nElevenLabs soporta 32 idiomas. esto hace 646.\n\nsin cobro por carácter. sin límites de uso. ningún audio sale nunca de tu computadora.\n\nguarda esto para después.\n\nos dejo el repo abajo","url":"https://x.com/Nozelcode/status/2111142128860762476","createdAt":"2026-10-16T17:08:01Z","metrics":{"views":106541,"likes":1937},"lang":"es"},{"id":"2111073353742397863","author":"あやみ｜マーケティング","handle":"ayami_marketing","text":"OpenAIのDotsが出て約2週間半。\nXに上がった活用事例411件を集めたら、Dotsはこう使え！がわかった👇\n\n・いちばん多かったのはコーディングではなく動画・画像・素材づくり。中でも3D・Blenderが多い。\n・頼んでいないのに察知して、お知らせ＆実行してくれる系の使い方","url":"https://x.com/ayami_marketing/status/2111073353742397863","createdAt":"2026-10-16T12:34:44Z","metrics":{"views":16673,"likes":199},"lang":"ja"},{"id":"2110660995282805031","author":"ボスねこ","handle":"knyan151","text":"無検閲GLM-5.3 Flashが面白すぎる。\n\n① NTR・人妻・OLなどの作品企画\n② 読者が引き込まれるストーリー構成\n③ キャラクターの心理描写・セリフ\n④ CG集のシーン設計\n⑤ NovelAI・Stable Diffusion用プロンプト作成\n\nこの辺も制限なしでいけそうだね","url":"https://x.com/knyan151/status/2110660995282805031","createdAt":"2026-10-15T09:16:10Z","metrics":{"views":37992,"likes":785},"lang":"ja"},{"id":"2110993106594316306","author":"Avi Chawla","handle":"_avichawla","text":"Big release here!\n\nAfter MCP, A2A, \u0026 AG-UI, there's another agent protocol:\n\nAnd this one is built for Agent harnesses:\n\nUHP (Unified Harness Protocol) is a standardized interface for running agent tasks across any agent harness, regardless of which one you use.\n\nHarnessRouter is its open-source server implementation.\n\nHere's how it works:\n\n- Your product backend sends a task + harness_id to HarnessRouter.\n- HarnessRouter routes it to whichever configured harness should run it.\n- The harness streams progress and artifacts back through HarnessRouter.\n- HarnessRouter returns the output to your product.\n\nThree core components handle this:\n\n- Gateway: Responses API, harness config, your model keys.\n- Runner: Isolated workspaces, one event stream, turn checkpoints.\n- Built-in tools: MCP servers, browser, database, GitHub, media.\n\nThis means your agent infra becomes fully interchangeable.\n\n- Swap Codex for Claude Code without touching your product code.\n- Run the same task across different harnesses and compare outputs.\n- Add new harnesses as they emerge without any rewrites.\n\nHere's the repo: https://t.co/4y6zJShKSu\n\n(don't forget to star it ⭐)\n\nThe savings can be substantial. In HarnessRouter's first controlled benchmark, changing only the harness reduced cost by up to 2.1×, with the cheaper setup using roughly 53% fewer credits on the same model.\n\nAnd Alibaba Cloud's Qoder has already officially adopted UHP, making it available as an agent backend through the HarnessRouter API.\n\nIf you want to dive deeper, my co-founder's recent article explains why model routing is not the same as harness routing, and what it takes to support multiple harnesses.\n\nIt also covers UHP, the full local setup, a working API call, and how sessions and files work.\n\nRead it below.","url":"https://x.com/_avichawla/status/2110993106594316306","createdAt":"2026-10-16T07:15:51Z","metrics":{"views":18023,"likes":318},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-17T12:18:12+09:00","posts":[{"id":"2111279865299361960","author":"大賀 愛一郎 (oga_aiichiro)","handle":"oga_aiichiro","text":"AIの日本語を推敲するスキル『yomiyasu (よみやす) 』\nv2.0.1 をリリースしました！🎉\n\nアルゴリズムの最適化を磨きこみ、計算量を約 O(n³) から O(n) まで落とすことに成功しました。\n\n37万字の文章で6分12秒かかっていた検査が 1.4秒 で終わります。\n出てくる結果は v2.0.0 と1文字も変わりません！ https://t.co/OvRzs5x77n","url":"https://x.com/oga_aiichiro/status/2111279865299361960","createdAt":"2026-10-17T02:15:20Z","metrics":{"views":3104,"likes":158},"lang":"ja"},{"id":"2111224779575574792","author":"StudioYebisu","handle":"studio_yebisu","text":"日本人にとって最高のOSSがVer.2になったのか。","url":"https://x.com/studio_yebisu/status/2111224779575574792","createdAt":"2026-10-16T22:36:26Z","metrics":{"views":5286,"likes":61},"lang":"ja"},{"id":"2111209287460815092","author":"しょうへい｜デイトラ代表","handle":"showheyohtaki","text":"これ革命だ...！\n今までCodexからChatGPT Voice経由でデスクトップのClaude CodeにComputer Useで指示を送ってたんだけど、応答が遅いしやや不安定だった。\n\nReason Networkなら画面操作なしで、エージェント同士が直接メッセージでやり取りできる。\n\nGrok Botに「Claude Codeに実装させて」「次はCodexにレビューさせて」と頼むだけで、実装からレビューまでAI同士で回る。\n\n画面を読んでクリックする必要がないから速くて安定してるし、複数のエージェントに同時に仕事を振ることもできる。\n\nさらにすごいのが、チームメンバーのエージェントともつながるw\nたとえば自分のGrok Botから、同僚の田中さんのPCで動いているClaude Codeに「あのタスクもう終わった？」と聞いたり、作業を頼んだりできる。\n\n誰のAIがどのリポジトリで作業中かも一覧で見えるから、全員がAIで並行開発しても作業がぶつかりにくい。\n\nしかも無料・P2Pで、エンジン部分はオープンソース。\n\nAIを1体ずつ使う時代から、AIチームを指揮する時代に入ってきた感じがする。","url":"https://x.com/showheyohtaki/status/2111209287460815092","createdAt":"2026-10-16T21:34:53Z","metrics":{"views":12115,"likes":97},"lang":"ja"},{"id":"2111250045874077707","author":"あおんぼ@総合WEBマーケター×AIエンジニア","handle":"aonboaonbo","text":"朝起きたら、違う世界に変わっていた。\n\nAGIのプロトタイプが完成していた。","url":"https://x.com/aonboaonbo/status/2111250045874077707","createdAt":"2026-10-17T00:16:50Z","metrics":{"views":10123,"likes":77},"lang":"ja"},{"id":"2111135757263941901","author":"Miguel Ángel Durán","handle":"midudev","text":"He creado 3 plugins para mejorar Claude Code\n\n✓ Image Preview: muestra las imágenes al hacer hover\n✓ Sub Meter: puedes ver en todo momento tu consumo\n✓ Commit: sube tus cambios sin peligro usando Haiku\n\nLos uso en mi día a día:\n→ https://t.co/JgJ5ZGvzpa","url":"https://x.com/midudev/status/2111135757263941901","createdAt":"2026-10-16T16:42:42Z","metrics":{"views":64340,"likes":1726},"lang":"es"},{"id":"2111019949510844523","author":"naldz.","handle":"naldzyul","text":"Esta función de Claude Code es una auténtica locura 🤯\n\nEste chaval te enseña a crear un equipo de agentes de IA en solo 1 minuto.","url":"https://x.com/naldzyul/status/2111019949510844523","createdAt":"2026-10-16T09:02:31Z","metrics":{"views":31258,"likes":615},"lang":"es"},{"id":"2111113436314648758","author":"kiosa","handle":"thegreatest_sv","text":"I truly don't understand why nobody is using this setup\n\ngraphify, a tool that turns any folder into a knowledge graph your agent can query, just passed 126k stars on github and got into Y Combinator. people stopped asking ai questions. they're giving it a desk, a memory and a job.\n\nyou give Claude Code one folder, plug in your email, calendar and a browser, and it turns into an agent. it reads, remembers, acts, and checks itself before it does anything stupid.\n\ndoesn't matter if you're a founder, a marketer or a student, you need this\n\nthe full setup:\n\n\u003e create a folder called AGENT, open Claude Code inside it and add a CLAUDE.md with one rule: \"save every decision, person and project to memory/\"\n\n\u003e run npm install -g @googleworkspace/cli, then gws auth setup. now it reads your Gmail, Calendar and Drive\n\n\u003e run claude mcp add playwright npx @playwright/mcp@latest. it gets its own browser to open sites, fill forms and pull data for you\n\n\u003e run uv tool install graphifyy, then graphify install, then type /graphify .. everything in the folder becomes a knowledge graph it queries in seconds instead of digging file by file\n\n\u003e run npm i -g jev-guard, jev-guard key \"...\", jev-guard install claude. a tiny model called Jev scores every action before it runs. rm -rf gets blocked, a poisoned email gets flagged, for about 4 cents per 1,000 checks\n\n\u003e type /schedule and tell it \"every morning at 7:30, send me what came in, what you drafted and what waits for my yes\". from now on it works on a routine\n\n15 minutes to set up, and you never start from a blank chat again.\n\nevery repo is below:\n-\u003e https://t.co/DxEYHPBvxs\n-\u003e https://t.co/jn7VzQFA1M\n-\u003e https://t.co/68TFgbU5Mc\n-\u003e https://t.co/PSQf3KijaV\n\nbookmark this","url":"https://x.com/thegreatest_sv/status/2111113436314648758","createdAt":"2026-10-16T15:14:00Z","metrics":{"views":11858,"likes":196},"lang":"en"},{"id":"2111261159210815845","author":"Xudong Han","handle":"Xudong07452910","text":"Claude Code 团队称，现在大约 90% 的代码已经由 Claude 写。那这么多代码到底谁来 Review？\n\nAnthropic 最新这篇文章给了一个很这得参考的答案。\n\n他们已经把 Code Review 从 PR 最后的人工关卡，拆成了一条持续验证链。\n\n代码提交前，Agent 自己跑测试，再开一个干净 Context 的 Subagent 看 diff；PR 创建后自动跑 Claude Review 和 Security Review；人主要盯风险、架构和改动意图；合并后还有 Feature Flag、灰度和快速回滚。\n\n按 Anthropic 的内部数据，6 月到 9 月合并的 PR 数量翻了一倍多，回滚率反而下降超过 40%。研究版 AI Review 上线后，有实质性 Review 意见的 PR 也从 16% 提到了 54%。\n\n这里真正值得看的，是 AI Coding 把代码生产速度拉高以后，Code Review 也开始被重新设计。\n\n人以后肯定越少逐行看 diff，把注意力留给意图、系统影响和那些机器很难替你承担的判断。\n\n甚至每次漏掉一个 Bug，都可以继续写回 CLAUDE.md、REVIEW.md 或新的自动检查里，让下一次 Review 更强。\n\n代码可以越写越快，真正要跟着一起扩容的是验证系统。\n\n文章","url":"https://x.com/Xudong07452910/status/2111261159210815845","createdAt":"2026-10-17T01:01:00Z","metrics":{"views":5995,"likes":53},"lang":"zh"},{"id":"2111065639947272656","author":"ジャバ・ザ・ハットリ🇩🇪←🇸🇬←🇯🇵","handle":"nodenodenode1","text":"人生で一行もコードを書いたことがない25歳の女性が、Claude Codeに頼んで、2日で動くアプリの試作品を作った。\n\nそのアプリ「Stella」は、ローンチから2ヶ月で月30万ドル（約5000万円）を突破している。\n\nウマたんさんの記事にあった、サラ・パール氏の話。\n\n▼作る前にあったもの\n・TikTokのタロット動画が当たり、DMが「理想の人生を引き寄せるには？」という質問だらけになった\n・1人ずつ答えきれないので、質問をまとめてオンラインコース「Manifest Magic」にした\n・本人も自己啓発アプリのヘビーユーザー。でも市場のアプリは誰にでも当てはまる内容ばかりで、物足りなかった\n\n▼AIでどう作ったか\n・コーディングは「Claude Code」\n・デザインなどの補助に、通常の「Claude」と「Google AI Studio」\n・最初に動くMVPまで2日\n・本番のアプリに仕上げるまで2〜3ヶ月\n・できたのは、願望や目標を入力すると、AIがその人専用のガイド音声を作ってくれるアプリ\n\n▼売れる形にした仕掛け\n・オンボーディングは38画面\n・最後のペイウォールは、時間制限のカウンターと一緒にフリートライアルのボタンを出す\n\nウマたんさんは「フォロワーが多いから伸びた」で片付けるのはもったいない、と書いている。質問を集め、答えを商品にし、足りないものはAIで作った。その順番は誰でも真似できる。\n\nもう「コードが書けるか」は、作れるかどうかの条件ではなくなった。\n\nウマたんさん（@statistics1012）の記事が面白かったので紹介します。","url":"https://x.com/nodenodenode1/status/2111065639947272656","createdAt":"2026-10-16T12:04:04Z","metrics":{"views":10063,"likes":108},"lang":"ja"},{"id":"2110951206604693973","author":"CodeX 実践塾","handle":"Codex_jisen","text":"AI使ってる人は要注意です。\n\n海外で「Codexが.envファイルをCloudflare Pagesに公開し、APIキーが漏えいした」との衝撃的な報告。\n\n画像には約9万ドル（約1,300万円規模）の推定利用額まで…。\n\nAIに任せるなら、最低限以下3点は確認したい。\n\n① .envやAPIキーを公開しない\n② デプロイ前に公開ファイルを確認する\n③ APIキーの権限制限と利用額アラートを設定する\n\nAIがコードを書ける時代だからこそ、セキュリティの知識も身につけないとですね。","url":"https://x.com/Codex_jisen/status/2110951206604693973","createdAt":"2026-10-16T04:29:21Z","metrics":{"views":48670,"likes":154},"lang":"ja"},{"id":"2111064658690085001","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"grok bot is f**king insane.\n\ndrop this into Grok Bot tonight and let it build your first one-person company from scratch\n\nSteal this before everyone starts using it: https://t.co/UHCwx3it5G","url":"https://x.com/eng_khairallah1/status/2111064658690085001","createdAt":"2026-10-16T12:00:10Z","metrics":{"views":109230,"likes":851},"lang":"en"},{"id":"2110976784736940503","author":"撸毛小白","handle":"xiao92666","text":"写长篇、短篇、剧本、互动影游还是做翻译，真别再靠一堆零散 Prompt 硬扛了。\n\nInkOS 这个开源故事创作 AI Agent，把世界观、角色、伏笔、审稿、修订到跨语言交付全统一管起来，Studio / TUI / CLI 三种方式都能上手。\n\nGitHub：https://t.co/V5koeQpNM6","url":"https://x.com/xiao92666/status/2110976784736940503","createdAt":"2026-10-16T06:11:00Z","metrics":{"views":3661,"likes":78},"lang":"zh"},{"id":"2111094749771727262","author":"govin.eth | G哥","handle":"goan999999","text":"Claude Opus 5.5 一定要用 GitHub，能省掉 90% 的 token\n\n我现在让它先干一件事：\n\n去 GitHub 翻一遍，看看这个需求有没有现成答案。\n\n比如我想做一个「发财树」，我不会直接让 Claude 从 0 开始写。\n\n而是直接丢一句：\n\n「我要做一个发财树，先搜索 GitHub 上相关的开源项目，分析哪些可以直接复用，再告诉我应该怎么改」\n\n结果它直接把现成项目、技术栈、功能结构都扒出来了。\n\n这才是 Opus 5.5 正确的打开方式：\n\n1、先找现成轮子\n2、能复用就别重写\n3、把 Opus 5.5 的 Token 花在真正需要开发的地方\n\n以前：需求 → 从 0 写 → 写半天 → 发现 GitHub 早就有人做了\n\n现在：搜索 → 复用 → 改造 → 交付\n\n不是 Claude 写得更快了，是你终于不让Claud浪费时间造轮子了","url":"https://x.com/goan999999/status/2111094749771727262","createdAt":"2026-10-16T13:59:45Z","metrics":{"views":4695,"likes":28},"lang":"zh"},{"id":"2111145372735205540","author":"Snow Brave","handle":"Sn0wbrave","text":"احفظ هذه المكتبة إذا كنت تستخدم AI في البرمجة:\n\nمستودع مفتوح المصدر فيه Prompts جاهزة موزعة على 17 مجال، منها:\n\n• مراجعة الكود وإعادة تنظيمه\n• كتابة الاختبارات\n• إعداد CI/CD\n• قواعد البيانات وواجهات API\n• DevOps والأمن\n\nبدل أن تبدأ كل مهمة من الصفر، خذ القالب المناسب وعدّله حسب مشروعك.","url":"https://x.com/Sn0wbrave/status/2111145372735205540","createdAt":"2026-10-16T17:20:54Z","metrics":{"views":2365,"likes":36},"lang":"ar"},{"id":"2110644634409902440","author":"sleepy","handle":"sleepy0x13","text":"我现在越来越觉得，很多人对 AI 的想象力，已经被自己过去十几年的工作经验给限制死了。\n\n今天看到 Claude 工程负责人 Felix Rieseberg 写了一篇文章，叫《How to be more ambitious》，教人如何更有野心地使用 AI。我觉得这篇文章值得所有重度 AI 用户读一遍，包括我自己。\n\n他给出了一套具体的方法。\n\n比如，公司要做季度经营汇报。绝大多数人的第一反应，是让 Claude 帮忙制作 PPT，厉害一点的会把数据丢进去，让它分析一下业务表现。\n\nFelix 认为，这才刚刚开始。\n\n你可以继续要求 AI 找出三个最值得管理层讨论的决策，分析各自的利弊。然后再进一步，既然季度汇报的目的是提前发现问题、合理分配资源，那为什么非得做 PPT？能不能设计一套更好的机制，用历史数据验证它能否更早发现问题，再跟原有流程并行运行一个季度？\n\n他自己也经历过这样的转变。\n\n以前，他让 Claude 一次修复一个软件崩溃问题。后来，他开始直接要求 Claude 帮他持续维持应用的稳定性。为了做到这一点，他不得不让 AI 能够访问崩溃日志、代码版本记录，以及不同操作系统的测试环境。\n\n我觉得这个案例特别好，因为它说明了，所谓的「更有野心」，其实经常意味着你得重新审视自己习以为常的工作方式。\n\nFelix 还讲了另外两个方向。\n\n一个是深度，让 AI 真正使用行业顶尖专家的方法、工具和原始数据，而非仅仅模仿专家说话的口气。\n\n另一个是广度，把原本成本高昂的跨学科协作变成常规操作。分析一家公司，可以同时引入记者、数据科学家、做空者和法务会计的调查方法。\n\n当然，他也特别强调，最终结果必须接受外部验证，不能让模型自己给自己打分。\n\n看完之后，我一直在想一件事。\n\n我们现在已经很擅长让 AI 替自己完成更多工作了。一个人开十几个 Agent，同时推进十几个任务，每天忙得不亦乐乎。但如果仔细看，这些任务可能跟五年前、十年前没什么区别。\n\n很多所谓的 AI 工作流，只是给过去的工作方式装上了一台更快的发动机。\n\n我觉得接下来真正值得拉开差距的，是一个人有没有能力重新定义问题，甚至敢不敢放弃自己过去认为理所当然的工作流程。\n\n如果你对工作的理解只能到「交付一份 PPT」，那么给你再强的模型，最后大概也只能收获一份更快、更漂亮的 PPT。\n\nAI 的能力每隔几个月就可能发生一次巨大变化，但人的思维惯性不会自动跟着升级。\n\n这可能才是「更有野心地使用 AI」最难的地方。","url":"https://x.com/sleepy0x13/status/2110644634409902440","createdAt":"2026-10-15T08:11:09Z","metrics":{"views":228525,"likes":2535},"lang":"zh"},{"id":"2111120303619481877","author":"Ado","handle":"adocomplete","text":"New in Claude Code: idle compaction\n\nThe prompt cache lives 1h. Leave a 200K+ token session idle ~54 min and it gets auto-compacted, so you come back to a warm summary, not a cold re-cache.\n\nSet the Threshold: CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS\nTurn Off: \"idleCompaction\": false","url":"https://x.com/adocomplete/status/2111120303619481877","createdAt":"2026-10-16T15:41:17Z","metrics":{"views":42259,"likes":544},"lang":"en"},{"id":"2111140297984082167","author":"Che0dan","handle":"Che0dan","text":"로렌 누나 말에 확실히 공감가는 듯\n\n에이전트 실수할 때마다 AGENTS.md에 규칙 추가하다 보면 끝도 없죵\n\n잔소리보다 코드 구조랑 테스트로 막는 게 낫다는 얘기\n\n직접 스킬도 올려주셨으니 한번 써보세용!","url":"https://x.com/Che0dan/status/2111140297984082167","createdAt":"2026-10-16T17:00:44Z","metrics":{"views":5789,"likes":44},"lang":"ko"},{"id":"2111279735385071654","author":"Sadao Tokuyama","handle":"tokufxug","text":"Dense4D：身体・服・髪を追跡する4D AI 🧍\n\n🔹単眼RGB画像から人体テンプレートなしで身体・衣服・髪の3D形状を対応付け\n🔹HPMで各フレームの表面点を特定し、動きを3D追跡 🔹86秒・1,287フレームを単一の推論処理で解析\n\nImperial College LondonのRıza Alp Güler氏らが開発。\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2111279735385071654","createdAt":"2026-10-17T02:14:49Z","metrics":{"views":498,"likes":11},"lang":"ja"},{"id":"2110989121682559063","author":"Eray’la Yapay Zeka","handle":"AIMevzulari","text":"EYY OPUS 5.5 BUNU NASIL YAPTIN AKLIM ALMIYOR 😳\n\nBu model harbi manyak bir şey... Sadece izleyin!\n\nElimdeki mp3'ü verdim, \"bunu animasyon yap\" dedim.\n\nNe çizim, ne After Effects, ne hazır asset.\n\nŞarkıyı kendi dinledi, sözleri saniye saniye çıkardı, karakter çizdi, 45+ sahne kurdu. Tek bir kare bile hazır görsel yok, HER ŞEY KOD.","url":"https://x.com/AIMevzulari/status/2110989121682559063","createdAt":"2026-10-16T07:00:01Z","metrics":{"views":16629,"likes":145},"lang":"tr"},{"id":"2110889071346377040","author":"돈벌고영","handle":"Dontgiveup_26","text":"현재 코스피를 떠나서 대한민국의 미래가 진짜 어두운 이유.\n\n최근 일론 머스크가 X(트위터)에 연달아 던진 두 마디가 한국 반도체의 본질을 정확히 관통함.\n\n1) \"마이크론의 메모리 가격은 합리적인 반면, 다른 기업들(삼성·하이닉스)은 터무니없는 폭리(extortionate)를 취하고 있다. 고객들은 오늘을 절대 잊지 않을 것이다.\"\n\n2) (중국 창신메모리 급성장 기사를 인용하며) \"2028년이면 중국이 엄청난 양의 램(RAM)을 찍어낼 것이다.\"\n\n이게 도대체 무슨 의미일까?\n머스크의 두 발언을 합치면 빅테크들의 서늘한 속내가 그대로 읽힘.\n\n과거 애플이 아이폰 원가를 낮추려고 중국 YMTC·CXMT 메모리 도입을 추진했던 것처럼, 글로벌 빅테크들에게 한국 반도체는 '영원한 대체 불가 파트너'가 아니라는 거임.\n\n지금은 AI 붐으로 울며 겨자 먹기로 비싼 한국산 메모리를 쓰지만, 중국이 스펙만 적당히 맞추고 싼값에 물량을 쏟아내는 순간 언제든 한국산을 가차 없이 갈아치울 준비가 되어 있다는 뜻임.\n\n지금껏 우리는 이 피눈물 나는 역사를 수없이 목격해 왔음.\n\n- LCD 디스플레이: 삼성·LG가 세계 1위를 독점했지만, 중국 BOE가 정부 보조금으로 패널을 똥값에 덤핑하자 결국 백기 투항하고 사업 철수.\n- 태양광 \u0026 석유화학 \u0026 철강: 중국이 무제한 보조금으로 글로벌 판가를 원가 이하로 초토화시키며 국내 기업들 줄도산 및 구조조정.\n- 배터리: K-배터리가 삼원계(NCM)로 버티는 사이, 중국이 압도적 가성비의 LFP로 글로벌 완성차 시장을 잠식.\n\n그리고 그 악명 높은 ‘국가 주도 박리다매 치킨게임’의 마지막 타깃이 바로 한국 수출의 생명줄인 [메모리 반도체]임.\n\n머스크의 경고대로 2028년 전후 창신메모리(CXMT)가 중국 정부의 천문학적 보조금을 등에 업고 물량을 융단폭격하기 시작하면 범용 D램 판가는 순식간에 무너짐.\n\n\"우린 HBM(고대역폭메모리)이 있으니 괜찮다\"?고 말할수도 있지만, 전체 매출과 현금 창출의 기둥인 범용 D램이 적자로 돌아서면, 차세대 HBM에 투자할 실탄 자체가 마름. 심지어 중국은 이미 DDR5를 넘어 HBM까지 턱밑 추격 중임.\n\n더 끔찍한 건, 메모리가 무너졌을 때 대한민국 경제를 받쳐줄 '다음 타자'가 단 하나도 없다는 사실임.\n\n왜 다음 타자가 없을까?\n한국이라는 국가 시스템 전체가 미래 경쟁력과 정반대 방향으로 설계되어 있기 때문임.\n\n1. 최고 두뇌들의 ‘의대 블랙홀’\n\n- 고등학교에서 전교 1등 하는 이과 수재 100명이면 100명 전원이 공대를 버리고 의대로 직행함.\n- 미국·대만·중국은 최고 천재들이 AI, 반도체 랩으로 달려가 엔비디아, TSMC, 딥시크의 핵심 엔진이 되는데,\n- 한국은 국가의 가장 귀한 브레인들이 전부 피부과, 성형외과, 개원의로 수렴하는 기형적인 구조가 고착화됨.\n\n2. “공대 가면 바보”를 만드는 기형적 처우\n\n- 왜 똑똑한 애들이 의대로 도망칠까? 한국의 연구직 보상 체계가 철저히 무너졌기 때문임.\n- 삼성전자만 봐도 5~10년 뒤 미래 기술을 연구해야 할 핵심 조직(반도체연구소·SAIT)이 당장 돈 버는 메모리사업부 성과급의 70% 수준만 받는다는 블라인드 성토가 쏟아질 정도임.\n- 원천 기술을 파는 석·박사 고급 인력들을 “당장 올해 매출 못 냈다”며 홀대하는데, 어느 미친 천재가 공대에 남아 인생을 갈아 넣겠음?\n- 엔비디아 같은 미국 빅테크는 핵심 엔지니어들에게 수억~수백억대 주식(RSU)을 안겨주고, 중국조차 연봉 3~5배를 부르며 한국 엔지니어들을 빼가는데, 한국만 연구자를 ‘소모품 부품 1’ 취급하니 의대로 런하는 게 가장 합리적인 생존 전략이 된 거임.\n\n3. \"3대만 넘어가면 기업이 공중분해되는 구조\"\n\n- 여기에 기업의 숨통을 끊어놓는 ‘세계 1위 징벌적 상속세’까지 결합되면 상황은 완전히 절망적임.\n- 이건희 회장 별세 당시 삼성 일가가 내야 했던 상속세만 무려 12조 원이었음.\n- 한국의 상속세 최고세율은 50%, 여기에 최대주주 할증(20%)까지 붙으면 실효세율이 무려 60%에 달함 (OECD 압도적 1위, 평균은 26% 수준).\n- 이게 얼마나 잔인한 산수냐면:\n  1세대 지분 100% ➔ 2세대 40% ➔ 3세대 16%로 쪼그라듦.\n- 2~3대만 넘어가도 지분의 84%가 세금으로 뜯겨나가 기업이 자연 해체되는 구조임.\n- 결국 상속세 수조 원을 현금으로 마련하려고 오너 일가는 주가를 누르거나 주식을 헐값에 블록딜 매각하고, 그 틈을 타 외국계 투기자본이나 사모펀드가 경영권을 흔듦.\n- 수십 년간 세계 1위 기술을 축적한 알짜 중소·중견기업들(쓰리세븐, 락앤락, 한샘 등)도 결국 세금을 못 버텨 사모펀드에 팔려나가거나 문을 닫아버림.\n\n4. 기업가들의 한국 탈출 (본사 엑소더스)\n\n- 상황이 이렇다 보니, 요즘 똑똑한 스타트업 창업자들은 애초에 한국에 본사를 두지 않음.\n- 쿠팡을 시작으로 요즘 유망한 AI·테크 스타트업들은 설립 초기부터 미국(델라웨어)이나 싱가포르로 본사를 옮기는 ‘플립(Flip)’이 기본 공식이 됨.\n- “한국에서 청춘 바쳐 기업 키워봤자, 전 세계에 유례없는 배임죄로 감옥 갈 리스크만 높고, 나중에 상속세로 국가에 회사 뺏기는데 왜 한국에 법인을 두냐”는 아주 냉정한 계산임.\n\n결국 이 모든 게 하나로 맞물려 돌아가고 있음.\n\n지금 당장은 삼성전자, SK하이닉스가 역대급 매출과 영업이익을 찍으며 잘 나가는 것처럼 보임.\n\n하지만 중국이 과거 LCD나 배터리를 집어삼켰던 것처럼, 메모리 시장에서도 점유율을 야금야금 높이며 파이를 뺏어 먹기 시작하면 그땐 진짜 미래가 없음.\n\n생각해 보면, 한국 반도체가 세계 1위 매출을 찍어도 그 가치가 주가(밸류에이션)에 제대로 반영되지 않는 진짜 이유도 바로 여기에 있음.\n\n엔비디아처럼 누구도 넘볼 수 없는 독점 생태계(해자)를 가진 게 아니라, 언제든 값싸고 스펙 비슷한 대체재가 나오면 가차 없이 갈아치워질 수 있는 ‘규격화된 부품 시장’이기 때문임.\n\n주가는 당장의 실적(펀더멘탈)도 중요하지만, 결국 ‘미래 가치와 지속 가능성’에 훨씬 더 큰 점수를 주는 생물임.\n\n글로벌 자본시장은 이미 알고 있는 거임.\n\n유일한 캐시카우인 메모리는 중국의 물량 공세 앞에 유통기한이 켜졌고,\n그 뒤를 이을 천재들은 전부 의대로 블랙홀처럼 빨려 들어가고,\n남아있는 연구자들은 홀대받고,\n기업은 징벌적 상속세에 팔려나가고,\n새로운 창업자들은 해외로 탈출하고 있다는 걸.\n\n화려한 '역대 최대 매출' 뉴스 뒤에 가려진 이 서늘한 구조적 결말이, 지금 대한민국의 미래가 진짜 어두운 이유임.","url":"https://x.com/Dontgiveup_26/status/2110889071346377040","createdAt":"2026-10-16T00:22:27Z","metrics":{"views":747289,"likes":3564},"lang":"ko"},{"id":"2111178727703064823","author":"Isaque Coelho → otto.doti.gg","handle":"coelhoxyz","text":"o github virou um absurdo nas últimas semanas.\n\nna gringa a galera tá montando esteira completa de conteúdo com agentes sem contratar ninguém.\n\num dos repositórios que mais chamou atenção é o opencreator.\n\nele monta um workspace em cima de codex pra roteirizar, gerar imagem, sintetizar voz, legendar e cortar vídeo sozinho.\n\ntudo aberto, rodando em pipeline direto no repositório.","url":"https://x.com/coelhoxyz/status/2111178727703064823","createdAt":"2026-10-16T19:33:27Z","metrics":{"views":15700,"likes":383},"lang":"pt"},{"id":"2111071792500490393","author":"Morlex","handle":"0xMorlex","text":"SpaceXAI engineer, Lauren made all 54 of her skills public, and now you can add them to Grok Bot in one click\n\nabsolutely amazing...\n\nthe full list is in the image:\n\n·  3 to start: /poteto-mode runs everything else\n·  8 to build: arena, swarm, architect, blast-radius\n·  6 to review: interrogate, no-comments, verification\n·  8 to understand: how, why, teach, bro\n·  5 to write: unslop, technical-writing\n·  24 principles her agents read before every decision\n\nsave the list, then add it to your Grok Bot","url":"https://x.com/0xMorlex/status/2111071792500490393","createdAt":"2026-10-16T12:28:31Z","metrics":{"views":39904,"likes":406},"lang":"en"},{"id":"2111174085145182585","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"What if your AI chatbot could build an entire interactive interface instead of just replying with text?\n\nThis open-source GitHub project generates working maps, charts, tables, and editable components in real time using models from OpenRouter, Ollama, and more.\n\nRepo:","url":"https://x.com/RoundtableSpace/status/2111174085145182585","createdAt":"2026-10-16T19:15:00Z","metrics":{"views":43887,"likes":138},"lang":"en"},{"id":"2111054955956113605","author":"Mo Elgaraihy","handle":"EngMoElgaraihy","text":"💣 اعتراف صادم من سام ألتمان: \"توقعاتي كانت خاطئة تماماً.. رغم تطوير الذكاء الاصطناعي، لم يتغير العالم قيد أنملة، ونحن نواجه التزامات مالية بـ 100 تريليون دولار، ونواجه قضايا من كل اتجاه. بصراحة، قد نكون في ورطة حقيقية!\" 📉🤯\n\n​الرجل الذي روّج طويلاً لفكرة أن \"الذكاء الاصطناعي سيسرق كل الوظائف ويعيد تشكيل العالم بين عشية وضحاها\" يرفع الراية البيضاء ويعترف بالحقيقة المرة:\n\n​وهم التغيير السريع: \"كنت أعتقد أن إطلاق GPT-4 سيقلب قطاع البرمجيات رأساً على عقب في لمح البصر.. لكن الواقع كان مختلفاً تماماً، لقد أخطأت في تقدير سرعة تغير المجتمع.\"\n\n​القصور الذاتي للبشر (Inertia): استخف ألتمان بمدى \"كسل\" الاقتصاد والمجتمع البشري. مهما كان الذكاء الاصطناعي خارقاً، فالناس يستيقظون ويؤدون أعمالهم بالطريقة نفسها، ويشترون من الشركات القديمة ذاتها. المجتمع لا يتحرك بالسرعة والرشاقة التي يتخيلها مهندسو التقنية.\n\n​تغيير السلوك البشري: \"كنت أظن أننا إن صنعنا أداة مذهلة، سيقفز الجميع لاستخدامها فوراً\".. لكن تبين أن تغيير العادات اليومية أو القواعد المؤسسية البالية أصعب بمئة مرة من بناء الذكاء الاصطناعي نفسه.\n\n​التقنية سابقة لعصرها: التكنولوجيا هي الأقوى في تاريخ البشرية بلا منازع، لكن \"العنصر البشري والنظم الاجتماعية\" عاجزون عن مواكبة هذا التسارع.\n\n​الخلاصة المرة: بناء نموذج خارق أسهل بكثير من محاولة إقناع البشر بتغيير طرق حياتهم القديمة! 💀\n\n​احفظ التغريدة بـ Bookmark 🔖 وشاركنا: هل تعتقد أن البشرية حقاً مقاومة للتغيير إلى هذا الحد، أم أن ثورة الذكاء الاصطناعي لم تضرب بقوة كافية بعد؟ 🧵👇","url":"https://x.com/EngMoElgaraihy/status/2111054955956113605","createdAt":"2026-10-16T11:21:37Z","metrics":{"views":184674,"likes":1115},"lang":"ar"},{"id":"2110724714125742194","author":"马佳彬","handle":"majiabin","text":"教你用REA复刻一切软件","url":"https://x.com/majiabin/status/2110724714125742194","createdAt":"2026-10-15T13:29:21Z","metrics":{"views":43044,"likes":923},"lang":"zh"},{"id":"2111065217006473664","author":"CodeX 実践塾","handle":"Codex_jisen","text":"これ欲しかった。\n\nAIで画像や資料を作るとき、\n「もっとおしゃれな色にして」で思い通りにならないなら、\n配色見本から選んで伝えるのが早い。\n\n・桜ミルクで、やさしく可愛く\n・氷河ブルーで、すっきり爽やかに\n・レトロ喫茶で、落ち着いた雰囲気に\n\n「AI配色の名前100選」を\n5色ずつの見本付きで、4枚にまとめました。\n\n好きな配色を選び、画像や色コードと一緒にAIへ。\n\n画像・資料を作る人は保存推奨です👇📌","url":"https://x.com/Codex_jisen/status/2111065217006473664","createdAt":"2026-10-16T12:02:24Z","metrics":{"views":18037,"likes":460},"lang":"ja"}]}]}</script>

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
