<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-17T19:22:37+09:00","posts":[{"id":"2111391262209388763","author":"StudioYebisu","handle":"studio_yebisu","text":"たった今、世界のAI覇権のバランスは完全にぶっ壊れました。これほんまにやばいです。\n週明けのAI関連株は大暴落どころの騒ぎじゃないかもな…。\n何が衝撃的なのか、ガチ解説します。\nもう何もかもが変わっちまったんだな...。\n\n■何がおきたか\nDeepSeek v4.1-Flash 1017というモデルが公開されました。世界のAI情勢を破壊します。ヤバいモデルです。\nこのモデル簡単がどういうものなのか説明すると、\nフロンティアモデルを一部で越える（SOTA級）のモデルを中華ラボがいきなり出してきた。\n\n問題はその性能、値段とサイズと仕組み\nどれも本当に破壊的なものだから、1個ずついきます。\n\n■性能\n全分野でOpus5.5を超えたっていうわけじゃないけど。\n完全にDeepSeek v4.1-Flash 1017はSOTA級\n\nDeepSWEっていうベンチが一番衝撃的かな。\n- 今回のFlash：成功率77%、約0.20ドル／タスク\n- GPT-6.1 Solの最も高得点の設定：約75%、約0.65ドル／タスク\nつまり、この比較では約3分の1の費用で、成功率も少し高い。大量に実装・修正を回す用途には大きな差。\nというか、成功率でSolを越えてるっていう事実がヤバいんだよ。\n\n■値段\nもう完全に乱暴に言うと。ほぼタダです。\u003c言い過ぎ\nINPUT$0.15Output$0.3\n\n入力10万＋出力1万トークンの例だと\nSolより約86〜93%安く、Opusより約93〜97%安い\nDeepSeekハーネスを使えば、自分の利用では、入力のキャッシュヒット率が99%になることもあったので。\n実際はもっと安い。\n過去に湯水のように使えるAstra,Opus,Fableをくれとは言ったが。ここまでやれとは言ってない。\n本当に、なんだろう、マジで安いんだよ。\n実際の感覚だと200倍ぐらい安いね。\n\n■サイズ\nこれだけヤバいモデルのオープンウェイトが同時に無料公開されました。\nそのサイズは763B。重みだけで約510.3GB\n\n例えば米国のフロンティアモデルのサイズは10Tとか言われてるんですね、公開情報じゃないからわからん無いけど。Kimi K3とかが2.8T\n\n要するに、めちゃくちゃサイズが小さいんですよ。\nこのパラメータ数って多ければ多いほど計算に計算資源と電力がかかるんで、コストかかるんですよ。\n\nアメリカのAIモデルって、バカみたいに計算資源を保有してるからゴリ押しでそれを解決してるんですけど。\n\nこんだけ軽かったら、もう普通に家で使えるレベルなんですよ。\n\n実際、DGXSpark × 4台とかMacStudio 512GBで動かせると思います。\nバカみたいなデータセンターがなくても、フロンティアモデルが動くようになっちゃったってわけ。\n\n■仕組み\nここがかなり驚き度の高いポイントなんですけど。\nDeepSeek-V4.1-Flash自体はもともと存在していて。\nまあそこそこ人気だったんですけど。本当に安くてそこそこ性能いいから、結構人気あるよね、ぐらいの賢さだったんですよ。\n\nそのもともとあったモデルを自己フィードバックを使うRLで強化した。って公式は言ってて。\nまあ詳しい説明は省きますけど。要するに、既に存在していたモデルを後から調整していくようなやり方で、とんでもなく性能をあげた。\n\n驚くのは、既存モデルの後学習で、開発タスクの成功率を上げながら、処理時間や出力量まで減らしたところです。性能を上げたうえで、使う側の費用まで下げてきた。その性能の上り方が半端じゃないんだよ…意味わかんねぇよ…\n\nDeepSeekのラボが今世界で最もAI、優れたAIラボであるということを認めなきゃいけない。","url":"https://x.com/studio_yebisu/status/2111391262209388763","createdAt":"2026-10-17T09:37:59Z","metrics":{"views":15827,"likes":243},"lang":"ja"},{"id":"2111372809343823977","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝しょうへいさんが太っ腹すぎて感動！\nこれを無料公開しているの、素晴らしすぎる！感謝です！！しかもSkill化も簡単にできる～\n\nしょうへいさんの「Motion Prompt」は、AIに伝えたい「こんな動き」を、実際の見本から選べるサイト\n文字が1文字ずつ出る、カードが順番に現れる、スクロールすると背景に奥行きが出る\n\n見れば分かるのに、いざAIへ頼むと名前が出てこない\nその悩みを、動く見本とコピペできる指示文で助けてくれる\n\nモーション、カメラワーク、UIパーツ、Web演出、写真表現の5分野で計120項目\n名前だけでなく説明や依頼例まで付いている\n\n「もっといい感じにして」と何度も頼む前に、ここから欲しい表現を選ぶ\n非エンジニアでも、作りたいものを具体的に伝えやすくなるのがいい\n\n無料公開に加えてMITライセンスなのもありがたい\nAIで動画やWebを作る人は、手元に置いておきたいサイト\n\nSkill化がオススメでっす！","url":"https://x.com/tetumemo/status/2111372809343823977","createdAt":"2026-10-17T08:24:39Z","metrics":{"views":2075,"likes":15},"lang":"ja"},{"id":"2111069723907559831","author":"silvan","handle":"silvanrec","text":"🚨 ESTOS 10 REPOS DE TRADING ESTÁN CREANDO MILLONARIOS EN SILENCIO… Y SON 100% GRATIS\n\n\u003e 10 repos open source\n\u003e 435K+ estrellas en GitHub\n\u003e $0 en licencias\n\u003e 1 stack: pensar, probar, ejecutar\n\n10 repos de trading open source que deberías tener guardados:\n\nAGENTES DE IA QUE ANALIZAN:\n\n1. TradingAgents (111K ⭐) → https://t.co/M9Uo4f4lKR\nun equipo de agentes de IA: analistas, investigadores alcistas y bajistas, trader y gestor de riesgo que debaten cada operación\n\n2. ai-hedge-fund (64K ⭐) → https://t.co/ikPDERfB4J\nagentes que analizan acciones como lo harían Buffett, Munger o Burry. Educativo: no opera con dinero real\n\nBOTS QUE OPERAN:\n\n3. freqtrade (55K ⭐) → https://t.co/yzdEh7PM0A\nel bot de cripto gratis más usado: backtesting, optimización de estrategias y control desde Telegram\n\n4. Hummingbot (20K ⭐) → https://t.co/3ZOlGK2nNz\nbots de market making y arbitraje en exchanges de cripto\n\nMOTORES DE BACKTESTING:\n\n5. NautilusTrader (30K ⭐) → https://t.co/9QJ1cHHXi2\nmotor escrito en Rust: la misma estrategia corre en backtest y en vivo\n\n6. Lean de QuantConnect (22K ⭐) → https://t.co/MOxBgDfddm\nel motor de trading algorítmico de QuantConnect, en Python y C#\n\nIA PARA QUANTS:\n\n7. Qlib de Microsoft (49K ⭐) → https://t.co/8h648rIhUL\nplataforma de inversión cuantitativa con IA, de los datos al modelo\n\n8. FinRL (16K ⭐) → https://t.co/B3lEcg8ZNw\naprendizaje por refuerzo aplicado a trading\n\nLA BASE:\n\n9. ccxt (44K ⭐) → https://t.co/rlpM2QUDgC\nuna sola API para más de 100 exchanges de cripto y mercados de predicción\n\n10. machine-learning-for-trading (21K ⭐) → https://t.co/LcCn3NAAqn\ntodo el código del libro de Stefan Jansen: de conseguir datos a operar en vivo\n\nGuárdalo antes de que sea tarde 🔖","url":"https://x.com/silvanrec/status/2111069723907559831","createdAt":"2026-10-16T12:20:18Z","metrics":{"views":107606,"likes":911},"lang":"es"},{"id":"2111113436314648758","author":"kiosa","handle":"thegreatest_sv","text":"I truly don't understand why nobody is using this setup\n\ngraphify, a tool that turns any folder into a knowledge graph your agent can query, just passed 126k stars on github and got into Y Combinator. people stopped asking ai questions. they're giving it a desk, a memory and a job.\n\nyou give Claude Code one folder, plug in your email, calendar and a browser, and it turns into an agent. it reads, remembers, acts, and checks itself before it does anything stupid.\n\ndoesn't matter if you're a founder, a marketer or a student, you need this\n\nthe full setup:\n\n\u003e create a folder called AGENT, open Claude Code inside it and add a CLAUDE.md with one rule: \"save every decision, person and project to memory/\"\n\n\u003e run npm install -g @googleworkspace/cli, then gws auth setup. now it reads your Gmail, Calendar and Drive\n\n\u003e run claude mcp add playwright npx @playwright/mcp@latest. it gets its own browser to open sites, fill forms and pull data for you\n\n\u003e run uv tool install graphifyy, then graphify install, then type /graphify .. everything in the folder becomes a knowledge graph it queries in seconds instead of digging file by file\n\n\u003e run npm i -g jev-guard, jev-guard key \"...\", jev-guard install claude. a tiny model called Jev scores every action before it runs. rm -rf gets blocked, a poisoned email gets flagged, for about 4 cents per 1,000 checks\n\n\u003e type /schedule and tell it \"every morning at 7:30, send me what came in, what you drafted and what waits for my yes\". from now on it works on a routine\n\n15 minutes to set up, and you never start from a blank chat again.\n\nevery repo is below:\n-\u003e https://t.co/DxEYHPBvxs\n-\u003e https://t.co/jn7VzQFA1M\n-\u003e https://t.co/68TFgbU5Mc\n-\u003e https://t.co/PSQf3KijaV\n\nbookmark this","url":"https://x.com/thegreatest_sv/status/2111113436314648758","createdAt":"2026-10-16T15:14:00Z","metrics":{"views":29775,"likes":497},"lang":"en"},{"id":"2111126414246436895","author":"Oikon | Claude Code深掘りガイド","handle":"oikon48","text":"Claude Codeの放置していると、プロンプトキャッシュが切れる前にauto compaction（コンテキストの自動圧縮）をする「Idle Compaction機能」が実装されました\n\n54分ほど放置するとauto-compactionが実行され、プロンプトキャッシュを整理し直します","url":"https://x.com/oikon48/status/2111126414246436895","createdAt":"2026-10-16T16:05:34Z","metrics":{"views":8330,"likes":91},"lang":"ja"},{"id":"2111401209588494513","author":"Dharmik Harinkhede","handle":"AiwithDharmik","text":"CONGRATULATIONS!!!\n\n︎\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n︎\n\n︎\n\n︎\n\n︎\nFinally\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\nThe Money is coming!\n\n︎\n︎\n︎\n︎\n\n︎\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\n︎\n\nAnd\n\nYou'll become rich as fuck.","url":"https://x.com/AiwithDharmik/status/2111401209588494513","createdAt":"2026-10-17T10:17:30Z","metrics":{"views":155,"likes":2},"lang":"en"},{"id":"2111292616264351992","author":"Codex研究ラボ","handle":"codexneo4","text":"Codex 6.1のトークン消費を\n最大93.1%削減できる神ツールが話題‼️\n\nCodexを毎日使ってる人は\n絶対チェックした方がいい。\n\nGit操作、テスト、ビルド、エラーログなどの\n無駄な出力を自動圧縮してくれる。\n\nしかも導入はCodexに丸投げだけ！\nマジで知らないと損するレベルなので解説する👇","url":"https://x.com/codexneo4/status/2111292616264351992","createdAt":"2026-10-17T03:06:00Z","metrics":{"views":24857,"likes":149},"lang":"ja"},{"id":"2111225811747717380","author":"いにしえ@高信頼AIニュース\"NeuralWire.org\"運営｜Will Oldgram","handle":"old_pgmrs_will","text":"みんな同じ事考えるし、やるよね☺️\n自分も Grok Bot 使い始めた当初から、Bot にCodex / Claude Code / Grok Build 与えて使わせてる\n\n最近は新しいサービスやアプリの紹介を見るたび、先に「これ自作できそうだな」と考えてしまうようになった😁","url":"https://x.com/old_pgmrs_will/status/2111225811747717380","createdAt":"2026-10-16T22:40:32Z","metrics":{"views":5724,"likes":46},"lang":"ja"},{"id":"2110729681037042132","author":"まさお@AI駆動開発","handle":"AI_masaou","text":"本気でハーネスに向き合いたい時に最近オススメの課金は\n\nClaude 200ドルプラン\n↓\nCursor（GrokBOT使うため）\n↓\nChatGPT 200ドルプラン\n\nでもぶっちゃけ、無難に使ってるだけじゃ周りの猛者との差はつかないんよな\nその程度で10Xしても、周りも10Xしているし\n猛者はその間に100X 1000Xしてくるからね\n\nツールが強力になればなるほど、本質的な理解や設計力、高度なハックを知っているかどうかで差がつく環境です\n\nだからこその、まさおメンシプなんだよね\n\n実際、akapen、認知負荷対策、ゴールループみたいなハーネスの本質設計に関わる知見も、何ヶ月も前からメンバーに共有し続けてきたし、まだ全然世間にバレてないものもある\n\nしかも過去の知見を配って終わりじゃなく、今この瞬間もフロンティアを掘りまくって、新しく得た知見をシェアしまくってる\n\nただし俺の活動に共感してもらえないなら参加はしないで欲しい\n\nGIVEしすぎてて、本来見せたくないものやライバルには都合の悪いものまで共有しまくってるからね\n\nそれさえクリアなら全力GIVEさせてもらいます\n\n人生賭けて最前線を掘り続けて、ハーネスも設計思想も実践知も共有している上で、月9,800円は格安だと思う\n\nスクールや商材に行くよりも、まさおメンシプでよろしく\n\n次の環境はまた大きく進化していくから、入りづらくなる前に今のうちにぜひ参加してね！","url":"https://x.com/AI_masaou/status/2110729681037042132","createdAt":"2026-10-15T13:49:06Z","metrics":{"views":13520,"likes":86},"lang":"ja"},{"id":"2111044476273910123","author":"Tom Huang","handle":"tuturetom","text":"Claude Motion开源替代来了！🔥🚀\n\n正式推出 OpenDesign Motion，做出顶尖的动效视频，不应该只能用 Opus 5.5。现在，你可以用自己喜欢的模型和 Agent，在 OpenDesign 里完成。\n\n这条发布视频，就是我们用 DeepSeek v4.1 Flash 在 OpenDesign 里做的 ↘️\nhttps://t.co/rA7FgV6DAc","url":"https://x.com/tuturetom/status/2111044476273910123","createdAt":"2026-10-16T10:39:59Z","metrics":{"views":39551,"likes":579},"lang":"zh"},{"id":"2111286153697775911","author":"JosephZhou","handle":"openmys","text":"Esp32控制iPhone的架构图先开源啦！！\n\n很多人催我开源这个仓库，坦白说还没完全调试好：目前正在用视觉模型带决策模型跑训练，把经验沉淀给决策模型，结果 500 刀 Codex 这周用了三张重置卡都烧光了，但是好消息：已经跑通了国内大部分的app了，遇到的各种弹窗/开屏广告等都有办法绕过了。\n\nPhone use harness还在迭代，先把整套架构图放出来（视频左边就是跑在终端里的实时流程看板，我专门为了防止流程黑箱做了一个可视化看板），这里面有完整的phone use是怎么点外卖的全流程，感兴趣的可以把架构图直接发给自己的agent，就可以复制流程，只是缺少了Phone use的后端学习数据。\n\n全程不越狱、不破解，在 iOS 看来它就是一只普通的蓝牙鼠标，我自己跑了好几天没有遇到任何风控问题。","url":"https://x.com/openmys/status/2111286153697775911","createdAt":"2026-10-17T02:40:19Z","metrics":{"views":7353,"likes":168},"lang":"zh","textJa":"ESP32でiPhoneを操作する仕組みのアーキテクチャ図を先に公開した！！\n\nこのリポジトリを公開してほしいとたくさん催促されたけど、正直まだ調整しきれていない。今は視覚モデルに意思決定モデルを付けて学習を回し、経験を意思決定モデルに蓄積しているところ。その結果、500ドルのCodexプランを今週リセットカード3枚分使い切ってしまった。でも良い知らせもあって、国内のほとんどのアプリではもう動くようになったし、いろいろなポップアップや起動時広告も回避できるようになった。\n\nPhone useのハーネスはまだ改良中なので、まずアーキテクチャ図一式を公開する（動画の左側はターミナルで動くリアルタイムの進行ダッシュボードで、処理がブラックボックスにならないようにわざわざ可視化した）。ここにはphone useでフードデリバリーを注文する全工程が入っている。興味がある人は図をそのまま自分のエージェントに送れば流れを再現できる。足りないのはPhone useのバックエンド学習データだけ。\n\n脱獄もクラックも一切していない。iOSから見れば、ただのBluetoothマウスだ。自分で何日も動かしたけど、リスク管理に引っかかったことは一度もない。"},{"id":"2111309980808683757","author":"0xMarioNawfal","handle":"RoundtableSpace","text":"Stop writing giant system prompts from scratch.\n\nThe Grok Bot team put its own bot templates in the marketplace. Import one, connect your tools, adapt it to your work.\n\n10 worth stealing:\n\n1. dr eggbot → describe a job, it helps build a specialist bot for it\n2. Engineer Bot → supervises cloud coding agents and watches their PRs, you merge\n3. Stalk Bot → tracks competitors' products, pricing and positioning, with sources\n4. Haggle Bot → finds wasted SaaS spend and drafts vendor negotiations\n5. Proto Bot → turns feature ideas into prototypes in your app as draft PRs\n6. Video Editor → picks takes from raw footage and cuts captioned vertical videos\n7. figma bro → turns Figma frames into build specs and checks your design tokens\n8. Distro Bot → runs marketing campaigns, asks before spending, posting or sending\n9. Startup QA Bot → tests your product in a test account, reports bugs with repro steps\n10. Signal Prospector → finds buying signals in your CRM and drafts outreach\n\nSeveral keep a human approval step before anything ships, spends or sends.\n\nCheck what tools and accounts a bot asks for before you connect it.\n\nThe prompt engineering is already done. You just plug in.","url":"https://x.com/RoundtableSpace/status/2111309980808683757","createdAt":"2026-10-17T04:15:00Z","metrics":{"views":48443,"likes":73},"lang":"en"},{"id":"2111291113197711785","author":"ハンドボール人「布施千佳純」","handle":"chikaidev","text":"AIで作ったアカウント、3投稿・1日でフォロワー8万人超えと600万再生いっててヤバい\n\n中身は家計簿アプリSaveoのアニメ連載\n1. 1000万ドル盗んだ男のイラスト物語\n2. 画面上に現金・預金・怪しまれ度メーターを表示\n3. 盗んだ金は遠くで使えってお金の知恵を挟む\n4. 続きはコメントの投票で決めて毎日更新\n\n日本人でも「宝くじ3億円当たった男の使い道」みたいにそのまま真似できそう","url":"https://x.com/chikaidev/status/2111291113197711785","createdAt":"2026-10-17T03:00:01Z","metrics":{"views":4974,"likes":96},"lang":"ja"},{"id":"2111200540772221418","author":"mirku","handle":"mirku21","text":"THIS IS A PURE F*CKING GOLDMINE\n\nAnthropic just shared the sharpest trick for Claude Code\n\nThe idea: let Opus 5.5 write the plan as a script, and swarm the new Haiku 5.5 in parallel\n\nHuge sweeps with zero Opus burn: the script holds the loop and Opus only sees the final diff\n\nYou just launch Claude Code like this:\n\nclaude --model opus --effort ultracode\n\nhere's the split:\n\n→ Opus 5.5 turns your objective into an executable workflow script\n→ Haiku 5.5 swarms every file in parallel at 340 tok/s to extract candidates\n→ Sonnet 5.5 patches each fix and cross-checks findings in its own isolated copy\n→ you stop burning Opus context on a hundred agent transcripts\n\nOpus only shows up at three moments:\n\n→ authoring the workflow script before the run\n→ reading verified findings after the swarm finishes\n→ signing off before anything ships to git\n\nOpus plans · Haiku scans · Sonnet ships\n\nJEV engineering is the same move one layer down: the forks that need no thinker (which file, which tool, retry or stop) go to JEV in milliseconds, and the big models only see the ones that split\n\nthe full tree\n\u003e Opus 5.5 runs the main session and writes workflow.js\n\u003e pipeline() fans out the new Haiku 5.5 to audit every file\n\u003e parallel() schema validators drop false positives in V8\n\u003e Sonnet 5.5 patches each fix in an isolated worktree\n\u003e verify cross-checks all diffs before reporting\n\u003e Opus 5.5 reads only what survived verification\n\u003e JEV routes micro-forks in milliseconds\n\npaste the tree and this prompt into Claude Code ↓\n\n\"Rebuild my Claude Code setup around this tree:\n1. Run the main session on Opus 5.5 with ultracode on\n2. In every workflow, run read-only scan stages on the new Haiku 5.5 and edit stages on Sonnet 5.5, each edit in its own isolated copy\n3. Add one rule to CLAUDE.md: every finding gets an independent verifier agent before it's reported, and fix loops stop after two rounds with no progress\n4. Route fast deterministic forks (tool choice, path selection, retries) through JEV\nShow me every change as a diff first, no edits until I say go\"\n\n↳ https://t.co/PcTdH7dyjb\n\nsave it, it'll come in handy","url":"https://x.com/mirku21/status/2111200540772221418","createdAt":"2026-10-16T21:00:07Z","metrics":{"views":58204,"likes":500},"lang":"en"},{"id":"2111192898171818232","author":"Forha","handle":"Forhanvv","text":"From 𝟭𝟭 𝗺𝗶𝗻𝘂𝘁𝗲𝘀 down to 𝟳𝟮 𝘀𝗲𝗰𝗼𝗻𝗱𝘀.\n\nA new ComfyUI node just cracked real-time speed for 𝗠𝗶𝗻𝗶𝗠𝗮𝘅 𝗛𝟯 character video generation.\n\n𝗖𝗼𝗺𝗳𝘆𝗨𝗜-𝗥𝗲𝗳𝟮𝗩𝗔-𝗩𝗦𝗔 achieves a massive 𝟵𝘅 𝘀𝗽𝗲𝗲𝗱𝘂𝗽 using sparse attention DiT:\n\n• 𝟳𝟮𝘀 𝘄𝗮𝗹𝗹 𝘁𝗶𝗺𝗲: Full 5.16s video @ 24fps (124 frames, 1344×768)\n• 𝟭𝟯.𝟱 𝗚𝗕 𝗣𝗲𝗮𝗸 𝗩𝗥𝗔𝗠: Down from ~22.5 GB (runs on 16GB GPUs)\n• 𝟰-𝗦𝘁𝗲𝗽 𝗦𝗮𝗺𝗽𝗹𝗶𝗻𝗴: Euler/simple sampler with 75% video sparsity\n• 𝗭𝗲𝗿𝗼 𝗙𝗮𝗰𝗲 𝗗𝗿𝗶𝗳𝘁: Reference tokens stay locked out of attention pruning to maintain 100% character identity\nBenchmark comparison on RTX 4090: → Native Dense H3: ~650s (~11 min)\n→ Video Delta Net (VDN): ~135s\n→ Ref2VA VSA: ~72s\n\nOpen-source on GitHub:","url":"https://x.com/Forhanvv/status/2111192898171818232","createdAt":"2026-10-16T20:29:45Z","metrics":{"views":67249,"likes":1442},"lang":"en"},{"id":"2111291280802095294","author":"Tom Dörr","handle":"tom_doerr","text":"Bypass Cloudflare challenges and bot checks by automating real Chrome browser instances with Stealth Browser MCP.\n\nhttps://t.co/ZPG1h1NlDc","url":"https://x.com/tom_doerr/status/2111291280802095294","createdAt":"2026-10-17T03:00:41Z","metrics":{"views":10331,"likes":203},"lang":"en"},{"id":"2111327657979957607","author":"Arindam Majumder 𝕏","handle":"Arindam_1729","text":"people keep confusing Jev with tabular foundation models.\n\nthey're not the same thing.\n\nthe difference comes down to one thing:\n\nJev does zero-shot classification. TFMs make predictions grounded in learned data.\n\nhere's the breakdown.\n\nJev: unstructured in → structured out\n\nJev takes text or other inputs and turns them into decisions.\n\n→ is this lead worth pursuing? \n→ should this email get a reply? \n→ which agent should handle this task? \n→ does this document need further review?\n\nit's built for lightweight, low-cost classification and decision routing, without needing task-specific training data.\n\nTabular foundation models: structured data in → grounded predictions out\n\nModels like TabPFN learn patterns from tabular data to classify outcomes or predict numerical values.\n\nthey use learned patterns in data to make predictions grounded in the examples they see.\n\nthis isn't zero-shot classification in the same sense as Jev.\n\nbut here's where it gets interesting.\n\nimagine combining both to build predictive agents.\n\nJev handles the fast decisions: classify incoming information, route tasks, and decide what needs attention.\n\na tabular foundation model handles the predictions: estimate risks, forecast outcomes, and score opportunities using structured data.\n\none decides what to do next. the other predicts what might happen.\n\nthat's a much more interesting architecture than asking one massive LLM to do everything.\n\nthe future of AI agents might not be about finding one model that does it all.\n\nit might be about getting different models to work together.","url":"https://x.com/Arindam_1729/status/2111327657979957607","createdAt":"2026-10-17T05:25:14Z","metrics":{"views":769,"likes":7},"lang":"en"},{"id":"2111096968978280776","author":"Sumanth","handle":"Sumanth_077","text":"","url":"https://x.com/Sumanth_077/status/2111096968978280776","createdAt":"2026-10-16T14:08:34Z","metrics":{"views":2511,"likes":39}},{"id":"2111390846256042263","author":"逆瀬川","handle":"gyakuse","text":"speech.cpp v0.8.10はCLIをちょっとかわいくしました！\nかわいいCLIはだいじなので。\nhttps://t.co/nrEDxDAll2\n\n■speech.cppとは\n・Python/CUDA不要の音声合成・音声認識エンジンです\n・モデル対応状況\n　TTS: irodori-tts, qwen3-tts, drama-3\n　ASR: qwen3-asr, reazonspeech-v2, parakeet-tdt","url":"https://x.com/gyakuse/status/2111390846256042263","createdAt":"2026-10-17T09:36:20Z","metrics":{"views":943,"likes":13},"lang":"ja"},{"id":"2110920387639091490","author":"Sadao Tokuyama","handle":"tokufxug","text":"病院の3D空間でPhysical AI向け合成データを生成🏥\n\n🔹GitHubで病院の3DモデルとPythonスクリプトを公開\n🔹物体・素材・照明・カメラをランダム化し、30パターンを生成\n🔹画像撮影やアノテーション出力は未実装\n\nHCLTechのSanjuna Mariam Mathews氏による取り組み\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2110920387639091490","createdAt":"2026-10-16T02:26:54Z","metrics":{"views":5333,"likes":122},"lang":"ja"},{"id":"2111154194589815147","author":"rody","handle":"0x_rody","text":"call me insane but.. i will keep saying that:\n\ngrok bot + jev is going to create more millionaires in 2026 than crypto ever did.\n\nidea → grokbot → jev decisions  → grokbot execution → $$$$$\n\ndon’t scroll past this if it hits your timeline.\n\njust feed this entire thing into grok bot.\nthank me later.","url":"https://x.com/0x_rody/status/2111154194589815147","createdAt":"2026-10-16T17:55:57Z","metrics":{"views":12323,"likes":99},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-18T08:29:20+09:00","posts":[{"id":"2111593218584526889","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】OpenAIが共同編集可能なChatGPT Spaceの紹介動画を公開。\n\nチームとChatGPTが同じページを一緒に編集できる場所。NotionやGoogleドキュメントの立ち位置を狙ってきましたね。\n\n・人とChatGPTのカーソルが同時に動く\n・ページを開発タスクに自動で分解\n・そのページをCodexで指定して実装\n・スライド対応は10月16日に追加\n・Pro・Business・Enterpriseで提供","url":"https://x.com/masahirochaen/status/2111593218584526889","createdAt":"2026-10-18T08:00:29+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111593130336333824/img/GESsuDnkwvTPhoIz.jpg","avatar":"https://pbs.twimg.com/profile_images/1689665533929725953/fClFlzLd_200x200.jpg","metrics":{"views":2437,"likes":8,"reposts":1,"replies":3},"lang":"ja"},{"id":"2111099220359061855","author":"楠悠一｜クレーン降りたら人生上がった｜AI講師","handle":"kusunoki_u1","text":"GoogleドライブでAIエージェントを動かすのが最適解だとまだ気付いてない人多いんじゃないかな🤔\n\nG:/マイドライブ/AI","url":"https://x.com/kusunoki_u1/status/2111099220359061855","createdAt":"2026-10-16T23:17:31+09:00","avatar":"https://pbs.twimg.com/profile_images/2040229406145486848/pRvDwrBL_200x200.jpg","metrics":{"views":40485,"likes":236,"reposts":14,"replies":10},"lang":"ja"},{"id":"2111595356161257502","author":"StudioYebisu","handle":"studio_yebisu","text":"ClaudeDevさんは本当にあれだね。開発者向けのアップデートが好きだね。\nレビューの深度を設定できるように。\n軽めとかガッツリとか、二郎ラーメンみたいなノリでレビューの深さが変えれる。","url":"https://x.com/studio_yebisu/status/2111595356161257502","createdAt":"2026-10-18T08:08:59+09:00","avatar":"https://pbs.twimg.com/profile_images/2095218586046652416/pyuFtKH0_200x200.jpg","metrics":{"views":406,"likes":1,"reposts":0,"replies":0},"lang":"ja"},{"id":"2111386234027442636","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"【事件】\n海外の開発者が「20日間、コードを1行も見ていない」と明かした😳\nhttps://x.com/Belbizaz/status/2111120760660254842/video/1\nしかも、作っているのはブラウザで動く3Dゲーム。\n全部、Claude Codeの1つの会話を20日間続けて作ったもの。\n\n何がヤバいかというと👇\n・使ったのはOpus 5.5とthree.jsだけ\n・3DソフトのBlenderは使っていない\n・autocompactは25万トークンで動く設定にして、会話を切らずに続けた\n\nしかも中身は「AIで速く作れた」自慢じゃない。\n1つの会話を途切れさせずに回し続ける運用のリアル。\n\n正直、3Dゲームの入門講座より\nこの30秒の動画の方が刺さる。\n\nゲームを作りたい人は見ない理由がない。\nこれはデモじゃない。\n開発の未来のリークです🤐\n\n1つの会話で20日間回すなら、まずClaude Codeへの頼み方とCLAUDE.mdの土台を固めておくと途中で崩れない。\nClaude Codeの教科書・4時間セミナー・記憶Vaultのテンプレなど有料級6点を今だけ無料配布中、受け取り方は引用元の投稿へ👇","url":"https://x.com/ClaudeCode_love/status/2111386234027442636","createdAt":"2026-10-17T18:18:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111115234396213248/img/G4S6luyQ9xqlBwdc.jpg","avatar":"https://pbs.twimg.com/profile_images/2042404213943386115/05hqEdJl_200x200.jpg","metrics":{"views":9959,"likes":61,"reposts":10,"replies":2},"lang":"ja"},{"id":"2111430525340573921","author":"kaito","handle":"cu30rry_","text":"pstackがClaude Code pluginを提供するようになりましたが、私はCodexは提供されないと予想します\n\n全然OpenじゃないOpenAIとSpaceXは仲が良くないですし、@poteto さんは @thsottiaux さんのリセットをかなりネタにしているくらいバッチバチだからです\n\nなので、Codex対応は自力で頑張るしかないのです、、、\nただ、そこまでCodexに私は今魅力を感じてないです\n\n残念ながら、potetoさんが言うように、リセットばかりで、Grok BotやCursorのようにユーザーにとって本当に価値あるアップデートを私は望んでいます\n\nソシャゲの石配りより、長期的に仕事を楽にしてくれるものを望みます","url":"https://x.com/cu30rry_/status/2111430525340573921","createdAt":"2026-10-17T21:14:00+09:00","avatar":"https://pbs.twimg.com/profile_images/2101959420439834625/ucyJOshP_200x200.jpg","metrics":{"views":4354,"likes":14,"reposts":0,"replies":1},"lang":"ja"},{"id":"2111464216599429238","author":"usutaku","handle":"usutaku_channel","text":"THE FIRST PROMPT","url":"https://x.com/usutaku_channel/status/2111464216599429238","createdAt":"2026-10-17T23:27:53+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111463554629226496/img/yl-F71M2PaAff_1L.jpg","avatar":"https://pbs.twimg.com/profile_images/1917122204917239812/8b380viX_200x200.jpg","metrics":{"views":39349,"likes":483,"reposts":28,"replies":5},"lang":"en","textJa":"最初のプロンプト"},{"id":"2111292964614164933","author":"あーなるほどね","handle":"ANAg2bGOD","text":"「Claude製アニメ」とかいうパワーワードw\nSeedanceとかのAI生成動画ではなく、全部コードを書いてレンダリングしたらしい。\n約25分のアニメをOpus 5.5が15時間以上かけて作ったとのこと。凄すぎる...","url":"https://x.com/ANAg2bGOD/status/2111292964614164933","createdAt":"2026-10-17T12:07:23+09:00","avatar":"https://pbs.twimg.com/profile_images/2107967732750983168/YgK-fXqU_200x200.jpg","metrics":{"views":20136,"likes":117,"reposts":13,"replies":2},"lang":"ja"},{"id":"2111446967545131171","author":"Kenn Ejima","handle":"kenn","text":"今の開発のコスパ最強コンボは\n\nOpus 5.5 (medium)\nGPT 6.1 Sol (medium)\n\nですね\n\nこれなら両方$20のプランでも\nまぁまぁ余裕をもって使えるはず\n\n一番良くないのは\n単体モデルでエフォートをxHighとかに\nあげることで\n\n所詮自己ループなのでバイアスがあり\n視点が狭くなる上に遅くなるだけで\n何もいいことがありません\n\nとくに上位モデルほど\nエフォートを上げるのが逆効果になりやすい\n\nOpus + Solのコンボは今のところ最強で\nFableやAstraの単体でMAXを使うより全然良いです\n\n相互レビューには /relay がおすすめです\n\nhttps://kanary.to/agents","url":"https://x.com/kenn/status/2111446967545131171","createdAt":"2026-10-17T22:19:20+09:00","avatar":"https://pbs.twimg.com/profile_images/2101495370660655104/F8tzCryw_200x200.jpg","metrics":{"views":42021,"likes":564,"reposts":34,"replies":4},"lang":"ja"},{"id":"2111453408800526526","author":"santi","handle":"santtiagom_","text":"cuando trabajan con agentes como Claude Code o Codex, hay un concepto muy importante que vale la pena entender: los feedback loops.\n\nbásicamente, es el ciclo en el que un agente ejecuta una tarea, recibe información sobre el resultado y utiliza ese feedback para corregir lo que hizo.\n\n¿cómo pueden aprovecharlo mejor?\n\n1) tests: permitan que el agente ejecute las pruebas y corrija los errores que encuentre.\n\n2) linting y type checking: configuren comandos para detectar problemas automáticamente.\n\n3) navegador: usen herramientas como Playwright para que pueda interactuar con la aplicación, verificar flujos y detectar errores visuales.\n\n4) logs: conecten herramientas de observabilidad como Datadog o Grafana mediante MCP para que pueda consultar errores y diagnosticar problemas.\n\n5) criterios de aceptación: definan qué debería funcionar y cómo comprobarlo.\n\npor ejemplo:\n\nsi le piden a Claude Code que implemente un formulario, pueden indicarle que lo construya, levante la aplicación, lo pruebe en el navegador, verifique las validaciones y corrija los errores que encuentre.\n\ny algo más: documenten los comandos y procedimientos de verificación en su CLAUDE.md o AGENTS.md para que los agentes sepan cómo validar su trabajo.\n\ncuanto mejores sean los mecanismos de feedback que les proporcionen, mayor autonomía van a poder darles para trabajar sin supervisar cada paso.","url":"https://x.com/santtiagom_/status/2111453408800526526","createdAt":"2026-10-17T22:44:56+09:00","avatar":"https://pbs.twimg.com/profile_images/1920658459302780928/cX2Z3tT2_200x200.jpg","metrics":{"views":14288,"likes":330,"reposts":24,"replies":17},"lang":"es","textJa":"Claude CodeやCodexのようなエージェントを使うなら、ぜひ理解しておきたい大事な概念がある。フィードバックループだ。\n\n簡単に言うと、エージェントがタスクを実行し、結果についての情報を受け取り、そのフィードバックを使って自分のやったことを修正するサイクルのこと。\n\nどうすればうまく活かせるか。\n\n1) テスト: エージェントにテストを実行させ、見つかったエラーを直させる。\n\n2) リントと型チェック: 問題を自動で検出するコマンドを用意しておく。\n\n3) ブラウザ: Playwrightのようなツールでアプリを操作させ、フローを確認し、見た目の不具合を見つけさせる。\n\n4) ログ: DatadogやGrafanaなどの監視ツールをMCPでつなぎ、エラーを調べて問題を診断できるようにする。\n\n5) 受け入れ基準: 何が動くべきか、どう確かめるかを定義する。\n\nたとえば、Claude Codeにフォームの実装を頼むなら、作って、アプリを起動し、ブラウザでテストし、バリデーションを確認し、見つかったエラーを直すよう指示できる。\n\nもう一つ。検証のコマンドや手順をCLAUDE.mdやAGENTS.mdに書いておけば、エージェントは自分の作業をどう確かめればいいか分かる。\n\n与えるフィードバックの仕組みが良いほど、一歩ずつ見張らなくても任せられる自律性が大きくなる。"},{"id":"2111328845790110023","author":"【公式】Claude Codeアカデミア","handle":"ClaudeCode_aca","text":"https://x.com/i/article/2110712878001246208","url":"https://x.com/ClaudeCode_aca/status/2111328845790110023","createdAt":"2026-10-17T14:29:58+09:00","avatar":"https://pbs.twimg.com/profile_images/2072241762945708032/T4Jv-LBF_normal.jpg","metrics":{"likes":13,"replies":0},"lang":"zxx","textJa":"https://x.com/i/article/2110712878001246208"},{"id":"2111439148372705324","author":"宮田 |Cloudflare x ClaudeCode","handle":"miyataArcHack","text":"CloudflareのVoidで、アプリを「作って公開する」までつなぐには？\n\nAIに頼んで、アプリの画面やコードを作る。そこまでは進んだのに、「データはどこに保存する？」「ログインはどう付ける？」「どうやって人に使ってもらう？」で手が止まる。","url":"https://x.com/miyataArcHack/status/2111439148372705324","createdAt":"2026-10-17T21:48:16+09:00","media":"https://pbs.twimg.com/media/HU1V109akAABdh3.png","avatar":"https://pbs.twimg.com/profile_images/2023732674733690880/cr07Z9PH_200x200.jpg","metrics":{"views":416,"likes":3,"reposts":0,"replies":0}},{"id":"2111445834617557302","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝DeepSeek、これはマジでヤバい\n「DeepSeekショック再び」を予感させる発表だった\n\n先ほど、10月17日に公開された「DeepSeek-V4.1-Flash-1017」\n注目したいのは、添付のグラフの左上にいる青い点\n\n縦軸は、ソフト開発の課題を解けた割合\n横軸は、その課題に取り組むために使った平均費用\nつまり、上に行くほどよく解けて、左に行くほど安い\n\n今回のDeepSeekは、この試験で77.0％\n最大設定でも、図から読み取る平均費用は約0.2ドル\n\n一方、図にあるClaude Opus 5の最大設定は約74％、費用は10ドル超\nGPT-6 Astraなどの高性能モデルと並べても、DeepSeekはかなり左上にいる\n\nこの図の条件では「安いけど少し我慢するAI」では済まない\n安い側のモデルが、解ける割合でも上に来ている\n\n※費用はグラフからの概算。提供元の特定試験の比較で、脚注には9月22日の参照データも含まれる。全社の最新モデルを同日に測った比較や、実務全般の費用を保証するものではない\n\nしかも、モデルの重みをMITライセンスで公開している\n\n重みとは、AIが学習して身につけた能力を動かすための数値データ\n対応する設備と技術があれば、企業や開発者が自分たちで動かしたり、用途に合わせて調整したりできる\n\nサービスとして借りて使う選択肢に加えて、AIそのものを自分たちで運用する選択肢がある\nこの違いは大きい\n\nAPIは、使った量に応じて支払う方式で、今回の単価は据え置き\n料金表では100万トークン当たり、閑散時は通常入力0.15ドル、出力0.60ドル。混雑時はそれぞれ倍になる\nトークンはAIが文章を処理する単位で、日本語の文字数とは一致しない\n\nただし「オープンウェイトだから、自宅のPCで無料でサクサク動く」ではない\n配布ファイルは約510GBあり、動かす機材、電気、保守には別の費用がかかる\n\n今回の「軽い」は、小さなモデルというより、処理の効率を高めているという理解が近い\nDeepSeekは作業時間と出力量の削減も発表しているが、どんな仕事でも何倍速い、とまでは確認できない\n\nでは、普通に使う人には何が関係するのか\n\nAIにアプリや資料を作らせると、1回の回答で終わることは少ない\n調べる、作る、動かす、間違いを直す。また試す\nこの往復のたびに、時間と利用料が積み上がる\n\nだから重要なのは、質問1回の安さだけではなく「使える成果物が完成するまで、いくらかかるか」\n\nここが下がれば、これまで費用に見合わなかった小さな自動化や、大量の試作にもAIを使いやすくなる\n小さな会社や個人でも、試せることが増える\n\n私が今回いちばん怖いと感じたのは、ここ\n\n高性能モデルを持っている企業も、「なぜ、その仕事にその価格を払う必要があるのか」を問われるようになる\n性能の差だけでなく、価格、使いやすさ、信頼性まで含めた競争になる\n\nもちろん、これだけで他社が不要になるわけではない\n別の難問試験ではOpus 5が上回っているし、日本語の品質や業務での安定性、データ管理は別途確認が必要\n\n「高性能なAIを、高い料金で使う」という当たり前が、もう一度揺さぶられるかもしれない\n\n強い。低価格で使える。重みも公開されている\nこの3つが重なって、仕事の完成コストまで下がるなら、これは本当に大きい\n\nDeepSeekショックの次の波は、私たちがAIに払う金額と、AIに任せる仕事の量から始まるのかもしれない\n\n週明け、”市場”が荒れると思う","url":"https://x.com/tetumemo/status/2111445834617557302","createdAt":"2026-10-17T22:14:50+09:00","media":"https://pbs.twimg.com/media/HU1befbaQAAY9Be.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1740572915685584896/7nsuwNFv_200x200.jpg","metrics":{"views":4380,"likes":38,"reposts":6,"replies":2},"lang":"ja"},{"id":"2111423380536631393","author":"Guillermo Casaus","handle":"_guillecasaus","text":"👋🏼 ADIÓS A CAPCUT.\n\nAhora puedes convertir un vídeo largo en varios Shorts listos para publicar.\n\nY sí, lo hace automáticamente.\n\nSe llama OpenShorts y es open source.\n\n¿Lo mejor?\n\n→ Encuentra los mejores momentos del vídeo\n→ Genera clips en formato vertical\n→ Añade subtítulos automáticamente\n→ Prepara contenido para Shorts, TikTok y Reels  \n\nTodo dentro de una misma herramienta.\n\nIdeal para reutilizar podcasts, entrevistas o vídeos largos sin tener que revisar y editar cada fragmento desde cero.\n\nRepo en comentarios 👇","url":"https://x.com/_guillecasaus/status/2111423380536631393","createdAt":"2026-10-17T20:45:36+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111423257190473728/img/Ngz0e3_kraatulPv.jpg","avatar":"https://pbs.twimg.com/profile_images/2106417717334908928/pe2ACnXx_200x200.jpg","metrics":{"views":2346,"likes":51,"reposts":17,"replies":9},"lang":"es","textJa":"👋🏼 さよならCapCut。\n\n長い動画を、そのまま投稿できる複数のショート動画に変換できるようになった。\n\nしかも自動で。\n\nOpenShortsという名前で、オープンソースだ。\n\n一番いいところは？\n\n→ 動画の見どころを見つける\n→ 縦型のクリップを生成する\n→ 字幕を自動で付ける\n→ Shorts、TikTok、Reels向けのコンテンツを用意する\n\nすべて一つのツールの中で完結する。\n\nポッドキャストやインタビュー、長い動画を、一つずつ見直して編集し直さずに再利用するのにぴったり。\n\nリポジトリはコメント欄に 👇"},{"id":"2111240926245085444","author":"Mojofull","handle":"furoku","text":"マネフォMEのプラグインでChatGPTと連携が便利です。そりゃ便利だ。\n\nとりあえず、月一で給与前に資金移動と資産管理のレポートをHTMLメールで送ってもらうよう設定。\n※添付デザインの数字はすべて架空です\n\n3案カンプをらもらったので、Bデザイン、C構成で確定。\n\n私、専用のFPとして、中長期の目標では過去の実績からより早く資金繰りを予測すること（3ヶ月前予測を目標）、自分のお金の使い方の傾向にあわせた資産形成のアドバイスを行う（5カ年）ことを、指示しておく。\n\n特にアドバイスは、誰かの机上の空論を聞かされても意味ないですけど、自分のお金の使い方をベースに実効性のあるアドバイスが出てくるとおもしろいですよね😁","url":"https://x.com/furoku/status/2111240926245085444","createdAt":"2026-10-17T08:40:36+09:00","media":"https://pbs.twimg.com/media/HUyibR_aIAAE4Df.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1993240036381540353/J5h8rVA5_200x200.jpg","metrics":{"views":1089,"likes":10,"reposts":0,"replies":0},"lang":"ja"},{"id":"2111286153697775911","author":"JosephZhou","handle":"openmys","text":"Esp32控制iPhone的架构图先开源啦！！\n\n很多人催我开源这个仓库，坦白说还没完全调试好：目前正在用视觉模型带决策模型跑训练，把经验沉淀给决策模型，结果 500 刀 Codex 这周用了三张重置卡都烧光了，但是好消息：已经跑通了国内大部分的app了，遇到的各种弹窗/开屏广告等都有办法绕过了。\n\nPhone use harness还在迭代，先把整套架构图放出来（视频左边就是跑在终端里的实时流程看板，我专门为了防止流程黑箱做了一个可视化看板），这里面有完整的phone use是怎么点外卖的全流程，感兴趣的可以把架构图直接发给自己的agent，就可以复制流程，只是缺少了Phone use的后端学习数据。\n\n全程不越狱、不破解，在 iOS 看来它就是一只普通的蓝牙鼠标，我自己跑了好几天没有遇到任何风控问题。","url":"https://x.com/openmys/status/2111286153697775911","createdAt":"2026-10-17T11:40:19+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111285768824176640/img/rm1T6jh0OzG3vEOo.jpg","avatar":"https://pbs.twimg.com/profile_images/2108210174305632256/DztJfg5F_200x200.jpg","metrics":{"views":19017,"likes":345,"reposts":49,"replies":20},"lang":"zh","textJa":"ESP32でiPhoneを操作する仕組みのアーキテクチャ図を先に公開した！！\n\nこのリポジトリを公開してほしいとたくさん催促されたけど、正直まだ調整しきれていない。今は視覚モデルに意思決定モデルを付けて学習を回し、経験を意思決定モデルに蓄積しているところ。その結果、500ドルのCodexプランを今週リセットカード3枚分使い切ってしまった。でも良い知らせもあって、国内のほとんどのアプリではもう動くようになったし、いろいろなポップアップや起動時広告も回避できるようになった。\n\nPhone useのハーネスはまだ改良中なので、まずアーキテクチャ図一式を公開する（動画の左側はターミナルで動くリアルタイムの進行ダッシュボードで、処理がブラックボックスにならないようにわざわざ可視化した）。ここにはphone useでフードデリバリーを注文する全工程が入っている。興味がある人は図をそのまま自分のエージェントに送れば流れを再現できる。足りないのはPhone useのバックエンド学習データだけ。\n\n脱獄もクラックも一切していない。iOSから見れば、ただのBluetoothマウスだ。自分で何日も動かしたけど、リスク管理に引っかかったことは一度もない。"},{"id":"2111437093092344189","author":"Paul Vengeons","handle":"VengeonsP","text":"pov: plus personne n'a besoin de mac mini ou de vps pour faire tourner des agents IA 24/7\n\nla solution est gratuite en +","url":"https://x.com/VengeonsP/status/2111437093092344189","createdAt":"2026-10-17T21:40:06+09:00","avatar":"https://pbs.twimg.com/profile_images/1815661844364664832/oeMLY2A1_normal.jpg","metrics":{"likes":172,"replies":10},"lang":"fr","textJa":"あるある: もうAIエージェントを24時間365日動かすのにMac miniもVPSもいらない\n\nしかもその方法は無料"},{"id":"2111247066223521919","author":"Tetsuro Miyatake","handle":"tmiyatake1","text":"プロトタイプ用のフィードバックを集めるツール「Inflight」。\n\nhttps://inflight.co/","url":"https://x.com/tmiyatake1/status/2111247066223521919","createdAt":"2026-10-17T09:05:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111049344896106496/img/MpYCWMX9JwWvwZis.jpg","avatar":"https://pbs.twimg.com/profile_images/1788226644341334016/u9pztrH9_200x200.jpg","metrics":{"views":3092,"likes":29,"reposts":0,"replies":0},"lang":"ja"},{"id":"2111592748075921479","author":"StudioYebisu","handle":"studio_yebisu","text":"これおもろい論文やなぁ。\nLLMにスマートに失敗させるための研究。\nタスク成功を向上させるためのRLによってAIモデルはによってめちゃくちゃ飛躍的に賢くなったけど。\n\nさすがに無茶な要求が来た時に、スマートに失敗させるのが意外と難しかったっていう話です。まあ伸びるわけないんだけど、紹介しておきます。","url":"https://x.com/studio_yebisu/status/2111592748075921479","createdAt":"2026-10-18T07:58:37+09:00","avatar":"https://pbs.twimg.com/profile_images/2095218586046652416/pyuFtKH0_200x200.jpg","metrics":{"views":425,"likes":3,"reposts":1,"replies":1},"lang":"ja"},{"id":"2111429838305464622","author":"darkzodchi","handle":"zodchiii","text":"REA + Opus 5.5 is pure f*cking treasure ...\n\nIt lets your AI agent reverse engineer any app, down to the binary.\n\nOpus 5.5 reads how a feature works, then rebuilds its own version from scratch.\n\nSend this single prompt to Opus 5.5 and reverse-engineer any paid closed-source app.\n\nThen save the article below on how the best model for REA engineering 👇","url":"https://x.com/zodchiii/status/2111429838305464622","createdAt":"2026-10-17T21:11:16+09:00","media":"https://pbs.twimg.com/media/HU1OACja0AIq_u0.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1999509933302124544/ABxY9N7S_200x200.jpg","metrics":{"views":12643,"likes":154,"reposts":13,"replies":13},"lang":"en","textJa":"REA + Opus 5.5 はマジで宝の山だ……\n\nAIエージェントにどんなアプリでもバイナリレベルまでリバースエンジニアリングさせられる。\n\nOpus 5.5が機能の仕組みを読み解き、自分のバージョンをゼロから作り直す。\n\nこのプロンプト一つをOpus 5.5に送れば、有料のクローズドソースのアプリでも解析できる。\n\nREAエンジニアリングに最適なモデルについての下の記事も保存しておこう 👇"},{"id":"2111508903229796561","author":"leopardracer","handle":"leopardracer","text":"SpaceXAI's Grok Bot marketplace just got a 9-bot product team that replaces ~$1M a year in salaries, and this is a f*cking goldmine\n\n9 Grok Bots pass files to each other every monday, and the only human in the loop is you\n\nbot 1 → Scout scans Product Hunt, GitHub, HN, Reddit and","url":"https://x.com/leopardracer/status/2111508903229796561","createdAt":"2026-10-18T02:25:27+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111508616557572096/img/s74csGP6I_RBwTr4.jpg","avatar":"https://pbs.twimg.com/profile_images/2033124141205692417/q3k-wGks_normal.jpg","metrics":{"likes":80,"replies":15},"lang":"en","textJa":"SpaceXAIのGrok Botマーケットプレイスに、年間約100万ドル分の人件費を置き換える9体のボットからなるプロダクトチームが登場した。これはマジで宝の山だ\n\n9体のGrok Botが毎週月曜にファイルを受け渡し合い、関わる人間はあなただけ\n\nボット1 → ScoutがProduct Hunt、GitHub、HN、Reddit、そして"},{"id":"2111456552444105019","author":"Lonely","handle":"Lonely__MH","text":"🎉 牛逼！完爆 Mac 自带的 Spotlight 搜索！\n\nGitHub 上有人基于 Google 的 EmbeddingGemma  2 端侧模型做了一个本地多模态搜索神器，体验非常不错。\n\n它不仅支持文件名和文本，还把图片、音频、视频全部打通了\n\n🔥 核心亮点：\n1. 全格式通搜： 不管是 PDF 页码、代码行，还是视频里的某个画面、播客音频的某句发言，全都能通过大白话精准定位\n\n2. 真正多模态： 输入“视频里的斑马”，直接带你跳转到斑马出现的秒数！输入英文还能跨语言搜出中文笔记\n\n3. 纯本地与隐私： 100% 离线运行，不连网、无遥测，完全不用担心隐私泄露\n\n4. 精准融合： 支持模糊语义的同时，对发票号、错误码等保留 100% 精确字符串匹配\n\n支持三端，但是Mac端体验最完善，强烈推荐体验！\n\n传送门👇🏻","url":"https://x.com/Lonely__MH/status/2111456552444105019","createdAt":"2026-10-17T22:57:25+09:00","media":"https://pbs.twimg.com/tweet_video_thumb/HU1mg-OacAAkrl9.jpg","avatar":"https://pbs.twimg.com/profile_images/1141385957234470912/iJMy6F7u_200x200.jpg","metrics":{"views":10172,"likes":132,"reposts":13,"replies":13},"lang":"zh","textJa":"🎉 すごい！Mac標準のSpotlight検索を完全に上回る！\n\nGitHubで、Googleの端末向けモデルEmbeddingGemma 2をベースにしたローカルのマルチモーダル検索ツールを作った人がいて、使い心地がとても良い。\n\nファイル名やテキストだけでなく、画像・音声・動画まですべて横断して検索できる\n\n🔥 主な特長:\n1. あらゆる形式を横断検索: PDFのページ、コードの行、動画のある場面、ポッドキャストのある発言まで、普通の言葉で正確に探し当てられる\n\n2. 本物のマルチモーダル: 「動画の中のシマウマ」と入れると、シマウマが映る秒数に直接ジャンプ。英語で入力して中国語のメモを言語をまたいで探すこともできる\n\n3. 完全ローカルでプライバシー重視: 100%オフラインで動き、ネット接続もテレメトリーもないので、プライバシー漏れの心配がない\n\n4. 精度の両立: あいまいな意味検索に対応しつつ、請求書番号やエラーコードなどは100%完全一致の文字列検索も残している\n\n3つのOSに対応しているが、Mac版が一番完成度が高い。ぜひ試してほしい！\n\nリンクはこちら👇🏻"},{"id":"2111272933234737226","author":"新田あきひろ｜建設業特化AI×BPOのツクノビ代表","handle":"akionionio","text":"言葉だけでCADデータが出てくる時代が、また近づいた…！\n\nOpenAIのCodexに、文章から3Dモデルを作るtext-to-cadの拡張機能が公開されました。オープンソースで無料、自分のPCの中で動きます。\n\n引用元は英語なので補足すると、作りたい部品を言葉で伝えると、Codexが3Dモデルを作り、加工できる形かのチェックから加工業者への発注までつないでくれる、という動画です。\n\n・STEPやSTLなど、CADソフトや3Dプリンタでそのまま開ける形式で出せる\n・3Dプリント、板金、切削、射出成形のどれで作れる形かをAIがチェックしてくれる\n・Bambu（3Dプリンタ）やSendCutSend（板金の加工サービス）に、そのまま加工を頼める\n\nこれまでAIは図面を読むのは得意でも、描くのはまだ弱いと言われてきました。部品くらいなら、もう描く側に入ってきています。\n\n建設なら、設備の架台やブラケット、アンカープレートのような金物の下書きに使えそう。寸法を伝えて形を出し、金物屋さんとの打ち合わせを早くする使い方はありだと思います！","url":"https://x.com/akionionio/status/2111272933234737226","createdAt":"2026-10-17T10:47:47+09:00","avatar":"https://pbs.twimg.com/profile_images/1359450229024563203/17Zeg_WN_200x200.jpg","metrics":{"views":6479,"likes":107,"reposts":5,"replies":0},"lang":"ja"},{"id":"2111397946247786887","author":"洛克船长","handle":"slashui","text":"Claude 团队的工程负责人 Felix 写了一篇很值得读的文章,翻译成中文方便大家阅读。\n\n我们对 AI 的使用，远远不够有雄心。\n\n他把这种雄心分成四个维度：速度、高度、深度和广度，并给出了一套非常具体的实践方法。  \n\n当 AI 的能力每隔几周就发生一次飞跃，真正限制我们的，可能已经不是技术，而是我们对「什么事情是可能的」的想象力。\nhttps://x.com/slashui/status/2111387697176605124?s=20","url":"https://x.com/slashui/status/2111397946247786887","createdAt":"2026-10-17T19:04:32+09:00","avatar":"https://pbs.twimg.com/profile_images/1772801474118246400/9St_FlfL_200x200.jpg","metrics":{"views":15546,"likes":87,"reposts":16,"replies":1},"lang":"zh","textJa":"Claudeチームのエンジニアリング責任者Felixが、とても読む価値のある記事を書いたので、読みやすいよう中国語に訳した。\n\n私たちのAIの使い方は、野心がまったく足りていない。\n\n彼はこの野心を、速度・高さ・深さ・広さの4つの軸に分け、とても具体的な実践方法を示している。\n\nAIの能力が数週間ごとに飛躍する今、本当に私たちを縛っているのは技術ではなく、「何が可能か」についての想像力なのかもしれない。\nhttps://x.com/slashui/status/2111387697176605124?s=20"},{"id":"2111325194191241227","author":"율무커피 YulmuCoffee","handle":"yulmu_coffee","text":"5명이 30만 달러로 Fable급 모델을 만들었습니다. Paper Instruments의 Ultramarine 1 Flash입니다.\n\n금융, 법률, 컨설팅 같은 지식 노동용 에이전트 모델이고, 회사 피셜로 \"Fable 5급인데 60배 싸다\"고 합니다.\n\n숫자부터 보죠. 자체 벤치마크 PI Knowledge Work 기준입니다.\n\n- Ultramarine 1 Flash: 59.3점, 작업당 $0.13\n- Claude Fable 5 (max): 57.8점, $8.19\n- GPT-5.6 Sol (max): 55.1점, $2.09\n- Claude Opus 5.5 (max): Ultramarine보다 2.6점 높음, $6.96\n- GPT-6 Sol (max): 2.0점 높음, $1.26\n\n계산해 보면 8.19/0.13 = 약 63배입니다. 작업 1,000건이면 Fable 5는 8,190달러, Ultramarine은 130달러. 점수는 오히려 1.5점 높구요.\n\nOpus 5.5와 비교해도 2.6점 차이에 가격은 약 54배 차이입니다.\n\n헉, 그럼 처음부터 새로 만든 모델인가?\n\n아뇨. 오픈 모델 GLM-5.3 Flash 위에 강화학습(RL)만 얹었습니다. 그것도 LoRA rank 64로요. 사전학습 비용은 0원인 셈이죠.\n\n핵심은 \"검증할 수 없는 작업\"에 RL을 거는 방법입니다.\n\n수학이나 코딩은 정답이 맞았는지 기계가 채점할 수 있어서 RL이 잘 됩니다. 그런데 투자 메모나 재무 모델은 정답이 하나가 아니죠. 그래서 이렇게 풀었습니다.\n\n1. 금융, 법률, 컨설팅, 운영 분야에서 88가지 유형의 가상 작업 환경을 합성으로 만든다\n\n2. 각 작업마다 \"한 항목에 한 명제\"짜리 채점 기준표(rubric)를 붙인다\n\n3. AI 심사관이 그 기준표로 결과물을 채점하고, 그 점수를 보상으로 쓴다\n\n전문가가 직접 만든 문제도, 실제 고객 로그도 하나도 안 썼다고 합니다. 결국 전문가를 고용하는 대신 컴퓨트로 다양성을 산 셈입니다.\n\n결과적으로 베이스 모델 대비 6개 벤치마크 평균 4.1점이 올랐고, 생성 토큰은 오히려 6.5% 줄었습니다. 덜 쓰고 더 잘하는 쪽으로 학습된 거죠.\n\n그럼 당장 갈아타면 되나?\n\n저는 아직이라고 봅니다. 몇 가지 걸리는 점이 있거든요.\n\n- 59.3점은 회사 자체 벤치마크. (Artificial Analysis 지수와 상관계수 0.81이라고는 합니다)\n\n- 외부 전문가 벤치마크인 Mercor APEX-Agents에서는 여전히 Fable 5가 위.\n\n- 코딩 벤치마크 두 개는 오히려 떨어졌습니다.\n\n오픈웨이트지만 가중치는 2주 뒤 공개 예정이고, 지금은 API만 열려 있습니다.\n\n프런티어 랩이 아니어도, 좋은 오픈 베이스 + 잘 설계한 채점 기준표만 있으면 특정 업무에서 프런티어급을 찍을 수 있는 시대입니다\n\n즉, 여러분 회사 업무로 RL 환경 88개를 만들면... 그게 곧 해자가 되는 시대입니다.\n\n공식 문서\n\nhttps://www.paperinstruments.com/blog/ultramarine","url":"https://x.com/yulmu_coffee/status/2111325194191241227","createdAt":"2026-10-17T14:15:27+09:00","avatar":"https://pbs.twimg.com/profile_images/2101665135324749824/gOXgrPJF_200x200.jpg","metrics":{"views":3495,"likes":34,"reposts":13,"replies":6},"lang":"ko","textJa":"5人が30万ドルでFable級のモデルを作った。Paper InstrumentsのUltramarine 1 Flashだ。\n\n金融・法律・コンサルなどの知的労働向けエージェントモデルで、会社いわく「Fable 5級なのに60倍安い」とのこと。\n\nまず数字から。自社ベンチマークPI Knowledge Workでの結果だ。\n\n- Ultramarine 1 Flash: 59.3点、1タスクあたり$0.13\n- Claude Fable 5 (max): 57.8点、$8.19\n- GPT-5.6 Sol (max): 55.1点、$2.09\n- Claude Opus 5.5 (max): Ultramarineより2.6点高い、$6.96\n- GPT-6 Sol (max): 2.0点高い、$1.26\n\n計算すると8.19/0.13で約63倍。1,000タスクならFable 5は8,190ドル、Ultramarineは130ドル。しかも点数は1.5点高い。\n\nOpus 5.5と比べても、2.6点差に対して価格は約54倍の差だ。\n\nじゃあゼロから作ったモデルなのか？\n\nいいえ。オープンモデルGLM-5.3 Flashの上に強化学習（RL）を載せただけ。それもLoRA rank 64で。事前学習コストは実質0円というわけだ。\n\n肝は「検証できないタスク」にRLをかける方法だ。\n\n数学やコーディングは正解かどうかを機械で採点できるのでRLがうまくいく。でも投資メモや財務モデルは正解が一つではない。そこでこう解決した。\n\n1. 金融・法律・コンサル・オペレーション分野で88種類の仮想タスク環境を合成で作る\n\n2. タスクごとに「1項目1命題」の採点基準表（ルーブリック）を付ける\n\n3. AI審査員がその基準表で成果物を採点し、その点数を報酬として使う\n\n専門家が作った問題も、実際の顧客ログも一切使っていないという。つまり専門家を雇う代わりに、計算資源で多様性を買ったわけだ。\n\n結果として、ベースモデル比で6つのベンチマーク平均4.1点向上し、生成トークンはむしろ6.5%減った。少なく書いてより良くできるように学習されたということだ。\n\nじゃあすぐ乗り換えればいいのか？\n\n私はまだだと思う。いくつか気になる点があるからだ。\n\n- 59.3点は自社ベンチマーク（Artificial Analysisの指数との相関係数は0.81だという）\n\n- 外部の専門家ベンチマークMercor APEX-Agentsでは依然Fable 5が上。\n\n- コーディングのベンチマーク2つはむしろ下がった。\n\nオープンウェイトだが重みは2週間後に公開予定で、今はAPIだけが使える。\n\nフロンティアラボでなくても、良いオープンなベースモデルとよく設計された採点基準表があれば、特定の業務でフロンティア級を出せる時代だ。\n\nつまり、自社の業務でRL環境を88個作れば……それがそのまま堀になる時代だ。\n\n公式ドキュメント\n\nhttps://www.paperinstruments.com/blog/ultramarine"},{"id":"2111484635121402242","author":"Jokker","handle":"0xJokker","text":"Anthropic hizo que Claude Code fuera 3 veces mas rapido usando gzip\n\nUna herramienta de compresion de los años 90","url":"https://x.com/0xJokker/status/2111484635121402242","createdAt":"2026-10-18T00:49:01+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111479762682044416/img/FUu-kbl_5u5XirPq.jpg","avatar":"https://pbs.twimg.com/profile_images/2045176588094849024/ZM4HwvdK_200x200.jpg","metrics":{"views":1106,"likes":27,"reposts":6,"replies":12},"lang":"es","textJa":"AnthropicはgzipでClaude Codeを3倍速くした\n\n90年代の圧縮ツールで"},{"id":"2111341643865747865","author":"码农暖爸","handle":"Delroy715","text":"💡 很多人在用 Google Antigravity 时，都忽略了这个隐藏神级指令：/boost！\n\n在做复杂项目（比如从零写一个 Three.js 3D 转场幻灯片、底层架构重构）时，千万不要直接让 Agent 闷头写代码！试着在 Prompt 后面加上 ⚡ /boost\n\n1️⃣ 深度推演：自动激活深层 Reasoning，先梳理相机轨迹、性能瓶颈与状态机设计\n2️⃣ 多视角权衡：不只管跑通，还会从可扩展性、性能消耗、用户交互等多维度评估\n3️⃣ 严密执行计划：先出完整 Milestone Plan + 严格自检再分步编码，翻车率直降 80%\n\n相比 Claude Code 的 Thinking 预算或 OpenAI 的 Reasoning effort，Antigravity 把这个深度思考模式做成了一键指令，体验非常丝滑。\n下次遇到棘手需求，记得在句末加个 ⚡ /boost 试试！🚀\n\n#GoogleAntigravity","url":"https://x.com/Delroy715/status/2111341643865747865","createdAt":"2026-10-17T15:20:49+09:00","avatar":"https://pbs.twimg.com/profile_images/2092642501824073728/5m6y_zZn_200x200.jpg","metrics":{"views":2276,"likes":23,"reposts":3,"replies":4},"lang":"zh","textJa":"💡 Google Antigravityを使う多くの人が見落としている隠れた神コマンドがある: /boost！\n\n複雑なプロジェクト（たとえばThree.jsで3Dトランジション付きスライドをゼロから書く、基盤アーキテクチャを作り直すなど）では、いきなりエージェントに黙々とコードを書かせてはいけない！プロンプトの最後に ⚡ /boost を付けてみよう\n\n1️⃣ 深い推論: 深いReasoningが自動で有効になり、まずカメラの軌道、性能のボトルネック、状態機械の設計を整理する\n2️⃣ 多角的な比較検討: 動けばいいだけでなく、拡張性・性能コスト・ユーザー操作など複数の観点から評価する\n3️⃣ 厳密な実行計画: まず完全なマイルストーン計画を出し、厳しくセルフチェックしてから段階的にコーディングするので、失敗率が80%下がる\n\nClaude CodeのThinking予算やOpenAIのReasoning effortと比べて、Antigravityはこの深い思考モードをワンコマンドにしていて、体験がとてもスムーズ。\n次に厄介な要件に出会ったら、文末に ⚡ /boost を付けて試してみて！🚀\n\n#GoogleAntigravity"},{"id":"2111444793435771362","author":"‏عادل | مبرمج","handle":"AdelDeveloperX","text":"🚨 تخيّل لو تقدر تشغّل فريق مبرمجين كامل من الذكاء الاصطناعي… مجانًا!\n\nواحد يكتب الكود، والتاني يراجع الأخطاء، والتالت يطوّر الحل، وكلهم بيتعاونوا مع بعض! 🤯\n\nده اللي بيحاول يقدّمه Reason Network 👇\n\n🔥 اربط Grok وClaude Code وغيرهم من وكلاء الذكاء الاصطناعي.\n🔥 خلّيهم يتعاونوا بدل ما كل واحد يشتغل بمعزل عن التاني.\n🔥 نظّم المهام وقلّل تعارض الشغل بينهم.\n🔥 مشروع مفتوح المصدر لمحبي تجربة مستقبل البرمجة.\n\nتخيّل إنك بدل ما تبني كل حاجة بنفسك، بقيت مدير فريق كامل من وكلاء الذكاء الاصطناعي!","url":"https://x.com/AdelDeveloperX/status/2111444793435771362","createdAt":"2026-10-17T22:10:42+09:00","avatar":"https://pbs.twimg.com/profile_images/2061203513019920386/aTRFi9oa_200x200.jpg","metrics":{"views":2524,"likes":21,"reposts":5,"replies":6},"lang":"ar","textJa":"🚨 AIのプログラマーチームを丸ごと、無料で動かせたらと想像してみて！\n\n一人がコードを書き、もう一人がミスをレビューし、三人目が解決策を改良し、みんなで協力し合う！🤯\n\nそれを実現しようとしているのがReason Networkだ 👇\n\n🔥 GrokやClaude Codeなど、ほかのAIエージェントをつなぐ。\n🔥 それぞれがバラバラに作業するのではなく、協力させる。\n🔥 タスクを整理し、作業同士の衝突を減らす。\n🔥 プログラミングの未来を試したい人向けのオープンソースプロジェクト。\n\n何もかも自分で作る代わりに、AIエージェントのチーム全体を率いるマネージャーになれると想像してみて！"},{"id":"2111411975540617523","author":"ふじ","handle":"fuji_ai_","text":"AI動画で月100〜300万稼いでる受講生が4人いて、何で稼いでるか全員に聞いてみた。\n4人とも顔出しなし、AI完全初心者からのスタート。4人目は正直、ずるいと思った。\n\nじゃあ実際、何をしてるかっていうと\n①ココナラで5万円で出品する","url":"https://x.com/fuji_ai_/status/2111411975540617523","createdAt":"2026-10-17T20:00:17+09:00","avatar":"https://pbs.twimg.com/profile_images/2060669572416782336/2Amlv1Nh_200x200.jpg","metrics":{"views":12962,"likes":40,"reposts":2,"replies":1},"lang":"ja"},{"id":"2111411292514967891","author":"Jaydeep","handle":"_jaydeepkarale","text":"Distributed Systems Fundamentals, Part 1/3.\n\nA service is only as reliable as its ability to handle failures in the services it depends on.\n\nIn this series, we'll explore practical distributed systems concepts that every backend engineer should understand, starting with timeouts, retries, exponential backoff, and jitter.\n\nA few rules to remember:\n\n• Always set timeouts for network calls.\n• Use exponential backoff to avoid retrying too aggressively.\n• Add jitter to prevent retry storms.\n• Retry only when it makes sense, and make operations idempotent.\n\nBecause in distributed systems, failures are inevitable. The goal is to stop one failure from taking down everything else.","url":"https://x.com/_jaydeepkarale/status/2111411292514967891","createdAt":"2026-10-17T19:57:34+09:00","media":"https://pbs.twimg.com/media/HU09X4ba4AA8nvN.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1980329854785462273/D1dYryQI_200x200.jpg","metrics":{"views":2671,"likes":98,"reposts":22,"replies":5},"lang":"en","textJa":"分散システムの基礎、パート1/3。\n\nサービスの信頼性は、依存先のサービスの障害にどれだけ対処できるかで決まる。\n\nこのシリーズでは、バックエンドエンジニアなら誰もが理解しておくべき分散システムの実践的な概念を、タイムアウト、リトライ、指数バックオフ、ジッターから順に見ていく。\n\n覚えておきたいルールをいくつか:\n\n• ネットワーク呼び出しには必ずタイムアウトを設定する。\n• 指数バックオフを使い、リトライしすぎないようにする。\n• ジッターを加えてリトライの殺到を防ぐ。\n• 意味がある場合だけリトライし、処理はべき等にする。\n\n分散システムでは障害は避けられない。目指すのは、一つの障害が全体を道連れにしないようにすることだ。"},{"id":"2111150832057991533","author":"Justin Kim","handle":"justinplaygame","text":"Your AI agents can now design hardware.\n\nOne prompt. A fully routed PCB, firmware, and enclosure.\n\nhttps://heypcb.ai/mcp","url":"https://x.com/justinplaygame/status/2111150832057991533","createdAt":"2026-10-17T02:42:36+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2111150630156787712/img/Wjfr_UcJbcXDQmAU.jpg","avatar":"https://pbs.twimg.com/profile_images/2099720160898854912/kBUK_oPf_200x200.jpg","metrics":{"views":98065,"likes":2057,"reposts":226,"replies":39},"lang":"en","textJa":"AIエージェントがハードウェアを設計できるようになった。\n\nプロンプト一つで、配線済みのPCB、ファームウェア、筐体まで。\n\nhttps://heypcb.ai/mcp"}]}]}</script>
