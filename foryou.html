cs":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","autho ked 535,000 lines of production code, rewritten in eleven days instead of the close-to-a-year a manual rewrite would have taken. not cheap. just faster","url":"https://x.com/rvaniaaaa/status/2103971317431378284","metrics":{"views":1494,"likes":21}},{"id":"2103824425187713476","author":"Akshay 🚀","handle":"akshay_pachaar","text":"This is huge. Xiaomi just open-sourced 7k+ reinforcement learning task environments used to train MiMo, covering code, cybersecurity, general tool use, visual web development, and music-related tasks. here's why this matters more than another model release: open weights let","url":"https://x.com/akshay_pachaar/status/2103824425187713476","metrics":{"views":46688,"likes":422}},{"id":"2103781676358778900","author":"fleyta","handle":"fleyta88","text":"Jev engineers just released a PDF on building a Jev harness for coding agents this is a clean blueprint for making agents faster, cheaper and easier to control. 1. jev picks which files, model and route to use 2. the frontier model only handles the work that actually needs","url":"https://x.com/fleyta88/status/2103781676358778900","metrics":{"views":4157,"likes":53}},{"id":"2103968507859775689","author":"marfin","handle":"marfinxx","text":"Jev Founder, Diogo Almeida, just revealed how to properly use Jev with LLMs at a conference It powers Agent Lifespan Engineering and is more useful than most paid AI courses: this is a 10-step blueprint on how to build a faster, cheaper and more controllable AI system around","url":"https://x.com/marfinxx/status/2103968507859775689","metrics":{"views":770,"likes":20}},{"id":"2103895408795689397","author":"kozh ./","handle":"mr_kozh","text":"HOLY SH*T, OPENAI BUILT 1,000,000 LINES OF CODE WITH ZERO WRITTEN BY HUMANS. 3 engineers. 1,500 pull requests. 5 months. roughly 1/10 of the usual development time. but the breakthrough wasn’t a smarter coding model. it was the system surrounding it. the agents still","url":"https://x.com/mr_kozh/status/2103895408795689397"," <script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 let current=accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=read('lang')==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const posts=()=>{const list=Array.isArray(current.posts)?current.posts:[];return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(list.length<50?'取得済み'+list.length+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
</body>
</html>
