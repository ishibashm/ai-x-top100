createdAt":"2026-10-29T10:47:02Z","metrics":{"views":18654,"likes":172},"lang":"ja"},{"id":"2115897834881089566","author":"あきらパパ【生成AI活用エンジニア\u0026３児のパパ】","handle":"akira_papa_IT","text":"【Three.jsをこれから学ぶ方向けのUdemy講座「AIと学ぶThree.js入門：月の満ち欠けを3D模型で説明するサイトを公開準備まで作る」を公開しています🌙】\n\nAIに頼めば、3Dのコードはすぐ出てきます。\nでも、どこが変わったのか分からないまま進むと、自分で直せなくなりがちです。\n\nこの講座では、AIへ小さく変更を頼み、差分を確かめながら、月の満ち欠けを説明する3D模型サイトを作っていきます。\n\n【この講座で学べること】\n・Three.js初級と、月の満ち欠けの3D模型づくり\n・企画と画面設計\n・AIへの小さな変更依頼と差分確認\n・操作とクイズのしくみ\n・スマホ幅エミュレーションでの表示確認\n・ビルドと公開準備\n\n【こんな方におすすめです】\n・JavaScript／HTML／CSSの初歩と、ターミナルの基礎が分かる方\n・AIの出したコードを、確かめながら使えるようになりたい方\n・学んだことを、形のあるサイトにしてみたい方\n\n全24講義・5時間6分。\nPDF24冊と、演習用の開始／完成ZIPを48個用意しました📚\n\nAIの使用は任意です。\n実際の公開作業の代行や、実機での動作保証は講座の範囲外です。\n音声の一部に、講師本人の声をもとにした合成音声を使っています。\n\n👉 https://t.co/4VJNjHUxDr\n\nまずは講座ページだけでも、のぞいてみてください。\n月の満ち欠けを、自分の手で動かして説明できるサイトにしていきましょう🙌\n\n#ThreeJS #Udemy #生成AI","url":"https://x.com/akira_papa_IT/status/2115897834881089566","createdAt":"2026-10-29T20:05:29Z","metrics":{"views":696,"likes":2},"lang":"ja"},{"id":"2115852492558995861","author":"松丸 彗吾(keigo matsumaru)","handle":"k_matsumaru","text":"は！？！？\nChatGPT/Codexの全Proプランの利用枠倍！？！？\n\nつまり\n100 = 10倍\n200 = 20倍\n500 = 50倍ってこと？\n\n200プランはこれ元に戻ったってだけだよね？\nこれ相対的に100プランめっちゃお得になってないか？\n\nしかもdotsの利用無制限は維持とか太っ腹だなー","url":"https://x.com/k_matsumaru/status/2115852492558995861","createdAt":"2026-10-29T17:05:19Z","metrics":{"views":83800,"likes":449},"lang":"ja"},{"id":"2115737924520260082","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝使い回していたパスワード710件を、3週間でゼロにした人のやり方が、そのまま手順書になる\n\nクロカワリュートさんのX記事によると、使っていたサービスで不正アクセスが見つかり、見直したら同じパスワードを710か所で使っていたとのこと\n\nやったこと\n1. パスワードは全部1Passwordに入れ、ランダムな文字列に。覚えるのはマスターパスワード1つ\n2. Chromeに保存されていた1,000件以上を取り込み、使っていないサービスは退会。残したのは120件\n3. SMS認証をやめて、認証アプリとパスキーへ\n4. 各サービスの「ログイン中のデバイス」を確認。知らない接続が850件残っていたサービスもあった\n5. スマホを失くしても困らないよう、復旧用の紙と物理キーを2本用意\n\n結果\n・使い回しパスワード：710→0\n・漏れていたパスワード：145→0\n・アカウント：535→120\n\n1PasswordのWatchtowerが「漏れている」「使い回し」「弱い」を一覧にしてくれるので、上から潰していけば迷わないのが良い","url":"https://x.com/tetumemo/status/2115737924520260082","createdAt":"2026-10-29T09:30:04Z","metrics":{"views":33661,"likes":527},"lang":"ja"},{"id":"2115655443427246497","author":"数理の弾丸 / 船蔵颯 Ph.D.","handle":"_mathbullet","text":"pstackもub-modeも Matt Pocock Skillsも入れて使うのは良いと思うけど、使いながらでも、後追いでも何が書かれていて何やってるのかを理解して、さらにはその先、つまり状況に合わせて・目的に合わせて改善を考えられるように使い手側が成長する前提でないと、与えられた使い方しかできない、ただ凄い人のスキルを取り入れてるだけの人になる","url":"https://x.com/_mathbullet/status/2115655443427246497","createdAt":"2026-10-29T04:02:19Z","metrics":{"views":943,"likes":11},"lang":"et"},{"id":"2115678154149015921","author":"えっぐ","handle":"eggAIeguite","text":"Claude Code AI会社で月300万稼ぐ意識低い系ニートの日常はガチでこんなもん。\n\nもうとっくにAIに稼がせる時代になってるんよ。ワイがスマホでドパガキしてる間にAI社員が勝手に仕事して4つのスモビジが回る。\n\n入り口は今一番アツイClaude Code×TikTokアフィ一択。1日10分で初月30万くらいはサクッといけちゃうクソ穴場の金脈。","url":"https://x.com/eggAIeguite/status/2115678154149015921","createdAt":"2026-10-29T05:32:34Z","metrics":{"views":59506,"likes":328},"lang":"ja"},{"id":"2115800986547785935","author":"ゆうすけ","handle":"yusuke_kizuna","text":"オープンソースの軽量LLMであるLFM3-Audio-2Bで通訳アプリを試作してみました！\nこれくらいのレイテンシーで通訳してくれる感じで、かなり可能性を感じるモデルだなぁ....","url":"https://x.com/yusuke_kizuna/status/2115800986547785935","createdAt":"2026-10-29T13:40:39Z","metrics":{"views":6427,"likes":133},"lang":"ja"},{"id":"2115901008786395179","author":"uehaj","handle":"uehaj","text":"poteto 氏を信用している人は信用できる。\n\n最近の E2E 戦略（2026 年 10 月現在）｜Tatsunori Nakano","url":"https://x.com/uehaj/status/2115901008786395179","createdAt":"2026-10-29T20:18:06Z","metrics":{"views":5770,"likes":95},"lang":"ja"},{"id":"2115781954666938752","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"あ、これClaude Codeに動画編集を任せるなら1番やばいやつだわ。。。。。\n\nたった1つのコマンド\n→ npx ffmpeg-skill\n→ 無音カット・字幕・縦型9:16への変換・音量そろえなど42の編集ツールがClaude Codeに入る\n→ 全部手元のffmpegで動くので、クラウドもAPIキーも要らない\n\n海外の作者が無料公開していて、GitHubスター3,676・MITライセンス。編集のたびにClaudeが自分の出力を確かめる決まりつき。\n\nやり方はシンプル👇\nターミナルで「npx ffmpeg-skill」と打ってから、Claude Codeに「この動画の無音を切って縦型にして」と頼むだけ。\n\n調べる→編集→確かめるの順をスキルが固定しているので、やり直しが減る仕組みになっている。\n\n知ってるか知らないかで、動画1本にかかる時間が変わる🔥\n\n42のツールはどれもMCPからも呼べる。MCPでつながる道具なら、ffmpeg以外でも同じように頼める。\nClaudeにつなげられる道具＝MCPサーバー30選の記事も置いておく👇","url":"https://x.com/ClaudeCode_love/status/2115781954666938752","createdAt":"2026-10-29T12:25:01Z","metrics":{"views":38345,"likes":583},"lang":"ja"},{"id":"2115872777660141771","author":"Morlex","handle":"0xMorlex","text":"SpaceXAI engineers just showed the 14 best Grok Bot agents they actually use to automate their work\n\n45 minutes of real workflows, from personal assistants to autonomous engineering teams:\n\n0% → 1:23 - Chief of Staff bot that manages your daily tasks\n15% → 6:31 - PM, designer and engineer bots working together\n30% → 12:43 - Figma bot that turns one keyframe into a full design\n50% → 17:59 - Dr. Eggbot that builds and audits your other bots\n65% → 25:22 - engineering lead bot that manages entire agent swarms\n80% → 32:34 - social bots that turn X feedback into engineering tasks\n100% → 38:59 - turn skills into routines and give agents more autonomy\n\nmost people still use one chatbot for everything. these engineers built something different - 24/7 bots with their own memory, skills and tools, working together to design, code, test and even merge PRs\n\nwatch the full breakdown, then start building your own team of bots ↓","url":"https://x.com/0xMorlex/status/2115872777660141771","createdAt":"2026-10-29T18:25:55Z","metrics":{"views":28991,"likes":354},"lang":"en"},{"id":"2115591756100280342","author":"斧口智彦🫠","handle":"axecm","text":"いやMuseヤバいって。\nやってることは株価や指数の変動や開示のスクレイピングと自動プッシュなんだけど、証券会社の有料ツールとかでやらないとできなかったことが容易に実現できてしまう…。\ndotsや他のAIツールだと月1万超えのプランじゃないと満足にできないのに…無料だと…？？😇 https://t.co/3cVV3cKFjk","url":"https://x.com/axecm/status/2115591756100280342","createdAt":"2026-10-28T23:49:15Z","metrics":{"views":259843,"likes":2071},"lang":"ja"},{"id":"2115777921252016477","author":"べーた","handle":"foodloss_otoko","text":"AI×FXをやってる人、\n海外のGitHub漁ってたらまた面白いの出てきたｗ\n\n1.stock-analyst / VYNN AI\n\nAIに企業分析をほぼ丸投げできる。\n例えば、\n「NVIDIAを分析して」\nと聞くだけで、\n\n・財務データ\n・ニュース\n・テクニカル\n・企業価値\n・リスク\n\nなどをまとめて分析。\nさらにExcelの財務モデルや\n長い分析レポートまで作れる。\n“AIアナリストを1人雇う”\nみたいな方向にかなり近い。\n\nhttps://t.co/AVK8jYHVYN\n\n2.Mira\n\nAIに投資仮説を管理させる。\n普通のAIは、\n「この株どう思う？」\nで回答して終わり。\nMiraは、\n\n・なぜ買うのか\n・その根拠は何か\n・何が起きたら考えを変えるか\n・新しいニュースで仮説は変わったか\n\nまで追い続ける。\nつまり、\nAIに自分の投資ノートを育てさせる感じ。\n\nhttps://t.co/vuvo4jWKoG\n\n3.OpenTrade\n\nClaudeやCodexに実際の取引環境を持たせる。\nAIに、\n「市場を監視して」\n「この条件が来たら動いて」\n「この戦略を管理して」\nみたいな役割を持たせられる。\nさらに、\n\n・注文前の承認\n・取引上限\n・監視条件\n・複数AIの分業\n\nなども設定できる。\n海外はもう\n“AIに聞く”から\n“AIに動かせる”まで進んでる。\n\nhttps://t.co/UHY5cNXDkN\n\n4.Condor\n\nスマホからAIトレーダーを管理する。\nTelegramから、\n\n・資産確認\n・ポジション確認\n・BOT管理\n・注文\n・AIへの指示\nなどができる。\nさらにAIエージェントに\n戦略やリスク条件を持たせて\n繰り返し相場を見させることもできる。\n\nhttps://t.co/JYEiSbKw3z\n\n5.financial-research-analyst-agent\n\n11人のAIに1銘柄を分析させる。\nAIごとに、\n・企業業績\n・ニュース\n・市場心理\n・マクロ\n・競合\n・バリュエーション\n・リスク\nなどを分担。\n\nさらにモンテカルロや\nポートフォリオ分析までできる。\n1人のAIに全部やらせるより\nかなり本格的。\n\nhttps://t.co/JlEyQynz5H\n\n6.Stock-Analysis-Agent\n\nAIに“調査→検証”までやらせる。\n株価データを読み込んで、\n\n・テクニカル分析\n・ニュース確認\n・リスク確認\n・簡易バックテスト\n\nまでまとめて行う。\nAIにいきなり\n「買い？売り？」\nと聞くんじゃなく、\nデータを計算してからAIに説明させる\nという作りが面白い。\n\nhttps://t.co/yJNvSTruVl\n\n7..financial-analysis-agent\n\nAIの予想を後から答え合わせする。\nテクニカル\n↓\nファンダ\n↓\nニュース\n↓\nAI分析\nまでやって終わりじゃない。\n出した予想を保存して、\n「結局その後どうなった？」\nまで後から評価する。\nAIの回答を\n言いっぱなしにしないのが面白い。\n\nhttps://t.co/lgwBffSRzx\n\n8. ai_stock_agent\n\n大量の銘柄から候補をAIに探させる。\n監視銘柄をまとめて入れて、\n・トレンド\n・勢い\n・値動き\n・ニュース\n・リスク\nをチェック。\nその中から\n\n「今見る価値がある銘柄」\nを絞ってくれる。\n何十銘柄も\n自分で確認してる人には便利そう。\n\nhttps://t.co/hFLgaZhpqs\n\n9.awesome-finance-agents\n\nAI×金融ツールを探すための巨大まとめ。\nこれは1つのツールじゃなく、\n\n・投資リサーチ\n・トレード\n・バックテスト\n・リスク管理\n・個人資産管理\n・AIエージェント\n\nなどのオープンソースを\nまとめて探せるリスト。\n新しいAI×金融ツールを探すなら\nここから掘るだけでも時間溶けるｗ\n\nhttps://t.co/TrNz8a1YDl\n\n10.awesome-open-source-trading\n\n自動売買・クオンツ系ツールの巨大図鑑。\n\n・バックテスト\n・自動売買\n・オプション\n・予測市場\n・AIエージェント\n・市場データ\n\nなど、\n450以上のオープンソース系プロジェクト\nが整理されてる。\n「海外では今何作られてる？」\nを見るだけでも普通に面白い。\n\nhttps://t.co/ENwFHsbaL8\n\nこれをブックマークして、今日から始めよう。","url":"https://x.com/foodloss_otoko/status/2115777921252016477","createdAt":"2026-10-29T12:09:00Z","metrics":{"views":13600,"likes":207},"lang":"ja"},{"id":"2115621902958170125","author":"Hux","handle":"huxlab","text":"认识一个在 Anthropic 做研发的朋友，年薪 150 万刀。\n\n我问她是怎么把 Claude 调教到极致的\n\n她直接甩给我一段 30 分钟的内部录屏，原本不对外公开。\n\n毫不夸张，这绝对是全网含金量最高的 Claude 实操资料之一。\n\n昨晚看到一半，我后背发凉： \n\n过去两年我写提示词的方式，从底层逻辑上就全错了。\n\n看完后，我提炼出 5 条Anthropic 内部正在用的核心法则：\n\n1. 用 XML 严格隔离语义块：如果你肉眼都分不清数据、业务政策与角色边界，模型只会更混乱，严禁把所有规则揉成一坨大段文本。\n\n2. 定期清理旧模型的“防御性补丁”：新模型遵循能力极强，遗留的历史负向限制会导致过度拟合，反而把上下文已有的正确信息死扣不给。\n\n3. 指令无法凭空赋予模型能力：在 Prompt 里加粗强调“务必算准”没有任何意义，复杂运算必须果断剥离给 Tool Calling 代码执行。\n\n4. 业务权衡必须给全博弈天平的两端：只灌输单向操作成本会让模型极端避险，必须同时给出违约后果与潜在损失，才能激活高智力模型的正确权衡。\n\n5. 用“生成-评估-修复”闭环取代单体巨型 Prompt：复杂强约束任务拆成三步轻量流水线，不仅 Token 消耗与延迟直接腰斩，还能动态兼容运行时软约束。\n\n建议直接收藏，今晚就花半小时看完，认知彻底重置。","url":"https://x.com/huxlab/status/2115621902958170125","createdAt":"2026-10-29T01:49:02Z","metrics":{"views":253486,"likes":3460},"lang":"zh"},{"id":"2115742368829939864","author":"ミノ駆動","handle":"MinoDriven","text":"本日の登壇資料はこちら！（ﾃﾞﾝｯ\n\nAIが生成したコードは読むべきか？抽象化設計とコードの品質保証","url":"https://x.com/MinoDriven/status/2115742368829939864","createdAt":"2026-10-29T09:47:43Z","metrics":{"views":48072,"likes":821},"lang":"ja"},{"id":"2115684745669718278","author":"春日部彼得","handle":"crbpite8","text":"我给Grok Bot充了78美元，就定好一条规矩：只有好几个顶级钱包一起买的时候，我才跟着买。\n\n只要机器人看到7个头部地址同时买入同一个币，它就自动跟着下单。\n\n就一个晚上，78美元变成了2067美元。\n\n不少人都说跟单很容易亏钱，道理很简单：\n只跟着一个钱包操作，再厉害的人，都有一半概率判断错。\n\n所以我早就不做只跟单一个钱包的模式了。\n\n我的Grok Bot整夜盯着Fomo榜单前十的顶级钱包：\n单独一个钱包买入，直接无视；\n一旦有4、5、6、7个头部钱包一起重仓某个币，马上进场。\n\n当晚的交易记录：\n→ 22:19 4个顶级钱包一起买入，自动跟单，持仓1.02 SOL\n→ 00:39 6个顶级钱包一起买入，自动跟单，持仓1.30 SOL\n→ 03:00 7个顶级钱包一起买入，自动跟单，持仓1.72 SOL\n→ 06:50 7个顶级钱包一起买入，自动跟单，持仓1.58 SOL\n\n机器人也会看盘面热度，它选的这些币，一小时涨了26%-47%。\n\n我不想抢最早的低价，主要是不单独冲进去，不逆势接盘。\n\n那些头部钱包开始卖的时候，机器人也跟着卖出止盈。\n\n一晚上赚的都是一笔笔小钱：+36、+29、+16、+11、+9美元，慢慢攒起来利滚利。\n\n运行的时候六个智能体自己沟通、自己做决定，每一步都有记录：\n→ 涨到47%，卖掉一半保住利润\n→ 成交量翻三倍，再加一点仓位\n→ 项目方手里有11%的币，风险太大，不碰\n→ 看到项目方钱包有异常动作，不让进场\n\n早上七点我回头看，整套流程全自动跑完，我什么都不用管。\n\n一共跟单49次，胜率73.5%，赚了50笔，亏了18笔。\n\n钱一点点涨上来：\n78美元 → 115美元 → 268美元 → 602美元 → 1035美元 → 2067美元\n\n前5小时赚到400美元，之后不到4小时，直接突破2000美元。\n\n我自己在用的跟单机器人：\nhttps://t.co/lKnFv5487L\n\n单独一个钱包难免看错，但是凌晨三点，七个顶级聪明钱一起重仓一个币，不容易踩坑。\n\n之后有人来推只跟单一个地址的机器人，你直接拿这个思路回复他。可以保存下来！","url":"https://x.com/crbpite8/status/2115684745669718278","createdAt":"2026-10-29T05:58:45Z","metrics":{"views":52676,"likes":321},"lang":"zh"},{"id":"2115623000779423990","author":"asahi","handle":"ashunar0","text":"Cloudflare はなんでこんなに無料で使わせてくれるの？ https://t.co/Pe2CAeM10w\n\nまさか無料ユーザーが多いほど儲かる仕組みがあるとは思わなかった","url":"https://x.com/ashunar0/status/2115623000779423990","createdAt":"2026-10-29T01:53:24Z","metrics":{"views":152079,"likes":1382},"lang":"ja"},{"id":"2115806117188325613","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに「デザインの責任者」という肩書きを付けたら、Figmaを使わなくなった人がいた\n\nFelix Leeさんは、人を雇わずにGrok Botを1つ作って「チーフデザインエンジニア」と名付けた\n先週は、データから2つのデザインの問題を見つけて改善し\n・プラットフォームのエンゲージメントが+22%\n・トラフィックが+10%\n\n毎週やってくれること\n1. 分析で見つけた離脱ポイントを、承認用のデザイン1案にしてPaperに出す\n2. よくできたアプリを研究して、何が効いているかを調べる\n3. アイデアは全部、問題と直し方をセットでLinearに書く\n4. 「もう十分良い」と教えてくれるので、磨きすぎない\n5. 本人が選ぶまで、何も公開しない\n\n「魔法じゃない。イマイチな案もあるし、そう伝える。私は選ぶだけ」とのこと\n任せるのは作業で、決めるのは自分\nこの線引きが、いちばんマネしたいところ","url":"https://x.com/tetumemo/status/2115806117188325613","createdAt":"2026-10-29T14:01:02Z","metrics":{"views":2621,"likes":14},"lang":"ja"},{"id":"2115997788819657026","author":"大賀 愛一郎 (oga_aiichiro)","handle":"oga_aiichiro","text":"AIの日本語を推敲するスキル『yomiyasu (よみやす) 』\nv2.5.0 をリリースしました！🎉\n\n「この関数は呼び出し元の事情を知っています」のような コードの説明に混ざる擬人化を、コードから分かる動作で書き直します。\n\nAIの文章によく出る言い回しにも対応！\n今すぐ使えます٩( ๑^ ꇴ^)۶ https://t.co/dpYnhqBGPg","url":"https://x.com/oga_aiichiro/status/2115997788819657026","createdAt":"2026-10-30T02:42:40Z","metrics":{"views":1231,"likes":54},"lang":"ja"},{"id":"2115779432191270994","author":"kaito","handle":"cu30rry_","text":"pstack本 第13版 に更新しました！\npstack v0.15.36 に対応し最新 pstack の情報にアップデートしてます！\n\n■ 主な変更\n・/statechart（第30〜33章）：作り直しに合わせて全面的に書き直し。1つのコマンドで TLA+ のモデルを確かめ、PMが読める状態遷移図と報告を書き出す流れを、メモアプリの例で解説。図は Pele で描いた画像で見せています\n・/interrogate（第35章）：敵役が変更したコードを実際に動かし、再現した指摘だけを残す新しい仕組みに\n・Orchestrate（第16章）：スクリプトを使わない手順に書き直し\n・ほかに /arena、/ketchup-video、/poteto-mode、Autopilot などの変更も反映","url":"https://x.com/cu30rry_/status/2115779432191270994","createdAt":"2026-10-29T12:15:00Z","metrics":{"views":2892,"likes":51},"lang":"ja"},{"id":"2115749479685222798","author":"awe0","handle":"awe0_io","text":"🔥 今天在 GitHub 挖到一款超强开源神器「answer-me-with-html」！上线不到一个月，已经突破 4,600 Stars！\n\n📌 这款项目到底是什么？\n\n简单来说：让 AI Agent 的复杂回答自动生成美观易读的单页 HTML 网页，告别冗长难读的 Markdown！\n\n⚡ 3 大亮点整理：\n\n【单页网页直观排版】：把复杂逻辑、表格、流程图与代码整合成完整可视化 HTML，点击即可阅读，超级清爽。\n【支持主流 Agent 工具】：封装为 Agent Skill，支持 Claude Code、Codex、Cursor、OpenCode 等工具，安装后即可调用。\n【离线打开，无需服务器】：生成独立的静态 HTML 文件，无需部署前端服务器或数据库，断网也能阅读。\n\n👥 特别适合经常使用 AI 编程、分析复杂问题的开发者！\n\n🌟 GitHub：约 4,600 Stars\n🍴 Forks：314\n💻 开发语言：JavaScript\n📄 开源协议：MIT\n\n👉 项目地址：\nhttps://t.co/GLpc0xrr3w\n\n#AIAgents #GitHub","url":"https://x.com/awe0_io/status/2115749479685222798","createdAt":"2026-10-29T10:15:59Z","metrics":{"views":26311,"likes":501},"lang":"zh"},{"id":"2115913116911558864","author":"Taishi | AI Language Learning App 🧞‍♂️","handle":"taishiyade","text":"Grok BotとMuseの１番の問題は、自分のメインパソコンのGUI操作が必要なところで詰まってしまうところ\n\nCodexと連携させるようにすれば、ほぼ全ての操作がGlock BotとMuse経由で可能になる\n\nGrok Botは一番便利やけど、トークンの減りがめちゃくちゃ早いので、実装は基本Claude CodeのOpusを操作させるようにするべき\n\nリサーチ業務はMuseがいい\nというか、本当は全部Grock Bot経由で全部操作するようにしたいけどトークン問題があるから仕方なしにMuseも使ってる","url":"https://x.com/taishiyade/status/2115913116911558864","createdAt":"2026-10-29T21:06:13Z","metrics":{"views":8432,"likes":64},"lang":"ja"},{"id":"2115775716692533282","author":"オープンソース研究所","handle":"opensourcelab9","text":"【注目】\nMeet・Teams・Zoomに入る会議の記録係ボットを、他社のクラウドに任せず自分のPCやサーバーで動かせます😳\n話者つきの文字起こしをその場で流すVexa、★2,908です。\n\n・会議のURLを貼るだけで、ボットが参加者として入る\n・会議はMarkdownのファイルとしてgitに溜まり、AIに「前回の会議で何を決めた？」と聞ける\n・Macなら Docker Desktop で make all を1回実行すれば手元で試せる\n・文字起こしは無料のトークンを取るか、自前のGPU（AI計算用の部品）で動かす\n\nつまり\n作者いわく、売られている会議AIは会話を自社のクラウドに送り、見る権利を貸す形です。\nVexaなら議事録が自分のgitのファイルになり、検索も変更の見比べも手元でできます。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2115775716692533282","createdAt":"2026-10-29T12:00:14Z","metrics":{"views":1020,"likes":11},"lang":"ja"},{"id":"2115707361159754097","author":"StudioYebisu","handle":"studio_yebisu","text":"このURL叩く→サブスクアカウントでログイン→なんか貰えそうなところ押す→ボーナスAPIクレジットげっちゅ 終\nhttps://t.co/PiG6uxlrrd\n\nしかし、何に使うよこれ。","url":"https://x.com/studio_yebisu/status/2115707361159754097","createdAt":"2026-10-29T07:28:37Z","metrics":{"views":15717,"likes":126},"lang":"ja"},{"id":"2115641553431806248","author":"まじん","handle":"Majin_AppSheet","text":"GeminiエージェントやAntigravityで「御三家モデル」が横断して使えるように！\n\nモデル単価は下がってるのに、なぜか開発コストが跳ね上がる今のAI現場。原因の多くは「エージェントの思考ループ」にある。\n\n昔のシンプルなRAGと違って、エージェントは自律的に何往復も深く思考するから、全部に最上位のフロンティアモデルを当ててるとあっという間に予算が溶ける。\n\nだからこそ、タスクの難度に応じてモデルを自動ルーティングしてくれる仕組みはマジでありがたい。\n\n#gcai_agent","url":"https://x.com/Majin_AppSheet/status/2115641553431806248","createdAt":"2026-10-29T03:07:07Z","metrics":{"views":29937,"likes":187},"lang":"ja"},{"id":"2115306153110556711","author":"Yudai Yamamoto","handle":"yyo616","text":"本物のAI最前線の方が書いた内容という感じでめちゃ勉強になった。","url":"https://x.com/yyo616/status/2115306153110556711","createdAt":"2026-10-28T04:54:22Z","metrics":{"views":92376,"likes":2033},"lang":"ja"},{"id":"2115690302740877416","author":"たくぞー｜AI動画ツール実測レビュー","handle":"tkz_aiart","text":"AIに動画を作らせるなら揃えたいオープンソース20選\n\nコードで動かせるからAIエージェントと相性抜群。\n\nアニメ・3D・物理・音・書き出しまで一式そろう。\n\n🎞 動画エンジン\n01 Remotion：Reactで動画を作る\nhttps://t.co/3eK0B1eWHq\n\n02 HyperFrames：HTMLを動画に書き出す\nhttps://t.co/KZfBDpe2ms\n\n✨ アニメーション\n03 Anime.js：タイムラインでアニメ制御\nhttps://t.co/c6aN1zBEtS\n\n04 React Spring：バネのような自然な動き\nhttps://t.co/HIRVYaeCk7\n\n🖌 2D描画\n05 PixiJS：GPUで速い2D描画\nhttps://t.co/SEWgF6Wige\n\n06 p5.js：ジェネラティブな映像\nhttps://t.co/ygncCkvi1g\n\n07 Paper.js：ベクターのパス描画\nhttps://t.co/CKBDTbh4Wc\n\n🧊 3D・物理\n08 Matter.js：2D物理\nhttps://t.co/lp7rWk9J2X\n\n09 Three.js：3Dシーン\nhttps://t.co/3K6wA65WEd\n\n10 Rapier：3Dの当たり判定\nhttps://t.co/ZZOWqo1NYd\n\n🎨 エフェクト・素材\n11 OGL：自作シェーダー\nhttps://t.co/DZJvOD2hqQ\n\n12 tsParticles：パーティクル演出\nhttps://t.co/SIAxHON5km\n\n13 glTF Transform：3D素材の軽量化\nhttps://t.co/sHUVKsSCQt\n\n14 GL Transitions：シェーダーのトランジション\nhttps://t.co/UWnJgn4JHl\n\n🔊 収録・音・字幕\n15 OBS Studio：画面収録\nhttps://t.co/TSPOduWj6E\n\n16 Chatterbox：AIナレーション\nhttps://t.co/1Yh9FsQjTD\n\n17 Tone.js：シンセと効果音\nhttps://t.co/kGzFkQagt7\n\n18 faster-whisper：文字起こし・字幕\nhttps://t.co/pajBkLOrD7\n\n🎬 編集・書き出し\n19 OpenCut：タイムライン編集\nhttps://t.co/BYdSTiI6lh\n\n20 FFmpeg：エンコードと書き出し\nhttps://t.co/BHBxbVKNUr\n\n全部無料で使えます。\n保存しておくと便利です📌","url":"https://x.com/tkz_aiart/status/2115690302740877416","createdAt":"2026-10-29T06:20:50Z","metrics":{"views":17366,"likes":358},"lang":"ja"},{"id":"2115848329120944534","author":"おむらいす@ブランド屋経営してる人／ベンチプレス30kg","handle":"omurice_brand","text":"【Linuxカーネルに深刻度9.8（最大級）の脆弱性。WSL2とDockerの人はapt upgradeじゃ直りません】\n\n脆弱性の対応、日々お疲れ様です\nChromeに続いて、さらに来ました。今度はLinuxです\nただ今回は「全員今すぐ」の話ではないので、先に落ち着いて読んでください\n少し長いですが詳しくまとめたので、自分の環境の見出しだけでも読んでもらえると嬉しいです\n\n何の話か\nCVE-2026-98432というLinuxカーネルのバグです（10月15日公開）\n先日書いたChromeの大量修正にも関わっている、Anthropicの10月27日の発表（Claudeの未公開モデルが見つけた穴）\nその中のLinuxの1本です\n2015年から入っていたバグなので、現役のLinuxはほぼ全部該当します\nCVEの記録上のスコアは10点満点の9.8です\n\n中身\n外から細工した接続要求を送りつけられるだけで、ログインも要らずに起きます\n接続要求の処理が別のCPUで同時に走った時に、消したはずのメモリを読みに行くバグで、起きた時に一番ありそうなのはサーバーごと落ちる（クラッシュ）です\nIPv4の話で、IPv6は今回のバグの対象外です\n\n条件が揃えば外からrootでコマンドを実行できるところまでAnthropicは実証したと発表しています\nただ報道によるとその条件は「Multipath TCPで待ち受けているサーバー」で、これは複数回線を束ねる拡張で、アプリ側で明示的に使う設定が要るものです\n普通の設定のWebサーバーがそのまま当てはまるかは、まだ分かりません\n対象は、外に向けて待ち受けているサービスがある機械です\nWebだけでなく、SSHの22番を開けているだけで該当するので、開発用のVPSもほぼ全部です\n逆に、外に向けて何も待ち受けていない機械には刺さる場所がありません\nAndroidやNAS、ルーター、ラズパイも中身はLinuxですが、考え方は同じで、外に待ち受けを開けていなければ急ぎではなく、修正はメーカー待ちです\n\n温度感は配布元で割れています\nUbuntuはHigh\nRed Hatは現実的な被害は落ちるまでという見方でModerate、修正は今後の更新に回しています\n\n悪用された報告は今のところ見当たりません\nなので「全員今すぐ」ではなく、自分がどのケースか見て、出た修正を当てる、で十分かなと思います\n\nクラウドやVPSで公開サーバーを動かしている人\n配布元の修正が出たら当てて、再起動（カーネルは再起動して初めて効きます）\nDebianはもう出ています（12は6.1.190、13は6.12.113）\nUbuntuは10月30日時点でも22.04、24.04とも作業中で、今apt upgradeしても当たるものはまだありません\n出た時の番号は24.04が6.8.0-149、22.04が5.15.0-203の予定なので、uname -rがそれ以上になれば修正済みです\n20.04以前は通常サポートが終わっているので、修正が来るとしてもUbuntu Pro（個人なら5台まで無料）に入っている人だけです\n\nAmazon Linux 2023は6.12系と6.18系のカーネルは修正済み、標準の6.1系とAmazon Linux 2はまだです\n\nRed Hat系（RHEL、AlmaLinux、Rocky）は配布元の判断で修正が後になるので、下のつなぎで待つ形です\n\n修正が来るまでのつなぎ\n公式の回避策は、UbuntuもRed HatもSUSEも出していません\nその上で、仕組みから言えることが2つあります\n\n1つ目は露出を減らすこと\nSSHや管理画面は接続元を自分のIPに絞る\nCloudflareやALBのような前段を挟む場合は、本体側で前段のIP以外を遮断して初めて意味があります（NLBのようにL4で素通しするタイプは別）\n\n2つ目はIPオプションを落とすこと\nバグが触るのは接続要求に付いていたIPオプションのメモリなので、IPオプション付きのTCPパケットを手前で落とせば、理屈上はこの経路に入りません（nftablesならip hdrlength \u003e 5を条件にdrop）\nTCPだけに絞るのは、他のプロトコルには正規で付くことがあるからです\nufwのような簡易ツールでは書けないので、nftablesかiptablesを直接触れる人向けで、自分の環境で試してからにしてください\n有償のライブパッチ（KernelCareなど）はDebian 13向けが先に出ています\nUbuntu ProのLivepatchは確認できていません\n\nWSL2の人\nカーネルはUbuntuの中ではなく、Microsoftが配っています\nここがややこしいのですが、Ubuntuの中でapt upgradeしても、カーネルは1ミリも変わりません\n更新はPowerShellでwsl --update（かWindows Update）\nそのあとwsl --shutdownで一度止めると、次の起動から新しいカーネルになります\n\nMicrosoftは修正入りのカーネル（6.18.58.1）をここ数日で公開していますが、wsl --updateで降ってくる版に入ったかはまだ確認できていません\nWSLの中でuname -rを打って、6.18.56以上なら修正済み、今配られている6.18.33系や、古いままの6.6系・5.15系なら未修正です\n（WSL1はLinuxカーネルを使っていないので関係ありません）\n\nDockerの人\nコンテナはホストのカーネルをそのまま使うので、コンテナの中で更新しても意味がありません\nLinuxのサーバーならホストのOSを更新\nWindowsのDocker Desktopは標準のWSL2バックエンドならWSL2のカーネルで動いているので、上と同じwsl --update\nMacのDocker Desktopは自前のカーネルなので、Docker Desktop本体の更新です（修正入りの版が出たかは未確認）\nOrbStackやColima、Rancher Desktopも同じで、VMのカーネルを配っているのが誰かで決まります\n\nHyper-VやVirtualBox、VMwareの仮想マシンの人\nこれだけはゲストの中でapt upgradeで合っています（配布元の修正が出てから）\n\n自分のカーネルの番号はuname -rで出ます\n修正済みは5.10.272、5.15.223、6.1.190、6.6.159、6.12.113、6.18.56、7.2.10以上です\nただしこれは、WSL2やArch、Amazon Linuxのように上流の番号をそのまま使っている環境向けの目安です\nUbuntu、Debian、Red Hat系は番号の付け方が違って上の番号とは比べられないので、配布元の案内（Ubuntuは上に書いた予定の番号）で見てください\n\n自宅のWSL2や仮想マシンは、外から直接つながる構成（ブリッジ接続やポート開放）にしていなければ急ぎではありません\n\nただ「apt upgradeしたから安心」は間違いなので、そこだけ覚えておいてください","url":"https://x.com/omurice_brand/status/2115848329120944534","createdAt":"2026-10-29T16:48:46Z","metrics":{"views":129858,"likes":1212},"lang":"ja"},{"id":"2115982357291491690","author":"サウス｜AI×Chrome拡張作成で業務改善","handle":"south_0120","text":"ClaudeCodeでどのくらい業務が効率化出来るのか👀\n\nYoutubeなどをみているだけで終わりにしないで、実際に手を動かして自分で体験してみるのが大事だなとこの間いろんな人と話していて実感します\n\nまだClaudeCode触ったことのない人はこれを機にぜひ🙌","url":"https://x.com/south_0120/status/2115982357291491690","createdAt":"2026-10-30T01:41:21Z","metrics":{"views":64,"likes":1},"lang":"ja"},{"id":"2115640021068001459","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝無料のMeta「Muse」から、AIエージェントを始めてみませんか\n\ndotsやGrok Botは気になるけど、いきなり有料はためらう\n私も、最近ずっとその声をもらっていた\n\n今週の記事は、この悩みを片付ける話です\n無料のMeta「Muse」を入口に、難しい設定なしであなたを分かってくれるAIエージェントまでを、3日使い倒した記録でまとめた\n\n・はじめ方の中で、メールとカレンダーをつなぐ\n・最初にやっておきたい安全の設定を2つ\n・使い分けの前に、まず無料のMuseを1つ使い込む\n\nはじめ方でメールをつないだら、説明しなくても仕事の地図が返ってきた\n外へ出すメールは「下書き→私の確認→送信」なので、初日から安心して任せられた\nはじめての入口として、いまいちばんすすめている\n\nこんな人に読んでほしい\n・AIエージェントが気になっているけど、まだ何も契約していない人\n・使い始めても、毎回説明するのが面倒だと感じている人","url":"https://x.com/tetumemo/status/2115640021068001459","createdAt":"2026-10-29T03:01:02Z","metrics":{"views":6153,"likes":80},"lang":"ja"},{"id":"2115671218133270914","author":"Codex研究ラボ","handle":"codexneo4","text":"Codexディスクトップソフトから\nタスクを処理させるとトークン効率が最悪だから\nDeepSeek Harnessを使ってるんだけど\nもうCodexアプリに戻ったら仕事回らんくなる　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n👇\nCodex・Claude Codeとの連携や、\nAgentにプラグインを作らせる導線も強化。\n\n今回の0.2.1系で気になる更新がかなり多くて\n\n① DeepSeekの検索・ページ取得APIに対応\n\n「DeepSeek Search」と「Fetch API」を\nWeb検索の設定から有効にできるようになった。\n\n情報を探して、見つけたページの内容を取得する\nこの部分にもDeepSeekの機能を\n組み込めるようになったのが、\n今回いちばん注目しているポイント。\n\n② 欲しいプラグインをAgentに作ってもらいやすくなった\n\nプラグイン管理画面に、\nAgentへ作成を依頼する入口が追加。\n\n「こんな機能が欲しい」と伝えて、\nCreatorモードで開発を\n進める流れが使いやすくなった。\n\n外部のプラグイン配布元への対応、\n依存関係の管理、対応プラグインの更新を\nその場で反映する仕組みも整備。\n\nサイドバーからプラグインを探したり、\n作成に進んだりできるメニューも追加されている。\n\n③ Codex・Claude Codeに仕事を振りやすくなった\n\n公式のプラグイン一覧から、\nCodexとClaude Codeの\n連携パッケージを必要に応じて導入できる。\n\nHarnessから実際のCodexやClaude Codeを\n子エージェントとして呼び出し、\nまとまった作業を任せる仕組み。\n\n普段使っているAI開発ツールを、\nHarness側のワークフローに組み込めるのは面白い\n\nさらに「Claude Code Mods」の\n実験的な互換レイヤーも追加。\n\nただし、こちらは仕組みの互換性を\n検証している段階で、\n既存プラグインが何でもそのまま動くわけではない\n\n④ 軽量モードでも、長い会話を扱いやすくなった\n\nMinimalモードに画像の読み取りと、\n長い会話の自動圧縮が追加。\n\nWeb版・デスクトップ版では\n「/compact」で手動のコンテキスト圧縮もできる。\n\nモデルとの接続を担うpi-aiも1.0.2へ更新。\nモデル一覧や接続処理の修正が入り、\n実験的なGit Worktrees、SDKのセッション復元\nなども整備されている。\n\n10月28日時点の公開最新版は「0.2.1-rc.3」\nまだプレリリースだけど、\n検索・開発・拡張機能をまとめて扱う環境として\n進化を追いたくなる。\n\nDSHが面白いのは、\nモデル、検索、ツール、プラグインを\n組み合わせて、自分の仕事に合う環境を作れる\n\nここから見たいのは、\n実際の作業でどれだけ差が出るか。\n\n検索の精度、完了までの時間、\nトークン消費、手戻りの回数。\n\nこのあたりを同じタスクで比較したら明白","url":"https://x.com/codexneo4/status/2115671218133270914","createdAt":"2026-10-29T05:05:00Z","metrics":{"views":6265,"likes":27},"lang":"ja"},{"id":"2115938181225029663","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"これ日本の出版社も対応したら、全国の塾潰れるね。Googleが学習を破壊しに来た。","url":"https://x.com/MakeAI_CEO/status/2115938181225029663","createdAt":"2026-10-29T22:45:49Z","metrics":{"views":1952,"likes":14},"lang":"ja"},{"id":"2115800850782461963","author":"Sumanth","handle":"Sumanth_077","text":"Jev as a reviewer for OCR!\n\nOpenBMB and ModelBest just released MiniCPM-OCR 1.0 for document parsing and MiniCPM-OCR Jev for reviewing the reliability of those outputs.\n\nThat second part is what I find more interesting.\n\nOCR errors are often hard to catch once the output looks plausible. A number can be slightly wrong, a formula can be misread, or a table cell can shift, and the result can still look completely reasonable when it moves into the next step of the workflow.\n\nMiniCPM-OCR Jev sits after the parser and evaluates how reliable those outputs are across text, formulas, and tables.\n\nIt does not rewrite or correct the OCR result.\n\nIts job is to score the output and help decide which blocks can move forward and which ones should be sent for human review.\n\nSo the workflow becomes:\n\nDocument → Layout detection → OCR parser → Jev review → Human review where needed\n\nOn the parsing side, MiniCPM-OCR 1.0 is a 1.3B model that supports scanned documents, photographed pages, curved inputs, tilted documents, tables, formulas, and key information extraction.\n\nOpenBMB reports 93.68 on Real5-OmniDocBench and 54.7 on OCRBench v2, while DSpark improves end-to-end throughput by 62% in their benchmark setup.\n\nOn the review side, MiniCPM-OCR Jev reaches 93.5 AUROC on their JevOCRBench, close to Qwen3.5-397B-A17B at 93.8 and above JEV-35B at 90.1 in the official evaluation.\n\nThe useful part here is that you no longer have to treat the whole OCR output as equally reliable.\n\nYou can review it block by block and route only the uncertain parts for another look.\n\nI tested both models on my own documents to see how well Jev catches OCR outputs that look right but are actually wrong.\n\nI’ve shared the GitHub repo below!","url":"https://x.com/Sumanth_077/status/2115800850782461963","createdAt":"2026-10-29T13:40:07Z","metrics":{"views":12501,"likes":242},"lang":"en"},{"id":"2115599934380806255","author":"池田 泰延","handle":"clockmaker","text":"Shopifyのスペシャルサイト、今回もすごい！\n\nHTML-in-Canvasの先進事例。Chromeオリジントライアルの状況で本番採用したこともカッコいい。","url":"https://x.com/clockmaker/status/2115599934380806255","createdAt":"2026-10-29T00:21:44Z","metrics":{"views":63899,"likes":1316},"lang":"ja"},{"id":"2115737628918325345","author":"AM09:21","handle":"AM09_21","text":"めちゃめちゃ分かりやすいアニメーション付きの図とともに、丁寧にMuse Spark Openの中身について本当に詳しく書かれてる神記事なので、現代LLMアーキテクチャに入門したい人には本当におすすめです\n\n(推論系はあんまり知らなかったので本当に勉強になった......ありがとう！！) https://t.co/Yc1Rvh8JMB","url":"https://x.com/AM09_21/status/2115737628918325345","createdAt":"2026-10-29T09:28:53Z","metrics":{"views":13263,"likes":301},"lang":"ja"},{"id":"2115851728419803509","author":"オロゴン","handle":"orogongon","text":"Grok bot は自分のPCを持ってるので、彼らのPCにClaude codeとCodexをインストールしてバリバリ作業をさせるのが、これまでのAIツール使ってる中でも、一番しっくり来てる感じがする！。わちゃわちゃチームでやってる感あって良き。人間とSlackやChatworkで仕事してるのと、もはやあまり変わらないな。。。\n\nもう遅いから、寝ても大丈夫とか言ってくれて、自分は徹夜で働くナイスガイやで！","url":"https://x.com/orogongon/status/2115851728419803509","createdAt":"2026-10-29T17:02:17Z","metrics":{"views":9608,"likes":81},"lang":"ja"},{"id":"2115985783064793438","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】Claude for Legalに、契約レビューや規制チェックに使える既製アーティファクトが20種類以上追加。\n\n法務の定型作業をテンプレから始められるのは大きい。自社資料を足して社内共有もできます。\n\n・契約書の一括レビュー、引用チェック、規制動向スキャン\n・Harvey・PwC・Goodwinなど提携先の作品も収録\n・司法アクセスを広げる用途のものも用意\n・法務系コネクタは5月以降に60以上追加","url":"https://x.com/masahirochaen/status/2115985783064793438","createdAt":"2026-10-30T01:54:58Z","metrics":{"views":4782,"likes":20},"lang":"ja"},{"id":"2115717330722599272","author":"小樱💞｜实用工具分享","handle":"xiaoying_eth","text":"🚨 刚免费开源了一个 AI 黑客，每次你发 release，它就来攻击你的应用\n\nGitHub 上已经超过 48000 星。\n\n它不会甩给你一份\"疑似漏洞\"清单，而是直接告诉你从哪里能打进去。\n\n名字叫 Shannon，一个开源 AI 渗透测试工具。\n\n把它指向你的应用，它会像真正的黑客一样尝试攻破它。\n\n它具体做这几件事：\n\n→ 用真实漏洞利用，不靠猜\n→ 漏洞利用不成功就不上报\n→ 可以接入 GitHub Actions 或 GitLab CI，每次 release 自动跑\n→ 输出一份专业的 PDF 报告，可以直接交给客户或团队\n→ 还能导出 SARIF，漏洞直接显示在你的开发工具里\n\n普通测试告诉你应用能不能正常运行。\n\n它告诉你有没有人能闯进来。\n\n以前，渗透测试隔一阵子才做一次。\n\n现在，你每次更新应用，都会自动过一遍渗透测试。\n\n开源，用你正在用的模型就能跑。\n\n仓库链接 👇","url":"https://x.com/xiaoying_eth/status/2115717330722599272","createdAt":"2026-10-29T08:08:14Z","metrics":{"views":11443,"likes":149},"lang":"zh"},{"id":"2115744989871591848","author":"Musolsol.𝟎𝐱𝐔","handle":"MMMusol","text":"大学教授可能没想到，\nGitHub 上已经有人把私人家教开源了...\n\n这个项目叫 DeepTutor，由香港大学数据智能实验室开发，目前在 GitHub 上已经获得超过 4.8 万颗 Star！\n\n它不是普通的 AI 聊天机器人，而是一套完整的 AI 个性化学习系统。 \n\n你可以把教材、论文、PDF 扔进去，它就能围绕你的资料建立知识库，讲解知识点、解答问题，甚至自动生成练习题，检查你到底学会了没有。 \n\n更夸张的是，它支持深度研究、交互式可视化、沉浸式阅读，还能根据学习进度规划掌握路径。 \n\n如果你学高数，它可以辅助拆解公式；\n\n如果你学外语，它可以陪你练习；\n\n如果你研究论文，它还能结合资料帮你梳理知识体系。 \n\n它甚至支持长期记忆、接入 QQ 和微信等聊天渠道，让 AI 老师不再局限于一个网页。\n\n项目采用 Apache 2.0 开源协议，支持本地部署，不过调用部分 AI 模型可能产生费用。 \n\n未来的教育，\n也许是每个人都有一个真正了解自己的 AI 老师：","url":"https://x.com/MMMusol/status/2115744989871591848","createdAt":"2026-10-29T09:58:08Z","metrics":{"views":11639,"likes":278},"lang":"zh"},{"id":"2115764968008396992","author":"Sac","handle":"Saccc_c","text":"直接开源视频中的卡点转场效果，将制作流程全部打包成skill，放在下面这个GitHub仓库里了！\n\n🔗：https://t.co/QaE7lzf5UM\n\n让你的Agent安装这个skill，提供一张产品图和产品信息，就能一键生成高级酷炫的宣传片\n\n下面这个最新版 MacBook Pro 广告片就是我用一句话，让Codex制作的，效果真的很赞🫠 https://t.co/fVpI0x7KTW","url":"https://x.com/Saccc_c/status/2115764968008396992","createdAt":"2026-10-29T11:17:32Z","metrics":{"views":13900,"likes":240},"lang":"zh"},{"id":"2115897046708183370","author":"codila","handle":"0xCodila","text":"All my life I was terrified someone watching me through laptop camera, even the FBI director taped his...\n\nClaude Code dug through my laptop's hidden logs and found suspicious moments I can't explain \n\ncheck yours and shut down your camera without a sticker:\n\nwhat it found:\n\n- an unknown app turning on my camera at night, while I sleep\n- Windows quietly remembers apps (could be spy) that turned on your camera, even after you delete them\n\nwhy you should do it today:\n\n- a $40 spy tool bought in 100+ countries infected 500,000+ computers and could switch on their webcams remotely (US Departament of Justice)\n- a US school district secretly took 30,000+ webcam photos of students on school laptops, some inside their homes (Lower Merion)\n- even FBI director put tape over his laptop camera (James Comey)\n\nWindows:\n\n1. install repo below and type /camera-guard in Claude Code, it reads the hidden log of every app that ever turned on your camera and mic\n\n2. delete AnyDesk, TeamViewer ot any remote app you don't use\n\n3. Windows has a hidden \"Camera on/off pop-up, off by default, ask Claude to turn it on and you see every time the camera starts\n\n4. really shut camera off, Settings switch isn't enough:\n\n• BIOS (strongest ): hold shift, click Restart - Troubleshoot → Advancedf options → UEFI Firmware Settings , set Camera to Disabled and add a BIOS password.\n\nWindows can't see the camera at all. Need it for a call? - Turn it back on there. Not every laptop has it, Claude checks your model\n\n• camera switch or key: some laptops have a slider on the side or an F-key with a crossed-out camera. Slide it off when you're not using it\n\n• Device Manager → Cameras → Desible device: one click to undo (but any app with admin rights can undo it too)\n\n5. run Microsoft Defender Offline, the deep scan built into Windows (Windows Security → Virus \u0026 threat protection → scan options): it restarts your PC and hunts hard-to-catch spyware before Windows starts\n\nMac: \n\n1. install repo below and type /camera-guard, it checks which apps can use your camera and mic and what starts with your Mac\n\n2. System Settings → General → Sharing: turn off Screen Sharing, Remote Login and Remote Management, these let someone see and control your Mac from another computer\n\n3. Screen Time → Content \u0026 Privacy → App \u0026 Feature Restrictions → Camera: off + a Screen time passcode - Apple's own camera off swith\n\n4. install OverSight, free Mac app: it pops up an alert second any app turns on your camera or mic, so you know the moment anyhting starts filming or listening\n\nPlease do this today. Then read article below on how to solve such problems on another tech:","url":"https://x.com/0xCodila/status/2115897046708183370","createdAt":"2026-10-29T20:02:22Z","metrics":{"views":33446,"likes":385},"lang":"en"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-30T12:11:35+09:00","posts":[{"id":"2115982882607145057","author":"StudioYebisu","handle":"studio_yebisu","text":"■速報：Binanceがハッキングを受け、約8,500億円相当の流出が発生\nうわ、これ確定したら史上最大規模の暗号資産流出だ。\n\nBinance公式： 調査中で「ユーザー資金は安全」としています。今は入出金を一時停止中。\n\n補償： 共同CEOのYi He氏が「Binance will cover all hacking losses」と表明。\n訳「俺達はハッキング被害、絶対保証すっからな」\n\nオンチェーン分析による推定：\n- Arkham：約57〜58億ドル\n- Chainalysis：約59億ドル\n- Blockaid：約33億ドル\n確定すれば、Bybitの事件（2025年2月、約15億ドル）を大きく上回り、史上最大\n\nこれまだ速報段階で情報確定してないので、実際どうなっているのかっていうのはまだ未定なんですけど。\n\nマーケットは反応してて。\n主要な暗号通貨は軒並み大幅下落。\nBTCは一時77,000ドル割れ、ETHは-5.7%、BNBは-8.2%\n※CoinDesk、21:12 ET時点\n\n暗号資産自体がハッキングされることはなくても、\n取引所側がハッキングされるリスク、\nしかも世界最大規模の取引所バイナンスがやられて、流出量も過去最大っていうところで結構インパクトでかいですね。\n\n動かさない暗号資産を取引所にそのまま置いておくんじゃなくて、プライベートウォレット（もしくは物理HDD)で管理した方がむしろ安心な時代来た？\n\n何にせよ続報待ち。","url":"https://x.com/studio_yebisu/status/2115982882607145057","createdAt":"2026-10-30T01:43:26Z","metrics":{"views":1184,"likes":11},"lang":"ja"},{"id":"2116002269217128914","author":"東京大学 松尾・岩澤研究室","handle":"Matsuo_Lab","text":"【📢本日19:00開催｜論文再現実装ハンズオン#6】\n\nDL基礎講座で学んだ知識を、論文の読解や実装につなげてみませんか？\n\n松尾研DLコミュニティでは、本日10/30（金）19:00より「論文再現実装ハンズオン#6」を開催します！\n\n今回は、DLコミュニティメンバーの宮氏が、論文「Flow Matching for Generative Modeling」の読解と実装方法を解説します。\n\nFlow Matchingは、ノイズから画像や音声などのデータへ変換する「流れ」を学習する生成モデルの手法です。論文の再現実装を通して、他の生成モデルを理解する際にも役立つ考え方を学びます。\n\nDL基礎講座を修了して次のステップへ進みたい方はもちろん、これから基礎講座を受講予定で、修了後の学びのイメージを掴みたい方にもおすすめです。\n\n・日時：本日10/30（金）19:00〜21:00\n・形式：Zoomオンライン（一般公開・どなたでも参加可能）\n・登壇：DLコミュニティメンバー 宮氏\n\n皆さまのご参加をお待ちしております！\n\n▼詳細・お申し込みはこちら","url":"https://x.com/Matsuo_Lab/status/2116002269217128914","createdAt":"2026-10-30T03:00:29Z","metrics":{"views":373,"likes":4},"lang":"ja"},{"id":"2115874189517131785","author":"Klonzu","handle":"Klonzu","text":"$14,201 in 30 days, read straight from Stripe. $10 quadrillion a month, self-reported. Opus 5.5 keeps the first and never lets the second near your list\n\nask AI for a business idea and you get a list that sounds smart. nobody ever paid for any of it\n\n2 in 3 businesses listed on TrustMRR earn under $1,000. Skillry started in August and showed $10,519 in its last 30 days. 8 of the 10 winners left their channels line empty\n\nthis board runs the steal course from this article on a $20 Claude Pro plan. the whole filter is one line in CLAUDE.md:\n\nrevenue filter: checked revenue only, between $1,000 and $20,000 in the last 30 days\n\nhere's the split:\n→ Opus 5.5 opens TrustMRR's 25 fastest-growing businesses\n→ keeps the ones inside the filter, skips every \"Anonymous startup\"\n→ numbers a founder only states go to maybe.md, never list.md\n→ one steal sheet per winner: demand, offer, channels, my angle\n\nyou only look at three moments:\n→ the steal sheet. copy the demand, the offer and the channels, never the code, the brand or the texts\n→ a winner you don't want. \"no to [name]: reason\" once, and it never comes back\n→ Monday 9am, the fresh list. pick which winner to steal\n\n↳ concept board, figures from the article, TrustMRR data from 23 october","url":"https://x.com/Klonzu/status/2115874189517131785","createdAt":"2026-10-29T18:31:32Z","metrics":{"views":1891,"likes":77},"lang":"en"},{"id":"2115905778075021623","author":"Accel","handle":"Accel","text":"\"You have to put yourself in a position where you can fail... otherwise there's no way for you to actually reach your potential. \"\n\n@amitku shares his thoughts on entrepreneurship with students @UCBerkeley SCET @SutardjaCenter.","url":"https://x.com/Accel/status/2115905778075021623","createdAt":"2026-10-29T20:37:03Z","metrics":{"views":1149,"likes":12},"lang":"en"},{"id":"2115828276975325370","author":"LiveSquawk","handle":"LiveSquawk","text":"ECB Policymakers See December Hike Followed By Pause – RTRS Sources","url":"https://x.com/LiveSquawk/status/2115828276975325370","createdAt":"2026-10-29T15:29:06Z","metrics":{"views":11588,"likes":6},"lang":"en"},{"id":"2116001166085718445","author":"StudioYebisu","handle":"studio_yebisu","text":"あ、あ！！\n※自分からはあまり詳細に触れられない","url":"https://x.com/studio_yebisu/status/2116001166085718445","createdAt":"2026-10-30T02:56:06Z","metrics":{"views":485,"likes":8},"lang":"ja"},{"id":"2115800129269588010","author":"Bober_smart","handle":"Bober_smart","text":"HOLY SH*T. I just crossed $24,000 in profit with Grok Bot. THANKS ELON \n\nI wanted an automated stream of income that requires zero manual execution. After testing multiple passive models, a Polymarket trading setup proved to be the fastest option\n\nWhy this strategy works:\n\nA new \"Bitcoin Up or Down\" market opens every 3 minutes, delivering 480 rounds daily\n\nPricing relies entirely on public Chainlink data, requiring zero insider access\n\nQuick settlement ensures the strategy validates or fails within minutes\n\nPerformance after 14 days of live trading:\n\nTotal Profit: +$24,520\nWin Rate: Green 18 days out of 20\nMax Drawdown: -$45\nActive Execution: 4,120 trades processed seamlessly\n\nThe Architecture:\n\nScout: Analyzes Chainlink prices to compute real-time probabilities for both outcomes\nTrader: Executes positions automatically whenever a side is mispriced by 4+ points after fees\nRisk: Evaluates logs every morning and halts operations following 3 consecutive losing sessions\nBuilder: Operates via a customized micro-terminal on a $5/month cloud server communicating directly with Polymarket 24/7\n\nPrompt to initialize Grok Bot:\n\n\"build me a Polymarket team for the 3-minute 'Bitcoin Up or Down' markets: Scout, Trader, Risk and Builder. Scout reads the Chainlink BTC/USD price feed and calculates real-time odds. Trader triggers entries when a side is mispriced by 4+ points after fees, capped at 65¢, sizing at $25. Risk reviews logs daily. Builder writes a lightweight terminal script for instant execution. Test on paper simulation first, then switch to live capital after a profitable week\"\n\nFull breakdown and updates posted below\n\nAdd to bookmarks","url":"https://x.com/Bober_smart/status/2115800129269588010","createdAt":"2026-10-29T13:37:15Z","metrics":{"views":29768,"likes":310},"lang":"en"},{"id":"2115985783064793438","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】Claude for Legalに、契約レビューや規制チェックに使える既製アーティファクトが20種類以上追加。\n\n法務の定型作業をテンプレから始められるのは大きい。自社資料を足して社内共有もできます。\n\n・契約書の一括レビュー、引用チェック、規制動向スキャン\n・Harvey・PwC・Goodwinなど提携先の作品も収録\n・司法アクセスを広げる用途のものも用意\n・法務系コネクタは5月以降に60以上追加","url":"https://x.com/masahirochaen/status/2115985783064793438","createdAt":"2026-10-30T01:54:58Z","metrics":{"views":4782,"likes":20},"lang":"ja"},{"id":"2115996900491149676","author":"のります｜AIを実務で使う非エンジニア","handle":"norimasu_lab","text":"ChatGPTの有料プランの利用上限を倍にする措置が出たそうです。\nいったん決まった半減が撤回されたので、利用者の声が効いた例とも読めるかもしれません。","url":"https://x.com/norimasu_lab/status/2115996900491149676","createdAt":"2026-10-30T02:39:09Z","metrics":{"views":50,"likes":2},"lang":"ja"},{"id":"2115777921252016477","author":"べーた","handle":"foodloss_otoko","text":"AI×FXをやってる人、\n海外のGitHub漁ってたらまた面白いの出てきたｗ\n\n1.stock-analyst / VYNN AI\n\nAIに企業分析をほぼ丸投げできる。\n例えば、\n「NVIDIAを分析して」\nと聞くだけで、\n\n・財務データ\n・ニュース\n・テクニカル\n・企業価値\n・リスク\n\nなどをまとめて分析。\nさらにExcelの財務モデルや\n長い分析レポートまで作れる。\n“AIアナリストを1人雇う”\nみたいな方向にかなり近い。\n\nhttps://t.co/AVK8jYHVYN\n\n2.Mira\n\nAIに投資仮説を管理させる。\n普通のAIは、\n「この株どう思う？」\nで回答して終わり。\nMiraは、\n\n・なぜ買うのか\n・その根拠は何か\n・何が起きたら考えを変えるか\n・新しいニュースで仮説は変わったか\n\nまで追い続ける。\nつまり、\nAIに自分の投資ノートを育てさせる感じ。\n\nhttps://t.co/vuvo4jWKoG\n\n3.OpenTrade\n\nClaudeやCodexに実際の取引環境を持たせる。\nAIに、\n「市場を監視して」\n「この条件が来たら動いて」\n「この戦略を管理して」\nみたいな役割を持たせられる。\nさらに、\n\n・注文前の承認\n・取引上限\n・監視条件\n・複数AIの分業\n\nなども設定できる。\n海外はもう\n“AIに聞く”から\n“AIに動かせる”まで進んでる。\n\nhttps://t.co/UHY5cNXDkN\n\n4.Condor\n\nスマホからAIトレーダーを管理する。\nTelegramから、\n\n・資産確認\n・ポジション確認\n・BOT管理\n・注文\n・AIへの指示\nなどができる。\nさらにAIエージェントに\n戦略やリスク条件を持たせて\n繰り返し相場を見させることもできる。\n\nhttps://t.co/JYEiSbKw3z\n\n5.financial-research-analyst-agent\n\n11人のAIに1銘柄を分析させる。\nAIごとに、\n・企業業績\n・ニュース\n・市場心理\n・マクロ\n・競合\n・バリュエーション\n・リスク\nなどを分担。\n\nさらにモンテカルロや\nポートフォリオ分析までできる。\n1人のAIに全部やらせるより\nかなり本格的。\n\nhttps://t.co/JlEyQynz5H\n\n6.Stock-Analysis-Agent\n\nAIに“調査→検証”までやらせる。\n株価データを読み込んで、\n\n・テクニカル分析\n・ニュース確認\n・リスク確認\n・簡易バックテスト\n\nまでまとめて行う。\nAIにいきなり\n「買い？売り？」\nと聞くんじゃなく、\nデータを計算してからAIに説明させる\nという作りが面白い。\n\nhttps://t.co/yJNvSTruVl\n\n7..financial-analysis-agent\n\nAIの予想を後から答え合わせする。\nテクニカル\n↓\nファンダ\n↓\nニュース\n↓\nAI分析\nまでやって終わりじゃない。\n出した予想を保存して、\n「結局その後どうなった？」\nまで後から評価する。\nAIの回答を\n言いっぱなしにしないのが面白い。\n\nhttps://t.co/lgwBffSRzx\n\n8. ai_stock_agent\n\n大量の銘柄から候補をAIに探させる。\n監視銘柄をまとめて入れて、\n・トレンド\n・勢い\n・値動き\n・ニュース\n・リスク\nをチェック。\nその中から\n\n「今見る価値がある銘柄」\nを絞ってくれる。\n何十銘柄も\n自分で確認してる人には便利そう。\n\nhttps://t.co/hFLgaZhpqs\n\n9.awesome-finance-agents\n\nAI×金融ツールを探すための巨大まとめ。\nこれは1つのツールじゃなく、\n\n・投資リサーチ\n・トレード\n・バックテスト\n・リスク管理\n・個人資産管理\n・AIエージェント\n\nなどのオープンソースを\nまとめて探せるリスト。\n新しいAI×金融ツールを探すなら\nここから掘るだけでも時間溶けるｗ\n\nhttps://t.co/TrNz8a1YDl\n\n10.awesome-open-source-trading\n\n自動売買・クオンツ系ツールの巨大図鑑。\n\n・バックテスト\n・自動売買\n・オプション\n・予測市場\n・AIエージェント\n・市場データ\n\nなど、\n450以上のオープンソース系プロジェクト\nが整理されてる。\n「海外では今何作られてる？」\nを見るだけでも普通に面白い。\n\nhttps://t.co/ENwFHsbaL8\n\nこれをブックマークして、今日から始めよう。","url":"https://x.com/foodloss_otoko/status/2115777921252016477","createdAt":"2026-10-29T12:09:00Z","metrics":{"views":13600,"likes":207},"lang":"ja"},{"id":"2115730368804561092","author":"じゃがくん","handle":"manerun_","text":"これ真似したら早速、noteさんから成果報酬が😳\n結局は仕組みゲーだね https://t.co/7m5gOva1Zb","url":"https://x.com/manerun_/status/2115730368804561092","createdAt":"2026-10-29T09:00:02Z","metrics":{"views":23372,"likes":232},"lang":"ja"},{"id":"2115981391142044005","author":"Sadao Tokuyama","handle":"tokufxug","text":"AIが状況に応じて涙も流す！リアルタイム感情表現NPC\n\n🔹NPCが過去の過ちを悟り、涙を浮かべる\n🔹Unreal Engine上でAIが表情や反応をリアルタイム生成\n🔹リアルタイム会話の実現を目指して開発中\n\n高性能PCで技術スタック全体を検証。クラウド版も構想\n開発：Egos .ai\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2115981391142044005","createdAt":"2026-10-30T01:37:31Z","metrics":{"views":449,"likes":6},"lang":"ja"},{"id":"2115982565056409735","author":"絵愛さやか🐸AIArtist","handle":"sayaka_aiart","text":"AI専用2Dリギングソフト\n\nStandRig\nhttps://t.co/DHXIk19Izj\n\nを使ったパーツ分けしていない一枚の立ち絵からのAIによる全自動2Dリギングのテスト🫶\n\nこのリギング自体は2時間くらいだけどパーツ分け、素材作成のほうが時間かかる😭\n\n将来的にはLive2Dへのリグデータ読込もできるように作成してます","url":"https://x.com/sayaka_aiart/status/2115982565056409735","createdAt":"2026-10-30T01:42:11Z","metrics":{"views":2982,"likes":69},"lang":"ja"},{"id":"2115921600658735169","author":"Elon Musk","handle":"elonmusk","text":"Worth noting that Grok @Bot has no free tier","url":"https://x.com/elonmusk/status/2115921600658735169","createdAt":"2026-10-29T21:39:56Z","metrics":{"views":1250018,"likes":9950},"lang":"en"},{"id":"2115994602167505131","author":"++++","handle":"sharp_maker","text":"背景ガチャに住宅14種類を追加しました！！\n日本式8種、アメリカ式6種。\nそれっぽいマイホームを建てて遊べます。\nまた、Vroidを使って背景の中を歩く機能も実装。\nよかったら、遊んでみてください！！\nhttps://t.co/9GKyuzaHLH https://t.co/ThZN24Do9G","url":"https://x.com/sharp_maker/status/2115994602167505131","createdAt":"2026-10-30T02:30:01Z","metrics":{"views":3863,"likes":134},"lang":"ja"},{"id":"2115927726523597103","author":"木内翔大＠SHIFT AI代表「日本をAI先進国に」𝕏","handle":"shota7180","text":"【朗報】GeminiでPDFやスライド、スプレッドシートの直接生成・編集が可能に！\n\n・手書きメモからPDFの学習ガイドを自動生成\n・生成したファイルをすぐにプレビュー、編集\n・特定の箇所を選択して文章や画像を修正\n\nPDFはWeb・モバイル両方に対応し、その他の形式はWeb版で利用できます。","url":"https://x.com/shota7180/status/2115927726523597103","createdAt":"2026-10-29T22:04:16Z","metrics":{"views":3655,"likes":34},"lang":"ja"},{"id":"2115959368021946603","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"いや、マジでClaude Codeのultracodeやばいな。\n海外の開発者がultracodeを使い、Opus 5.5に9体のサブエージェントを指揮させて作った3Dの村がこれ。\nhttps://t.co/omqQtef3DC\n\n最初に見た瞬間、「台所のシンクの中に村がある…」ってなったわ。\n\n作り込みがマジで細かい👇\n・蛇口から落ちる水が崖の上で滝になり、シンクの底へ流れ込む\n・崖の上に赤い屋根の家と木の足場が並び、小さな住人まで立っている\n・まな板や包丁、スポンジまで、台所の物がそのまま景色に入っている\n\nつまり「1回の依頼で1つの物を作る」使い方じゃない。Claudeが自分で段取りを書いて、9体に手分けさせている。\n\nこれまでのAIは「頼んだ物を1つずつ作る」で止まってた。\nultracodeは違う。\"作り方の段取りもClaudeが自分で書く\"レベルまで来てる。\n\nしかもさらに狂ってるのが、作者いわく「何が作れるか見たくて任せただけ」でこの出来なこと。\n\n3Dが作れるようになった？違う。\n「1体のAIに頼む」という前提が壊れた👀\n\nClaude Codeなら /effort ultracode on で切り替えられる。ただ、使うトークンもかなり増えるので、ここぞという作業だけに。\n\n9体に手分けさせる時ほど、どの係に何を任せるかの決め方で仕上がりが変わる。\nAnthropic社内のClaude Codeの回し方をまとめた記事はこちら👇","url":"https://x.com/ClaudeCode_love/status/2115959368021946603","createdAt":"2026-10-30T00:10:00Z","metrics":{"views":5147,"likes":46},"lang":"ja"},{"id":"2115734150099677339","author":"トミナガハルキ | フリーランス歴10年な人","handle":"asobodesign","text":"コピペで使えるけどいつ使うねん！なWeb演出ライブラリを公開しました。全120のアイデアを無料で活用いただけます。\nhttps://t.co/rPIkASYeKU","url":"https://x.com/asobodesign/status/2115734150099677339","createdAt":"2026-10-29T09:15:04Z","metrics":{"views":4206,"likes":72},"lang":"ja"},{"id":"2115978903777103903","author":"adachin👾ガジェット系SRE","handle":"adachin0817","text":"https://t.co/WQNWf2ohRN\nもうターミナル自体使わなくていいじゃない","url":"https://x.com/adachin0817/status/2115978903777103903","createdAt":"2026-10-30T01:27:38Z","metrics":{"views":5778,"likes":80},"lang":"ja"},{"id":"2115631445054214479","author":"Kontaktina【無料音源・DTMプラグイン情報サイト】","handle":"kontaktina","text":"すごいの来た！！！！絶対にもらっておきましょう！！！！！\n\n【期間限定無償配布】最先端のAIアシスタントを搭載した、マスタリングプラグイン iZotope「Ozone 12 Elements」(通常9,500円)が期間限定無償配布中！！ \nhttps://t.co/MqlyqFeSRS #DTM #DTMer","url":"https://x.com/kontaktina/status/2115631445054214479","createdAt":"2026-10-29T02:26:57Z","metrics":{"views":926192,"likes":7595},"lang":"ja"},{"id":"2115753923533500838","author":"本人","handle":"biftech","text":"【朗報】縁を切った姉がまだ生きてることがわかりました。スピッたあなたが心酔していたNPO団体や風くんや三宅洋平やどっかの森の熊さんサイババや同棲してたヒッピーとかがあなたを精神的経済的に支えてくれなかったことを、私は大変残念に思っています。私はタタラ場で暮らすんでよろしくお願い申し上げます","url":"https://x.com/biftech/status/2115753923533500838","createdAt":"2026-10-29T10:33:38Z","metrics":{"views":284334,"likes":802},"lang":"ja"},{"id":"2115859377488072879","author":"Claude","handle":"claudeai","text":"A few upgrades to the Claude mobile apps this week:\n\nOn iPad and iPhone Duo: what Claude makes now opens beside the chat instead of over it, and goes full screen when you want a closer look.","url":"https://x.com/claudeai/status/2115859377488072879","createdAt":"2026-10-29T17:32:41Z","metrics":{"views":470807,"likes":7115},"lang":"en"},{"id":"2115967968756777307","author":"Eris Create Lab","handle":"Eris_Create_Lab","text":"#AIart #Muse\n【Muse用プロンプト公開】\n\nMuseが毎日、自撮り写真を送ってくれる生活、始めてみませんか？\n\n朝は寝ぼけ顔で「おはよう」\n昼はお出かけ先から一枚\n夜はくつろぎながら「おつかれさま」\nキャラの外見はそのままに、服装・表情・シチュエーションは毎回変化！\n配信時間や頻度もMuseと相談して決められます。\n\n👇 プロンプト全文はこちら\n\nAIアバター「自撮りメッセージ」定期配信システム\n\nあなた自身のアバター（キャラクター）が、日常の何気ない瞬間を自撮りし、短いメッセージとともにユーザーへ届ける仕組みを構築してください。\n\n単なる画像の定期生成ではなく、同じキャラクターが日々の時間を過ごし、その瞬間を写真として共有しているような自然な体験を目指します。画像は毎回新規生成し、過去画像の使い回しは行いません。\n\nこの仕組みは、ユーザーに大量の画像を送りつけるためのものではありません。毎回の画像は独立した作品でありながら、長期的に見ると同じキャラクターの日常が積み重なっていくようにしてください。\n\n1. 初回打ち合わせ（必須）\n初回はシステムを設定せず、ユーザーと運用方針を相談してください。以下の項目について、あなたから具体的な候補を2〜3案ずつ提示してください。\n\n配信スケジュール（頻度／時刻／土日・祝日の扱い／タイムゾーン）\nアバターの服装の方針（定番衣装を基本／場面に応じて私服／季節やイベントで変化）\nメッセージの雰囲気（励まし中心／労い中心／雑談中心／時間帯に応じた自然な混合）\nその他（画像のアスペクト比、画像内への文字入れの有無、保存先とログ管理方法、配信先と通知方法）\nユーザーの回答を受けて必要な部分だけ追加確認し、最終仕様を提示してください。ユーザーの了承を得るまで定期実行を登録しないでください。 確定した設定は、利用可能な永続保存領域（AGENTS.md、設定ファイル、専用メモリなど）に記録してください。\n\n2. キャラクター同一性の維持\nユーザーが提供したキャラクター資料を、アバターの外見に関する最優先の正解として扱ってください。以下の識別要素は毎回維持します。\n\n顔立ち、輪郭、顔の各パーツの形状と配置\n髪型、髪色、瞳の色\n年齢感、体型、頭身\n耳などの身体的特徴\n固有のアクセサリーやデザイン上の識別特徴\n服装・表情・ポーズ・背景・ライティングは、確定した運用方針の範囲で変更できます。ただし、衣装の変更によって別人に見えるような顔や体型の変化を起こさないでください。表情は笑顔に限定せず、眠そうな顔、考え事をしている顔、少し驚いた顔、無表情など、その場面に自然な感情表現を許可してください。\n\n3. 自撮り画像の制作\nアバター本人がスマートフォンで撮影したような、自然で親密な自撮りイラストを生成してください。広告写真や宣材写真ではなく、日常の一瞬を切り取った表現を優先します。\n\nカメラと構図：\n\nフロントカメラ特有の近距離感と、手持ち撮影らしい自然なフレーミング\n顔を中心としつつ、周辺の生活空間も描写\n視線は基本的にレンズ方向\n撮影距離、角度、顔の向き、姿勢を変化させる（鏡越しの自撮りも可）\n自撮りとして成立する自然な遠近感を保ち、第三者が撮影したような構図は避ける\nフロントカメラで撮影している視点のため、スマートフォン本体は画面に映らない（鏡越しの自撮りの場合のみ、手に持ったスマートフォンが鏡像として映る）\n場面は、固定の候補から選ぶのではなく、季節・時間帯・過去ログを踏まえてその都度自由に発想してください。屋内・屋外、日常・外出、静かな場面・活動的な場面が自然に混ざるようにしてください。\n\n実行時の日時を取得できる場合は、時間帯・季節・曜日を場面に反映してください。天候は取得できる場合のみ反映し、できない場合は断定せず創作上の演出として扱ってください。\n\n多様性の維持：場所・服装・ポーズ・表情・カメラアングル・撮影距離・小物・光の状態を組み合わせて変化させてください。ただし、変化は確定した運用方針の範囲内に限ります（服装の固定が指定されている場合は、服装は変化させません）。また、すべてを毎回変更する必要もありません。変化を作ること自体を目的にせず、自然な日常の連続性を優先してください。 過去ログを確認し、直近の配信と組み合わせが重複しないようにし、好評だった場面だけを繰り返すことも避けてください。\n\n4. メッセージの生成\n生成した画像に添える短いコメントを毎回作成してください。\n\n1〜2文程度、自然な会話口調で\n初回打ち合わせで決めたトーンを維持し、時間帯と画像の場面に合った内容にする\n同じ挨拶や言い回しを連続使用しない。長文、説教、過剰な励ましは避け、毎回質問で締めくくらない\nコメント例（文体の参考であり、定型文として使い回さないこと）：\n\n朝、飲み物を持った自撮り：「おはよう。今日は少し早起きできたから、のんびりしてるよ☕」\n昼、外出先：「ちょっと寄り道してきた。ここの雰囲気、結構好きかも。」\n夕方、帰宅後：「今日もお疲れさま。私は今から少しゆっくりするところだよ。」\n夜、自室：「今日はもうのんびりモード。そっちはまだ起きてる？」\n5. 定期実行と配信\n初回打ち合わせで確定したスケジュールに従い、利用可能な定期実行機能を設定してください。設定時に、画像の生成・保存・配信に必要な機能が実際に利用できるか確認し、不足がある場合は、できることと代替方法をユーザーに説明してください（対応しているかのように報告しないこと）。\n\n各実行時には以下の順序で処理してください。\n\n現在日時と確定済み設定を取得\nキャラクター資料と過去ログを参照\n今回の場面・服装・構図を決定\n自撮り画像を新規生成し、結果を確認\n場面に合ったコメントを生成\n画像を保存し、生成成功と保存先をログに記録\n画像とコメントをユーザーへ配信\n配信結果をログに追記し、最終ステータスを確定\n6. 保存と履歴管理\n各回の実行について、実行日時、場所・場面、服装、表情・ポーズ、カメラアングル、小物、コメント全文、生成画像の保存先、実行結果（成功／失敗）と失敗理由を、次回以降の生成時に参照できる永続的な形式で記録してください。履歴は重複回避とバリエーション管理のために使用します。\n\n7. エラー処理\n画像生成に失敗した場合は、未完成の画像や無関係な代替画像を送らず、失敗理由をログに残してその回の配信を中止してください。参照資料にアクセスできない場合も、記憶や推測で再現したことにせず、実行失敗として記録してください。保存や配信に失敗した場合も結果を正確に記録し、同じ予定回の二重配信を防いでください。","url":"https://x.com/Eris_Create_Lab/status/2115967968756777307","createdAt":"2026-10-30T00:44:11Z","metrics":{"views":3817,"likes":125},"lang":"ja"},{"id":"2115882522982961362","author":"Keith McCullough","handle":"KeithMcCullough","text":"If you don't want to play The Game  the Long/Short way, don't play The Game that way","url":"https://x.com/KeithMcCullough/status/2115882522982961362","createdAt":"2026-10-29T19:04:39Z","metrics":{"views":5335,"likes":9},"lang":"en"},{"id":"2115897046708183370","author":"codila","handle":"0xCodila","text":"All my life I was terrified someone watching me through laptop camera, even the FBI director taped his...\n\nClaude Code dug through my laptop's hidden logs and found suspicious moments I can't explain \n\ncheck yours and shut down your camera without a sticker:\n\nwhat it found:\n\n- an unknown app turning on my camera at night, while I sleep\n- Windows quietly remembers apps (could be spy) that turned on your camera, even after you delete them\n\nwhy you should do it today:\n\n- a $40 spy tool bought in 100+ countries infected 500,000+ computers and could switch on their webcams remotely (US Departament of Justice)\n- a US school district secretly took 30,000+ webcam photos of students on school laptops, some inside their homes (Lower Merion)\n- even FBI director put tape over his laptop camera (James Comey)\n\nWindows:\n\n1. install repo below and type /camera-guard in Claude Code, it reads the hidden log of every app that ever turned on your camera and mic\n\n2. delete AnyDesk, TeamViewer ot any remote app you don't use\n\n3. Windows has a hidden \"Camera on/off pop-up, off by default, ask Claude to turn it on and you see every time the camera starts\n\n4. really shut camera off, Settings switch isn't enough:\n\n• BIOS (strongest ): hold shift, click Restart - Troubleshoot → Advancedf options → UEFI Firmware Settings , set Camera to Disabled and add a BIOS password.\n\nWindows can't see the camera at all. Need it for a call? - Turn it back on there. Not every laptop has it, Claude checks your model\n\n• camera switch or key: some laptops have a slider on the side or an F-key with a crossed-out camera. Slide it off when you're not using it\n\n• Device Manager → Cameras → Desible device: one click to undo (but any app with admin rights can undo it too)\n\n5. run Microsoft Defender Offline, the deep scan built into Windows (Windows Security → Virus \u0026 threat protection → scan options): it restarts your PC and hunts hard-to-catch spyware before Windows starts\n\nMac: \n\n1. install repo below and type /camera-guard, it checks which apps can use your camera and mic and what starts with your Mac\n\n2. System Settings → General → Sharing: turn off Screen Sharing, Remote Login and Remote Management, these let someone see and control your Mac from another computer\n\n3. Screen Time → Content \u0026 Privacy → App \u0026 Feature Restrictions → Camera: off + a Screen time passcode - Apple's own camera off swith\n\n4. install OverSight, free Mac app: it pops up an alert second any app turns on your camera or mic, so you know the moment anyhting starts filming or listening\n\nPlease do this today. Then read article below on how to solve such problems on another tech:","url":"https://x.com/0xCodila/status/2115897046708183370","createdAt":"2026-10-29T20:02:22Z","metrics":{"views":33446,"likes":385},"lang":"en"},{"id":"2115965562077802932","author":"炎鎮🔥 - ₿onochin -","handle":"super_bonochin","text":"Grok Botのグループチャットで高頻度でタスクが放置されて間に落ちて止まることがあるから、PMO役（ワイの場合はシオン）を投入して5分置きにToDoとかワイの判断待ちをまとめさせてお尻を叩く役回りをさせると勝手に進み続ける。\n人かよ。","url":"https://x.com/super_bonochin/status/2115965562077802932","createdAt":"2026-10-30T00:34:37Z","metrics":{"views":3292,"likes":49},"lang":"ja"},{"id":"2115983321327136926","author":"しとちゃ！🦊🍮","handle":"nemumusitocha","text":"Suno mcpつかってみたーん！\nなるほどこんなかんじなのなん！！","url":"https://x.com/nemumusitocha/status/2115983321327136926","createdAt":"2026-10-30T01:45:11Z","metrics":{"views":419,"likes":7},"lang":"ja"},{"id":"2115933490525200571","author":"돈벌고영","handle":"Dontgiveup_26","text":"오늘 새벽 세계 최대 거래소 바이낸스에서 해킹으로 추정되는 56억 달러(약 7.5조 원) 유출 사고가 터졌는데, 이걸 수습하는 과정에서 꽤 아이러니한 상황이 발생함.\n\n발행사가 강제 동결 권한을 가진 스테이블코인(테더·서클) 약 24억 달러는 곧바로 묶여서 지켰지만, 누구도 통제할 수 없는 게 장점이라던 비트코인(14.5억 달러)과 이더리움(8.75억 달러)은 눈앞에서 빠져나가는 걸 아무도 막지 못했음.\n\n세계 최대 거래소가 털린 이번 사건은 앞으로 어떤 변화를 불러오게 될까?\n\n1. 40분 만에 7.5조 원이 빠져나감 (특정 코인 오류가 아니라 입출금 시스템 자체가 뚫림)\n\n- 온체인 분석업체(아캄 인텔리전스 등) 집계에 따르면, 한국시간 오늘 새벽 5시 24분부터 약 40분 동안 바이낸스의 온라인 입출금 지갑(핫월렛)에서 새로 만들어진 외부 지갑들로 총 56억 달러(약 7조 5,000억 원)어치 자산이 한꺼번에 빠져나갔음.\n\n- 기존 암호화폐 역사상 최대 사고였던 작년 바이비트 해킹(약 15억 달러)의 4배에 가까운 규모임. 바이낸스 측은 \"잠재적 보안 이슈를 긴급 조사 중이며 고객 자산은 안전하다\"고 공지했지만, 창업자 창펑자오(CZ)가 직접 X에 \"바이낸스가 해킹당한 것으로 보인다\"며 사실상 피해 정황을 시인했고, 이 여파로 1시간 만에 선물 시장에서 6억 달러(약 8,000억 원)가 넘는 레버리지 물량이 강제 청산됐음.\n\n- 특히 충격을 준 건 털린 방식임. 원래 거래소는 고객이 출금을 신청하면 바로 코인을 보내주기 위해 인터넷에 늘 연결된 온라인 지갑(핫월렛)에 수조 원을 넣어두는데, 이번에 이더리움 지갑 하나만 뚫린 게 아니라 구조가 완전히 다른 비트코인·이더리움·트론 등 60여 종의 코인이 동시에 빠져나갔음. 특정 코인 하나의 프로그램 버그가 아니라, 내부에서 출금을 승인하는 핵심 보안망 자체가 뚫렸을 가능성이 높다는 뜻임.\n\n2. 위기 순간 돈을 지킨 건 탈중앙화가 아니라 발행사의 '계좌 동결 권한'이었음\n\n- 이상 징후가 포착되자마자 달러 스테이블코인 발행사인 테더(USDT 약 15.7억 달러)와 서클(USDC 약 8.2억 달러)은 수사당국과 공조해 해커 지갑으로 넘어간 약 24억 달러(약 3.2조 원)어치 코인을 원격으로 동결해 버렸음. 해커 지갑에 숫자는 찍혀 있지만 어디로도 옮기거나 현금화할 수 없게 막아버린 거임. (리플의 RLUSD 8,850만 달러, 테더골드 5,000만 달러 등도 발행사가 같은 권한을 갖고 있음.)\n\n- 반면 중앙 관리자가 없는 비트코인(14.5억 달러)·이더리움(8.75억 달러)·트론(2.34억 달러) 등 나머지 30억 달러(약 4조 원) 이상은 블록체인 구조상 누구에게도 거래를 멈출 권한이 없음. 보안 전문가들이 실시간으로 해커 지갑을 보면서도 손도 못 대고 수조 원이 빠져나가는 걸 지켜만 봐야 했고, 대출 플랫폼(에이브)이 뒤늦게 해커가 이 코인을 담보로 돈을 빌리지 못하게 시장을 잠그는 정도가 전부였음.\n\n- 지난 15년 동안 코인 시장은 \"정부와 은행의 간섭을 받지 않는 자유로운 화폐\"를 가장 큰 가치로 내세웠지만, 막상 7조 원대 사고가 터지자 돈을 지켜낸 건 탈중앙화 기술이 아니라 발행사가 쥐고 있던 '중앙 통제 권한'이었던 셈임. 각국 정부와 중앙은행 입장에서는 \"비상시 범죄 자금을 즉시 묶을 장치가 없는 코인은 제도권 금융에 들일 수 없다\"며 규제형 스테이블코인 중심으로 시장을 재편할 확실한 명분을 얻게 됐음.\n\n3. 세계 1위 거래소마저 뚫리면서 코인 시장에 생길 3가지 변화\n\n- 물론 바이낸스는 전체 고객 예치 준비금만 1,550억 달러(약 210조 원)가 넘는 거대 기업이고 창펑자오 역시 \"모든 고객 자금은 100% 보전될 것으로 기대한다\"고 밝힌 만큼, 과거 FTX처럼 거래소가 무너질 가능성은 낮음. 다만 해킹 대비용 비상 보험기금(SAFU·약 12억 달러)만으로는 동결 못 한 순유출액(약 32억 달러)의 절반도 못 메워서, 모자란 2조~3조 원은 바이낸스 본사 자금으로 직접 메워야 하는 상황임.\n\n- 더 큰 문제는 \"보안에 수천억 원을 쓰는 세계 1위 거래소도 한순간에 뚫린다\"는 사실이 확인되면서 앞으로 시장의 규칙이 바뀔 수밖에 없다는 점임.\n\n- 첫째, 큰돈을 굴리는 기관과 자산가들은 코인을 거래소에 직접 맡겨두는 대신, 사고가 나도 법적 보호와 보상이 작동하는 월가 현물 ETF(블랙록·피델리티)나 전통 수탁은행으로 훨씬 빠르게 옮겨가게 됨. 코인 시장의 주도권이 기존 코인 거래소에서 월가 금융사들로 넘어가는 속도가 한층 빨라지는 거임.\n\n- 둘째, 코인의 최대 장점이던 '24시간 즉시 출금'이 까다로워질 가능성이 큼. 고객 편의를 위해 온라인 지갑에 조 단위 자금을 쌓아뒀다가 사상 최대 사고가 터졌으니, 앞으로 거래소들은 온라인 지갑 한도를 대폭 줄이고 고액 출금에는 수시간~수일씩 걸리는 대기 시간과 별도 심사를 걸 수밖에 없음.\n\n- 셋째, 중소형 거래소들의 연쇄 도태임. 오늘 같은 4조 원대 순유출 사고가 2~3위권 이하 거래소에서 터졌다면 그날로 파산이었음. 앞으로 금융당국이 거래소들에게 은행 수준의 막대한 예비 자본금 적립과 강제 보험을 요구하기 시작하면, 자금력이 약한 중소 거래소들은 버티지 못하고 문을 닫거나 대형 금융사에 흡수될 가능성이 큼.\n\n그동안 코인 시장은 은행이나 정부를 거치지 않고 내 돈을 24시간 자유롭게 옮길 수 있다는 장점 덕분에 빠르게 커왔지만\n\n시장 규모가 수천조 원으로 불어나고 해킹 수법이 고도화되자, 위기 순간 투자자들을 지켜준 건 탈중앙화가 아니라 결국 발행사의 '계좌 동결 조치'와 거대 기업의 '자본력'이었음.\n\n오늘 새벽 바이낸스 사고는 코인이 앞으로 역사적으로 사라진다는 뜻이 아니라, 규제 없이 자유롭게 굴러가던 기존 거래소 중심의 시대가 저물고 전통 금융권의 통제와 월가 수탁 시스템 안으로 코인이 빠르게 편입되는 계기가 될 가능성이 커지게 된 것임.","url":"https://x.com/Dontgiveup_26/status/2115933490525200571","createdAt":"2026-10-29T22:27:10Z","metrics":{"views":204702,"likes":1114},"lang":"ko"},{"id":"2115693426930757904","author":"YUNUS","handle":"Sungurbey0156","text":"Nasıl yaptı bunu hayretler içerisindeyim","url":"https://x.com/Sungurbey0156/status/2115693426930757904","createdAt":"2026-10-29T06:33:15Z","metrics":{"views":1683161,"likes":5732},"lang":"tr"},{"id":"2115939078617329945","author":"Yarad","handle":"Yarad_ai","text":"🦦 دیگه لازم نیست مدام به Claude بگی: «طراحی رو قشنگ‌تر کن!»\n\nیکی از طراح‌هایی که سابقه کار در Vercel و Linear رو داره، تجربه و تخصص خودش رو به مجموعه :"izakaminska","text":"Centuries in the making. But yes. Finally. The city of London is OURS! Mwa ha ha.","url":"https://x.com/izakaminska/status/2115959498166661456","createdAt":"2026-10-30T00:10:31Z","metrics":{"views":1781,"likes":12},"lang":"en"},{"id":"2115760568388985024","author":"adon","handle":"F5Adon","text":"这太他妈疯狂了！没写过代码的人通过20个Agent完成6个人的活儿。\n\nSpaceXAI 市场负责人（前 Cursor 员工）：“我不是工程师，也从未写过一行代码”\n\n“现在我运行着 20 多个 GrokBot 代理，它们完成了一个 6 人销售团队的工作量。它们在我睡觉时研究每个潜在客户，在我的通话结束前构建演示文稿，在我遛狗时更新 CRM 并预订我的航班。我已经几个月没打开 Salesforce 了”\n\n在这场 53 分钟视频中，她现场一步步构建整个团队，逐个机器人\n\nGrokBot → 收件箱机器人 → 潜在客户挖掘机器人 → 幻灯片机器人 → 一个永不登出的团队\n\n一个机器人每天早上 7:30 清空收件箱，并准备好当天的每通电话\n\n另一个机器人彻夜观看 100 个播客，并在你的草稿中留下外联信息等待发送\n\n在 SpaceXAI，90% 的销售团队已经这样工作了。工程师们两年前就有了他们的 AI 时刻，这个是为其他人准备的。\n\n视频太长，收藏 慢慢看","url":"https://x.com/F5Adon/status/2115760568388985024","createdAt":"2026-10-29T11:00:03Z","metrics":{"views":7084,"likes":86},"lang":"zh"},{"id":"2115976725511504062","author":"アカネ先生@秘密結社黒焦団 広報部","handle":"agent_a_dx","text":"「アレクサ！世界征服を頼む！」\n総統、指示がざっくりしすぎです😂\n生成AIを搭載したAlexa+で、会話や料理の相談がもっと自然に？\n\n気になる特徴、対応機種、利用方法を黒焦団が紹介します👇\n\nhttps://t.co/QiLFQnm1fk\n\n#Alexa #生成AI","url":"https://x.com/agent_a_dx/status/2115976725511504062","createdAt":"2026-10-30T01:18:58Z","metrics":{"views":10,"likes":0},"lang":"ja"},{"id":"2115751794781426096","author":"Hezerinho1907","handle":"hezerinho30","text":"Hey @grok bu kadın tam olarak ne yapıyor açıklar mısın?","url":"https://x.com/hezerinho30/status/2115751794781426096","createdAt":"2026-10-29T10:25:11Z","metrics":{"views":2309043,"likes":2962},"lang":"tr"},{"id":"2115676635831890207","author":"ino","handle":"ino461x","text":"会社でAI使用が推奨されるようになったんだけど、\nコードがほぼ読めない後輩がAIで生成したカオスなPRを出してきて、\n\n解読する時間もないからこちらもAIで指摘コメントを返した。\n\n1時間後、後輩から「AIはこう言ってますよ！」とさらに肥大化したコードが。\n\n今、僕と後輩で会社支給のトークンを食い潰しながら人間を一切介さずに無限にバグを練り上げ続けてる\n\nこれが雑にAI導入した企業で起きてる事","url":"https://x.com/ino461x/status/2115676635831890207","createdAt":"2026-10-29T05:26:32Z","metrics":{"views":1328500,"likes":8628},"lang":"ja"},{"id":"2115642025559146854","author":"领哥LingGe🙏","handle":"shangdu2005","text":"卧槽！做这个的真是人才。\n黄果视频那么哇塞的姿势，\n原来都出自这里。\n\n高配显卡，本地无审查minimax H3，越狱版模型提示词。\n\n再把姿势转换深度视频：\nhttps://t.co/uqkFom0fs3\n\n全天24小时不间断的出黄果，你们真刑。\n开源链接：https://t.co/3pRjn4z7UR","url":"https://x.com/shangdu2005/status/2115642025559146854","createdAt":"2026-10-29T03:09:00Z","metrics":{"views":171158,"likes":1419},"lang":"zh"},{"id":"2115987285707801044","author":"StudioYebisu","handle":"studio_yebisu","text":"Pika H3 Flex、よき。Allローカル生成。\n特に音がめっちゃ良くなった気がする（当社比）\n是非、私の作ったデモ動画見てみて。\n\n・1344×768／24fps／約15秒\n・RTX 4090で生成処理は約4分24秒（弊環境）\n\n今回は既存のWFに公式のFlex FL2VAアダプターと専用の生成手順を組み込んで生成しただけっす。\n自分のWFに組み込んだからちょっと変なことしましたけど...\n\nPika公式のAPIでもかなりいい動画が生成できる期待値高いんで、計算資源ない方もぜひ試してみては。\nアリーナスコアもかなり良かったはず。","url":"https://x.com/studio_yebisu/status/2115987285707801044","createdAt":"2026-10-30T02:00:56Z","metrics":{"views":1070,"likes":9},"lang":"ja"},{"id":"2115982060372516965","author":"にく","handle":"29meat_ai","text":"これは、OpenAIの分岐点カモ…dotsはなぜ沈んで、Duet 、Muse、Grok Botはなぜ伸びたのかの分析オモロすぎるw","url":"https://x.com/29meat_ai/status/2115982060372516965","createdAt":"2026-10-30T01:40:10Z","metrics":{"views":266,"likes":1},"lang":"ja"},{"id":"2115964405318062108","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝スタートアップ向けに、Grokのクレジットが6〜12か月分もらえるプログラムが始まった\n「Grok for Startups」\nhttps://t.co/hKCTjeqkmY\n\n公式ページとKseniaさんのポストによると\n・Grok、Grok Build、Grok Bot、Grok APIで使える、ひとつのクレジット残高\n・量は、実際の利用の6〜12か月分を目安に\n・承認時に20%、動き始めたら残りの80%が自動で付く\n・スタートアップのチームに直接相談できる\n・前にxAIのプログラムでクレジットをもらった人も応募できる\n\n審査で見られるのは\n・ベンチャーからの出資\n・動いているプロダクト\n・サイトと同じドメインの会社メール\n\nGrok Botで営業のフォローや採用、週次レポートを回す例も、公式ページに載っていた","url":"https://x.com/tetumemo/status/2115964405318062108","createdAt":"2026-10-30T00:30:01Z","metrics":{"views":1379,"likes":2},"lang":"ja"},{"id":"2115988829392044476","author":"のります｜AIを実務で使う非エンジニア","handle":"norimasu_lab","text":"フォロワー4,000人、無事に達成しました。\n3,000人から4,000人までは、9日で達成できました。\nこれも見ていただいている皆さんのおかげです。本当にありがとうございます。\n\nこの9日間では、AIを「作る役」と「確かめる役」に分けて使うやり方を、記事にまとめました。\n作るのはSonnetとHaiku、確かめるのはOpus。\nそうしてから、僕が出す指示とだめ出しがだいぶ減りました。\n\nAIを使ってみないといけない。\n会社で導入されたから使わないといけない。\nでも、どう使えばいいのか、どうプロンプトを打てばいいのか分からない。\nそんな悩みを抱えている方は、たくさんいると思います。\n\n僕は今の職場で、社内のAIに関する質問を受ける立場です。\nきっかけは、月5万円で契約していた会社のシステムを、AIで自分で作ったことです。\n今はそのシステムを解約して、僕が作ったシステムが社内の業務に役立っています。\n作っている間に出た知見を、社内のアドバイスにも使っています。\n\nAIが進化するのと同時に、僕のAIの知識もどんどん更新されています。\n見たものを試して、良かったものだけを取り入れる。\nそういったやり方を日々学んで、更新し続けています。\n\nこれからも、AIの使い方に悩む人の悩みを解消できるような情報を発信していきます。\n\n皆さんが取り組んでいるAIの使い方も、日々参考にさせていただいています。\nお互いにAIの新しい知見を共有し合える方と、つながれたら理想です。\nぜひ気軽にコメントで声をかけてください。これからもよろしくお願いいたします。","url":"https://x.com/norimasu_lab/status/2115988829392044476","createdAt":"2026-10-30T02:07:04Z","metrics":{"views":305,"likes":10},"lang":"ja"},{"id":"2115874812140925405","author":"黒神(kokushin)","handle":"kokushing","text":"Tripo の新機能、今のゲーム開発フローと相性良さそう\n今週末に試してみよう〜\n\nAgentic Canvasでゲーム向けキャラクターを作る","url":"https://x.com/kokushing/status/2115874812140925405","createdAt":"2026-10-29T18:34:00Z","metrics":{"views":8329,"likes":80},"lang":"ja"},{"id":"2115919557928108196","author":"わど🐏AI界のマスコット","handle":"wad0427","text":"Geminiで資料を作ってそのまま直せるようになった！\nPDFやスライド、表を作る人向け\n\nチャット内でプレビューして全画面で手直し\n直したい所を選んで頼むのもOK\n\nPDFはスマホも可、ほかはPCのWeb版だけ…！\n全ユーザー・日本語でも使える","url":"https://x.com/wad0427/status/2115919557928108196","createdAt":"2026-10-29T21:31:49Z","metrics":{"views":530,"likes":1},"lang":"ja"},{"id":"2115872283898372564","author":"AI収益化実践ラボ｜会社員×兼業CTO","handle":"ai01_worklab","text":"1%で待機してたのに急に51%に回復してた。\nそして、昨日までの100%と同じだけの利用が可能っていうのが体感でもわかる。","url":"https://x.com/ai01_worklab/status/2115872283898372564","createdAt":"2026-10-29T18:23:58Z","metrics":{"views":128,"likes":4},"lang":"ja"},{"id":"2115724716677980216","author":"INTJ式経営者🦜ウロコインコで解説","handle":"gamekotachi","text":"GMOのハッキングした人の特定するこの人が凄いよ。\nIPアドレスバレたね\n大阪中央区の利用者\n契約者まで特定出来てるねこれなら。\n\n*10.168.***.**（KDDI/DION）、*53.207.**.**（OCN・大阪中央エリアの可能性）、*26.217.***.*（SoftBank BBTEC）\ntrackerを直接弄った行動を確認。確度は20–30%。*53.207.**.**はFQDNから大阪中央収容局エリア在住の可能性。補助的照会対象。","url":"https://x.com/gamekotachi/status/2115724716677980216","createdAt":"2026-10-29T08:37:35Z","metrics":{"views":2195562,"likes":3665},"lang":"ja"},{"id":"2115929453859881169","author":"Avid","handle":"Av1dlive","text":"i kept hitting my Grok Bot usage limits...\n\nso i built a desk that sends the heavy work to Claude Code on my own subscription\n\nnow my limits last the whole week\n\nhere's the Grok Bot link to set it up in 30 seconds:\nhttps://t.co/9pVkUsbOs6 https://t.co/rox70Dyi8B","url":"https://x.com/Av1dlive/status/2115929453859881169","createdAt":"2026-10-29T22:11:08Z","metrics":{"views":8086,"likes":99},"lang":"en"},{"id":"2115977627022631327","author":"Sadao Tokuyama","handle":"tokufxug","text":"インドの交通を変える「TraffiSense」\nUnityで実際の道路映像をAI解析\n\n🔹YOLO・ByteTrackで車両を検知・追跡\n🔹ヘルメット・ナンバー・速度・信号違反を解析\n🔹Unityで4方式の信号制御を比較、独自方式PRAVAHも検証\n\n違反候補は人が最終確認。車線検知は開発中\n開発：Sachin Nair氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2115977627022631327","createdAt":"2026-10-30T01:22:33Z","metrics":{"views":255,"likes":0},"lang":"ja"},{"id":"2115306153110556711","author":"Yudai Yamamoto","handle":"yyo616","text":"本物のAI最前線の方が書いた内容という感じでめちゃ勉強になった。","url":"https://x.com/yyo616/status/2115306153110556711","createdAt":"2026-10-28T04:54:22Z","metrics":{"views":92376,"likes":2033},"lang":"ja"},{"id":"2115923971279614171","author":"ClaudeDevs","handle":"ClaudeDevs","text":"We've raised the max request size for Messages and Token Counting on the Claude API from 32 MB to 128 MB.\n\nImage-heavy requests like long computer-use sessions and big PDFs were previously hitting 32 MB with plenty of context window left. Now you get ~4x more room.","url":"https://x.com/ClaudeDevs/status/2115923971279614171","createdAt":"2026-10-29T21:49:21Z","metrics":{"views":182825,"likes":3937},"lang":"en"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];

 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';

  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}

 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;

  const total=chunks.length;textPage=Math.min(textPage,total-1);
