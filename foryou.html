<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-24T19:12:48+09:00","posts":[{"id":"2113923432480153665","author":"StudioYebisu","handle":"studio_yebisu","text":"TANSTACK相変わらずイケイケやな。\n\nアプリにAI機能を足すときって\nモデルへの接続、会話の表示、道具の実行、履歴の保存…と、周りに作るものが結構あるじゃないっすか。\n\nTanStack AI 1.0は、そのための部品をまとめた開発用ツールキット。\n\nモデル提供元やUIを選びながら、チャット・音声・画像生成・ツール呼び出しをアプリへ組み込める。\n\nたとえば、今ある編集画面に画像生成を足したり、社内ツールにチャット欄を付けたり。\n\n自分のアプリに合うAI機能を作りたい人向けの話。\n\n安定版になったのはcore API。\n新しいエージェント用harnessやCLIは実験段階で、接続先のモデルや実行環境の費用も別です。","url":"https://x.com/studio_yebisu/status/2113923432480153665","createdAt":"2026-10-24T09:19:55Z","metrics":{"views":647,"likes":2},"lang":"ja"},{"id":"2113777101186969610","author":"オープンソース研究所","handle":"opensourcelab9","text":"","url":"https://x.com/opensourcelab9/status/2113777101186969610","createdAt":"2026-10-23T23:38:27Z","metrics":{"views":824,"likes":5}},{"id":"2113883974506528885","author":"StudioYebisu","handle":"studio_yebisu","text":"おっと…。\nDeepSeep-V4.1-Flash-1017-Abliteraedモデルとは…。\nやっちまいましたね、シャチさん…。","url":"https://x.com/studio_yebisu/status/2113883974506528885","createdAt":"2026-10-24T06:43:08Z","metrics":{"views":13552,"likes":187},"lang":"ja"},{"id":"2113758845990576218","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Codexの利用枠、週の途中で残りわずかになっていませんか\n\n私はまさにそれで、枠が尽きるとリセットの日まで手が止まっていました\n\nしかも使うAIはCodexだけじゃない\nChatGPT、Claude、Grok Bot、dots\n使うAIの数だけ同じ説明をくり返して、「どのAIに何を入れたっけ？」が増えていく\n\n今週の記事は、この2つの悩みをまとめて片付ける話です\n\n・Skillsの原本はGitHubに1つだけ置く\n・AIが読みに来る「受付（MCP）」をCloudflareの無料枠に置く\n・その住所を、ChatGPT・Claude・Grok Bot・dotsに登録する\n\n私が使っている限り、普段のChatGPTのチャットならCodexの枠は減りません\nだから単発の仕事はChatGPT、複雑な流れだけCodex、と分けられるようになりました\n\n原本を直せば、受付が5分ごとに変化を確かめて、数分で全部のAIに最新版が届きます\n\nこんな人に読んでほしいです\n・2つ以上のAIを仕事で使い分けている人\n・Skillsやプロンプト集の置き場所が分からなくなってきた人","url":"https://x.com/tetumemo/status/2113758845990576218","createdAt":"2026-10-23T22:25:55Z","metrics":{"views":5471,"likes":45},"lang":"ja"},{"id":"2113888224342954456","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"【緊急】\nPHP使ってる人、今すぐ見て\n\nこの画像1枚を自分のCodexに読ませろ\nOpenAIが脆弱性チェック用スキルを公開\n重大な「PHP2Shell」の2つのCVEが対象\n\n面倒なプロンプト作成は不要\n画像1枚でチェックから対策まで動き出す\n\n実際のやり方は👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\nこれ、ただのサム・アルトマンの画像じゃない\n\n画像そのものがCodexへの作業指示書\n\nやることは超シンプル\n\nこの画像を保存して\n自分のCodexに読み込ませるだけ\n\n画像の中には\n脆弱性チェックと修正の指示が書かれている\n\nCodexがその内容を読み取り\nPHP環境の調査を進める仕組み\n\n今回の対象は「PHP2Shell」\n\nCVE-2026-109618\nCVE-2026-109619\n\nOpenAIは専用のチェックツール\n「php2shell-checker」をGitHubで公開\n\nhttps://t.co/PVT5qxuiZQ\n\nこの画像には導入手順まで含まれている\n\nCodexがGitHubのスキルを読み込み\n脆弱性の確認作業を支援する\n\nチェック方法は大きく2つ\n\n① サイトのURLからPHP情報を確認\n② サーバー内の稼働環境を直接確認\n\nURLモードではHTTPヘッダーを解析\n\n取得したPHPのバージョン情報を\n修正済みバージョンと照合する\n\n結果はOK・要注意・不明に分類\n\nさらにサーバーへのアクセス権限があれば\nPHP-FPMやApacheの環境も調査できる\n\n実際に動いているPHPを特定し\n必要なアップデートを整理\n\nCodexは修正作業の支援もできる\n\n影響を受ける設定やパッケージを確認し\n必要な変更を提案する\n\n修正後のテストや再確認も重要\n\nただし画像を読み込ませただけで\n脆弱性が自動的に消えるわけではない\n\n本番環境の修正には適切な権限と承認が必要\n\nそれでも、この仕組みは衝撃的\n\nこれまで専門知識が必要だった調査を\n画像1枚からAIに指示できる\n\n難しいプロンプトを自作する必要もない\n\nこれからのセキュリティ対策は\n人間が全部調べる時代から\nAIに調査と修正を支援させる時代へ\n\nPHPサイトを運営しているなら\nこの画像は保存しておきたい。","url":"https://x.com/ai_300/status/2113888224342954456","createdAt":"2026-10-24T07:00:01Z","metrics":{"views":532,"likes":3},"lang":"ja"},{"id":"2113788385097830873","author":"Okazaki Kota | FAKE","handle":"okazakityo","text":"OpenAIが、FDE（Forward Deployed Engineer）の役割を解説している。\n\n顧客の現場に入り、AIを実際の業務で動かす。そこで見つけた課題や解決方法を、他の顧客でも使える仕組みや製品改善につなげる。\n\n興味深いのは、個別案件を成功させるだけで終わらないこと。次に同じ課題が出たとき、FDEが一から作らなくても済む状態をどれだけ増やせるか。FDE組織の価値を考えるうえで重要な視点だと思う。\n\nWhat FDE means at OpenAI https://t.co/38c0Guboqi #FDE","url":"https://x.com/okazakityo/status/2113788385097830873","createdAt":"2026-10-24T00:23:17Z","metrics":{"views":3459,"likes":70},"lang":"ja"},{"id":"2113795103001301091","author":"Daisuke Awaji","handle":"gee0awa","text":"Lambda MicroVMs で Software Factory ができてきた。\n\nワーカーを全部 MicroVM に送ってるので、何並列で実行しても手元の Mac が静か。これがかなりうれしい。精度は不安だったけど、最近のモデルは実行環境が分離したマルチエージェントでも阿吽の呼吸で作業できる様になってきたな。","url":"https://x.com/gee0awa/status/2113795103001301091","createdAt":"2026-10-24T00:49:59Z","metrics":{"views":3826,"likes":57},"lang":"ja"},{"id":"2113930847275425956","author":"fleyta","handle":"fleyta88","text":"THIS IS THE F*CKING CRON TRICK NOBODY USES\n\nAnthropic shipped a way to run Claude Code from a plain script, and almost everyone wires it to a timer that wakes the model every 5 minutes for nothing.\n\nThe idea: the clock wakes a shell check, the check reads one hash, and Claude only starts when the hash actually moved.\n\nSame reaction time, a fraction of the tokens, because 19 out of 20 ticks end in the shell and never reach a model.\n\nYou just put one line in your cron:\n\n*/5 * * * * ./changed.sh \u0026\u0026 claude --bare -p \u003c task.md\n\nhere's the split:\n\n→ https://t.co/XShDxcvNyV reads one hash, count or date and exits 0 only when it moved\n→ claude -p runs headless, no terminal, no chat, it finishes and exits\n→ --bare skips hooks, plugins and CLAUDE.md, so every run starts the same on every machine\n→ --output-format json returns total_cost_usd, so every run logs its own price\n\nit only stops at three moments:\n\n→ a tool call that needs approval, headless runs deny it unless a rule allows it\n→ --max-budget-usd hits the cap you set for that run\n→ a non-zero exit code, so your script knows the run failed\n\nThe clock ticks. The shell checks. Claude thinks only on a hit.\n\nAI coworkers in Slack run the same escapement one layer up. A free script checks every hour, the agent only wakes when the numbers move, and the bill follows. In my Viktor breakdown that one move took 4 jobs from 211,000 credits a month to 35,800.\n\nthe full tree\n\u003e cron or any scheduler fires the tick, nothing else\n\u003e https://t.co/XShDxcvNyV compares one hash to the last one, 0 tokens\n\u003e claude --bare -p runs only when that hash moved\n\u003e --allowedTools lists the few tools the job really needs\n\u003e --max-budget-usd caps every single run\n\u003e --output-format json writes the cost of each run to your log\n\npaste the tree and this prompt into Claude Code ↓\n\n\"Turn my recurring Claude Code jobs into this tree:\n1. For each job, write https://t.co/XShDxcvNyV that compares one hash, count or date to the last run and exits 0 only on a change.\n2. Wire the cron line so claude --bare -p runs only after https://t.co/XShDxcvNyV passes.\n3. Give every run --allowedTools with only the tools it needs and a --max-budget-usd cap.\n4. Log total_cost_usd from the JSON output to logs/runs.csv after every run.\nShow me every script and cron line as a diff first. No edits until I say go.\"\n\n↳ https://t.co/d0rgKtI0dO\n\nset it up once. your cron keeps ticking all night and your bill doesn't.","url":"https://x.com/fleyta88/status/2113930847275425956","createdAt":"2026-10-24T09:49:23Z","metrics":{"views":159,"likes":15},"lang":"en"},{"id":"2113851558853288407","author":"kaito","handle":"cu30rry_","text":"今から体制を整えましょう\n\nAIに監視させ、通知をさせたり、修正パッチを自動で当てられるようにしたり、すぐにサービスに適用できるようにしたりしましょう\n\nこれは「準備しろよ」という警告です\n\nたとえば、Sentinel（by @badmorgan420）はXを監視し、新しい脆弱性や大きなセキュリティニュースを知らせてくれます\n\nSecurity Bot（by @FTactiks）は自分が使っている技術に関わる新しい脆弱性を X で見つけ、見つかったら GitHub リポジトリを調べて、修正の PR を作って動作確認してくれます\n\nhttps://t.co/zzJSCe4r9o","url":"https://x.com/cu30rry_/status/2113851558853288407","createdAt":"2026-10-24T04:34:19Z","metrics":{"views":2690,"likes":34},"lang":"ja"},{"id":"2113767430573232456","author":"にく","handle":"29meat_ai","text":"Museちゃんの本当の使い道、ついに見つけた！！！\nInstagramとThreadsの分析、外注したら普通にお金かかるやつが無料枠で出てきた…\n\n試しに「200いいね以上のポストを集めて、伸びた理由を分析して」って頼んだら、分厚い調査報告書みたいなのが一瞬で返ってきた。\n\nどんなテーマが伸びてるか\nどんな書き出し・構成が多いか\nいいね・保存・コメントの傾向\n自分のアカウントとの違い\n↑本来ならプロに頼むレベルの分析が、思い立ったらすぐ出せる。しかも面倒な設定なし、アカウントをつなぐだけ\n\nさらにGoogleドライブとつないだら、レポートをPDFにして保存までしてくれて、そのままPCで開けた。スマホで頼んで、PCでじっくり読む、が普通にできるやん。\n\nしかも、この分析で減った使用枠は週のたった1%。無料枠の範囲でこれ、ガチで安すぎるやん。\n\nなので、ワイ的な使い分けはこう。\n\n→ Xの情報をとことん使い倒したい人：Grok Bot\n→ InstagramとThreadsの情報を使い倒したい人：Muse\n\nClaude Duetが日本に来たら、Duetくんを司令塔にしてX・Instagram・Threadsをまとめてつなぐ、っていう全部盛り構成も作れる。けど、そこまで組んでる人は伝説のポケモン級に見かけない。ワイもまだ手を出してない()\n\nでも、Grok BotやMuseみたいな「つなげばすぐ働く秘書」なら、専門知識がなくても、つながってるサービスを思いのままに動かせる。\n\n難しい分析が、普段の言葉で頼むだけで終わる時代になったんだよなぁ","url":"https://x.com/29meat_ai/status/2113767430573232456","createdAt":"2026-10-23T23:00:02Z","metrics":{"views":21200,"likes":231},"lang":"ja"},{"id":"2113872616431775782","author":"lifcc","handle":"mylifcc","text":"为什么现在的顶尖大模型说话越来越“拗口、难懂”了？\nNYU 和 UT Austin 刚刚发了一篇非常扎心的心理语言学论文，直接扒开了现代大模型“不好好说人话”的底牌。\n研究人员把 Claude Sonnet 5 / Opus 5.5、GPT-5.6、GLM-5、Kimi K2.5 等 9 款前沿模型拉出来做全方位句法解剖，发现了 3 个反直觉真相：\n1️⃣ 顶尖 AI 正在滥用 6 种“高认知负荷”句式\n相比真实人类写作和同义回译文本，前沿模型极度偏爱：省略 that 的宾语从句、多重名词硬堆叠（如 reader-patience budget）、名词强行作动词（如 calendar it / footnote it）、无生命主语配动作动词，以及超长句法依存距离。这些特征在心理语言学里全是消耗人类短期记忆的“阅读杀手”。\n2️⃣ 根源在于“人类大脑”与“推理后训练”的错位\n人类语言遵循“均匀信息密度（UID）”——为了照顾听众有限的工作记忆，我们会本能地加入过渡词把信息摊平。而现代大模型经过大量数学、代码和推理（RLVR）后训练，只追求在有限窗口内最大化“信息密度”。\n3️⃣ 一个简单的长度惩罚，就能复刻这种“反人类文风”\n团队在微调实验中加入长度惩罚（Length Penalty），逼模型少用 Token，结果模型立刻学会了砍掉连接词、堆叠名词，瞬间变成那股熟悉的“高密度 AI 味”。\n当模型为了解题效率疯狂压缩 Token 时，你觉得未来的 AI 应该区分“高密度推理模式”和“人类友好沟通模式”吗？","url":"https://x.com/mylifcc/status/2113872616431775782","createdAt":"2026-10-24T05:58:00Z","metrics":{"views":14679,"likes":174},"lang":"zh"},{"id":"2113871204251807837","author":"澪 -mio-","handle":"Supi_x_","text":"Claude Codeで動画編集する人へ\n\n海外で紹介してるgithubのプリセット読み込めば、演出のクオリティが一気に上がります🤫\n\nリンクはリプへ","url":"https://x.com/Supi_x_/status/2113871204251807837","createdAt":"2026-10-24T05:52:23Z","metrics":{"views":16282,"likes":327},"lang":"ja"},{"id":"2113774354546786382","author":"Tom Dörr","handle":"tom_doerr","text":"Converts Claude Code and OpenAI Codex into deep research agents.\n\nhttps://t.co/dkguNJNhJt","url":"https://x.com/tom_doerr/status/2113774354546786382","createdAt":"2026-10-23T23:27:32Z","metrics":{"views":12481,"likes":256},"lang":"en"},{"id":"2113720961333882918","author":"SuSu_酥酥👅","handle":"NFT_Chen","text":"🔥Cursor 重大更新！现在能直接操控你的电脑了！\n\n这波含金量直接拉满：\n🔹点击/输入任意桌面 App，不只浏览器\n🔹自动驱动 iOS Simulator 测试自己写的功能\n🔹需要时自动调用，或提示里 @Computer Use 即可\n🔹真正闭环：写代码 → 运行 → 点点点验证 → 修复\n\n以前只能写代码，现在连测试都让 AI 自己干了。\n\n更新 Cursor 立刻体验 👉 https://t.co/oGbuYLKD2q\n\n#Cursor #ComputerUse #AI编程 #AIAgent #编程神器 #iOS开发 #SpaceXSI #ElonMusk #Grok\n\nhttps://t.co/Hsb5eQt9J1","url":"https://x.com/NFT_Chen/status/2113720961333882918","createdAt":"2026-10-23T19:55:22Z","metrics":{"views":2861,"likes":28},"lang":"zh"},{"id":"2113891680000901380","author":"铁锤人","handle":"lxfater","text":"卧槽，3090要可能要涨价了！！  \n\n因为老黄的刀法被人破解了  \n\n有人给3090解了个锁，同样限制在 360W，PyTorch 测试从 75 TFLOPS 跑到了 135 TFLOPS，提升约 80%！\n \n 你以为是超频，把功耗往上拉？  \n\n但他改的是显卡里控制运算速度的寄存器，这些寄存器平时有权限保护，正常改不了  \n\n他利用 GPU 启动固件的漏洞，赶在 NVIDIA 驱动加载之前拿到写入权限，把相关运算改成全速，再交给原版驱动使用  \n\n解开的主要是 FP16／BF16 输入、FP32 累加这类 AI 运算的速度限制  但测试算力多了 80%！！  \n\n4090 也有分支项目做到了：同类运算的指令吞吐，从约 165 TFLOPS 提升到 331 TFLOPS，接近翻倍  \n\n项目地址，附上👇","url":"https://x.com/lxfater/status/2113891680000901380","createdAt":"2026-10-24T07:13:45Z","metrics":{"views":17067,"likes":152},"lang":"zh"},{"id":"2113714770192834880","author":"santi","handle":"santtiagom_","text":"OpenAI contó cómo escaló el almacenamiento detrás de ChatGPT para atender a más de 1.000 millones de usuarios.\n\nal principio, varios servicios compartían recursos de almacenamiento en Cosmos DB. eso permitía aprovechar la capacidad entre todos.\n\ncuando una funcionalidad consumía demasiado, podía afectar incluso al login.\n\nempezaron a separar las cargas en contenedores dedicados. así mejoraban el aislamiento: un pico de tráfico afectaba a menos servicios.\n\ncada equipo pasó a tener que anticipar cuántos recursos necesitaría (capacity planning). algunos lanzaban sin preparar suficiente capacidad y terminaban escalando en plena incidencia.\n\ncompartir facilitaba absorber los picos y separar permitía aislar los problemas. para aprovechar ambos beneficios, trabajaron con Azure en:\n\n\u003e limitar el tráfico que más recursos consumía, para proteger al resto.\n\u003e dar prioridad a las acciones de usuarios frente a tareas como cargas masivas de datos.\n\u003e repartir los datos entre más particiones según la demanda, para atender más operaciones.\n\ncon esos controles, volvieron a usar contenedores compartidos por defecto.\n\nestos casos ayudan a entender los trade-offs de system design: cada decisión resuelve algo y cambia lo que necesitás resolver después.\n\n*la imagen es de Habitat, la plataforma que conecta sus productos con el almacenamiento y concentra tareas como caché, permisos y límites de peticiones.","url":"https://x.com/santtiagom_/status/2113714770192834880","createdAt":"2026-10-23T19:30:46Z","metrics":{"views":6180,"likes":130},"lang":"es"},{"id":"2113838423421366367","author":"タツ | AI×デザイン | EQUAL DESIGN Inc.","handle":"tatsu_studio","text":"AIでサイトを作っている人へ。\n\nCloudflareが作ったCMS「EmDash（エムダッシュ）」は知らないと損してます。僕もこれから作るサイトのお知らせ欄はEmDashで付けていきます。\n\n特徴を5つにまとめました⤵︎","url":"https://x.com/tatsu_studio/status/2113838423421366367","createdAt":"2026-10-24T03:42:08Z","metrics":{"views":3844,"likes":36},"lang":"ja"},{"id":"2113880934735073744","author":"しとちゃ！🦊🍮","handle":"nemumusitocha","text":"RTX4060TI 16GB +RAM64GBでDeepseek-V4.1-Flashてすと！！\n\n2.9tok/s！！！！！！！！！！！！！！！\n\nほんとにうごいたんｗｗｗ https://t.co/1UvQCBr7YU","url":"https://x.com/nemumusitocha/status/2113880934735073744","createdAt":"2026-10-24T06:31:03Z","metrics":{"views":28561,"likes":406},"lang":"ja"},{"id":"2113689074196263406","author":"ludoonchart","handle":"ludoonchart","text":"these 3 FREE GitHub repos should honestly be BANNED on Wall Street\n\nhedge funds spend millions building research terminals, hiring analysts and developing prediction models\n\nsomeone put the building blocks for an entire AI-powered trading desk on GitHub for FREE\n\nit’s called REA + Kronos + TradingAgents\n\nhere’s how it works:\n\nREA helps AI agents understand and reconstruct complex software interfaces and workflows\n\nKronos is a financial forecasting model that treats market candles like tokens and generates possible future price movements\n\nTradingAgents creates an AI research team where analysts debate trades before a portfolio manager makes the final decision\n\ncombine all 3 and you can build a Bloomberg-style research terminal with AI-generated market forecasts and a team of virtual trading analysts\n\nhere’s how to build it yourself for FREE:\n\nstep 1 → open Claude Code and connect REA using https://t.co/MscIBUc4Gz to map out a professional financial terminal with charts, market data, screeners and research panels\n\nstep 2 → ask Claude to build the complete interface with equities, crypto, FX, commodities, global indices and financial news\n\nstep 3 → clone https://t.co/lbde4uDMbH and load Kronos-small, the 24.7M parameter financial forecasting model\n\nstep 4 → feed Kronos the latest 512 OHLCV candles, forecast the next 24 and sample 100 possible future price paths directly onto the terminal charts\n\nstep 5 → clone https://t.co/6QQaQR67NK and connect its research workflow to the same market data\n\nstep 6 → let 4 AI analysts examine fundamentals, news, sentiment and technicals, then watch BULL and BEAR agents debate before the risk team and portfolio manager evaluate the trade\n\nstep 7 → combine the forecast distribution with the agents’ decisions, track BUY/SELL/HOLD signals and backtest the entire system with realistic transaction costs before risking capital\n\nthe result: one workspace combining a Bloomberg-style terminal, probabilistic market forecasting and an entire AI investment research team\n\n3 open-source repos\n\none AI-powered trading desk\n\ni won’t say anything more…\n\nbookmark this and thank me later ↓","url":"https://x.com/ludoonchart/status/2113689074196263406","createdAt":"2026-10-23T17:48:40Z","metrics":{"views":17573,"likes":312},"lang":"en"},{"id":"2113835833468105126","author":"SOU⚡️投資ニュース / 米国株・日本株・仮想通貨・AI","handle":"SOU_BTC","text":"【速報】🚨「HTTP2Shell」と呼ばれる重大な脆弱性、影響範囲が拡大\n\n・悪用されると、ログインなしで外部から不正なプログラムを実行される恐れ\n・Node.jsやPythonだけでなく、多数のアプリにも影響する可能性\n・一部のサービスでは修正プログラムが未提供","url":"https://x.com/SOU_BTC/status/2113835833468105126","createdAt":"2026-10-24T03:31:50Z","metrics":{"views":230635,"likes":1017},"lang":"ja"},{"id":"2113536157770490080","author":"mizchi","handle":"mizchi","text":"バイブ形式手法、これです","url":"https://x.com/mizchi/status/2113536157770490080","createdAt":"2026-10-23T07:41:02Z","metrics":{"views":50581,"likes":677},"lang":"ja"},{"id":"2113895110161338702","author":"みのるん","handle":"minorun365","text":"Claude認定ディベロッパーFoundation、こっちは合格しました！941点。\nAR-Fより絶対こっち先に受けるべきだった🤣\n\n勉強に使ったセルフ問題集置いときます！","url":"https://x.com/minorun365/status/2113895110161338702","createdAt":"2026-10-24T07:27:23Z","metrics":{"views":10791,"likes":234},"lang":"ja"},{"id":"2113709657462301000","author":"arhen","handle":"amQnese","text":"PLEASE.\n\nSiapapun kalian yang sudah pakai coding agent jadi bagian tak terpisahkan dair kehidupan, pakai lah ini.\n\nSEKALI AJA di app apapun yg kalian buat. Daripada menyesal di masa depan.","url":"https://x.com/amQnese/status/2113709657462301000","createdAt":"2026-10-23T19:10:27Z","metrics":{"views":20777,"likes":1207},"lang":"in"},{"id":"2113903324298633261","author":"石ちゃん🎤LLMでアプリ開発","handle":"Isichan_Hitori","text":"【 無検閲モデルが静かに消えている？ 】\n\nそんな投稿が流れてきました。\nKimi も MiMo も GLM も、ダウンロード中に 404 になると。\n\n今後のNSFW人生の岐路なので確かめました！！\n\n▶結論\n消えたのは一部だけ\n有名どころはほぼ全部生きています\n\n〈もうダウンロードできないもの〉\n・Kimi-K2.7-Code-abliterated（huihui-ai）\n・penclaw-GLM-5.3-abliterated-for-offensive-cyber\n名前で「攻撃的サイバー用途向け」とうたっていました。\n・MiMo-V2.6-Pro\n公式は -RL と -MOPD で、どちらも生きています。\n\n〈まだダウンロード可能なもの〉\n今回確認できたモデルを容量別にまとめました。\n一覧とURLはリプ欄に👇","url":"https://x.com/Isichan_Hitori/status/2113903324298633261","createdAt":"2026-10-24T08:00:01Z","metrics":{"views":6207,"likes":87},"lang":"ja"},{"id":"2113638070868435440","author":"Blake Young","handle":"YohoYoung6810","text":"建议所有用 AI 写代码的人，在项目提示词里加一条规则：\n\n“遇到不熟悉的功能，不要立即从零实现。先检索 GitHub 上维护活跃、许可证明确的同类开源项目，比较实现思路、依赖和已知问题。优先借鉴经过验证的设计，不要直接复制不兼容或来源不明的代码。”\n\n这条规则帮我省了不少反复返工的时间。\n\nVibe Coding 不只是让 AI 会写代码。\n\n还得让它知道什么时候应该先查资料。","url":"https://x.com/YohoYoung6810/status/2113638070868435440","createdAt":"2026-10-23T14:26:00Z","metrics":{"views":77827,"likes":1706},"lang":"zh"},{"id":"2113920328535830617","author":"StudioYebisu","handle":"studio_yebisu","text":"これやりすぎだろ。\n1300を超える3DモデルをCC BY 4.0※で、無料公開は一体どういうことなんですか？\n\nおそらく3Dモデリングのオープンウェイトを作るのに、データセットとして使ってねっていうことだとは思うんだけどそもそものモデルのクオリティが高くて、そのままゲーム転用できちゃうけど？？？？？？\n\n※CC BY4.0：複製や再配布が自由に行え商用転用可","url":"https://x.com/studio_yebisu/status/2113920328535830617","createdAt":"2026-10-24T09:07:35Z","metrics":{"views":1643,"likes":26},"lang":"ja"},{"id":"2113737610610831765","author":"Benjamin","handle":"mazaki_eth","text":"J'ai vu passer tous ceux qui bricolent leur TV pour la rendre plus rapide et plus belle avec Claude Code.\n\nÇa tombait bien : ma TCL dans la chambre achetée 400€ il y a plusieurs années ramait tellement qu'on la regardait même plus. Même un film saccadait, avec le son décalé, on a testé le Amazon Firestick TV, mais rien à faire.\n\nDiagnostic : 2 Go de RAM, 47 Mo libres. Le lanceur Google TV prenait à lui seul 60 % du processeur, juste pour afficher des bandeaux de films et des pubs, puis déjà que c'est light niveau RAM de base.\n\nCe que j'ai fait :\n- 32 services coupés (pubs TCL, télémétrie, recommandations, applis jamais utilisées).\n- L'accueil Google remplacé par un écran minimaliste façon Apple TV : des photos de paysages qui changent toutes les minutes, l'heure et un dock avec nos 4 applis les plus utilisées.\n\nAvant / Après :\n➡️ Processeur au repos : 61 % -\u003e 12 %\n➡️ RAM libre : 451 -\u003e 720 Mo\n➡️ Écran d'accueil : 187 Mo -\u003e 25 Mo de RAM\n➡️ Pubs au démarrage et dans les menus : 0\n\nUn problème de plusieurs années réglé en 30min avec Claude Code, voila ou on en est 😅\n\nLa différence 👇","url":"https://x.com/mazaki_eth/status/2113737610610831765","createdAt":"2026-10-23T21:01:32Z","metrics":{"views":460704,"likes":4621},"lang":"fr"},{"id":"2113627356204056872","author":"AI超元域","handle":"AISuperDomain","text":"发现一个很有意思的开源项目：Claude SEO，让 Claude Code 直接变成一支专业 SEO 优化团队！\n\n项目集成了 26 个 Skill、19 个专业 Agent，最多支持 17 个 Agent 并行工作。\n\n只需输入 /seo audit 网址，就能对网站进行系统性审计，包括：\n\n✅ 技术 SEO：抓取、索引、网站性能\n\n✅ 内容优化：关键词、标题、内容质量\n\n✅ 结构化数据：Schema 检查与生成\n\n✅ AI 搜索优化：ChatGPT、Gemini 等平台的 GEO 优化\n\n✅ 竞争分析、主题聚类、内部链接优化\n\n项目还结合 Python、Playwright，以及可选的 Google Search Console 等数据源，支持一次审计最多 500 个页面，自动定位问题并给出修复优先级。\n\n真正值得关注的是它的架构设计： 不再依靠单个 Prompt 完成 SEO，而是将复杂任务拆分给不同专业 Agent，通过工具执行、数据分析和协同工作，形成完整的自动化流程。\n\n当然，它不能保证搜索排名提升，GEO 评分也不代表真实的 AI 引用率。\n\n对于独立开发者、技术博客和内容网站而言，这套工作流很有实用价值。\n\nGitHub：","url":"https://x.com/AISuperDomain/status/2113627356204056872","createdAt":"2026-10-23T13:43:25Z","metrics":{"views":12164,"likes":206},"lang":"zh"},{"id":"2113774977032089945","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに「Netflixを開いて」と話しかけるだけで、テレビが動くようにした人がいる\nリモコンも、スマホもいらない\nhttps://t.co/IiI3egwMlR\n\n0xCodezさんのポストによると\n・テレビとノートPCを、同じWi-Fiにつなぐ\n・Claude Code（Opus 5.5）に、テレビの「設定→情報」画面の写真とプロンプトを渡す\n・多くのスマートテレビには、スマホのリモコンアプリと同じ「家の中だけで使える操作の窓口」がある\n・Opusがそこを調べて、機能が3つだけの小さなリモコンを作る\n・それをGrok Botにプラグインとしてつなぐ。Grokが耳で、プラグインが手\n・テレビ側で最初に1回だけ「許可」を押す\n・あとは「Hey Grok, open Netflix」と言うだけ\n\n本人いわく、ここ数年のSamsung、LG、Google TVなら、だいたい動くとのこと\nヤベーな、これ","url":"https://x.com/tetumemo/status/2113774977032089945","createdAt":"2026-10-23T23:30:01Z","metrics":{"views":11712,"likes":144},"lang":"ja"},{"id":"2113601359564230784","author":"オープンソース研究所","handle":"opensourcelab9","text":"Codex と Cursor の間で、同じ記憶を共有させる仕組みがあるの知ってた？😳\nTencent の Hy Memory です。\nTencent 自身の製品では、ある助手が何段もの手がかりをつなげて思い出す力（multi-hop recall）の数字が、以前の50%から今は90%まで上がったと元ポストにあります。記憶の量は51.8%、呼び出しにかかるトークンは39.3%減ったそうです。\n\n手元で試すなら pip install hy-memory==2.0.3 で SDK が入り、保存先は ChromaDB などから選べます。MemHub という署名済みの macOS デスクトップアプリも出ています。\n\nCodex で話した前提を Cursor でもう一度説明し直す、あの手間が消えるならかなり助かります。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2113601359564230784","createdAt":"2026-10-23T12:00:07Z","metrics":{"views":932,"likes":10},"lang":"ja"},{"id":"2113617883456766031","author":"Akshay 🚀","handle":"akshay_pachaar","text":"4 types of LLM caching, clearly explained.\n\n(KV, prefix, prompt, and semantic caching)\n\nAn agent can send the same system instructions, tool definitions, and conversation history on every turn. Without reuse, the model processes that shared context again.\n\nThat initial prompt processing is called prefill. It contributes to the wait before the first token appears.\n\nThe four caches in the graphic reduce repeated work at different points in this process.\n\n𝟭) 𝗞𝗩 𝗰𝗮𝗰𝗵𝗶𝗻𝗴 𝘀𝗮𝘃𝗲𝘀 𝘄𝗼𝗿𝗸 𝗯𝗲𝘁𝘄𝗲𝗲𝗻 𝗴𝗲𝗻𝗲𝗿𝗮𝘁𝗲𝗱 𝘁𝗼𝗸𝗲𝗻𝘀.\n\nDuring generation, the model stores keys and values, the vectors attention uses to retrieve information from earlier tokens. Each new token reuses those vectors and adds its own, avoiding repeated computation at the cost of memory.\n\n𝟮) 𝗣𝗿𝗲𝗳𝗶𝘅 𝗰𝗮𝗰𝗵𝗶𝗻𝗴 𝘀𝗮𝘃𝗲𝘀 𝘄𝗼𝗿𝗸 𝗮𝗰𝗿𝗼𝘀𝘀 𝗿𝗲𝗾𝘂𝗲𝘀𝘁𝘀.\n\nWhen a request begins with an already processed sequence, the server can reuse its saved attention state and process the remaining suffix. This helps when requests share instructions, documents, or conversation history.\n\nIn vLLM, each cached block’s identifier incorporates the preceding prefix, so identical text after a changed prefix is insufficient for reuse.\n\n𝟯) 𝗣𝗿𝗼𝗺𝗽𝘁 𝗰𝗮𝗰𝗵𝗶𝗻𝗴 𝗽𝘂𝘁𝘀 𝘁𝗵𝗲 𝗽𝗿𝗼𝘃𝗶𝗱𝗲𝗿 𝗶𝗻 𝗰𝗵𝗮𝗿𝗴𝗲.\n\nA provider manages this prefix reuse through its API, including cache lifetimes and billing rules. Eligible repeated input receives discounted pricing, while the model still generates a fresh answer.\n\nPut stable instructions and documents at the beginning, followed by the changing question, to preserve that reusable prefix.\n\n𝟰) 𝗦𝗲𝗺𝗮𝗻𝘁𝗶𝗰 𝗰𝗮𝗰𝗵𝗶𝗻𝗴 𝗿𝗲𝘂𝘀𝗲𝘀 𝘁𝗵𝗲 𝗮𝗻𝘀𝘄𝗲𝗿 𝗶𝘁𝘀𝗲𝗹𝗳.\n\nThe system converts a prompt into an embedding, a numerical representation of its meaning, and searches for similar stored prompts. An accepted match returns the saved answer without calling the generation model, saving output tokens too.\n\nThis suits repeated questions with stable answers, but similarity alone cannot establish that an answer applies to the current user or situation.\n\nThese techniques can work together. A semantic cache miss can still benefit from a cached prompt prefix, then use KV caching during generation.\n\nPrefix caching and provider prompt caching share the same underlying reuse. Semantic caching adds a different decision, whether a previous answer is still valid for this request.\n\nThat said, I also wrote a full breakdown of KV caching. The article is quoted below.\n\nHope you enjoyed reading.\n\nCheers! :)","url":"https://x.com/akshay_pachaar/status/2113617883456766031","createdAt":"2026-10-23T13:05:47Z","metrics":{"views":11984,"likes":212},"lang":"en"},{"id":"2113608913451147569","author":"Skills Studio","handle":"sumika45379","text":"【画面づくり】\nClaude Code が作る画面を、Stripe や Linear みたいな雰囲気に寄せる方法、知ってた？😳\n有名サービスの見た目を書き起こした手本ファイルを1つ選んで、shadcn のスキルに渡すだけ。\n\n紹介してたのは Voxyz_ai。手本選びとスキルの2段に分けて使う組み合わせ。\n\n・awesome-design-md：Stripe・Linear・Vercel・Notion など74製品の雰囲気を書き起こした DESIGN.md 集。色・文字・余白・角の丸み・影だけじゃなく、やること・避けることまで入ってる\n・shadcn 公式スキル：選んだ DESIGN.md をもとに新しい案件を作って、部品を全部入れて、その雰囲気に塗り直してくれる\n・最後に出てくるのは、色の読みやすさを確かめた見本ページ。部品の状態が全部並んで、やる・やらないの対比も横に置かれる\n\nshadcn 公式スキルは npx skills add shadcn/ui で入る。あとは GitHub で選んだ DESIGN.md の Raw のリンクを渡して、「shadcn スキルで新しい案件を作り、この DESIGN.md からデザインの決まりを作って、見本ページまで仕上げて」と頼むだけ。\n\nただ、手本はコミュニティが各ブランドの雰囲気を解釈して書いたもので、公式の配色そのものではない。気に入らなければ別の手本でやり直して、合ったら自分の案件に移して育てていけばいい。\n\n見本ページで部品の状態がまとめて見えるの、確認の手間が地味に減るやつ。\n\n手本の一覧はこちら👇\nhttps://t.co/I6gUQDfgZH\n\n手本ファイルを決めたら、避ける見た目を書いた一覧も一緒に持たせたい。\n\n基準ファイルと禁止リストを組み合わせる作り方は、この下の記事で順に書いてます👇","url":"https://x.com/sumika45379/status/2113608913451147569","createdAt":"2026-10-23T12:30:08Z","metrics":{"views":1595,"likes":14},"lang":"ja"},{"id":"2113932033101856979","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【動画公開】最新の基調講演、ループ型AI駆動経営。\n\n企業が指標にすべきAI活用の5段階と、弊社が実践中のAI駆動経営の実例をいくつも紹介しています。\n\n・毎日の数字が全部届くKPIダッシュボード\n・AIが記事を書き、順位を見て、書き直し続けるループ型のブログ\n・2時間で作ったLPが検索圏外から1位に\n・商談まわりは打ち合わせ以外すべてAIで自動化\n・外注で8ヶ月遅れた開発を1週間半で取り戻した自社開発\n\n参考になる事例を余すことなく公開しているので、ぜひチェックしてみてください👇\n\n■動画\nhttps://t.co/aplPP5r1ud\n\n■タイムライン\n00:00 オープニング\n01:02 生成AIとAIエージェント\n04:32 Webのチャットはもう古い\n08:43 なぜ広がらないのか\n11:14 AI活用の5段階\n13:35 レベル3 業務を線で自動化\n16:09 レベル4 アプリは自社で\n17:32 レベル5 売上を作るループ","url":"https://x.com/masahirochaen/status/2113932033101856979","createdAt":"2026-10-24T09:54:06Z","metrics":{"views":2461,"likes":9},"lang":"ja"},{"id":"2113593559236677952","author":"まかねこ| AIに働かせる技術","handle":"makaneko_AI","text":"Cloudflare製の監査スキルが人気です\n\nコーディングエージェントに、セキュリティ監査を任せるスキル。探索、検証、報告を別々のエージェントが担当します。見つけた脆弱性は反証を試みてから確定扱いに。自分のコードをAIに一度点検させたい人の出発点にいいかも。","url":"https://x.com/makaneko_AI/status/2113593559236677952","createdAt":"2026-10-23T11:29:07Z","metrics":{"views":7830,"likes":116},"lang":"ja"},{"id":"2113927567162171478","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"Meta「Muse」、Threadsに公式で直結できるAIエージェントはこいつだけ。\n\n9月に米国で公開されたMetaの個人向けAIエージェントが、10月23日から日本でも使えるようになった。MetaのAI責任者アレクサンドル・ワンいわく、Instagram（DM含む）・Threads・Facebook・Messengerとの接続は「Museだけ」の特権。しかもアカウントセンターでつながってれば、Threadsは設定ゼロで自動接続。\n\nThreads運用の常識が変わる話を全部解説する↓","url":"https://x.com/MakeAI_CEO/status/2113927567162171478","createdAt":"2026-10-24T09:36:21Z","metrics":{"views":553,"likes":3},"lang":"ja"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-24T19:12:48+09:00","posts":[{"id":"2113869278277693623","author":"そら ☁️ AgentSwarm 自動化オタク📱","handle":"sora19ai","text":"Anthropic社より忠告。\n\n『Sub Agentを使うな。』\n\nみなさん、ハーネスをアップデートしましょう👇","url":"https://x.com/sora19ai/status/2113869278277693623","createdAt":"2026-10-24T05:44:44Z","metrics":{"views":26088,"likes":206},"lang":"ja"},{"id":"2113723422731813254","author":"Andrew","handle":"s4yonnara","text":"this is f*cking brilliant... \n\na 16-year-old CS student in China figured out how to run 300 Grok Bots for less than $0.02 per bot per week.\n\nthe same swarm could cost $4,500 a week.\n\nhe eliminated pointless status checks, stopped rereading entire chat histories, and killed endless retry loops.\n\nnow most bots only wake up when there's actual work to do.\n\nHere 20 GitHub repos he used to make the setup cheaper:\n\n01 Crawl4AI → turn web pages into clean Markdown before analysis, reducing the navigation menus and page clutter your bot has to read\n https://t.co/rNfc9CBAcJ\n\n02 Firecrawl → collect web content as Markdown or structured data so your workflow can select the fields it actually needs\n https://t.co/hyiyX8fUtw\n\n03 Chonkie → split long documents into manageable chunks so retrieval can select relevant passages instead of attaching the whole document\n https://t.co/xO7UjWsDom\n\n04 FlagEmbedding → rerank retrieved passages before generation, keeping the strongest evidence and dropping irrelevant matches from the prompt\n https://t.co/wpEstsLsdo\n\n05 LLMLingua → compress lengthy inputs before the model reads them. preserve the facts, constraints, and qualifications your task depends on\n https://t.co/o9IkuX5hH1\n\n06 RTK → compress common command outputs before they enter the conversation, keeping repetitive logs from swallowing the useful context\n https://t.co/osSzKMN6Uk\n\n07 GPTCache → reuse suitable answers to similar requests instead of generating them again. define matching and freshness rules around the task\n https://t.co/f0sPjVimPv\n\n08 Portkey Gateway → cache matching API responses behind a shared gateway, letting connected workflows reuse answers across repeated requests\n https://t.co/xnyYiEubrY\n\n09 Prefect → cache successful task results and reuse them when the configured inputs match, avoiding unnecessary reruns of completed workflow steps\n https://t.co/Oaz14ksknU\n\n10 Mem0 → store and retrieve relevant facts across runs so each assignment can start with selected memory instead of the entire conversation\n https://t.co/RABqdelNBi\n\n11 Graphiti → keep changing facts and relationships in a searchable graph, then retrieve the relevant context instead of replaying the event history\n https://t.co/0AoIFN1K5u\n\n12 requests-cache → keep fetched responses with expiry rules, then let your scripts reuse valid data before asking the bot to investigate again\n https://t.co/nx1Jmb8CLw\n\n13 Hishel → add HTTP caching and revalidation to your fetching tools, keeping unchanged responses out of repeated download-and-analysis cycles\n https://t.co/lliJWMzoYN\n\n14 APScheduler → schedule lightweight checks in Python and batch nonurgent work before handing useful updates to the agent\n https://t.co/4dBrhVFPKd\n\n15 Celery → put background jobs on a worker queue so code handles waiting and dispatch while model calls happen inside the tasks that need them\n https://t.co/7WxQXZ0KYQ\n\n16 PyBreaker → pause calls to a repeatedly failing service after a configured threshold, stopping one broken dependency from generating endless attempts\n https://t.co/yXmYZ8qe6T\n\n17 LiteLLM → track spending and set budgets for connected API calls before one runaway workflow eats the whole allowance\n https://t.co/3i3LdEX9vk\n\n18 RouteLLM → route simpler API requests to a cheaper model and reserve the stronger one for work that needs it\n https://t.co/xE66esIhTE\n\n19 Semantic Router → match requests to predefined workflows using local embeddings instead of paying a large model to decide every next step\n https://t.co/KugeG1iIxC\n\n20 Phoenix → trace your instrumented AI workflow, inspect repeated calls, and compare changes against output quality before keeping an “optimization”\n https://t.co/PEynbFf3Mg\n\nconnect the tools your workflow needs through the terminal, MCP, or your own code. route API calls through the gateway or router you choose so its controls actually apply\n\nstart with the biggest leak: oversized inputs, repeated research, empty checks, or failed operations that keep restarting\n\nfilter before reading → reuse before generating → check for changes → stop failed loops\n\nthen measure completed work against total usage, including the tools running around your bot\n\nthe full course below shows how to put the workflow together ↓","url":"https://x.com/s4yonnara/status/2113723422731813254","createdAt":"2026-10-23T20:05:09Z","metrics":{"views":9920,"likes":132},"lang":"en"},{"id":"2113915328103346500","author":"StudioYebisu","handle":"studio_yebisu","text":"!!!超絶神OSS見つけた!!!\nこれ、またあれです。人類が求めてたやつシリーズ!!\n\nZIPファイルって解凍するときに、同じファイルサイズがいるじゃん？\n100GBのファイルを解凍する場合 \n200GB以上空き容量がないとダメじゃないですか!!\n\n【Hatchzip】は後ろから削除しながら解凍していくことで、ディスク容量を圧迫せずに解凍ができるというアプリ。確かに今までなかったなっていう感じで、あったら欲しいがまさにここにある。","url":"https://x.com/studio_yebisu/status/2113915328103346500","createdAt":"2026-10-24T08:47:43Z","metrics":{"views":5943,"likes":88},"lang":"ja"},{"id":"2113873632204353667","author":"やぎ（八木 利生太郎）/ Last Scene代表","handle":"yagiryuuu","text":"Grok Botが、ログイン情報やカード、連絡先を覚えておけるようになったのでメモ。\n\n何が変わったのか\n\n・ログイン情報（IDとパスワード）、カード、連絡先をGrok Botに保存できるようになった\n・一度登録すれば、次からはGrok Botが安全に覚えておいてくれる\n・毎回入力し直さなくても、作業を任せやすくなる\n\nまとめ\n\n・AIに作業を任せるとき、毎回のログインや入力の手間が減っていく\n・まずは使う頻度が高く、もし何かあってもすぐ止められるサービスから登録してみるのがおすすめ","url":"https://x.com/yagiryuuu/status/2113873632204353667","createdAt":"2026-10-24T06:02:02Z","metrics":{"views":1230,"likes":6},"lang":"ja"},{"id":"2113782774582972922","author":"Iron Giant","handle":"irongiantXBT","text":"holy sh*t, grok bot just killed notion, excel and a $140k analyst\n\nspacexai shipped pages last night\nreports and dashboards that stay current on their own\n\n1.3m people saw the launch\nmost will set up one page and forget about it\n\nhere are the 6 i'd build on day one:\n\n\u003e revenue: \"every monday at 8:00, booked vs plan and what slipped\"\n\u003e pipeline: \"live q4 forecast, flag every deal stuck over 14 days\"\n\u003e morning brief: \"my day by 7:00 and the one thing most likely to go wrong\"\n\u003e board memo: \"draft the monthly update from these numbers, never send it\"\n\u003e policy page: \"rewrite this page the moment the rule changes in slack\"\n\u003e competitors: \"every price move and launch from these 5 companies, daily\"\n\nask once, it stays true every morning\nstart with the monday one\n\nthen read how a grok bot team keeps running while you sleep in the article below","url":"https://x.com/irongiantXBT/status/2113782774582972922","createdAt":"2026-10-24T00:01:00Z","metrics":{"views":4934,"likes":43},"lang":"en"},{"id":"2113927326203572511","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"正直、AIハッキングがこのまま進むと、リーマンショック級の経済危機が来そうな気がしてます。\n\n理由は3つ。\n\n① 大手銀行もいずれ突破される\n2025年は国内の証券口座乗っ取りだけで約7400億円の不正取引。AIで攻撃が自動化された今、銀行が狙われるのは時間の問題です。\n\n② 1行やられたら全行で取り付け騒ぎ\n「銀行の預金が盗まれた」と広まれば、他の銀行の預金者まで一斉に引き出しに走る。でも日本のお札は約117兆円、預金は1000兆円超。全員分の現金はそもそも無い。\n\n③ 今の取り付けは数時間で終わる\n2023年のシリコンバレー銀行は、経営は健全だったのにスマホ経由で1日約6兆円を引き出されて破綻しました。\n\n払えない銀行が出る→他の銀行も疑われる→お金が回らなくなる。リーマンショックと同じ流れです。\n\n結局、口座のお金は「みんなが数字を信じている」から価値がある。AIはその信頼ごと壊せてしまう可能性がある。\n\nタンス預金や金庫に現物を預ける人が増えてきそう。","url":"https://x.com/masahirochaen/status/2113927326203572511","createdAt":"2026-10-24T09:35:24Z","metrics":{"views":10750,"likes":140},"lang":"ja"},{"id":"2113809281661514182","author":"cxuan","handle":"criscxuan","text":"卧槽，这次 A 社终于做了个人？把自家的 sandbox 沙箱给开源了！！","url":"https://x.com/criscxuan/status/2113809281661514182","createdAt":"2026-10-24T01:46:20Z","metrics":{"views":31545,"likes":301},"lang":"zh"},{"id":"2113876702220972253","author":"govin.eth | G哥","handle":"goan999999","text":"Codex 终于有自己的 UI/UX 设计外挂了\n\n192 条行业设计规则！79 种 UI 风格！192 套配色方案！\n\n这玩意儿简直是给 Codex 免费配了一位专业 UI/UX 设计师！【视频后部分有实际效果展示】\n\n以前用 Codex 写网页，功能是做出来了，但页面总有一股廉价的 AI 味，配色乱、布局普通、设计千篇一律\n\n现在直接给它装上 UI UX Pro Max，玩法完全不一样了！你先看看它的价值：\n\n1、192 条行业设计规则：AI SaaS、电商、金融、医疗这些不同产品领域，都能匹配对应的设计方案\n\n2、79 种 UI 风格：极简主义、玻璃拟态、粗野主义多种风格可选，告别千篇一律的模板\n\n3、192 套配色方案：根据产品定位选择合适的颜色，不用再反复试配色\n\n4、74 种字体组合：字体、排版、视觉层次一起规划，让页面更有专业产品的质感\n\n5、支持 22 种技术栈：React、Next.js、Vue、Flutter 开发场景都能直接找到设计指导\n\n安装也不用自己折腾命令，直接把这段提示词扔进 Codex：\n\n“阅读 nextlevelbuilder/ui-ux-pro-max-skill，按照官方文档为当前 Codex 环境安装并配置 UI UX Pro Max，检查依赖与配置，完成后验证 Skill 是否可正常调用”\n\n装完直接实测，再扔给它这句【不想浪费token，直接看视频效果】：\n\n“用 UI UX Pro Max 为我开发一个高端 AI SaaS 官网，包含主视觉、功能卡片和定价区，自动规划设计系统，使用 React + Tailwind CSS 实现，完成后启动预览”\n\n还在让 Codex 裸写前端的兄弟，赶紧试试这个！","url":"https://x.com/goan999999/status/2113876702220972253","createdAt":"2026-10-24T06:14:14Z","metrics":{"views":11235,"likes":123},"lang":"zh"},{"id":"2113883654409641991","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Bot×Typefullyの組み合わせが最強すぎる！\nTypefullyってポストの予約投稿やツリー形式のポストも作ってくれるSNS投稿支援ツール\n\nこれを使うとXから最新情報を取得して、すぐにポスト案が作れるし、Grokの画像生成も使えるから、ポスト用の図解サムネも一緒に作れてしまう\n\nまた、ブクマに情報が埋もれて”あとで読む”から解放される\n\nなぜか？\n\nブクマせず、すぐにGrok Botに投げてポスト案を作っちゃえば良い\n\n予約したポストなら必ず読むし、修正もするから内容を理解できるので”あとで読む”にならない\n\n自分用メモのブクマが埋もれるくらいなら、速攻でポスト案化してしまって、皆さんにもわかりやすく整理したポストを流したほうが良い\n\nまさに自分用メモをシェアしてお役立ちポストに変換しちゃう秘訣です！\nちなみにTypefullyはXやThreads、Substack等へも同時投稿ができます\n\nTypefullyは月15件まで無料で使えるので試す価値アリですっ！\n\n興味ある方は招待コードリプ欄に置いておきます　↓","url":"https://x.com/tetumemo/status/2113883654409641991","createdAt":"2026-10-24T06:41:51Z","metrics":{"views":1802,"likes":8},"lang":"ja"},{"id":"2113808995890647462","author":"Fabio Ricotta","handle":"fabioricotta","text":"Melhor coisa que fiz no Grok Bot foi pedir pra ele:\n\"Instale o Claude Code e o Codex no seu computador. Transfira a maior parte das tarefas para eles. Trabalhe como um orquestrador, apenas verificando a qualidade ou ajustes necessários.\"\n\nIsso fez meu limite aguentar bem mais.","url":"https://x.com/fabioricotta/status/2113808995890647462","createdAt":"2026-10-24T01:45:11Z","metrics":{"views":35291,"likes":383},"lang":"pt"},{"id":"2113842468831760767","author":"堀内進之介：『パランティア　判断を外注する社会』（晶文社）","handle":"Homocriticos","text":"ひぇ〜。新たに見つかった脆弱性。PHP問題よりヤバい。深刻度の点数はPHPの件と同じ9.2／10。\n\nBrotliという、通信データを小さく圧縮し、受け取った側で元に戻すための仕組みに、重大な欠陥が見つかったようだ。Node.js、Bun、Envoyなど、Webサービスや通信を支えるソフトに使われている。\n\n何がヤバいかって、細工された圧縮データを未修正のソフトが解凍すると、条件次第で、攻撃者のコードを実行させられること。\n\n攻撃者はログインする必要も、アカウントを作る必要もない。普段なら何事もなく行われる「データを受け取って元に戻す」という処理が、乗っ取りの入口になりうる。\n\nしかも、攻撃される経路は両方向にある。\n\nサービスを運営する側は、外から送られてくるデータで狙われる。データを取得する側も、接続先から返されたデータを解凍する際に狙われる。\n\n「自分はサーバーを運営していないから関係ない」とは言い切れない。\n\nさらに厄介なのが、修正の行き渡り方だ。\n\n報告によれば、根本原因は2月に元のコードで直っていた。しかし、その時点ではセキュリティ上の問題だと認識されておらず、新しいリリースにもなっていなかった。\n\nもちろん、影響はソフトの版や設定次第で、Brotli本体やNode.js、Bunなどの修正版は、すでに出ている。利用者はアプリの更新を、運営者は内部で使っている部品まで含めて確認してほしい。\n\n自分では名前も知らない仕組みに、普段使っているサービスの安全が依存している。その仕組みの修正を、使っている各製品にまで届け切る必要がある。この難度が高いよねぇ。\n\n詳細・対策：\nhttps://t.co/OtRZn2qC9F⁠","url":"https://x.com/Homocriticos/status/2113842468831760767","createdAt":"2026-10-24T03:58:12Z","metrics":{"views":104020,"likes":392},"lang":"ja"},{"id":"2113837550003740920","author":"しょうへい｜デイトラ代表","handle":"showheyohtaki","text":"AIへの指示用に、\"LP・Webサイトの演出名\" 第2弾をまとめました。\n\nClaudeやCodexでサイトを作るとき、「おしゃれに動かして」だけでは、狙い通りの演出は出せない。\n\n「スタッキングカード」「3Dチルト」「ビュートランジション」と名前で頼めば、思い通りの演出を再現できます。\n\n保存推奨です🔖","url":"https://x.com/showheyohtaki/status/2113837550003740920","createdAt":"2026-10-24T03:38:39Z","metrics":{"views":9173,"likes":188},"lang":"ja"},{"id":"2113928976381210823","author":"藤原【Claude×FX】","handle":"investor392","text":"【今週のドル円デイトレ】\n\n+159万8000円\n\n一番すごかったのは、\nClaudeが「何もしなかった日」\n\n👇","url":"https://x.com/investor392/status/2113928976381210823","createdAt":"2026-10-24T09:41:57Z","metrics":{"views":225,"likes":5},"lang":"ja"},{"id":"2113828073317470473","author":"Codex研究ラボ","handle":"codexneo4","text":"Codexがガチで化けた\n\n28.6万GitHub Stars\n71種類の専門Agent\n311種類のSkills\n\nこれら全てを今すぐ誰でもCodexに\n導入できる「ECC」がヤバすぎる\n\nもはや無料でAI開発会社を\n丸ごと雇う感じに似てる。\n\n何ができるのか解説する👇","url":"https://x.com/codexneo4/status/2113828073317470473","createdAt":"2026-10-24T03:01:00Z","metrics":{"views":11183,"likes":121},"lang":"ja"},{"id":"2113837645143126225","author":"とよふく🎍Toyofuku","handle":"Yeq6X","text":"有能な秘書エージェントサービスがどんどん出てきて、一番やっておいて良かったのは\n\nGrok botから再開しても、Museから再開しても、dotsから再開しても、Claude Codeから再開しても、同じ情報を持って再開できる状態にしておくこと。\n\nメモリ層とエージェント層が分かれるように意識的に工夫していたおかげで、\n\n「Museで昨日やった作業の続きをGrok botに任せる」みたいなことが出来てすごく便利。\n\n分かりやすく1つの指標としてラベリングすると、\n「記録が秘書アプリにだけに残っている状態にしない」\nというのが有用。","url":"https://x.com/Yeq6X/status/2113837645143126225","createdAt":"2026-10-24T03:39:02Z","metrics":{"views":10260,"likes":111},"lang":"ja"},{"id":"2113740841974182173","author":"kryzer","handle":"0xkryzer","text":"holy sh*t. SpaceXAI engineer, Lauren Tan:\n\n\"I'm running 80+ GrokBot agents with /loop, /goal, inside pstack. My bots shipping code even when I sleep\n\nat SpaceXAI, 85% of our engineers running 20+ GrokBot agents as a team. I have a Chief of Staff agent, it knows other agents and manages everything\"\n\nin a 1-hour workshop, a SpaceXAI engineer revealed how to build a team of GrokBot agents from scratch\n\nworth more than a $500 agentic engineering course\n\nwatch today, then read the article on how to build a team of GrokBot agents from scratch","url":"https://x.com/0xkryzer/status/2113740841974182173","createdAt":"2026-10-23T21:14:22Z","metrics":{"views":3773,"likes":52},"lang":"en"},{"id":"2113871204251807837","author":"澪 -mio-","handle":"Supi_x_","text":"Claude Codeで動画編集する人へ\n\n海外で紹介してるgithubのプリセット読み込めば、演出のクオリティが一気に上がります🤫\n\nリンクはリプへ","url":"https://x.com/Supi_x_/status/2113871204251807837","createdAt":"2026-10-24T05:52:23Z","metrics":{"views":16282,"likes":327},"lang":"ja"},{"id":"2113852974984544752","author":"StudioYebisu","handle":"studio_yebisu","text":"1週間見てないだけでAIネイティブ3D CAD OSS\nSolidCraftがとんでもない成長をとげてる…\n作者の熱意とOSSコミュニティの注目度がすごいな","url":"https://x.com/studio_yebisu/status/2113852974984544752","createdAt":"2026-10-24T04:39:57Z","metrics":{"views":3263,"likes":73},"lang":"ja"},{"id":"2113904178779258881","author":"Kenn Ejima","handle":"kenn","text":"最悪の展開になってきました","url":"https://x.com/kenn/status/2113904178779258881","createdAt":"2026-10-24T08:03:25Z","metrics":{"views":70972,"likes":283},"lang":"ja"},{"id":"2113756925124882770","author":"Alvaro Cintas","handle":"dr_cintas","text":"Every Mac on macOS 27 now has a free LLM built into the Terminal.\n\nNo account. No API key. No internet. No token bill.\n\nSetup (1 minute):\n\n1. sudo fm license (enter your Mac password, one time)\n2. fm available (checks the model is downloaded)\n3. fm respond “your question”\n\nWorks on any Apple Silicon Mac, M1 included.\n\n- Pipe files: cat notes.txt | fm respond -i “summarize this”\n- Get JSON back: build a schema with fm schema object, pass it with --schema\n- Local API: fm serve gives you an OpenAI-compatible endpoint on localhost\n- Resume chats: sessions save to ~/.fm/sessions/\n\nThe limit is 4,096 tokens per session, and your prompt, instructions, and the answer all share it.\n\nSo skip code and math. Use it for summarizing, extracting, classifying, and rewriting.\n\nFree, private, offline, and already on your Mac.","url":"https://x.com/dr_cintas/status/2113756925124882770","createdAt":"2026-10-23T22:18:17Z","metrics":{"views":78584,"likes":767},"lang":"en"},{"id":"2113903625282232345","author":"shi3z","handle":"shi3z","text":"すごいことが起きている","url":"https://x.com/shi3z/status/2113903625282232345","createdAt":"2026-10-24T08:01:13Z","metrics":{"views":5619,"likes":58},"lang":"ja"},{"id":"2113800139005460534","author":"Xudong Han","handle":"Xudong07452910","text":"Anthropic 最近开始建议企业「少用点 Subagent」，甚至把一些专家 Agent 重新合并回主 Agent Loop。\n\n他们在多个企业项目中发现，单 Agent + Skills 的效果经常比复杂的多 Agent 架构更好。有个客户改成单 Loop 后，运行速度甚至快了约 2 倍。\n\n原因很容易理解。\n\n多个 Agent 之间反复交接任务，每次都要传递和总结 Context，信息容易丢失，延迟和成本也跟着增加。\n\nAnthropic 现在更推荐让一个主 Agent 负责规划和执行，需要时再动态加载 Skills 和 Tools，把业务流程和领域知识留在可复用的组件里。\n\n不过文章里有个细节值得关注。\n\n他们曾把客服系统里的 Subagent 合并，延迟确实降低了，却让一个原本能完成的任务失败了，因为主 Agent 漏掉了向物流专家确认送达时间这一步。\n\n所以作者强调，每合并一个 Subagent，都要用端到端 Eval 验证，尤其要检查哪些原本通过的任务突然失败了。\n\n当然，并行研究、独立验证、Context 隔离这些场景，Subagent 依然有价值。\n\n这样看来以后设计 Multi-Agent，可能得先问问自己，每个 Subagent 真的需要独立的 Context 和执行循环吗？\n\nAnthropic 还开源了一套迁移工具，可以帮你分析现有架构，逐步合并 Subagent，并比较改动前后的质量、成本和延迟。很推荐做 Agent 工程的朋友试试。\n\n原文：","url":"https://x.com/Xudong07452910/status/2113800139005460534","createdAt":"2026-10-24T01:10:00Z","metrics":{"views":94697,"likes":808},"lang":"zh"},{"id":"2113675579170201833","author":"cristal💎","handle":"0xCristal","text":"I told my Grok Bot to earn $11,000 or i'd cancel my subscription\n\nlast post, i showed you my grok bot hitting $11,040\n\nyou thought that was the end?\n\nit just reached $15,743.36\n\nstarting with $19.63\n\nread that again\n\ni've been building an ai trading terminal with grok bot, and the system keeps running while six agents scan tokens, analyze opportunities and execute trades\n\nsince the last update, the balance displayed on the terminal has climbed by another $4,702.78\n\nhere's where things stand now\n\nstarting balance: $19.63\n\ncurrent balance: $15,743.36\n\ntotal p\u0026l shown: +$15,723.73\n\nwin rate: 70.4%\n\nresolved events: 2,533\n\nand this isn't just a number on a screen\n\nthe terminal shows the balance history, live activity logs, token scans, trade executions and communication between agents\n\nsix agents operating inside one environment\n\none scans the market, another flags opportunities, trades get executed, and every event gets logged\n\nwins, losses, liquidity checks, slippage, new pairs\n\nit's all happening inside the same terminal\n\nthe wild part is how this started\n\ni didn't build a massive trading infrastructure from scratch by hand\n\ni used grok bot to help build the agents, the trading system and the interface itself\n\nnow i'm pushing the experiment further and documenting the results as they happen\n\nfrom $19.63 to $11k, and now past $15.7k on the dashboard\n\nthe real question is how far this thing can go\n\nfollow me if you want this bot\n\nbookmark and read my article later ↓ wagmi","url":"https://x.com/0xCristal/status/2113675579170201833","createdAt":"2026-10-23T16:55:02Z","metrics":{"views":46176,"likes":264},"lang":"en"},{"id":"2113932033101856979","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【動画公開】最新の基調講演、ループ型AI駆動経営。\n\n企業が指標にすべきAI活用の5段階と、弊社が実践中のAI駆動経営の実例をいくつも紹介しています。\n\n・毎日の数字が全部届くKPIダッシュボード\n・AIが記事を書き、順位を見て、書き直し続けるループ型のブログ\n・2時間で作ったLPが検索圏外から1位に\n・商談まわりは打ち合わせ以外すべてAIで自動化\n・外注で8ヶ月遅れた開発を1週間半で取り戻した自社開発\n\n参考になる事例を余すことなく公開しているので、ぜひチェックしてみてください👇\n\n■動画\nhttps://t.co/aplPP5r1ud\n\n■タイムライン\n00:00 オープニング\n01:02 生成AIとAIエージェント\n04:32 Webのチャットはもう古い\n08:43 なぜ広がらないのか\n11:14 AI活用の5段階\n13:35 レベル3 業務を線で自動化\n16:09 レベル4 アプリは自社で\n17:32 レベル5 売上を作るループ","url":"https://x.com/masahirochaen/status/2113932033101856979","createdAt":"2026-10-24T09:54:06Z","metrics":{"views":2461,"likes":9},"lang":"ja"},{"id":"2113862965262962804","author":"Mulight 沐光","handle":"Mulight","text":"全网Grok Bot教程越来越多了，新手到底该从哪里学起？\n\n最近刷X，发现不少大佬都在分享Grok Bot的玩法，有人拿它做自动化，有人组建AI团队，还有人直接让Bot帮自己干活赚钱。\n\n教程确实不少，但东一篇西一篇的，真想系统学起来，还挺费时间。\n\n我把最近比较值得看的中文、英文和官方教程整理了一遍，从零基础到进阶都有，建议先收藏，省得以后到处找。\n\n①中文教程，建议优先看这4个\n\n1.铁柱AGI｜Grok Bot中文学习站\nhttps://t.co/GvvZZWkGPe\n一共25章，从创建第一个Bot，到Routines自动化、多Bot分工协作，还有路线图和现成模板。\n\n新手不知道从哪开始，先看这个。\n\n2.蓝哥AI｜24篇优质教程合集\nhttps://t.co/lCVWSckODl\n\n把X上的Grok Bot文章分成9个类别，不用自己满世界找教程，缺哪方面的知识直接翻。\n\n3.西堂AI｜24篇精选教程\nhttps://t.co/TSHpNNcXvQ\n\n从91条教程中筛选出来的，还安排了学习顺序，适合想一步步进阶的朋友。\n\n4.xilo｜零基础搭建自动化Agent团队\nhttps://t.co/hfx7YgZteH\n\n万字长文，从开通到多Bot协作都有，想让几个AI员工互相配合干活的，可以重点研究。\n\n②英文教程，这套20课值得看看\n\n5.Sawyer Merritt｜20课Grok Bot实战课程\nhttps://t.co/d8GDTqJtX4\n\n从基础对话、应用连接，到云电脑、Routines和多Bot协作都有，还带实际练习。\n\n原帖：\nhttps://t.co/sNoxI3G5Ho\n\n③官方教程，这两个入口也别漏了\n\n6.Grok Bot官方Guides\nhttps://t.co/LZNBatqNnQ\n\n建议先看Grok Bot 101，把基础功能跑通，再根据自己的工作需求研究其他玩法。\n\n7.Matt Palmer｜Getting Started入门视频\nhttps://t.co/3O038ZZgoN\n不喜欢看长篇教程的，可以先从视频入手，跟着操作更直观。\n\n最后说下我建议的学习顺序：\n\n先看铁柱的中文教程，跑通第一个Bot；再结合官方Guides熟悉功能；想玩自动化、多Bot协作，就去研究Sawyer和xilo的内容。\n\n其实还有个最简单的办法：直接问自己的Grok Bot，让它一步步教你操作。\n\n我觉得学AI最容易犯的毛病就是教程收藏了一大堆，真正动手的次数却没几次。\n\n与其花几天研究别人怎么玩，不如先给自己创建一个Bot，找件每天都要重复做的事情交给它。\n\n等它真的帮你省下时间，你自然就知道下一步该学什么了。","url":"https://x.com/Mulight/status/2113862965262962804","createdAt":"2026-10-24T05:19:39Z","metrics":{"views":11325,"likes":144},"lang":"zh"},{"id":"2113627356204056872","author":"AI超元域","handle":"AISuperDomain","text":"发现一个很有意思的开源项目：Claude SEO，让 Claude Code 直接变成一支专业 SEO 优化团队！\n\n项目集成了 26 个 Skill、19 个专业 Agent，最多支持 17 个 Agent 并行工作。\n\n只需输入 /seo audit 网址，就能对网站进行系统性审计，包括：\n\n✅ 技术 SEO：抓取、索引、网站性能\n\n✅ 内容优化：关键词、标题、内容质量\n\n✅ 结构化数据：Schema 检查与生成\n\n✅ AI 搜索优化：ChatGPT、Gemini 等平台的 GEO 优化\n\n✅ 竞争分析、主题聚类、内部链接优化\n\n项目还结合 Python、Playwright，以及可选的 Google Search Console 等数据源，支持一次审计最多 500 个页面，自动定位问题并给出修复优先级。\n\n真正值得关注的是它的架构设计： 不再依靠单个 Prompt 完成 SEO，而是将复杂任务拆分给不同专业 Agent，通过工具执行、数据分析和协同工作，形成完整的自动化流程。\n\n当然，它不能保证搜索排名提升，GEO 评分也不代表真实的 AI 引用率。\n\n对于独立开发者、技术博客和内容网站而言，这套工作流很有实用价值。\n\nGitHub：","url":"https://x.com/AISuperDomain/status/2113627356204056872","createdAt":"2026-10-23T13:43:25Z","metrics":{"views":12164,"likes":206},"lang":"zh"},{"id":"2113699081336033346","author":"苫米地英人","handle":"DrTomabechi","text":"田中悠斗君用に造語したオフホワイトハッカーが政府用語になった","url":"https://x.com/DrTomabechi/status/2113699081336033346","createdAt":"2026-10-23T18:28:26Z","metrics":{"views":38662,"likes":716},"lang":"ja"},{"id":"2113835833468105126","author":"SOU⚡️投資ニュース / 米国株・日本株・仮想通貨・AI","handle":"SOU_BTC","text":"【速報】🚨「HTTP2Shell」と呼ばれる重大な脆弱性、影響範囲が拡大\n\n・悪用されると、ログインなしで外部から不正なプログラムを実行される恐れ\n・Node.jsやPythonだけでなく、多数のアプリにも影響する可能性\n・一部のサービスでは修正プログラムが未提供","url":"https://x.com/SOU_BTC/status/2113835833468105126","createdAt":"2026-10-24T03:31:50Z","metrics":{"views":230635,"likes":1017},"lang":"ja"},{"id":"2113670421119742067","author":"ryu.","handle":"romanftp","text":"Claude Code es un lío. Hasta que instalas esto.\n\nHay un plugin oficial de Anthropic llamado claude-code-setup.\n\nTe dice qué automatizaciones puedes montar (hooks, skills, MCP servers, subagentes…) y cómo configurarlas paso a paso.\n\nBásicamente analiza tu proyecto y te recomienda qué activar.\n\nPara instalarlo:\n\n/plugin install claude-code-setup@claude-plugins-official\n\nGuarda este post para no perderlo 🔖","url":"https://x.com/romanftp/status/2113670421119742067","createdAt":"2026-10-23T16:34:33Z","metrics":{"views":46205,"likes":645},"lang":"es"},{"id":"2113820179096310080","author":"Hedy Zhang","handle":"xiaomanhedy","text":"今天英推圈很火的 Dessa语音模型，听完它和 GPT-live 的实测对话，这次是真震惊瘫坐了😱\n\n我是真听不出来机器的味了，真的就像跟真人一样交流，打断的语气，说话的气息、重音、迟疑、自然流畅度，太牛了！\n\n原帖 jack 还回复说，这个不是文本模型包装的，而是纯语音到语音（No LLM），并且小到能直接在 Mac 本地部署。\n\nAI 交互的下一站，终于不再是聊天框了，就是不知道中文啥时候支持.....","url":"https://x.com/xiaomanhedy/status/2113820179096310080","createdAt":"2026-10-24T02:29:38Z","metrics":{"views":26924,"likes":201},"lang":"zh"},{"id":"2113600960497148150","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"stop using grok bot like a chatbot.\n\ndrop this into Grok Bot and let it build an entire team of AI agents that research, prompt, review, and work together for you\n\nsteal this before everyone starts using it: https://t.co/1lP8szcjua","url":"https://x.com/eng_khairallah1/status/2113600960497148150","createdAt":"2026-10-23T11:58:32Z","metrics":{"views":6578,"likes":60},"lang":"en"},{"id":"2113877257613947348","author":"Elon Musk","handle":"elonmusk","text":"So do I","url":"https://x.com/elonmusk/status/2113877257613947348","createdAt":"2026-10-24T06:16:26Z","metrics":{"views":1077949,"likes":3638},"lang":"en"},{"id":"2113767638295884286","author":"Erick","handle":"ErickSky","text":"GITHUB EXPLOTÓ CON ESTO!!!\n\nUno de ustedes + Codex + Claude hicieron ~5.000 commits en 2 meses y crearon el sistema de media local más loco que he visto este año.\n\n- Local-first.\n- Unifica discos + nubes (115, PikPak, OneDrive).\n- Pared de playback.\n- Metadata automática.\n- Tracking de creadores.\n- Descargas en la nube.\n\n⚠️ NSFW (adult media)\n\nREPOOO👇","url":"https://x.com/ErickSky/status/2113767638295884286","createdAt":"2026-10-23T23:00 metrics":{"views":920653,"likes":2348},"lang":"ja"},{"id":"2113624276993478858","author":"distort","handle":"distortgeekin","text":"Holy sh*t, Elon Musk's team just put 146 Grok Bots online for free\n\nOne runs your vacuum, one chases your invoices, one calls your customers\n\nThat's a $180K assistant, bookkeeper and sales rep for $0\n\nMost people will add one, type \"hi\" and never open it again\n\nHere's the first message I'd send to the 6 I'd add:\n\n→ Home robots: \"Vacuum the kitchen at 10 every weekday, skip it if I'm home\"\n→ Credit Card Max: \"Go through my last 3 months and tell me which card I should've used on each charge\"\n→ Subscription cleaner: \"List everything I pay for that I haven't opened in 60 days\"\n→ Invoice coordinator: \"Chase every invoice older than 14 days, polite first, firm after day 21\"\n→ dial bot: \"Call the 5 customers who didn't renew and ask why, then send me the answers\"\n→ Recruiting Coordinator: \"Book interviews with my top 3 candidates this week, ask me before you email anyone\"\n\nStart with the vacuum one, it's the one that makes people get it\n\nAll 146 are linked in the first reply\n\nThen read how to wire them into one team that never sleeps in the article below ↓","url":"https://x.com/distortgeekin/status/2113624276993478858","createdAt":"2026-10-23T13:31:11Z","metrics":{"views":11480,"likes":109},"lang":"en"},{"id":"2113909212430680283","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝MuseはInstagramとThreadsを自由自在に操れるのが一番良い！\n\nインスタやThreadsってなかなか手につかず、運用忘れがち\nけど、Museのおかげで動画を投げるだけでポスト文、タグ、リール、ストーリーズ投稿含め全部やってくれる！\n\nマジで便利なので、一旦試してみる価値アリです！ https://t.co/ZuaJnek17n","url":"https://x.com/tetumemo/status/2113909212430680283","createdAt":"2026-10-24T08:23:25Z","metrics":{"views":1932,"likes":5},"lang":"ja"},{"id":"2113674248514400675","author":"Morty","handle":"0xMortyx","text":"Lauren just open-sourced the full skill layer behind her GrokBot setup.\n\n54 skills total - installable in one click.\n\nThe interesting part is how the library is structured:\n\n• 3 orchestration skills → /poteto-mode acts as the entry point and coordinates the rest\n• 8 build skills → arena, swarm, architect, blast-radius\n• 6 review skills → interrogate, no-comments, verification\n• 8 reasoning skills → how, why, teach, bro\n• 5 writing skills → unslop, technical-writing\n• 24 operating principles → loaded before agents make decisions\n\nSo instead of re-prompting GrokBot for every task, you’re giving it a reusable skill system it can call when needed.\n\nThe full stack is in the image.\n\nSave it, then plug the skills into your own GrokBot setup ↓","url":"https://x.com/0xMortyx/status/2113674248514400675","createdAt":"2026-10-23T16:49:45Z","metrics":{"views":18785,"likes":264},"lang":"en"},{"id":"2113838423421366367","author":"タツ | AI×デザイン | EQUAL DESIGN Inc.","handle":"tatsu_studio","text":"AIでサイトを作っている人へ。\n\nCloudflareが作ったCMS「EmDash（エムダッシュ）」は知らないと損してます。僕もこれから作るサイトのお知らせ欄はEmDashで付けていきます。\n\n特徴を5つにまとめました⤵︎","url":"https://x.com/tatsu_studio/status/2113838423421366367","createdAt":"2026-10-24T03:42:08Z","metrics":{"views":3844,"likes":36},"lang":"ja"},{"id":"2113888224342954456","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"【緊急】\nPHP使ってる人、今すぐ見て\n\nこの画像1枚を自分のCodexに読ませろ\nOpenAIが脆弱性チェック用スキルを公開\n重大な「PHP2Shell」の2つのCVEが対象\n\n面倒なプロンプト作成は不要\n画像1枚でチェックから対策まで動き出す\n\n実際のやり方は👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\nこれ、ただのサム・アルトマンの画像じゃない\n\n画像そのものがCodexへの作業指示書\n\nやることは超シンプル\n\nこの画像を保存して\n自分のCodexに読み込ませるだけ\n\n画像の中には\n脆弱性チェックと修正の指示が書かれている\n\nCodexがその内容を読み取り\nPHP環境の調査を進める仕組み\n\n今回の対象は「PHP2Shell」\n\nCVE-2026-109618\nCVE-2026-109619\n\nOpenAIは専用のチェックツール\n「php2shell-checker」をGitHubで公開\n\nhttps://t.co/PVT5qxuiZQ\n\nこの画像には導入手順まで含まれている\n\nCodexがGitHubのスキルを読み込み\n脆弱性の確認作業を支援する\n\nチェック方法は大きく2つ\n\n① サイトのURLからPHP情報を確認\n② サーバー内の稼働環境を直接確認\n\nURLモードではHTTPヘッダーを解析\n\n取得したPHPのバージョン情報を\n修正済みバージョンと照合する\n\n結果はOK・要注意・不明に分類\n\nさらにサーバーへのアクセス権限があれば\nPHP-FPMやApacheの環境も調査できる\n\n実際に動いているPHPを特定し\n必要なアップデートを整理\n\nCodexは修正作業の支援もできる\n\n影響を受ける設定やパッケージを確認し\n必要な変更を提案する\n\n修正後のテストや再確認も重要\n\nただし画像を読み込ませただけで\n脆弱性が自動的に消えるわけではない\n\n本番環境の修正には適切な権限と承認が必要\n\nそれでも、この仕組みは衝撃的\n\nこれまで専門知識が必要だった調査を\n画像1枚からAIに指示できる\n\n難しいプロンプトを自作する必要もない\n\nこれからのセキュリティ対策は\n人間が全部調べる時代から\nAIに調査と修正を支援させる時代へ\n\nPHPサイトを運営しているなら\nこの画像は保存しておきたい。","url":"https://x.com/ai_300/status/2113888224342954456","createdAt":"2026-10-24T07:00:01Z","metrics":{"views":532,"likes":3},"lang":"ja"},{"id":"2113930435809915101","author":"Insomnia","handle":"insomnia_vip","text":"imagine this grok system protecting software updates across every tesla\n\nbefore a new update reaches everyone, grok can mirror live traffic, compare the new build against production and track down the exact commit behind a regression\n\n7 specialized agents handle the investigation, from replaying edge cases and running git bisect to preparing a hotfix or rollback before the problem spreads\n\n\u003e 142 requests mirrored on the dashboard\n\u003e 128 matched responses compared\n\u003e 9 regressions investigated through git bisect\n\u003e 5 rollbacks tracked by the system\n\u003e 88% lower displayed release-guard costs\n\u003e 50/50 replayed requests passed in the displayed verification\n\nthe goal is simple: catch the update that breaks things before everyone gets it","url":"https://x.com/insomnia_vip/status/2113930435809915101","createdAt":"2026-10-24T09:47:45Z","metrics":{"views":141,"likes":10},"lang":"en"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
