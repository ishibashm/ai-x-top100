<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィ エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-14T20:32:02+09:00","posts":[{"id":"2110244638900773147","author":"Elon Musk","handle":"elonmusk","text":"Make music videos easily with Grok @Bot","url":"https://x.com/elonmusk/status/2110244638900773147","createdAt":"2026-10-14T14:41:43+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":1036567,"likes":3889,"reposts":528,"replies":721},"lang":"en","textJa":"Grok @Botでミュージックビデオを簡単に作れる"},{"id":"2110238871170449482","author":"StudioYebisu","handle":"studio_yebisu","text":"リアルタイム生成Fast MiniMax H3-Omni。\n自称最高速、最Qualityモデル。どうやら10月20日にオープンウェイトモデルも公開されるっぽい？\n\nAPIだと動画の再生時間よりも動画の生成時間の方が短いので、いわゆるリアルタイム動画生成AIチューバーみたいなこともできるっていうやつですね。\n\nMiniMax H3を高速化した、映像と音声を同時に生成するモデルなんですけど。\nFastVideo／Hao AI Labが追加学習や推論の最適化を行い、Nuva Labが協力しています。個人レベルじゃなくて、ちゃんとしたラボが高速化と最適化をしているっていう点ではかなり注目。\n\nとりあえずはAPIがもう公開されていて。\n$0.0125／秒＝$0.75／分。かなり安めではあるね。\n\n重みが出たらマジ熱いなぁ。今はまだ公開予告の段階。\n下手したら5090とかBlackwell 6000ぐらいで。\n\nリアルタイム動画生成がローカルだけでできる可能性があるっていう風に考えると、ちょっと注目したいかも。\n既存FastH3 V2の公式計測では、RTX 5090で5秒・480pの動画生成に14.8秒かかっています。\nこれがOmniになったことで、どれだけ上がってるかっていうことですよね。","url":"https://x.com/studio_yebisu/status/2110238871170449482","createdAt":"2026-10-14T14:18:47+09:00","avatar":"https://pbs.twimg.com/profile_images/2095218586046652416/pyuFtKH0_200x200.jpg","metrics":{"views":1754,"likes":21,"reposts":0,"replies":0},"lang":"ja"},{"id":"2110275689538813967","author":"Csaba Kissi","handle":"csaba_kissi","text":"http://hn.watch - Hacker News, but every story is a video explainer\nhttp://github.com/cathrynlavery/diagram-design - 45 free AI diagram types\nhttp://github.com/morluto/rea - Open-source AI reverse engineering\nhttp://motiq.dev - 86 free animated React components\nhttp://github.com/mksglu/context-mode - 98% AI agent context savings","url":"https://x.com/csaba_kissi/status/2110275689538813967","createdAt":"2026-10-14T16:45:06+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110275657263706112/img/MKc3bBz0TbbVjhx-.jpg","avatar":"https://pbs.twimg.com/profile_images/1454861068233228289/6sn9BYOf_200x200.jpg","metrics":{"views":2250,"likes":35,"reposts":1,"replies":14},"lang":"en","textJa":"http://hn.watch - Hacker Newsの各記事が動画解説になる\nhttp://github.com/cathrynlavery/diagram-design - 無料のAI図解タイプ45種\nhttp://github.com/morluto/rea - オープンソースのAIリバースエンジニアリング\nhttp://motiq.dev - 無料のアニメーションReactコンポーネント86個\nhttp://github.com/mksglu/context-mode - AIエージェントのコンテキストを98%節約"},{"id":"2110065737545257312","author":"naldz.","handle":"naldzyul","text":"Este chaval explica cómo hacer páginas web de nivel profesional con GPT-5.6 Sol.\n\n21 minutos de clase, paso a paso, para sacar diseños con acabado cinematográfico.\n\n🔖 Guárdalo. Vale cada minuto.","url":"https://x.com/naldzyul/status/2110065737545257312","createdAt":"2026-10-14T02:50:49+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110065300083204096/img/O9rkbDsUWKV7r6TT.jpg","avatar":"https://pbs.twimg.com/profile_images/2094137913902530562/GRfqH9fk_200x200.jpg","metrics":{"views":32787,"likes":899,"reposts":104,"replies":17},"lang":"es","textJa":"この人がGPT-5.6 Solでプロ級のWebページを作る方法を解説している。\n\n21分の授業で、映画のような仕上がりのデザインを一歩ずつ作る流れ。\n\n保存しておく価値がある内容だ。"},{"id":"2110145714659664275","author":"atomic.chat","handle":"atomic_chat_hq","text":"Gemini 4 Argon is Opus 5.5 level for 3x cheaper 💵\n\nWe put @Google's latest model against opus 5.5 side by side to create a 3D Voxel sport car assembly animation\n\nRun both models via API -\u003e https://atomic.chat","url":"https://x.com/atomic_chat_hq/status/2110145714659664275","createdAt":"2026-10-14T08:08:37+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110144789559562241/img/WgpCnuTlEj3sz4fX.jpg","avatar":"https://pbs.twimg.com/profile_images/2037454994899959808/L7uqgUfL_200x200.jpg","metrics":{"views":45103,"likes":241,"reposts":7,"replies":7},"lang":"en","textJa":"Gemini 4 ArgonはOpus 5.5級で、コストは約3分の1 💵\n\n@Googleの最新モデルとOpus 5.5を並べて、3Dボクセルのスポーツカー組み立てアニメを作らせて比較した。\n\n両方APIで試せる → https://atomic.chat"},{"id":"2109981002978427034","author":"mana｜株式会社MakeAI CEO","handle":"MakeAI_CEO","text":"これはマジで助かるわ。非エンジニアはセキュリティ周り全然ダメだから、Codexで作ったサイトとかアプリとかを共有するの怖いんだよね。これ読めば万事解決👇","url":"https://x.com/MakeAI_CEO/status/2109981002978427034","createdAt":"2026-10-13T21:14:07+09:00","avatar":"https://pbs.twimg.com/profile_images/2004460966822727680/x2wh_2kc_200x200.jpg","metrics":{"views":70289,"likes":443,"reposts":51,"replies":0},"lang":"ja"},{"id":"2110308664422850749","author":"Fado","handle":"fado_dev","text":"Cloudflareで\n・記事入稿\n・サーチコンソールで検索分析\n・Ahrefsでキーワード分析\n・GA4でアクセス解析とCVトラッキング\n・GTM管理\n・AI記事リライト\nまで完璧にこなすアプリ作りました。\n\nWordPressよりシームレスでデザインも柔軟に変更可能。もはやマーケティングコンソールです。え、５ドル運用","url":"https://x.com/fado_dev/status/2110308664422850749","createdAt":"2026-10-14T18:56:07+09:00","avatar":"https://pbs.twimg.com/profile_images/2102218894182375424/eDQpEad7_200x200.jpg","metrics":{"views":3173,"likes":62,"reposts":3,"replies":1},"lang":"ja"},{"id":"2110058905875460393","author":"Vik Paruchuri","handle":"VikParuchuri","text":"Introducing Indra, a 1M parameter OCR model:\n\n- 49 pages/s on CPU, 11x faster than PaddleOCR and 17x Tesseract\n- Beats them on OmniParseBench text (41.3 vs 35.8 and 19.3)\n- Full layout and line bounding boxes","url":"https://x.com/VikParuchuri/status/2110058905875460393","createdAt":"2026-10-14T02:23:40+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110054306825068544/img/Jz7NYtivo-kbg0nl.jpg","avatar":"https://pbs.twimg.com/profile_images/1137021395047608321/RK6kgzVV_200x200.png","metrics":{"views":77985,"likes":2132,"reposts":188,"replies":81},"lang":"en","textJa":"100万パラメータのOCRモデル「Indra」を公開:\n\n- CPUで毎秒49ページ。PaddleOCRの11倍、Tesseractの17倍速い\n- OmniParseBenchのテキストで両者を上回る（41.3 vs 35.8と19.3）\n- レイアウトと行のバウンディングボックスにも対応"},{"id":"2110207707278086472","author":"테크형","handle":"TechHyung","text":"앤트로픽에서 레거시 코드를 최신 코드로 바꿔주는 플러그인을 내놨네요. \n\n단순히 바꿔주는게 아니라 제대로 동작하는지까지 검증해준다고 합니다. \n\n오래된 레거시 프로젝트 개선하려는데 엄두도 못내던 횽님들 한번 써보시는것도 나쁘지않을것 같아요~ \n\nhttps://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-modernization/README.md","url":"https://x.com/TechHyung/status/2110207707278086472","createdAt":"2026-10-14T12:14:57+09:00","avatar":"https://pbs.twimg.com/profile_images/2109194050947670017/In2TdKwK_200x200.jpg","metrics":{"views":4189,"likes":62,"reposts":13,"replies":0},"lang":"ko","textJa":"Anthropicが、レガシーコードを最新コードへ置き換えるプラグインを出した。\n\n置き換えるだけでなく、ちゃんと動くかまで検証してくれるとのこと。\n\n古いレガシー改善に手が出なかった人は、一度試してみるのもよさそう。\n\nhttps://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-modernization/README.md"},{"id":"2110037357164441796","author":"Mika","handle":"mika_systems","text":"ten agents found what was making a database with 48,000,000 rows feel broken\n\nThariq Shihipar (engineer at Anthropic) paired Claude Code with REA to rebuild the queries behind a dashboard that took 34 seconds to open\n\nhe gave the agents a database snapshot and a week of query logs\n\nevery change had to return the same data before it could count as an improvement\n\nREA grouped similar traces and routed them to the right investigation. Claude Code agents handled the changes:\n\n→ three examined expensive queries and execution plans\n→ three rewrote queries and tested indexes\n→ two compared old and new results\n→ two replayed dashboard sessions and checked write performance\n\nthe logs narrowed down to 18 recurring query patterns\n\none screen loaded a customer's entire history to display a single total\n\nanother repeated the same calculation for every chart\n\nthe agents moved that calculation into one shared query, then checked every affected screen\n\na proposed index made one dashboard faster but slowed incoming writes. the reviewer rejected it\n\n15 query changes passed review. three stayed untouched because the expected behavior needed clarification\n\non the saved workload:\n\n\u003e median dashboard load → 8.6 seconds to 0.7 seconds\n\u003e slowest dashboard → 34 seconds to 2.8 seconds\n\u003e 4,800 result comparisons → no mismatches\n\nabout 12x faster on both load-time measures, with no changes to the displayed results\n\neach accepted change included the query plan, measured timings and a rollback script\n\nthe engineer could inspect and apply each fix separately, with the original query beside its replacement\n\nfull optimization playbook below","url":"https://x.com/mika_systems/status/2110037357164441796","createdAt":"2026-10-14T00:58:03+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110035993038405632/img/w6MQ1jlFOwzK7rIo.jpg","avatar":"https://pbs.twimg.com/profile_images/2098763236837654529/OxjAF8qe_200x200.jpg","metrics":{"views":14572,"likes":309,"reposts":60,"replies":20},"lang":"en","textJa":"4800万行のデータベースが重い原因を、10体のエージェントが見つけた。\n\nAnthropicのエンジニア Thariq Shihipar が Claude Code と REA を組み合わせ、開くのに34秒かかっていたダッシュボードの裏クエリを作り直した。\n\nエージェントにはDBスナップショットと1週間分のクエリログを渡し、改善と認めるには同じデータを返す変更だけを条件にした。\n\nREAが似たトレースをまとめ、調査先へ振り分け。Claude Code側が変更を担当:\n\n→ 重いクエリと実行計画を3体が調査\n→ クエリ書き換えとインデックス試験を3体\n→ 新旧結果比較を2体\n→ ダッシュボード再生と書き込み性能確認を2体\n\nログから繰り返しパターンは18個に絞られた。\n\nある画面は合計1つ出すために顧客履歴を全部読み、別の箇所では同じ計算をチャートごとに繰り返していた。\n\nエージェントはその計算を共有クエリに移し、影響画面を全部確認した。\n\n提案インデックスは表示を速くしたが書き込みを遅くしたためレビューで却下。\n\nクエリ変更15件がレビュー通過。3件は期待動作の確認が必要で手つかず。\n\n保存した負荷での結果:\n\u003e ダッシュボード読み込み中央値 → 8.6秒から0.7秒\n\u003e 最遅ダッシュボード → 34秒から2.8秒\n\u003e 結果比較4800回 → 不一致なし\n\n表示結果を変えずに、どちらも約12倍速くなった。\n\n採用された変更にはクエリ計画・計測時間・ロールバックスクリプトが付き、元クエリと並べて個別に適用できる。\n\n最適化プレイブック全文は下へ"},{"id":"2110320011705565208","author":"yuu_a_240327","handle":"yuu_a_240327","text":"技術の価値は知識量では決まらない。どれだけ成果へ変えたかで決まる。技術事業化の突破隊長は、学んだ知識を現実に適用し、改善し、価値として残す。知っている人より、できる人。できる人より、結果を残す人。その領域を目指したい。","url":"https://x.com/yuu_a_240327/status/2110320011705565208","createdAt":"2026-10-14T19:41:13+09:00","media":"https://pbs.twimg.com/media/HUlc3WIbYAAhiVC.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2085653224477110272/JKsG5p4B_200x200.jpg","metrics":{"views":21,"likes":3,"reposts":1,"replies":0},"lang":"ja"},{"id":"2110044544494600619","author":"Snail","handle":"Cryptoxorz","text":"我把电脑里 8 个 Claude 做视频的 skills，做成了一支 100 秒的视频。片子本身也是 Claude 写代码做出来的，用的是其中第一个。\n\n下面挨个说说它们各自适合干什么。\n\n1. xilo-opus-video\n最通用。给它一个想法、一篇文章或一支参考视频，它先出三套方案和预览，你选一套，它再做成片。\nhttps://github.com/Kianzzz/xilo-opus-video\n\n2. lemo-opuscar\n一本风格图册。43 种影片风格，油画厚涂、中国水墨、浮世绘、白板讲解……报出风格名，它照着做。每种风格都配了一支纯代码样片。\nhttps://github.com/lemomo-ai/lemo-opuscar\n\n3. mg-styles-15\n专做 MG 动态设计。15 种风格，每支 10 秒，附完整提示词和源码，连配乐都是用代码编的。\nhttps://github.com/Vincentwei1021/mg-styles-15\n\n4. dashi-animationstyle\n给口播配画面。15 到 60 秒的中文口播，自带 7 套画风（手绘笔记、复古报刊、黑底科技等），成片带字幕，能直接拖进剪映。\nhttps://github.com/chuspeeism/dashi-animationstyle\n\n5. huashu-art-motion\n把美术史搬了进来。从洞穴壁画到像素游戏，35 种艺术风格都能动，另外还有 9 种解说动画的讲法。\nhttps://github.com/alchaincyf/huashu-art-motion\n\n6. wtt-code-animation-studio\n从编剧开始。一个想法进去，剧本、分镜、可改的源码、带声音的成片一次交齐，沙画、粉笔、水彩这类画法也能做。\nhttps://github.com/WaterDJiang/Wattter_openSkills/tree/main/wattter_skills/wtt-code-animation-studio\n\n7. video-shotcraft\n专拍产品。把你的网页或前端项目做成带 2.5D 运镜的宣传片，自带 124 张镜头配方卡。\nhttps://github.com/Vincentwei1021/video-shotcraft\n\n8. archival-doc（我自己做的）\n这一个不画画。它去找公有领域和 CC 授权的真实历史影像，核对素材许可，再剪成纪录片。\n\n感谢各位开源作者！","url":"https://x.com/Cryptoxorz/status/2110044544494600619","createdAt":"2026-10-14T01:26:36+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110044348226396160/img/iNgKN4QOb632qOWp.jpg","avatar":"https://pbs.twimg.com/profile_images/2056529511169269760/6m9RS0PV_200x200.jpg","metrics":{"views":14299,"likes":271,"reposts":44,"replies":16},"lang":"zh","textJa":"PCにあるClaudeの動画用skills 8つを、100秒の動画にまとめた。映像自体もClaudeがコードで作っており、最初のskillを使っている。\n\n下でそれぞれ向きを紹介する。\n\n1. xilo-opus-video\n一番万能。アイデア・記事・参考動画を渡すとまず3案とプレビューを出し、選んだものを成片にする。\nhttps://github.com/Kianzzz/xilo-opus-video\n\n2. lemo-opuscar\nスタイル図鑑。映画風43種（厚塗り油絵、水墨、浮世絵、ホワイトボード解説など）。スタイル名を指定するとそれに合わせて作る。各スタイルに純コードのサンプル映像付き。\nhttps://github.com/lemomo-ai/lemo-opuscar\n\n3. mg-styles-15\nMGモーション専用。15スタイル、各10秒。プロンプトとソース完備で、BGMもコード生成。\nhttps://github.com/Vincentwei1021/mg-styles-15\n\n4. dashi-animationstyle\n口語解説に映像を付ける。15〜60秒の中国語口頭、画風7種付き（手描きノート、レトロなど）"},{"id":"2110055618224808078","author":"a16z","handle":"a16z","text":"Patrick Collison with Amjad Masad on why AI will be like food: essential to everything, and still not where most of the value goes.\n\nAmjad: \"There's also this trend of saying that the foundation lab companies are gonna be able to capture a big part of at least new business creation, but perhaps the economy. It's like there's no reason to compete with ChatGPT or Claude because they're just gonna roll over us.\"\n\nPatrick: \"Without food, there really would not be much economy or humanity. It is a truly necessary ingredient in production. And yet, most of the economy is not captured by food producers.\"\n\n\"The idea that AI is going to be hugely important and abundant in the future does not necessarily mean that all the value is gonna be captured by these AI labs.\"\n\n\"The value of any company is in proportion to what its customers can pay it. And so if there's one company in the economy, that's in fact not a very valuable company... Prices and value accrue to that which is scarce.\"\n\n\"I think it would be a terrible reason not to start a company because you think that... any given company or sector will gobble everything up. That's not how things have worked through history.\"\n\nFull conversation: https://www.youtube.com/watch?v=YgYiF86h0yU\n\n@patrickc @stripe @amasad @Replit","url":"https://x.com/a16z/status/2110055618224808078","createdAt":"2026-10-14T02:10:36+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110055466655227904/img/e_lvMYKc79qps_hF.jpg","avatar":"https://pbs.twimg.com/profile_images/1919488160125616128/QAZXTMEj_200x200.png","metrics":{"views":25007,"likes":169,"reposts":14,"replies":26},"lang":"en","textJa":"Patrick CollisonとAmjad Masadが、AIは食料に似る、と話す。すべてに不可欠だが、価値の大半はそこには残らない、という話。\n\nAmjad: 「基盤ラボ企業が新規事業や経済のかなりを取り込む、という流れもある。ChatGPTやClaudeと競っても押しつぶされるだけだ、と」\n\nPatrick: 「食料なしでは経済も人類もほとんど成り立たない。それでも…」"},{"id":"2110075998385377512","author":"Miguel Ángel Durán","handle":"midudev","text":"¡Anthropic crea su propio Git!\n\nDesde septiembre fusionan más de 30.000 cambios de código al día. ¡Y git era un cuello de botella!\n\nSu solución: crear en solo 5 meses su propio sistema de control de versiones, pensado para agentes de IA en lugar de humanos:","url":"https://x.com/midudev/status/2110075998385377512","createdAt":"2026-10-14T03:31:35+09:00","avatar":"https://pbs.twimg.com/profile_images/1824773087323111424/-S3LUmjQ_200x200.jpg","metrics":{"views":133050,"likes":2275,"reposts":113,"replies":40},"lang":"es","textJa":"Anthropicが自前のGitを作った。\n\n9月以降、1日3万件超のコード変更をマージしている。Gitがボトルネックになっていた。\n\n解決策は、わずか5ヶ月で自前のバージョン管理を作ること。人間よりAIエージェント向けに設計されている:"},{"id":"2110224508913381475","author":"Swapna Kumar Panda","handle":"swapnakpanda","text":"A little heads-up:\n\nUp to 60% off CapCut plans starting Oct 20.\nDesktop only.\n\nJean Phil became popular because people remembered the character.\n\nThat’s the power of AI influencer marketing:\nA strong identity can become endless content.\n\nI tested creating that identity with Codex + CapCut PC.\n\nCodex automates the production workflow:\nCharacter setup.\nWhite model rendering.\nAI Video creation.\n\nThen CapCut PC brings the marketing vision together.\n\n#capcutpc #capcutchatgptplugin #capcutcodex #capcutmarketing #capcutsale","url":"https://x.com/swapnakpanda/status/2110224508913381475","createdAt":"2026-10-14T13:21:43+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110224388259995648/img/WzPLuVfJ-4AL4Jfx.jpg","avatar":"https://pbs.twimg.com/profile_images/1621910730227449856/iW8AGVCr_200x200.jpg","metrics":{"views":2795,"likes":8,"reposts":1,"replies":1},"lang":"en","textJa":"少しお知らせ:\n\n10月20日からCapCutプランが最大60%オフ。デスクトップ版のみ。\n\nJean Philが流行ったのは、キャラクターが覚えられたからだ。\n\nそれがAIインフルエンサーマーケの力: 強いアイデンティティが無限のコンテンツになる。\n\nそのアイデンティティ作りをCodex + CapCut PCで試した。\n\nCodexが制作フローを自動化:\nキャラ設定。\n白モデル描画。\nAI動画生成。\n\nそのあとCapCut PCでマーケのビジョンをまとめる。\n\n#capcutpc #capcutchatgptplugin #capcutcodex #capcu"},{"id":"2110003379963343277","author":"Mo Elgaraihy","handle":"EngMoElgaraihy","text":"🚨 جي بي تي وكلود أصبحا مجانيين تماماً! 😳⚡️\n\nبدون حساب. بدون بطاقة ائتمان.\n\nالنماذج المتاحة:\nGPT-6 Luna\nGPT-5.4 mini\nClaude Haiku 4.5\n\nجربها على الموقع الرابط في أول تعليق 👇 \n\nإذا وصلت إلى الحد، امسح بيانات الموقع وحاول مرة أخرى. استخدام غير محدود لـ GPT-6 Luna.\n\nاحفظ الرابط وجرب الآن. 🧵👇 https://x.com/k2sbhai/status/2110001770844037255/video/1","url":"https://x.com/EngMoElgaraihy/status/2110003379963343277","createdAt":"2026-10-13T22:43:02+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110001495483768832/img/Mj9GhzogUGvkCa7D.jpg","avatar":"https://pbs.twimg.com/profile_images/1892203225454903296/ONZqfOJK_200x200.jpg","metrics":{"views":33609,"likes":495,"reposts":61,"replies":9},"lang":"ar","textJa":"🚨 GPTもClaudeも完全無料になった！😳⚡️\n\nアカウント不要。クレジットカード不要。\n\n使えるモデル:\nGPT-6 Luna\nGPT-5.4 mini\nClaude Haiku 4.5\n\nサイトは最初のコメントのリンクで試せる 👇\n\n上限に達したらサイトのデータを消してもう一度。GPT-6 Lunaは実質無制限、とのこと。\n\nリンクを保存して今すぐ試せ。🧵👇 https://x.com/k2sbhai/status/2110001770844037255/video/1"},{"id":"2110063893016096831","author":"Greg Brockman","handle":"gdb","text":"6 days and $40,000 of compute with GPT-5.6 Sol to find a critical vulnerability in Chrome, claiming Google’s first full-chain reward in 2026 for a vulnerability that would affect an estimated 1 billion users.\n\nHighlights the opportunity for defenders to utilize these tools to secure their software to unprecedented levels:","url":"https://x.com/gdb/status/2110063893016096831","createdAt":"2026-10-14T02:43:29+09:00","avatar":"https://pbs.twimg.com/profile_images/1347621377503711233/bHg3ipfD_200x200.jpg","metrics":{"views":439087,"likes":5144,"reposts":264,"replies":203},"lang":"en","textJa":"GPT-5.6 Solで6日・計算コスト約4万ドルかけてChromeの重大脆弱性を見つけ、2026年のGoogle初のフルチェーン報奨を獲得。影響しうるユーザーは推定約10億人。\n\n防御側がこうしたツールでソフトをかつてない水準まで固められる、という機会を示している:"},{"id":"2110214008930451794","author":"Claude Code Research Lab","handle":"claudecode84","text":"Claude Codeの使い方、\nこれで激変する。\nOpus 5.5に全部やらせている人、\nかなりもったいない。\n\n実は、\n3つのAIモデルを役割分担させるだけで、開発効率とコストを最適化できる。\nやり方は簡単👇　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\nClaude Codeでこのコマンドを実行\nclaude --advisor opus --subagentshaiku\n\nそれぞれの役割はこう。\n\n① Opus 5.5：頭脳（設計・レビュー）\u2028→ 実装前に設計ミスをチェック\u2028→ 同じエラーが2回続いたら原因を分析\u2028→ 完成前にコード全体をレビュー\n\n② Sonnet 5.5：実行担当（開発）\u2028→ 実際にコードを書く\u2028→ 新しい機能を実装する\u2028→ テストを実行して修正する\n\n③ Haiku 5.5：調査担当（情報収集）\u2028→ 必要なファイルを探す\u2028→ APIやドキュメントを調査\u2028→ 複数の作業を並列処理する\n\nさらにJevを組み合わせれば、\nファイル選択やツールの呼び出しなど、\n単純な判断も軽量化できる。\n\nつまり、\n\nOpusが考える。\u2028Sonnetが作る。\u2028Haikuが調べる。\n\n高性能なOpusを単純作業に使わず、\n本当に重要な判断に集中させる。\n\nしかも、\nこの仕組みを設定するための\nプロンプトがこちら👇\n\n【Claude Code用プロンプト】\n以下をそのまま貼り付けてください。\n\nConfigure my Claude Code workspace for hierarchical advisor orchestration.\n\nGoal:\nOptimize development efficiency by assigning\nplanning, implementation, and research to\ndifferent models.\n\n1. Audit current configuration\n\nCheck:\n- ~/.claude/settings.json\n- Project-level Claude configuration\n- ~/.claude/CLAUDE.md\n\nVerify which advisor, subagent, and model\nsettings are supported by the installed version.\n\n2. Configure model roles\n\nMain Agent: Sonnet 5.5\n- Primary implementation\n- Code editing\n- Test execution\n- High reasoning effort\n\nSubagents: Haiku 5.5\n- Parallel file discovery\n- AST analysis\n- Documentation research\n- Medium reasoning effort\n- Maximum 3 parallel workers\n\nAdvisor: Opus 5.5\n- Architecture review\n- Complex debugging\n- Final code review\n\n3. Configure advisor checkpoints\n\nConsult Opus when:\n- Finalizing multi-file architecture plans\n- The same test or compiler error occurs twice\n- Reviewing the final diff before completion\n- Preparing important Git commits\n\nAvoid advisor calls for routine tasks.\n\n4. Optimize context usage\n\n- Keep research tasks inside Haiku subagents\n- Return concise, structured summaries\n- Avoid unnecessary full-file outputs\n- Preserve main-session context\n- Escalate only complex decisions to Opus\n\n5. Apply safely\n\n- Show every proposed configuration diff\n- Explain unsupported settings\n- Do not invent configuration keys\n- Do not modify files without confirmation\n- Ask for approval before applying changes\n\nFirst, inspect the current environment\nand present the recommended configuration.\n\nこのプロンプトで目指すのは、\n\n・Sonnetが開発を進める\u2028・Haikuが裏側で調査する\u2028・Opusが重要な場面だけレビューする\u2028・不要なトークン消費を抑える\u2028・設定変更前に必ず確認する\nという開発環境。\n\nAIの性能を上げるだけじゃない。\u2028AIの使い分けこそが、\nこれからの開発を変える。\n\n忘れないように保存して、\nClaude Codeで試してみてください👇 https://x.com/mirku21/status/2107939129736700335/video/1","url":"https://x.com/claudecode84/status/2110214008930451794","createdAt":"2026-10-14T12:40:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107938569968885760/img/lTf2HNaW541S_Q1K.jpg","avatar":"https://pbs.twimg.com/profile_images/2101586901669183488/jcpGEhJl_200x200.jpg","metrics":{"views":7646,"likes":54,"reposts":0,"replies":4},"lang":"ja"},{"id":"2110178779708669985","author":"Sadao Tokuyama","handle":"tokufxug","text":"工場向けAI安全監視「FactoryGuard AI」👷\n\n🔹映像から作業員・ヘルメット・安全ベスト・フォークリフトなどを検出\n🔹違反と断定せず、人による確認候補として記録\n🔹実映像37フレームで評価。再学習後も検出精度の課題を公開\n\nYOLO26を用いてMuhammad Rahman氏が開発。\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2110178779708669985","createdAt":"2026-10-14T10:20:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110178745713926144/img/bvbfFT7HRgNgYdCm.jpg","avatar":"https://pbs.twimg.com/profile_images/1614135119597686784/8APrdHkh_200x200.png","metrics":{"views":2459,"likes":60,"reposts":6,"replies":2},"lang":"ja"},{"id":"2109958416307470420","author":"岚叔","handle":"LufzzLiz","text":"卧槽，rea 真神器，codex、muse道德感太强，不给逆向，推荐大家可以用WorkBuddy 海外版本DeepSeek V4.1 ，免费！\n而且又快又好，这次我真是服了，我让分析了下claude ，会上报的数据和所有域名，晚点给大家发完整报告\n\n扎心了：我虽然改了时区，但是没有关掉\"自动设置时区\"，导致还是被识别出是Asia/Shanghai 😂","url":"https://x.com/LufzzLiz/status/2109958416307470420","createdAt":"2026-10-13T19:44:22+09:00","media":"https://pbs.twimg.com/media/HUgSKhuacAEMl8d.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1680410719941165058/vWaCNg37_200x200.jpg","metrics":{"views":46869,"likes":217,"reposts":24,"replies":27},"lang":"zh","textJa":"reaは本当に便利。codexやmuseは倫理が強くてリバースを拒むので、WorkBuddy海外版のDeepSeek V4.1がおすすめ、無料。\n速くて良い。今回Claudeを解析させ、送信データと全ドメインを出させた。あとで全文レポートを出す。\n\n痛いところ: タイムゾーンは変えたのに「自動設定」を切っておらず、結局Asia/Shanghaiと判定された 😂"},{"id":"2110223110003982788","author":"Elon Musk","handle":"elonmusk","text":"Grok @Bot can help with complex taxes","url":"https://x.com/elonmusk/status/2110223110003982788","createdAt":"2026-10-14T13:16:10+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":1143034,"likes":2741,"reposts":371,"replies":561},"lang":"en","textJa":"Grok @Botは複雑な税金の整理にも使える"},{"id":"2110038980058141140","author":"Android Developers","handle":"AndroidDev","text":"Gemini 4 Argon is here! → https://goo.gle/4yHO5eh\n\nWe tested it out and turned a basic 2D maps app into a 3D world. Watch our demo to see it in action.\n\nFeeling inspired to try it out for yourself? Get started today in Google @Antigravity with your Google AI Ultra subscription or in @AndroidStudio with the Gemini API paid tier.","url":"https://x.com/AndroidDev/status/2110038980058141140","createdAt":"2026-10-14T01:04:30+09:00","media":"https://pbs.twimg.com/media/HUhdOLeWIAAq2sE.png","avatar":"https://pbs.twimg.com/profile_images/2084355916749803520/hAwZRUuR_200x200.jpg","metrics":{"views":27565,"likes":398,"reposts":35,"replies":13},"lang":"en","textJa":"Gemini 4 Argon登場！→ https://goo.gle/4yHO5eh\n\n試しに素の2D地図アプリを3Dの世界に変えてみた。デモ映像を見てほしい。\n\n自分でも試すなら、Google AI Ultra契約でGoogle @Antigravity、またはGemini API有料枠で@AndroidStudioから今日から始められる。"},{"id":"2110086457553723692","author":"Keith McCullough","handle":"KeithMcCullough","text":"Short Silver $SLV  continues to print alpha","url":"https://x.com/KeithMcCullough/status/2110086457553723692","createdAt":"2026-10-14T04:13:09+09:00","avatar":"https://pbs.twimg.com/profile_images/1265785627825577984/6y2VxzES_200x200.jpg","metrics":{"views":10349,"likes":34,"reposts":1,"replies":3},"lang":"en","textJa":"シルバーショート $SLV は引き続きアルファを出している"},{"id":"2110014096678510608","author":"Exylos","handle":"exylos_ai","text":"We started out collecting training data for robots. Along the way, the tool we built to check that data turned into something bigger than we planned.\n\nEvery clip we record goes through it. It catches recordings that look fine but break at the one moment that matters, like a cooking video that looks away right when the salt goes in.\nEverything that passes gets labeled, so a robotics team can train on it right away.\n\nNow we’re turning it into a platform that other data vendors can plug into too.\nBuilding it with one of our clients and testing every batch right where the data gets used. \n\nWe'll share more soon about the platform and who we’re building it with.","url":"https://x.com/exylos_ai/status/2110014096678510608","createdAt":"2026-10-13T23:25:37+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110013899311308800/img/nHcJVlBVTAgND-C0.jpg","avatar":"https://pbs.twimg.com/profile_images/2053405994676363270/UJozhSz8_200x200.jpg","metrics":{"views":5704,"likes":49,"reposts":3,"replies":3},"lang":"en","textJa":"もともとはロボット用の学習データを集めていた。そのうち、データ検査用に作ったツールが想定より大きくなった。\n\n撮ったクリップは全部そこを通す。見た目は問題なくても、肝心な一瞬で崩れる録画を拾う。例: 料理動画で塩を入れる瞬間に視線が外れる、など。\n通ったものはラベリングされ、ロボティクスチームがすぐ学習に使える。\n\n今は他のデータベンダーもつなげるプラットフォームにしつつある。"},{"id":"2110087600593895644","author":"Hedgeye","handle":"Hedgeye","text":"\"The best players in the world, the best doctors in the world, the best pianists... have one thing in common. They are focused and deliberate in their study.\" - @KeithMcCullough","url":"https://x.com/Hedgeye/status/2110087600593895644","createdAt":"2026-10-14T04:17:42+09:00","avatar":"https://pbs.twimg.com/profile_images/1075083234260803584/LLWz7WJH_200x200.jpg","metrics":{"views":10151,"likes":30,"reposts":2,"replies":5},"lang":"en","textJa":"「世界一の選手、世界一の医師、世界一のピアニスト……に共通するのは一つ。集中して意図的に学ぶことだ。」— @KeithMcCullough"},{"id":"2110051441692094603","author":"Mike Choi","handle":"guard_if","text":"introducing sidequest: get paid for using claude\n\ninstall the mod \u003e use claude as usual \u003e get paid via @stripe\n\nworks in the Claude Mac app + CLI\nwaitlist is open now","url":"https://x.com/guard_if/status/2110051441692094603","createdAt":"2026-10-14T01:54:01+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110050597323894784/img/6ycoKxhqL9jSybyG.jpg","avatar":"https://pbs.twimg.com/profile_images/2106383995999035392/UO9KyVeP_200x200.jpg","metrics":{"views":51618,"likes":272,"reposts":13,"replies":26},"lang":"en","textJa":"sidequestを紹介: Claudeを使うと報酬がもらえる\n\nmodを入れる → いつも通りClaudeを使う → @stripe経由で受け取る\n\nClaude MacアプリとCLIに対応\nウェイトリスト受付中"},{"id":"2110066314194698675","author":"PyQuant News 🐍","handle":"pyquantnews","text":"Connect Pandas DataFrames to AI in one library:\n\nPandasAI\n\nGrab it on GitHub:","url":"https://x.com/pyquantnews/status/2110066314194698675","createdAt":"2026-10-14T02:53:07+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110066304665145344/img/HahluqHkukoZ0yF8.jpg","avatar":"https://pbs.twimg.com/profile_images/1987009159846678528/fyGKrxQs_200x200.jpg","metrics":{"views":4313,"likes":9,"reposts":2,"replies":3},"lang":"en","textJa":"PandasのDataFrameをAIにつなぐライブラリ1本:\n\nPandasAI\n\nGitHubで入手:"},{"id":"2110264252162519468","author":"H.E. Justin Sun 👨‍🚀 🌞","handle":"justinsuntron","text":"一切才刚刚开始","url":"https://x.com/justinsuntron/status/2110264252162519468","createdAt":"2026-10-14T15:59:39+09:00","avatar":"https://pbs.twimg.com/profile_images/1954484454942298112/gmiMeJRS_200x200.jpg","metrics":{"views":45781,"likes":82,"reposts":9,"replies":56},"lang":"zh","textJa":"すべてはまだ始まったばかりだ"},{"id":"2110043923121045708","author":"Hasan Toor","handle":"hasantoxr","text":"I was wrong. I said agents could never handle design. http://PostNitro.ai just proved me an idiot\n\nFor 2 years my agents could write anything. Captions, scripts, entire newsletters\n\nBut the moment a post needed a carousel or an image, it was back to me. Open Canva, pick a template, fix the fonts, export, upload, schedule. 45 minutes. Every single time\n\nI was convinced that step would never be automated. Design needs taste. Agents don't have taste\n\nThen I connected PostNitro to Claude\n\nOne prompt. \"Turn my latest post into a 6 slide LinkedIn carousel on my brand kit and schedule it for Thursday 9am\"\n\nAbout a minute later it was designed in my fonts, my colors, my logo, and sitting on my calendar\n\nNo Canva. No export. No upload. The agent did the whole chain\n\nAnd the taste? Still mine. I built my templates once. The agent just picks the right one for each platform\n\nIt's an MCP server with 35 tools. Carousels, image posts, video. Publishes natively to LinkedIn, Instagram, TikTok, Threads, Facebook and Pinterest\n\nHere's how I'd set it up:\n\n1. Go to http://claude.ai/directory/postnitro and hit connect. OAuth, no API key\n\n2. Build your brand kit once. Fonts, colors, logo, headshot. Never describe your brand in a prompt again\n\n3. Give it one real post to turn into a carousel. Watch it land on your calendar\n\n4. Don't trust it yet? Ask for drafts instead. Agent designs at 3am, you open the editor, change the headline, hit schedule at 9\n\n5. Running your own agents? On OpenClaw it's npx skills add postnitro/postnitro-agent. On Claude Code it's a plugin. Both drive the CLI end to end with an API key\n\n6. Loop it. Every Monday: plan the week, 3 carousels Mon to Wed at 9am, save as drafts\n\nOnly catch: X is a source and export format, not a publishing destination yet. Export the PDF and post it yourself\n\nI was wrong about design. I'm fine with that. Being wrong and switching fast is how you win\n\nGo set this up tonight\n\nScheduling and agent access start on their Creator+ plan. PH40AGENTS gets you 40% off annual until Oct 23\n\nThey're live on Product Hunt today. Show them some love:\nhttps://www.producthunt.com/products/postnitro/launches/postnitro-for-agents","url":"https://x.com/hasantoxr/status/2110043923121045708","createdAt":"2026-10-14T01:24:08+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110043907077844992/img/kpsiUbFIrHqZlwJ5.jpg","avatar":"https://pbs.twimg.com/profile_images/2100090218191978496/0DP1wMRx_200x200.jpg","metrics":{"views":6564,"likes":14,"reposts":1,"replies":9},"lang":"en","textJa":"自分が間違っていた。エージェントにデザインは無理だと言っていた。http://PostNitro.ai に論破された。\n\n2年間、エージェントは何でも書けた。キャプション、脚本、ニュースレター一式。\n\nでもカルーセルや画像が要る瞬間だけ自分に戻った。Canvaを開き、テンプレ選び、フォント直し、書き出し、アップロード、予約。毎回45分。\n\nその工程は自動化されないと確信していた。デザインにはセンスが要り、エージェントにはセンスがない、と。\n\nそこでPostNitroをClaudeにつないだ。\n\nプロンプト1つで"},{"id":"2110216776759804103","author":"chasm","handle":"chasmmmmmmmmmmm","text":"NOT EVEN THE PLAYSTATION 5 IS SAFE 🚨\n\nSomeone jailbroke a PS5 and got Qwen 3.8 27B running on its GPU at 20 tok/s. That's a real 27B AI model running locally on a games console.\n\nThe same model on the PS5's CPU did about one token a minute.\n\nMeanwhile, DDR4 prices are up 24% in 3 months, AMD just raised GPU memory prices, and 5090s are basically gone.\n\nPS5 coming to a datacenter near you.","url":"https://x.com/chasmmmmmmmmmmm/status/2110216776759804103","createdAt":"2026-10-14T12:51:00+09:00","media":"https://pbs.twimg.com/media/HUj-FC-WcAA1RxP.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2078682555142873088/1tHeLSIs_200x200.jpg","metrics":{"views":108636,"likes":2397,"reposts":222,"replies":68},"lang":"en","textJa":"PlayStation 5ですら例外じゃない 🚨\n\n誰かがPS5をjailbreakし、GPU上でQwen 3.8 27Bを毎秒20トークンで動かした。ゲーム機ローカルで本物の27Bモデルが動いている。\n\n同じモデルをPS5のCPUで動かすと、だいたい1分に1トークン程度だった。\n\n一方でDDR4は3ヶ月で24%値上がり、AMDはGPUメモリ値上げ、5090はほぼ入手困難。\n\nPS5がデータセンターに来る日も近いかも。"}]}]}</script>

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
