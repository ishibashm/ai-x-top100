<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

ころ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-09T20:38:34+09:00","posts":[{"id":"2108376906064187402","author":"コキチーズ","handle":"k2wanko","text":"面接官「それで、AIが書いたコードの品質はどうやって担保・保証するの？」\n\n月3万円使ってない学生\n「えっ……ちゃんと動くか手動で操作して確認します！」\n\n月3万円使ってる学生\n「ChatGPTとClaudeの2系統に別プロンプトでクロスレビューさせ、さらにGrokにコーナーケースの意地悪テストコードを生成させていい感じにします」\n\n月3万円使ってる上に勉強もしている学生\n「AIの出力は『仕様を曲解しがちなジュニアのPR』として扱っています。まずは別モデルの推論にセキュリティやエッジケースの叩き合いをさせた上で、型定義・静的解析・CIの境界値テストで機械的に足切りします。AIの出す答えに依存せず、その上で『ビジネスロジックの不変条件が破綻していないか』を人間が最終レビューしてマージします」","url":"https://x.com/k2wanko/status/2108376906064187402","createdAt":"2026-10-09T11:00:00+09:00","avatar":"https://pbs.twimg.com/profile_images/2004222797099552770/Ynsrrhds_200x200.jpg","metrics":{"views":600568,"likes":2102,"reposts":182,"replies":26},"lang":"ja"},{"id":"2108304437471240255","author":"Mo Elgaraihy","handle":"EngMoElgaraihy","text":"🚨 مطوّر بنى أداة واحدة، وصعد بها إلى المركز الأول على GitHub في يوم واحد! \n\nاسمها REA: Reverse Engineer Anything.\nأداة مفتوحة المصدر، برخصة MIT، تربط وكيل الذكاء الاصطناعي بمجموعة أدوات الهندسة العكسية. ترى ميزة تعجبك في أي تطبيق، حتى من دون كود المصدر، فتطلب من الوكيل أن يفهم كيف تعمل حتى مستوى الملف الثنائي، ويعرض الدليل، ثم يبني نسخة مكيّفة لمشروعك.\n\nتحلّل البرامج الأصلية، وتطبيقات JavaScript وElectron، وتجميعات .NET، والمواقع. والتحليل يجري محلياً على جهازك.\n\nرابط الأداة 🧵👇","url":"https://x.com/EngMoElgaraihy/status/2108304437471240255","createdAt":"2026-10-09T06:12:02+09:00","avatar":"https://pbs.twimg.com/profile_images/1892203225454903296/ONZqfOJK_200x200.jpg","metrics":{"views":48025,"likes":726,"reposts":101,"replies":5},"lang":"ar","textJa":"🚨 ある開発者が作ったツールが、たった1日でGitHubの1位に！\n\n名前はREA（Reverse Engineer Anything）。MITライセンスのオープンソースで、AIエージェントをリバースエンジニアリング用ツール群につなげます。気に入ったアプリの機能があれば、ソースコードがなくてもエージェントにバイナリレベルまで仕組みを解析させ、根拠を示したうえで自分のプロジェクト向けに作り直させられます。\n\nネイティブアプリ、JavaScriptやElectronアプリ、.NETアセンブリ、Webサイトを解析でき、解析はすべて手元のPC上で行われます。\n\nツールのリンクはスレッドで🧵👇"},{"id":"2108452904873132309","author":"Codex研究ラボ","handle":"codexneo4","text":"GPT-6 Astraの自立ループがクソ強力\n👇\n１つのAstraにGitHabリポジトリを　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n一晩渡した途端1日5時間程度の仕事を\n寝てる間に終わらせておいてくれる。\n\n① Serena\n\nhttp://github.com/oraios/serena\n\nまずコードベース全体を解析して、\n\n「Astraが今、本当に読むべきファイル\nSymbol・依存関係」\n\nだけを探し出す。\n\n巨大リポジトリを最初から全部読ませない。\n\nこれだけでContextの無駄遣いをかなり減らせる。\n\n↓\n\n② LangGraph\n\nAstraの作業を\n\n計画 → 編集 → テスト → 失敗 → 修正 → 再テスト\n\nというループで回す。\n\n途中の状態もCheckpointとして保存。\n\n1工程失敗しただけで、最初から全部やり直す必要がない。\n\n↓\n\n③ E2B\n\nAstraがコードを実行する場所。\n\n試行ごとに隔離されたSandboxを作って、\n\n・コード実行\n・依存関係インストール\n・テスト\n・失敗\n・環境破壊\nまで好きにやらせる。\n本番環境や自分のPCを壊さずに、何回でも失敗できる。\n↓\n④ Langfuse\n\nここが地味に重要。\n\n・Prompt\n・Tool Call\n・Trace\n・エラー\n・失敗した工程\n\nを全部記録する。\n\nAstraが変な判断をした時に、\n\n「どの時点から判断がおかしくなったのか」\n\nまで後から追える。\n一番驚いたのは、\n各レイヤーに役割を1つずつ与えた瞬間、Astraがほとんど人間を必要としなくなったこと。\nコードを理解する。\n修正する。\n失敗する。\n原因を調べる。\nもう一度直す。\nテストする。\nこれを一晩中勝手に回せる。\n\nでも最後だけは人間。\n\nProductionへの反映には必ずHuman Approvalを挟む。\n\n今後のAIコーディングは、\n\n「AIにコードを書かせる」\n\nではなく、\n\nAIが安全に失敗し続けられる開発ループを設計する\n\n方が重要になってくる。\nhttps://x.com/0xMovez/status/2105051035987296380/video/1","url":"https://x.com/codexneo4/status/2108452904873132309","createdAt":"2026-10-09T16:02:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2105050767916691456/img/Ddx1qnFNICloKqdI.jpg","avatar":"https://pbs.twimg.com/profile_images/2051958410049191936/2xPvU4Du_200x200.jpg","metrics":{"views":8290,"likes":73,"reposts":4,"replies":1},"lang":"ja"},{"id":"2108258145780793383","author":"Google Cloud","handle":"googlecloud","text":"Knowledge Catalog 🤝 Gemini: Now integrated to help process data accurately from your enterprise databases and apps.\n\nThe Knowledge Catalog maps your business data definitions without re-indexing, so when Gemini reads \"net margin,\" it knows what your company means by that metric → https://goo.gle/4jcIdoI","url":"https://x.com/googlecloud/status/2108258145780793383","createdAt":"2026-10-09T03:08:06+09:00","media":"https://pbs.twimg.com/media/HUIJnBAWIAAV8yQ.jpg","avatar":"https://pbs.twimg.com/profile_images/2047008530478346240/2ZoDIjwe_200x200.jpg","metrics":{"views":10373,"likes":136,"reposts":18,"replies":2},"lang":"en","textJa":"Knowledge Catalog 🤝 Gemini：企業のデータベースやアプリのデータを正確に扱えるよう統合されました。\n\nKnowledge Catalogは再インデックスなしで業務データの定義を対応づけるので、Geminiが「純利益率」を読んだとき、自社でその指標が何を意味するかを理解できます → https://goo.gle/4jcIdoI"},{"id":"2108384074071175431","author":"やま","handle":"yama_threads","text":"【Claudeが1年無料】Claude for Startupsの応募条件と申請方法まとめ\n\n毎月のClaudeの有料プランを個人用のクレジットカードで支払っていませんか？","url":"https://x.com/yama_threads/status/2108384074071175431","createdAt":"2026-10-09T11:28:29+09:00","avatar":"https://pbs.twimg.com/profile_images/2082294784685944832/VNeqoSRj_200x200.jpg","metrics":{"views":3955,"likes":17,"reposts":1,"replies":0}},{"id":"2108369913970925672","author":"Sadao Tokuyama","handle":"tokufxug","text":"コンベア上の食品をAIで自動カウント📦🏭\n\n🔹YOLO26で検出、BoT-SORTで追跡\n🔹ライン通過時にカウントし、追跡IDが途切れた際も再接続\n🔹静止物や誤検出を除外し、リアルタイムで総数を表示\n\n同じ見た目の商品を正しく追跡し続けられるかも重要な課題。\n開発：Areeba Shahid\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2108369913970925672","createdAt":"2026-10-09T10:32:13+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108369878705119232/img/yFO9AXuMczvF6nHT.jpg","avatar":"https://pbs.twimg.com/profile_images/1614135119597686784/8APrdHkh_200x200.png","metrics":{"views":2099,"likes":46,"reposts":4,"replies":4},"lang":"ja"},{"id":"2108188582808797281","author":"marcus","handle":"marcusyul","text":"THIS IS WHAT A SUPPORT TEAM LOOKS LIKE IN 2026\n\nA customer reports that their export stops at 10,000 of 18,400 contacts. And instead of passing the ticket from tool to tool:\n\n→ Support agent replies\n→ Coding agent finds the bug\n→ Docs agent updates the guide\n→ CRM agent prepares the renewal\n\nAll on the same ticket, with the same context: logs, billing, code and previous conversations.\n\nIt's called Helpin. It's open source and you can self-host it.","url":"https://x.com/marcusyul/status/2108188582808797281","createdAt":"2026-10-08T22:31:41+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108188555432566785/img/yjY6G7A_DsNlidgB.jpg","avatar":"https://pbs.twimg.com/profile_images/2055048793670787072/KU39HxsL_200x200.jpg","metrics":{"views":22503,"likes":159,"reposts":15,"replies":26},"lang":"en","textJa":"2026年のサポートチームはこうなる\n\n顧客から「連絡先18,400件のうち1万件でエクスポートが止まる」と報告が来る。チケットをツールからツールへ回す代わりに：\n\n→ サポートエージェントが返信\n→ コーディングエージェントがバグを発見\n→ ドキュメントエージェントがガイドを更新\n→ CRMエージェントが契約更新を準備\n\nすべて同じチケット上で、ログ・請求・コード・過去の会話という同じ文脈を共有して進む。\n\nHelpinというツールで、オープンソースかつセルフホスト可能です。"},{"id":"2108308634727760066","author":"Hanako","handle":"hanakoxbt","text":"Andrej Karpathy (ex-OpenAI, ex-Tesla) just released a prompt that turns Opus 5.5 into a graph that actually finishes any job.\n\nIt's f*cking unreal...\n\nsend it to Opus 5.5, and thank me later. Then read the full guide on Opus 5.5 Graph Engineering.","url":"https://x.com/hanakoxbt/status/2108308634727760066","createdAt":"2026-10-09T06:28:43+09:00","media":"https://pbs.twimg.com/media/HUI2eD6WsAAW0bI.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1942867829016911872/zDosF-7X_200x200.jpg","metrics":{"views":71260,"likes":352,"reposts":37,"replies":10},"lang":"en","textJa":"Andrej Karpathy（元OpenAI、元Tesla）が、Opus 5.5をどんな仕事もやり切る「グラフ」に変えるプロンプトを公開した。\n\nマジでヤバい…\n\nOpus 5.5に送って、あとで感謝して。それからOpus 5.5 Graph Engineeringの完全ガイドを読んで。"},{"id":"2108222014783963539","author":"Google","handle":"Google","text":"Around two thirds of people around the world lack access to diagnostic health tools, like ultrasounds.\n\nWe’re working to change that.\n\nHere’s how ⬇️","url":"https://x.com/Google/status/2108222014783963539","createdAt":"2026-10-09T00:44:31+09:00","media":"https://pbs.twimg.com/media/HUHnHndWsAAGepI.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_200x200.jpg","metrics":{"views":765520,"likes":303,"reposts":60,"replies":50},"lang":"en","textJa":"世界の約3分の2の人が、超音波検査のような診断用の医療ツールを利用できていません。\n\n私たちはそれを変えようとしています。\n\nその方法はこちら⬇️"},{"id":"2108224522620948678","author":"Kuzeyin Öncüsü","handle":"kuzeyinoncusu","text":"#SONDAKİKA\n\nElon Musk\n\nKalan süre, en fazla 3 yıl.\n\nBu süre zarfında, hâlâ \"insanların çalışması\" ile para kazanmak mümkün.\n\nAma ondan sonra,\n\nŞimdiye kadar maaş ödenen işlerin çoğu\notomatikleşecek. Para kazanma işi bitecek\n\n\"İnsanlara para ödemenin anlamı\" ortadan kalkacak.\n\nSon 200 yıldır devam eden bu sistem👇\n\n\"40 yıl boyunca zamanını ödünç verirsen maaş öderiz\"\nBu bitecek... Çalışmak bitecek\n\nYani, tarihin en büyük ölçekli \"para hareketi\" gerçekleşecek.\n\nŞimdi durum ne?\n\n👉Bazı insanlar farkına vardı ve harekete geçti\n\n👉Pek çok insan \"haberlerde açıkça belirtilene kadar bekliyor\"\n\nBu \"farkına varma arasındaki zaman farkı\" her şey.\n\nPeki, bu 3 yılda yapılması gereken ne?\n\nÇok Basit👇\n\n\"Kendi zamanını, makinelerin elinden alamayacağı bir varlığa dönüştürmek\"\n\nSomut olarak şunlar👇\n\n• Bitcoin gibi nadir dijital varlıklar\n• Arsa veya enerji gibi gerçek varlıklar\n• Bilgisayarlar veya altyapı\n• İnsanlarla bağlantılar (ağ)\n• Gıda veya yaşam için gerekli şeyleri üretme gucu\n\nZaten maaş ne ki???\n\n\"Sadece kendi zamanını ödünç vermiş\nolmak\"\n\nEğer o zamanın değeri,\nMakineler daha ucuz ve daha üstün hale gelirse...\n\n- O değer birden çökecek\n\nSonunda kalacak tek şey bu 👇\n\"Ne sahip olduğun (varlık)\"\n\nBu 3 yılda👇\n\n\"Maaş alan kişi\"den\n\"Varlık sahibi kişi\"ye dönüşebilenler\n\n2035-2036 yıllarında\n\"Geleceği gören kişi\" olacak.\n\nBundan sonra👇\n\n• Maaşlar artmayacak\nSonunda önemsiz hale gelecek\n\nKalan tek şey bir tane👇\n\n\"Kim neye sahip\"\n\nFırsatın kapısı şu anda açık.\nAma herkesin düşündüğünden daha hızlı kapanıyor.","url":"https://x.com/kuzeyinoncusu/status/2108224522620948678","createdAt":"2026-10-09T00:54:29+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108224474868838401/img/w8QVpTL84lI9Q9z8.jpg","avatar":"https://pbs.twimg.com/profile_images/1877489576593264640/eB0lpaV1_200x200.jpg","metrics":{"views":2974068,"likes":8349,"reposts":1465,"replies":512},"lang":"tr","textJa":"#速報\n\nイーロン・マスク\n\n残り時間は最長3年。\n\nこの間はまだ「人が働くこと」でお金を稼げる。だがその後は、給料が払われてきた仕事の多くが自動化され、稼ぐという行為が終わり、「人にお金を払う意味」がなくなる。\n\n200年続いた「40年間時間を貸せば給料を払う」という仕組みが終わる――。\n\n今気づいて動いている人と、ニュースで明言されるまで待つ人の「気づきの時間差」がすべて。この3年でやるべきは「自分の時間を、機械に奪われない資産に変えること」。具体的にはビットコインのような希少なデジタル資産、土地やエネルギーなどの実物資産、コンピューターやインフラ、人とのつながり、食料や生活必需品を生み出す力。\n\n給料は結局「自分の時間を貸しただけ」。機械がより安く優秀になれば、その価値は急落し、最後に残るのは「何を持っているか」だけ。この3年で「給料をもらう人」から「資産を持つ人」に変われた人が、2035〜36年に「未来が見えていた人」になる。チャンスの扉は今開いているが、皆が思うより速く閉じつつある。"},{"id":"2108517833093038170","author":"月詠〜ツクヨミ〜","handle":"tsukuyomi2021","text":"「モンスター☆ライダー」\n\nVidu Q4 Previewで制作✨\n\nQ4の良いところは、とにかく動きが自然＆高画質で出力出来る事ですね。\n\nしかも、意外と容量食いません。実際、この動画は20MBくらいです。\n\n⬇Viduのリンクと招待コード：VIDUQ4CPP\n\nhttps://www.vidu.com/login?invite_code=VIDUQ4CPP\u0026utm_medium=cppcode\u0026utm_campaign=ViduQ4CPP_en\u0026utm_source=chatgpt.com\n\n#Vidu #ViduCPP #ViduQ4Preview","url":"https://x.com/tsukuyomi2021/status/2108517833093038170","createdAt":"2026-10-09T20:20:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108264042754453504/img/2BnlVdg2YTUhFoY6.jpg","avatar":"https://pbs.twimg.com/profile_images/1737837412146143234/wWnM0g8B_200x200.jpg","metrics":{"views":358,"likes":22,"reposts":4,"replies":1},"lang":"ja"},{"id":"2108351115767284195","author":"Pratham","handle":"Prathkum","text":"Going to the Claude Founder House on day three was a smart move, I guess. Got through in like 10 minutes.","url":"https://x.com/Prathkum/status/2108351115767284195","createdAt":"2026-10-09T09:17:31+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108351003359916032/img/VzHoJjG6fyiGxQnl.jpg","avatar":"https://pbs.twimg.com/profile_images/1965842512221982720/NjuSrsay_200x200.jpg","metrics":{"views":8490,"likes":29,"reposts":0,"replies":3},"lang":"en","textJa":"Claude Founder Houseに3日目に行ったのは賢い判断だったと思う。10分くらいで入れた。"},{"id":"2108266929203155367","author":"Elon Musk","handle":"elonmusk","text":"This is why","url":"https://x.com/elonmusk/status/2108266929203155367","createdAt":"2026-10-09T03:43:00+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":1320421,"likes":5677,"reposts":1034,"replies":968},"lang":"en","textJa":"これが理由だ"},{"id":"2108278336178847921","author":"Keith McCullough","handle":"KeithMcCullough","text":"I came into this with 1 Long in Real-Time Alerts = $ETHA \n\nI'll contemplate a return to the bottle tonight","url":"https://x.com/KeithMcCullough/status/2108278336178847921","createdAt":"2026-10-09T04:28:19+09:00","avatar":"https://pbs.twimg.com/profile_images/1265785627825577984/6y2VxzES_200x200.jpg","metrics":{"views":9441,"likes":37,"reposts":3,"replies":19},"lang":"en","textJa":"リアルタイムアラートではロング1銘柄（$ETHA）だけで臨んだ。\n\n今夜は酒に戻るか考えるとしよう"},{"id":"2108440200817025407","author":"启明破晓","handle":"hiwise_aigc","text":"牛逼啊，还真可以！\n\n白嫖 Qwen/Qwen3.8-27B 不限制使用\n\n打开工具 输入命令 ssh https://chat.hf.co 直接进入\n\n不用下载任何工具，不用配置任何key","url":"https://x.com/hiwise_aigc/status/2108440200817025407","createdAt":"2026-10-09T15:11:31+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108440111797145601/img/RF4GZMKCDpwLD0t0.jpg","avatar":"https://pbs.twimg.com/profile_images/2066589290709344256/34r1KENi_200x200.jpg","metrics":{"views":25068,"likes":208,"reposts":17,"replies":25},"lang":"zh","textJa":"すごい、本当にできた！\n\nQwen/Qwen3.8-27Bを無料・無制限で使える。\n\nターミナルを開いて ssh https://chat.hf.co と入力するだけで入れる。\n\nツールのダウンロードもキーの設定も不要。"},{"id":"2108203997480063196","author":"Ryan Sael","handle":"RyanSael","text":"Everything in this city is procedural and endless.\nRunning in a browser. WebGPU. https://sael.net/gigacity\n\n100% code (by Opus 5.5)","url":"https://x.com/RyanSael/status/2108203997480063196","createdAt":"2026-10-08T23:32:56+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108201935836995584/img/ilrmtAJuFrD5JVyL.jpg","avatar":"https://pbs.twimg.com/profile_images/2070153731409350656/Q2dbbhA3_200x200.jpg","metrics":{"views":548213,"likes":9709,"reposts":748,"replies":190},"lang":"en","textJa":"この街のすべてはプロシージャル生成で、どこまでも続く。\nブラウザ上でWebGPUで動作。https://sael.net/gigacity\n\n100%コード（Opus 5.5製）"},{"id":"2108238080994132175","author":"Aleksander Obuchowski","handle":"AlexObuchowski","text":"Today we introduce MedDecider - an open weight family of Jev style decision models for medicine. \nMedDecider achieves SOTA results on variety of medical tasks including knowledge questions, ICD codes, trial notes.\n9B scores higher than Decider from Perplexity that is 3 times larger.","url":"https://x.com/AlexObuchowski/status/2108238080994132175","createdAt":"2026-10-09T01:48:22+09:00","media":"https://pbs.twimg.com/media/HUH1_b7bQAAR2JN.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1729164221848383488/lOyQo2hS_200x200.jpg","metrics":{"views":86831,"likes":852,"reposts":101,"replies":38},"lang":"en","textJa":"本日、医療向けのJev型意思決定モデルのオープンウェイトファミリー「MedDecider」を発表します。\nMedDeciderは知識問題、ICDコード、治験ノートなど多様な医療タスクでSOTAを達成。\n9B版は、3倍の規模を持つPerplexityのDeciderを上回るスコアです。"},{"id":"2108372627882680572","author":"Tech Logic","handle":"The_techAI","text":"50 legendary websites that feel like the internet’s hidden toolbox 🧰\n\n1. http://unpaywall.org — free research papers\n2. http://sci-hub.se — papers when unpaywall misses\n3. http://openlibrary.org — borrow books\n4. http://gutenberg.org — 70k+ free books\n5. http://coursera.org — audit university courses free\n6. http://wolframalpha.com — step-by-step math\n7. http://remove.bg — background removal\n8. http://cleanup.pictures — object removal\n9. http://tinywow.com — quick file tools\n10. http://ilovepdf.com — PDF merge/split\n11. http://photopea.com — free Photoshop alternative\n12. http://squoosh.app — image compression\n13. http://excalidraw.com — fast diagrams\n14. http://carbon.now.sh — beautiful code screenshots\n15. http://regex101.com — test regex\n16. http://jsonformatter.org — clean JSON\n17. http://explainshell.com — terminal commands explained\n18. http://alternativeto.net — software alternatives\n19. http://haveibeenpwned.com — breach check\n20. http://10minutemail.com — temp email\n21. http://privnote.com — self-destruct notes\n22. http://radio.garden — live global radio\n23. http://endel.io — focus sound\n24. http://mynoise.net — custom ambient\n25. http://justwatch.com — where to stream\n26. http://archive.org — digital library\n27. http://web.archive.org — old web pages\n28. http://similarweb.com — site traffic\n29. downtimerobot — uptime check\n30. http://pagespeed.web.dev — speed test\n31. http://tinypng.com — compress images\n32. http://cloudconvert.com — file conversion\n33. http://diffchecker.com — compare text\n34. http://temp-mail.org — disposable inbox\n35. http://obfuscator.io — JS obfuscate\n36. http://keybr.com — typing practice\n37. http://monkeytype.com — typing test\n38. http://ankiweb.net — spaced repetition\n39. http://notion.so — all-in-one notes\n40. obsidian.md — local knowledge base\n41. http://raindrop.io — bookmark manager\n42. http://todoist.com — task list\n43. http://trello.com — boards\n44. http://miro.com — whiteboard\n45. http://figma.com — design\n46. http://canva.com — quick graphics\n47. http://remove.bg — again because it's that good\n48. yt-dlp — video download (open source)\n49. http://handbrake.fr — video compress\n50. http://localsend.org — local file transfer\n\nSave this. You’ll definitely need some of these later. 🔖\nFollow @The_techAI for more useful websites, AI tools \u0026 tech resources.","url":"https://x.com/The_techAI/status/2108372627882680572","createdAt":"2026-10-09T10:43:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108372582198345728/img/l1cNfJiDV0iQPnAB.jpg","avatar":"https://pbs.twimg.com/profile_images/2094060193726500864/KChjUhVa_200x200.jpg","metrics":{"views":7001,"likes":161,"reposts":67,"replies":23},"lang":"en","textJa":"インターネットの隠れた道具箱のような伝説的サイト50選 🧰\n\n1. http://unpaywall.org — 無料で研究論文\n2. http://sci-hub.se — unpaywallで見つからない論文\n3. http://openlibrary.org — 本を借りる\n4. http://gutenberg.org — 7万冊以上の無料書籍\n5. http://coursera.org — 大学講座を無料聴講\n6. http://wolframalpha.com — 数学を段階的に解説\n7. http://remove.bg — 背景除去\n8. http://cleanup.pictures — 物体除去\n9. http://tinywow.com — 手軽なファイルツール\n10. http://ilovepdf.com — PDFの結合・分割\n11. http://photopea.com — 無料のPhotoshop代替\n12. http://squoosh.app — 画像圧縮\n13. http://excalidraw.com — 素早く図を描く\n14. http://carbon.now.sh — 美しいコードのスクショ\n15. http://regex101.com — 正規表現テスト\n16. http://jsonformatter.org — JSON整形\n17. http://explainshell.com — ターミナルコマンド解説\n18. http://alternativeto.net — ソフトの代替を探す\n19. http://haveibeenpwned.com — 情報漏えいチェック\n20. http://10minutemail.com — 使い捨てメール\n…（以下、50. http://localsend.org — ローカルでのファイル転送 まで続く）\n\n保存しておこう。きっと後で役立つ 🔖\nほかの便利サイトやAIツールは @The_techAI をフォロー。"},{"id":"2108272088582676627","author":"Elon Musk","handle":"elonmusk","text":"Grok @Bot works well on your phone. Just download the app from Apple or Android. \n\nhttps://apps.apple.com/app/id6794501026","url":"https://x.com/elonmusk/status/2108272088582676627","createdAt":"2026-10-09T04:03:30+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":2914610,"likes":7180,"reposts":787,"replies":762},"lang":"en","textJa":"Grok @Bot はスマホでもよく動く。AppleかAndroidのストアからアプリをダウンロードしよう。\n\nhttps://apps.apple.com/app/id6794501026"},{"id":"2108360050893021428","author":"爱吃折耳根的Ace","handle":"_zheergen","text":"好家伙！TradingView 里那些不公开在官方脚本库里的 Pine Script，有人专门整理成了一个开源仓库\n\nPineScript，450+ Stars，MPL-2.0 开源，一套偏 ICT、动量交易和 Screener 的指标源码合集。\n\n平时你在 TradingView 看到 FVG、Liquidity Sweep、Order Block、Market Structure 这些指标，很多只能看结果，很难知道背后到底怎么算。\n\n这个仓库不一样，源码直接摆出来，复制进 Pine Editor 就能跑，还能继续拆逻辑、改参数、做自己的版本。\n\n核心能力：\n\n1️⃣ ICT 工具：FVG、Liquidity Sweep、MSS、Mitigation Block、Equal Highs / Lows 都有\n\n2️⃣ 自带 Scanner：FVG、Order Block Retracement、Market Profile 可以直接拿来扫图\n\n3️⃣ 动量策略：RSI Directional Momentum、Momentum Investing、Option Scalping 都有现成脚本\n\n4️⃣ 趋势策略：包括 Sideways Market Skipper 等趋势跟随和震荡过滤思路\n\n5️⃣ Market Profile：除了普通指标，还有 Market Profile + Screener 这种偏实战的工具\n\n6️⃣ 源码全部可看：不是黑箱信号，计算逻辑和触发条件都能自己研究和修改\n\n我觉得它最适合的用法，不是照搬某个信号去交易。\n\n而是看到一个好指标以后，直接去看它的 Pine Script 到底怎么写，再拆成自己的交易逻辑。\n\n对于 TradingView、Pine Script、ICT 或技术指标研究的人，这种源码库比单纯收藏指标更有价值。\n\nGitHub：\nhttps://github.com/ArunKBhaskar/PineScript","url":"https://x.com/_zheergen/status/2108360050893021428","createdAt":"2026-10-09T09:53:02+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108359610486935552/img/pTkshQ1hHMRRPo8g.jpg","avatar":"https://pbs.twimg.com/profile_images/2064687043737997312/raEeQhOb_200x200.jpg","metrics":{"views":11546,"likes":103,"reposts":31,"replies":5},"lang":"zh","textJa":"これはすごい！TradingViewの公式スクリプトライブラリに公開されていないPine Scriptを、オープンソースのリポジトリにまとめた人がいる。\n\nPineScript（450+スター、MPL-2.0）は、ICT・モメンタム取引・スクリーナー寄りの指標ソース集。FVG、Liquidity Sweep、Order Block、Market Structureなど、普段は結果しか見えない指標の計算方法がわかり、Pine Editorにコピーすればそのまま動き、ロジック分解やパラメータ変更もできる。\n\n主な内容：ICTツール、FVGやOrder Blockのスキャナー、RSIなどのモメンタム戦略、レンジ相場を避けるトレンド戦略、Market Profile＋スクリーナー、そして全ソースが閲覧・改変可能。\n\nおすすめの使い方は、シグナルをそのまま真似ることではなく、良い指標のPine Scriptの書き方を見て自分の売買ロジックに落とし込むこと。\n\nGitHub：\nhttps://github.com/ArunKBhaskar/PineScript"},{"id":"2108394604886450524","author":"connect24h","handle":"connect24h","text":"CSIRT関係者各位。AI自律ペンテストの ARTEX（Autumn-27/ARTEX）が本家ごと削除されましたが、AGPL-3.0なので実質復元可能な状態が残ってました。取り損ねた人はちゃんと取得しておきましょう。敵の手段知るの超重要。\n\n・Hinln/ARTEX が v0.3.15時点のコミット履歴とライセンスを保持したバックアップを公開\n・Software Heritage が削除前(10/7)に status:full でスナップショット取得済み\n・韓国語版/英語UI版など upstream明記のforkも生存確認済\n\nAGPLのコピーレフトは「消す自由」まで保証しない、という実例ですね。消える前に手元にcloneしておくかどうかは、ライセンスより運用の問題です。\nhttps://github.com/Hinln/ARTEX","url":"https://x.com/connect24h/status/2108394604886450524","createdAt":"2026-10-09T12:10:20+09:00","avatar":"https://pbs.twimg.com/profile_images/1507992429/WS000026_200x200.PNG","metrics":{"views":24255,"likes":319,"reposts":50,"replies":1},"lang":"ja"},{"id":"2108494675950866646","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"One AI model can't be the best at everything.\n\nBuilders are now running teams of Claude Opus 5.5, Sonnet 5.5, GPT-6 Astra and Jev, each doing the job it's best at.\n\nHere's how to build your first multi-model team from scratch. https://x.com/i/article/2108204403576455168\n\nHow to Build a Multi-Model Team of AI Agents in 2026\n\nYou are using one model for everything.\nSave it :)\nYour most expensive model is sorting emails.\nYour cheapest model is writing your strategy.\nWhen your one provider has a bad afternoon, so does your","url":"https://x.com/eng_khairallah1/status/2108494675950866646","createdAt":"2026-10-09T18:47:59+09:00","media":"https://pbs.twimg.com/media/HUJLZDjbwAArA7u.jpg","avatar":"https://pbs.twimg.com/profile_images/1888357542004162560/5D-YlH5e_200x200.jpg","metrics":{"views":1291,"likes":19,"reposts":4,"replies":8},"lang":"en","textJa":"1つのAIモデルがすべてで最強にはなれない。\n\nビルダーたちは今、Claude Opus 5.5、Sonnet 5.5、GPT-6 Astra、Jevをチームとして動かし、それぞれ得意な仕事を任せている。\n\nゼロから初めてのマルチモデルチームを作る方法はこちら。https://x.com/i/article/2108204403576455168\n\n2026年版：AIエージェントのマルチモデルチームの作り方\n\nあなたはすべてに1つのモデルを使っている。\n保存してね :)\n一番高いモデルがメールの仕分けをし、一番安いモデルが戦略を書いている。\n頼っている1社の調子が悪い日は、あなたの…"},{"id":"2108211097119367412","author":"GoogleArabia","handle":"GoogleArabia","text":"🎮 افتح لڤل جديد في دراستك! 🕹️\n\nسنة كاملة مجاناً من Google AI Plus متوفرة الآن لجميع طلاب الجامعات في الوطن العربي!\n\nاشتركوا قبل ٣١ ديسمبر ولا تفوّتوا مزايا Google AI Plus الحصرية \n\n* وصول شامل لنموذج Gemini 3.1 Pro وميزة \"Deep Research\".\n* إمكانيات أكبر لتوليد الصور، والموسيقى، والفيديو (بما فيها Gemini Omni).\n* صلاحيات أكثر لاستخدام الميزات والنماذج في دفاتر الملاحظات.\n* مساحة تخزين سحابية بسعة 400 جيجابايت (تشمل Drive وGmail والصور).\n\nسجل الآن من هنا 👈🏻 http://goo.gle/menastudents2026","url":"https://x.com/GoogleArabia/status/2108211097119367412","createdAt":"2026-10-09T00:01:08+09:00","media":"https://pbs.twimg.com/media/HUHe0cYXIAA177Y.jpg","avatar":"https://pbs.twimg.com/profile_images/638947636892962816/5Pu305Lz_200x200.png","metrics":{"views":21783,"likes":66,"reposts":13,"replies":4},"lang":"ar","textJa":"🎮 勉強に新しいレベルを！🕹️\n\nアラブ地域のすべての大学生に、Google AI Plusが1年間無料！\n\n12月31日までに登録して、Google AI Plusの特典を逃さないで\n\n* Gemini 3.1 Proと「Deep Research」をフル活用\n* 画像・音楽・動画（Gemini Omniを含む）の生成枠を拡大\n* ノートブックでの機能・モデル利用枠を拡大\n* 400GBのクラウドストレージ（Drive、Gmail、フォト）\n\n登録はこちら 👈🏻 http://goo.gle/menastudents2026"},{"id":"2108227297178259568","author":"José Siles | AI | Data","handle":"josesilesdata","text":"La IA se está yendo de las manos...\n\nSegún se informa, un estudiante de 20 años en China construyó un radar de velocidad con IA usando Claude.\n\n9 días. \nUna cámara vieja. \n20$ en llamadas a la API.\n\nY después, se lo vendió a un distrito de una ciudad por 317.000$.","url":"https://x.com/josesilesdata/status/2108227297178259568","createdAt":"2026-10-09T01:05:31+09:00","media":"https://pbs.twimg.com/ext_tw_video_thumb/2108227274356965376/pu/img/MWEw_r2lNnxRO1GZ.jpg","avatar":"https://pbs.twimg.com/profile_images/2021598903444078592/TQyIwxuo_200x200.jpg","metrics":{"views":139145,"likes":333,"reposts":27,"replies":37},"lang":"es","textJa":"AIが手に負えなくなってきている…\n\n報道によると、中国の20歳の学生がClaudeを使ってAIスピード違反監視レーダーを作った。\n\n9日間。\n古いカメラ1台。\nAPI利用料20ドル。\n\nそしてそれを市の地区に31万7,000ドルで売った。"},{"id":"2108250319368954328","author":"unusual_whales","handle":"unusual_whales","text":"Nvidia, $NVDA, has committed  $1 billion to US science research that would focus on “super intelligence” and quantum computing.","url":"https://x.com/unusual_whales/status/2108250319368954328","createdAt":"2026-10-09T02:37:00+09:00","avatar":"https://pbs.twimg.com/profile_images/1714107328134516736/dLZGJPm7_200x200.png","metrics":{"views":147546,"likes":557,"reposts":35,"replies":59},"lang":"en","textJa":"Nvidia（$NVDA）が、「超知能」と量子コンピューティングに焦点を当てた米国の科学研究に10億ドルを拠出すると表明した。"},{"id":"2108121268004536474","author":"Hux","handle":"huxlab","text":"Alexandr Wang 在谈到“如何拉开与 99% 人的差距”时，给出了极其朴素甚至残酷的答案：\n\n顶层竞争根本不拼智商，拼的是极端执行力的非对称倾斜。\n\n他的三条核心准则：\n\n1. 绝对聚焦，压榨认知带宽： 绝大多数人的忙碌只是“低密度伪勤奋”。真正的专注是把全部精力砸在唯一的核心支点上，拒绝任何无关干扰。\n\n2. 把“过度交付”做成护城河： 行业标准要求走 1 英里，你就走完 10 英里。当所有人都按合同完成 100% 时，常态化交付 200% 的人会直接卷走全部声誉与溢价。\n\n3. 带靶向的超额输出，拒绝无目的内耗： 努力不是盲目自我感动，而是针对具体目标的持续过载测试。把每一次交付都当成生死决战来打。\n\n商业世界最公平的一点在于：\n\n聪明人到处都是，但能忍受极度枯燥并长期超额交付的人凤毛麟角。\n\n执行力溢出，就是最暴力的护城河。 https://x.com/XAngus/status/2107970475968389595/video/1","url":"https://x.com/huxlab/status/2108121268004536474","createdAt":"2026-10-08T18:04:11+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107879648650772480/img/sUrPxu4Mfng6ovth.jpg","avatar":"https://pbs.twimg.com/profile_images/2073032972291469312/RNTIcS9R_200x200.jpg","metrics":{"views":566907,"likes":6883,"reposts":1178,"replies":130},"lang":"zh","textJa":"Alexandr Wangは「99%の人と差をつけるには」という問いに、極めて素朴で残酷とも言える答えを出した。\n\nトップ層の競争はIQではなく、極端な実行力をどこに偏らせるかで決まる。\n\n3つの原則：\n\n1. 徹底的に絞り込み、認知の帯域を一点に注ぐ。多くの人の忙しさは「密度の低い見せかけの努力」にすぎない。\n\n2. 「期待以上の成果」を堀にする。業界標準が1マイルなら10マイル走る。皆が100%で済ませる中、常に200%を出す人が評判と対価を総取りする。\n\n3. 目的のある過剰なアウトプットを。努力は自己満足ではなく、具体的な目標に向けた継続的な負荷テストだ。\n\n賢い人はどこにでもいるが、極度の退屈に耐えて長期的に期待以上を出し続けられる人はごくわずか。実行力の差こそ最強の堀だ。 https://x.com/XAngus/status/2107970475968389595/video/1"},{"id":"2108392184634548376","author":"逆瀬川","handle":"gyakuse","text":"ggmlを使った音声合成・音声認識エンジン\nspeech.cpp を作りました！\nIrodori-TTSやQwen3-TTS/ASRやReazonSpeech NeMo v2などに対応し、Mac / Windows / Linuxで動きます。とくにIrodori-TTSは爆速です。\nどう作っていったか記事にまとめたので、ぜひ読んでみてください！\nhttps://nyosegawa.com/posts/speech-cpp/","url":"https://x.com/gyakuse/status/2108392184634548376","createdAt":"2026-10-09T12:00:43+09:00","avatar":"https://pbs.twimg.com/profile_images/1581851742404112384/2_5YfJOO_200x200.jpg","metrics":{"views":14172,"likes":273,"reposts":58,"replies":3},"lang":"ja"},{"id":"2108264528396116204","author":"First Round","handle":"firstround","text":"What it's like working at @maticrobots: Build your own desk, then start making robots.","url":"https://x.com/firstround/status/2108264528396116204","createdAt":"2026-10-09T03:33:27+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108264117341736961/img/BKiVIvgP2m7eoaKg.jpg","avatar":"https://pbs.twimg.com/profile_images/1902087392951189504/a_J_NWF1_200x200.png","metrics":{"views":4596,"likes":13,"reposts":4,"replies":4},"lang":"en","textJa":"@maticrobots で働くとはこういうこと：まず自分の机を組み立て、それからロボット作りを始める。"},{"id":"2108286767900086672","author":"freeCodeCamp.org","handle":"freeCodeCamp","text":"The Lazygit tool is a wrapper for the Git command line that replaces it with a user interface.\n\nAnd it has a ton of shortcuts you can use to commit, push, pull, create, edit, \u0026 delete branches in your project. \n\nHere, @Official_R_deep walks you through using Lazygit to improve your Git workflow.\n\nhttps://www.freecodecamp.org/news/how-to-use-lazygit-to-improve-your-git-workflow/","url":"https://x.com/freeCodeCamp/status/2108286767900086672","createdAt":"2026-10-09T05:01:50+09:00","media":"https://pbs.twimg.com/media/HUIjpHgWEAAPevb.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1276770212927410176/qTgTIejk_200x200.jpg","metrics":{"views":18709,"likes":261,"reposts":22,"replies":3},"lang":"en","textJa":"Lazygitは、Gitのコマンドラインを操作画面（UI）で置き換えるラッパーツールです。\n\nコミット、プッシュ、プル、ブランチの作成・編集・削除などに使えるショートカットが豊富にあります。\n\n@Official_R_deep が、Lazygitを使ってGitの作業を効率化する方法を解説しています。\n\nhttps://www.freecodecamp.org/news/how-to-use-lazygit-to-improve-your-git-workflow/"},{"id":"2108248562244976891","author":"Google Earth","handle":"googleearth","text":"See how steep a lot gets and how much dirt has to move before you price the grading: https://goo.gle/4y7vtTW\n\nOutline a parcel in Google Earth to map slope down to 1-meter resolution, then run cut and fill to check the excavation and fill volumes needed to level the site from your desk.","url":"https://x.com/googleearth/status/2108248562244976891","createdAt":"2026-10-09T02:30:01+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108218403693502465/img/kBhc6ryrml0L9yOc.jpg","avatar":"https://pbs.twimg.com/profile_images/854272241449799680/e_NsMovl_200x200.jpg","metrics":{"views":29699,"likes":182,"reposts":27,"replies":2},"lang":"en","textJa":"造成費を見積もる前に、土地の傾斜と動かす土の量を確認しよう：https://goo.gle/4y7vtTW\n\nGoogle Earthで区画を囲むと1メートル解像度で傾斜を表示でき、切土・盛土の計算で整地に必要な掘削量と盛土量を机の上から確認できます。"}]}]}</script>

 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
