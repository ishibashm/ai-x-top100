 in the post below ↓","url":"https://x.com/merccante/status/2115472242884641121","createdAt":"2026-10-28T15:54:20Z","metrics":{"views":47130,"likes":254},"lang":"en"},{"id":"2115398174659825862","author":"木内翔大＠SHIFT AI代表「日本をAI先進国に」𝕏","handle":"shota7180","text":"GeminiのチャットからGemini Notebookを直接操作できる新機能。記事を参考に、EC広告データの分析からNotebooKへの保存、資料作成まで試してみました↓ https://t.co/VwAfoTEf3T","url":"https://x.com/shota7180/status/2115398174659825862","createdAt":"2026-10-28T11:00:01Z","metrics":{"views":10246,"likes":60},"lang":"ja"},{"id":"2115730582240198908","author":"AI駆動経営ラボ","handle":"yoshio_nocode","text":"CloudflareOSの仕組みを転用し、\n自作のAI駆動経営ハーネスに\n『アプリ作成\u0026共有基盤』を導入。\n\nAI駆動経営は、\n目標\u0026プロジェクト管理レイヤーをメインとして、\n自社専用の業務アプリ基盤も必須。\n\nタスクや判断はプロジェクト管理で回し、\n日々の業務は既存のSaaSや自社専用のアプリで回す。\n\nOSSでコードを参照させて作ったので、\n手戻りも少なく作れた。\n\nゼロから考えさせるより、\nイケてるOSSを読ませて転用させる。\n\nAIに作らせるときの一番の近道はこれだと思う","url":"https://x.com/yoshio_nocode/status/2115730582240198908","createdAt":"2026-10-29T09:00:53Z","metrics":{"views":734,"likes":11},"lang":"ja"},{"id":"2115685000645640468","author":"StudioYebisu","handle":"studio_yebisu","text":"動画からモザイクを検出し、その箇所をMinimaxH3で再描画することで擬似的にモザイクを外すっていうジョークアプリを作ってたんですけど。\n\nより上位のOSSを観測してしまったので、リプにて供養します。\n\n一応私の環境ではそれなりにちゃんと動作しますけど、\nふてくされたので保守もしませんし、issueもPRも受け付けません!!!! 無効化してます!!!\n\n使いたい人はAIにURLぶん投げて自分でいじくったらええやん!!!","url":"https://x.com/studio_yebisu/status/2115685000645640468","createdAt":"2026-10-29T05:59:46Z","metrics":{"views":24998,"likes":279},"lang":"ja"},{"id":"2115589933297709171","author":"Claude Code Studio","handle":"ClaudeCode_love","text":"【海外で話題】\nClaude Codeの会話と書きかけのコードを、\nそのまま同僚に渡せるプラグインを、エディタZedの開発チームが公開😳\nhttps://t.co/MG6eJ6z8DQ\nその名も\nーーーDelta！\n引き継ぎのたびに経緯を説明し直してる人、これ刺さる👇\n・/delta share でリンクを作って送るだけ。相手は自分のClaude Codeで /delta join のあとにリンクを貼れば入れる\n・Claudeとのやり取り、ツールの実行結果、コミット前の変更まで丸ごと共有される\n・相手は自分のClaudeで続きを進められる。それまでの会話がそのまま文脈として渡る\n・夕方に閉じたノートPCの作業を、時差のある同僚が朝そのまま拾える\n❌ 経緯を文章にまとめ直し、途中のコードをコミットしてから渡す\n⭕ リンク1つで、会話ごと途中から一緒に進める\n\n公開されたばかりのベータ版で、最初にDeltaへのサインインが要る。試す前に、Claude Codeのプラグインの入れ方と選び方を押さえておくと迷わない。\nClaude Codeプラグインを9,000件から36個に絞った記事はこちら👇","url":"https://x.com/ClaudeCode_love/status/2115589933297709171","createdAt":"2026-10-28T23:42:00Z","metrics":{"views":3065,"likes":10},"lang":"ja"},{"id":"2115591441942528445","author":"星野創吉","handle":"Sokichi_Hoshino","text":"間違いなく、半年で仕事の仕方が大きく変わります。 https://t.co/GqpyGovL36","url":"https://x.com/Sokichi_Hoshino/status/2115591441942528445","createdAt":"2026-10-28T23:48:00Z","metrics":{"views":1139,"likes":5},"lang":"ja"},{"id":"2115744426295464445","author":"Kanika","handle":"KanikaBK","text":"Elon's \"Hire Grok @Bot\" post has passed 45M views.\n\nBut nobody's talking about the part that makes it work.\n\nIt's not the prompt.\nIt's the job description.\n\nA prompt is one task.\nA job description is how it works every day:\n→ what it owns\n→ what good looks like\n→ what it never does\n→ when it stops and asks you\n\nThen a routine makes it show up on its own.\nIt runs in the cloud, even with your laptop shut.\n\nThat's the difference between \"AI is overhyped\" and \"how did I live without this\".\n\nFull blueprint in the Article.","url":"https://x.com/KanikaBK/status/2115744426295464445","createdAt":"2026-10-29T09:55:54Z","metrics":{"views":284,"likes":5},"lang":"en"},{"id":"2115418146156736697","author":"kiosa","handle":"thegreatest_sv","text":"I truly don't f*cking understand why designers aren't scared of losing their jobs\n\nGraphify just crossed 137k stars on GitHub and got into Y Combinator. it gives your agent a real graph memory.\n\nthe idea is simple: one folder, a few plugins, and Claude starts working for you. it remembers, reads your email, uses the web, and asks before anything risky.\n\nfounder, marketer, student, freelancer, whoever. if you have more tabs open than hours in the day, steal this:\n\nstep 1: the office\nmake a folder called AGENT, open Claude Code in it, write a CLAUDE.md with one line: \"log every decision, person and project to memory/\"\n\nstep 2: the memory\nuv tool install graphifyy, then graphify install, then /graphify .\nyour whole folder turns into a knowledge graph. it answers \"who was that guy from the March call?\" in seconds instead of grepping 400 files\nhttps://t.co/68TFgbU5Mc\n\nstep 3: the inbox\nnpm install -g @googleworkspace/cli, then gws auth setup\nGmail, Calendar and Drive, all readable from one folder\nhttps://t.co/DxEYHPBvxs\n\nstep 4: the hands\nclaude mcp add playwright npx @playwright/mcp@latest\na real browser it drives itself: opens sites, fills forms, pulls data\nhttps://t.co/jn7VzQFA1M\n\nstep 5: the bodyguard\nnpm i -g jev-guard, jev-guard key \"...\", jev-guard install claude\na tiny model called Jev scores every action before it runs. rm -rf ~/ never gets through, and a sketchy email telling your agent what to do gets flagged. a 1,000-call session costs about 4 cents\nhttps://t.co/PSQf3KijaV\n\nstep 6: the routine\n/schedule -\u003e \"every day at 7:30 AM, tell me what came in, what you drafted and what needs my yes\"\n\nyou wake up, and the morning admin is already done.\n\n15 minutes. that's the whole setup.\n\nbookmark it before your feed buries it","url":"https://x.com/thegreatest_sv/status/2115418146156736697","createdAt":"2026-10-28T12:19:23Z","metrics":{"views":14249,"likes":267},"lang":"en"},{"id":"2115595117608485014","author":"Mojofull","handle":"furoku","text":"同じ仕事を半分ほどの時間と1割ほどの値段でこなせるなら、AIを何体も並べて動かすのがいよいよ現実的になってきますね。\n\nやっぱり、一部の人が仕事の9割する世界になるのかな。仕事が好きな人がやればいいよね。","url":"https://x.com/furoku/status/2115595117608485014","createdAt":"2026-10-29T00:02:36Z","metrics":{"views":110,"likes":0},"lang":"ja"},{"id":"2115678154149015921","author":"えっぐ","handle":"eggAIeguite","text":"Claude Code AI会社で月300万稼ぐ意識低い系ニートの日常はガチでこんなもん。\n\nもうとっくにAIに稼がせる時代になってるんよ。ワイがスマホでドパガキしてる間にAI社員が勝手に仕事して4つのスモビジが回る。\n\n入り口は今一番アツイClaude Code×TikTokアフィ一択。1日10分で初月30万くらいはサクッといけちゃうクソ穴場の金脈。","url":"https://x.com/eggAIeguite/status/2115678154149015921","createdAt":"2026-10-29T05:32:34Z","metrics":{"views":14570,"likes":84},"lang":"ja"},{"id":"2115412082594361476","author":"山ちゃん@AWS好きすぎて滅","handle":"nekorobi_aws","text":"qiitaのアップロード制限に引っかかったのでXで記事書いてみました","url":"https://x.com/nekorobi_aws/status/2115412082594361476","createdAt":"2026-10-28T11:55:17Z","metrics":{"views":15797,"likes":57},"lang":"ja"},{"id":"2115591756100280342","author":"斧口智彦🫠","handle":"axecm","text":"いやMuseヤバいって。\nやってることは株価や指数の変動や開示のスクレイピングと自動プッシュなんだけど、証券会社の有料ツールとかでやらないとできなかったことが容易に実現できてしまう…。\ndotsや他のAIツールだと月1万超えのプランじゃないと満足にできないのに…無料だと…？？😇 https://t.co/3cVV3cKFjk","url":"https://x.com/axecm/status/2115591756100280342","createdAt":"2026-10-28T23:49:15Z","metrics":{"views":114303,"likes":934},"lang":"ja"},{"id":"2115503730368061688","author":"Elon Musk","handle":"elonmusk","text":"Impressive","url":"https://x.com/elonmusk/status/2115503730368061688","createdAt":"2026-10-28T17:59:28Z","metrics":{"views":3134614,"likes":26393},"lang":"en"},{"id":"2115398226388164787","author":"洛克船长","handle":"slashui","text":"上次转的那个架构图火了，好多朋友问能不能做成 Skill。\n\n做出来了！🎉\n\n不只是需求文档：丢给它一个 GitHub 仓库或一篇文章，它也能把里面的内在关系理清楚，画成这种会动的架构图：\n\n🧭 不套模板：先判断是分层系统、流水线还是带循环的流程，再决定怎么画\n\n🎨 颜色有含义：模块按种类上色，连线按数据流向区分\n⚡ 光点沿连线流动，底部 log 实时滚动\"A → B\"\n\n🎬 一句话导出 HTML / 图片 / MP4 / GIF / Mermaid，说\"30 秒视频\"就给你 30 秒\n\n🌏 用中文问出中文图，用英文问出英文图，日文也一样\n\nClaude Code 和 Codex 都能用，一行装好：\nnpx @rokoai/arch-diagram install","url":"https://x.com/slashui/status/2115398226388164787","createdAt":"2026-10-28T11:00:14Z","metrics":{"views":20851,"likes":401},"lang":"zh"},{"id":"2115445182246125771","author":"monokern","handle":"monokern","text":"I TURNED GROK BOT INTO A MEMECOIN RESEARCH SYSTEM BECAUSE LOSING $10K TO A RED FLAG I COULD'VE CAUGHT IS TOO F*CKING EXPENSIVE\n\nGrok Bot Alpha scans new tokens and sends them through specialized research agents while the next batch enters the queue\n\nI wanted the checks running before buying, without spending half the day digging through every coin manually\n\nsix agents handle the research:\n\n\u003e Slate checks identity and origin\n\u003e Clasp examines dangerous contract powers\n\u003e Gauge checks liquidity and exit depth\n\u003e Tare tracks supply, burns and locked balances\n\u003e Sift examines holder concentration\n\u003e Pulse investigates trading activity\n\nCrucible combines their findings into a research sheet. every flagged token gets a reason in the log before you decide whether it deserves your money\n\nchart can scream \"NEXT 100X\" while the exit pool barely covers your position and a few wallets control the supply\n\nfinding that out after buying is how a promising trade becomes an expensive lesson\n\ncatching one bad setup before committing $10K could justify the whole thing. agents keep scanning while you investigate the flags\n\nscanner, agent activity and verdicts run on one dashboard. you can use the research desk yourself before your next trade\n\nOpen-source research desk + 24/7 Grok Bot team guide below ↓","url":"https://x.com/monokern/status/2115445182246125771","createdAt":"2026-10-28T14:06:49Z","metrics":{"views":4051,"likes":150},"lang":"en"},{"id":"2115563833528098886","author":"unusual_whales","handle":"unusual_whales","text":"24M Series A to engineer an AI voice model indistinguishable from a real human.\n\nRime also notes that it is able to process human emotions through tonality and respond with empathy","url":"https://x.com/unusual_whales/status/2115563833528098886","createdAt":"2026-10-28T21:58:17Z","metrics":{"views":117721,"likes":98},"lang":"en"},{"id":"2115459815128338659","author":"v3lkera","handle":"v3lkera","text":"This is f*cking insane. Anthropic engineer:\n\n\"95% of our engineers run self-improving harnesses on Opus 5.5\n\nIn 2 months nobody will be raw prompting anymore\"\n\nThat's the skill behind the $500K-$900K agent engineering offers right now\n\nIn a 35-minute lecture, he builds a self-improving harness from scratch\n\nPrompt → Harness → Loop → Self-Check → Agent That Improves Overnight\n\nWorth more than a $1,500 agentic course\n\nBookmark and watch it today\n\nThen read the \"Harness, Loops, Graphs\" guide below and build the harness first ↓","url":"https://x.com/v3lkera/status/2115459815128338659","createdAt":"2026-10-28T15:04:57Z","metrics":{"views":35033,"likes":414},"lang":"en"},{"id":"2115546942344458728","author":"Lightspeed","handle":"lightspeedvp","text":"After @CatoNetworks’ first outage, Shlomo Kramer made a point of never finding out which employee caused it.\n\nHis priority was understanding what went wrong and using the failure to make the company stronger.\n\nFrom Cyber60 with Lightspeed partner @guruchahal https://t.co/TwbOBh7Q1p","url":"https://x.com/lightspeedvp/status/2115546942344458728","createdAt":"2026-10-28T20:51:10Z","metrics":{"views":1590,"likes":10},"lang":"en"},{"id":"2115429123585896589","author":"shinshin86｜AITuber OnAir開発者｜AIキャラのミコをバズらせたい人","handle":"shinshin86","text":"Mesh Avatar Studioのアバターに、メガネを掛けられるようになりました！\n\nメガネの付け外しを切り替えられて、まばたきしてもフレームが消えません😊\n\nアプリで実際に使っている方からPRをいただいて入った機能です。ありがとうございます！\nhttps://t.co/J3l8pOfzIF https://t.co/Ff1YbZ6jt1","url":"https://x.com/shinshin86/status/2115429123585896589","createdAt":"2026-10-28T13:03:00Z","metrics":{"views":2940,"likes":71},"lang":"ja"},{"id":"2115583368406651353","author":"Dev Ed","handle":"developedbyed","text":"Dario: Drop fable 5.5 on them https://t.co/wjmTUW0Xcp","url":"https://x.com/developedbyed/status/2115583368406651353","createdAt":"2026-10-28T23:15:55Z","metrics":{"views":1592,"likes":15},"lang":"en"},{"id":"2115428485485506783","author":"Akshay 🚀","handle":"akshay_pachaar","text":"Big win for local LLM inference!\n\nThis open-source engine generates tokens 2.7x faster than Ollama on a MacBook:\n\nI tested it on a base M5 MacBook Pro with Qwen3.5 4B at 4-bit and the same 9.2k-token prompt. Ollama ran its MTP build, so both had speculative decoding.\n\n- Prefill: Ollama 464 tok/s, Magnitude 755 tok/s (1.6x)\n- Decode: Ollama 22.6 tok/s, Magnitude 60.0 tok/s (2.7x)\n- End to end, Magnitude finished in half the time\n\nThe video below shows both runs side by side.\n\nThe Ollama numbers don’t mean it’s badly built. Its kernels were simply tuned in advance.\n\nA kernel is the small GPU program behind every matrix multiply and attention step. Its speed depends on choices like how work is split across GPU cores and how data moves through memory.\n\nThe best choices change with every chip. Apple Silicon alone spans 8 to 80 GPU cores and under 70 to over 800 GB/s of bandwidth, and every model has its own layer sizes.\n\nA prebuilt engine has to pick one set of settings for all of them, so most local setups run on a compromise.\n\nMagnitude replaces that compromise with tuning on your machine:\n\n↳ When you download a model, it compiles that model’s kernels locally.\n\n↳ It tries different kernel configurations and keeps whichever runs fastest on your chip.\n\n↳ It pairs each model with the fastest speculative decoding drafter it has found, so each pass of the model produces more than one token.\n\nGitHub repo: https://t.co/gpwU34NFlw\n\n(don’t forget to star it 🌟)\n\nThis matters most for agents. Every file and tool output has to be processed before the model writes anything, and that prefill step is where kernel efficiency shows up. Concurrent sessions also share prefix caches, so parallel agents don’t slow each other down.\n\nMagnitude is an open-source (Apache 2.0) inference engine written in Rust. It plugs into Claude Code, Codex, OpenCode, Pi and other agents with one click.\n\nI shared the GitHub repo above.","url":"https://x.com/akshay_pachaar/status/2115428485485506783","createdAt":"2026-10-28T13:00:28Z","metrics":{"views":28889,"likes":429},"lang":"en"},{"id":"2115453835414278377","author":"marcus","handle":"marcusyul","text":"¿ENTIENDES LO QUE ACABA DE HACER VEED?\n\nHablas en un idioma y el vídeo sale en otro. Con tus labios moviéndose como si lo hubieras grabado así.\n\nEs su nueva API de doblaje:\n\n→ Labios sincronizados\n→ Mantiene el tono y la emoción\n→ Conserva el sonido de fondo\n→ Deja un toque del acento\n\nNo suena a voz en off. Suena a ti, en la misma habitación, hablando otro idioma.\n\nY al ser una API, lo metes directamente en tu producto o en el flujo de tus clientes.\n\nPara agencias que mueven el mismo vídeo en varios mercados, se acabó volver a grabar.\n\n🔖 Guárdalo.","url":"https://x.com/marcusyul/status/2115453835414278377","createdAt":"2026-10-28T14:41:12Z","metrics":{"views":34849,"likes":112},"lang":"es"},{"id":"2115708260716081573","author":"U.S. Politics Alert","handle":"USPoliticsAlert","text":"🚫 @sba_kelly is no longer following @SenArmstrong\n\nStill followed by: @leaderjohnthune, @senatecloakroom, @senategop, @senmccormickpa, @senossoff","url":"https://x.com/USPoliticsAlert/status/2115708260716081573","createdAt":"2026-10-29T07:32:11Z","metrics":{"views":372,"likes":1},"lang":"en"},{"id":"2115737172032553178","author":"Ronald van Loon","handle":"Ronald_vanLoon","text":"Meet SpinLaunch: The Rocket Launcher That Uses Speed Instead of Fuel\nby @sutoroveli_news\n \n#SpaceTech #Tech #Technology #EmergingTech #Space","url":"https://x.com/Ronald_vanLoon/status/2115737172032553178","createdAt":"2026-10-29T09:27:04Z","metrics":{"views":567,"likes":1},"lang":"en"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');

  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
