<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

ing voice notes.\n\n\u003e The app can connect to your Google Drive in order to build a knowledge graph.\n\n\u003e When transcription is active, it uses local models, [引用 @testingcatalog: Google released EmbeddingGemma 2 open  weight model under Apache 2 license!\n\n\u003e “Our lightweight, multimodal embedding model maps text, code, images, video, and audio into a single, unified embedding space.“\n\n\u003e 740M parameter form factor with modular encoders and 8K context]","url":"https://x.com/testingcatalog/status/2108013424148164637","metrics":{"views":1899422,"likes":10308}},{"id":"2107820739260764218","author":"Three.js","handle":"threejs","text":"https://tailgrab.io","url":"https://x.com/threejs/status/2107820739260764218","metrics":{"views":320260,"likes":600}},{"id":"2107825893263462737","author":"SIerLab","handle":"SIerLab_x","text":"ソフトバンクの最年少本部長は26歳。\n\nXが偶然、孫正義氏の目にとまったことがきっかけでスカウトされ、ソフトバンクに入社。","url":"https://x.com/SIerLab_x/status/2107825893263462737","metrics":{"views":896963,"likes":5890},"textJa":"これをリークしたやつ、度胸が理性を超えてる\n\nAIトレーディングは良い戦略探しが主だと思ってた。そこへCLAUDE OPUS 5.5とMINARA AIを組ませてみた。\n\n→ Opusが市場をスキャンして戦略を提案\n\n→ Minaraがライブデータと手数料込みバックテストを取り込む\n\n→ どのアイデアもリスク＋ストレステストを通過\n\n→ 本番前にペーパー取引\n\n→ Minaraの24/7オートパイロットは承認後だけ取引\n\nそのあと毎晩レビュー。エージェントを野放しにしない。\n\n面白いのはAIトレーディングそのものじゃない。\n\n戦略を考えるAIと、データ・実行・リスク・検証を担う別システムの分業だ。\n\nセットアップの詳細は下 https://x.com/defileo/status/2107258340376187371/video/1"},{"id":"2108011934750773251","author":"Three.js","handle":"threejs","text":"https://tailgrab.io","url":"https://x.com/threejs/status/2108011934750773251","metrics":{"views":2982,"likes":29}},{"id":"2107853628656496657","author":"AI News | TestingCatalog","handle":"testingcatalog","text":"ICYMI : Google released a new Google AI Edge Foresight app for macOS, powered by Gemma 4 and EmbeddingGemma2 for recording voice notes.\n\n\u003e The app can connect to your Google Drive in order to build a knowledge graph.\n\n\u003e When transcription is active, it uses local models, Gem m/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-09T09:28:22+09:00","posts":[{"id":"2108271552991252810","author":"Claude","handle":"claudeai","text":"Claude Dashboards and Claude Motion are in beta today.\n\nAsk Claude to turn your data into live dashboards and your ideas into animated explainers.","url":"https://x.com/claudeai/status/2108271552991252810","createdAt":"2026-10-09T04:01:22+09:00","media":"https://pbs.twimg.com/media/HUIXc6nXcAAN946.png","avatar":"https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_200x200.jpg","metrics":{"views":1653937,"likes":24323,"reposts":1483,"replies":501},"lang":"en","textJa":"Claude Dashboards と Claude Motion が本日ベータ公開。\n\nClaudeに頼めば、データをライブダッシュボードに、アイデアをアニメ解説に変えてくれる。"},{"id":"2108182955671580771","author":"NO1ennn","handle":"N01ennn","text":"this is pure f*cking treasure\n\nNetflix engineers posted 20 GitHub repos that turn your Opus 5.5 into a f*cking motion empire:\n\nbuilt for Opus 5.5\n\n1. claude-motion: taste, checks its own frames, sound written in code. the author built it for Opus 5.5  \nhttp://github.com/whaleyxbt/claude-motion\n\n2. claude-motion-design: HTML, Playwright and ffmpeg, no Remotion. the demo was made on Opus 5.5  \nhttp://github.com/howseen-ai/claude-motion-design\n\n3. motion-graphics-skills: 13 skills for launch videos. the README tells you to run it on Opus 5.5  \nhttp://github.com/charlie947/motion-graphics-skills\n\n4. claude-remotion-skill: a Remotion editor from one prompt. captions, B-roll, sound  \nhttp://github.com/haidrrrry/claude-remotion-skill\n\n5. klik-anim-skill-creation: the laws of animation and camera, built on Opus  \nhttp://github.com/t3knobox/klik-anim-skill-creation\n\n6. hyperframes-motion-reel-skill: a showreel cut to the beat at 120 BPM, on HyperFrames  \nhttp://github.com/Sunwood-ai-labs/hyperframes-motion-reel-skill\n\n7. product-launch-motion: a full launch film. voice-over, camera, color grade  \nhttp://github.com/AbubakrChan/product-launch-motion\n\n8. animate: a short clip in one canvas file, storyboarded as it goes  \nhttp://github.com/cth9191/animate\n\n9. motion-design-skills: timing, color, typography, logos, Remotion  \nhttp://github.com/iart-ai/motion-design-skills\n\n10. hyperframes-student-kit: 14 skills and 406 motion graphics cards  \nhttp://github.com/nateherkai/hyperframes-student-kit\n\nthe engines these skills render with\n\n11. hyperframes: HTML to MP4. the one almost everyone installs  \nhttp://github.com/heygen-com/hyperframes\n\n12. remotion: video written in React  \nhttp://github.com/remotion-dev/remotion\n\n13. remotion skills: the official Remotion skills for your agent  \nhttp://github.com/remotion-dev/skills\n\n14. GSAP: the timelines HyperFrames runs on. skills: npx skills add greensock/gsap-skills  \nhttp://github.com/greensock/GSAP\n\ntaste and everything around it\n\n15. motion-design-skill: motion principles that work with any engine  \nhttp://github.com/LottieFiles/motion-design-skill\n\n16. awesome-motion-design-agent-skills: a map of GSAP, Remotion, Lottie and Rive skills  \nhttp://github.com/frankxai/awesome-motion-design-agent-skills\n\n17. motion-graphics: B-roll built straight from your transcript  \nhttp://github.com/Barty-Bart/motion-graphics\n\n18. motion-dev-animations-skill: web animation on http://Motion.dev, not video  \nhttp://github.com/199-biotechnologies/motion-dev-animations-skill\n\n19. motion: Motion itself, formerly Framer Motion  \nhttp://github.com/motiondivision/motion\n\n20. lottie-web: when you need Lottie, not MP4  \nhttp://github.com/airbnb/lottie-web\n\nthe stack in one line: Opus 5.5 writes the code, a skill sets the timing and the camera, an engine renders the MP4.\n\ncheck each repo before you install. save this.","url":"https://x.com/N01ennn/status/2108182955671580771","createdAt":"2026-10-08T22:09:19+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108182921622269952/img/Lh6yASbzN7KBMAic.jpg","avatar":"https://pbs.twimg.com/profile_images/2042704855702147072/Scs1uqIO_200x200.jpg","metrics":{"views":50651,"likes":711,"reposts":60,"replies":19},"lang":"en","textJa":"これはマジで宝の山\n\nNetflixのエンジニアが、Opus 5.5をモーション帝国に変えるGitHubリポ20個を公開：\n\nOpus 5.5向け\n\n1. claude-motion: センスあり、自分でフレームをチェック、音もコードで書く。作者がOpus 5.5向けに作った\nhttp://github.com/whaleyxbt/claude-motion\n\n2. claude-motion-design: HTML、Playwright、ffmpeg。Remotionなし。デモはOpus 5.5で作成\nhttp://github.com/howseen-ai/claude-motion-design\n\n3. motion-graphics-skills: ローンチ動画用スキル13個。READMEにOpus 5.5で動かせと書いてある\nhttp://github.com/charlie947/motion-graphics-skills\n\n4. claude-remotion-skill: プロンプト1つでRemotionエディタ。キャプション、Bロール、音\nhttp://github.com/haidrrrry/claude-remotion-skill\n\n5. klik-anim-skill-creation: アニメーションとカメラの法則。Opus向け\nhttp://github.com/t3knobox/klik-anim-skill-creation\n\n6. hyperframes-motion-reel-skill: 120 BPMに合わせて切るショーリール。HyperFrames上\nhttp://github.com/Sunwood-ai-labs/hyperframes-motion-reel-skill\n\n7. product-launch-motion: フルのローンチフィルム。ナレーション、カメラ、カラーグレーディング\nhttp://github.com/AbubakrChan/product-launch-motion\n\n8. animate: キャンバス1ファイルで短いクリップ。進めながら絵コンテも\nhttp://github.com/cth9191/animate\n\n9. motion-design-skills: タイミング、色、タイポ、ロゴ、Remotion\nhttp://github.com/iart-ai/motion-design-skills\n\n10. hyperframes-student-kit: スキル14個とモーショングラフィックスカード406枚\nhttp://github.com/nateherkai/hyperframes-student-kit\n\nこれらのスキルがレンダリングに使うエンジン\n\n11. hyperframes: HTML→MP4。ほぼ全員が入れるやつ\nhttp://github.com/heygen-com/hyperframes\n\n12. remotion: Reactで書く動画\nhttp://github.com/remotion-dev/remotion\n\n13. remotion skills: エージェント向け公式Remotionスキル\nhttp://github.com/remotion-dev/skills\n\n14. GSAP: HyperFramesが動くタイムライン。スキル: npx skills add greensock/gsap-skills\nhttp://github.com/greensock/GSAP\n\nセンスとその周辺\n\n15. motion-design-skill: どのエンジンでも使えるモーション原則\nhttp://github.com/LottieFiles/motion-design-skill\n\n16. awesome-motion-design-agent-skills: GSAP、Remotion、Lottie、Riveスキルの地図\nhttp://github.com/frankxai/awesome-motion-design-agent-skills\n\n17. motion-graphics: 書き起こしから直接Bロールを作る\nhttp://github.com/Barty-Bart/motion-graphics\n\n18. motion-dev-animations-skill: http://Motion.dev のWebアニメ。動画ではない\nhttp://github.com/199-biotechnologies/motion-dev-animations-skill\n\n19. motion: Motion本体。旧Framer Motion\nhttp://github.com/motiondivision/motion\n\n20. lottie-web: MP4じゃなくLottieが欲しいとき\nhttp://github.com/airbnb/lottie-web\n\nスタックを一言で：Opus 5.5がコードを書き、スキルがタイミングとカメラを決め、エンジンがMP4をレンダリングする。\n\n入れる前に各リポを確認して。保存推奨。"},{"id":"2108171726412464173","author":"Morlex","handle":"0xMorlex","text":"Grok Bot just got a serious brain upgrade\n\nWith Claude Opus 5.5 entering the stack, one Bot could run an entire AI team that researches, writes code, uses tools, verifies results, and delivers finished work\n\nHere's how to build it in 10 steps: https://x.com/i/article/2108146154395303936\n\nGrok Bot + Opus 5.5: The Ultimate Agent Harness in 10 Steps  \n\nEvery agent you have used so far came as one package. The harness - the computer, the logins, the memory, the routines - and the brain that drives it were built by the same company and sold together.","url":"https://x.com/0xMorlex/status/2108171726412464173","createdAt":"2026-10-08T21:24:42+09:00","media":"https://pbs.twimg.com/media/HUG6cHmWcAATDhA.jpg","avatar":"https://pbs.twimg.com/profile_images/2060665433926086660/8PnnU2pY_200x200.jpg","metrics":{"views":46105,"likes":382,"reposts":27,"replies":18},"lang":"en","textJa":"Grok Botが本気の頭脳アップグレードを受けた\n\nClaude Opus 5.5がスタックに入り、1つのBotで調査・コード・ツール利用・結果検証・完成物の納品までこなすAIチームを動かせるように\n\n10ステップで作る方法: https://x.com/i/article/2108146154395303936\n\nGrok Bot + Opus 5.5: 究極のエージェントハーネス 10ステップ\n\nこれまで使ってきたエージェントは全部ワンパッケージだった。ハーネス（コンピュータ、ログイン、メモリ、ルーチン）とそれを動かす頭脳が、同じ会社で作られ一緒に売られていた。"},{"id":"2108160812615369011","author":"Guillermo Casaus","handle":"_guillecasaus","text":"Anthropic acaba de compartir uno de los mejores trucos para sacar Claude Code.\n\nLa idea es combinar Sonnet 5.5, Haiku 5.5 y Opus 5.5 para que cada modelo se encargue de lo que mejor hace.\n\nSolo tienes que iniciar Claude Code así:\n\nclaude --advisor opus --subagents haiku\n\nLa idea es esta:\n\n→ Sonnet 5.5 dirige la sesión y escribe el código\n→ Haiku 5.5 explora archivos y documentación en paralelo\n→ Opus 5.5 queda como asesor para las decisiones importantes\n→ Ahorras contexto de Opus en tareas que no lo necesitan\n\nOpus solo entra cuando hace falta revisar un plan, desbloquear un error repetido o comprobar que no te estás dejando nada antes de terminar.\n\nSonnet construye. Haiku explora. Opus revisa.\n\n🔖 Guárdalo, te será útil.","url":"https://x.com/_guillecasaus/status/2108160812615369011","createdAt":"2026-10-08T20:41:20+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108160747373031424/img/QjSLMYd8_8g7D2Fg.jpg","avatar":"https://pbs.twimg.com/profile_images/2106417717334908928/pe2ACnXx_200x200.jpg","metrics":{"views":296650,"likes":3470,"reposts":300,"replies":78},"lang":"es","textJa":"Anthropicが、Claude Codeを最大限引き出すコツのひとつを共有した。\n\nSonnet 5.5、Haiku 5.5、Opus 5.5を組み合わせ、得意な役割を分担させるアイデア。\n\nClaude Codeはこう起動するだけ：\n\nclaude --advisor opus --subagents haiku\n\n役割はこう：\n\n→ Sonnet 5.5がセッションを主導しコードを書く\n→ Haiku 5.5がファイルとドキュメントを並列で探索\n→ Opus 5.5は重要な判断のアドバイザー\n→ 不要なタスクではOpusのコンテキストを節約\n\nOpusが入るのは、プランの見直し、繰り返しエラーの解除、終了前の抜け漏れ確認が必要なときだけ。\n\nSonnetが作る。Haikuが探す。Opusがレビューする。\n\n🔖 保存しておくと役に立つ。"},{"id":"2108234291285242190","author":"atomic.chat","handle":"atomic_chat_hq","text":"Local Laya blitzed other models on RTX 4090 ⚡️\n\nFour local decision models raced down Wikipedia picking out every word that names a centipede and Laya took 3.9 ms a word so it ended up being the fastest overall\n\nRun decision models locally -\u003e https://atomic.chat","url":"https://x.com/atomic_chat_hq/status/2108234291285242190","createdAt":"2026-10-09T01:33:18+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108234082530230272/img/y5CsvBHmWdELDBrv.jpg","avatar":"https://pbs.twimg.com/profile_images/2037454994899959808/L7uqgUfL_200x200.jpg","metrics":{"views":8340,"likes":122,"reposts":11,"replies":1},"lang":"en","textJa":"ローカルのLayaがRTX 4090で他モデルを圧倒 ⚡️\n\n4つのローカル意思決定モデルがWikipediaを走破し、ムカデを指す単語を全部拾うレース。Layaは1語あたり3.9msで全体最速だった。\n\n意思決定モデルをローカルで → https://atomic.chat"},{"id":"2108171571445858522","author":"mirai | AI活用を応援･MIRAICHI共同代表","handle":"mirai_spark","text":"🍌Claude Codeから、APIキー不要で\n無料で画像生成できるように！\n\nAntigravity CLIを呼び出して、\nNanoBanana で画像生成できるように✨\n\n「画像生成して」と言えば、\nAntigravity CLIを起動して\n画像生成してくれるスキルも作りました！\n\nスキルの中身も公開しましたので、ぜひご覧ください😊","url":"https://x.com/mirai_spark/status/2108171571445858522","createdAt":"2026-10-08T21:24:05+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108171083497312256/img/f1P5NYryaKWHw2Nw.jpg","avatar":"https://pbs.twimg.com/profile_images/1750725343869321216/JvVcyKM__200x200.jpg","metrics":{"views":12447,"likes":128,"reposts":1,"replies":0},"lang":"ja"},{"id":"2108252402075734172","author":"Google Cloud","handle":"googlecloud","text":"Today, we are announcing our new Gemini agent for your business—a universal cloud agent running 24/7 to get your work done. \n\nIt arrives knowing your tools, data, and work history; it works across knowledge work, content, and code; and it comes with built-in governance to help your data stay secure and cost stay in control → https://goo.gle/4j7daun","url":"https://x.com/googlecloud/status/2108252402075734172","createdAt":"2026-10-09T02:45:16+09:00","media":"https://pbs.twimg.com/media/HUIEYsoXgAEjd75.jpg","avatar":"https://pbs.twimg.com/profile_images/2047008530478346240/2ZoDIjwe_200x200.jpg","metrics":{"views":149744,"likes":1524,"reposts":197,"replies":48},"lang":"en","textJa":"本日、ビジネス向けの新しいGeminiエージェントを発表。仕事を片付ける24時間稼働のユニバーサルクラウドエージェント。\n\nツール・データ・作業履歴をすでに把握した状態で届き、ナレッジワーク・コンテンツ・コードを横断して動く。データ保護とコスト管理のためのガバナンスも組み込み → https://goo.gle/4j7daun"},{"id":"2108127637386519028","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【新機能】Grok BotがX自体の検索・分析に対応\n\n追加のAPI費用なしにX検索自由にできるのは普通に便利。\n\nxAIが発表。「自社アプリの評判をXで調べて」と頼むと、関連投稿328件を自動で読み込んで主要な意見を要約してくれるデモが公開。\n\n・Xの投稿検索が可能に\n・投稿内容の分析も可能に\n・話題の経過を自動モニタリング\n・全ユーザーが追加設定なしで利用可\n\n競合監視や自社製品の評判チェックが捗りそう\n\n↓詳細","url":"https://x.com/masahirochaen/status/2108127637386519028","createdAt":"2026-10-08T18:29:30+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108127620131098624/img/tTax9gQhVApH5ZIr.jpg","avatar":"https://pbs.twimg.com/profile_images/1689665533929725953/fClFlzLd_200x200.jpg","metrics":{"views":13998,"likes":111,"reposts":7,"replies":5},"lang":"ja"},{"id":"2108203325498048655","author":"kaori","handle":"kaorixbt","text":"Lauren Tan (SpaceXAI engineer) released a prompt that turns one Grok Bot into an entire project team\n\nIt's f*cking unreal...\n\nBookmark and send it to your Grok Bot, fill in the project brief and thank me later\n\nThen read the full roadmap with examples below","url":"https://x.com/kaorixbt/status/2108203325498048655","createdAt":"2026-10-08T23:30:15+09:00","media":"https://pbs.twimg.com/media/HUHFUIUXoAAODJ0.png?name=orig","avatar":"https://pbs.twimg.com/profile_images/2085872182807117825/qM38kclF_200x200.jpg","metrics":{"views":48655,"likes":390,"reposts":46,"replies":15},"lang":"en","textJa":"Lauren Tan（SpaceXAIエンジニア）が、1つのGrok Botをプロジェクトチーム全体に変えるプロンプトを公開\n\nマジでヤバい…\n\nブックマークしてGrok Botに送り、プロジェクト概要を埋めてあとで感謝して\n\n下に例付きのフルロードマップあり"},{"id":"2108262812489531498","author":"OpenAI Developers","handle":"OpenAIDevs","text":"Ultrafast is rolling out today for GPT-6.1 Sol in the API, Codex, and ChatGPT Work.\n\nNear-Astra intelligence at up to 8x faster speeds than Sol Standard, so you can build as fast as the ideas come.","url":"https://x.com/OpenAIDevs/status/2108262812489531498","createdAt":"2026-10-09T03:26:38+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108262768805818368/img/r62HnwZHUafWIB5o.jpg","avatar":"https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_200x200.jpg","metrics":{"views":746820,"likes":3956,"reposts":259,"replies":325},"lang":"en","textJa":"Ultrafastが本日、API・Codex・ChatGPT WorkのGPT-6.1 Sol向けにロールアウト開始。\n\nAstra並みの知性をSol Standardの最大8倍速で。アイデアが浮かぶ速さで作れる。"},{"id":"2108165573964427319","author":"オープンソース研究所","handle":"opensourcelab9","text":"請求書の PDF から決めた項目を抜き出す作業が、1回で終わります😳\n公開モデル lift は、1万1千項目で正確さ90.2%。\nhttps://x.com/akshay_pachaar/status/2106361169690956041/video/1\n読み取り・整理・JSON の手直しをつなぐ手間が、まとめて1段で済みます。\n\n・全ページを1回で読み、ページをまたぐ値も取れる\n・請求書から論文まで、項目を決められる書類に使える\n・無い値は作らず、null（空）で返す\n・vLLM か Hugging Face で自前で動かせる\n\n投稿者いわく、Gemini Flash 3.5 に近い出来で3倍速いそうです。\n\n書類の山から数字を拾う作業がある人ほど、試す価値がありそう。\n\n数字を抜く前に、PDF がどこまで読めるかも見てほしい。\n見出しを拾えない、日本語が化けるなど PDF の弱点は、この下の記事で検証しています👇\n\nオープンソースはこちら👇\n\nhttps://github.com/datalab-to/lift\nhttps://x.com/opensourcelab9/status/2077246598892196070","url":"https://x.com/opensourcelab9/status/2108165573964427319","createdAt":"2026-10-08T21:00:15+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2106361138644672512/img/trnjbzMMnlYgwfEI.jpg","avatar":"https://pbs.twimg.com/profile_images/2043709040921059328/1qDRmMiX_200x200.jpg","metrics":{"views":1683,"likes":15,"reposts":2,"replies":0},"lang":"ja"},{"id":"2108281278181110108","author":"kaize","handle":"0x_kaize","text":"DON'T cancel your X premium or Supergrok \n\nTomorrow is a very important day for every X user\n\nX is building XPass, one subscription for X, Grok, Cursor and Grok Bot\n\nThe tiers:\n\n\u003e Premium $8: X Premium, Grok Lite, Grok API, Cursor\n\n\u003e Plus $30: Premium+, SuperGrok, Grok Bot, Cursor cloud agents, Bugbot\n\n\u003e Super $100: SuperGrok+, 1080p videos, priority access\n\n\u003e Ultra $200: SuperGrok Heavy, fastest replies, earliest access\n\nOne shared usage pool across everything\n\nAnnual prices: $6.67 / $25 / $83.33 / $166.7 month\n\nIn other words, the first two options are your X subscription plus additional bonuses, while the rest are the same but with higher limits and boost your X profile\n\nRumor has it that it will be launched tomorrow","url":"https://x.com/0x_kaize/status/2108281278181110108","createdAt":"2026-10-09T04:40:01+09:00","media":"https://pbs.twimg.com/media/HUIekXyWYAAEGpu.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2107798334324846592/nA8R9M4L_200x200.jpg","metrics":{"views":31498,"likes":417,"reposts":30,"replies":69},"lang":"en","textJa":"X PremiumやSupergrokを解約するな\n\n明日は全Xユーザーにとって重要な日\n\nXがXPassを構築中。X、Grok、Cursor、Grok Botをまとめる1つのサブスク\n\nティア：\n\n\u003e Premium $8: X Premium、Grok Lite、Grok API、Cursor\n\n\u003e Plus $30: Premium+、SuperGrok、Grok Bot、Cursorクラウドエージェント、Bugbot\n\n\u003e Super $100: SuperGrok+、1080p動画、優先アクセス\n\n\u003e Ultra $200: SuperGrok Heavy、最速返信、最速アクセス\n\nすべてで共有の利用枠プール\n\n年額換算: $6.67 / $25 / $83.33 / $166.7 /月\n\nつまり最初の2つはXサブスク＋ボーナス、残りは同じだが上限が上がりXプロフィールも強化される\n\n噂では明日ローンチとのこと"},{"id":"2108228871938359347","author":"Grok Bot","handle":"bot","text":"Grok Bot can now help run your Shopify store.\n\nConnect Shopify, then ask it to check orders, track inventory, and keep product listings up to date.","url":"https://x.com/bot/status/2108228871938359347","createdAt":"2026-10-09T01:11:46+09:00","media":"https://pbs.twimg.com/media/HUHumrUacAAT6di.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2087219239275069440/KW6C403V_200x200.jpg","metrics":{"views":6532326,"likes":2076,"reposts":191,"replies":151},"lang":"en","textJa":"Grok BotがShopifyストアの運営を手伝えるようになった。\n\nShopifyを接続すれば、注文確認、在庫追跡、商品掲載の更新を頼める。"},{"id":"2108276005886705818","author":"Daniel San","handle":"dani_avila7","text":"Jev Skill Typeahead for Claude Code\n\nAs you type your prompt, Jev analyzes it and predicts which of your installed skills Claude is most likely to invoke\n\nIt shows each skill's estimated probability before you even send the request\n\nSuper useful for understanding and optimizing your skill pipelines before execution\n\nAnd it uses 0 Claude tokens\n\nInstall: \nnpx claude-code-templates@latest --mod productivity/jev-skill-typeahead","url":"https://x.com/dani_avila7/status/2108276005886705818","createdAt":"2026-10-09T04:19:04+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108275747404091392/img/0dnYFj2LdTAHDV8G.jpg","avatar":"https://pbs.twimg.com/profile_images/1952921529504649216/RYHFCSSM_200x200.jpg","metrics":{"views":4380,"likes":70,"reposts":5,"replies":9},"lang":"en","textJa":"Claude Code向け Jev Skill Typeahead\n\nプロンプトを打っている最中にJevが解析し、インストール済みスキルのうちClaudeが呼びそうなものを予測\n\n送信前に各スキルの推定確率を表示\n\n実行前にスキルパイプラインを理解・最適化するのに超便利\n\nしかもClaudeトークン消費は0\n\nインストール:\nnpx claude-code-templates@latest --mod productivity/jev-skill-typeahead"},{"id":"2108348568566116780","author":"MenteBinaria","handle":"SoyMenteBinaria","text":"La IA no mató estas herramientas. Mató la excusa de que necesitas años para aprender a usarlas.\n\nPower BI, n8n, Make, Excel… siguen vivos. Lo que está cambiando es dónde está el verdadero valor: ya no basta con saber usar una herramienta, hay que saber qué construir con ella.\n\nLas herramientas cambian. El criterio sigue marcando la diferencia.","url":"https://x.com/SoyMenteBinaria/status/2108348568566116780","createdAt":"2026-10-09T09:07:24+09:00","avatar":"https://pbs.twimg.com/profile_images/2060575297003495429/EUfzdsc1_200x200.jpg","metrics":{"views":173,"likes":10,"reposts":9,"replies":5},"lang":"es","textJa":"AIはこれらのツールを殺しはしなかった。使いこなすのに何年もかかる、という言い訳を殺しただけだ。\n\nPower BI、n8n、Make、Excel…は今も生きている。変わっているのは本当の価値の所在。ツールの使い方を知っているだけでは足りず、それで何を作るかを知る必要がある。\n\nツールは変わる。差をつけるのは今も判断力だ。"},{"id":"2107825893263462737","author":"MAX","handle":"MAXdeg0","text":"WHOEVER LEAKED THIS HAS BIGGER BALLS THAN SENSE \n\ni thought AI trading was mostly about finding good strategies, then i paired CLAUDE OPUS 5.5 with MINARA AI.\n\n→ Opus scans the market and proposes strategies\n\n→ Minara pulls in live data and fee-aware backtests\n\n→ every idea passes risk + stress tests\n\n→ paper trading comes before going live\n\n→ Minara’s 24/7 Autopilot only trades after approval\n\nthen everything gets reviewed nightly instead of just letting the agent run wild.\n\nthe interesting part isn’t AI trading by itself.\n\nit’s having one AI reason about the strategy while another system handles the data, execution, risk, and validation. \n\nFull breakdown on how to set it up below https://x.com/defileo/status/2107258340376187371/video/1","url":"https://x.com/MAXdeg0/status/2107825893263462737","createdAt":"2026-10-07T22:30:29+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107258286651351040/img/cowVEx_Tzb-zK31w.jpg","avatar":"https://pbs.twimg.com/profile_images/2078712065410080768/n75TAdiw_200x200.jpg","metrics":{"views":1072053,"likes":6974,"reposts":713,"replies":223},"lang":"en","textJa":"これをリークしたやつ、度胸が理性を超えてる\n\nAIトレーディングは良い戦略探しが主だと思ってた。そこへCLAUDE OPUS 5.5とMINARA AIを組ませてみた。\n\n→ Opusが市場をスキャンして戦略を提案\n\n→ Minaraがライブデータと手数料込みバックテストを取り込む\n\n→ どのアイデアもリスク＋ストレステストを通過\n\n→ 本番前にペーパー取引\n\n→ Minaraの24/7オートパイロットは承認後だけ取引\n\nそのあと毎晩レビュー。エージェントを野放しにしない。\n\n面白いのはAIトレーディングそのものじゃない。\n\n戦略を考えるAIと、データ・実行・リスク・検証を担う別システムの分業だ。\n\nセットアップの詳細は下 https://x.com/defileo/status/2107258340376187371/video/1"},{"id":"2108022066746437699","author":"AI_Explorer","handle":"ai_explorer25","text":"list of 15 best AI researchers on X:\n\n1. @karpathy — Andrej Karpathy\n2. @rasbt — Sebastian Raschka\n3. @AndrewYNg — Andrew Ng\n4. @drfeifei — Fei-Fei Li\n5. @demishassabis  — Demis Hassabis\n6. @GaryMarcus  — Gary Marcus\n7.  @ai_explorer25   — AI Explorer\n8.  @maximelabonne  — Maxime Labonne\n9.  @chipro— Chip Huyen\n10. @ilyasut— Ilya Sutskever\n11.  @thsottiaux — Thibault \"Tibo\" Sottiaux\n12. @bcherny — Boris Cherny\n13. @geoffreyhinton — Geoffrey Hinton\n14. @JeffDean — Jeff Dean\n15. @fchollet — François Chollet","url":"https://x.com/ai_explorer25/status/2108022066746437699","createdAt":"2026-10-08T11:30:00+09:00","avatar":"https://pbs.twimg.com/profile_images/2105533042823659520/S5FX6rIU_200x200.jpg","metrics":{"views":76475,"likes":472,"reposts":67,"replies":31},"lang":"en","textJa":"Xで見るべきAI研究者15人：\n\n1. @karpathy — Andrej Karpathy\n2. @rasbt — Sebastian Raschka\n3. @AndrewYNg — Andrew Ng\n4. @drfeifei — Fei-Fei Li\n5. @demishassabis  — Demis Hassabis\n6. @GaryMarcus  — Gary Marcus\n7.  @ai_explorer25   — AI Explorer\n8.  @maximelabonne  — Maxime Labonne\n9.  @chipro— Chip Huyen\n10. @ilyasut— Ilya Sutskever\n11.  @thsottiaux — Thibault \"Tibo\" Sottiaux\n12. @bcherny — Boris Cherny\n13. @geoffreyhinton — Geoffrey Hinton\n14. @JeffDean — Jeff Dean\n15. @fchollet — François Chollet"},{"id":"2108245653843509415","author":"Matthew Berman","handle":"MatthewBerman","text":"Reverse Engineer Anything 😂\n\nSoftware is done.","url":"https://x.com/MatthewBerman/status/2108245653843509415","createdAt":"2026-10-09T02:18:27+09:00","media":"https://pbs.twimg.com/media/HUH93PGbwAAgsUn.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2051399921467830272/9RGo_6vv_200x200.jpg","metrics":{"views":584269,"likes":14767,"reposts":1205,"replies":235},"lang":"en","textJa":"何でもリバースエンジニアリング 😂\n\nソフトウェアは終わりだ。"},{"id":"2108184481370886330","author":"Santiago","handle":"svpino","text":"Searching 32 million records in 30 milliseconds is insane!\n\n@typesense is a crazy fast open-source search engine that supports natural language search. It's like Elasticsearch but much easier to set up, configure, and use.\n\nYou can do all of this with Typesense:\n\n• Fuzzy search: Typo-tolerant fuzzy search-as-you-type\n• Vector search: Return records that are similar to each other\n• Semantic search: Return records that are conceptually related\n• Geo Search: Return records that are close to a given lat/long\n\nTypesense's Natural Language Search is pretty cool:\n\nIt turns a sentence into a structured search query, then runs it against your data. For example:\n\nThe query \"Find me a BMW under $40,000, newer than 2020, with the lowest mileage first\" will produce the following:\n\n• Filters: brand = BMW, price \u003c 40000,  year \u003e 2020\n• Sort: mileage ascending\n\nTypesense will then apply these filters and sorting rules to the data.\n\nThey offer client libraries in Python, JavaScript, PHP, Ruby, Go, Rust, Swift, .NET, Java, and pretty much any other programming language.\n\nYou can start searching in less than a minute:\n\n1. Run their Docker image (or one of their native binaries)\n2. Import your data\n3. Start searching!\n\nGitHub repository: https://fandf.co/4ytzmmE\n\nI recorded a quick video to show you a demo. I promise you haven't seen anything this fast!\n\nThanks to the team for partnering with me on this post.","url":"https://x.com/svpino/status/2108184481370886330","createdAt":"2026-10-08T22:15:23+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108184388227964930/img/lZL5AIgrvbEZoOqR.jpg","avatar":"https://pbs.twimg.com/profile_images/1581385027757264898/j5GjtUiq_200x200.jpg","metrics":{"views":26756,"likes":521,"reposts":71,"replies":12},"lang":"en","textJa":"3200万件を30ミリ秒で検索はヤバい！\n\n@typesense は自然言語検索対応の超高速オープンソース検索エンジン。Elasticsearchみたいだけど、セットアップ・設定・利用がずっと簡単。\n\nTypesenseでできること：\n\n• Fuzzy search: タイポに強い入力中ファジー検索\n• Vector search: 似たレコードを返す\n• Semantic search: 概念的に関連するレコードを返す\n• Geo Search: 指定した緯度経度に近いレコードを返す\n\nTypesenseの自然言語検索はかなり良い：\n\n文を構造化クエリに変え、データに対して実行する。例：\n\n「BMWで4万ドル未満、2020年以降、走行距離が少ない順」というクエリはこうなる：\n\n• Filters: brand = BMW, price \u003c 40000, year \u003e 2020\n• Sort: mileage ascending\n\nTypesenseがこのフィルタとソートをデータに適用する。\n\nクライアントライブラリはPython、JavaScript、PHP、Ruby、Go、Rust、Swift、.NET、Javaほかほぼ全言語。\n\n1分以内に検索開始できる：\n\n1. Dockerイメージ（またはネイティブバイナリ）を起動\n2. データをインポート\n3. 検索開始！\n\nGitHubリポジトリ: https://fandf.co/4ytzmmE\n\nデモ動画も撮った。こんな速さは見たことないはず。\n\nこの投稿で協力してくれたチームに感謝。"},{"id":"2108238378751967385","author":"Odyssey","handle":"odysseyml","text":"Today we're launching Odyssey-3, the most powerful foundation world model yet.\n\nIt sets a new state of the art on Physics-IQ, and powers robots, trains AIs, and generates interactive experiences. It's really cool.\n\nExperience the model today, all for free!","url":"https://x.com/odysseyml/status/2108238378751967385","createdAt":"2026-10-09T01:49:33+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108225049060921344/img/WhwXmpS6ufWt3uTH.jpg","avatar":"https://pbs.twimg.com/profile_images/2071642815944359936/IebkUQ-C_200x200.jpg","metrics":{"views":548504,"likes":1563,"reposts":194,"replies":149},"lang":"en","textJa":"本日、これまでで最強の基盤ワールドモデル Odyssey-3 をローンチ。\n\nPhysics-IQで新たなSOTAを達成。ロボットを動かし、AIを訓練し、インタラクティブ体験も生成する。めっちゃクール。\n\n今日から無料でモデルを体験できる！"},{"id":"2108324514442461225","author":"Google","handle":"Google","text":"Our medical research system, AMIE, is the first patient-facing conversational diagnostic tool of its kind to be studied prospectively in a real-world clinical setting.\n\nIn a study, published today in @TheLancet, we found that when patients chatted with AMIE before an in-person appointment, the interaction built their confidence and helped them organize their thoughts. And physicians who reviewed the information from the patient conversation got more time back to focus on collaborative care and shared decision-making instead of digging through data.","url":"https://x.com/Google/status/2108324514442461225","createdAt":"2026-10-09T07:31:49+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108311983757934592/img/nHMRJLt4OETd2hcF.jpg","avatar":"https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_200x200.jpg","metrics":{"views":39471,"likes":124,"reposts":12,"replies":14},"lang":"en","textJa":"医療研究システムAMIEは、患者向け会話型診断ツールとして、実臨床の前向き研究にかけられた初のこの種のツール。\n\n本日@TheLancetに掲載の研究では、対面診療前に患者がAMIEとチャットすると自信がつき考えが整理されることが分かった。医師は患者会話の情報を確認でき、データ漁りより協働ケアと共同意思決定に時間を使えるようになった。"},{"id":"2108180624372605186","author":"Maziyar PANAHI","handle":"MaziyarPanahi","text":"an open model just beat Jev outright on clinical decisions 🔥\n\npplx-decider v1.1 got 643 of 669 right vs 628 for Jev, at 42% less per decision and about the same speed. and you can download the weights and run it inside the hospital.\n\nSystem One just went open","url":"https://x.com/MaziyarPanahi/status/2108180624372605186","createdAt":"2026-10-08T22:00:03+09:00","media":"https://pbs.twimg.com/media/HUGlFTyXcAA_qzb.png?name=orig","avatar":"https://pbs.twimg.com/profile_images/2040127008194297857/Bd0q_5oF_200x200.jpg","metrics":{"views":33149,"likes":242,"reposts":31,"replies":11},"lang":"en","textJa":"オープンモデルが臨床判断でJevを真っ向から上回った 🔥\n\npplx-decider v1.1は669問中643正解、Jevは628。1判断あたり42%安く、速度はほぼ同じ。ウェイトをダウンロードして院内で動かせる。\n\nSystem Oneがオープンになった"},{"id":"2108262476026397040","author":"CV.YH","handle":"0xCVYH","text":"Engenharia reversa de qualquer coisa.\n\nhttps://github.com/morluto/rea","url":"https://x.com/0xCVYH/status/2108262476026397040","createdAt":"2026-10-09T03:25:18+09:00","media":"https://pbs.twimg.com/media/HUINesGXEAA7w1L.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1849060173098229760/tgS51-gs_200x200.jpg","metrics":{"views":60277,"likes":1340,"reposts":86,"replies":12},"lang":"pt","textJa":"何でもリバースエンジニアリング。\n\nhttps://github.com/morluto/rea"},{"id":"2108294618597216470","author":"Elon Musk","handle":"elonmusk","text":"Automatically used by Grok @Bot","url":"https://x.com/elonmusk/status/2108294618597216470","createdAt":"2026-10-09T05:33:01+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":681902,"likes":1795,"reposts":307,"replies":217},"lang":"en","textJa":"Grok @Bot が自動で使用"},{"id":"2108226509521785277","author":"Unreal Engine","handle":"UnrealEngine","text":"Unreal Model Context Protocol (MCP) provides an official, Epic-supported way to connect your favorite agentic LLM tools directly to Unreal Engine🤝\n\nBuilt on the open MCP standard, it enables agents to take action in your projects using the capabilities exposed by each editor—so you can use compatible agentic coding tools or build your own integrations, skills, and workflows around how you create: https://epic.gm/ue-mcp-docs","url":"https://x.com/UnrealEngine/status/2108226509521785277","createdAt":"2026-10-09T01:02:23+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108225919525740544/img/9jntAordcbhJu1xH.jpg","avatar":"https://pbs.twimg.com/profile_images/1782802808028254209/OXNX9wh9_200x200.jpg","metrics":{"views":83852,"likes":1709,"reposts":152,"replies":53},"lang":"en","textJa":"Unreal Model Context Protocol（MCP）は、お気に入りのエージェンティックLLMツールをUnreal Engineに直接つなぐ、Epic公式サポートの方法🤝\n\nオープンなMCP標準の上に構築され、各エディタが公開する機能でエージェントがプロジェクト内で行動できる。対応するエージェンティックコーディングツールを使うか、自分用の統合・スキル・ワークフローを作れる: https://epic.gm/ue-mcp-docs"},{"id":"2108091976574988390","author":"aicreataro","handle":"aicreataro","text":"「音と動きをビジュアライズ」\nOpus 5.5×Blender×Python\n\n■素材\n・人物：MiniMax H3\n・キービジュアル：Midjourney\n・音楽：MiniMax Music 3.0\n\n■Blenderとコードでやらせたこと\n・音が大きいほど、絵が立体になって手前に飛び出す\n・速く動いた所ほど、粒になって浮く\n・打った瞬間に時間が止まり、カメラだけが回り込む\n・止まっている間、空間ごと色と照明が切り替わる\n\n■わかったこと\n・生成だけでは出ない絵も組み合わせるとできる\n・やりすぎるとだめ\n・映像の動きにも反応させたら、映像そのものが鳴っているように見えてきた\n・飛び出す量は曲の音と、素材の動きに任せた\n\n実験的な映像ではありますが、何かの表現に使えそうだなと思います。AIをより拡張できる方法を探っていきたいです。\n音と動きの両方で絵が動くと、なんか面白いですね。","url":"https://x.com/aicreataro/status/2108091976574988390","createdAt":"2026-10-08T16:07:48+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108091509686083584/img/ES5Kg-GXoC-1u9xl.jpg","avatar":"https://pbs.twimg.com/profile_images/1909927498063949824/MwgL2wbP_200x200.jpg","metrics":{"views":37159,"likes":912,"reposts":83,"replies":29},"lang":"ja"},{"id":"2108153649650422214","author":"あいびぃ","handle":"ivy432hz","text":"EmbeddingGemma 2 で記憶ストアの呼び出しを配信風に作ってみた...のだけど微妙な結果になったので Jev を挟んだら Jev すげぇという感じになってしまった","url":"https://x.com/ivy432hz/status/2108153649650422214","createdAt":"2026-10-08T20:12:52+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108150277597741056/img/kOq20WIq1wnvzvy5.jpg","avatar":"https://pbs.twimg.com/profile_images/2102433158373556224/e32xaYyF_200x200.jpg","metrics":{"views":8664,"likes":203,"reposts":32,"replies":0},"lang":"ja"},{"id":"2108204174403944745","author":"maestro","handle":"maestrooth","text":"opus 5.5 is now live on grok bot...\n\nthis is a dangerously powerful combo for building your own agent team instead of one more assistant\n\nbots that design bots. bots that audit them before they ever touch your work\n\nhere's how to build it\n\n→ team lead\n https://x.ai/bot/KZ9xav0Qad1U5QigEn7rh\n→ bot architect\n https://x.ai/bot/93gOz3op1UQdBdbekQFLK\n→ prompt coach\n https://x.ai/bot/BrjELcmSwatjRc8DYjtrT\n→ front door router\n https://x.ai/bot/__4FfrkUdvpdMk6-LKg5r\n→ intake inspector\n https://x.ai/bot/q7GLbLhMZDpJXBGuuci1J\n→ safety reviewer\n https://x.ai/bot/9Vmfeck_zr6jo9dO-xEBT\n→ workspace auditor\n https://x.ai/bot/JcFj23aaufNWkuiiJTX0j\n\nrun the whole team under one constitution: no bot reviews the bot it wrote. nothing joins the team until the reviewer passes it.\n\nstart with the team lead. give every agent a role before you give it a task.\n\nCheck out the full guide below ↓ ↓","url":"https://x.com/maestrooth/status/2108204174403944745","createdAt":"2026-10-08T23:33:38+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108203653186060289/img/CJ6NgdcbzQ_Q4byo.jpg","avatar":"https://pbs.twimg.com/profile_images/2090164287595741184/eIyfgPau_200x200.jpg","metrics":{"views":16157,"likes":133,"reposts":15,"replies":10},"lang":"en","textJa":"opus 5.5がgrok botで利用可能に…\n\nもう1つのアシスタントではなく、自分のエージェントチームを組むには危険なほど強い組み合わせ\n\nボットがボットを設計し、仕事に触れる前に監査するボットも\n\n作り方はこう\n\n→ team lead\n https://x.ai/bot/KZ9xav0Qad1U5QigEn7rh\n→ bot architect\n https://x.ai/bot/93gOz3op1UQdBdbekQFLK\n→ prompt coach\n https://x.ai/bot/BrjELcmSwatjRc8DYjtrT\n→ front door router\n https://x.ai/bot/__4FfrkUdvpdMk6-LKg5r\n→ intake inspector\n https://x.ai/bot/q7GLbLhMZDpJXBGuuci1J\n→ safety reviewer\n https://x.ai/bot/9Vmfeck_zr6jo9dO-xEBT\n→ workspace auditor\n https://x.ai/bot/JcFj23aaufNWkuiiJTX0j\n\nチーム全体を1つの憲章で動かす：書いたボットを自分でレビューしない。レビュアーが通すまでチームに入れない。\n\nまずteam leadから。タスクを渡す前に各エージェントに役割を与える。\n\nフルガイドは下 ↓ ↓"},{"id":"2108150933368779014","author":"珠音こころ(Tamaneko)","handle":"tamanekokoro","text":"Qwen3.8 27BがVRAM8GB未満で使えて元の性能96パーセント維持？？？？\nツールコールでは純正以上？\nどうなってんねんこれ","url":"https://x.com/tamanekokoro/status/2108150933368779014","createdAt":"2026-10-08T20:02:04+09:00","avatar":"https://pbs.twimg.com/profile_images/2067801488190210048/DeOSCGUj_200x200.jpg","metrics":{"views":99305,"likes":1410,"reposts":113,"replies":7},"lang":"ja"},{"id":"2108229800032878817","author":"a16z","handle":"a16z","text":"AWS CEO Matt Garman says they could sell every GPU to the frontier labs, but deliberately hold capacity back for startups to support the full ecosystem:\n\n\"We really think intentionally about our allocation strategy. We're great partners with the large frontier labs, the Anthropics and OpenAIs and Metas, and other large customers. We want to make sure we invest in them.\"\n\n\"And we're very intentional about making sure we have capacity for startups.\"\n\n\"We could sell every single GPU or AI accelerator we have to just the big frontier labs and call it a day. We choose not to, because we want to keep growing the full ecosystem.\"\n\n\"The whole ecosystem is more healthy for us, there's some diversification, but it's also that we know these are gonna be big companies over time.\"\n\n\"We say yes, in some way, shape, or form, to something like 60% of the requests we get.\"\n\n@mattsgarman @RaghuRaghuram","url":"https://x.com/a16z/status/2108229800032878817","createdAt":"2026-10-09T01:15:28+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2108229689429078017/img/Jmko-X5hDiJXChVm.jpg","avatar":"https://pbs.twimg.com/profile_images/1919488160125616128/QAZXTMEj_200x200.png","metrics":{"views":19172,"likes":87,"reposts":6,"replies":10},"lang":"en","textJa":"AWS CEOのMatt Garmanは、フロンティアラボにGPUを全部売れるが、エコシステム全体のためにスタートアップ向け容量を意図的に残していると言う：\n\n「配分戦略は本当に意図的に考えている。大型フロンティアラボ、AnthropicやOpenAIやMeta、その他大口顧客とは良いパートナーだ。彼らへの投資は確実にしたい。」\n\n「そしてスタートアップ向けの容量を確実に持つことも、非常に意図的だ。」\n\n「持っているGPUやAIアクセラレータを全部大型フロンティアラボに売って終わり、にもできる。でもそうしない。エコシステム全体を伸ばしたいからだ。」\n\n「エコシステム全体の方が健全で、分散もある。それに彼らが将来大きな会社になることも分かっている。」\n\n「来るリクエストのうち、何らかの形で約60%にYesと答えている。」\n\n@mattsgarman @RaghuRaghuram"}]}]}</script>

 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}

  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
</body>
