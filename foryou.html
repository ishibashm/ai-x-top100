<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-08T08:28:31+09:00","posts":[{"id":"2107925762720326090","author":"ClaudeDevs","handle":"ClaudeDevs","text":"Computer use and browser use toolsets are now built into the Python and TypeScript SDKs for Claude.\n\nThe API tells you what Claude wants to click or type.\n\nPreviously, you had to write your own loop and map  clicks and keystrokes to commands, but the SDKs now run the loop and send actions to drivers.","url":"https://x.com/ClaudeDevs/status/2107925762720326090","createdAt":"2026-10-08T05:07:19+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107925353373085696/img/7oMs9g80Gch8X0pF.jpg","avatar":"https://pbs.twimg.com/profile_images/2044472418815893504/xf14RxM8_200x200.png","metrics":{"views":135176,"likes":2324,"reposts":105,"replies":55},"lang":"en","textJa":"Claude用のPythonとTypeScriptのSDKに、コンピューター操作とブラウザ操作のツールセットが組み込まれました。\n\nAPIは、Claudeがどこをクリックし何を入力したいかを返します。\n\nこれまではループを自分で書き、クリックやキー入力をコマンドに対応させる必要がありましたが、今後はSDKがループを回し、操作をドライバーに送ってくれます。"},{"id":"2107800195748737042","author":"Google Labs","handle":"GoogleLabs","text":"🚨NEW EXPERIMENT 🚨\n\nPlayground is an experimental gaming platform that lets you create your own games with zero coding experience. If you can think it, you can play it.\n\nGo to https://labs.google/playground to learn more! Available to users 18+ in the US.","url":"https://x.com/GoogleLabs/status/2107800195748737042","createdAt":"2026-10-07T20:48:22+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107799852545724416/img/WNhYntRqdeywAJeF.jpg","avatar":"https://pbs.twimg.com/profile_images/1792661411102863360/fzzB7K-f_200x200.png","metrics":{"views":2068574,"likes":14075,"reposts":1353,"replies":526},"lang":"en","textJa":"🚨新しい実験🚨\n\nPlaygroundは、プログラミング経験ゼロでも自分のゲームを作れる実験的なゲームプラットフォームです。思いついたものは、そのまま遊べます。\n\n詳しくは https://labs.google/playground へ。米国の18歳以上が対象です。"},{"id":"2107585958245712263","author":"Google Antigravity","handle":"antigravity","text":"Watch how Antigravity takes an Android app from prompt to real device. Using the Stitch MCP and the Android CLI plugin, the agent pulls your designs, builds the native Jetpack Compose components, verifies them in the emulator, and runs the final build on a real phone.","url":"https://x.com/antigravity/status/2107585958245712263","createdAt":"2026-10-07T06:37:04+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107585861512519680/img/jTywP5Fyo0vW2IH6.jpg","avatar":"https://pbs.twimg.com/profile_images/1990585614279049216/-Zz6T2nk_200x200.png","metrics":{"views":89670,"likes":2020,"reposts":175,"replies":66},"lang":"en","textJa":"Antigravityが、プロンプトからAndroidアプリを実機で動かすまでの流れをご覧ください。Stitch MCPとAndroid CLIプラグインを使い、エージェントがデザインを取り込み、ネイティブのJetpack Composeコンポーネントを組み立て、エミュレーターで確認し、最後に実機のスマホでビルドを実行します。"},{"id":"2107836407616299371","author":"Google","handle":"Google","text":"Today, we're expanding SynthID Detector in partnership with @OpenAI, @NVIDIA, Kakao \u0026 soon @Apple as part of an industry-wide effort to make AI-generated content more transparent.\n\nAvailable globally in English, our verification portal lets you check if media was made with AI 🧵","url":"https://x.com/Google/status/2107836407616299371","createdAt":"2026-10-07T23:12:15+09:00","media":"https://pbs.twimg.com/media/HUCHKjvXIAAxeON.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_200x200.jpg","metrics":{"views":594961,"likes":4359,"reposts":583,"replies":199},"lang":"en","textJa":"本日、@OpenAI、@NVIDIA、Kakao、そして近く @Apple と提携し、SynthID Detectorを拡大します。AI生成コンテンツをより透明にするための業界全体の取り組みの一環です。\n\n英語で世界中に提供している検証ポータルで、メディアがAIで作られたかどうかを確認できます🧵"},{"id":"2107939129736700335","author":"mirku","handle":"mirku21","text":"holy sh*t. Official Anthropic tip for Claude Code: stop burning Opus 5.5 context on tasks Haiku 5.5 can swarm, while Sonnet 5.5 builds\n\nput the architect on call with /advisor\n\nclaude --advisor opus --subagents haiku\n\nSonnet 5.5 drives the primary session on high effort, writing diffs and running test suites\nHaiku 5.5 subagents swarm the repo in parallel at 340 tok/s, handling file discovery and spec docs lookup\nOpus 5.5 stays on call in the background as the advisor, only stepping in at three critical moments:\n\n→ before a plan locks: does the implementation plan miss auth invariants or schema contracts?\n→ when a test breaks twice: are we fixing the root cause or falling into a recursive rabbit hole?\n→ before calling done: did the full diff introduce hidden regressions or break pre-flight rules?\n\nOpus 5.5 reviews. Sonnet 5.5 builds. Haiku 5.5 swarms\n\nJev engineering runs the identical pattern one layer down: mechanical decisions that need no reasoning (which file to open, which tool to invoke, retry or abort) execute in 16ms, so the frontier models only wake up when execution paths actually diverge\n\nPlan on high. Delegate on medium. Keep Opus on call.\n\n- the full advisor setup\n\u003e Opus 5.5 on call reads full session history and catches deep architectural traps\n\u003e Sonnet 5.5 lead drives edits, writes core logic, and executes test harnesses\n\u003e Haiku 5.5 subagents swarm AST parsing, grep scans, and API docs in parallel\n\u003e JEV micro-fork layer resolves 1,500+ mechanical routing branches in under 16ms\n\u003e advisor stays completely silent on routine bash execution to protect context\n\npaste the setup and this prompt into Claude Code below:\n\n\"Configure my Claude Code workspace for hierarchical advisor orchestration:\n\n1. Audit ~/.claude/settings.json and project config for model roles fitting lead, subagents, and advisor:\n\u003e Pin main session model: sonnet with effortLevel: high for primary execution\n\u003e Pin subagents model: haiku with effortLevel: medium for parallel file discovery and docs retrieval\n\u003e Pin advisor model: opus on call for strategic review\n\n2. Enable the advisor tool in ~/.claude/settings.json:\n\u003e Set advisorModel to claude-opus-5-5\n\u003e Enable subagent parallel dispatcher pool (3x workers)\n\n3. Configure automatic advisor consultation checkpoints in ~/.claude/CLAUDE.md:\n\u003e Consult /advisor opus before finalizing multi-file architecture plans\n\u003e Automatically summon /advisor opus when the same test or compiler error fails twice\n\u003e Enforce advisor diff contract audit before declaring tasks complete or staging git commits\n\n4. Constrain subagent scopes:\n\u003e Haiku subagents return structured AST summaries and docs snippets only without modifying main session context\n\nShow every configuration diff first. Do not apply edits until confirmed\"\n\n↳\nhttp://code.claude.com/docs/en/advisor","url":"https://x.com/mirku21/status/2107939129736700335","createdAt":"2026-10-08T06:00:26+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107938569968885760/img/lTf2HNaW541S_Q1K.jpg","avatar":"https://pbs.twimg.com/profile_images/2094114906672967681/dlYMMUcH_200x200.jpg","metrics":{"views":23730,"likes":274,"reposts":10,"replies":10},"lang":"en","textJa":"マジかよ。Claude Code向けのAnthropic公式Tip：Haiku 5.5の群れで片付く作業にOpus 5.5のコンテキストを浪費するのはやめよう。その間にSonnet 5.5が実装する\n\n/advisor で設計役を待機させる\n\nclaude --advisor opus --subagents haiku\n\nSonnet 5.5がメインセッションを高エフォートで回し、差分を書いてテストスイートを実行\nHaiku 5.5のサブエージェントが340 tok/sでリポジトリを並列に探索し、ファイル探しや仕様書の参照を担当\nOpus 5.5はアドバイザーとして裏で待機し、重要な3つの場面だけで介入する：\n\n→ 計画を確定する前：実装計画が認証の不変条件やスキーマの契約を見落としていないか？\n→ 同じテストが2回失敗したとき：根本原因を直しているのか、堂々巡りにはまっていないか？\n→ 完了と言う前：差分全体に隠れたリグレッションや事前ルール違反がないか？\n\nOpus 5.5がレビューし、Sonnet 5.5が作り、Haiku 5.5が群れで動く\n\nJevのエンジニアリングは同じパターンを一段下の層で回している：推論のいらない機械的な判断（どのファイルを開くか、どのツールを呼ぶか、再試行か中止か）は16msで実行し、実行経路が本当に分岐したときだけ最先端モデルを起こす\n\n計画はhigh、委任はmedium、Opusは待機。\n\n- アドバイザー構成の全体\n\u003e 待機中のOpus 5.5がセッション履歴全体を読み、設計上の深い落とし穴を見つける\n\u003e リードのSonnet 5.5が編集、コアロジックの実装、テストハーネスの実行を担当\n\u003e Haiku 5.5のサブエージェントがAST解析、grep検索、APIドキュメント参照を並列で処理\n\u003e JEVのマイクロフォーク層が1,500以上の機械的な分岐を16ms未満で処理\n\u003e コンテキストを守るため、アドバイザーは通常のbash実行中は完全に黙っている\n\n以下の設定とプロンプトをClaude Codeに貼り付けよう：\n\n「Claude Codeのワークスペースを階層型アドバイザー構成に設定して：\n\n1. ~/.claude/settings.json とプロジェクト設定を確認し、リード・サブエージェント・アドバイザーに合うモデルの役割を設定：\n\u003e メインセッションのモデルを sonnet、effortLevel: high に固定（主な実行用）\n\u003e サブエージェントのモデルを haiku、effortLevel: medium に固定（並列のファイル探索とドキュメント取得用）\n\u003e アドバイザーのモデルを opus に固定（戦略レビュー用に待機）\n\n2. ~/.claude/settings.json でアドバイザーツールを有効化：\n\u003e advisorModel を claude-opus-5-5 に設定\n\u003e サブエージェントの並列ディスパッチャープール（ワーカー3倍）を有効化\n\n3. ~/.claude/CLAUDE.md に自動アドバイザー相談のチェックポイントを設定：\n\u003e 複数ファイルにまたがる設計計画を確定する前に /advisor opus に相談\n\u003e 同じテストやコンパイルエラーが2回失敗したら自動で /advisor opus を呼ぶ\n\u003e タスク完了の宣言やgitコミットのステージ前に、アドバイザーによる差分の契約監査を必須にする\n\n4. サブエージェントの範囲を制限：\n\u003e Haikuのサブエージェントは構造化されたAST要約とドキュメントの抜粋だけを返し、メインセッションのコンテキストは変更しない\n\nすべての設定差分を先に見せて。確認するまで編集は適用しないこと」\n\n↳\nhttp://code.claude.com/docs/en/advisor"},{"id":"2107573957415358850","author":"あさひ｜教頭先生のAI活用術","handle":"asahi_ai_x","text":"これはすごい！OpenAI CEOサム・アルトマンが語ったdotsの衝撃の使い方\n\n動画を見て、思わず声が出ました。\nOpenAIのCEOサム・アルトマン本人が、ChatGPTの新機能「dots」の使い方を赤裸々に語ったのです。\n「dotsは、朝の主導権を取り戻してくれた初めてのもの」","url":"https://x.com/asahi_ai_x/status/2107573957415358850","createdAt":"2026-10-07T05:49:22+09:00","media":"https://pbs.twimg.com/media/HT80LRqaIAAA2Fv.jpg","avatar":"https://pbs.twimg.com/profile_images/2063513347346272256/hUry1NlE_200x200.jpg","metrics":{"views":16864,"likes":114,"reposts":17,"replies":2}},{"id":"2107908322368360477","author":"Miles Deutscher","handle":"milesdeutscher","text":"Opus 5.5 + Jev is extremely powerful.\n\nIt's literally 200x faster and 400x cheaper than running Claude alone.\n\nSend this prompt to Claude, and it will tell you exactly how to set up:","url":"https://x.com/milesdeutscher/status/2107908322368360477","createdAt":"2026-10-08T03:58:01+09:00","media":"https://pbs.twimg.com/media/HUDLctcaMAAqz4r.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2043255869513601025/wFHeLjZX_200x200.jpg","metrics":{"views":32156,"likes":190,"reposts":16,"replies":14},"lang":"en","textJa":"Opus 5.5 + Jev はめちゃくちゃ強力です。\n\nClaude単体で動かすより、文字通り200倍速く400倍安い。\n\nこのプロンプトをClaudeに送れば、セットアップ方法を正確に教えてくれます："},{"id":"2107894997538525580","author":"OpenAI","handle":"OpenAI","text":"GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot.","url":"https://x.com/OpenAI/status/2107894997538525580","createdAt":"2026-10-08T03:05:04+09:00","media":"https://pbs.twimg.com/media/HUDAEy0a4AAdfz8.jpg","avatar":"https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_200x200.jpg","metrics":{"views":2079234,"likes":14372,"reposts":1026,"replies":654},"lang":"en","textJa":"GPT-6とIntelligent UIを、ChatGPTの全ユーザーに順次提供開始します。\n\nChatGPTのIntelligent UIは、速くてインタラクティブな回答を届けます。日常の質問はより視覚的に、複雑なテーマはより分かりやすくなり、作業に使えるインタラクティブなツールがその場で使えます。"},{"id":"2107868866361930236","author":"Unsloth AI","handle":"UnslothAI","text":"You can now train your own Decision model like Jev locally!\n\nWe increased Qwen3.5 0.8B’s aggregate accuracy from 20.7% to 74.3% across 3 decision benchmarks - on just 4GB VRAM.\n\nTurn any LLM like Qwen3.8, Gemma 4 into decision models with our open-source Unsloth repo.\n\nWe fine-tuned with a Clef head using Unsloth and LoRA (r=64) for one epoch, increasing downstream accuracy from 30–37% to 78%.\n\nGitHub: https://github.com/unslothai/unsloth\nGuide and Notebooks: https://unsloth.ai/docs/basics/train-your-own-decision-model-with-unsloth","url":"https://x.com/UnslothAI/status/2107868866361930236","createdAt":"2026-10-08T01:21:14+09:00","media":"https://pbs.twimg.com/media/HUCnWt5bMAAmqLB.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2036313340616777728/OLALWB2__200x200.jpg","metrics":{"views":88646,"likes":2173,"reposts":252,"replies":72},"lang":"en","textJa":"Jevのような判断（Decision）モデルを、ローカルで自分で学習できるようになりました！\n\nQwen3.5 0.8Bの3つの判断ベンチマークでの総合精度を20.7%から74.3%に引き上げました。必要なVRAMはわずか4GBです。\n\nオープンソースのUnslothリポジトリで、Qwen3.8やGemma 4などのLLMを判断モデルに変えられます。\n\nUnslothとLoRA（r=64）でClefヘッドを付けて1エポック微調整し、下流タスクの精度を30〜37%から78%に向上させました。\n\nGitHub: https://github.com/unslothai/unsloth\nガイドとノートブック: https://unsloth.ai/docs/basics/train-your-own-decision-model-with-unsloth"},{"id":"2107403724478128498","author":"東大ClaudeCode研究所","handle":"ClaudeCode_UT","text":"Claude Codeえぐい\nナレーションの録音なしで5選ショートを制作できる方法見つけた😱\n\n1：dotに「仕事が速くなるGmailの機能5選を作りたい」と伝える\n2：dotからClaude Codeへ台本・画像・ゆっくり音声の制作を渡す\n3：Claude Codeで声のタイミングに合わせて動画を書き出す\n\nAIに台本も声も編集も頼める時代だから今のうちにチャレンジしてみるのがいい\n\n制作に渡す指示はリプに👇","url":"https://x.com/ClaudeCode_UT/status/2107403724478128498","createdAt":"2026-10-06T18:32:56+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107403684183506944/img/Tq_We-q7mlcPMIIQ.jpg","avatar":"https://pbs.twimg.com/profile_images/2045968105172766720/_u891Zxq_200x200.jpg","metrics":{"views":83002,"likes":766,"reposts":43,"replies":7},"lang":"ja"},{"id":"2107804633238327717","author":"kiosa","handle":"thegreatest_sv","text":"the NSA put its own hacking tool on GitHub and most people still haven't opened it\n\n5 security repos that show you how exposed you actually are. all free, all open source.\n\nwant to see every account tied to your username across the internet?\n\n-\u003e Sherlock\nhttps://github.com/sherlock-project/sherlock\n\nwant to take any program apart and read what it really does?\n\n-\u003e Ghidra, the reverse engineering framework built by the NSA\nhttps://github.com/NationalSecurityAgency/ghidra\n\nwant to watch everything your phone apps send home?\n\n-\u003e mitmproxy\nhttps://github.com/mitmproxy/mitmproxy\n\nwant to know if your API keys and passwords are already sitting in your git history?\n\n-\u003e TruffleHog\nhttps://github.com/trufflesecurity/trufflehog\n\nwant to test your own WiFi and Bluetooth with a $10 chip?\n\n-\u003e ESP32 Marauder\nhttps://github.com/justcallmekoko/ESP32Marauder\n\n~260k stars of tools that professionals get paid to run.\n\nnone of this is hidden. it's the same kit pentesters use on the job.\n\nthe catch: it's only legal on things you own or have written permission to test.\n\nthe best way to learn how you get hacked is to run the attack on yourself first.\n\nbookmark this. pick one. point it at your own stuff tonight.","url":"https://x.com/thegreatest_sv/status/2107804633238327717","createdAt":"2026-10-07T21:06:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107766717808029696/img/afl1Ei0C0MoGiW8P.jpg","avatar":"https://pbs.twimg.com/profile_images/2049557081502752768/gymBLMZ8_200x200.jpg","metrics":{"views":15614,"likes":304,"reposts":41,"replies":9},"lang":"en","textJa":"NSAが自前のハッキングツールをGitHubに公開しているのに、ほとんどの人はまだ開いてもいない\n\n自分がどれだけ無防備かがわかるセキュリティ系リポジトリ5選。すべて無料・オープンソース。\n\n自分のユーザー名に紐づくネット上のアカウントを全部見たい？\n\n-\u003e Sherlock\nhttps://github.com/sherlock-project/sherlock\n\nどんなプログラムも分解して中身を読みたい？\n\n-\u003e Ghidra（NSA製のリバースエンジニアリング基盤）\nhttps://github.com/NationalSecurityAgency/ghidra\n\nスマホアプリが外部に送っている通信を全部見たい？\n\n-\u003e mitmproxy\nhttps://github.com/mitmproxy/mitmproxy\n\nAPIキーやパスワードがgitの履歴に残っていないか知りたい？\n\n-\u003e TruffleHog\nhttps://github.com/trufflesecurity/trufflehog\n\n10ドルのチップで自分のWi-FiとBluetoothをテストしたい？\n\n-\u003e ESP32 Marauder\nhttps://github.com/justcallmekoko/ESP32Marauder\n\n合計約26万スター。プロがお金をもらって使うツールだ。\n\nどれも隠されたものではなく、ペネトレーションテスターが仕事で使うのと同じ道具。\n\n注意：使っていいのは自分の持ち物か、書面で許可を得た対象だけ。\n\n攻撃される仕組みを学ぶ一番の方法は、まず自分に対してやってみること。\n\nブックマークして、ひとつ選んで、今夜自分の環境で試そう。"},{"id":"2107720795707580559","author":"Csaba Kissi","handle":"csaba_kissi","text":"http://chatgpt.com/plugins/explain - Turn ChatGPT conversations into explainer videos\nhttp://github.com/shadcn-labs/mcpcn - Open-source React components\nhttp://animated-icons-nu.vercel.app - 207 open-source animated React icons\nhttp://gradually.ai/en/claude-code-skills - 400+ curated Claude Code skills\nhttp://viewportui.com - free UI design inspiration directory","url":"https://x.com/csaba_kissi/status/2107720795707580559","createdAt":"2026-10-07T15:32:51+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107720759477223424/img/_Ma9UjYZQJGeQ_-_.jpg","avatar":"https://pbs.twimg.com/profile_images/1454861068233228289/6sn9BYOf_200x200.jpg","metrics":{"views":6814,"likes":66,"reposts":8,"replies":17},"lang":"en","textJa":"http://chatgpt.com/plugins/explain - ChatGPTの会話を解説動画に変換\nhttp://github.com/shadcn-labs/mcpcn - オープンソースのReactコンポーネント\nhttp://animated-icons-nu.vercel.app - オープンソースのアニメーション付きReactアイコン207個\nhttp://gradually.ai/en/claude-code-skills - 厳選されたClaude Codeスキル400以上\nhttp://viewportui.com - 無料のUIデザイン参考ディレクトリ"},{"id":"2107837061327638757","author":"unicode","handle":"unicodef1wn","text":"holy f*ck, the best Grok bots were built by SpaceXAI's own engineers and they're free\n\nyou don't need to build a grok bot from scratch. xAI's own team already shipped 49 you can install right now\n\nevery single one built by their engineers, tested, and live in the marketplace\n\ntrading bots, research agents, support bots, content bots, all one click away\n\npeople charge $50-200 for bots like these on other platforms\n\nthis section is free\n\nno prompt engineering, no config files, no 72-hour build\n\npick one, hit install, it's already doing the job\n\nmost people are still writing their first agent from zero\n\n49 are already shipped, running, and cost nothing\n\ncheck the marketplace below ⭣","url":"https://x.com/unicodef1wn/status/2107837061327638757","createdAt":"2026-10-07T23:14:51+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107836934043144192/img/xWj2xwx5tfenN_sC.jpg","avatar":"https://pbs.twimg.com/profile_images/2069360360763576321/Id-DSoyU_200x200.jpg","metrics":{"views":40366,"likes":489,"reposts":38,"replies":25},"lang":"en","textJa":"ヤバい、最高のGrok BotはSpaceXAIのエンジニア自身が作っていて、しかも無料\n\nGrok Botをゼロから作る必要はない。xAIのチームがすでに49個を公開していて、今すぐインストールできる\n\nどれも彼らのエンジニアが作ってテスト済みで、マーケットプレイスで公開中\n\nトレーディングBot、リサーチエージェント、サポートBot、コンテンツBot、全部ワンクリック\n\n他のプラットフォームなら、こういうBotに50〜200ドル取られる\n\nこのセクションは無料\n\nプロンプト設計も設定ファイルも、72時間の構築作業もいらない\n\n選んでインストールするだけで、もう仕事をしてくれる\n\nほとんどの人はまだ最初のエージェントをゼロから書いている\n\n49個がすでに公開・稼働中で、費用はゼロ\n\nマーケットプレイスは下から⭣"},{"id":"2107697003899846720","author":"Elon Musk","handle":"elonmusk","text":"It really is","url":"https://x.com/elonmusk/status/2107697003899846720","createdAt":"2026-10-07T13:58:19+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":4487358,"likes":14644,"reposts":1061,"replies":1256},"lang":"en","textJa":"本当にそうだ"},{"id":"2107809632689246458","author":"roman","handle":"Nozelcode","text":"CLAUDE TEAM GRATIS DURANTE 1 AÑO + 1.000 $ PARA SU API\n\nAnthropic ofrece este paquete a las startups que apruebe en su programa.\n\nEstán aprobando a bastante gente, con casos de acceso en apenas 2–5 minutos.\n\nY si acabas de crear tu startup o tienes un proyecto arrancando, también puedes solicitarlo.\n\nEsto es lo que incluye:\n\n→ 1 año de Claude Team gratis\n→ Hasta 5 plazas Premium para tu equipo\n→ 1.000 $ en créditos para la API de Claude\n→ Hasta 45.000 $ en ofertas de partners\n→ Sesiones de consulta con el equipo de Anthropic\n\nCómo lo solicitas?\n\n1. Crea una cuenta en Claude Console\n2. Solicita acceso al programa de startups de Claude\n3. Usa el correo y la web de tu empresa\n4. Explica qué estás construyendo\n5. Espera la aprobación\n\nLiteralmente se tarda 5 minutos, no pierdes nada por intentarlo.\n\nSi estás montando una startup, guarda esto antes de pagar tu próxima suscripción 🔖","url":"https://x.com/Nozelcode/status/2107809632689246458","createdAt":"2026-10-07T21:25:52+09:00","media":"https://pbs.twimg.com/media/HUBxr_EXIAABIYA.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2073450678727380992/6NTjm6pf_200x200.jpg","metrics":{"views":143567,"likes":322,"reposts":19,"replies":39},"lang":"es","textJa":"Claude Teamが1年間無料＋API用に1,000ドル\n\nAnthropicは、自社プログラムで承認したスタートアップにこのパッケージを提供しています。\n\nかなり多くの人が承認されていて、わずか2〜5分でアクセスできた例もあります。\n\n起業したばかりの人や、立ち上げ中のプロジェクトがある人も申請できます。\n\n内容はこちら：\n\n→ Claude Teamが1年間無料\n→ チーム向けPremium席が最大5つ\n→ Claude APIのクレジット1,000ドル\n→ パートナー特典が最大45,000ドル分\n→ Anthropicチームとの相談セッション\n\n申請方法は？\n\n1. Claude Consoleでアカウントを作る\n2. Claudeのスタートアッププログラムへのアクセスを申請する\n3. 会社のメールアドレスとWebサイトを使う\n4. 何を作っているかを説明する\n5. 承認を待つ\n\n文字通り5分で終わるし、試して損はありません。\n\nスタートアップを立ち上げ中なら、次のサブスク料金を払う前にこれを保存しておこう🔖"},{"id":"2107830533078028621","author":"Accel","handle":"Accel","text":"In just over two weeks, AI Innovate is coming to Paris! Are you a future founder with a great idea and ready to build in a day?\n\nJoin the hackathon with our friends at @aiven_io, @HackIterate, Hackathon Hub and @Lovable . Applications are now open: https://builderbase.com/event/accel-ai-innovate-paris\n\nWe’ll also be joined for a fireside chat with @ElevenLabs  @mati so don’t miss the chance to secure your spot! https://luma.com/kbh75rj8","url":"https://x.com/Accel/status/2107830533078028621","createdAt":"2026-10-07T22:48:55+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107830045595029504/img/L6OvyUac25VtP5Ja.jpg","avatar":"https://pbs.twimg.com/profile_images/1844347012033953794/lQLZCgKo_200x200.jpg","metrics":{"views":4434,"likes":11,"reposts":4,"replies":3},"lang":"en","textJa":"あと2週間ちょっとで、AI Innovateがパリにやって来ます！素晴らしいアイデアを持ち、1日で作り上げる準備ができている未来の創業者ですか？\n\n@aiven_io、@HackIterate、Hackathon Hub、@Lovable の仲間と一緒にハッカソンに参加しよう。応募受付中です：https://builderbase.com/event/accel-ai-innovate-paris\n\n@ElevenLabs の @mati との対談もあるので、ぜひ席を確保してください！ https://luma.com/kbh75rj8"},{"id":"2107915949634679096","author":"Pranav Reddy","handle":"AI_Screening","text":"Claude Haiku 5.5 vs. GPT 6 Sol vs. GPT 6 Luna\n\n\u003eHaiku 5.5 is clearly mogging 6 sol\n\n\u003eOpenAI runs on hype, Anthropic runs on models.","url":"https://x.com/AI_Screening/status/2107915949634679096","createdAt":"2026-10-08T04:28:20+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107915805103128576/img/Hudvm0lTuWTKJwdk.jpg","avatar":"https://pbs.twimg.com/profile_images/2099720207262683137/Rjw3i6jY_200x200.jpg","metrics":{"views":16185,"likes":164,"reposts":5,"replies":18},"lang":"en","textJa":"Claude Haiku 5.5 vs GPT 6 Sol vs GPT 6 Luna\n\n\u003eHaiku 5.5が6 Solを明らかに圧倒してる\n\n\u003eOpenAIは話題性で動き、Anthropicはモデルで動く。"},{"id":"2107774401273790759","author":"Pankaj Kumar","handle":"pankajkumar_dev","text":"Gemini 4 Argon Coming Today \n\n- There is a high chance Gemini 4 Argon is coming today. If there's no delay, today or tomorrow is most likely the launch.\n- Pricing: Global: $4 input / $20 output\n- Flex/Batch: $2 input / $10 output\n- Global cached input: $0.20/M\n- Flex/Batch cached input: $0.10/M\n\nFinally, its not far. Its already in Google Cloud, so yeah, high chances of a launch today.","url":"https://x.com/pankajkumar_dev/status/2107774401273790759","createdAt":"2026-10-07T19:05:52+09:00","media":"https://pbs.twimg.com/media/HUBRjJCaAAA_VbK.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1890456101507985409/OfN0Ljnv_200x200.jpg","metrics":{"views":117451,"likes":1629,"reposts":100,"replies":63},"lang":"en","textJa":"Gemini 4 Argonが今日来る\n\n- Gemini 4 Argonが今日来る可能性が高い。遅れがなければ、今日か明日の公開が最有力。\n- 料金：グローバル 入力$4／出力$20\n- Flex/Batch：入力$2／出力$10\n- グローバルのキャッシュ入力：$0.20/M\n- Flex/Batchのキャッシュ入力：$0.10/M\n\nいよいよ近い。すでにGoogle Cloudに載っているので、今日公開の可能性は高い。"},{"id":"2107950235540394264","author":"Bober_smart","handle":"Bober_smart","text":"$GLITCH is officially released\n\nThis token symbolizes an absolutely new approach to finding promising projects on GitHub\n\nhttps://github.com/Bobersmart/gitalpha\n\nGFPTqLRE4Mj5vWdBKGmvuTrNc28d2irKj5jQZgBupump\n\nGitAlpha with the AI agent Glitch is a cyber-scout for GitHub that finds Web3 and AI \"alpha\" (early trends, hidden projects, and secret testnets) weeks before they appear on social media\n\nHow it works:\n\nTracks top devs: Monitors developers from OpenAI, Paradigm, Solana, and Ethereum\n\nLooks for quiet signals: Understands when pros en masse star new repos, push thousands of lines of code without announcements, or hide testnet contracts in code\n\nEvaluates code via LLM: Analyzes architecture (Rust, Cairo) and gives a 10/10 score to projects with ideal code that still have 0 mentions on X \n\nDelivers results: Generates clear analytical cards instead of raw text","url":"https://x.com/Bober_smart/status/2107950235540394264","createdAt":"2026-10-08T06:44:34+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107950198693462016/img/wsKM8DOvFHEJok-t.jpg","avatar":"https://pbs.twimg.com/profile_images/2050347090543300608/p1PlS_hc_200x200.jpg","metrics":{"views":1754,"likes":23,"reposts":5,"replies":3},"lang":"en","textJa":"$GLITCH が正式にリリースされました\n\nこのトークンは、GitHubで有望なプロジェクトを見つけるまったく新しいアプローチを象徴しています\n\nhttps://github.com/Bobersmart/gitalpha\n\nGFPTqLRE4Mj5vWdBKGmvuTrNc28d2irKj5jQZgBupump\n\nAIエージェントGlitchを搭載したGitAlphaは、GitHubのサイバー偵察役。Web3やAIの「アルファ」（初期のトレンド、隠れたプロジェクト、非公開のテストネット）を、SNSに出る数週間前に見つけます\n\n仕組み：\n\nトップ開発者を追跡：OpenAI、Paradigm、Solana、Ethereumの開発者を監視\n\n静かなシグナルを探す：プロが一斉に新しいリポジトリにスターを付けたり、告知なしに何千行ものコードをプッシュしたり、コード内にテストネットのコントラクトを隠したりするタイミングを把握\n\nLLMでコードを評価：アーキテクチャ（Rust、Cairo）を分析し、理想的なコードなのにXでの言及がゼロのプロジェクトに10/10を付ける\n\n結果を届ける：生のテキストではなく、分かりやすい分析カードを生成"},{"id":"2107786821187109085","author":"Marko Denic","handle":"denicmarko","text":"Call me old school, but if it's production code, I still read it.\n\nWho can relate?","url":"https://x.com/denicmarko/status/2107786821187109085","createdAt":"2026-10-07T19:55:13+09:00","avatar":"https://pbs.twimg.com/profile_images/1308385514744098816/oDXuaci__200x200.jpg","metrics":{"views":6080,"likes":26,"reposts":1,"replies":10},"lang":"en","textJa":"古いと言われるかもしれないけど、本番コードならやっぱり自分で読む。\n\n共感する人いる？"},{"id":"2107863666788069664","author":"Swapna Kumar Panda","handle":"swapnakpanda","text":"Me: Knock knock!!!\n\nMy Builder Friend: What's up bro?\n\nMe: How's your startup idea going?\n\nFriend: Don't ask it. I am still stuck in the frontend.\n\nMe: Never mind. Why don't you try Myndlab?\n\nFriend: Naah. No more AI tool.\n\nMe: Hey. It's not like any ordinary tool. Describe your idea and it'll generate not only the front end, but your backend and database too.\n\nFriend: WTH\n\nMe: Not just that. You own that code. You ship it wherever you wish.\n\nFriend: I am sure it'll just generate some sample code. That's it.\n\nMe: No. You choose your programming language. And it'll generate production ready code.\n\nFriend: You are influencing me here bro. But you know what, it sounds really interesting. I will give it a try.\n\nMe: 😀 You'll definitely thank me later. C ya.","url":"https://x.com/swapnakpanda/status/2107863666788069664","createdAt":"2026-10-08T01:00:35+09:00","avatar":"https://pbs.twimg.com/profile_images/1621910730227449856/iW8AGVCr_200x200.jpg","metrics":{"views":2510,"likes":8,"reposts":0,"replies":1},"lang":"en","textJa":"僕：コンコン！！！\n\n開発者の友達：どうした？\n\n僕：スタートアップのアイデア、どう？\n\n友達：聞かないで。まだフロントエンドで詰まってる。\n\n僕：気にするなって。Myndlab試してみたら？\n\n友達：いや、AIツールはもういい。\n\n僕：いやいや、普通のツールとは違うんだ。アイデアを説明するだけで、フロントエンドだけじゃなくバックエンドとデータベースまで作ってくれる。\n\n友達：マジか\n\n僕：それだけじゃない。コードは自分のもの。どこにでもデプロイできる。\n\n友達：どうせサンプルコードを出すだけだろ。\n\n僕：違う。プログラミング言語を選べて、本番で使えるコードを生成してくれる。\n\n友達：乗せられてる気がするけど、正直かなり面白そう。試してみるよ。\n\n僕：😀 絶対あとで感謝するよ。じゃあね。"},{"id":"2107850189855953306","author":"a16z","handle":"a16z","text":"🇯🇵","url":"https://x.com/a16z/status/2107850189855953306","createdAt":"2026-10-08T00:07:01+09:00","avatar":"https://pbs.twimg.com/profile_images/1919488160125616128/QAZXTMEj_200x200.png","metrics":{"views":19460,"likes":224,"reposts":12,"replies":7},"lang":"art","textJa":"🇯🇵"},{"id":"2107822699582300545","author":"vincent","handle":"SPCX100T","text":"$SPCX : Daniel Ives @DivesTech from Yorkville Ives \u0026 Co Initiated Buy Rating with a $225 Target Price.","url":"https://x.com/SPCX100T/status/2107822699582300545","createdAt":"2026-10-07T22:17:47+09:00","avatar":"https://pbs.twimg.com/profile_images/2059379945898450945/mdca7HgW_200x200.jpg","metrics":{"views":4974,"likes":49,"reposts":2,"replies":0},"lang":"en","textJa":"$SPCX：Yorkville Ives \u0026 Co の Daniel Ives（@DivesTech）が、目標株価225ドルで「買い」評価を開始。"},{"id":"2107780945319248084","author":"CNN Breaking News","handle":"cnnbrk","text":"The 2026 Nobel Prize in chemistry is awarded to two \"revolutionary\" scientists for unraveling the mystery of how molecules exist in non-identical mirror images of each other https://cnn.it/4ybLQ23","url":"https://x.com/cnnbrk/status/2107780945319248084","createdAt":"2026-10-07T19:31:52+09:00","media":"https://pbs.twimg.com/media/HUBXmbCWsAAARG6.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/925092227667304448/fAY1HUu3_200x200.jpg","metrics":{"views":1313849,"likes":252,"reposts":61,"replies":52},"lang":"en","textJa":"2026年のノーベル化学賞は、分子が互いに重ならない鏡像の形で存在する仕組みの謎を解き明かした、2人の「革命的」な科学者に贈られます https://cnn.it/4ybLQ23"},{"id":"2107937759952298030","author":"TrendSpider","handle":"TrendSpider","text":"Qullamaggie built $100M on 3 setups.\n\nHere's the full playbook for one of them: the Episodic Pivot. 👇","url":"https://x.com/TrendSpider/status/2107937759952298030","createdAt":"2026-10-08T05:55:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107909026184847360/img/3ugp6tBozCOqD_VY.jpg","avatar":"https://pbs.twimg.com/profile_images/1612435685851680769/_4qCMu8F_200x200.jpg","metrics":{"views":23885,"likes":55,"reposts":6,"replies":19},"lang":"en","textJa":"Qullamaggieは3つのセットアップで1億ドルを築いた。\n\nそのうちの1つ「エピソディック・ピボット」の完全なプレイブックがこちら👇"},{"id":"2107725669962580350","author":"U.S. Politics Alert","handle":"USPoliticsAlert","text":"🆕 @dc_draino has started following @PalmerLuckey\n\nPreviously followed by: @timsweeneyepic, @chrisbarrett, @jessebwatters, @natemorris, @drewhouston \u0026 148 more\n\n$META","url":"https://x.com/USPoliticsAlert/status/2107725669962580350","createdAt":"2026-10-07T15:52:14+09:00","media":"https://pbs.twimg.com/media/HUAlU9VW8AA0zZj.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1915706855956869120/LJl80VPq_200x200.jpg","metrics":{"views":931,"likes":4,"reposts":0,"replies":0},"lang":"en","textJa":"🆕 @dc_draino が @PalmerLuckey のフォローを開始\n\nこれまでのフォロワー：@timsweeneyepic、@chrisbarrett、@jessebwatters、@natemorris、@drewhouston ほか148人\n\n$META"},{"id":"2107748430869324081","author":"Sac","handle":"Saccc_c","text":"Codex 的插件扩展功能对插件迎来了史诗级别的增强，分享几个我常用的扩展插件：\n\n1、Code Review （如图1、图2）：无需打开GitHub，在Codex里清晰查看所有PR信息，支持一键PR审核、合并，甚至还可以自定义代码审查标准\n\n2、MagicPath （如图3）：Agent和人可以共同交互的画布，可用于前端、视频或文章封面图的设计\n\n3、tldraw ( 如图4）：在线协作白板，非常适合用于制作流程图，youtube 上很多博主都是将这种流程图用于视频的衔接段，比如我最喜欢的 Riley","url":"https://x.com/Saccc_c/status/2107748430869324081","createdAt":"2026-10-07T17:22:40+09:00","media":"https://pbs.twimg.com/media/HUAbenuaQAAZp6G.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2081939362808520704/FwzCMH0g_200x200.jpg","metrics":{"views":14688,"likes":111,"reposts":10,"replies":10},"lang":"zh","textJa":"Codexのプラグイン拡張機能が、史上最大級の強化を受けました。よく使う拡張プラグインをいくつか紹介します：\n\n1、Code Review（図1、図2）：GitHubを開かずに、Codexの中ですべてのPR情報をはっきり確認でき、ワンクリックでのPRレビューやマージに対応。コードレビューの基準も自分で設定できます\n\n2、MagicPath（図3）：エージェントと人が一緒に操作できるキャンバス。フロントエンドや動画、記事のカバー画像のデザインに使えます\n\n3、tldraw（図4）：オンライン共同ホワイトボード。フローチャート作りにぴったりで、YouTubeでも多くの人がこうしたフローチャートを動画のつなぎに使っています。私の好きなRileyもその一人です"},{"id":"2107963811646881878","author":"Hark","handle":"hark_labs","text":"While you enjoy this scroll, Hark can:\n\n𝗦𝗰𝗵𝗲𝗱𝘂𝗹𝗲 𝘁𝗵𝗲 𝗱𝗼𝗰𝘁𝗼𝗿. Hark finds one who takes your insurance and is accepting new patients, books the earliest slot that works for your schedule, and adds it to your calendar. Then it files insurance claims you need.\n\n𝗠𝗮𝗸𝗲 𝗮 𝗗𝗠𝗩 𝗮𝗽𝗽𝗼𝗶𝗻𝘁𝗺𝗲𝗻𝘁. Hark spots that your license is expiring and handles the forms, coordination, and booking required to get you a new one on time. \n\n𝗖𝗮𝗻𝗰𝗲𝗹 𝗮 𝘀𝘂𝗯𝘀𝗰𝗿𝗶𝗽𝘁𝗶𝗼𝗻. Hark notices an unused subscription is about to renew, works through the cancel flow to the end, confirms the cancellation, and sets a reminder before any final charge.\n\n𝗛𝗮𝗻𝗱𝗹𝗲 𝘁𝗿𝗶𝗽 𝗹𝗼𝗴𝗶𝘀𝘁𝗶𝗰𝘀. Hark flags and handles and visa applications, books your flights, hotel, and dinners, and updates your calendar with travel times in mind.\n\n𝗖𝗹𝗼𝘀𝗲 𝗼𝘂𝘁 𝘆𝗼𝘂𝗿 𝗲𝘅𝗽𝗲𝗻𝘀𝗲𝘀. Hark lists charges and missing receipts on a bills panel, finds each receipt in your inbox, and submits it.\n\n𝗥𝗲𝘀𝘁𝗼𝗰𝗸 𝘆𝗼𝘂𝗿 𝗴𝗿𝗼𝗰𝗲𝗿𝗶𝗲𝘀. Hark builds the weekly cart from what you actually buy, applies your substitution rules, books your delivery window, and checks out.\n\n𝗛𝗮𝗻𝗱𝗹𝗲 𝗮 𝗿𝗲𝘁𝘂𝗿𝗻. Hark starts the return, picks the drop-off, and files the claim if the refund never comes through. \n\n𝗚𝗲𝘁 𝗵𝗲𝗹𝗽 𝗮𝘁 𝗵𝗼𝗺𝗲. Hark finds and vets a cleaner, plumber, mover, electrician, or handyman and books them online to suit your schedule.\n\n𝗦𝗲𝗻𝗱 𝗿𝗲𝗺𝗶𝗻𝗱𝗲𝗿𝘀 𝘆𝗼𝘂 𝗵𝗮𝘃𝗲𝗻'𝘁 𝘁𝗵𝗼𝘂𝗴𝗵𝘁 𝗼𝗳. Flights, car insurance renewals, lease dates, and a friend's birthday next Saturday turn into reminders automatically, before you think of them.\n\n𝗥𝗲𝗮𝗱𝘆 𝘆𝗼𝘂𝗿 𝘄𝗲𝗲𝗸𝗲𝗻𝗱. Hark recommends concerts, comedy shows, and events near you to buy the tickets you choose, and plans parking, dinner, and anything else you need to make it happen.","url":"https://x.com/hark_labs/status/2107963811646881878","createdAt":"2026-10-08T07:38:31+09:00","avatar":"https://pbs.twimg.com/profile_images/2106884838095753216/CrDRS7u-_200x200.jpg","metrics":{"views":2560,"likes":83,"reposts":5,"replies":14},"lang":"en","textJa":"あなたがこのスクロールを楽しんでいる間に、Harkはこんなことができます：\n\n通院の予約。保険が使えて新規患者を受け付けている医師を探し、あなたの予定に合う最短の枠を予約してカレンダーに追加。必要な保険請求も行います。\n\n免許センターの予約。免許の期限切れが近いことに気づき、期限内に新しい免許を受け取るための書類、調整、予約を引き受けます。\n\nサブスクの解約。使っていないサブスクの更新が近いことに気づき、解約手続きを最後まで進めて解約を確認し、最終請求の前にリマインダーを設定します。\n\n旅行の手配。ビザ申請を見つけて対応し、航空券、ホテル、ディナーを予約し、移動時間を考慮してカレンダーを更新します。\n\n経費の精算。請求と未提出の領収書を請求パネルに一覧にし、受信箱から各領収書を探して提出します。\n\n日用品の補充。実際に買っているものから毎週のカートを作り、代替品のルールを適用し、配達枠を予約して購入まで済ませます。\n\n返品の処理。返品を開始し、持ち込み先を選び、返金されなければ申し立てもします。\n\n家の用事の手配。清掃、配管工、引っ越し業者、電気工事士、便利屋を探して確認し、あなたの予定に合わせてオンラインで予約します。\n\n思いつかなかったリマインダーの送信。フライト、自動車保険の更新、賃貸契約の期日、来週土曜の友達の誕生日などが、あなたが思い出す前に自動でリマインダーになります。\n\n週末の準備。近くのコンサート、お笑いライブ、イベントを提案し、選んだチケットを購入。駐車場、ディナーなど必要なものもすべて手配します。"},{"id":"2107848404231676078","author":"ITOK","handle":"ITOKtw","text":"FastH3 Trim，トランスフォーマーブロックを8減らし，その他色々とということみたいです。ビデオシフトは10です。res_multistep，simple，8ステップで生成時間が\nint8：124.17s\nNVFP4：109.68s\nDMADが8ステップ149.94sなので，速いです。\nNVFP4（Blackwell用），int8と比べて意外と悪くないです。","url":"https://x.com/ITOKtw/status/2107848404231676078","createdAt":"2026-10-07T23:59:56+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2107846431394738177/img/Zi92P1x8iflArZfm.jpg","avatar":"https://pbs.twimg.com/profile_images/561677914752569344/jrkh-d4H_200x200.jpeg","metrics":{"views":1447,"likes":11,"reposts":0,"replies":1},"lang":"ja"},{"id":"2107864607973126275","author":"AAM","handle":"KeepitMadeinUSA","text":"Clearly, fall is good all on its own. But a few American-made products make it even better. 🍂\n\nHere’s where to look.\n\nThread--\u003e","url":"https://x.com/KeepitMadeinUSA/status/2107864607973126275","createdAt":"2026-10-08T01:04:19+09:00","media":"https://pbs.twimg.com/media/HUCjK_GaUAAXFKG.png?name=orig","avatar":"https://pbs.twimg.com/profile_images/511609296497291264/763DrlX9_200x200.png","metrics":{"views":254,"likes":6,"reposts":2,"replies":2},"lang":"en","textJa":"もちろん秋はそれだけで素敵です。でも、アメリカ製のいくつかのアイテムがあれば、もっと楽しくなります。🍂\n\n探す場所はこちら。\n\nスレッド--\u003e"}]}]}</script>

 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}

 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}

  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};
 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
