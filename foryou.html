<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

":{"views":79000,"likes":1730}}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-14T08:32:33+09:00","posts":[{"id":"2110129207259042052","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【悲報】サイバー攻撃で仏スーパーの冷凍庫が最大50℃に\n\nこれはかなりヤバい。データを盗むのではなく、現実のモノを壊しにきている。\n\n・10/11夜〜12日、霜取り機能を遠隔で動かし続けた\n・インテルマルシェ系だけで少なくとも300店舗\n・カルフール80店、モノプリ約30店、U系、ルクレールも被害\n・食品は全廃棄、一部で設備が発火\n\n冷蔵庫でこれができるなら、次は電力網や原発の制御系かもしれない。物理的に深刻なダメージを出すサイバーテロが起きる日も近いと思う。","url":"https://x.com/masahirochaen/status/2110129207259042052","createdAt":"2026-10-14T07:03:01+09:00","media":"https://pbs.twimg.com/media/HUivVNCaMAAq74Y.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1689665533929725953/fClFlzLd_200x200.jpg","metrics":{"views":10877,"likes":83,"reposts":8,"replies":3},"lang":"ja"},{"id":"2110005617658138822","author":"Rodev","handle":"romandevz","text":"GitHub está lleno de cosas gratis que casi nadie está usando.\n\nlos 10 repos que están explotando este mes, de lo más fácil a lo más técnico:\n\nlo que puede usar cualquiera\n\n1. VoiceStudio: clona voces, dobla vídeos y transcribe en 646 idiomas, gratis y sin salir de tu ordenador (57K ⭐)\nhttp://github.com/debpalash/VoiceStudio\n\n2. ppt-master: le pasas un PDF o un Word y te devuelve un PowerPoint de verdad, editable y con animaciones (59K ⭐)\nhttp://github.com/hugohe3/ppt-master\n\n3. gods-eye-view de \n@bilawalsidhu\n: un simulador de satélite espía en tu navegador, con aviones, barcos y cámaras reales sobre un globo 3D (50K ⭐)\nhttp://github.com/bilawalsidhu/gods-eye-view\n\n4. REA: le enseñas a tu IA una función de otra app y te explica cómo está hecha, sin tener el código (65K ⭐)\nhttp://github.com/morluto/rea\n\n5. diagram-design de \n@cathrynlavery\n: pides un diagrama con palabras y te lo dibuja con tu marca, 44 tipos (49K ⭐)\nhttp://github.com/cathrynlavery/diagram-design\n\n6. paperclip: como tener tu propia empresa de agentes autónomos trabajando para ti, la app open source para dirigirlos como si fueran tu plantilla (99K ⭐)\nhttp://github.com/paperclipai/paperclip\n\npara que Claude Code trabaje mejor\n\n7. skills de \n@mattpocockuk\n: las que usa a diario un ingeniero de verdad, pequeñas y fáciles de adaptar (284K ⭐)\nhttp://github.com/mattpocock/skills\n\n8. ECC: skills, memoria y seguridad en un pack para Claude Code, Codex, Cursor y OpenCode (276K ⭐)\nhttp://github.com/affaan-m/ECC\n\n9. andrej-karpathy-skills: un solo archivo con 4 reglas sacadas de lo que Karpathy dice que hacen mal los modelos programando (218K ⭐)\nhttp://github.com/multica-ai/andrej-karpathy-skills\n\n10. claude-mem: guarda lo que hizo tu agente, lo resume y se lo pasa a la siguiente sesión, para que no empiece de cero (99K ⭐)\nhttp://github.com/thedotmack/claude-mem\n\ncompártelo si te ha parecido interesante ♻️\n\ny guárdalo antes de perderlo 🔖","url":"https://x.com/romandevz/status/2110005617658138822","createdAt":"2026-10-13T22:51:55+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110005120310124546/img/SD67-BYpxpOCn1Je.jpg","avatar":"https://pbs.twimg.com/profile_images/2102726150493556737/_R8lLT-V_200x200.jpg","metrics":{"views":22206,"likes":482,"reposts":63,"replies":36},"lang":"es","textJa":"GitHubにはほぼ誰も使っていない無料の宝がたくさんある。\n\n今月伸びているリポジトリ10選（簡単な順→技術寄り）：\n\n誰でも使えるもの\n\n1. VoiceStudio：声のクローン、動画の吹き替え、646言語の文字起こし。PC上で無料（57K ⭐）\nhttp://github.com/debpalash/VoiceStudio\n\n2. ppt-master：PDFやWordを渡すと、編集可能でアニメ付きの本物のPowerPointを返す（59K ⭐）\nhttp://github.com/hugohe3/ppt-master\n\n3. @bilawalsidhu の gods-eye-view：ブラウザ上のスパイ衛星シミュレーター。飛行機・船・実カメラを3D地球儀に表示（50K ⭐）\nhttp://github.com/bilawalsidhu/gods-eye-view\n\n4. REA：別アプリの機能をAIに見せると、コードがなくても仕組みを説明してくれる（65K ⭐）\nhttp://github.com/morluto/rea\n\n5. @cathrynlavery の diagram-design：言葉で頼むとブランド付きの図を描く。44種類（49K ⭐）\nhttp://github.com/cathrynlavery/diagram-design\n\n6. paperclip：自律エージェント会社を自分用に持つ感覚。オープンソースでチームのように指揮（99K ⭐）\nhttp://github.com/paperclipai/paperclip\n\nClaude Codeをもっとうまく使うために\n\n7. @mattpocockuk の skills：現場のエンジニアが日常で使う小さくて応用しやすいスキル（284K ⭐）\nhttp://github.com/mattpocock/skills\n\n8. ECC：Claude Code / Codex / Cursor / OpenCode向けにスキル・メモリ・セキュリティをまとめたパック（276K ⭐）\nhttp://github.com/affaan-m/ECC\n\n9. andrej-karpathy-skills：Karpathyが指摘する「モデルがコーディングでやりがちな失敗」から抽出した4ルールを1ファイルに（218K ⭐）\nhttp://github.com/multica-ai/andrej-karpathy-skills\n\n10. claude-mem：エージェントの作業を保存・要約し、次のセッションへ渡してゼロから始めない（99K ⭐）\nhttp://github.com/thedotmack/claude-mem\n\n面白いと思ったらシェアを。なくなる前に保存を。"},{"id":"2110047768085762080","author":"돈벌고영","handle":"Dontgiveup_26","text":"구글 제미나이 4 아르곤(Gemini 4 Argon) 출시되자마자 모션 그래픽 생성으로 성능 테스트를 해봄. (결과물은 위 20초 영상 참고)\n\nbgm, 모션 그래픽 전부 제미나이4 argon 으로 만듬.\n\n기존 플래그십 모델들(솔 6.1, 아스트라 6, 페이블 5.1, 오퍼스 5.5, 제미나이 3.8)과 비교해 보며 굴려본 솔직한 체감 후기\n\n1. 체감 티어 비교\n- 이전 세대인 제미나이 3.8보다는 확실히 체감될 정도로 좋아짐.\n- 솔(Sol) 6.1보다도 한 단계 우위에 있는 느낌.\n- 아스트라(Astra) 6, 페이블(Fable) 5.1과는 이제 거의 비등비등한 수준까지 바짝 따라붙었음.\n- 다만 여전히 넘사벽인 오퍼스(Opus) 5.5급의 정교함까지는 아직 도달하지 못한 느낌.\n\n2. 'AI 슬롭' 극복이 관건\n그냥 일반적인 프롬프트로 대충 뽑아달라고 하면 특유의 뻔한 AI 슬롭(양산형 느낌)이 강하게 남. \n연출 의도, 모션의 가감속(Easing), 비주얼 디테일을 빡빡하게 지정해 줘야 비로소 영상처럼 제대로 된 완성도가 나옴. 프롬프트 디테일 의존도가 꽤 있는 편.\n\n3. 속도와 개발 활용도\n일단 생성 및 응답 속도가 상당히 빠름.\n개발 성능도 테스트해 보니 기대 이상으로 준수해서, 최고난도의 복잡한 아키텍처 설계가 아니라면 일상적인 코딩 작업이나 프로토타이핑 개발 용도로는 가성비 좋게 굴리기 충분해 보임.\n\n더 여러 환경에서 굴려봐야겠지만, 속도 빠르고 개발·제작 보조용으로 밸런스를 꽤 잘 뽑아낸 모델임.\n\n일단 지금 gpt 너무 느려터지고 성능도 떨어진 거 같아서 취소하고 제미나이를 업그레이해서 쓸까 생각중.","url":"https://x.com/Dontgiveup_26/status/2110047768085762080","createdAt":"2026-10-14T01:39:25+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110046271495086080/img/C_H9zXR9ekqeqspl.jpg","avatar":"https://pbs.twimg.com/profile_images/2103696265615962112/SyLCBg7s_200x200.jpg","metrics":{"views":5566,"likes":36,"reposts":5,"replies":9},"lang":"ko","textJa":"GoogleのGemini 4 Argonが登場した直後に、モーショングラフィック生成で性能を試した（結果は上の20秒映像参照）。\n\nBGMもモーションもすべてGemini 4 Argonで作成。\n\n既存の旗艦モデル（Sol 6.1、Astra 6、Fable 5.1、Opus 5.5、Gemini 3.8）と比べた率直な感想：\n\n1. 体感ティア\n- 前世代のGemini 3.8より明確に良くなった\n- Sol 6.1より一段上の印象\n- Astra 6やFable 5.1にはほぼ並ぶところまで追いついた\n- ただしOpus 5.5級の精密さまではまだ届いていない\n\n2. 「AIスロップ」克服が鍵\n普通のプロンプトだと量産型のAIっぽさが強く残る。演出意図、イージング、ビジュアル細部をしっかり指定して初めて映像らしい完成度になる。プロンプト詳細への依存は高め。\n\n3. 速度と開発用途\n生成・応答はかなり速い。開発性能も期待以上で、最高難度の複雑なアーキ設計でなければ日常コーディングやプロトタイピングにはコスパ良く使えそう。\n\nもっと色々試す必要はあるが、速くて開発・制作補助のバランスが良いモデル。今のGPTは遅くて性能も落ちた気がするので解約し、Geminiに上げて使うかも検討中。"},{"id":"2109903471470072278","author":"Ren","handle":"Ryrenz","text":"🪓 逆向工程圈的宝藏来了，ida-pro-mcp 能让 Claude 直接读你手里那堆反编译出来的代码，跟你一起啃。\n\nGitHub 上 1.2 万 stars，一千五百多个 fork，社区显然是真在用。\n\n以前分析一个不认识的二进制，流程是在 IDA Pro 里一个函数一个函数点开，看反编译结果，手动记交叉引用，自己在脑子里拼出调用链，一下午过去才摸清一个模块。ida-pro-mcp 把 IDA 的能力做成了 MCP 服务：反编译、反汇编、查交叉引用、列函数、改注释、声明类型，甚至下断点读寄存器，全变成 AI 能直接调的动作。你问一句“这个函数到底在干什么”，它自己去取代码、顺着引用往下爬，然后讲给你听。\n\n能接的客户端是一长串，Claude、Claude Code、Cursor、VS Code、Windsurf、Zed 都在里面。除了 IDA 里的插件模式，还有基于 idalib 的无头模式，一个监督进程带一堆 worker，批量分析不用一直开着界面。要注意的是它吃 IDA Pro 8.3 以上，IDA Free 用不了。\n\n分析二进制这活儿，终于不用一个人硬扛了。\n\nGitHub：https://github.com/mrexodia/ida-pro-mcp","url":"https://x.com/Ryrenz/status/2109903471470072278","createdAt":"2026-10-13T16:06:02+09:00","avatar":"https://pbs.twimg.com/profile_images/2047148133746933760/iEtNYePb_200x200.jpg","metrics":{"views":6834,"likes":180,"reposts":17,"replies":6},"lang":"zh","textJa":"逆アセンブル／逆コンパイル周りの宝が出た。ida-pro-mcpならClaudeが手元の逆コンパイル結果を直接読み、一緒に解析できる。\n\nGitHubで約1.2万スター、フォーク1500超。コミュニティは実際に使っている。\n\n以前はIDA Proで関数を一つずつ開き、交差参照を手で追って呼び出し連鎖を頭で組み立てていた。ida-pro-mcpはIDAの能力をMCPサービス化：逆コンパイル、逆アセンブル、交差参照、関数一覧、コメント変更、型宣言、さらにはブレークポイントやレジスタ読み出しまで、AIが直接呼べる操作になる。「この関数は何をしている？」と聞けば、コードを取りに行き参照を辿って説明してくれる。\n\n接続先はClaude、Claude Code、Cursor、VS Code、Windsurf、Zedなど。IDA内プラグインに加え、idalibベースのヘッドレスモードもあり、監視プロセス＋ワーカーでUIを常時開かずバッチ解析できる。IDA Pro 8.3以上が必要で、IDA Freeでは使えない点に注意。\n\nバイナリ解析を一人で抱え込まずに済むようになった。\n\nGitHub：https://github.com/mrexodia/ida-pro-mcp"},{"id":"2110142021524717831","author":"Sac","handle":"Saccc_c","text":"最近我一直在研究如何用 blender 白模生成视频，为的是降低抽卡成本！！！但现在完全不需要了，视频生成模型的无限 token 来了！！！Wan 3.0 现已在 Higgsfield 上开放无限使用了！\n\n如果是在 Higgsfield 中订阅，就直接可以享受 Wan 3.0 无限子弹了\n\n如果是想使用 API，现在是有 4 折优惠，价格是 $0.042/秒\n\n主要更关键的是，这个模型的生成质量几乎和 Seedance 2.5 没有任何区别，但是价格比 Seedance 2.5 便宜太多了。比如在Higgsfield API 上，Wan 3.0 的价格相比 Seedance 2.5 最多可便宜约 9 倍。\n\n在特定风格的视频领域， Wan 3.0 甚至是断档级别的存在，比如下面视频中的动画游戏风格\n\n用相同的提示词测试，我发现 Wan 3.0 在三个不同的维度都是碾压 Seedance 2.5：\n\n1、场景细节：Wan 3.0 还原的场景细节更丰富，元素搭配也非常合理，能让环境变化更具有视觉冲击力\n\n2、风格表现：Wan 3.0 的风格还原度更高，具有较高的色彩饱和度，光影与立体层次鲜明\n\n3、运镜：Wan3.0 运镜更加有设计感，特别是视频中景别和视角变化更加密集，能突出冒险的紧张感\n\n总结来说，我自己体验下来，Wan 3.0 真的太香了 ！！！梦寐以求的视频无限 token 终于实现了，再也不用折腾什么本地部署了！！！","url":"https://x.com/Saccc_c/status/2110142021524717831","createdAt":"2026-10-14T07:53:57+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110141173117702144/img/1Z8gBXiJykVgoAZO.jpg","avatar":"https://pbs.twimg.com/profile_images/2081939362808520704/FwzCMH0g_200x200.jpg","metrics":{"views":2229,"likes":17,"reposts":1,"replies":3},"lang":"zh","textJa":"最近Blenderの白モデルで動画を作り抽選コストを下げようとしていたが、もう不要。動画生成の無限トークンが来た。Wan 3.0がHiggsfieldで無制限利用可能に。\n\nHiggsfieldで購読すればWan 3.0の無限生成が使える。API利用なら現在4割引で$0.042/秒。\n\n重要なのは、生成品質がSeedance 2.5とほぼ変わらないのに、価格は大幅に安いこと。Higgsfield API上ではWan 3.0はSeedance 2.5より最大約9倍安い場合もある。\n\n特定スタイル（下の動画のようなアニメ／ゲーム風）ではWan 3.0が一歩抜けている。\n\n同じプロンプトで比較すると、3点でWan 3.0がSeedance 2.5を上回った：\n\n1. シーン詳細：要素が豊かで組み合わせも自然、環境変化のインパクトが強い\n2. スタイル再現：彩度が高く、光と立体感がはっきり\n3. カメラワーク：設計感があり、画角・視点の変化が密で冒険の緊張感が出る\n\n体感ではWan 3.0はかなり良い。夢だった動画の無限トークンが実現し、ローカル構築をいじらなくてよくなった。"},{"id":"2110034388427936025","author":"Google","handle":"Google","text":"","url":"https://x.com/Google/status/2110034388427936025","createdAt":"2026-10-14T00:46:15+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110034189823123456/img/Xcv9wSCUuo04-OFX.jpg","avatar":"https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_200x200.jpg","metrics":{"views":369633,"likes":4059,"reposts":280,"replies":163}},{"id":"2110127808718741920","author":"Elon Musk","handle":"elonmusk","text":"All Grok @Bots get their own email address and can help analyze and summarize your email box too","url":"https://x.com/elonmusk/status/2110127808718741920","createdAt":"2026-10-14T06:57:28+09:00","avatar":"https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_200x200.jpg","metrics":{"views":555574,"likes":1479,"reposts":209,"replies":331},"lang":"en","textJa":"すべてのGrok @Bot に専用メールアドレスが付き、メールボックスの分析や要約も手伝えるようになった。"},{"id":"2110121902199214145","author":"Oikon | Claude Code深掘りガイド","handle":"oikon48","text":"Anthropicは、Claudeを使ったAI支援開発でマージ数が急増したため、Gitでは追いつかなくなり、独自のソース管理システム「Scion」をゼロから作り、5ヶ月でモノレポを完全移行した\n\n・2026年5月：1日あたり約2,500マージ\n・2026年9月：1日あたり30,000以上（約10倍）\n\nこれに伴いモノレポが肥大化し、メインブランチの履歴だけでほぼ100GB、CIだけで1日約2,500万回のチェックアウトに及ぶ\n\nGitは「オフラインで完結する分散型」を前提に設計されているが、Anthropicの主なクライアント（AIエージェントやCI）は常時オンラインのため、「エージェント規模・常時オンライン前提で設計したらどうなるか」という発想でScionを作った\n\nGoogleのPiperやMetaのSaplingを参考にしつつ、Anthropicのワークロードに合わせて設計\n\n主な考え方:\n\n1. クライアントは常にオンライン\n必要なデータをオンデマンドで取得。完全なローカルリポジトリは持たない。\n\n2. クライアント・サーバーの非対称性\nコミットやマージなどの重い処理はサーバー側で実行。クライアントはキャッシュだけを持つ。\n\n3. 包括的なソース管理サービス\u2028blameやdiffなどのクエリもAPI経由で提供。ローカルにリポジトリを置かなくても済む。\n\n4. 水平スケーラビリティ\u2028完全なリポジトリコピーをどこかに持たない。データは分散し、コンポーネントごとに独立してスケール。\n\n5. 安価でインクリメンタルなロックフリーコミット\u2028コミット・rebase・マージが変更の大きさに比例してスケール（リポジトリ全体のサイズに依存しない）。\n\n6. オプションのスパースなワーキングコピー\u2028そもそもチェックアウトを避けられる場合は避ける。必要なファイルだけを取得。\n\nScionは「大規模モノレポ＋大量のAIエージェント」向けに特化したシステムで、一般的なGitの代替を目指したものではない。ただし、Git自体をよりエージェントフレンドリーにするための示唆（サーバー側スケーリング、RPC API、交渉プロトコルの改善など）は多く、GitHubやGitLab、OSSコミュニティと協力して進化させたい、というスタンス。\n\n「AIがコードを大量に書く時代のソース管理は、人間中心のGitの延長では足りない」という問題意識から、常時オンライン・サーバー中心・インクリメンタルな新しいアーキテクチャを実際に作り、移行まで完了させた。\n\n（Claudeの要約を調整）\n\nhttps://www.anthropic.com/engineering/redesigning-source-control","url":"https://x.com/oikon48/status/2110121902199214145","createdAt":"2026-10-14T06:34:00+09:00","media":"https://pbs.twimg.com/media/HUhx01SasAADqZ0.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2095628327533125632/ITeOvLMV_200x200.jpg","metrics":{"views":7599,"likes":99,"reposts":14,"replies":2},"lang":"ja"},{"id":"2110003379963343277","author":"Mo Elgaraihy","handle":"EngMoElgaraihy","text":"🚨 جي بي تي وكلود أصبحا مجانيين تماماً! 😳⚡️\n\nبدون حساب. بدون بطاقة ائتمان.\n\nالنماذج المتاحة:\nGPT-6 Luna\nGPT-5.4 mini\nClaude Haiku 4.5\n\nجربها على الموقع الرابط في أول تعليق 👇 \n\nإذا وصلت إلى الحد، امسح بيانات الموقع وحاول مرة أخرى. استخدام غير محدود لـ GPT-6 Luna.\n\nاحفظ الرابط وجرب الآن. 🧵👇 https://x.com/k2sbhai/status/2110001770844037255/video/1","url":"https://x.com/EngMoElgaraihy/status/2110003379963343277","createdAt":"2026-10-13T22:43:02+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110001495483768832/img/Mj9GhzogUGvkCa7D.jpg","avatar":"https://pbs.twimg.com/profile_images/1892203225454903296/ONZqfOJK_200x200.jpg","metrics":{"views":22860,"likes":362,"reposts":41,"replies":5},"lang":"ar","textJa":"GPTとClaudeが完全無料に。\n\nアカウント不要。クレジットカード不要。\n\n使えるモデル：\nGPT-6 Luna\nGPT-5.4 mini\nClaude Haiku 4.5\n\n試すなら最初のコメントのリンクから。\n\n上限に達したらサイトのデータを消してもう一度。GPT-6 Lunaは無制限利用とのこと。\n\nリンクを保存して今すぐ試そう。 https://x.com/k2sbhai/status/2110001770844037255/video/1"},{"id":"2110049792390819860","author":"Clément","handle":"cleeeeeeeeement","text":"Fable 5.5 peut littéralement te rendre viral sur TikTok 🫨  \n\nJ'ai crée un AGENT IA avec Fable 5.5 qui va trouver les carrousels viraux de ta niche et les COPIER pour ta brand.\n\n(je te le donne gratuitement 🤩)  \n\nC'est le meilleur moyen de devenir viral sur TikTok : \n\n→ Il trouve les slideshows viraux dans ta niche\n→ il copie le style et adapte les carrousels à ton produit\n→ il peut ensuite générer des dizaines de carrousels en AUTOMATIQUE  \n\nJ’ai rendu le système entièrement public.  \n\nCommente « CARROUSEL » et je te l'envoie par message privé.","url":"https://x.com/cleeeeeeeeement/status/2110049792390819860","createdAt":"2026-10-14T01:47:27+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110049717669261312/img/8um1RmxhJrBw9AIb.jpg","avatar":"https://pbs.twimg.com/profile_images/1870034324885475328/gkEEgCi-_200x200.jpg","metrics":{"views":37601,"likes":506,"reposts":41,"replies":457},"lang":"fr","textJa":"Fable 5.5はTikTokでバズる材料を本気で作れる。\n\nFable 5.5で、自分のニッチのバズるカルーセルを見つけ、ブランド向けにコピーするAIエージェントを作った（無料で渡す）。\n\nTikTokでバズる近道：\n→ ニッチ内のバズっているスライドショーを探す\n→ スタイルをコピーし、自分の商品向けにカルーセルを適応\n→ その後、カルーセルを自動で何十本も生成できる\n\nシステムはすべて公開した。\n\n「CARROUSEL」とコメントすればDMで送る。"},{"id":"2109835011772035193","author":"闯荡大叔","handle":"haoge6699","text":"一边是花钱找人做 SEO 诊断，一边是开源工具 jev-seo 一分钟爬完整站，我选后者。\n\n网站上线几个月，Google 还是搜不到？先别急着花钱找人做 SEO 诊断\n\n自己啃官方文档，又不知道先改哪条？可以试试开源工具 jev-seo。\n\n给它一个首页网址，大约一分钟爬完整站，对照 Google 官方搜索文档的 52 条规则逐项查。robots.txt、sitemap、死链、重定向、canonical、结构化数据、Core Web Vitals 都在里面。\n\n每个页面还会交给 TypeSafe 的 Jev 模型判断：这页是干嘛的，内容够不够具体，有没有几页在抢同一个搜索词。\n\n报告一次出 PDF、Excel、Markdown 三份。PDF 给客户看，Excel 里每条整改项都带优先级、改法和官方出处，直接当进度表用。\n\n标准模式一个站约 1 美分模型费，不用订 SEO 数据服务。想看排名、关键词和外链，加 --full 接入 DataForSEO，一个站约 0.30 美元，两个付费接口都能设预算上限。\n\n作者拿同样 59 个页面跑了两遍，打分平均只差 0.03。但要注意，分数只用来排整改顺序，不能预测排名和流量。\n\n命令行能跑，也能装进 Claude Code 当 Skill，输入 /jev-seo 加网址就开查。\n\n给客户建站的，交付时附一份这个报告，比嘴上说「SEO 做好了」有底气得多。\n\n🔗GitHub：https://github.com/AgriciDaniel/jev-seo","url":"https://x.com/haoge6699/status/2109835011772035193","createdAt":"2026-10-13T11:34:00+09:00","media":"https://pbs.twimg.com/media/HUc2A-xbgAAOYF9.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2104498051037761536/4HPTHEvI_200x200.jpg","metrics":{"views":6885,"likes":144,"reposts":25,"replies":5},"lang":"zh","textJa":"有料のSEO診断を頼むか、オープンソースのjev-seoで1分でサイト全体をクロールするか。後者を選ぶ。\n\nサイト公開から数か月たってもGoogleに出ない？すぐ有料診断に走る前に。\n\n公式ドキュメントを自分で読むのも、どこから直すか分からないときがある。jev-seoを試してみて。\n\nトップページのURLを渡すと約1分でサイト全体をクロールし、Google公式検索ドキュメントの52項目を照合。robots.txt、sitemap、死リンク、リダイレクト、canonical、構造化データ、Core Web Vitalsまでカバー。\n\n各ページはTypeSafeのJevモデルにも渡し、ページの目的・具体性・同じ検索語を奪い合うページの有無を判定。\n\nレポートはPDF・Excel・Markdownの3形式。PDFは顧客向け、Excelは優先度・直し方・公式出典付きで進捗表に使える。\n\n標準モードは1サイト約1セントのモデル費で、SEOデータサービスの契約は不要。順位・キーワード・被リンクを見るなら --full でDataForSEO連携。1サイト約0.30ドル。両APIとも予算上限を設定可能。\n\n作者が同じ59ページを2回走らせたところ、スコア差は平均0.03。ただしスコアは改善順の目安で、順位や流入の予測には使えない。\n\nCLIでも動くし、Claude CodeのSkillとしても入れられ、/jev-seo にURLを付けて実行できる。\n\n顧客向けサイト納品時にこのレポートを添えると、「SEOは大丈夫」と言うより説得力がある。\n\nGitHub：https://github.com/AgriciDaniel/jev-seo"},{"id":"2109956779140370817","author":"robin.","handle":"robinstetic","text":"este tío acaba de contar cómo usa claude code + youtube para sacar $97k al mes\n\nson menos de 15 minutos y merecen la pena, guárdalo para luego🙇🏻‍♂️","url":"https://x.com/robinstetic/status/2109956779140370817","createdAt":"2026-10-13T19:37:51+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2091861062953910272/img/bshue750YY7-igcQ.jpg","avatar":"https://pbs.twimg.com/profile_images/2093693887801872384/AZHr3d2R_200x200.jpg","metrics":{"views":33981,"likes":532,"reposts":76,"replies":21},"lang":"es","textJa":"この人がClaude CodeとYouTubeで月97,000ドルを稼ぐ使い方を説明している。\n\n15分未満で見る価値あり。あとで見られるように保存を。"},{"id":"2109941712554762479","author":"marcus","handle":"marcusyul","text":"STOP COPY-PASTING BETWEEN YOUR AIs. NOW THEY TALK TO EACH OTHER.\n\nUntil today you were the messenger. Copy from Grok, paste into Claude, copy from Claude, repeat.\n\n@BolterApp just fixed that. Here's how they connect:\n\n1. Copy one line\n2. Paste it into your AI\n3. Confirm with a code\n4. It's in the chat\n\nThen you share its handle and it starts working with your other AIs and your friends' AIs.\n\nGive them a task and they split it up. One picks the landing site, another designs the wheels, another writes the code. The rover is ready and you didn't copy a thing.\n\nEach AI keeps its memory and you approve every connection.\n\nLink below 👇🏼","url":"https://x.com/marcusyul/status/2109941712554762479","createdAt":"2026-10-13T18:37:59+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109941675326050304/img/sDXSAXy8nqrcI2G0.jpg","avatar":"https://pbs.twimg.com/profile_images/2055048793670787072/KU39HxsL_200x200.jpg","metrics":{"views":54073,"likes":281,"reposts":17,"replies":35},"lang":"en","textJa":"AI同士のコピペはやめよう。もう互いに話せる。\n\nこれまであなたがメッセンジャーだった。Grokからコピー→Claudeに貼る→またコピー、の繰り返し。\n\n@BolterApp がそれを直した。つなぎ方はこう：\n\n1. 1行コピー\n2. 自分のAIに貼る\n3. コードで確認\n4. チャットに入る\n\nあとはハンドルを共有すれば、他のAIや友人のAIと連携し始める。\n\nタスクを渡すと分担する。誰かが着陸地点を選び、別のAIが車輪を設計し、別のAIがコードを書く。ローバーができてもコピペは一度もしていない。\n\n各AIはメモリを保ち、接続はすべてあなたが承認する。\n\nリンクは下に。"},{"id":"2110130847214903630","author":"Andrii Romanov","handle":"andriiromanovvv","text":"Almost 7 years of looking for the right way to show my work. Behance, Dribbble, Framer sites I never finished.\n\n3 days with Claude Code and Claude Design, and it's live. Minimal on purpose: the work comes first, not the site.\n\nIt's an MVP. More soon.\n\nhttps://andriiromanov.com/","url":"https://x.com/andriiromanovvv/status/2110130847214903630","createdAt":"2026-10-14T07:09:32+09:00","avatar":"https://pbs.twimg.com/profile_images/2110117328658583552/i6reYe2c_200x200.jpg","metrics":{"views":41,"likes":3,"reposts":0,"replies":3},"lang":"en","textJa":"自分の作品の見せ方を約7年探し続けた。Behance、Dribbble、途中で止まったFramerサイト。\n\nClaude CodeとClaude Designで3日、公開できた。意図的にミニマル：サイトより作品が先。\n\nMVP。続きはこれから。\n\nhttps://andriiromanov.com/"},{"id":"2110131023916986767","author":"ClaudesRH","handle":"ClaudesRH","text":"500 claude max plan\n\nJoin: https://claudes.dev/code\n\n24 hrs.","url":"https://x.com/ClaudesRH/status/2110131023916986767","createdAt":"2026-10-14T07:10:15+09:00","media":"https://pbs.twimg.com/media/HUiw5G5WEAASaLs.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2109992044110200832/xUB1cGcN_200x200.png","metrics":{"views":27351,"likes":918,"reposts":688,"replies":481},"lang":"en","textJa":"Claude Maxプラン500枠。\n\n参加：https://claudes.dev/code\n\n24時間。"},{"id":"2110006013902676294","author":"Keith McCullough","handle":"KeithMcCullough","text":"We got a nodder! #Waller","url":"https://x.com/KeithMcCullough/status/2110006013902676294","createdAt":"2026-10-13T22:53:30+09:00","media":"https://pbs.twimg.com/tweet_video_thumb/HUg_SMFbYAEDrBN.jpg","avatar":"https://pbs.twimg.com/profile_images/1265785627825577984/6y2VxzES_200x200.jpg","metrics":{"views":5695,"likes":5,"reposts":0,"replies":4},"lang":"en","textJa":"うなずいてくれた！ #Waller"},{"id":"2109957655569580432","author":"Deni","handle":"0xDeniAi","text":"REA + Opus 5.5 is f*cking dangerous…\n\nI'm honestly not sure this should be public.\n\n10 repos that let an AI agent take apart any app like a mechanic takes apart an engine.\n\nsend to your Claude:\n\n•REA (171K stars) - one MCP for RE: binaries, Electron, .NET, Android, websites.\n\nhttp://github.com/morluto/rea\n\n• Chrome DevTools MCP (53K stars) - agent drives a live Chrome: network, console, JS. Maps how any web app works.\n\nhttp://github.com/ChromeDevTools/chrome-devtools-mcp\n\n• JADX (50K stars) - Android Dex → Java decompiler. GUI + CLI.\n\nhttp://github.com/skylot/jadx\n\n• x64dbg (49K stars) - Windows debugger built for RE and malware analysis.\n\nhttp://github.com/x64dbg/x64dbg\n\n• Apktool (26K stars) - unpacks and rebuilds APKs: manifest, resources, smali.\n\nhttp://github.com/iBotPeaches/Apktool\n\n• radare2 (25K stars) - UNIX-style RE toolkit. Has its own MCP server (r2mcp).\n\nhttp://github.com/radareorg/radare2\n\n• Cutter (20K stars) - free GUI RE platform powered by rizin.\n\nhttp://github.com/rizinorg/cutter\n\n• IDA Pro MCP (12K stars) - connects IDA Pro to your agent over MCP.\n\nhttp://github.com/mrexodia/ida-pro-mcp\n\n• dnSpy (11K stars) - .NET debugger + assembly editor. Patch and rerun.\n\nhttp://github.com/dnSpyEx/dnSpy\n\n• angr (9K stars) - Python binary analysis. Symbolic execution finds hidden paths.\n\nhttp://github.com/angr/angr\n\nDrop this into your Claude, then watch Opus 5.5 take apart any app you own below.","url":"https://x.com/0xDeniAi/status/2109957655569580432","createdAt":"2026-10-13T19:41:20+09:00","media":"https://pbs.twimg.com/media/HUgTS2SXMAAeBHW.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2101977317866135553/ff6QEZ19_200x200.jpg","metrics":{"views":13612,"likes":247,"reposts":36,"replies":11},"lang":"en","textJa":"REA + Opus 5.5はかなり危険な組み合わせ…\n\n正直、公開していいのか分からない。\n\nAIエージェントがエンジンをバラす整備士のように、任意のアプリを分解できるリポジトリ10選：\n\nClaudeに送って：\n\n• REA（171Kスター）— バイナリ、Electron、.NET、Android、Web向けのRE用MCPひとつ\nhttp://github.com/morluto/rea\n\n• Chrome DevTools MCP（53Kスター）— エージェントがライブChromeを操作：ネットワーク、コンソール、JS。Webアプリの動きをマップ\nhttp://github.com/ChromeDevTools/chrome-devtools-mcp\n\n• JADX（50Kスター）— Android Dex→Javaデコンパイラ。GUI＋CLI\nhttp://github.com/skylot/jadx\n\n• x64dbg（49Kスター）— REとマルウェア解析向けWindowsデバッガ\nhttp://github.com/x64dbg/x64dbg\n\n• Apktool（26Kスター）— APKの展開・再構築：マニフェスト、リソース、smali\nhttp://github.com/iBotPeaches/Apktool\n\n• radare2（25Kスター）— UNIX風REツールキット。独自MCP（r2mcp）あり\nhttp://github.com/radareorg/radare2\n\n• Cutter（20Kスター）— rizinベースの無料GUI REプラットフォーム\nhttp://github.com/rizinorg/cutter\n\n• IDA Pro MCP（12Kスター）— IDA ProをMCP経由でエージェントに接続\nhttp://github.com/mrexodia/ida-pro-mcp\n\n• dnSpy（11Kスター）— .NETデバッガ＋アセンブリエディタ。パッチして再実行\nhttp://github.com/dnSpyEx/dnSpy\n\n• angr（9Kスター）— Pythonのバイナリ解析。シンボリック実行で隠れた経路を探す\nhttp://github.com/angr/angr\n\nClaudeに渡して、Opus 5.5が手元のアプリを分解する様子を見てみよう。"},{"id":"2109806144986435804","author":"Himanshu Hingorani","handle":"himanshubuildss","text":"If you're a designer, freelancer, founder or frontend developer, bookmark this.\n\n1. http://scrolltide.co - 600+ award-winning prompts with full source code for 3D and scroll-driven sites (for all of you)\n2. http://godly.website - hand-picked websites with serious craft\n3. http://mobbin.com - real app UI screens\n4. http://styles.refero.design - real product design styles\n5. http://awwwards.com - the sites that actually won\n6. http://shadcnblocks.com - full blocks, not just buttons\n7. http://v0.dev - prompt to UI, from Vercel\n8. http://supahero.io - hero sections worth stealing\n9. http://ui.aceternity.com - animated components, big visual impact\n10. http://threejs-journey.com - the best way to learn 3D on the web\n\nWhat did I miss?","url":"https://x.com/himanshubuildss/status/2109806144986435804","createdAt":"2026-10-13T09:39:17+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109805685718568960/img/KeQ689ApOUTWv9oJ.jpg","avatar":"https://pbs.twimg.com/profile_images/2040486128294436864/JziGJtod_200x200.jpg","metrics":{"views":45624,"likes":1019,"reposts":142,"replies":17},"lang":"en","textJa":"デザイナー、フリーランス、創業者、フロントエンド開発者ならブックマークを。\n\n1. http://scrolltide.co — 受賞級の3D・スクロールサイト用プロンプト600+とソース一式\n2. http://godly.website — 本気の作り込みサイト厳選\n3. http://mobbin.com — 実在アプリのUI画面\n4. http://styles.refero.design — 実プロダクトのデザインスタイル\n5. http://awwwards.com — 実際に受賞したサイト\n6. http://shadcnblocks.com — ボタンだけでなく完成ブロック\n7. http://v0.dev — プロンプトからUI（Vercel）\n8. http://supahero.io — 盗みたくなるヒーローセクション\n9. http://ui.aceternity.com — アニメ付きコンポーネント、視覚インパクト大\n10. http://threejs-journey.com — Webで3Dを学ぶ最良の方法の一つ\n\n他に抜けているものは？"},{"id":"2109779354758926470","author":"Leo","handle":"truejigga","text":"https://larp.ai to beat the single allegations\n\nmade with higgsfield genjutsu API","url":"https://x.com/truejigga/status/2109779354758926470","createdAt":"2026-10-13T07:52:50+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109779178992418816/img/y54xsdwtz7rJjp9s.jpg","avatar":"https://pbs.twimg.com/profile_images/1929801574668238848/OWMyyrhx_200x200.jpg","metrics":{"views":1014694,"likes":4917,"reposts":447,"replies":94},"lang":"en","textJa":"https://larp.ai で「一人っぽい」疑惑をかわそう。\n\nHiggsfield Genjutsu APIで制作。"},{"id":"2110089224246678007","author":"Francesco Ciulla","handle":"FrancescoCiull4","text":"Most AI agents still work alone. Real work rarely does.\n\nSpent some time with @kylon_ai, running my Claude Code in a shared room with other agents.\n\nInteresting idea, smooth experience, and a lot of possibilities.\n\nCongrats @quinn_leng and the Kylon team!","url":"https://x.com/FrancescoCiull4/status/2110089224246678007","createdAt":"2026-10-14T04:24:09+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110089132932300800/img/M285Vggg_UTx7tO0.jpg","avatar":"https://pbs.twimg.com/profile_images/1996462702110162944/jY4GKvoA_200x200.jpg","metrics":{"views":1093,"likes":3,"reposts":0,"replies":5},"lang":"en","textJa":"多くのAIエージェントはまだ単独で動く。本当の仕事はそうではない。\n\n@kylon_ai を少し試し、Claude Codeを他のエージェントと共有ルームで動かした。\n\n面白い発想で体験もスムーズ、可能性も広い。\n\n@quinn_leng とKylonチームにおめでとう。"},{"id":"2110057047878480098","author":"First Round","handle":"firstround","text":"\"Our WiFi password used to be 'vacuum2020.' We were gonna ship robots in 2020, and it didn't happen.\"\n\nInside the nine years of hard work and failed prototypes that went into making @maticrobots:","url":"https://x.com/firstround/status/2110057047878480098","createdAt":"2026-10-14T02:16:17+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110049167372582915/img/8tbfxxCRGyTEcmTS.jpg","avatar":"https://pbs.twimg.com/profile_images/1902087392951189504/a_J_NWF1_200x200.png","metrics":{"views":2617,"likes":9,"reposts":1,"replies":4},"lang":"en","textJa":"「昔のWi‑Fiパスワードは『vacuum2020』だった。2020年にロボットを出荷するつもりで、実現しなかった。」\n\n@maticrobots ができるまでの9年の苦労と失敗した試作の内側："},{"id":"2109940688595153234","author":"Robert Youssef","handle":"rryssf","text":"People losing so much tokens and have no idea about this:\n\nSubagent caches expire in five minutes.\n\nIn Claude Code, a subagent that sits idle longer than 5 minutes loses its prompt cache. The next call rewrites the whole context from scratch and burns several times more tokens than a cache hit would.\n\nAnthropic's guide covers a single setting that stretches that window to an hour:\n\n\"subagentPromptCacheTtl\": \"1h\"\n\nThe trade-off is in the write price. Each write to the 1-hour cache costs more than a write to the 5-minute one. You stop paying for a full rewrite every time a subagent pauses, though.\n\nFor workflows with long gaps between subagent calls, the savings reportedly reach up to 25% of total token spend.\n\nThose savings depend heavily on how you work. If your subagents finish fast and rarely sit idle past five minutes, you pay the pricier write for nothing and your bill goes up.\n\nCheck your own usage before you switch. A comparison script exists that estimates whether the 1-hour TTL saves you money or costs you more on your actual sessions. If your pauses stay under five minutes, keep the default.","url":"https://x.com/rryssf/status/2109940688595153234","createdAt":"2026-10-13T18:33:55+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109940674506502144/img/pNtjKV4mci5FUo2R.jpg","avatar":"https://pbs.twimg.com/profile_images/1949976517913513985/98Qk6qo5_200x200.jpg","metrics":{"views":21691,"likes":168,"reposts":20,"replies":35},"lang":"en","textJa":"トークンを大量に無駄にしているのに、多くの人が知らないこと：\n\nサブエージェントのキャッシュは5分で切れる。\n\nClaude Codeでは、サブエージェントが5分より長くアイドルだとプロンプトキャッシュを失う。次の呼び出しは文脈を最初から書き直し、キャッシュヒット時の数倍のトークンを消費する。\n\nAnthropicのガイドには、その窓を1時間に延ばす設定がある：\n\n\"subagentPromptCacheTtl\": \"1h\"\n\nトレードオフは書き込み料金。1時間キャッシュへの書き込みは5分キャッシュより高い。ただしサブエージェントが止まるたびに全書き直しを払わなくなる。\n\n呼び出しの間が長いワークフローでは、総トークン費の最大約25%節約との報告もある。\n\n節約は使い方次第。サブエージェントがすぐ終わり、5分を超えてアイドルしないなら、高い書き込みだけ払って請求が増える。\n\n切り替える前に自分の利用を確認を。実セッションで1時間TTLが得か損かを見積もる比較スクリプトもある。休憩がいつも5分未満ならデフォルトのままでよい。"},{"id":"2110113747553665323","author":"Lightspeed","handle":"lightspeedvp","text":"It’s a bird. It’s a plane. It’s your DoorDash on a drone.\n\nAt Dash Forward, DoorDash unveiled its own delivery drone and opened a beta waitlist for an AI ordering experience over text.\n\n“My lunch order from DoorDash is pretty much the same. I eat the same thing every day… Does making it conversational make you try new things?” @Machiz asks.\n\nA personal AI agent could also change where the order goes: to DoorDash, Uber Eats, or directly to a restaurant.\n\n“Being able to actually have the connection with the end user is so important,” says @AggShaurya.\n\nWatch the full segment below.","url":"https://x.com/lightspeedvp/status/2110113747553665323","createdAt":"2026-10-14T06:01:36+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110111293277437952/img/_ztd3QyUcd0r4CJn.jpg","avatar":"https://pbs.twimg.com/profile_images/1918355794333970433/QKku_TuT_200x200.jpg","metrics":{"views":719,"likes":2,"reposts":1,"replies":0},"lang":"en","textJa":"鳥？飛行機？ドローンで届くDoorDashだ。\n\nDash ForwardでDoorDashが自社配達ドローンを公開し、テキスト経由のAI注文体験のベータ待ちリストも開始。\n\n「DoorDashの昼ごはんはだいたい同じ。毎日同じものを食べる…会話型にすると新しいものを試すようになるのか？」と@Machiz。\n\n個人向けAIエージェントは注文先も変えうる：DoorDash、Uber Eats、あるいは直接レストランへ。\n\n「エンドユーザーとのつながりを持てることがとても大事」と@AggShaurya。\n\n全文は下のセグメントで。"},{"id":"2110040641334051155","author":"Accel","handle":"Accel","text":"AI that knows what your team knows - read our blog post about our investment in @withscuba \n\nhttps://www.accel.com/news/ai-that-knows-what-your-team-knows","url":"https://x.com/Accel/status/2110040641334051155","createdAt":"2026-10-14T01:11:06+09:00","avatar":"https://pbs.twimg.com/profile_images/1844347012033953794/lQLZCgKo_200x200.jpg","metrics":{"views":1635,"likes":6,"reposts":1,"replies":0},"lang":"en","textJa":"チームが知っていることを知るAI — @withscuba への投資についてブログを公開\n\nhttps://www.accel.com/news/ai-that-knows-what-your-team-knows"},{"id":"2110131790136401989","author":"Semichenko","handle":"semichenkko","text":"Opus 5.5 made gummy bears. Gemini 4 Argon made gummy statues\n\nSame prompt. Opus on top, Gemini below\n\nI put both through the same moves - pull a paw, yank the head, squish it flat, throw it, then pour a whole bag on top\n\nOpus bears are actual jelly. Pull a paw and it stretches into a thin rubbery strand, then snaps back and wobbles. Squash one and it pancakes, then launches itself back up. Throw it and it bounces off the floor and shoves its friends out of the way\n\nGemini bears are solid plastic. The arm turns into a stick, the bear flies straight through its neighbor, and the pile at the end just clips into itself\n\nAnd Opus nailed the look too - translucent, glossy, light passing right through them\n\nOpus: $7.2\nGemini: $22","url":"https://x.com/semichenkko/status/2110131790136401989","createdAt":"2026-10-14T07:13:17+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110131742086500352/img/g1OYPRpR370-gIrm.jpg","avatar":"https://pbs.twimg.com/profile_images/2076966146704654336/ZvbLOdWO_200x200.jpg","metrics":{"views":2608,"likes":34,"reposts":2,"replies":3},"lang":"en","textJa":"Opus 5.5はグミベアを作った。Gemini 4 Argonはグミの像を作った。\n\n同じプロンプト。上がOpus、下がGemini。\n\n同じ動きを両方にやらせた——足を引っ張る、頭を引く、押しつぶす、投げる、袋ごと上に注ぐ。\n\nOpusのベアは本物のゼリー。足を引くと細いゴム状に伸び、戻って揺れる。潰すと平たくなり、跳ね上がる。投げると床で跳ね、周りの仲間を押しのける。\n\nGeminiのベアは硬いプラスチック。腕が棒になり、隣をすり抜け、最後の山は自分自身にめり込む。\n\n見た目もOpusが上手——半透明で光沢があり、光が通り抜ける。\n\nOpus：$7.2\nGemini：$22"},{"id":"2110043498854355057","author":"News from Google","handle":"NewsFromGoogle","text":"Today we're rolling out access to Gemini 4 Argon, our latest frontier model built to solve your hardest problems.\n\nStarting today, it’s available globally for Google AI Ultra and Pro subscribers in @GeminiApp and AI Mode in Search, Ultra subscribers in @Antigravity, and for developers and enterprises via the API in @GoogleAIStudio and the Gemini platform.\n\nAt @Google, Argon is already accelerating progress across engineering and robotics:\n\n💻 @GoogleChrome: Argon helped the Chrome team refactor a Chromium 6-million-line legacy codebase, completing months of work in just weeks. For Chrome’s billions of global users, this eliminated an entire category of browser crashes, unlocking the ability for live webpages to move fluidly between tabs, side panels, and floating windows without reloading.\n\n🚀 Software engineering: Googlers are using Argon to ship code faster than ever. In @Antigravity, they increased agentic code submissions by over 35% with rollbacks cut by nearly a third.\n\n🤖 Robotics at @GoogleDeepMind: By watching video of a human playing cornhole, Argon autonomously built simulation code that taught it how to play, and helped Apptronik's Apollo humanoid sink seven straight shots.","url":"https://x.com/NewsFromGoogle/status/2110043498854355057","createdAt":"2026-10-14T01:22:27+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110042225329553408/img/3a3ptKAuer2rBn5y.jpg","avatar":"https://pbs.twimg.com/profile_images/1972717909559353344/eMJ6AJ0W_200x200.jpg","metrics":{"views":49494,"likes":1096,"reposts":123,"replies":57},"lang":"en","textJa":"本日、最難関の課題向け最新フロンティアモデル Gemini 4 Argon の提供を開始する。\n\n本日より、Google AI Ultra / Pro 購読者向けに @GeminiApp と検索のAIモードで世界展開。Ultra購読者は @Antigravity でも利用可能。開発者・企業は @GoogleAIStudio とGeminiプラットフォームのAPI経由で利用できる。\n\n@Google ではArgonがすでにエンジニアリングとロボティクスを加速している：\n\n💻 @GoogleChrome：ArgonがChromeチームのChromium約600万行のレガシーコードのリファクタを支援し、数か月分の作業を数週間で完了。世界の数十億ユーザー向けに、ある種のブラウザクラッシュ一式を解消し、ライブWebページを再読み込みなしでタブ・サイドパネル・フローティングウィンドウ間を滑らかに移動できるようになった。\n\n🚀 ソフトウェアエンジニアリング：Google社員はArgonでこれまで以上に速くコードを出荷。@Antigravity ではエージェントによるコード提出が35%超増え、ロールバックはほぼ3分の1減。\n\n🤖 @GoogleDeepMind のロボティクス：人がコーンホールをする動画を見たArgonが、遊び方を教えるシミュレーションコードを自律構築し、ApptronikのApolloヒューマノイドが7連続で成功するのを助けた。"},{"id":"2110083127615836412","author":"U.S. Politics Alert","handle":"USPoliticsAlert","text":"From @JoeRogan to @SpkrBonnen, discover the accounts that @JamesTalarico and @KenPaxtonTX both follow:","url":"https://x.com/USPoliticsAlert/status/2110083127615836412","createdAt":"2026-10-14T03:59:55+09:00","media":"https://pbs.twimg.com/media/HUiFHbAXQAAqmwF.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/1915706855956869120/LJl80VPq_200x200.jpg","metrics":{"views":681,"likes":1,"reposts":0,"replies":1},"lang":"en","textJa":"@JoeRogan から @SpkrBonnen まで。@JamesTalarico と @KenPaxtonTX の両方がフォローしているアカウントを見てみよう："},{"id":"2109822896415916042","author":"Sadao Tokuyama","handle":"tokufxug","text":"心臓の3D可視化を紹介「CardioTwin 4D Viewer」🫀\n\n🔹インタラクティブな3D表示や電気的な表示、領域分割ビューを紹介\n🔹NVIDIA Isaac Sim、Cosmos 3 Nano、PhysicsNeMo、MONAI Physioなどを関連技術として挙げている\n🔹医療分野のデジタルツインに関連する取り組み\n\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2109822896415916042","createdAt":"2026-10-13T10:45:51+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109822709068967936/img/A8_CtoERdqedDOzx.jpg","avatar":"https://pbs.twimg.com/profile_images/1614135119597686784/8APrdHkh_200x200.png","metrics":{"views":7832,"likes":194,"reposts":27,"replies":5},"lang":"ja"},{"id":"2109671433521815772","author":"Jakub Antalik","handle":"Jakubantalik","text":"Created a new skill for UI generation skeleton effect, something I’ve been using in my UI videos.\n\nThese UI examples are built with https://transitions.dev UI Agent.","url":"https://x.com/Jakubantalik/status/2109671433521815772","createdAt":"2026-10-13T00:44:00+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2109652229980315648/img/KFUUdBAT-dZlfP2g.jpg","avatar":"https://pbs.twimg.com/profile_images/1286621650562228224/TAo9_z5s_200x200.jpg","metrics":{"views":162307,"likes":3685,"reposts":185,"replies":63},"lang":"en","textJa":"UI生成用のスケルトン効果スキルを新しく作った。自分のUI動画でも使っているもの。\n\nこれらのUI例は https://transitions.dev のUI Agentで構築。"},{"id":"2109830882404057588","author":"FHILY👑","handle":"Oluwaphilemon1","text":"Qwen3.8-27B reportedly went from 82 tokens/sec to 381 tokens/sec on a single RTX 3090 with 24GB VRAM, without changing the GPU.\n\nThe entire improvement came from optimizing the inference stack.\n\nHere’s how the developer reached that speed:\n\n• Initial setup: ~82 tokens/sec\n• Optimized MTP: ~114 tokens/sec\n• DFlash2 + context lookup: ~138 tokens/sec\n• Optimized lookup verification: ~381 tokens/sec\n\nThe final result is roughly 4.6× the initial generation speed. But the most interesting part is how they achieved it.\n\n1. DFlash2 reduces sequential generation\n\nNormally, an autoregressive model generates tokens one at a time, with each step depending on the previous output.\n\nSpeculative decoding changes this. A smaller draft mechanism proposes multiple tokens, and the main model verifies them together. When the proposals are accepted, the system avoids some of the sequential work required by ordinary decoding.\n\nDFlash2 builds on this approach to accelerate token generation.\n\n2. Context lookup reuses text that already exists\n\nThe developer added another optimization: searching the input context for text that matches the expected output.\n\nThis is particularly useful when a model needs to reproduce content from a document, rather than generate entirely new text.\n\nThe optimized system can propose matching sequences from the existing context and ask the main model to verify them.\n\nInstead of verifying the usual seven proposed tokens, the setup can verify blocks of up to 16.\n\nThe developer reports acceptance of approximately 15 out of 16 tokens per verification step. That means far fewer sequential decoding steps are needed for this particular workload.\n\nThe benchmark shows why the distinction matters.\n\nOn a document-reproduction task involving approximately 25K tokens:\n\n• Previous DFlash2 setup: ~260 tokens/sec\n• Optimized context lookup: ~382 tokens/sec\n\nHowever, 381 tokens/sec is not the model’s general-purpose chat speed. For ordinary conversational workloads, the developer reports around 133 tokens/sec.\n\nContext lookup works best when the output overlaps heavily with text already available in the prompt. It won’t deliver the same gains when generating original prose or solving problems that require entirely new output.\n\nPotential applications include document processing, retrieval-augmented generation, code transformations and other workflows that reuse existing text.\nPrefix caching delivers another major improvement.\n\nWhen asking a second question about the same 25K-token document, the system can reuse the computation from the shared prompt prefix.\n\nReported time to first token dropped from 22.4 seconds to just 0.56 seconds.\nThat’s approximately 40× faster for the repeated-prefix scenario.\n\nThe model still has to process the new question and generate its answer, but it doesn’t need to recompute the entire shared prefix from scratch.\n\nThe broader lesson is that local inference performance depends on more than model size and GPU specifications.\n\nSpeculative decoding reduces sequential generation. Context lookup exploits repeated text. Prefix caching avoids redundant computation.\n\nCombined, these techniques can produce enormous gains when the workload is a good fit.\n\nCode: syv-ai/qwen38-27b-rtx3090 on GitHub.\n https://x.com/TeksEdge/status/2090595990114037832/video/1","url":"https://x.com/Oluwaphilemon1/status/2109830882404057588","createdAt":"2026-10-13T11:17:35+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2090571994471489536/img/gNhw_AStXUxacqgL.jpg","avatar":"https://pbs.twimg.com/profile_images/1681096269203218432/kTSyPDf7_200x200.jpg","metrics":{"views":27555,"likes":393,"reposts":29,"replies":11},"lang":"en","textJa":"Qwen3.8-27Bは、RTX 3090（24GB）1枚のまま、約82トークン/秒から381トークン/秒になったという報告。GPUは変えていない。\n\n改善はすべて推論スタックの最適化から。\n\n到達までの流れ：\n\n• 初期：約82トークン/秒\n• MTP最適化：約114トークン/秒\n• DFlash2＋コンテキスト照合：約138トークン/秒\n• 照合検証の最適化：約381トークン/秒\n\n最終は初期の約4.6倍。興味深いのは達成方法。\n\n1. DFlash2が逐次生成を減らす\n\n通常の自己回帰は1トークンずつ、前の出力に依存する。投機的デコーディングでは小さい下書き機構が複数トークンを提案し、本モデルがまとめて検証する。受理されれば通常の逐次処理の一部を避けられる。DFlash2はこの方式を発展させて生成を加速する。\n\n2. コンテキスト照合が既存テキストを再利用\n\n期待出力に合う文字列を入力コンテキストから探す最適化も追加。文書の再現など、新規文ではなく既存内容の再生に特に有効。既存コンテキストから一致列を提案し本モデルに検証させる。通常の提案7トークンではなく最大16トークン塊まで検証できる場合がある。\n\n開発者によると検証ステップあたり約15/16が受理され、この負荷では逐次ステップが大幅に減る。\n\n約25Kトークンの文書再現ベンチ：\n• 以前のDFlash2：約260トークン/秒\n• 最適化コンテキスト照合：約382トークン/秒\n\nただし381トークン/秒は汎用チャット速度ではない。普通の会話では約133トークン/秒とのこと。コンテキスト照合は出力がプロンプト内テキストと大きく重なるときが最も効く。完全な新規作文や新規推論では同じ伸びは出ない。\n\n文書処理、RAG、コード変換など既存テキスト再利用の流れ向き。プレフィックスキャッシュも大きな改善。\n\n同じ25Kトークン文書への2問目では共有プレフィックスの計算を再利用でき、最初のトークンまでの時間が22.4秒から0.56秒（約40倍）に。\n\nモデルは新しい質問の処理と回答生成は必要だが、共有プレフィックス全体の再計算は不要。\n\n教訓：ローカル推論の性能はモデルサイズとGPUだけではない。投機的デコーディング、コンテキスト照合、プレフィックスキャッシュを組み合わせ、負荷が合えば大きな伸びが出る。\n\nコード：GitHubの syv-ai/qwen38-27b-rtx3090\n https://x.com/TeksEdge/status/2090595990114037832/video/1"},{"id":"2110050024788984016","author":"Amit Shah","handle":"AmitShah","text":"SIR के बहाने घुसपैठियों को बचाने की राहुल गांधी की योजना देश समझ चुका है।","url":"https://x.com/AmitShah/status/2110050024788984016","createdAt":"2026-10-14T01:48:23+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110049862213599232/img/wYfZP7EhD1LfmUqO.jpg","avatar":"https://pbs.twimg.com/profile_images/2054423554737983489/dhxe-t8m_200x200.jpg","metrics":{"views":328654,"likes":7525,"reposts":2233,"replies":1271},"lang":"hi","textJa":"SIRを口実に侵入者を守ろうとするラフル・ガンディーの計画を、国はすでに見抜いている。"},{"id":"2110119155101811183","author":"BBC Breaking News","handle":"BBCBreaking","text":"Saudi national charged with secretly planting recording device in OpenAI office in San Francisco\nhttps://bbc.in/4zpBo7U","url":"https://x.com/BBCBreaking/status/2110119155101811183","createdAt":"2026-10-14T06:23:05+09:00","avatar":"https://pbs.twimg.com/profile_images/1150716997254209536/M7gkjsv5_200x200.jpg","metrics":{"views":181149,"likes":178,"reposts":85,"replies":38},"lang":"en","textJa":"サウジアラビア国籍の男が、サンフランシスコのOpenAIオフィスに録音機器を秘密に仕掛けた疑いで起訴された\nhttps://bbc.in/4zpBo7U"},{"id":"2110145786818568663","author":"StudioYebisu","handle":"studio_yebisu","text":"画像AIオタク以外はあんまり知らんかもしれんが、Kreaという結構人気の画像生成モデルがあって。\n\nその最新モデルのKrea3のアーリーアクセス権もらったんで、実際に生成してみました～！\n\n元々Kreaはリアルな人間の生成と、アーティスティックがうまいモデルだったので一番得意そうなヤツ一本勝負\n1枚目。シンプルな女性のT2I、ディティールのリアルさを開いて確認してみて。元は2KだからXに圧縮されててもかなりキレイなハズ。\nアップにして見てみて\n\n2枚目は若干アート寄りの2Dイラスト。T2Iのみ。\n2次元イラストでも目の解像度のキレイさとかいいね。\n髪の毛とか書き込みすぎてじゃじゃ馬感もあるが…\n双方一応プロンプトいる…？まぁリプに貼っとくか。\n\nChatGPTプラグインで連携して呼び出せるし、\nGPT-Imageとは違った、AI Slop感のない、オリジナリティあふれる画像を作りたいという人は、Keraを使うのもありかと思います。\n\nKera3-Turboとかの重みが公開されると思うんで、そうなってきたらコミュニティはマジ盛り上がりますね。","url":"https://x.com/studio_yebisu/status/2110145786818568663","createdAt":"2026-10-14T08:08:54+09:00","media":"https://pbs.twimg.com/media/HUi5O6la4AAgqfi.jpg?name=orig","avatar":"https://pbs.twimg.com/profile_images/2095218586046652416/pyuFtKH0_200x200.jpg","metrics":{"views":325,"likes":2,"reposts":0,"replies":1},"lang":"ja"},{"id":"2110041042896728437","author":"Google for Developers","handle":"googledevs","text":"📣 Gemini 4 Argon is here!\n\nBuilt to solve your hardest problems, Argon excels at real-world software engineering, enterprise workflows, cybersecurity defense, and scientific reasoning. By reliably handling routine tasks like everyday debugging to complex problems like codebase migrations, it frees developers to focus on architecture and product innovation.\n\nSee what you can build with Argon ↓","url":"https://x.com/googledevs/status/2110041042896728437","createdAt":"2026-10-14T01:12:41+09:00","media":"https://pbs.twimg.com/amplify_video_thumb/2110040184788221952/img/oHNPhbWrdcvTNISx.jpg","avatar":"https://pbs.twimg.com/profile_images/2107899941473636352/Nu-IZWAL_200x200.jpg","metrics":{"views":81958,"likes":1661,"reposts":227,"replies":55},"lang":"en","textJa":"Gemini 4 Argonが登場。\n\n最難関の課題向けに設計され、実世界のソフトウェアエンジニアリング、企業ワークフロー、サイバー防衛、科学的推論に強い。日常のデバッグからコードベース移行まで確実にこなし、開発者をアーキテクチャとプロダクト革新に集中させる。\n\nArgonで何が作れるか ↓"}]}]}</script>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const board = $('board');
 const read = key => {try{return localStorage.getItem('ai-x-foryou-'+key);}catch{return null;}};
 const save = (key,value) => {try{localStorage.setItem('ai-x-foryou-'+key,value);}catch{}};
 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();
 $('text-prev').onclick=()=>{textPage--;showText();};$('text-next').onclick=()=>{textPage++;showText();};
 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){
  const ja=lang==='ja',list=posts(),start=(page-1)*50;layout();
  $('account').value=current.handle;syncUrl();
  $('title').textContent=(ja?'おすすめ':'For You')+' · '+current.name;
  document.title=$('title').textContent;
  document.documentElement.lang=ja?'ja':'en';
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル投稿（実際のおすすめではありません）':'Sample posts · Not a live For You feed'):(ja?'おすすめデータ':'For You data'))+' · '+list.length+(ja?'件':' posts')+(current.updatedAt?' · '+current.updatedAt:'');
  $('status').textContent='@'+current.handle+' · '+(current.sample?(ja?'サンプル（実際のおすすめではありません）':'Sample · Not a live feed'):(ja?'おすすめ':'For You'))+' · '+(list.length?(start+1)+'–'+Math.min(start+50,list.length)+' / '+list.length:'0')+(ja?'件':' posts')+' · '+(ja?'最終更新：':'Updated: ')+(relativeDate(current.updatedAt)||(ja?'未取得':'Not fetched'));$('status').title=dateLabel(current.updatedAt)||'';
  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');
  for(const key of ['ja','original']){$(key).classList.toggle('active',lang===key);$(key).setAttribute('aria-pressed',String(lang===key));}
  $('page').replaceChildren();for(let i=1;i<=count();i++)$('page').add(new Option(list.length?((i-1)*50+1)+'–'+Math.min(i*50,list.length):(ja?'0件':'0 posts'),String(i)));
  $('page').value=String(page);$('page').disabled=!list.length;$('prev').disabled=page===1;$('next').disabled=page===count();
  board.setAttribute('aria-label',current.name+' / @'+current.handle+' '+(ja?'おすすめ':'For You')+' '+$('page').selectedOptions[0].text);
  if(!list.length&&query){message(ja?"「"+query+"」に一致する投稿はありません":"No posts match “"+query+"”",ja?"別のキーワードを試すか、Escで検索をクリアしてください。":"Try another keyword, or press Esc to clear.");return;}
  if(!list.length){message(ja?'おすすめ投稿がまだありません':'No For You posts yet', '@'+current.handle+(ja?' のデータはまだありません。下のボタンから別のアカウントを選べます。':' has no data yet. Choose another account below.'));for(const a of accounts.filter(a=>a!==current)){const b=el('button','',a.name+' / @'+a.handle);b.onclick=()=>{$('account').value=a.handle;$('account').dispatchEvent(new Event('change'));};board.firstChild.append(b);}return;}
  board.replaceChildren();
  list.slice(start,start+50).forEach((p,i)=>{
   const card=el('button','card');card.type='button';card.setAttribute('aria-haspopup','dialog');card.onclick=()=>openDetail(p);
   const handle=String(p.handle||'').replace(/^@/,''),name=p.author||p.name||handle;
   const text=displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text');
   card.title=name+' / @'+handle+'\n'+text+(p.createdAt?'\n'+p.createdAt:'');
   const top=el('div','top'),fallback=el('span','fallback',Array.from(name||'?')[0]);top.append(el('span','rank',String(start+i+1)));
   const avatar=picture(p.avatar,'avatar');if(avatar){avatar.onerror=()=>avatar.replaceWith(fallback);top.append(avatar);}else top.append(fallback);
   const who=el('div','who');who.append(el('div','name',name),el('div','handle','@'+handle));top.append(who);const language=sourceLanguage(p);if(p.text.trim()){const badge=el('span','language',({ja:'日',zh:'中',en:'英'})[language]||'言語不明');badge.title='原文の言語'+(ja&&p.textJa?' · 日本語訳':'');top.append(badge);}
   const metrics=p.metrics||p;for(const [key,icon] of [['views','👁'],['likes','♥']]){if(typeof metrics[key]==='number'&&Number.isFinite(metrics[key])&&metrics[key]>=0){const m=el('span','metric',compact(metrics[key])+icon);m.title=key+': '+metrics[key];top.append(m);break;}}
   const b=buzzOf(p);
   if(b){const mark=Array.from(typeof b.badge==='string'?b.badge:'')[0]||'';const chip=el('span','buzz',Math.round(b.score)+(mark?' '+mark:''));chip.setAttribute('aria-label','バズ予測 '+Math.round(b.score));chip.classList.add(b.score>=70?'high':b.score>=45?'mid':'low');const reason=typeof b.reasonJa==='string'?b.reasonJa.trim():'';chip.title='バズ予測 '+Math.round(b.score)+'/100（'+(b.source==='opus'?'Opusの最終予測':b.source==='jev'?'Jev一次判定':'ローカル特徴量のみ')+'）'+(reason?'\n'+reason:'');top.append(chip);card.title+='\nバズ予測 '+Math.round(b.score)+(reason?' · '+reason:'');}
   const copy=el('div','copy');copy.append(el('p','snippet',text));const thumb=picture(typeof p.media==='string'?p.media:p.media?.url,'thumb');if(thumb){thumb.onerror=()=>thumb.remove();copy.append(thumb);}card.append(top,copy);board.append(card);
  });

 }
 function setPage(n){page=Math.max(1,Math.min(count(),n));save('page-'+current.handle,String(page));render();}
 $('account').onchange=()=>{current=accounts.find(a=>a.handle===$('account').value);restorePage();save('account',current.handle);render();};
 // 並び順を変えるとページ内の投稿が入れ替わるため、1ページ目に戻す。
 $('sort').onchange=()=>{sort=$('sort').value==='buzz'?'buzz':'default';save('sort',sort);setPage(1);};

 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});

 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
</body>
