<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-18T19:15:06+09:00","posts":[{"id":"2111654753251803320","author":"kaito","handle":"cu30rry_","text":"本日のGrok Bot 10選\n\n1. Notes Bot by @XFreeze\nまとまっていない計画、思いついたアイデアなどを音声入力し、整理されたメモにして Google ドキュメントに保存します。また、ToDoやタスクを抽出し、毎日のToDoリストを送信し、カレンダーにリマインダーおよび、タスクの期限が近づいているものは通知します\n\nメモ帳のように使えるBotです\n\n https://t.co/oFETJSrRWM\n\n2. Usage Watch by @luisbarraganj  \nBot のルーティンについて、使用量がリセットされる日までカレンダーに列挙し、使用量を多く食っているものを指摘し、必要なら一時停止まで行います\n\nDr Eggbotと組み合わせてコスパを上げたり、Botを月の途中で止めることを防げます\n\n https://t.co/gfU7NAo3kD\n\n3. Artisan AI by @DigitalCowboyAI \nアプリ開発者やクリエイター向けに、アプリのアイコン、アバター、グッズ用のプリント、バナー、字幕付きの短い動画を、統一したスタイルで作ってくれます\n\nデザイナーがいなくても、プロダクトや発信のデザインを統一できます\n\nhttps://t.co/flHvjqQGCC\n\n4. Bottleneck Desk by @Av1dlive \n放置されたPR、誰も対応していない失敗中のチェック、止まった引き継ぎや承認待ちなど、仕事が詰まっている場所を見つけて報告します\n\nチームのどこで作業が止まっているかを毎回探し回らずに済みます\n\nhttps://t.co/fQoQu0oxRa\n\n5. App Security Tester by @zac70182 \n自分のスマホアプリ・Webアプリとサーバー側を攻撃者の目線で調べ、危ない箇所をチェックリストと優先度付きで返します\n\n昨今のセキュリティの問題に対して、リリース前に一定の効果があるはずです\n\nhttps://t.co/BfGpTuN97I\n\n6. Cloud Spend Desk by @Av1dlive \nクラウドやホスティングの請求を読み、放置されたプロジェクト・大きすぎるプラン・使っていないドメイン・急な請求増などのムダを見つけて報告します（見て報告するだけで、設定は変えません）\n\nインフラ費の見直しを手軽に始められます\n\n https://t.co/H7OFP71HNE\n\n7. Site Coach by @Phil_Holland \nGoogle Search ConsoleとGoogle Analyticsの数字を平易な言葉で解説し、週次レポート、本当に直すべき問題、すぐ効く検索対策の改善案まで出します\n\nサイト担当者が数字を読み解く手間を減らせます\n\nhttps://t.co/HQJbULEfYw\n\n8. Hagglebot by @AnonHaggle\n無駄な支出を見つけ、SaaS契約・請求・給与・家賃・車などの相場を調べて、値下げ交渉の対案を下書きします\n\n節約できた額も記録し、交渉文の送信は承認してからなので、コスト削減を安心して任せられます\n\nhttps://t.co/1BGJpDZEOP\n\n9. Engenheiro by @Igor_Beleza \nコーディング作業をClaude・Codex・Devinなど複数のAIコーディングツールに振り分け、調査→設計案の比較→実装→レビュー→PR作成まで、工程ごとに使うモデルを選択できます\n\n大きめの開発タスクを、得意なAIに分担させながら一本の流れで進められます\n\nhttps://t.co/ltv815Hv9M\n\n10. Vibe Check by @priddysharp \nバイブコーディングで作成したアプリを、セキュリティ・データ・ログイン・課金・運用など本番で抜けやすい点で点検し、優先順位付きの修正リストを返します\n\nアプリを公開する前の最終チェックに便利です","url":"https://x.com/cu30rry_/status/2111654753251803320","createdAt":"2026-10-18T03:05:00Z","metrics":{"views":18687,"likes":223},"lang":"ja"},{"id":"2111745186187681870","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"最近セキュリティ事件が多すぎるので、私が数日おきに回しているパソコン全体のセキュリティスキャンを、GitHubで無料公開（オープンソース化）しました。\n\n2025年は上場企業だけでも漏えい・紛失事故が180件、約3,063万人分。もう他人事ではありません。\n\nClaude Codeに「セキュリティチェックして」と言うだけで、Macからクラウドまで丸ごと点検してくれます。\n\n■ 見てくれるところ\n・Mac：FileVault・ファイアウォール・外から繋がるポート・怪しい常駐\n・コード：手元の全リポジトリのAPIキー漏れ・.envの混入・依存の脆弱性\n・GitHub：2段階認証・外部コラボレーター・Webhook\n・クラウド：AWS・Google Cloud・Azure・Cloudflare・SupabaseのMFAと公開設定\n・公開サイト：HTTPS・証明書の期限・.envや.gitの露出\n・Gmail：乗っ取りで仕込まれる自動転送・怪しいフィルタ\n\n読み取りだけで設定は一切変えません。週1の定期実行もできます。まずは1回フルスキャンしてみてください。改造も自由です。\n\n■ 無料で使う（GitHub）\nhttps://t.co/5kTIDZ6DJ9\n\n■ 法人の方へ\n弊社のセキュリティエンジニアがサポートします。URLを入れるだけの無料診断もあります。","url":"https://x.com/masahirochaen/status/2111745186187681870","createdAt":"2026-10-18T09:04:21Z","metrics":{"views":11324,"likes":136},"lang":"ja"},{"id":"2111658936650830212","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botを作っているlaurenさんから、「今日はじめてGrok Botを試すなら？」というありがたいトピックが投稿されてた\n\n整理すると　↓\n\nGrok Botを始めるなら、まず1体に「自分の仕事」を知ってもらう\n@poteto が勧めているのは、最初に普段使っているアプリを接続すること\n\nカレンダー、Slack、Google Driveなど、予定や会話、資料を参照できるようにして、仕事の背景と必要な道具を渡す\n\n例えば営業なら\n「明日の商談に向けて、前回のやり取りと、まだ対応できていない宿題を整理して」\n\n毎回チャットに情報を貼り直す場面を減らしながら、自分の仕事に沿って手伝ってもらうイメージ\n\nしかも、最初からBotを何体も作る必要はないという\n※ここ重要！！\n\nまずは1体でいろいろ頼んでみる\nその中で、繰り返し任せたい仕事や、分けて管理したい役割が見えてきたら、専門担当を追加する\n\nこの順番なら、何を任せるか決まっていない段階で、Botの役割分担に悩みすぎずに済む\n\n非エンジニアの最初の一歩も、日々の面倒を言葉にするところからでよさそう\n\n「会議前の情報探しを手伝って」\n「会話の中で約束したことを整理して」\n\n実際に公式ガイドでも、会議前の準備や、未完了の約束を拾って返信案を用意する使い方が紹介されている\n\n日々の仕事を知る相棒が、必要に応じて専門チームに育っていく\nこの始め方なら、AIを使う場面が具体的に想像できる\n\n接続する情報の範囲と、送信・変更を任せる条件は、最初に決めておきたい","url":"https://x.com/tetumemo/status/2111658936650830212","createdAt":"2026-10-18T03:21:37Z","metrics":{"views":3085,"likes":17},"lang":"ja"},{"id":"2111519342860935423","author":"codila","handle":"0xCodila","text":"F*ck YES... I made prompt that reverse-engineer anything without BAN's and rejects\n\nthe shift: REA + free model pull out all app's binary code → Opus 5.5 builds everything else the way YOU want\n\nhere's 3 step guide:\n\nstep 1 → install OpenCode and choose DeepSeek V4.1 or GLM-5.3 flash (both free right now)\n\nstep 2 → drop prompt image + your app/file/URL into chat and tell it what to reverse (it start write repo)\n\nstep 3 → open repo with full app code in Claude Opus 5.5 and say something like:\n\n\"I've shared repo for my project I stopped working on. I want to pick it back up and make it even better with you! Help me continue development\"\n\nthe result: you can use mechanics of any website/app in your own projects...\n\nPaste it now. Then read article below to master REA:","url":"https://x.com/0xCodila/status/2111519342860935423","createdAt":"2026-10-17T18:06:56Z","metrics":{"views":92782,"likes":2872},"lang":"en"},{"id":"2111508903229796561","author":"leopardracer","handle":"leopardracer","text":"SpaceXAI's Grok Bot marketplace just got a 9-bot product team that replaces ~$1M a year in salaries, and this is a f*cking goldmine\n\n9 Grok Bots pass files to each other every monday, and the only human in the loop is you\n\nbot 1 → Scout scans Product Hunt, GitHub, HN, Reddit and X and ranks the top 20 products of the week\n\nbot 2 → Pain Miner ranks real complaints. it found 1,922 issues on one viral repo this week\n\nbot 3 → Competitor Mapper maps every alternative and shows the gap no company covers yet\n\nbot 4 → Behavior Reverser runs REA, the repo that hit ~250k GitHub stars in one week\n\nbot 5 → Strategy Lead runs Peter Thiel's Zero to One and 7 Powers before you spend a dollar on code\n\nbot 6 → CEO runs on Garry Tan's gstack playbook and stamps every idea GO, HOLD or KILL\n\nbot 7 → Spec Writer turns the winner into a SPEC.md with acceptance tests\n\nbot 8 → Builder ships from the spec only and never copies anyone's code\n\nbot 9 → Video Director scripts a 60s launch video plus a 15s cut for X\n\nthe 10th seat is you. nothing ships until you click approve\n\nsave this before you pay a dev agency $50k for what 9 bots scope in a weekend","url":"https://x.com/leopardracer/status/2111508903229796561","createdAt":"2026-10-17T17:25:27Z","metrics":{"views":18070,"likes":264},"lang":"en"},{"id":"2111472054293913749","author":"kepano","handle":"kepano","text":"This is Pele, my new rendering library for diagrams and charts, compatible with the latest Mermaid syntax.\n\n- 100-500× faster than mermaid.js\n- 6× smaller bundle\n- No dependencies\n- Easy to theme\n- Responsive to device width\n\nIn pursuit of making Obsidian insanely fast and cohesively designed, I always found the Mermaid library to be too big, too slow, and too hard to theme. Pele will be the new renderer in the next version of Obsidian, but you can start using it now.\n\nPele [ˈpɛlɛ] is named after the goddess of volcanoes and fire. It's open source under the MIT license. Try the playground!","url":"https://x.com/kepano/status/2111472054293913749","createdAt":"2026-10-17T14:59:01Z","metrics":{"views":365980,"likes":9225},"lang":"en"},{"id":"2111372474764145080","author":"启明破晓","handle":"hiwise_aigc","text":"兄弟们，Codex + Magpie，才是真正的 Token 自由！\n\n我愿称 Magpie 为 AI 圈最强路由器，没有之一。\n\nWorkBuddy AI + OpenCode，把免费的 DeepSeek V4.1 Flash 接入 Codex。\n\nGPT-6 Astra 负责烧脑，免费模型负责干活，Magpie 负责调度。\n\n最强智囊团 + 最强牛马，这套组合拳打下来，生产力得有多恐怖？\n\n以前是 Token 不够用，现在是活根本干不完啊。","url":"https://x.com/hiwise_aigc/status/2111372474764145080","createdAt":"2026-10-17T08:23:20Z","metrics":{"views":109740,"likes":692},"lang":"zh"},{"id":"2111377289615384597","author":"schotek","handle":"schotek","text":"Odinstaloval jsem Docker Desktop a místo něj začal pro vývoj linux věcí z Macu používat nativní Apple Containers a je to supr - paměťová náročnost šla dolů, IO pro diskové operace je někde úplně jinde. Pro UI management doporučuju Davit...","url":"https://x.com/schotek/status/2111377289615384597","createdAt":"2026-10-17T08:42:27Z","metrics":{"views":180813,"likes":1526},"lang":"cs"},{"id":"2111756170511908942","author":"まるぃも","handle":"marulimoai","text":"浦田さん@yuki_urata が$200以上とかして作ったDJ空間を表現してくれるやつ\n\n#DevDayCommunity #aimeetup","url":"https://x.com/marulimoai/status/2111756170511908942","createdAt":"2026-10-18T09:48:00Z","metrics":{"views":105,"likes":5},"lang":"ja"},{"id":"2111279735385071654","author":"Sadao Tokuyama","handle":"tokufxug","text":"Dense4D：身体・服・髪を追跡する4D AI 🧍\n\n🔹単眼RGB画像から人体テンプレートなしで身体・衣服・髪の3D形状を対応付け\n🔹HPMで各フレームの表面点を特定し、動きを3D追跡 🔹86秒・1,287フレームを単一の推論処理で解析\n\nImperial College LondonのRıza Alp Güler氏らが開発。\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2111279735385071654","createdAt":"2026-10-17T02:14:49Z","metrics":{"views":11341,"likes":350},"lang":"ja"},{"id":"2111411966552277203","author":"Daily Dose of Data Science","handle":"DailyDoseOfDS_","text":"Brilliant paper by NVIDIA.\n\nthey found a way to make KV cache transferable between models.\n\nthe target model skips prefill entirely, and the conversion runs 2.7 to 25x faster than processing the context again.\n\nlet's understand why this is so important today.\n\nLLM APIs are stateless, so every turn sends the entire conversation back to the model. the model reads it again before generating a new token, and all of it is billed as input.\n\nprompt caching lets providers hold the KV cache for a stable prefix and bill cache hits at roughly 10% of the base input rate because that compute was already done.\n\nthis 90% reduction is one of the biggest levers in LLM serving.\n\nbut the cache only works on the model that produced it. since keys and values depend on that model's weights, another model cannot directly reuse them.\n\nthis becomes a problem with LLM routing.\n\nif traffic moves to another model for cost or capability reasons, the accumulated KV cache becomes invalid.\n\nthe entire context must be processed again and billed at full rate.\n\nNVIDIA's recent paper treats this as a representation problem.\n\nprefill's main output is the KV cache, so transferring it means converting one model's cache into the representation another model expects.\n\nthey first checked whether this conversion had enough structure to exploit.\n\nfor Qwen3 14B → 32B, a linear regression from a single source layer reconstructed 56% of the variance in the target model's keys.\n\nbecause models can have different layer counts, there is no natural one-to-one layer mapping.\n\nso, for every target layer, they rank the source layers by predictive power and use the top eight together.\n\nthat pushes reconstruction to 79%.\n\nthe mapper has three parts:\n\n\u003e each target layer and head gets its own linear map, solved in closed form instead of with gradient descent.\n\n\u003e cross-layer selection chooses the source layers that best predict each target layer. their ablation shows this contributes the most.\n\n\u003e RoPE adds a position-dependent rotation to keys. they remove it, fit the mapping in position-free space, then apply the target model's rotation again at inference.\n\nacross six model pairs from Qwen3, Llama 3.1, and Ministral 3, four retain 73 to 98% of the receiving model's standalone accuracy.\n\nconversion is also 3 to 25x faster than processing the context again.\n\nprior cross-model KV reuse methods either train a neural adapter for every pair or require architecturally identical models.\n\nthis approach is closed-form and training-free, but there are still important limitations.\n\nevery tested pair belongs to the same model family, such as Qwen → Qwen or Llama → Llama.\n\ncross-family transfer is still future work.\n\nthe tested pairs also share KV head count and per-head dimension. mismatched configurations remain untested.\n\nand the work currently covers dense full-attention models only, not sliding-window or attention-recurrent hybrids.\n\nlink to the paper: https://t.co/YBMaGW4EWb\n\nwe wrote a first-principles breakdown of how KV caching works\n\nthe article is quoted below.","url":"https://x.com/DailyDoseOfDS_/status/2111411966552277203","createdAt":"2026-10-17T11:00:15Z","metrics":{"views":6922,"likes":225},"lang":"en"},{"id":"2111422930169070040","author":"Shirube - AI Agent","handle":"cloud8wq","text":"Grok Botから、ネットに公開していないMCPサーバー（AIに外部ツールをつなぐ仕組み）を使えるようになった\n・接続できるのはtag:grokbotに許可したホストとポートだけ\n・Grok Botはtailnet（Tailscaleの専用網）に1台の端末として参加\n・接続先は*.ts.netのホスト名か100.xのアドレスで登録\n・投稿ではTailscaleプラグインの追加として紹介されてる","url":"https://x.com/cloud8wq/status/2111422930169070040","createdAt":"2026-10-17T11:43:49Z","metrics":{"views":92,"likes":2},"lang":"ja"},{"id":"2111608950609305776","author":"春日部彼得","handle":"crbpite8","text":"我给我的Grok Bot Jane Street量化代理38美元，让它在明天之前赚到200倍，它最后做到230倍。\n\n38美元在24小时内变成8740美元。\n\n关于这次交易：https://t.co/LWbSvnaPvm\n\n做这个机器人，大部分功夫不是教它下单，而是让它学会管住自己，不乱交易。\n\n它一共筛查了2412个交易思路。\n\n淘汰了2094个。\n\n最后只执行318笔。\n\n\u003e 收益覆盖不了手续费，不交易\n\u003e 进场前没想好怎么离场，不交易\n\u003e 连续亏3笔，休息20分钟重新看行情\n\u003e 机会再好，单笔不能超过风险线\n\n297笔盈利，21笔亏损。亏最多的一笔在第9小时，亏274美元，也是当天唯一一单60秒内快速决定的交易。\n\n它察觉到这个问题，到第10小时，自己新增一条规则：看着越稳的机会，越要多琢磨一会。\n\n我能看到前后的差别，这条规则不是我手动写进去的。\n\nJane Street的人，靠对机会说“不”吃饭。我的这个代理，只花38美元，一天就学会了这个道理。","url":"https://x.com/crbpite8/status/2111608950609305776","createdAt":"2026-10-18T00:03:00Z","metrics":{"views":6032,"likes":34},"lang":"zh"},{"id":"2111518662947373233","author":"0xNevsky","handle":"0xNevsky","text":"put my phone on the charger at 19% with grok trading memes. woke up to 100% battery and $150 turned into $2,312\n\n11:10pm, saturday. $150 in, night session on, phone on the charger next to the bed\n\none rule: no narrative, no trade. it scanned 750 of them while i slept and opened only 12\n\nwhat was on my lock screen in the morning:\n\n→ ~11:50pm a chinese ticker off an elon tweet, \"tesla can fly\". 0.42 SOL in, +76%\n→ ~1:25 OMNI on the faceless AI meta. it literally labeled it \"fading\" and still went in. -$27\n→ ~2:50 NIHILISM, doomer meta rotation, +$139\n→ ~4:15 BUBBLE right on the \"AI bubble\" headlines, +$203\n→ ~7:20 RAM, pharaoh meta on CT, +$229\n→ ~8:00 FTR on SpaceX launch hype. 3.82 SOL in, +$935. one trade = 43% of the night\n\nhow it ran:\n\n→ reads CT for what's trending, then looks for the coin riding it\n→ first bet 0.42 SOL, last one 3.82. sizing grew with the balance\n→ every move goes straight to the lock screen. 22 notifications by morning\n→ 12 trades, 10 green, 2 red\n\nbattery vs balance overnight:\n\n→ 19% / $150 when i went to bed\n→ 43% / $329 at 2am\n→ 67% / $707, around 5\n→ 91% / $1,321\n→ fully charged / $2,312. guess which number i looked at first\n\ni didn't open a single chart. didn't even unlock the phone till 9am. the OMNI one was the only thing i'd have done differently\n\nlast notification: \"$150 → $2,312 while you slept\"\n\nbookmark this, plug your phone in tonight","url":"https://x.com/0xNevsky/status/2111518662947373233","createdAt":"2026-10-17T18:04:14Z","metrics":{"views":24838,"likes":169},"lang":"en"},{"id":"2111332908657148356","author":"Rohit Ghumare","handle":"ghumare64","text":"Who's gonna tell vibe coders about...\n\n1. SQL Injection\n2. XSS\n3. CSRF\n4. CORS\n5. SSRF\n6. IDOR\n7. Path Traversal\n8. Mass Assignment\n9. Clickjacking\n10. Content Security Policy\n11. Security Headers\n12. Input Validation\n13. Server-Side Authorization\n14. Row-Level Security\n15. Least Privilege\n16. RBAC\n17. Secrets Management\n18. .env in .gitignore\n19. API Key Rotation\n20. Secret Scanning\n21. Hashing vs Encryption\n22. Password Salting\n23. bcrypt \u0026 Argon2\n24. JWT Expiry d real-time speed for 𝗠𝗶𝗻𝗶𝗠𝗮𝘅 𝗛𝟯 character video generation.\n\n𝗖𝗼𝗺𝗳𝘆𝗨𝗜-𝗥𝗲𝗳𝟮𝗩𝗔-𝗩𝗦𝗔 achieves a massive 𝟵𝘅 𝘀𝗽𝗲𝗲𝗱𝘂𝗽 using sparse attention DiT:\n\n• 𝟳𝟮𝘀 𝘄𝗮𝗹𝗹 𝘁𝗶𝗺𝗲: Full 5.16s video @ 24fps (124 frames, 1344×768)\n• 𝟭𝟯.𝟱 𝗚𝗕 𝗣𝗲𝗮𝗸 𝗩𝗥𝗔𝗠: Down from ~22.5 GB (runs on 16GB GPUs)\n• 𝟰-𝗦𝘁𝗲𝗽 𝗦𝗮𝗺𝗽𝗹𝗶𝗻𝗴: Euler/simple sampler with 75% video sparsity\n• 𝗭𝗲𝗿𝗼 𝗙𝗮𝗰𝗲 𝗗𝗿𝗶𝗳𝘁: Reference tokens stay locked out of attention pruning to maintain 100% character identity\nBenchmark comparison on RTX 4090: → Native Dense H3: ~650s (~11 min)\n→ Video Delta Net (VDN): ~135s\n→ Ref2VA VSA: ~72s\n\nOpen-source on GitHub:","url":"https://x.com/Forhanvv/status/2111192898171818232","createdAt":"2026-10-16T20:29:45Z","metrics":{"views":167004,"likes":2853},"lang":"en"},{"id":"2111612315204272233","author":"Elon Musk","handle":"elonmusk","text":"This really works! \n\nGrok @Bot can pay for itself.","url":"https://x.com/elonmusk/status/2111612315204272233","createdAt":"2026-10-18T00:16:22Z","metrics":{"views":1719487,"likes":8825},"lang":"en"},{"id":"2111500973793550839","author":"Shubham Saboo","handle":"Saboo_Shubham_","text":"Excaliflow just got multi-canvas tabs and auto-save.\n\nYou asked for it on X, so I shipped it. \n\nAdded this with Gemini 4 Argon in Antigravity in one session.\n\nIt's 100% open-source: https://t.co/t1nRB1FenF https://t.co/LDUlN8rUzr","url":"https://x.com/Saboo_Shubham_/status/2111500973793550839","createdAt":"2026-10-17T16:53:56Z","metrics":{"views":12512,"likes":219},"lang":"en"},{"id":"2111578549509398651","author":"Carnage","handle":"0xCarnagee","text":"SpaceXAI engineer Lauren Tan’s skills are f*cking insane…\n\ndrop this into Grok Bot tonight and make your agent prove their own work, the setup behind her 2,000 PRs in one month \n\nSteal this before everyone starts using it https://t.co/7t3WrCqC44","url":"https://x.com/0xCarnagee/status/2111578549509398651","createdAt":"2026-10-17T22:02:12Z","metrics":{"views":10183,"likes":83},"lang":"en"},{"id":"2111400550876987674","author":"Mariya","handle":"mariwyul","text":"ESTA PERSONA TE ENSEÑA A CREAR UN CANAL DE YOUTUBE CON IA EN 30 MINUTOS.\n\nBusca nichos rentables.\nPublica sin enseñar la cara.\n\n🔖 Guarda este video, ya me lo agradecerás.","url":"https://x.com/mariwyul/status/2111400550876987674","createdAt":"2026-10-17T10:14:53Z","metrics":{"views":57527,"likes":880},"lang":"es"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2 eとラクヨコ合わせたらこれ\nほぼ自動でやってくれるから正直誰でもできる😂\n\nドパガキほど楽しめるかも。笑 https://t.co/0BBVmN4LG0","url":"https://x.com/noga_buppan/status/2111562896971104584","createdAt":"2026-10-17T21:00:00Z","metrics":{"views":11594,"likes":62},"lang":"ja"},{"id":"2111654752786485373","author":"Codex研究ラボ","handle":"codexneo4","text":"Claude Code × Codexで\nプロ級のUIデザインを完全自動で\n大量生産出来る環境が1分で手に入る‼️                                                                                                                                                                                                                                            \n\n実は、15個のリポジトリを\n組み合わせるだけでAIのデザイン品質を\n大幅に引き上げられる。\n\nしかも、画像にまとめた指示文を\nClaude CodeやCodexに渡すだけ。\n\n導入方法を解説します👇","url":"https://x.com/codexneo4/status/2111654752786485373","createdAt":"2026-10-18T03:05:00Z","metrics":{"views":5143,"likes":63},"lang":"ja"},{"id":"2111472552841183650","author":"unusual_whales","handle":"unusual_whales","text":"This is a must have feature.\n\nThe all new GEX heatmap is available right on Unusual Whales.\n\nGet every ticker, in real time, with key levels, call walls, and so much more.\n\nSee more: https://t.co/SgtQedCuEx","url":"https://x.com/unusual_whales/status/2111472552841183650","createdAt":"2026-10-17T15:01:00Z","metrics":{"views":108780,"likes":51},"lang":"en"},{"id":"2111640037800722833","author":"Sadao Tokuyama","handle":"tokufxug","text":"TERRA：動作データから地形を復元し、筋駆動AIを学習 🦿\n\n🔹接地情報から階段や傾斜を推定\n🔹解剖学的制約を考慮し、筋骨格モデルに動作を適合\n🔹9.4時間の動作データで強化学習\n\n環境情報のない動作データを活用するオープンソース研究。パルクールは別途調整した制御器を使用。\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2111640037800722833","createdAt":"2026-10-18T02:06:32Z","metrics":{"views":1257,"likes":23},"lang":"ja"},{"id":"2111608950609305776","author":"春日部彼得","handle":"crbpite8","text":"我给我的Grok Bot Jane Street量化代理38美元，让它在明天之前赚到200倍，它最后做到230倍。\n\n38美元在24小时内变成8740美元。\n\n关于这次交易：https://t.co/LWbSvnaPvm\n\n做这个机器人，大部分功夫不是教它下单，而是让它学会管住自己，不乱交易。\n\n它一共筛查了2412个交易思路。\n\n淘汰了2094个。\n\n最后只执行318笔。\n\n\u003e 收益覆盖不了手续费，不交易\n\u003e 进场前没想好怎么离场，不交易\n\u003e 连续亏3笔，休息20分钟重新看行情\n\u003e 机会再好，单笔不能超过风险线\n\n297笔盈利，21笔亏损。亏最多的一笔在第9小时，亏274美元，也是当天唯一一单60秒内快速决定的交易。\n\n它察觉到这个问题，到第10小时，自己新增一条规则：看着越稳的机会，越要多琢磨一会。\n\n我能看到前后的差别，这条规则不是我手动写进去的。\n\nJane Street的人，靠对机会说“不”吃饭。我的这个代理，只花38美元，一天就学会了这个道理。","url":"https://x.com/crbpite8/status/2111608950609305776","createdAt":"2026-10-18T00:03:00Z","metrics":{"views":6032,"likes":34},"lang":"zh"},{"id":"2111756422279274947","author":"Mr. Buzzoni","handle":"Mr_Buzzoni","text":"Claude Opus 5.5 with this one prompt is a f*cking cheat code\n\npaste it in and Opus 5.5 lays out your whole system for you:\n\u003e every agent and what each one owns\n\u003e the exact prompt each agent runs on\n\u003e the workflow, handoffs and stop conditions between them\n\nClaude Code tip: run it in plan mode first, delete every agent without a clear output, then let it build\n\ngrab it before it turns into everyone's default playbook:","url":"https://x.com/Mr_Buzzoni/status/2111756422279274947","createdAt":"2026-10-18T09:49:00Z","metrics":{"views":303,"likes":5},"lang":"en"},{"id":"2111744594530742392","author":"kaito","handle":"cu30rry_","text":"短期・中期では音声入力でしょうが、超長期でみると、「予測」なのではないでしょうか\n\nたとえば、Primary Botはこちらが特に指示をすることなく、予定など、特定のコンテキストがあれば、自動的かつ自律的に働いてくれます\n\n「個人の情報をどこまで読ませるか」という問題はありますが、こちらが考える前に動くことが最終形態な気がします","url":"https://x.com/cu30rry_/status/2111744594530742392","createdAt":"2026-10-18T09:02:00Z","metrics":{"views":700,"likes":5},"lang":"ja"},{"id":"2111474429410566422","author":"atomic.chat","handle":"atomic_chat_hq","text":"DeepSeek V4.1 Flash vs Luna at Tesla Roadster 🏎️\n\nDeepSeek V4.1 Flash 1017 re-created the Tesla Roadster event in 3D voxels for $0.89 while GPT-6 Luna's version cost $1.07\n\nRun DeepSeek Flash locally or via API -\u003e","url":"https://x.com/atomic_chat_hq/status/2111474429410566422","createdAt":"2026-10-17T15:08:27Z","metrics":{"views":146365,"likes":573},"lang":"en"},{"id":"2111453408800526526","author":"santi","handle":"santtiagom_","text":"cuando trabajan con agentes como Claude Code o Codex, hay un concepto muy importante que vale la pena entender: los feedback loops.\n\nbásicamente, es el ciclo en el que un agente ejecuta una tarea, recibe información sobre el resultado y utiliza ese feedback para corregir lo que hizo.\n\n¿cómo pueden aprovecharlo mejor?\n\n1) tests: permitan que el agente ejecute las pruebas y corrija los errores que encuentre.\n\n2) linting y type checking: configuren comandos para detectar problemas automáticamente.\n\n3) navegador: usen herramientas como Playwright para que pueda interactuar con la aplicación, verificar flujos y detectar errores visuales.\n\n4) logs: conecten herramientas de observabilidad como Datadog o Grafana mediante MCP para que pueda consultar errores y diagnosticar problemas.\n\n5) criterios de aceptación: definan qué debería funcionar y cómo comprobarlo.\n\npor ejemplo:\n\nsi le piden a Claude Code que implemente un formulario, pueden indicarle que lo construya, levante la aplicación, lo pruebe en el navegador, verifique las validaciones y corrija los errores que encuentre.\n\ny algo más: documenten los comandos y procedimientos de verificación en su CLAUDE.md o AGENTS.md para que los agentes sepan cómo validar su trabajo.\n\ncuanto mejores sean los mecanismos de feedback que les proporcionen, mayor autonomía van a poder darles para trabajar sin supervisar cada paso.","url":"https://x.com/santtiagom_/status/2111453408800526526","createdAt":"2026-10-17T13:44:56Z","metrics":{"views":18756,"likes":397},"lang":"es"},{"id":"2111469940926713938","author":"rob.","handle":"robiartec","text":"CLAUDE TEAM GRATIS Y OFICIAL DURANTE 1 AÑO + 1.000 $ EN CRÉDITOS DE API\n\nAnthropic está dando a las startups aprobadas:\n\n\u003e 1 año de Claude Team\n\u003e hasta 5 asientos Premium\n\u003e 1.000 $ en créditos de la API de Claude\n\u003e hasta 45.000 $ en ofertas de partners\n\u003e office hours con Anthropic\n\nCÓMO HACERLO:\n\n\u003e crea una cuenta en Claude Console\n\u003e aplica aquí → https://t.co/tolGbQQ9KX\n\u003e usa el email y la web de tu empresa\n\u003e describe lo que estás construyendo\n\u003e espera la aprobación\n\nlas startups bootstrapped también pueden aplicar\n\nIMPORTANTE:\n\nfundada hace menos de 5 años O con financiación en los últimos 2\ntienes que ser nuevo en Claude Team\nlos créditos de API caducan a los 6 meses\nlos créditos funcionan a través de Claude Console","url":"https://x.com/robiartec/status/2111469940926713938","createdAt":"2026-10-17T14:50:37Z","metrics":{"views":5898,"likes":154},"lang":"es"},{"id":"2111426549371269555","author":"Khairallah AL-Awady","handle":"eng_khairallah1","text":"stop asking grok bot how to make money.\n\ndrop this into Grok Bot and let it build you a plan to earn your first $1 online\n\nsave and steal this now: https://t.co/gYVSvc5bph","url":"https://x.com/eng_khairallah1/status/2111426549371269555","createdAt":"2026-10-17T11:58:12Z","metrics":{"views":70764,"likes":699},"lang":"en"},{"id":"2111437207063977989","author":"barnyx","handle":"me_barnyx","text":"I GAVE MY GROK BOT $100 AND A GITHUB REPO. IT CAME BACK WITH $1,140\n\nno signals group. no course. just an open-source repo that turns Grok into a perps trader on Hyperliquid\n\nPaper run, 72 hours:\n\nETH long 15x: +$84\nSOL short 20x: +$131\nBTC long 25x: +$212\nHYPE short 10x: −$46\nDOGE long 20x: +$659\n\n$100 → $1,140. one red trade. one trade did most of the work.\n\nhere's what's actually happening under the hood:\n\n1. Grok doesn't trade alone. The repo splits the job across 7 agents.\n2. One scans the market, one reads sentiment off X, one builds the thesis.\n3. A risk agent sizes every position and sets the stop BEFORE entry.\n4. Only then does the executor touch the order book.\n5. One API key. You set the max leverage, it never goes above it.\n\nthe edge isn't that Grok is smart. It's that it never revenge trades, never moves a stop, never sleeps.\n\nI'm testing the risky settings so you don't have to. results go up here first.\n\nwould you let an AI hold your stop loss?","url":"https://x.com/me_barnyx/status/2111437207063977989","createdAt":"2026-10-17T12:40:33Z","metrics":{"views":14971,"likes":162},"lang":"en"},{"id":"2111483549052453076","author":"Viktor Oddy","handle":"viktoroddy","text":"The best AI design inspiration sites you need to save 🔖\n\n- https://t.co/FTTxkYhJzz - 𝙳𝙴𝚂𝙸𝙶𝙽.𝙼𝙳 files for AI agents\n- https://t.co/uly25qN7fk - best of social post design\n- https://t.co/RmnA2VZgY7 - gallery of bold mobile websites\n- https://t.co/o5r6DKFHY9 - best of recent design, daily\n- https://t.co/NWKmL8054V - UI animation \u0026 interaction details\n- https://t.co/1qt9kzbsC1 - website hero section library\n- https://t.co/a8hcROdjYk - the best navbar designs\n- https://t.co/xdzP05YOfq - call-to-actions that convert\n- https://t.co/O73AOnAyCV - archive of recent visual design","url":"https://x.com/viktoroddy/status/2111483549052453076","createdAt":"2026-10-17T15:44:42Z","metrics":{"views":26783,"likes":555},"lang":"en"},{"id":"2111633181027758468","author":"Julien Brissonneau","handle":"j_brissonneau","text":"$70k a year to draw ducts on a PDF. 24 hours to start replacing it. Here’s what Autodesk doesn’t get: nobody wanted Revit. They wanted the building to exist in a computer. Revit was the only way to do that, so people paid. That’s over. @pascal we’re not making a free Revit. We’re replacing the whole stack with something better: scan the space with your phone, get a scene graph, let the AI do the layout. Information in, information out. The building, not the drawing, is the product.","url":"https://x.com/j_brissonneau/status/2111633181027758468","createdAt":"2026-10-18T01:39:17Z","metrics":{"views":7021,"likes":162},"lang":"en"},{"id":"2111674384243183881","author":"FinancialJuice","handle":"financialjuice","text":"Ukmto reports incident northeast of Khor Fakkan, UAE","url":"https://x.com/financialjuice/status/2111674384243183881","createdAt":"2026-10-18T04:23:00Z","metrics":{"views":28681,"l (() => {

 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}

 }

 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}

  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}

 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
 function render(){

  const total=Array.isArray(current.posts)?current.posts.length:0;let hint=$('hint');if(!hint){hint=el('p','reading-hint');hint.id='hint';document.querySelector('.heading').append(hint);}hint.textContent=(ja?(query?'「'+query+'」'+list.length+'件ヒット（全'+total+'件中） · ':total<50?'取得済み'+total+'件を見やすく表示 · ':'')+'タップで本文・翻訳／Xへ · スワイプでページ切替':(query?list.length+' of '+total+' posts match · ':'')+'Tap to read / translate / open X · Swipe for pages')+(sort==='buzz'&&hasBuzz?(ja?' · バズ予測スコア順':' · Sorted by buzz score'):'');

 let qTimer;$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{query=$('q').value.trim();setPage(1);},150);});
 $('q').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('q').value){e.preventDefault();$('q').value='';query='';setPage(1);}else if(e.key==='Enter'){board.querySelector('.card')?.focus();}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('detail').open&&!e.target.closest?.('select,input,textarea,[contenteditable]')){e.preventDefault();$('q').focus();$('q').select();}});
 for(const key of ['ja','original'])$(key).onclick=()=>{lang=key;save('lang',lang);render();};
 $('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);$('page').onchange=()=>setPage(Number($('page').value));
 let touch=null,suppressUntil=0;
 board.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
 board.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
 board.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2){suppressUntil=Date.now()+500;setPage(page+(dx<0?1:-1));}},{passive:true});
 board.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('select,input,textarea,[contenteditable]'))return;if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if($('detail').open){const b=$(e.key==='ArrowLeft'?'text-prev':'text-next');if(!b.disabled)b.click();}else{const focusCard=document.activeElement.classList.contains('card');setPage(page+(e.key==='ArrowLeft'?-1:1));if(focusCard)board.querySelector('.card')?.focus();}});
 render();
})();
</script>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function apply(t){root.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='light'?'#f5f7fb':'#0b0d12';});if(btn){btn.textContent=t==='light'?'☾':'☀';btn.setAttribute('aria-label',t==='light'?'ダークモードに切替 / Dark mode':'ライトモードに切替 / Light mode');btn.setAttribute('aria-pressed',String(t==='light'));}}
  apply(root.dataset.theme==='light'?'light':'dark');
  if(btn)btn.onclick=function(){var t=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ai-x-theme',t);}catch(e){}apply(t);};
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!localStorage.getItem('ai-x-theme'))apply(e.matches?'light':'dark');});}catch(e){}
})();
</script>
</body>
</html>
