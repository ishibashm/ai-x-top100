<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151a22;--line:#2a3140;--text:#eef2fa;--muted:#8b93a7;--accent:#7dd3a8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{height:100vh;height:100dvh;max-width:1366px;margin:auto;padding:8px;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#141822,#10141c)}
.heading{min-width:0;flex:1 1 250px}h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
button,select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text);min-height:36px;padding:5px 10px;cursor:pointer}
select{max-width:235px;min-width:0}.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:24px}.seg button{border:0;min-height:30px;color:var(--muted)}button.active{background:var(--accent);color:var(--bg);font-weight:800}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pages{display:flex;gap:3px;align-items:center}#page{max-width:112px}.home{font-size:11px;color:var(--muted);white-space:nowrap}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:6px;min-height:0;overflow:hidden;touch-action:pan-y}
.card{min-width:0;min-height:0;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--line);border-radius:10px}.card:hover{background:#1c2330;border-color:#3d4a63}.top{display:flex;align-items:center;gap:5px;min-width:0}.rank{font-size:10px;color:#9eb0d0;flex-shrink:0}.avatar,.fallback{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#2a3348}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.who{min-width:0;flex:1}.name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric{font-size:9px;color:var(--accent);white-space:nowrap;flex-shrink:0}.copy{display:flex;gap:5px;min-height:0;overflow:hidden;flex:1}.snippet{font-size:10px;line-height:1.28;color:#c8d0e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0;flex:1}.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}.slot{border:1px dashed #202735;border-radius:10px;min-height:0;display:grid;place-items:center;color:#454e61;font-size:9px}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px;max-width:480px;line-height:1.7}
@media(max-height:900px){.snippet{font-size:9px;-webkit-line-clamp:2}.card{padding:4px 6px;gap:2px}}
@media(orientation:portrait){#board{gap:5px}.controls{width:100%;justify-content:space-between}.heading{flex-basis:100%}}
@media(max-width:600px){header{padding:5px}.controls{gap:3px}select{max-width:190px}.home{display:none}.avatar,.fallback{display:none}.metric{display:none}.card{padding:3px}.name{font-size:9px}.thumb{width:24px;height:24px}}
/* Larger touch targets, while retaining the fixed 50-card board. */
#account{min-height:44px;max-width:310px;font-size:12px;font-weight:700;border-color:var(--accent);background:#182b28}
.pages button{min-width:44px;min-height:44px}.seg button{min-height:40px}
.card{text-align:left;cursor:pointer;appearance:none;letter-spacing:normal}
.reading-hint{font-size:10px;color:var(--muted);margin-top:3px}
dialog{margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);overflow:hidden}
dialog::backdrop{background:#000b}.detail-head,.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head h2{font-size:16px;overflow-wrap:anywhere}.detail-head button,.detail-actions button{min-width:44px;min-height:44px}
#detail-meta{font-size:11px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}#detail-text{font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px}
.detail-actions{margin-top:16px;flex-wrap:wrap}#detail-range{font-size:12px;color:var(--muted)}#detail-link{color:var(--accent);font-size:13px}#detail-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-height:600px){dialog{padding:12px}#detail-text{font-size:14px;line-height:1.4;min-height:80px}.detail-actions{margin-top:6px}}
/* Fit the current page to the viewport, without placeholder cards. */
#board{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,10),minmax(0,1fr))}
#board.roomy .card{padding:8px;gap:6px;border-radius:12px}
#board.roomy .name{font-size:12px}#board.roomy .snippet{font-size:12px;line-height:1.4;-webkit-line-clamp:6}
#board.roomy .thumb{width:38%;height:100%;max-height:160px;min-height:0;object-fit:cover}
#board.roomy .copy{align-items:stretch}#board.roomy .avatar,#board.roomy .fallback{width:28px;height:28px}
.language{font-size:9px;color:var(--muted);flex-shrink:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}#account{min-height:48px}#page{min-height:44px}
#detail-translate{color:var(--accent);font-size:13px;min-height:44px;align-items:center}#detail-translate:not([hidden]){display:inline-flex}
@media(max-height:600px){#board.roomy .card{padding:4px;gap:2px}#board.roomy .snippet{font-size:10px}}
/* バズ予測バッジ（予測のある投稿だけに表示）。 */
.buzz{font-size:9px;font-weight:800;line-height:1.6;color:var(--bg);background:var(--accent);border-radius:8px;padding:0 5px;flex-shrink:0;white-space:nowrap}
.buzz.mid{background:#c9a227}.buzz.low{background:#3a4458;color:#c8d0e2}
#board.roomy .buzz{font-size:11px;padding:1px 7px}
#sort{max-width:150px}

/* ライトテーマ（OS設定に追従、手動切替はlocalStorageに保存）。 */
:root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--card-h:#eef2f8;--line:#d5dbe6;--text:#141a26;--muted:#5b6478;--rank:#3d5a8a;--accent:#1f8a5b}

:root[data-theme="light"] .snippet{color:#2c3446}:root[data-theme="light"] .pill{background:#e8edf5;color:var(--text)}
:root[data-theme="light"] .card:hover{background:var(--card-h,#eef2f8);border-color:#b8c2d4}

:root[data-theme="light"] #account{background:#e7f5ee}
:root[data-theme="light"] .buzz.low{background:#dfe4ee;color:#344}
.icon-btn{appearance:none;font:inherit;font-size:15px;line-height:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#q{font:inherit;font-size:12px;min-height:44px;width:150px;max-width:40vw;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#121722;color:var(--text)}
:root[data-theme="light"] #q{background:#fff;color:var(--text)}
#q::placeholder{color:var(--muted)}
@media(max-width:600px){#q{width:110px}}
</style>
</head>

pus 5、同じ586ページ、同じ時間で21ページしか処理できず、$1.43を消費。","url":"https://x.com/borjafat/status/2101018783976722479","createdAt":"2026-09-18T18:41:27.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101018477087592448/img/9YlAHKLLo_h6rgtK.jpg","metrics":{"views":587077,"likes":3269}},{"id":"2100864907046768890","author":"Sac","handle":"Saccc_c","text":"マジかよ、Codexの組み込みcomputer useより速くPC操作できる方法が本当にあったなんて\n\nCodex+Jevを使って強化版computer useを作ってみたよ。俺はこれを「Jev Use」と呼んでる。組み込みのより速くてスムーズ、トークン消費はほぼ同じ","url":"https://x.com/Saccc_c/status/2100864907046768890","createdAt":"2026-09-18T08:30:00.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100853279089647616/img/H6altwjZQ28_1bfY.jpg","metrics":{"views":419141,"likes":1581},"textJa":"まさか、Codex内蔵のcomputer useより速くパソコンを操作する方法が本当にあるとは。\n\nCodex＋Jevで強化版computer useを作ってみた。名付けて「Jev Use」。内蔵版より速く滑らかで、トークン消費はほぼ同じ。\n\n「Macのカレンダーに予定を追加する」比較動画を作った。同じ内容でも、Jev版は全体を通してほとんど停止しないのが分かる。\n\nぜひJevを自分で試してほしい。Codexの操作速度を10倍にし、大量のトークンを節約できる！\n\nJevは判断型の仕事に非常に向いており、ミリ秒以内に正しい判断ができ、トークン単価も極めて低い。特に次の場面に適している：\n\n1．computer use\nJevを操作の判断層として使い、モデルにパソコンを素早く操作させる。\n\nhttps://x.com/gregpr07/status/2100411066966749359\n…","lang":"en"},{"id":"2101388186916454439","author":"Nailthy Tang","handle":"nailthy62","text":"jev は狂ってる \n\nこれがあればリアルタイムのバーチャル試着動画が実現可能になる。\n\n@typesafeai\n と一緒に Drape のためにこの実験を構築したよ。\n\n\u003e 僕が話す\n\u003e jev がトランスクリプト＋僕の服装を読み取る\n\u003e 僕のクローゼットから選ぶ\n\u003e リアルタイムで僕の服装を変える","url":"https://x.com/nailthy62/status/2101388186916454439","createdAt":"2026-09-19T19:09:20.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101384523124740096/img/1Q6moTMdLcZ-mJ3r.jpg","metrics":{"views":30310,"likes":416}},{"id":"2100893262890614944","author":"usutaku","handle":"usutaku_channel","text":"今Xで話題のAI「Jev」\n\n何が凄いかを、初心者向けに40秒で解説","url":"https://x.com/usutaku_channel/status/2100893262890614944","createdAt":"2026-09-18T10:22:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2100893179394641920/img/aW8b-3zp0zH7Nbjp.jpg","metrics":{"views":71871,"likes":750}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","media":"https://pbs.twimg.com/media/HSk-BWEagAAExwt?format=jpg\u0026name=small","metrics":{"views":15857,"likes":106}},{"id":"2101132185868861747","author":"聖星あい＠AI愛好家","handle":"seisei_ai_1st","text":"「家、突撃してもイイですか？」 \n最後、意外な展開が、、、 \n\n#国木田さりまるチャレンジ \n\nCreate by CapCut\n\n@capcutapp_jp\n\n#CapCutCPP\n\n","url":"https://x.com/seisei_ai_1st/status/2101132185868861747","createdAt":"2026-09-19T02:12:04.000Z","media":"https://pbs.twimg.com/media/HSi2pZmbwAA3T9J.jpg","metrics":{"views":2642,"likes":38}},{"id":"2101246340215058811","author":"ノウチ","handle":"ouchi","text":"AIで英語学習を習慣化する方法\n\n・ChatGPTのボイスモードで英語で話す\n↓\n・ある程度話したら「今の会話から私の英語レベルを教えて」と聞く\n↓\n・レベルが分かったら「私のレベルに合った学習プリントをPDFで作って」と伝える\n↓\n・スケジュールタスクにして毎朝プリントを作ってもらう\n↓","url":"https://x.com/ouchi/status/2101246340215058811","createdAt":"2026-09-19T09:45:41.000Z","media":"https://pbs.twimg.com/amplify_video_thumb/2101243751779962880/img/Uiouh9BvURG4oHwe.jpg","metrics":{"views":807,"likes":14}},{"id":"2101425211774222439","author":"うみゆき@AI研究","handle":"umiyuki_ai","text":"トランプ大統領曰く、データセンター反対運動は米国を破壊するためのデマだったが、お次はAIそのものが攻撃されている！AI減速なんて必要ない。新しいAI規制ルールなんて作らなくても既存の法制度で十分問題に対応できる。その一方で政府にはAIフォース（AI軍？）を設置して、その責任者を任命するので","url":"https://x.com/umiyuki_ai/status/2101425211774222439","createdAt":"2026-09-19T21:36:27.000Z","media":"https://pbs.twimg.com/media/HSmPEpIacAAMWL7?format=jpg\u0026name=small","metrics":{"views":880,"likes":6}},{"id":"2101196067765092754","author":"code w/Guillaume","handle":"guillaume_rygn","text":"この男が、JEVに関連するすべてのプロジェクトを、彼が見かけたものを集めて、一つのサイトにまとめました！\n\nユースケースを見るのに悪くなく、ちょっとインスピレーションを得るのにもいい感じ！ サイトはこちら \nhttps://\njevable.com ","url":"https://x.com/guillaume_rygn/status/2101196067765092754","createdAt":"2026-09-19T06:25:55.000Z","media":"https://pbs.twimg.com/media/HSjyr6qWYAAjqKw?format=jpg\u0026name=small","metrics":{"views":80180,"likes":582}},{"id":"2101295401408352494","author":"いもいもくん","handle":"ma_anago","text":"https://\ngithub.com/githubnext/loc\naljev\n…\nJev互換のローカルAPI爆誕！\nなんつー実装スピード、、","url":"https://x.com/ma_anago/status/2101295401408352494","createdAt":"2026-09-19T13:00:38.000Z","metrics":{"views":2055,"likes":39}}]},{"name":"鳳翼炎輪祓闇大鎧城","handle":"N8jhSzyQoL35422","sample":false,"updatedAt":"2026-10-23T12:17:51+09:00","posts":[{"id":"2113329035325456415","author":"PA13L0","handle":"Fluyeporlaweb","text":"10 repos de GitHub para agentes IA que más han crecido en Octubre:\n\n1. Hindsight\nMemoria para tus agentes que aprende de lo que hacen.\n+28.5K estrellas en el último mes.\nhttps://t.co/HgBz9hVVA9\n\n2. Paperclip\nUna app para gestionar a todos tus agentes en el trabajo, como si fueran un equipo.\n+24.8K, ya pasa de 105.9K.\nhttps://t.co/PcRIhCk5UB\n\n3. ECC\nSkills, memoria y seguridad para Claude Code, Codex, OpenCode y Cursor.\n+22.5K, va por 286K.\nhttps://t.co/OVOPIXJsK5\n\n4. Impeccable\nUn lenguaje de diseño para que lo que diseña tu agente no parezca hecho por una IA.\n+15.1K.\nhttps://t.co/8f2yahE4lH\n\n5. FreeLLMAPI\n34 proveedores gratis y 635 modelos detrás de un solo endpoint. Si uno cae, salta al siguiente.\n+11.2K.\nhttps://t.co/EffguYwVEm\n\n6. OpenShell de NVIDIA\nUn entorno seguro y privado donde dejar trabajar a tus agentes.\n+8.3K.\nhttps://t.co/pR1Z8EtEIr\n\n7. Plugins oficiales de Claude Code\nEl directorio de plugins que mantiene la propia Anthropic.\n+7.2K.\nhttps://t.co/I7Jk0OZSWV\n\n8. CLI-Anything\nConvierte cualquier programa en algo que tu agente puede manejar.\n+6.4K.\nhttps://t.co/8myOjM7OO6\n\n9. text-to-cad\nTu agente diseña piezas en 3D a partir de texto.\n+6.1K.\nhttps://t.co/OV5N6YKcUE\n\n10. Knowledge Work Plugins de Anthropic\nPlugins para usar Claude en ventas, legal, finanzas y marketing.\n+5.8K.\nhttps://t.co/9VQvuzHNRc\n\nTodos open source y gratis.","url":"https://x.com/Fluyeporlaweb/status/2113329035325456415","createdAt":"2026-10-22T17:58:00Z","metrics":{"views":4078,"likes":101},"lang":"es"},{"id":"2113298057064317278","author":"codila","handle":"0xCodila","text":"My life never been so f*cking easy...\n\nClaude Opus 5.5 just reverse-engineered my home\n\n1 prompt + 5 min = total control of all tech: TV without ads, sped-up Wi-Fi router, AC that knows you and much more in one chat\n\nLet my site do it for you (free):","url":"https://x.com/0xCodila/status/2113298057064317278","createdAt":"2026-10-22T15:54:54Z","metrics":{"views":12300,"likes":167},"lang":"en"},{"id":"2113184762626253203","author":"Avi Chawla","handle":"_avichawla","text":"The next step after Karpathy's Agentic Engineering:\n\n(built by Google)\n\nAgent tasks can often outlive the process running them.\n\nFor instance, an agent may gather the right evidence and prepare the final answer, then stop because a person must approve the next action.\n\nIf that approval arrives a few hours later, the original process may no longer exist.\n\nReplaying the prompt is the wrong recovery mechanism here since it runs retrieval again, may produce a different answer, and can repeat the external action.\n\nIdeally, the system has to reopen the exact run with the same evidence and draft. It must also remember whether the final action already happened.\n\nGoogle's Agents CLI lets a coding agent build this directly. It installs seven focused skills that cover ADK development, testing, and deployment to Agent Runtime.\n\nAgents CLI Repo → https://t.co/MrlFU86tZs\n\n(don't forget to star it ⭐ )\n\nI tested the exact setup with a RAG agent in Claude Code.\n\nThe agent retrieves four policy passages, writes a cited customer reply, asks for approval, and exits. No worker keeps running while it waits.\n\nA new process later opens the saved session and continues from the approval step. The retrieval count remains one, and the answer is published once.\n\nSubmitting the approval again returns `already_published` instead of calling the publication tool twice.\n\nADK preserves the paused run. Agent Runtime stores the session after deployment, and Agent Identity gives the deployed agent its own cloud identity.\n\nThe recording shows the whole process in action, and I worked with Google to put this together.\n\nThe app retrieves the evidence, drafts the reply, and exits with a pending approval and saved session ID. Later, the same sessions are picked up again without reinvoking the tools.\n\nIf you want to dive deeper, I've covered the complete implementation in a hands-on article, including the Claude Code prompts, duplicate-approval protection, and Agent Runtime deployment.\n\nRead it below.","url":"https://x.com/_avichawla/status/2113184762626253203","createdAt":"2026-10-22T08:24:43Z","metrics":{"views":7617,"likes":82},"lang":"en"},{"id":"2113131560589308327","author":"GIGAZINE(ギガジン)","handle":"gigazine","text":"IBMが音声AI「Granite Speech 5.0」をオープンソースで公開、騒がしい場所でも高精度に文字起こし可能で複数人の会話を識別するAIも強化","url":"https://x.com/gigazine/status/2113131560589308327","createdAt":"2026-10-22T04:53:18Z","metrics":{"views":12728,"likes":129},"lang":"ja"},{"id":"2113272668472680632","author":"木马人","handle":"cnyzgkc","text":"不是，X上真能学到东西啊~\n\nLemmomo @lemomo_ai 把这么多剪辑风格，视频风格的提示词全部开源了！！！\n\n直接喂给Claude，以后想剪片不就是有手就行？\n\n开源地址：https://t.co/SEg0V4YTn9 https://t.co/xodIq9EK3Q","url":"https://x.com/cnyzgkc/status/2113272668472680632","createdAt":"2026-10-22T14:14:01Z","metrics":{"views":6452,"likes":62},"lang":"zh"},{"id":"2113408986406129844","author":"洛克船长","handle":"slashui","text":"Hugging Face 刚刚支持 OpenUSD ，NVIDIA 反手就甩出 2500+ 个 SimReady 3D 资产：叉车、机械臂、发动机、医疗设备……全部免费放在 Hub 上，还能直接用大白话搜！\n\n以前搭一个仿真场景要建模好几周，现在点几下就能拿到。\n\n具身智能的门槛也在松动。机器人时代不远了。🤖🔥 https://t.co/BU1wSMQgSz","url":"https://x.com/slashui/status/2113408986406129844","createdAt":"2026-10-22T23:15:42Z","metrics":{"views":8287,"likes":158},"lang":"zh"},{"id":"2113422651460821205","author":"Tetsuro Miyatake","handle":"tmiyatake1","text":"Canvaが自社のAI画像生成モデル「Canva Craft」をローンチした。 https://t.co/qWeTP9be6f","url":"https://x.com/tmiyatake1/status/2113422651460821205","createdAt":"2026-10-23T00:10:00Z","metrics":{"views":1491,"likes":9},"lang":"ja"},{"id":"2113434892189245531","author":"爱吃折耳根的Ace","handle":"_zheergen","text":"彭博终端一年 3 万多美元，普通人想用专业金融终端，光价格就被劝退了。\n\n现在居然有人把彭博风格的金融工作台免费开源了，连 AI 分析师、量化回测和风险管理都配齐了！\n\n这个开源项目叫 OpenTerminalUI。\n\n它基于 React + Python FastAPI，把股票行情、70+ 技术指标、40+ AI 研究工具和多 Agent 投研整合到一个终端里，支持免费本地部署。\n\n以前研究一只美股，得在行情网站、财报工具和回测平台之间来回切换。\n\n现在这些工作，可以集中到一套金融工作台里完成。\n\n核心亮点：\n\n1️⃣ AI 财报研究：读取 10-K、10-Q 财报，分析公司业绩和风险，附原文引用。\n\n2️⃣ 多 Agent 投研：从基本面、技术面和市场情绪出发，开展多空分析。\n\n3️⃣ 专业行情终端：集成 K 线、70+ 技术指标、股票筛选器和市场热力图。\n\n4️⃣ 量化策略回测：提供 16+ 策略模板，支持滚动验证和蒙特卡洛分析。\n\n5️⃣ 投资组合管理：追踪持仓收益、风险敞口，支持组合优化和模拟交易。\n\n6️⃣ AI Agent + MCP：支持 Claude Code 等工具接入，调用金融数据和研究能力。\n\n我觉得真正厉害的，不是它长得像彭博终端，而是把股票研究最核心的几个环节串起来了。\n\n比如研究 NVDA，让 AI 先读财报、分析基本面，再结合 K 线和技术指标，通过历史回测验证交易思路。\n\n行情分析 → AI 财报研究 → 量化回测 → 组合风控。\n\n原本需要多个工具配合的投研工作，现在可以集中在一个界面里。\n\n对个人量化开发者来说，能免费部署一套集金融图表、AI 投研和策略回测于一体的终端，确实很有吸引力。\n\n做股票量化、AI 投研，或者想搭建自己金融终端的，这个项目值得收藏。","url":"https://x.com/_zheergen/status/2113434892189245531","createdAt":"2026-10-23T00:58:38Z","metrics":{"views":1226,"likes":9},"lang":"zh"},{"id":"2113437247383183518","author":"paji.eth","handle":"paji_a","text":"噂のMuse、マジなのかい…","url":"https://x.com/paji_a/status/2113437247383183518","createdAt":"2026-10-23T01:08:00Z","metrics":{"views":5784,"likes":10},"lang":"ja"},{"id":"2113306887131447387","author":"Roan","handle":"RohOnChain","text":"this is f*cking DANGEROUS thing on internet today\n\none developer built a real-time global intelligence dashboard that tracks every world event 24/7 giving you the FASTEST market data to place trades\n\nand released it for 100% FREE\n\ni connected it to my Grok Bot \u0026 now my AI trading system sees wars, sanctions, oil shocks the moment they happen, long before they hit the news on TV or your timeline\n\nmy agent sees the news data, maps it with the stocks that would be affected by the news and it trades them automatically 24/7\n\nin trading, the person who sees it first makes real money, everyone else is exit liquidity\n\nhere is how to build this AI trading setup, NO CODING NEEDED:\n\n1. open worldmonitor app in your browser, switch to the finance version and spend at least 10 minutes exploring the globe and markets panel\n\n2. get your World Monitor API key, this is what lets your AI read the dashboard for you\n\n3. open Grok Bot and type “add a custom MCP server for World Monitor” with your key, it connects in seconds\n\n4. sign up for a FREE Alpaca paper trading account, it gives you fake money to trade with, zero risk\n\n5. copy your Alpaca API keys and ask Grok Bot to “add the Alpaca MCP server in paper mode” with them\n\n6. tell Grok Bot in plain English: “every few minutes, check World Monitor for big world events and tell me which markets they could move”\n\n7. give it your rules, like “if oil supply risk spikes, watch energy stocks, if a country’s instability jumps, watch gold” \n\n8. best way is to set up one separate agent to map which stocks each piece of news would affect (i did the same)\n\n9. before every trade, ask it to check what traders on X are saying and whether prediction market (Polymarket \u0026 Kalshi) odds have already moved, if the crowd hasn’t priced it in, that’s your EDGE \n\n10. let Grok Bot set the entry, exit and stop for each trade, keep every position small and place it on your Alpaca paper account\n\n11. ask it to message you each time with the exact world event that triggered the trade, then review every trade for a few weeks before you ever use real money\n\nif you want to build an AI trading system from scratch, just start with this article below:","url":"https://x.com/RohOnChain/status/2113306887131447387","createdAt":"2026-10-22T16:29:59Z","metrics":{"views":25329,"likes":311},"lang":"en"},{"id":"2113427951350071645","author":"石本憲史｜AI×司法書士","handle":"ishimoto_legal","text":"Claudeからもセキュリティアップデートがきてますね。わたしも対応したのですが、ちょっと場所がわかりづらかったので、動画置いておきます。\n\nMicrosoft StoreからDLしてる方は、やり方異なるみたいですが、わたしのセッション受けていただいた方などは、この方法でいけるはずです！","url":"https://x.com/ishimoto_legal/status/2113427951350071645","createdAt":"2026-10-23T00:31:03Z","metrics":{"views":850,"likes":16},"lang":"ja"},{"id":"2113263294811119636","author":"Daniel San","handle":"dani_avila7","text":"With all the recent vulnerabilities in PHP, Node.js, and other parts of the ecosystem\n\nthis is a good time to try Cloudflare’s Security Audit Skill\n\nIt uses multiple agents to find vulnerabilities, independently validate findings, and reduce false positives\n\nOne interesting detail… Cloudflare found that a single audit run discovered only about half the vulnerabilities found across multiple runs\n\nA good reminder that running an AI security audit once doesn’t mean your code is secure","url":"https://x.com/dani_avila7/status/2113263294811119636","createdAt":"2026-10-22T13:36:46Z","metrics":{"views":22911,"likes":403},"lang":"en"},{"id":"2113259346511667418","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝Grok Botに入れられる「できあがったbot」、公式だけで146個まで増えていた\nhttps://t.co/Dnw46FZ92y\n\n・公式の使い方ページ（Use cases）：56個\n・マーケットプレイス：90個\n\nメール整理、請求書の催促、営業リスト作り、採用の日程調整\nチャットからロボット掃除機を動かすbotまである\n\n入れ方はかんたん\n1. 使い方ページかマーケットプレイスを開く\n2. やってほしい仕事でbotを選ぶ\n3. 「Add」を押すと、自分のGrok Botに入る\n4. チャットで最初の仕事を頼む\n\n引用元のガイドが良くて、Grok Botチームの72時間分のライブ配信から、設定のコツを1本にまとめている\n\nその中でチームのBlakeさんが言っていたのが「45個もbotはいらない」\n\n私も、最初は1個から育てるのが一番だと思っている\n146個の中から、毎週手でやっている仕事に一番近い1個だけ選ぶのがオススメ","url":"https://x.com/tetumemo/status/2113259346511667418","createdAt":"2026-10-22T13:21:05Z","metrics":{"views":3429,"likes":14},"lang":"ja"},{"id":"2113397488862605824","author":"オープンソース研究所","handle":"opensourcelab9","text":"音声で話せるAIを作ったのに、相手が話し終わる前にAIがかぶせてくる人へ👀\nLiveKit Agents は、話の区切りを専用のモデルで見極めてから返事をします。\n声を文字にする部分、考えるAIモデル、声で返す部分は、好きな組み合わせで差し替えられます。電話をかける例、画面を見ながら話す例、MCPサーバーの道具を呼ぶ例までそろっていて、テストを書いて別のモデルに採点させる仕組みも入っています。\n\n会話の「間」をきちんと扱おうとしているところに、作り手のこだわりが見えます。\n音声の仕組みをゼロから組む苦労が、かなり軽くなるはずです。\n\nオープンソースはこちら👇","url":"https://x.com/opensourcelab9/status/2113397488862605824","createdAt":"2026-10-22T22:30:01Z","metrics":{"views":908,"likes":15},"lang":"ja"},{"id":"2113227623145017613","author":"テツメモ｜AI図解×検証｜Newsletter","handle":"tetumemo","text":"📝PHPの次は、Pythonだった\n今週はセキュリティのニュースが続きすぎてる\n\nすたーまんさんの整理がわかりやすい\n・PHPの件は「これから更新すれば防げる」話\n・LiteLLMの件は「入れた時点でもうやられているかもしれない」話\n\nLiteLLMは、OpenAIやClaude、GeminiなどのAIを同じ書き方で呼べるPythonの部品\nAIを使った開発ではよく入っている\n\nGMO Flatt Securityの情報をもとに、私なりにまとめると\n1. 10月21日前後に pip install や更新をした環境がないか思い出す\n2. pip show litellm で1.107.0になっていないか確認する\n3. 当てはまったら1.106.2に戻し、残ったファイルと常駐プロセスも消す\n4. Claude・Cursor・Codex・Gemini CLIなど、AIツールのログインをやり直す\n5. クラウドの鍵、GitHubのトークン、ブラウザの保存パスワードも作り直す\n6. これからは、新しい版をすぐに入れずに少し待つ\n\n心当たりがある人は、1.106.2に戻すだけでは足りない\n鍵とパスワードを全部作り直すところまでがセット","url":"https://x.com/tetumemo/status/2113227623145017613","createdAt":"2026-10-22T11:15:01Z","metrics":{"views":4660,"likes":20},"lang":"ja"},{"id":"2113213718813438203","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信⚡️》","handle":"masahirochaen","text":"【速報】Anthropicが新アプリ「Claude Duet」を発表。頼む前にClaudeの方から動いてくれる、先回り型のエージェントです。\n\n優秀な秘書がスマホに常駐する感覚に近い。経営者や個人事業主ほど効きそう。Grok bot、Dots、Muse的なサービス。\n\n・毎朝、連携アプリから要対応の案件をまとめて報告\n・頼んだタスクは席を外しても裏で進める\n・送信・支払い・署名の前は必ず確認を求める\n・Opus 5.5搭載、6,000超のコネクタに対応","url":"https://x.com/masahirochaen/status/2113213718813438203","createdAt":"2026-10-22T10:19:46Z","metrics":{"views":60462,"likes":461},"lang":"ja"},{"id":"2113284241241031107","author":"まかねこ| AIに働かせる技術","handle":"makaneko_AI","text":"1Passwordがまた便利なものを出してきた。AIパーソナルエージェント向け新機能を発表\n\nこの機能は、AIがログイン画面で認証情報を求め、ユーザーが承認すると1Password が入力する仕組み。AIには中身を見せません。実は以前から同類の機能はありましたが、これはGrok Botなどパーソナルエージェントを想定したもの。\n\n現在はMeta社のMuseとGrok Botに対応。対応プロダクトは順次追加を予定しているそう。もはや1PasswordはAI活用者が必須で使うべきものになりつつある。","url":"https://x.com/makaneko_AI/status/2113284241241031107","createdAt":"2026-10-22T15:00:00Z","metrics":{"views":25286,"likes":180},"lang":"ja"},{"id":"2113160070188208525","author":"Arindam Majumder 𝕏","handle":"Arindam_1729","text":"Your coding agents don't share a brain. OpenLore fixes that with one folder of Markdown!\n\n(open source, Apache 2.0, 1.5K+ stars on GitHub)\n\nRight now Claude Code reads CLAUDE. md. Codex reads AGENTS. md. Cursor reads its own rules. None of them remember yesterday.\n\nOpenLore by @Oiya_ai flips it: every agent on your team reads the same files.\n\nThe setup is one hub:\n→ openlore ./docs serves your folder over MCP and SSH\n→ Claude Code, Codex, Cursor and OpenCode all plug into it\n→ each agent only sees the docs it's been granted\n→ they read with cat, grep and find, tools they already know\n\nUpdate a file once and every agent sees the new version on its next read.\n\nThere's no vector database, no ingestion pipeline and no SDK.\n\nI checked the safety part too. The shell is an in-memory Go interpreter, not a real OS shell, and access is read-only by default.\n\nHonest tradeoff: for one agent in one repo, plain Markdown in your repo is enough. OpenLore pays off once several agents or teammates share the same knowledge.","url":"https://x.com/Arindam_1729/status/2113160070188208525","createdAt":"2026-10-22T06:46:36Z","metrics":{"views":6250,"likes":51},"lang":"en"},{"id":"2113466692861038957","author":"ガガロット","handle":"gagarot200","text":"AIインフルエンサーYouTuberのみーちゃん\n↓\nMuseで生成した動画がSeedanceより圧倒的安価で\n高品質な動画が生成出来る　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\nSeedanceあたりを使うと品質は最高だが\n生成費用がマジで高い。\n\nだからって投稿を止めるわけにもいかない\n\nそんな方が非常に多いです。\n\nそこで圧倒的安価に動画生成が可能な\nMuseが出て来たってわけ。\n\n投稿して伸びないようなものに対して\nお金なんて払いたくないよね。\n\nそしたら安価なモデルで伸びるまで\nテストし続けて伸びた段階で\nモデルを気になるなら変更すべき\n\nAiインフルエンサーの教科書を\nリリース中です。\n\nリプから残り数部で値上げなので　\n気になる方はご確認を","url":"https://x.com/gagarot200/status/2113466692861038957","createdAt":"2026-10-23T03:05:00Z","metrics":{"views":155,"likes":2},"lang":"ja"},{"id":"2113390017708187765","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"Codexのプラグインは、ガチで入れなきゃ損！便利すぎて泣けます！実際にどこからプラグインを入れればいいか動画にしてみた！\n\n※この動画もChatGPTを動かしているところからすべてCodexに任せて、画面収録ごと自動化してます。 https://t.co/bWhbWkjAck","url":"https://x.com/ai_ai_ailover/status/2113390017708187765","createdAt":"2026-10-22T22:00:19Z","metrics":{"views":653,"likes":9},"lang":"ja"},{"id":"2113216293545373710","author":"maria","handle":"mariagpts","text":"TRADINGAGENTS ACABA DE HACER ALGO QUE CASI NADIE ESPERABA: LLEGAR AL #1 DE GITHUB.\n\n→ Un equipo de agentes de IA analiza y opera en el mercado juntos. \n\n→ La v0.7.0 ya corre con tu propio plan de ChatGPT Plus o Pro. \n\n→ Los backtests solo ven datos publicados hasta cada fecha de análisis. \n\n→ Los reportes se guardan en una sola página HTML, con un modelo distinto para cada nivel de agente. \n\n→ Open source, con updates cada pocas semanas.\n\nUN ESCRITORIO DE TRADING CON IA COMPLETO QUE PUEDES LLEVAR TÚ MISMO. ¿CONFIARÍAS TU CARTERA A UN EQUIPO DE AGENTES?","url":"https://x.com/mariagpts/status/2113216293545373710","createdAt":"2026-10-22T10:30:00Z","metrics":{"views":2538,"likes":279},"lang":"es"},{"id":"2113291928292790725","author":"Jerry Liu","handle":"jerryjliu0","text":"Today we’re releasing OCRia-1, a frontier VLM for document parsing that sets a new SOTA in accuracy, cost, and latency. \n\nIt not only sets a new high score on ParseBench (87.4), but also leads in three 3rd-party benchmarks: olmOCR-bench* (83.5 overall, 92.9 on tables!), PulseBench-Tab (84.1), and fr-bench-pdf2md (72.1).\n\nOCRia-1 is really, really good at parsing complex tables: nested headers, merged cells, irregular grids, scanned tables, and more. It is also fantastic at parsing complex unlabeled charts (line, bar, pie, technical diagrams), and preserving complex formatting. Most real-world enterprise documents contain at least one of the these, whether it’s a big tax withholding table or a public economic report.\n\nIt is a 4B model and outperforms all other models within a similar parameter class: LightOnOCR-3, Chandra-OCR 2, Mistral OCR 4.1, and more. It is also extremely fast.\n\nAll credit goes to our research team, who spent countless hours on curating a diverse dataset, tuning our training pipeline, and squeezing every last drop out of model optimization so that it can process billions of pages at scale. \n\nOCRia-1 as a base is powering all of our modes within LlamaParse (cost-effective, agentic, agentic plus), so you can access its capabilities today! \n\nIf you’re processing millions/billions of documents at scale, we’re offering enterprises that book a demo up to $3k in credits for a guided evaluation.**\n\n*olmOCR-bench scores are adjusted based on unifying rendering at 1,288px for all models \n**enterprise POC credits apply to eligible organizations that book a demo","url":"https://x.com/jerryjliu0/status/2113291928292790725","createdAt":"2026-10-22T15:30:33Z","metrics":{"views":53320,"likes":725},"lang":"en"},{"id":"2113446485262283205","author":"深津 貴之 / THE GUILD, note","handle":"fladdict","text":"パーソナルAIエージェント「Muse」をチェックしてみよう。参加後48時間以内に[設定]で私のコードを利用すると、私たち両方が10億のMuseトークンを獲得できます。\n\nコード: 6GE3N6","url":"https://x.com/fladdict/status/2113446485262283205","createdAt":"2026-10-23T01:44:42Z","metrics":{"views":9183,"likes":55},"lang":"ja"},{"id":"2113230686245044680","author":"SCOTTY BEAM","handle":"ScottyBeamIO","text":"WTF, GROK BOT JUST BECAME THE BEST MARKETING TOOL RIGHT NOW.\n\nTHE OFFICIAL SPACEXAI SITE NOW HAS 25 READY-MADE GROK BOT SETUPS FOR MARKETING, AND YOU CAN START USING THEM TODAY.\n\nContent, SEO, ads, research, events. Each one is a ready-made bot with one clear job, made by the Grok Bot team and builders from the community.\n\nHere’s what’s inside:\n\n→ CONTENT: Clip Bot cuts long recordings into short captioned clips. Copy Humanizer rewrites AI-sounding drafts so they read like a person wrote them. Video Editor picks your best takes and adds captions, B-roll and music.\n\n→ SEO \u0026 WEB: SEO \u0026 AEO Desk turns keywords into writer-ready briefs. AI Search Visibility checks whether AI assistants actually recommend you. Site Audit scores your site and tells you what to fix first.\n\n→ ADS \u0026 DATA: Ad Spend Watch flags what’s breaking before it burns your budget. Paid Media Report Desk turns your ad exports into one weekly report. Performance Marketer turns ad copy into ready-to-test Search campaigns.\n\n→ RESEARCH: Market Researcher tracks every competitor move. last30days shows what people actually said about any topic this month. X Brief turns the accounts you follow into one short daily brief.\n\n→ EVENTS \u0026 OPS: Event Producer builds your run of show and guest list. Project Manager coordinates all your other marketing bots.\n\nPut a few of these together and you get something close to a full marketing team.\n\nOne bot researches. One writes. One runs the ads. One reports the numbers. And you only step in to approve.\n\nThat’s the real shift. You stop doing the work and start directing it.\n\nBookmark this so you have all 25 in one place.\n\nAnd if you want to know what else is new, I broke down the biggest recent Grok Bot updates in my article below ↓","url":"https://x.com/ScottyBeamIO/status/2113230686245044680","createdAt":"2026-10-22T11:27:12Z","metrics":{"views":18105,"likes":219},"lang":"en"},{"id":"2113169365483032658","author":"StudioYebisu","handle":"studio_yebisu","text":"インドの認証局「eMudhra」のやらかしで、今ネットが軽く魔境になってますけども。\n現状を調べたので、守りに入らずに何が安全で何が危ないか書きます。\n\n■安全\n・Chrome・Firefox・Edge（最新版）\n・Androidスマホ本体（再起動すれば対策が反映）\n\n▲注意\n・Safari（iPhone・Mac）\n・iPhoneのアプリ内ブラウザ（X・LINEなど）\n気になる場合はリプライにある、告知/チェッカーのURLを内部ブラウザで開いてオールグリーンなら安全\n\n→ Appleのブロックは入っているが、一部の証明書がまだ通ってしまう不具合が報告されている（10/22時点、未解決）\n\n・Androidのアプリ内ブラウザ\n・PCのアプリ（Discord・Slack・VS CodeなどElectron製）\n　→ アプリ本体の更新待ち\nこれも\n\n×危険\n・通信を行うアプリで、最新に更新されていないもの全て(例えば〇〇PAY等）\n・ルーター・カメラ・テレビ・家電などのIoT機器\n・開発ツール（curl・Python・Node.js・Go・Javaなど）\n\n◆やること\n・OS・ブラウザ・アプリを全部最新にして、再起動\n・ルーターのファームウェア更新を確認\n・更新がそろうまで、フリーWi-FiとVPNは避ける\n・リプのURLで「Run check」→「Insecure」が1つも出なければOK\n\nーーー\n▼ややこしい話（気になる人向け）\n\n【なぜWi-FiとVPNなのか】\n攻撃するには通信の途中に割り込む必要があります。怪しいWi-Fi・VPN・乗っ取られたルーターが入口になりますので今FreeWi-Fiはかなりヤバい。\n\n【Safariの不具合】\nAppleの失効リストには載っています。ただ、最後に認証局へ「本当に失効しているか」を問い合わせる仕組みになっていて、その問い合わせ先が落ちているため通ってしまうようです。\n\nもう一段の守り（CT＝証明書の発行記録のチェック）で止まる見込みはありますが、確証はありません。iOSを最新にして、Appleの修正を待ちましょう。\n\n【Androidのアプリ内ブラウザ】\nAndroid標準のアプリ内ブラウザ（WebView）は、証明書チェックが甘いという研究があります。\nWeChat・QQなど独自エンジンを積んだアプリは、今回の偽証明書を実際に通しています。\n\n【IoT機器が一番やばい理由】\n証明書の一覧が機器の中に固定されています。メーカーが更新を出さない限り、2039年まで偽証明書を信じ続けます。\n\n【開発ツール】\n失効情報も発行記録（CT）もチェックしないので、更新するまで偽証明書を素通しします。対応を待ち、対応したらすぐ更新しましょう。","url":"https://x.com/studio_yebisu/status/2113169365483032658","createdAt":"2026-10-22T07:23:32Z","metrics":{"views":1158055,"likes":8661},"lang":"ja"},{"id":"2113422651183988885","author":"Tetsuro Miyatake","handle":"tmiyatake1","text":"MetaのLLMを起用した広告システムはコンバージョン向上に貢献しているとCFOのSusan Liが発言。","url":"https://x.com/tmiyatake1/status/2113422651183988885","createdAt":"2026-10-23T00:10:00Z","metrics":{"views":771,"likes":4},"lang":"ja"},{"id":"2113133069280407680","author":"GIGAZINE(ギガジン)","handle":"gigazine","text":"NVIDIAが「社内に蓄積した大量の情報をAIで扱えるようにデータ整形して検索可能にするモデル群」を無償公開","url":"https://x.com/gigazine/status/2113133069280407680","createdAt":"2026-10-22T04:59:18Z","metrics":{"views":44385,"likes":732},"lang":"ja"},{"id":"2113452083450105948","author":"Sadao Tokuyama","handle":"tokufxug","text":"【360度映像から施設をデジタルツイン化🏢】\n\n🔹ドバイの大学研究室を再現\n🔹LiDARスキャンなしでInsta360映像を基にOmniverse・Isaac Simで構築\n🔹設備配置を仮想空間で事前検証\n\n開発：Siddharth Dialani氏\n情報元はリプ欄。","url":"https://x.com/tokufxug/status/2113452083450105948","createdAt":"2026-10-23T02:06:57Z","metrics":{"views":618,"likes":15},"lang":"ja"},{"id":"2113264325737533503","author":"angel","handle":"angeldot_","text":"ESTO DEBERÍA SER ILEGAL\n\nREA + Opus 5.5 puede hacer ingeniería inversa de cualquier cosa, incluidas apps de pago y de código cerrado\n\nEs un MCP open source que destripa cualquier app hasta el binario y te permite replicarla\n\nLe pasas este prompt a Opus 5.5, te explica cómo funciona por dentro y te construye tu propia versión desde cero\n\nGuárdate el prompt 👇","url":"https://x.com/angeldot_/status/2113264325737533503","createdAt":"2026-10-22T13:40:52Z","metrics":{"views":41250,"likes":524},"lang":"es"},{"id":"2113208152917258677","author":"govin.eth | G哥","handle":"goan999999","text":"哈草，太逆天了！Codex 效率直接提高 20 倍，这个开源神器必须装！\n\nCodex + Context7 = 给 AI 开挂\n\n1、不用再翻文档了：写 React、Next.js、Supabase，直接让 Codex 获取对应的最新文档和代码示例，省掉大量查资料的时间\n\n2、减少 AI 一本正经地瞎写：API 名称、参数、配置方式不对，代码写得再快也白搭。Context7 把相关文档塞进上下文，让 Codex 有据可查。\n\n3、少返工才是真提效：遇到陌生框架、SDK 集成、版本升级，先查文档再写代码，减少过时用法和错误示例带来的折腾。\n\n4、安装直接交给 Codex：复制下面这段提示词，让它自动阅读项目文档、完成配置并验证是否可用\n\n安装直接用这段提示词：\n“\n请先阅读 upstash/context7 的官方文档，了解 Context7 的安装方式、配置要求和使用方法。然后为当前 Codex 环境安装并配置 Context7，优先采用官方推荐的方案；检查运行环境和依赖，完成必要的 MCP 或 CLI + Skills 配置。配置完成后，验证工具是否能够正常调用、能否检索指定技术栈的最新文档，并测试一次真实的代码查询任务。最后告诉我具体修改了哪些配置、如何使用，以及后续如何让 Codex 在编写代码、调用 API、安装 SDK、排查报错时，优先检索对应版本的官方文档。遇到需要授权、API Key 或人工操作的步骤时，明确告诉我，不要假装安装成功\n”\n\n以后写代码，别光让 AI 埋头干活，先让它找到正确的说明书！","url":"https://x.com/goan999999/status/2113208152917258677","createdAt":"2026-10-22T09:57:39Z","metrics":{"views":8776,"likes":65},"lang":"zh"},{"id":"2113378611474436237","author":"0xMarioNawfal - The Roundtable Show","handle":"RoundtableSpace","text":"Your AI agents could finally learn from each other’s mistakes\n\nBeacon captures sessions across Claude Code, Codex, Cursor and 20+ other tools, while Jev extracts lessons worth remembering\n\nOne agent makes a mistake, another learns from it","url":"https://x.com/RoundtableSpace/status/2113378611474436237","createdAt":"2026-10-22T21:15:00Z","metrics":{"views":50418,"likes":36},"lang":"en"},{"id":"2112973191157252103","author":"Juraj Bednar🏴💛🌘","handle":"jurbed","text":"I highly recommend cloudflare's security audit skill: https://t.co/Mu6Dm0fzk8 \n\nRun it on all your software. Run it with the free models. Use it even if you used a model to audit something - it will find much more things. Works in all agent harnesses and is model independent.","url":"https://x.com/jurbed/status/2112973191157252103","createdAt":"2026-10-21T18:24:00Z","metrics":{"views":508518,"likes":7590},"lang":"en"},{"id":"2113464426690982104","author":"Haruki Sonehara / 🇺🇸シリコンバレー企業のプロダクト戦略","handle":"Haruki_Sonehara","text":"AI時代にますますプロダクト判断力が重要になると思ってるが、その理由が完璧に言語化されていた。\n\n誰でもコードが書けるなら差別化は消える、と言われがちだが、結論は真逆だと思う。\n\nコードが安くなるほど、プロダクト判断力（何を創り、何を創らないか）の価値が跳ね上がる。\n\n理由はシンプル👇\n\n・良いコード ＝ 良いプロダクトではない。間違った方向に爆速コミットしても負債が増えるだけ。\n\n・AIは「No」と言えない。要望を全部盛りにして自滅する。プロダクトの価値は何を捨てたか、で決まる。\n\n・AIは過去の平均は作れても、まだ見ぬフロンティアは作れない。\n\nコードを書く価値は下がっているのはおそらく皆さんご承知の通り。\n\nだからこそ、どのトレードオフを受け入れ、何を成果と定義するか、という意思決定の質が、過去最高にモノを言う時代になっている。\n\nプロダクトマネージャーを名乗らなくてもいい。ただ、\n\n起業家、\n事業開発、\nエンジニア、\nマーケティングでも、\n職種に関わらずAIで何か作る時に、\n\nプロダクト判断力があるかないかの差は、これから大きくなる一方だと思う。","url":"https://x.com/Haruki_Sonehara/status/2113464426690982104","createdAt":"2026-10-23T02:56:00Z","metrics":{"views":136,"likes":2},"lang":"ja"},{"id":"2113022835937685592","author":"王多鱼AI","handle":"wdy188","text":"做 AI 算命、做命理 App 的朋友，这份 57GB 的开源数据可以直接拿去用。\n\n据我们所知，这是目前全网最大的玄学类开源数据集：1950–2026 年每一天 × 12 个时辰 × 男女，67.5 万张紫微命盘全排了一遍，13 个维度一共 877 万段解读。\n\n每一句断语都对照倪海厦《天纪》原话和《紫微斗数全书》原文校正过，引文逐字可查。全部按规则算出来，不经 AI 生成，同一张盘每次结果都一样。\n\n压缩后只有 161MB，按出生年份一年一个文件。CC BY 4.0，可以商用，细则见仓库 README。\n\n搭排盘网站直接查表，训练命理大模型直接当语料。仓库已经 5,400 多颗星，欢迎拿去用。\n\n🔗","url":"https://x.com/wdy188/status/2113022835937685592","createdAt":"2026-10-21T21:41:16Z","metrics":{"views":205918,"likes":2354},"lang":"zh"},{"id":"2113247471040352308","author":"도파민(Dopamine) l Nanotrading.xyz","handle":"dopamine_crypto","text":"창업 전에 가짜 손님 100명한테 먼저 팔아보는 스킬 이거 미쳤음\n\n타깃 고객 흉내 내는 구매자 100명 돌려보고, 호르모지·피터 틸·잡스 방식으로 이사회가 아이디어 채점까지 함. CFO 스킬은 진짜 마진 계산해주고. 11개 다 무료에 가입도 없음 ㄷㄷ\n\n창업 컨설팅 밥그릇 좀 위험할듯.\n\n저도 개인적으로 nanotradingclub 이라는 사이트 만들어서 운영 중인데 지금 해보고 있슴다 ㄷㄷㄷㄷ\n\n링크에 달아놨으니까 뭐 만드시는 분들은 햅시죠 !","url":"https://x.com/dopamine_crypto/status/2113247471040352308","createdAt":"2026-10-22T12:33:53Z","metrics":{"views":10847,"likes":273},"lang":"ko"}]},{"name":"oshiyasu","handle":"oshiyasu229196","sample":false,"updatedAt":"2026-09-20T07:31:00+09:00","posts":[{"id":"2101171908482064758","author":"Claude code研究ラボ","handle":"claudecode84","text":"Claude CodeのComputer Useより\n速くPC操作できる方法がめっちゃ便利\n\nClaude Code + Jevで、\n強化版Computer Useが登場してる","url":"https://x.com/claudecode84/status/2101171908482064758","createdAt":"2026-09-19T04:49:55.000Z","metrics":{"views":7384,"likes":43}},{"id":"2101129152380153930","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"これは普通にデカい\nCodexがめちゃくちゃ軽くなる\nいらないログをJEVが自動で削る\n必要な情報だけ残してくれる\n無駄なTokenが減って動作も速くなる\nAIコーディングの「重い」が変わる\n\n導入方法は","url":"https://x.com/ai_300/status/2101129152380153930","createdAt":"2026-09-19T02:00:01.000Z","metrics":{"views":47000,"likes":228}},{"id":"2101083334277484833","author":"伊藤貴將（いとぱん）｜AIエージェント×創作開発","handle":"takamasa045","text":"","url":"https://x.com/takamasa045/status/2101083334277484833","createdAt":"2026-09-18T22:57:57.000Z","metrics":{"views":35000,"likes":265}},{"id":"2101124023375774073","author":"ギガビット@ゲームつくるひと","handle":"gigabit_million","text":"話題のJevってどういうAIなの？の雰囲気がわかるサイト作りました！入力した言葉のイメージを判定して色で回答します。\n高速で固定の型で出力するJevの特性。こんな簡易サイトでも今までのAIだとすぐ破産できたけどJevなら無料で公開したって大丈夫！という格安感が表現できていると思います。","url":"https://x.com/gigabit_million/status/2101124023375774073","createdAt":"2026-09-19T01:39:38.000Z","metrics":{"views":17000,"likes":125}},{"id":"2100850013454926083","author":"mizchi","handle":"mizchi","text":"昨日よりも Jev が何なのか解像度が上がったので、そのレポートを書きました。\n\nたぶんプログラマなら用途がピンと来ると思うので、使い倒す価値があります。","url":"https://x.com/mizchi/status/2100850013454926083","createdAt":"2026-09-18T07:30:49.000Z","metrics":{"views":230000,"likes":2022}},{"id":"2101206777924858319","author":"Charly Wargnier","handle":"DataChaz","text":"Jevは本当の意味で、AIにとっての「インターネットの瞬間」になる可能性がある。\n\nTypeSafeの報告によると、Claude Fable 5.1とGPT-6 Astraを使ったテストで、最大193倍高速で444倍安価なパフォーマンスが達成された。","url":"https://x.com/DataChaz/status/2101206777924858319","createdAt":"2026-09-19T07:08:29.000Z","metrics":{"views":99000,"likes":733}},{"id":"2101301230048092253","author":"StudioYebisu","handle":"studio_yebisu","text":"デカイ計算資源とAI知識がある人は\n「専用Jevの蒸留モデルを企業向けにカスタマイズ販売する」\nというビッグビジネスの可能性に気づいたほうがいい。\nJevの弱点はAPIであることと、判断の正確性に疑義がある。という点だが、\n\n企業側が求める正解の教師データを適切に揃え、","url":"https://x.com/studio_yebisu/status/2101301230048092253","createdAt":"2026-09-19T13:23:48.000Z","metrics":{"views":39000,"likes":408}},{"id":"2101307857191006463","author":"鈴木裕斗 | Offers | AI x HR","handle":"yutosuzuki","text":"試しに browser-use/jev-ultrafastを使ってみる\n東京駅から車で3時間以内で、明日から1泊2日で5万円以下で泊まれる宿を楽天トラベルで探してみたところ、時間は13分の1、コストは190分の1に\n\n\nhttps://\nx.com/gregpr07/statu\ns/2100411066966749359\n…","url":"https://x.com/yutosuzuki/status/2101307857191006463","createdAt":"2026-09-19T13:50:08.000Z","metrics":{"views":4580,"likes":31}},{"id":"2101037514945597645","author":"Akshay","handle":"akshay_pachaar","text":"","url":"https://x.com/akshay_pachaar/status/2101037514945597645","createdAt":"2026-09-18T19:55:53.000Z","metrics":{"views":390000,"likes":2944}},{"id":"2101135254849515776","author":"熊井悠(くまいゆう) | ランスティア","handle":"qumaiu","text":"JevでXのポストのジャンル分類・分析をさせるChrome拡張を作ってみた。こうしてみるとXを読むだけでも脳の処理が多いことに気付かされる。Chrome拡張とJevを組み合わせて、小さな意思決定や判断をどんどん外していきたいものだ。","url":"https://x.com/qumaiu/status/2101135254849515776","createdAt":"2026-09-19T02:24:16.000Z","metrics":{"views":9960,"likes":82}},{"id":"2100951347080421409","author":"Elvis","handle":"elvissun","text":"Jevはぶっ飛んでる。\n\n24.9秒で今朝の384件のニュースを読み、15のブランドに今日飛びつくべきストーリーを提案した。料金はわずか0.19ドル。\n\n同じフィードで同じ時間に動作したClaude Opus 5は、384件中4件しか処理できず、料金は0.77ドルかかった。","url":"https://x.com/elvissun/status/2100951347080421409","createdAt":"2026-09-18T14:13:29.000Z","metrics":{"views":540000,"likes":3655}},{"id":"2101278899158327721","author":"チャエン | デジライズ CEO《重要AIニュースを毎日最速で発信》","handle":"masahirochaen","text":"【朗報】Vercel AI Gatewayの評価特化モデル「Jev」(TypeSafe AI製)が9/25まで無料開放\n\nGateway上で最速級に採用が伸びている評価専用モデル\n\n・通常は入力100万トークンあたり0.042ドル\n・コンテキスト長は32,000トークン\n・生成はせず判定結果のみを返す設計","url":"https://x.com/masahirochaen/status/2101278899158327721","createdAt":"2026-09-19T11:55:04.000Z","metrics":{"views":16000,"likes":109}},{"id":"2101254577794490830","author":"金のニワトリ","handle":"gosrum","text":"Jev を使ったデモアプリ① \n〜YouTuber 向け配信ディレクターアプリ〜\n\nチャットや配信者の発言から、自動的なシーン切替やモード切替提案をリアルタイムで行うことができる","url":"https://x.com/gosrum/status/2101254577794490830","createdAt":"2026-09-19T10:18:25.000Z","metrics":{"views":12000,"likes":66}},{"id":"2101343432929059319","author":"Ricker","handle":"0xRicker","text":"Jev Engineering は、ほとんどのエージェントスタックがまだ欠けているレイヤーです。\n\nstate → decision → action → verification → next state\n\n私たちのテストでは、最大193倍高速で444倍安価です。\n\n誰もがモデルを最適化しています。\n\nJev Engineering","url":"https://x.com/0xRicker/status/2101343432929059319","createdAt":"2026-09-19T16:11:30.000Z","metrics":{"views":22000,"likes":232}},{"id":"2101280897030893804","author":"黄小木","handle":"ai_xiaomu","text":"Jev 商業化の実例：\n\n300 万個の再生イベントを分析し、「苛立ったクリック」と JS エラーを捕捉し、213 個の修正 PR を直接送信。\n\n開発パイプラインに組み込み、R\u0026D チームの痛点を直撃。\n\nこれらすべてを達成するのに、わずか 40 秒と 2 ドルで済みました。","url":"https://x.com/ai_xiaomu/status/2101280897030893804","createdAt":"2026-09-19T12:03:00.000Z","metrics":{"views":51000,"likes":177}},{"id":"2100878828285681848","author":"はる｜最高月収2,200万円","handle":"haru_affiliate1","text":"","url":"https://x.com/haru_affiliate1/status/2100878828285681848","createdAt":"2026-09-18T09:25:19.000Z","metrics":{"views":480000,"likes":542}},{"id":"2101165576303607837","author":"にも｜AIによって爆誕","handle":"ai_ai_ailover","text":"URLを貼るだけでサイトが丸ごとFigmaで編集できる、エグい方法見つけた！\nhttps://\nhtml.to.designっていうFigmaプラグイン。263万人が使ってるのに、日本ではほぼ知られてない。えぐいえぐい","url":"https://x.com/ai_ai_ailover/status/2101165576303607837","createdAt":"2026-09-19T04:24:45.000Z","metrics":{"views":4089,"likes":34}},{"id":"2101070906852298910","author":"Kevin Wang","handle":"mxfp4","text":"みんながJevを使ってデモを作ってる\n\nでも誰も本物のプロダクトを作ってない\n\n\nhttps://\nlurk.so を紹介します\n\nAIに引用されるためにRedditのスレッドを探して監視\n\u003e 無料\n\u003e 4000のRedditスレッドをスキャン\n\u003e メール、Discord、Slack\n\nJevと\n@getanyapi\nのおかげで無料で提供できる","url":"https://x.com/mxfp4/status/2101070906852298910","createdAt":"2026-09-18T22:08:34.000Z","metrics":{"views":65000,"likes":654}},{"id":"2100987499262984216","author":"りも","handle":"vibe_walking","text":"ChatGPTにRemote Desktop MCP繋いだらクソ簡単に家のPCいじれるからかなり良いかも\n\n\nhttps://\nchatgpt.com/plugins/plugin\n_asdk_app_6a057d268ebc81919918d37eec718425\n…","url":"https://x.com/vibe_walking/status/2100987499262984216","createdAt":"2026-09-18T16:37:08.000Z","metrics":{"views":62000,"likes":722}},{"id":"2101054124334911816","author":"えーたん/AI×時短で仕事効率化","handle":"ai_jitan","text":"","url":"https://x.com/ai_jitan/status/2101054124334911816","createdAt":"2026-09-18T21:01:53.000Z","metrics":{"views":87000,"likes":130}},{"id":"2101015648306642949","author":"Rahul","handle":"sairahul1","text":"今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n今年中にモデルのファインチューニングを学びましょう\n\n小さく始めましょう","url":"https://x.com/sairahul1/status/2101015648306642949","createdAt":"2026-09-18T18:29:00.000Z","metrics":{"views":740000,"likes":5565}},{"id":"2101165373148291128","author":"AI様の下僕","handle":"aigeboku","text":"動画生成を使わずに映像作品を作る\n\nこちら、実は動画生成使ってません。\n使ったのはCodexとDavinci resolveだけなのよ。\nCodex内のGPT-Imagesしか使ってないので制作費はCodex代ぐらい。\n\nこういうスタイルの映像も面白いと思うので気になる方はぜひ\nやり方はまたYoutubeで公開します","url":"https://x.com/aigeboku/status/2101165373148291128","createdAt":"2026-09-19T04:23:57.000Z","metrics":{"views":9303,"likes":166}},{"id":"2101098949205713304","author":"Matt Canham","handle":"matthewcanham","text":"Jevは、テキスト生成ではなく意思決定に最適化された新しいタイプのモデルです\n\nこれがこれまでに見つけた中で、仕組みを分解して説明した最高の記事です - imoでは週末の必須読書です","url":"https://x.com/matthewcanham/status/2101098949205713304","createdAt":"2026-09-19T00:00:00.000Z","metrics":{"views":320000,"likes":1192}},{"id":"2101188796381594033","author":"hiro","handle":"mercury_dev0517","text":"丁寧に書かれていてわかりやすい！","url":"https://x.com/mercury_dev0517/status/2101188796381594033","createdAt":"2026-09-19T05:57:01.000Z","metrics":{"views":2377,"likes":37}}]},{"name":"Cloud","handle":"cloud8wq","sample":false,"updatedAt":"2026-10-23T12:17:51+09:00","posts":[{"id":"2113374961071235550","author":"a16z","handle":"a16z","text":"Marc Andreessen on the case for open source AI:\n\n\"How would you feel if the only way your kid could learn about AI is to go to work for one of two companies? Like that, as a parent, I think would probably drive you pretty crazy.\"\n\n\"Whereas in a world of open source, every kid can learn how this stuff works.\"\n\n\"Without open source, AI inevitably centralizes down to one or two companies, or maybe just flat out the government.\"\n\n\"Close your eyes and picture the concept of government sushi. And then keep your eyes closed and picture government AI. How do you feel about that? Open source is the guarantor that that's not the future.\"\n\n@pmarca","url":"https://x.com/a16z/status/2113374961071235550","createdAt":"2026-10-22T21:00:29Z","metrics":{"views":15195,"likes":120},"lang":"en"},{"id":"2113163447299092663","author":"鈴木@アナログ営業会社を100日後にAIで売上を300％にする人","handle":"ai_300","text":"Claude Opus 5.5に「動くモーション辞典」を渡せるようになった。\n\n120種類の動くサンプルが収録されていて、それぞれに名前と、そのまま使えるプロンプトが付いている。\n\nhttps://t.co/lfoOWBte75\n\n好きな動きをクリックするだけで、Claude Codeが動画やWebサイトに組み込んでくれる。\n\n収録されているのは5つのカテゴリー。\n\n① モーショングラフィックス\n② カメラワーク・トランジション\n③ UIコンポーネント\n④ LP・Webサイトのエフェクト\n⑤ 写真の質感・ライティング\n\n使い方はたったの4ステップ。\n\nSTEP 1\n最後にあるインストール用の文章をClaude Codeに貼り付けて、スキルをインストール。\n\nSTEP 2\n「Motion Prompt Libraryを開いて」と指示する。\n\nSTEP 3\nギャラリーから気に入ったサンプルを選んで「Send to AI」をクリック。\n\nSTEP 4\nClaude Codeに戻って「この動画の冒頭をこんな感じに編集して」と伝えるだけ。\n\n選択したサンプルのモーション仕様と参考コードがAIに渡される仕組み。\n\nRemotion、CSS、Canvasにも対応している。\n\nスキルをインストールしなくても「Copy picks」を押して、選択した内容をそのままAIに貼り付ければ使える。\n\nインストールも簡単👇\n\n以下をClaude Codeに貼り付けるだけで、自動でセットアップしてくれる。\n\n「https://t.co/lfoOWBte75 を読み込んで、この環境にmotion-promptスキルをインストールしてください。インストールが完了したら、使い方を3行で教えてください。」","url":"https://x.com/ai_300/status/2113163447299092663","createdAt":"2026-10-22T07:00:01Z","metrics":{"views":4018,"likes":38},"lang":"ja"},{"id":"2113430369215377635","author":"Khosla Ventures","handle":"khoslaventures","text":"Agents are becoming customers’ front door to the web. Websites need to keep up. @Coframe is building for that shift.","url":"https://x.com/khoslaventures/status/2113430369215377635","createdAt":"2026-10-23T00:40:40Z","metrics":{"views":567,"likes":3},"lang":"en"},{"id":"2113436081194709138","author":"松丸 彗吾(keigo matsumaru)","handle":"k_matsumaru","text":"全人類1Password使おうな","url":"https://x.com/k_matsumaru/status/2113436081194709138","createdAt":"2026-10-23T01:03:22Z","metrics":{"views":18520,"likes":247},"lang":"ja"},{"id":"2113300556177416245","author":"USV","handle":"usv","text":"We are in the early innings of the destruction of the internet as we know it. \n\nAt our CEO summit this year we introduced @Cloudflare CEO Matthew Prince @eastdakota and @NousResearch (creators of Hermes) CEO Dillon Rolnick @dillonrolnick to discuss what's at stake for the future of the web.","url":"https://x.com/usv/status/2113300556177416245","createdAt":"2026-10-22T16:04:50Z","metrics":{"views":1777,"likes":14},"lang":"en"},{"id":"2113261664694894731","author":"distort","handle":"distortgeekin","text":"Holy sh*t, Grok Bot just replaced Notion, Excel and a $140K analyst\n\nSpaceXAI shipped Pages last night\nReports and dashboards that update themselves\n\n1.3M people saw the launch\nMost will build one page and forget it\n\nHere are the 6 I'd set up first:\n\n→ Revenue: \"Every Monday at 8:00, booked vs plan and what slipped\"\n→ Pipeline: \"Live Q4 forecast, flag every deal stuck for 14 days\"\n→ Morning brief: \"My day by 7:00 and the one thing most likely to slip\"\n→ Board memo: \"Draft the monthly update from these numbers, never send it\"\n→ Policy page: \"Rewrite this page every time the rule changes in Slack\"\n→ Competitors: \"Every price change and launch from these 5 companies, daily\"\n\nAsk once, it stays true every morning\nStart with the Monday one\n\nThen read how a Grok Bot team keeps working while you sleep in the article below","url":"https://x.com/distortgeekin/status/2113261664694894731","createdAt":"2026-10-22T13:30:18Z","metrics":{"views":67627,"likes":598},"lang":"en"},{"id":"2113329537509449744","author":"Elon Musk","handle":"elonmusk","text":"Try Grok @Bot","url":"https://x.com/elonmusk/status/2113329537509449744","createdAt":"2026-10-22T18:00:00Z","metrics":{"views":4514439,"likes":5020},"lang":"en"},{"id":"2113208819232940332","author":"GitHub AI Projects Community 🇯🇵","handle":"trendtech33566","text":"自分のPCでAIを動かすだけでなく、追加学習までしたい人へ👀\n\nUnsloth、⭐️約7.8万。モデルの実行と学習ができるデスクトップアプリ。\n\n何ができるかというと👇\n・ローカルでLLMを実行・追加学習\n・画像生成や音声モデルにも対応\n・GGUF/MLX形式のモデルも扱える\n・Windows/Mac/Linux対応\n\n「AIを使う」から「自分用に育てる」へ。\nローカルAIを使い込みたい人に刺さります。","url":"https://x.com/trendtech33566/status/2113208819232940332","createdAt":"2026-10-22T10:00:18Z","metrics":{"views":6359,"likes":136},"lang":"ja"},{"id":"2113283545959449070","author":"Ben Pierron","handle":"Ben_escrito","text":"🚨 Acabo de encontrar las bibliotecas de prompts más grandes del mundo y son 100 % gratuitas.\n\nFunciona con ChatGPT, Claude, Gemini y casi cualquier modelo.\n\nAquí tienes la lista:\n\n1. https://t.co/zjc0JSeUCE - +1000 prompts desde principiantes hasta expertos\n2. https://t.co/KIkna7JYDr - Miles de prompts listos para consultar y reutilizar\n3. https://t.co/zrNV2TEgaD - Prompts para Claude Code\n4. https://t.co/90M03rHySE - Para crear webs, landing pages y animaciones increíbles.\n5. https://t.co/NrJ8vjVFYH - Prompts para Midjourney\n6. https://t.co/jYEMDFDIZD - prompts de la comunidad","url":"https://x.com/Ben_escrito/status/2113283545959449070","createdAt":"2026-10-22T14:57:14Z","metrics":{"views":37153,"likes":366},"lang":"es"},{"id":"2113299299349975081","author":"Lightspeed","handle":"lightspeedvp","text":"We’re excited to lead @warpsciences’ $215M Series A as they emerge from stealth.\n\nAI can help researchers design promising molecules. Making and testing them still takes time and skilled lab work, limiting how many ideas a team can pursue.\n\nFounded by @kevinweil, @dpatil, @manohar_paluri, and Sol Reisberg, Warp is building the infrastructure to help biotech and pharma companies discover new medicines faster.\n\nThe team brings expert chemists, AI, and robotics together to speed up drug discovery and bring this work back to the US.\n\nCongratulations to Kevin, DJ, Sol, Mano, and the entire team on the raise!\n\nCC: @ravi_lsvp, @guruchahal, Dr. Shelley Chu, Dr. Jonathan Macquitty","url":"https://x.com/lightspeedvp/status/2113299299349975081","createdAt":"2026-10-22T15:59:50Z","metrics":{"views":2534,"likes":26},"lang":"en"},{"id":"2113402806140874900","author":"Big Tech Alert","handle":"BigTechAlert","text":"🆕 @miramurati recently followed @Marjanakoceku\n\n(🤖💡: anyone wants to add something?)","url":"https://x.com/BigTechAlert/status/2113402806140874900","createdAt":"2026-10-22T22:51:08Z","metrics":{"views":2017,"likes":4},"lang":"en"},{"id":"2113311722530345439","author":"Ray Dalio","handle":"RayDalio","text":"Remember that for an organization to be effective, the people who make it up must be aligned on many levels—from what their shared mission is, to how they will treat each other, to a more practical picture of who will do what when to achieve their goals.\n\nYet alignment can never be taken for granted because people are wired so differently. We all see ourselves and the world in our own unique ways, so deciding what’s true and what to do about it takes constant work. #principleoftheday","url":"https://x.com/RayDalio/status/2113311722530345439","createdAt":"2026-10-22T16:49:12Z","metrics":{"views":42819,"likes":269},"lang":"en"},{"id":"2113288458651472230","author":"Keith McCullough","handle":"KeithMcCullough","text":"I will make mistakes. Every. Single. One is #timestamped going back to 2008","url":"https://x.com/KeithMcCullough/status/2113288458651472230","createdAt":"2026-10-22T15:16:46Z","metrics":{"views":5774,"likes":23},"lang":"en"},{"id":"2113420331805212806","author":"FC Barcelona","handle":"FCBarcelona","text":"This team wants more. Not long to go now, culers!","url":"https://x.com/FCBarcelona/status/2113420331805212806","createdAt":"2026-10-23T00:00:47Z","metrics":{"views":230800,"likes":5660},"lang":"en"},{"id":"2113301831824838901","author":"AAM","handle":"KeepitMadeinUSA","text":"More from the @MoveCAFWD California Economic Summit! 🇺🇸\n \nAAM's Brian Lombardozzi joined a panel exploring how clean industrial zones could turn California's climate innovations into good-paying manufacturing jobs.\n \nThe goal? More products Made in CA, not just designed there.\n⬇️ https://t.co/KFJhAvLZaD","url":"https://x.com/KeepitMadeinUSA/status/2113301831824838901","createdAt":"2026-10-22T16:09:54Z","metrics":{"views":197,"likes":4},"lang":"en"},{"id":"2113377383596142929","author":"DigiKey","handle":"digikey","text":"How to build a plant watering system using @Arduino 🌱 \n\nGet started: https://t.co/8VBemPPxUM\n\n#project #arduino","url":"https://x.com/digikey/status/2113377383596142929","createdAt":"2026-10-22T21:10:07Z","metrics":{"views":1136,"likes":4},"lang":"en"},{"id":"2113244036635214036","author":"lucas","handle":"lucas_flatwhite","text":"html-plan 오 이거 좋네요. Claude Code 커뮤니티 플러그인/스킬.\n\nClaude Code 팀 Thariq가 만들었구요.\nhttps://t.co/Mps20MaNha\n\n구현 계획을 긴 마크다운 대신 한 장의 인터랙티브 HTML 페이지로 만들어 줘요.\n\n휙 읽고 결정할 수 있게 설계되어 있어요. UI 목업, 상태, 콜스택, 스키마, 코드 등.. 여러 정보를 시각적으로 보여주는게 좋다요.\n\n레벨 별로 펼쳐서 볼 수도 있는데, 여러 선택과 코멘트 이후에 답변 만들어서 클로드에 붙여넣으면 더 정확한 구현 ㄱㄱ\n\n클로드에게 이걸 던져주세요.\n\nclaude plugin marketplace add anthropics/claude-plugins-community\n\nclaude plugin install html-plan@claude-community","url":"https://x.com/lucas_flatwhite/status/2113244036635214036","createdAt":"2026-10-22T12:20:15Z","metrics":{"views":18685,"likes":249},"lang":"ko"},{"id":"2043266177657679923","author":"田中悠斗＠Fore-","handle":"tanaka_yuto","text":"「AIによる100%成功するハッキング」が現実になったとき、何が終わるのか。\n\n多くの人はまず、\n銀行が危ない、\n暗号資産が危ない、\n個人情報が漏れる、\nくらいで考える。\n\nでも本質はそこではない。\n\n本当に終わるのは、\n「いまの資本主義の前提」\nそのものだと思っている。\n\n資本主義は、金があるから回っているのではない。\n信用があるから回っている。\n\nそしてその信用は、現代ではほとんどが\n「情報として記述された信用」\nに依存している。\n\n残高\n契約\n株主名簿\n登記\n本人確認\n会計帳簿\n監査ログ\n決済履歴\nサプライチェーン情報\n権限管理\n\nこれらが正しい、という前提で\n経済は動いている。\n\n逆に言えば、\nこれらの真正性が失われた瞬間、\n経済は「損をする」のではなく\n「計算できなくなる」。\n\nここが重要。\n\n資本主義は損失には耐えられる。\n不況にも暴落にも破綻にも耐えてきた。\n\nでも、\n何が本物かわからない状態\nには耐えられない。\n\nたとえば銀行で本当に恐ろしいのは、\n預金が盗まれることだけではない。\n\nその送金指示は本物か。\n承認したのは本人か。\n監査ログは正しいか。\nバックアップは無傷か。\n残高は真正か。\n復旧後の状態を誰が正と定義するのか。\n\nこれが全部怪しくなったら、\n銀行は営業できない。\n\n市場も同じ。\n\n株価は、何の価格なのか。\nその株式の所有権は本当にその人のものか。\n企業の財務は正しいのか。\n受注残は本物か。\n監査法人の確認結果は信じられるのか。\n\n全部が揺らぐ。\n\nすると価格形成が壊れる。\n価格形成が壊れると、投資が止まる。\n投資が止まると、将来価値を現在に変換する仕組みが死ぬ。\n\nそれは、資本主義の中枢停止に近い。\n\nつまり、終わるのは単に金融ではない。\n終わるのは、\n\n「遠くの他人を、記録だけで信用できる社会」\n\nだと思う。\n\n近代経済の偉大さは、\n知らない相手とも取引できることだった。\n\n会ったことのない銀行に預金できる。\n行ったことのない国の会社の株を買える。\n顔を知らない相手に送金できる。\nオンラインだけで契約できる。\n\nこれは全部、\n制度化された信用\nがあったから成り立っている。\n\nでも100%侵入されるなら、\nその制度化された信用は維持できない。\n\nそうなると経済はどうなるか。\n\nたぶん、\n局所化する。\n物理化する。\n高摩擦になる。\n遅くなる。\n\nつまり、\n\nグローバル\n匿名\n高速\n自動\n無人\nAPI接続前提\n\nの経済から、\n\n対面\n現物\n閉域\n多重承認\n地域共同体\n物理的制御権\n\nの経済へ戻っていく。\n\nここでよくある誤解がある。\n\n「じゃあ資本主義は完全に終わって原始時代に戻るのか？」\n\nそこまではいかない。\n\nただ、\nいまのような\n“情報の真正性を安く広く前提化できる経済”\nは終わる。\n\n生き残るのは、\n侵入を防げる仕組みではなく、\n侵入される前提で成立する仕組み。\n\nここを間違えるといけない。\n\n防御可能性を前提にした経済から、\n侵入可能性を織り込んだ経済へ移る。\n\nたとえば価値が上がるものは何か。\n\n土地。\n電力。\n食料。\n水。\n物流拠点。\n閉域ネットワーク。\nオフラインで確認できる権利。\n対面でしか成立しない信用。\n複数人立会い。\nアナログ台帳。\n地域共同体の評判。\n実力で秩序を維持する能力。\n\n冷たい言い方をすると、\nコードより先に\n「人間にルールを飲ませる力」\nを持つものが強くなる。\n\n国家\n共同体\n宗教\n地場ネットワーク\n物理インフラ保有者\nそういうものの価値が相対的に上がる。\n\nなぜなら、最後に効くのは\nパスワードではなく、\n現実の拘束力だから。\n\n哲学的に言えば、\n近代は\n「記号が現実を代理できる」\nという信念の上にあった。\n\n通帳の数字が金を表す。\n電子署名が意思を表す。\nIDが本人を表す。\n台帳が所有を表す。\n\nでも100%ハック可能世界では、\nこの代理関係が壊れる。\n\nつまり、\n\n記号が現実を代表できなくなる。\n\nだから人間は、\n記号から現物へ戻る。\nデジタルから物理へ戻る。\n匿名市場から共同体へ戻る。\n\nこれは金融危機ではなく、\n文明の位相転換に近い。\n\nだから自分は、\n「AIが100%成功するハッキング」を\n単なるセキュリティ問題だとは思っていない。\n\nこれは\n資本主義のバグを突く出来事\nだと思っている。\n\nもっと言うと、\n現代資本主義は\n“防御できるはずだ”\nという楽観の上に積まれている。\n\nでももし、\n防御が原理的に成立しないなら、\n社会は設計思想から全部変えないといけない。\n\nそのとき必要なのは、\n守る会社ではない。\n\n侵入前提で\n社会、企業、金融、共同体を\n再設計できる会社。\n\nこれから価値を持つのは、\n「安全です」と言う会社ではなく、\n「破られる前提でも回る構造を作れます」と言える会社だと思う。\n\nたぶん次の時代の本当のテーマは、\nセキュリティではない。\n\nレジリエンスですら少し弱い。\n\nもっと正確に言うなら、\n\n“侵入された後も、\n価値・秩序・信用を維持できる構造”\n\nそれをどう作るか。\n\nここに尽きる。\n\n要するに、\nAIによる100%成功するハッキングが本当に来るなら、\n終わるのはアカウントではない。\nアプリでもない。\n銀行だけでもない。\n\n終わるのは、\n\n「真正な情報があることを前提に成立する、今の資本主義」\n\nだと思う。\n\nそしてそのあと始まるのは、\n侵入前提の経済、\n物理性を取り戻した信用、\n局所共同体と実体資産の再評価、\nそして“攻撃できない構造”を持つ者が勝つ時代。\n\nたぶん、次の資本主義は\nもっと重く、遅く、狭く、強い。\n\nでもその方が本質に近いのかもしれない。","url":"https://x.com/tanaka_yuto/status/2043266177657679923","createdAt":"2026-04-12T09:53:13Z","metrics":{"views":965442,"likes":4653},"lang":"ja"},{"id":"2113239533060043092","author":"PlayStation","handle":"PlayStation","text":"Celebrate 30 years of Lara Croft's PlayStation adventures 🎒\n\nLearn how she's being reimagined in Tomb Raider: Legacy of Atlantis https://t.co/uTdn8rHoxn","url":"https://x.com/PlayStation/status/2113239533060043092","createdAt":"2026-10-22T12:02:21Z","metrics":{"views":919737,"likes":7904},"lang":"en"},{"id":"2113307107822841985","author":"Сarm1ne","handle":"carm1nee","text":"this github repo from anthropic feels like CHEATING in trading\n\nbanks pay analysts six figures to pull comps, build DCFs and rebuild pitch decks at 2am - Anthropic just put 10 AI agents that do that work on GitHub, and anyone can install them in Claude Code\n\nit's called Claude for Financial Services. official Anthropic repo, 40.7k stars, Apache-2.0\n\nfirst understand how it works:\n\n\u003e Pitch Agent: comps, precedents, LBO → a branded pitch deck, end to end\n\u003e Market Researcher: sector → competitive landscape, peer comps, ideas shortlist\n\u003e Earnings Reviewer: earnings call + filings → model update → note draft\n\u003e Model Builder: DCF, LBO, 3-statement, comps - live in Excel\n\u003e + KYC Screener, GL Reconciler, Month-End Closer, Statement Auditor... 10 agents total\n\u003e they plug into FactSet, S\u0026P Capital IQ, Morningstar, LSEG and PitchBook through MCP\n\nhere is how to run it yourself:\n\n1. open Claude Code and add the marketplace:\nclaude plugin marketplace add anthropics/financial-services\n\n2. install the core first - comps, DCF, LBO, 3-statement + the data connectors:\nclaude plugin install financial-analysis@claude-for-financial-services\n\n3. add the agents you want:\nclaude plugin install market-researcher@claude-for-financial-services\nclaude plugin install pitch-agent@claude-for-financial-services\n\n4. type /comps NVDA and watch it pull the peer set and build the table\n\n5. type /dcf NVDA - the model lands in Excel with a WACC x growth sensitivity grid\n\n6. ask Claude to run a Monte Carlo on the valuation. you want a range, not one number\n\n7. /ic-memo turns the whole thing into an investment committee memo\n\n8. everything comes out as a DRAFT for human review. check every number before it goes anywhere\n\ni won't say anything more:","url":"https://x.com/carm1nee/status/2113307107822841985","createdAt":"2026-10-22T16:30:52Z","metrics":{"views":14254,"likes":255},"lang":"en"},{"id":"2113317619789124059","author":"Csaba Kissi","handle":"csaba_kissi","text":"I wish this had come earlier. \n\nI started using PHP 20+ years ago and still use it today. Yesterday's vulnerability is probably the most significant one I can remember.\n\nAI also has its dark side. This helps to get notified faster.","url":"https://x.com/csaba_kissi/status/2113317619789124059","createdAt":"2026-10-22T17:12:38Z","metrics":{"views":1728,"likes":7},"lang":"en"},{"id":"2113110322894475764","author":"Roger波杰克","handle":"roger9949","text":"SpaceXAI 刚一口气上了 146 个 Grok 机器人，全部免费。\n56 个官方任务，90 个市场机器人，一键安装。\n\n我自己用了 Social Media Manager 和 Inbox Manager。\n不用从零教，任务都提前调教好了，装上就能干活。\n\n使用案例：https://t.co/QGnU1MnFZ1\n市场：https://t.co/EWYDQHgOY5","url":"https://x.com/roger9949/status/2113110322894475764","createdAt":"2026-10-22T03:28:55Z","metrics":{"views":20610,"likes":236},"lang":"zh"},{"id":"2113440023508898208","author":"ESPN","handle":"espn","text":"\"Are we going to lay down, roll over, and just let them win? Or are we gonna fight?\" 😤\n\nTyrese Maxey's mentality 🔥","url":"https://x.com/espn/status/2113440023508898208","createdAt":"2026-10-23T01:19:02Z","metrics":{"views":260369,"likes":4760},"lang":"en"},{"id":"2113254305650061615","author":"CNN","handle":"CNN","text":"Premiums are expected to skyrocket for the fourth year in a row, and employees will likely pay more when they receive care, too. The increased costs will put an additional squeeze on Americans' already-tight budgets, adding to the nation's affordability crisis.","url":"https://x.com/CNN/status/2113254305650061615","createdAt":"2026-10-22T13:01:03Z","metrics":{"views":1036412,"likes":541},"lang":"en"},{"id":"2113429284907815287","author":"洛克船长","handle":"slashui","text":"我们进入了「大满足时代」。\n\n刚刷到一个开源项目 earshot，一个人用代码合成了 252 个音效。不是录音，是一行一行代码「写」出来的声音。快门、水滴、风铃、UI 弹出音、转场的「咔」，全都有。\n\n它是让你一个一个听，来决定加在视频的什么地方。给 Agent 用的。AI 连「耳朵」都有了，能听、能评估、还能自己做声音。\n\n以前做个产品发布视频，找音效能找一下午，还得担心版权。现在呢？一个独立开发者顺手就把这事做了，开源，免费，CPU 就能跑。\n\n你想要的，几乎都有人做出来了。你缺的，AI 当场给你造。","url":"https://x.com/slashui/status/2113429284907815287","createdAt":"2026-10-23T00:36:21Z","metrics":{"views":4174,"likes":57},"lang":"zh"},{"id":"2113268133184340033","author":"unusual_whales","handle":"unusual_whales","text":"France’s borrowing costs just hit their highest level since 2002.\n\nIts 10-year bond yield surged to 5.142%, as fears over the country’s debt intensify.\n\nThe gap over Germany’s borrowing costs widened to 1.73 percentage points, the widest since 2011, during the eurozone debt crisis.","url":"https://x.com/unusual_whales/status/2113268133184340033","createdAt":"2026-10-22T13:56:00Z","metrics":{"views":127546,"likes":283},"lang":"en"},{"id":"2113290464623493373","author":"Google Gemi <script>
(() => {
 'use strict';

 const el = (tag,cls,value) => {const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n;};
 function message(title,body){board.replaceChildren();const box=el('section','empty');box.setAttribute('role','status');box.append(el('h2','',title),el('p','',body));board.append(box);}
 let data;
 try{data=JSON.parse($('foryou-data').textContent);if(!Array.isArray(data.accounts)||data.accounts.length<1||data.accounts.some(a=>!a||typeof a.name!=='string'||typeof a.handle!=='string'||!Array.isArray(a.posts)||a.posts.some(p=>!p||typeof p.text!=='string'))||new Set(data.accounts.map(a=>a.handle)).size!==data.accounts.length)throw Error('accounts');}catch{message('データを読み込めませんでした','ページを再読み込みしてください。改善しない場合は、データ更新手順に沿ってHTMLを再生成してください。');const retry=el('button','','再読み込み');retry.onclick=()=>location.reload();const help=el('a','home','データ更新手順');help.href='README.md';board.firstChild.append(retry,help);for(const id of ['account','page','prev','next','ja','original','sort'])$(id).disabled=true;return;}
 // バズ予測は任意。壊れていても空として扱い、ボード本体は必ず表示する。
 let buzz={};
 try{const raw=JSON.parse($('buzz-data').textContent);if(raw&&typeof raw==='object'&&!Array.isArray(raw))buzz=raw;}catch{buzz={};}
 const buzzOf=p=>{const b=buzz[p.id];return b&&typeof b==='object'&&Number.isFinite(b.score)?b:null;};
 const hasBuzz=Object.keys(buzz).length>0;
 const accounts=data.accounts;
 accounts.forEach(a=>$('account').add(new Option(a.name+' / @'+a.handle,a.handle)));
 const params=new URLSearchParams(location.search);
 let query=(params.get('q')||'').trim();$('q').value=query;
 let current=accounts.find(a=>a.handle===String(params.get('account')||'').replace(/^@/,''))||accounts.find(a=>a.handle===read('account'))||accounts[0];
 let lang=(params.get('lang')||read('lang'))==='original'?'original':'ja',page=1;
 let sort=read('sort')==='buzz'?'buzz':'default';
 $('sort').value=sort;$('sort').disabled=!hasBuzz;$('sort').title=hasBuzz?'バズ予測スコアの高い順に並べ替えます':'バズ予測データがありません（node scripts/predict-buzz.mjs で生成）';
 // 通常順は取得順そのまま。バズ予測順は安定ソートなので、同点は取得順を保つ。
 const norm=v=>String(v||'').normalize('NFKC').toLowerCase();
 const matches=p=>{if(!query)return true;const hay=norm([p.text,p.textJa,p.snippet,p.snippet_ja,p.author,p.name,p.handle].join(' '));return norm(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));};
 const posts=()=>{const list=(Array.isArray(current.posts)?current.posts:[]).filter(matches);return sort==='buzz'&&hasBuzz?[...list].sort((a,b)=>((buzzOf(b)?.score??-1)-(buzzOf(a)?.score??-1))):list;};
 const count=()=>Math.max(1,Math.ceil(posts().length/50));
 function restorePage(){const n=Number(read('page-'+current.handle));page=Number.isInteger(n)&&n>0?Math.min(count(),n):1;}
 restorePage();
 {const n=Number(params.get('page'));if(Number.isInteger(n)&&n>0)page=Math.min(count(),n);}
 function syncUrl(){try{const u=new URL(location.href);u.searchParams.set('account',current.handle);u.searchParams.set('page',String(page));u.searchParams.set('lang',lang);if(query)u.searchParams.set('q',query);else u.searchParams.delete('q');history.replaceState(null,'',u);}catch{}}
 function sourceLanguage(p){
  if(p.lang)return p.lang.split('-')[0];
  const text=p.text||'';
  if(/[ぁ-ゖァ-ヺ]/u.test(text))return 'ja';
  // Han-only text can also be Japanese: do not guess Chinese from kanji alone.
  if(/\p{Script=Han}/u.test(text))return 'und';
  return /[a-zA-Z]/.test(text)?'en':'und';
 }
 function translatedText(p){return sourceLanguage(p)==='ja'?p.text:(p.textJa?.trim()||p.snippet_ja?.trim()||'');}
 function displayText(p,ja){return (ja?translatedText(p):'')||p.text||p.snippet||'';}
 function relativeDate(value){const time=new Date(value).getTime();if(!value||!Number.isFinite(time))return '';const minutes=Math.round((time-Date.now())/60000);const unit=Math.abs(minutes)<60?'minute':Math.abs(minutes)<1440?'hour':'day';return new Intl.RelativeTimeFormat(lang==='ja'?'ja':'en',{numeric:'auto'}).format(unit==='minute'?minutes:Math.round(minutes/(unit==='hour'?60:1440)),unit);}
 function layout(){const n=Math.min(50,Math.max(1,posts().length-(page-1)*50));const columns=n<=3?n:n<=9?3:n<=24?4:5;board.style.setProperty('--columns',columns);board.style.setProperty('--rows',Math.ceil(n/columns));board.classList.toggle('roomy',n<=24);}
 function dateLabel(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'en-GB',{dateStyle:'short',timeStyle:'short'}).format(d):null;}
 let detailPost=null,textPage=0,detailLang=lang;
 function showText(){
  const p=detailPost,ja=detailLang==='ja',translated=translatedText(p);
  const chars=Array.from(displayText(p,ja)||(ja?'本文なし（メディア投稿）':'Media post · No text'));
  const size=innerHeight<600?100:180,chunks=[];let chunk='',lines=0,length=0;
  for(const c of chars){chunk+=c;length++;if(c==='\n')lines++;if(length>=size||lines>=4){chunks.push(chunk);chunk='';lines=0;length=0;}}if(chunk||!chunks.length)chunks.push(chunk);
  const total=chunks.length;textPage=Math.min(textPage,total-1);
  $('detail-title').textContent=p.author||p.name||p.handle;
  $('detail-meta').textContent='@'+String(p.handle||'').replace(/^@/,'')+(dateLabel(p.createdAt)?' · '+dateLabel(p.createdAt):'');
  $('detail-text').textContent=chunks[textPage];
  $('detail-range').textContent=(textPage+1)+' / '+total;
  $('text-prev').disabled=textPage===0;$('text-next').disabled=textPage===total-1;
  $('detail-lang').textContent=ja?'原文':'日本語';
  const missing=ja&&!translated&&Boolean(p.text?.trim())&&sourceLanguage(p)!=='ja';
  $('detail-note').textContent=missing?'日本語訳未登録。翻訳ボタンで本文をGoogle翻訳に送って開けます。Safariのページメニューから「日本語に翻訳」も利用できます。':(current.sample?'サンプル投稿です。':(ja&&p.textJa&&sourceLanguage(p)!=='ja'?'日本語訳を表示中。原文も確認できます。':''));
  $('detail-translate').hidden=!missing;
  if(missing)$('detail-translate').href='https://translate.google.com/?sl=auto&tl=ja&text='+encodeURIComponent(p.text)+'&op=translate';
  const url=safeUrl(p.url);$('detail-link').hidden=!url;if(url)$('detail-link').href=url;
  $('detail-link').textContent=ja?'Xで開く ↗':'Open on X ↗';
 }
 function openDetail(p){detailPost=p;textPage=0;detailLang=lang;showText();$('detail').showModal();}
 $('detail-close').onclick=()=>$('detail').close();

 $('detail-lang').onclick=()=>{detailLang=detailLang==='ja'?'original':'ja';textPage=0;showText();};
 window.addEventListener('resize',()=>{if($('detail').open)showText();});
 function safeUrl(value,image=false){try{const u=new URL(value);if(u.protocol!=='https:')return '';if(!image&&!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname))return '';return u.href;}catch{return '';}}
 function picture(src,cls){const url=safeUrl(src,true);if(!url)return null;const img=el('img',cls);img.src=url;img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';return img;}
 const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
